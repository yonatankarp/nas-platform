# Run directly on the NAS, or in the integration sandbox. Same variables, no
# transport.
platform_hosts:
  children:
    nas_hosts:
      hosts:
        nas:
          ansible_connection: local
          # Deliberately has no fallback to PLATFORM_NAS_ADDRESS. This is the
          # identity handed to clients -- Beszel's application URL, Seerr's
          # notification links, Vaultwarden's WebAuthn domain -- so inheriting
          # the SSH transport address hands devices an address they may not use
          # and nothing reports an error. Unset fails preflight loudly instead.
          platform_public_host: >-
            {{ lookup('env', 'PLATFORM_PUBLIC_HOST') }}
          platform_callback_host: >-
            {{ lookup('env', 'PLATFORM_CALLBACK_HOST') |
               default(lookup('env', 'PLATFORM_NAS_ADDRESS'), true) }}
