# Run from a workstation over the LAN or Tailscale.
platform_hosts:
  children:
    nas_hosts:
      hosts:
        nas:
          ansible_connection: ssh
          # undef() makes an unexported variable fail loudly: a bare lookup returns "",
          # and Ansible then silently falls back to the inventory name `nas` and the
          # local login -- possibly the wrong machine.
          ansible_host: >-
            {{ lookup('env', 'PLATFORM_NAS_ADDRESS') |
               default(undef(hint='PLATFORM_NAS_ADDRESS is unset: export the address this run reaches the NAS at'), true) }}
          ansible_user: >-
            {{ lookup('env', 'PLATFORM_NAS_USER') |
               default(undef(hint='PLATFORM_NAS_USER is unset: export the account this run logs into the NAS as'), true) }}
          # No fallback to PLATFORM_NAS_ADDRESS: this is the address handed to clients,
          # so unset fails preflight instead.
          platform_public_host: >-
            {{ lookup('env', 'PLATFORM_PUBLIC_HOST') }}
          platform_callback_host: >-
            {{ lookup('env', 'PLATFORM_CALLBACK_HOST') |
               default(lookup('env', 'PLATFORM_NAS_ADDRESS'), true) }}
