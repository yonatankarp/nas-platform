---
# kapowarr: non-secret settings and the storage this service owns.
# Cross-cutting facts live in main.yml; secrets in vault_kapowarr.yml.

# One-convergence input, false here for the same reason and asserted at this
# layer by tests/contracts/kapowarr-static.rb. Take the single reviewed
# deployment that moves every Kapowarr volume folder onto the declared
# volume_folder_naming with `-e kapowarr_volume_folder_migration_allowed=true`.
# Read `--check --diff` first: it names the current and the intended folder for
# every volume it would move, and Komga needs a Comics rescan once it has run.
kapowarr_volume_folder_migration_allowed: false

nas_storage_kapowarr:
  - path: "{{ nas_docker_root }}/kapowarr/config"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
    media_acquisition_foundation: true
