---
# nextcloud: non-secret settings and the storage this service owns.
# Cross-cutting facts live in main.yml; secrets in vault_nextcloud.yml.

# The switch that deploys Nextcloud (#500). False converges the stack to
# `state: absent`. Kept here rather than in a host group because it is
# nonsecret policy, not a machine fact.
# Install-only settings are consumed once (while no version.php exists), but
# every credential has a runtime path; the one unrecoverable first-converge
# setting is NC_setup_create_db_user -- see services/nextcloud/compose.yml.
nextcloud_deployment_enabled: true

# Literal Host-header addresses beyond the three roles/nextcloud derives: the
# LAN address and the Tailscale address. Anything absent answers HTTP 400
# "untrusted domain"; reconcile_trusted_domains.yml appends these with occ.
nextcloud_additional_trusted_domains:
  - 192.168.0.139
  - 100.102.136.50

nas_storage_nextcloud:
  # Critical: the tree is the user's documents, stored as plain files.
  # The data root is all of /var/www/html: the image keeps config/, data/,
  # custom_apps/ and themes/ there. Ownership is unclaimed: the entrypoint chowns it.
  - path: "{{ nas_docker_root }}/nextcloud/data"
    mode: "0755"
    recovery: critical
  # 0755 because PostgreSQL 18 protects its own versioned PGDATA beneath this
  # mount with 0700, and the parent must stay traversable for the postgres user.
  - path: "{{ nas_docker_root }}/nextcloud/postgres"
    mode: "0755"
    recovery: critical
