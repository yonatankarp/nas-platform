---
# downloaders: non-secret settings and the storage this service owns.
# Cross-cutting facts live in main.yml; secrets in vault_downloaders.yml.

# The Usenet provider's non-secret half; only account and password live in the vault
# (#298). An empty host starts SABnzbd with no server. ssl must stay a boolean:
# SABnzbd stores any other spelling as 0, deploying TLS-off in silence.
media_usenet_provider:
  host: ""
  port: 563
  connections: 8
  ssl: true

# Empty defaults the vault overrides; roles/downloaders refuses a host without
# credentials and credentials without a host.
vault_downloaders_sabnzbd_server_username: ""
vault_downloaders_sabnzbd_server_password: ""

nas_storage_downloaders:
  - path: "{{ nas_docker_root }}/sabnzbd/config"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
    media_acquisition_foundation: true
  - path: "{{ nas_docker_root }}/qbittorrent/config"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
    media_acquisition_foundation: true
