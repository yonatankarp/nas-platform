---
# paperless_ngx: non-secret settings and the storage this service owns.
# Cross-cutting facts live in main.yml; secrets in vault_paperless_ngx.yml.

# Optional Paperless AI integration. Enable only after replacing the documentation
# address with the reachable Ollama endpoint used by the NAS. This is the only home
# for the three values; the role declares them required rather than defaulting them
# a second time where group_vars would always win.
paperless_ai_enabled: false
paperless_ai_llm_endpoint: http://192.0.2.1:11434
paperless_ai_llm_model: gemma3:4b

# Names of the two Paperless mail objects the platform creates. Not secrets, so
# not vault keys (#353). The role finds its objects by these names: renaming one
# creates a fresh object and leaves the old one in Paperless untouched.
paperless_mail_account_name: gmail
paperless_mail_rule_name: inbox

nas_storage_paperless_ngx:
  # PostgreSQL 18 creates a 0700 versioned PGDATA beneath this mount; the parent
  # must stay traversable after the entrypoint drops to the postgres user.
  - path: "{{ nas_docker_root }}/paperless-ngx/postgres"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_docker_root }}/paperless-ngx/redis"
    mode: "0755"
    recovery: cache
  - path: "{{ nas_docker_root }}/paperless-ngx/data"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_docker_root }}/paperless-ngx/cache"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: cache
  - path: "{{ nas_docker_root }}/paperless-ngx/tessdata"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: cache
  - path: "{{ nas_media_root }}/Documents/archive"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_media_root }}/Documents/inbox"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_media_root }}/Documents/export"
    mode: "0755"
    recovery: critical
