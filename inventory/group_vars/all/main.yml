---
# Non-secret facts. Secrets live in vault.yml; see vault.yml.example.

nas_timezone: Europe/Berlin
nas_uid: 1000
nas_gid: 100

# Phase 1 media acquisition stays inert until a host enables Usenet. Adoption
# is a one-convergence escape hatch for the existing Movies and Series trees;
# the role never persists it. Bulk rename remains an operator gate.
media_acquisition_adopt_existing_libraries: false
media_arr_automatic_rename_enabled: false
# A record, not a gate: setting it true states that the Bazarr subtitle handoff
# was reviewed, which is the prerequisite for retiring Jellyfin's Open Subtitles
# plugin in its own change. No role reads it, and it disables nothing by itself;
# see docs/media-acquisition-phase1.md.
media_bazarr_handoff_accepted: false

# One-convergence input, and false is the only value this file may hold: this
# layer outranks roles/komga/defaults/main.yml, so it is the one that decides
# the run, and tests/contracts/komga-static.rb asserts it here as well as there
# (#343). Take the single reviewed deployment that performs a Komga library root
# move with `-e komga_library_root_migration_allowed=true`, which outranks both
# declarations and leaves nothing committed to forget afterwards. The Phase 2
# move -- Comics narrowed from the whole Books share to Books/Comics, with
# Ebooks beside it -- is done, so nothing is pending behind this.
komga_library_root_migration_allowed: false

# One-convergence input, false here for the same reason and asserted at this
# layer by tests/contracts/kapowarr-static.rb. Take the single reviewed
# deployment that moves every Kapowarr volume folder onto the declared
# volume_folder_naming with `-e kapowarr_volume_folder_migration_allowed=true`.
# Read `--check --diff` first: it names the current and the intended folder for
# every volume it would move, and Komga needs a Comics rescan once it has run.
kapowarr_volume_folder_migration_allowed: false

# Providers, indexers, and subtitle preferences are operator-owned policy. An
# empty declaration is valid and starts the applications without unattended
# acquisition or a guessed content-source choice.
media_arr_indexers: []
media_bazarr_languages: []
media_bazarr_providers: []

# The Usenet provider is the same kind of declaration, and it is the one no
# generator can mint: it is a paid third-party subscription. Four of its six
# values are not credentials -- the host is published by the provider, the port
# is 563 or 119, the connection count is a subscription tier and TLS is a
# protocol flag -- so those four are ordinary operator policy and live here,
# typed and readable without the vault password. Only the account name and its
# password are vault-authored, and the `vault_` prefix now promises exactly
# that again (#298).
#
# An empty host is the undeclared state, which is what starts SABnzbd with no
# server on a target that has not bought a subscription -- exactly as an empty
# media_arr_indexers starts Prowlarr with no indexer. The useful consequence is
# that "is a provider declared?" became answerable without decrypting anything,
# which is state rather than secret and is what roles/downloaders now reads.
#
# The port and the connection count are integers and TLS is a boolean because
# these are typed YAML rather than vault strings, and
# roles/downloaders/meta/argument_specs.yml enforces that before any rule is
# consulted. ssl is a boolean rather than 1/0 specifically: SABnzbd parses a
# server flag with `bool_conv(int_conv())` and stores any other spelling as 0,
# so a string here would read as TLS-on and deploy TLS-off in silence. The role
# renders it as an integer at the request.
media_usenet_provider:
  host: ""
  port: 563
  connections: 8
  ssl: true

# The account behind that host, and the only half of the provider that must not
# be disclosed. Carried empty for the same reason the host is: the vault wins
# over these, so authoring the pair there declares the account without removing
# the default. The two halves have to agree -- roles/downloaders refuses a
# declared host with no credentials, and credentials with no host -- because the
# credential contract can no longer see the host to refuse a half-declared
# provider itself.
vault_downloaders_sabnzbd_server_username: ""
vault_downloaders_sabnzbd_server_password: ""

# The shared secret Dozzle presents to the alert relay, and the second key
# declared here so the vault can win over it. It is declared for the opposite
# reason to the two above: those carry an empty default because an undeclared
# Usenet provider is a valid state, this one carries a *working* default because
# no state of the platform wants the relay unauthenticated.
#
# What it is not is a value an operator has to author before the next converge.
# vault_contract declares every credential required and runs before any target
# mutation, so a key that only existed in the vault would fail every converge on
# a host whose vault predates it -- and production_auto_deploy makes the merge
# the converge, on a five-minute tick, with no self-heal available because
# healing means editing an encrypted file nobody but the operator can open. That
# is #327's deadlock reached by a different road, so the default has to exist and
# has to keep existing; it is not a one-release migration aid.
#
# The derivation is a pure function of vault material with a fixed public salt,
# so it is stable across runs. That is load-bearing rather than tidy: the role
# compares the dispatcher's stored `headers` against the rendered ones and
# repairs a difference, so a token that varied per run would repair on every
# converge and idempotence would never hold. The salt separates this value from
# anything else that might hash the same credential.
#
# SHA-256 is preimage-resistant, which is the security property #172 asked for:
# Dozzle persists this token in its `/data` volume and returns it in cleartext
# over its own API, and from the value it stores the ntfy publish token cannot be
# recovered. Rotating vault_ntfy_dozzle_token rotates this in the same pass;
# rotating this one alone means authoring it in the vault, where it wins.
vault_dozzle_alert_relay_token: "{{ ('nas-platform:dozzle-alert-relay:v1:' ~ vault_ntfy_dozzle_token) | hash('sha256') }}"

# The two ntfy topics read by a play that does not run the ntfy role, and the
# reason they are here rather than in roles/ntfy/defaults/main.yml: role defaults
# are play-scoped, and install-production-auto-deploy.yml lists
# production_auto_deploy and image_prune only. In that play the ntfy role's
# defaults do not exist, so a `| default('nas-critical')` in the poller's
# configuration template was not a fallback but the operative value (#345).
#
# That matters because the same two names decide an ACL: the deploy publisher in
# roles/ntfy/defaults/main.yml is granted exactly these topics, so renaming one
# there moved the grant to the new name while the poller and the prune kept
# POSTing to the old one, which the deploy account no longer had. The publishers
# stop on a 403 they swallow, and the only out-of-band alarm channel of a host
# that deploys itself goes quiet without failing a deployment.
#
# This is the only home for the two values. Every role that reads them declares
# them required rather than defaulting them a second time where group_vars would
# always win, so a rename here moves the grant and every publisher together and
# a topic nothing declares fails the run by name.
ntfy_topic: nas-critical
ntfy_deployment_topic: nas-deployment

# The port those publishers reach ntfy on, here for the structural reason above
# and not for its consequence, which is different in kind: a wrong port is a
# refused connection, loud and immediate, where a wrong topic mis-authorises a
# publish that is swallowed. What made it worth moving is that the same two
# templates read it through `| default(2586)` in the same play the ntfy role is
# absent from, so the literal was the operative value there too and a port
# changed here would have left the poller and the prune addressing 2586 (#402).
#
# One declaration is right because every reader addresses the same listener:
# roles/ntfy publishes it as the container's host port, the poller and the prune
# POST to 127.0.0.1 on it, and beszel, dozzle and seerr connect to the callback
# host on it. inventory/group_vars/mac_hosts/main.yml still outranks this for the
# disposable lane, as it does for every other published port.
ntfy_port: 2586

# Optional Paperless AI integration. Enable only after replacing the documentation
# address with the reachable Ollama endpoint used by the NAS. This is the only home
# for the three values; the role declares them required rather than defaulting them
# a second time where group_vars would always win.
paperless_ai_enabled: false
paperless_ai_llm_endpoint: http://192.0.2.1:11434
paperless_ai_llm_model: gemma3:4b

# The names of the two Paperless mail objects this platform creates: the Gmail
# account and the rule that consumes from it. Neither authorises access to
# anything -- they label objects the platform itself POSTs -- so they are
# operator policy here rather than vault keys. The `vault_` prefix promises a
# value is secret-bearing, and on these two it promised something untrue, which
# is the shape #298 corrected for the four Usenet provider values (#353).
#
# Reading them without the vault is what lets the rule-side reconciliation tasks
# drop `no_log` and name the rule they could not match. The role finds its
# objects by these names, so changing one creates a fresh account or rule and
# leaves the previously named one in Paperless untouched.
#
# This is the only home for the pair; roles/paperless_ngx declares them required
# rather than defaulting them a second time where group_vars would always win.
paperless_mail_account_name: gmail
paperless_mail_rule_name: inbox

# Managed Immich user preferences are nonsecret policy. Every encrypted managed
# identity uses this profile unless its email selects another declared profile;
# per-email overrides may replace only leaves in the pinned v3.1.0 schema.
immich_managed_user_preference_profile_default: standard
immich_managed_user_preference_profile_by_email: {}
immich_managed_user_preference_overrides: {}
immich_managed_user_preference_profiles:
  standard:
    albums:
      defaultAssetOrder: desc
    avatar:
      color: primary
    cast:
      gCastEnabled: false
    download:
      archiveSize: 4294967296
      includeEmbeddedVideos: false
    emailNotifications:
      enabled: true
      albumInvite: true
      albumUpdate: true
    folders:
      enabled: false
      sidebarWeb: false
    memories:
      enabled: true
      duration: 5
    people:
      enabled: true
      sidebarWeb: false
      minimumFaces: 3
    purchase:
      showSupportBadge: true
      hideBuyButtonUntil: "2022-02-12T00:00:00.000Z"
    ratings:
      enabled: false
    recentlyAdded:
      sidebarWeb: false
    sharedLinks:
      enabled: true
      sidebarWeb: false
    tags:
      enabled: false
      sidebarWeb: false

# Immutable deployments assembled from the controller checkout. Service roles
# consume only the current release, never a repository checkout on the target.
platform_compose_kind: "{{ platform_kind }}"
platform_manage_linux_ownership: false
platform_release_id: >-
  {{ lookup('pipe', 'git -C ' ~ (playbook_dir | quote) ~ ' rev-parse HEAD') | trim }}
platform_deploy_root: "{{ nas_docker_root }}/nas-platform"
platform_release_dir: "{{ platform_deploy_root }}/releases/{{ platform_release_id }}"
platform_current_dir: "{{ platform_deploy_root }}/current"
platform_runtime_dir: "{{ platform_deploy_root }}/runtime"
platform_media_control_network: >-
  {{ (platform_project_name ~ '-media-control') if platform_project_name | default('') | length > 0 else 'media-control' }}

# Whether Trailarr may fetch a trailer, which is the one outbound request this
# platform makes to a service it does not run.
#
# It is derived rather than declared because the two obvious homes are both
# wrong. A host group may hold machine facts only -- tests/policy_platform_test.rb
# rejects service configuration there by name -- and a literal here would open
# the gate in every disposable lane, since the integration harness converges
# against inventory/local.yml and is therefore a nas_hosts run like any other.
#
# An empty project namespace is what already distinguishes the real platform from
# a disposable copy: every lane sets one so several isolated copies can run side
# by side, and production leaves it empty. tests/contracts/trailarr.sh names the
# container by the same signal. So the rule reads as "only the platform itself
# reaches YouTube", and a sandbox is off by construction rather than by an
# override someone has to remember.
trailarr_monitoring_enabled: >-
  {{ platform_project_name | default('') | length == 0 }}

# The one operator switch that deploys Nextcloud, and it is now on. #500 added
# this stack as the file-sync service replacing Seafile, which ran beside it for
# exactly as long as the comparison needed and was removed by #501. Nextcloud is
# the only file-sync service this platform runs.
#
# The commit that set this true is what put four containers on the NAS -- the
# application, its cron sidecar, a PostgreSQL 18 cluster and a Valkey -- because
# the poller converges the newest released main revision within five minutes.
# Setting it back to false converges them to `state: absent` rather than
# skipping them, so the flag is a deployment decision in both directions.
#
# WHICH CREDENTIALS THE FIRST CONVERGE FIXES, because that is not symmetric and
# it is the question Seafile taught this platform to ask before the first
# converge rather than after it. Nextcloud's entrypoint runs its whole init
# block only while the volume holds no version.php, so every install-only
# variable is consumed once. The difference from Seafile is that most of them
# have a second, runtime path:
#
#   * the database name, user and password are pushed on every read as NC_db*
#     environment overrides, which Nextcloud consults before config.php and
#     never writes back -- so all three stay rotatable by an ordinary converge;
#   * the cache password is rebuilt from the environment on every start, so it
#     stays rotatable too;
#   * the administrator password is the one with no environment path at all --
#     it is a row in oc_users, not a system setting. roles/nextcloud closes that
#     gap by probing whether the vault value still authenticates and running
#     `occ user:resetpassword` only when it does not, so it is rotatable, but by
#     a repair rather than by the container reading a new value;
#   * the trusted domain list is install-only and cannot be an environment
#     override at all, because an array-valued system setting arriving as a
#     string makes every request answer HTTP 400. roles/nextcloud reconciles it
#     with occ for that reason.
#
# So nothing here is permanently fixed by the first converge, which is the whole
# reason the stack is shaped the way it is. The one thing that IS unrecoverable
# is not a credential but a setting: NC_setup_create_db_user must be false on
# the first converge or Nextcloud's installer discards the vault's database
# account and mints an `oc_admin` of its own with a password nothing here can
# reproduce. services/nextcloud/compose.yml carries that in full.
#
# It lives here rather than in a host group for the reason recorded above the
# Seafile switch: both real inventories bind to nas_hosts, the integration
# sandbox is a nas_hosts run like any other, and this is nonsecret policy rather
# than a machine fact.
nextcloud_deployment_enabled: true

# VAULTWARDEN IS ON. #547 landed the stack dark and this is the separate
# deliberate act that turns it on. THIS LINE IS THE WHOLE OF IT:
# roles/vaultwarden/defaults/main.yml stays false, the way nextcloud's does,
# because a role default is the floor under this decision rather
# than a copy of it -- it is what a caller with no inventory gets, and this
# inventory wins on every run any playbook here makes. The comment beside that
# default carries the argument.
#
# WHAT THE FLIP ITSELF DOES, given the dark merge already reached the NAS. Dark,
# the poller had already installed services/vaultwarden/ into the release,
# host_prep had already created {{ nas_docker_root }}/vaultwarden/data at 0700
# because the nas_storage loop is ungated, and the role had already rendered its
# runtime .env -- so the flip's own work is the part that was withheld: one
# image pulled, one container created, this host's port 8086 bound, and one
# Tailscale Serve front placed on 443 in front of it. Setting it back to false converges the Compose project to
# `state: absent` rather than skipping it, so the flag is a deployment decision
# in both directions -- with the one asymmetry tasks/serve.yml records: the
# Serve entry is left in place rather than withdrawn, because that state belongs
# to the tailnet node rather than to this stack.
#
# WHAT WAS TRUE BEFORE IT FLIPPED, since none of it is visible from here.
# Tailscale Serve must front the stack -- Bitwarden clients need a secure
# context and will not talk to plain HTTP -- and Serve only terminates TLS if
# HTTPS certificates are ENABLED FOR THE TAILNET in the Tailscale admin console,
# which no check in this repository can read. roles/vaultwarden/tasks/serve.yml
# places the front and then proves it by using it, so a converge with that
# setting off fails there naming it rather than leaving a server nobody's client
# will reach. `tailscale serve status` on the NAS reported `No serve config` on
# 2026-09-10, so the first converge after this merge is a genuine change.
#
# THAT SETTING WAS CHECKED BEFORE THIS MERGED RATHER THAN ASSUMED: on 2026-09-11
# the operator ran `tailscale cert as6704t-4043.tail4e1ae8.ts.net` on the NAS and
# it wrote a certificate and key, which only succeeds where the tailnet has HTTPS
# certificates enabled. The assertion stays exactly as it is -- it is the only
# thing that would catch the setting being turned off later, and the console is
# not this repository's to read. What it costs if that happens is bounded and
# worth knowing: vaultwarden is the LAST role site.yml converges, so the run
# fails at its final role and deployment_summary does not run. No other service
# is behind it, and the poller repeats that failure every five minutes until the
# setting or the release changes.
#
# THE SECOND HOST PREREQUISITE, WHICH WAS NOT CHECKED BEFORE IT MERGED AND COST
# EXACTLY WHAT THE PARAGRAPH ABOVE PRICES. Placing a Serve front is a privileged
# write: tailscaled accepts serve configuration from root, or from an account
# the host has granted with `sudo tailscale set --operator=<account>`, and
# refuses everyone else with `Access denied: serve config denied`. Reading it is
# not privileged, so nothing before the placement notices. The deploy account
# had neither, and the first converge after this flip died at that command --
# the last role of the last play -- on a bare rc=1, repeating on every
# five-minute tick until the operator ran the grant by hand. The grant is a
# one-time act that persists in tailscaled's own preferences; this repository
# escalates nowhere and so cannot make it, which is exactly why
# roles/vaultwarden/tasks/serve.yml now refuses in those terms and names the
# account to grant rather than leaving the reader to Tailscale's own stderr.
#
# Flipping it is also what makes tests/deployment_gate_coverage_test.rb require
# an integration lane that converges the vaultwarden tag and Mac lifecycle
# coverage. Both land in this change, which is the check working: a gate-on
# service is one CI has deployed and watched come up.
#
# It lives here rather than in a host group for the reason recorded above the
# Nextcloud switch: both real inventories bind to nas_hosts, the integration
# sandbox is a nas_hosts run like any other, and this is nonsecret policy rather
# than a machine fact.
vaultwarden_deployment_enabled: true

# REGISTRATION STAYS OPEN, PERMANENTLY, AND THE TAILNET IS WHY.
#
# The value #547 landed was false, and on a fresh database that is a password
# manager NOBODY CAN GET INTO. Both routes past it are closed by decisions this
# platform has already made and means to keep: there is no admin panel, so there
# is no account to invite anyone from -- /admin answers 200 serving nothing but
# its own "the admin panel is disabled" body, measured against the pinned image
# -- and there is no SMTP, so an invitation could not be delivered even if one
# could be issued. With signups closed, POST /identity/accounts/register answers
# 400, also measured. Those three together are not a door with a difficult key;
# they are a wall.
#
# OPEN-THEN-CLOSE WAS THE ALTERNATIVE AND IT WAS REJECTED. Flip this true,
# register the household's accounts, flip it false again: two merges, two
# five-minute poller ticks, and a window that is open exactly as long either
# way. What it buys is a closed door afterwards; what it costs is that every
# later account -- a new phone, a family member, a rebuild -- needs the same two
# merges again, and that the repository's stated value would then be one a
# household member has to ask an operator to change. The decision is to leave it
# open and say so.
#
# THE PERIMETER IS THE CONTROL, AND IT IS A COMPOSE LINE RATHER THAN A HOPE.
# Vaultwarden is published only through Tailscale Serve on the tailnet: no ADM
# port is opened and no public DNS record exists -- and, the part that actually
# enforces it, services/vaultwarden/compose.yml publishes the container on
# `127.0.0.1:8086` rather than on the wildcard every other service here uses, so
# nothing off this host can reach the listener at all and Serve is the only way
# in. #547's second chunk shipped that as a wildcard while this paragraph
# already claimed otherwise, and the claim was measured FALSE: `docker port`
# reported 0.0.0.0 and [::], and an uninvited POST to
# /identity/accounts/register from a LAN address created the account. The
# binding is what makes the sentence true, so it is not a detail to tidy away
# later -- restoring the wildcard restores an open password manager on the LAN.
#
# With it in place the set of things that can create an account here is exactly
# the set of things on the tailnet -- and that is the cost, in full: ANYTHING
# THAT JOINS THE TAILNET
# LATER CAN CREATE AN ACCOUNT ON THE PASSWORD MANAGER, without asking anyone,
# including a device added for some unrelated reason. An account so created
# holds no existing vault -- master passwords are user-owned and the server
# never learns them, so nobody's items are readable from it -- but it is a
# registered user on this server, and the tailnet admin console is the only
# place that can be prevented.
#
# roles/vaultwarden/tasks/verify.yml knocks on the door on every converge and
# asserts the answer matches THIS declaration in both directions, so flipping
# this line back to false is a change the platform proves rather than merely
# pushes.
vaultwarden_signups_allowed: true

# The addresses Nextcloud answers for beyond the three roles/nextcloud derives.
# platform_public_host already contributes the Tailscale MagicDNS name, so these
# are the two literal addresses a client may put in the Host header instead:
# the LAN address the NAS holds on the local network, and its Tailscale address.
#
# Nextcloud checks the Host header against this list and answers "Access through
# untrusted domain" to anything absent -- an HTTP 400 that reads as a client
# fault and is configuration. It is the one setting no environment override can
# carry: an array arriving as a string makes every request answer 400, so
# roles/nextcloud/tasks/reconcile_trusted_domains.yml appends these with occ.
#
# They are literal addresses rather than names, so they are exactly as durable
# as the DHCP reservation and the Tailscale assignment behind them. A name would
# outlive both; there is none for either today.
nextcloud_additional_trusted_domains:
  - 192.168.0.139
  - 100.102.136.50

# Lowest interpreter the plays are known to work on.
nas_python_minimum: "3.8"

# community.docker.docker_compose_v2 documents this floor.
nas_compose_minimum: "2.18.0"

# Timing policy. How long the platform waits is a platform decision, not a
# per-role one, so the ordinary stack wait and the ordinary readiness poll are
# declared once here and every role reads them. group_vars outranks role
# defaults, so a role cannot quietly redefine these: a service that genuinely
# needs to wait longer declares its own variable in roles/<name>/defaults with
# the reason beside it, which is what makes a deviation visible as a deviation.
# tests/policy_test.rb refuses a bare number for retries, delay, or wait_timeout
# in any role task, so a new literal cannot reintroduce the drift.
#
# platform_readiness_retries x platform_readiness_delay is a minute of patience,
# which is what a container that has already reported healthy needs to answer
# its own API.
platform_compose_wait_timeout: 180
platform_readiness_retries: 20
platform_readiness_delay: 3

# The same policy for the other kind of waiting: a fetch from a third party on
# the public internet. Two tasks do that -- the Hebrew OCR model and the pinned
# yt-dlp build -- and neither had a retry or a timeout, so one blip on
# raw.githubusercontent.com failed the whole converge (#330). On the NAS that
# compounds: scripts/production_auto_deploy.py records the revision as attempted
# and failed and will not retry it without an operator, so a ten-second network
# hiccup stalls automatic deployment.
#
# These are deliberately not the readiness numbers, because they are patience
# for a different thing. Readiness waits on a container here that is already
# healthy and will answer shortly, so it polls often and briefly. A download
# waits on a host somewhere else that is either momentarily unreachable or
# genuinely down, and a short read timeout is what turns the first case into the
# second -- the failure in #330 reported elapsed: 10, which is get_url's own
# default. So the ladder is few attempts with a generous timeout rather than
# many attempts with a tight one. Ansible attempts an until loop `retries` times
# in total, so the worst case is five timeouts and the four delays between them,
# 5 x 30 + 4 x 5 = 170 seconds, before the run is allowed to fail for real.
#
# tests/policy_test.rb requires every get_url task to carry all four keywords
# and refuses a literal for any of them. It enforces the timeout there rather
# than through literal_wait_timeout, because `timeout` is an ordinary module
# argument that several local tasks pass legitimately, while `wait_timeout` only
# ever means this policy.
platform_download_retries: 5
platform_download_delay: 5
platform_download_timeout: 30

# Single declarative storage inventory. host_prep creates ordinary entries and
# validates preservation-only entries, the policy test cross-checks them against
# Compose volume sources, and the recovery class drives the disaster-recovery
# documentation. One source of truth replaces a directory list, a set of chown
# instructions and a hand-maintained recovery table.
#
# recovery: critical  irreplaceable service state, must be backed up
#           user      NAS-managed user files, owned outside this repository
#           cache     regenerable, safe to lose
#
# owner and group are optional. Omitting them creates the directory without
# claiming ownership, which is required under the media root where the NAS owns
# the files and access is granted through its own permission controls.
nas_storage:
  # Audiobookshelf. The database, metadata, and automatic restore backups are
  # critical application state; audiobook files remain NAS-owned user media
  # mounted read-only.
  - path: "{{ nas_docker_root }}/audiobookshelf/config"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_docker_root }}/audiobookshelf/metadata"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_docker_root }}/audiobookshelf/backups"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_media_root }}/Media/Audiobooks"
    mode: "0755"
    recovery: user
    media_acquisition_foundation: true
    media_acquisition_writer: true

  # Komga. Application configuration is critical state; books remain NAS-owned
  # user media and are mounted read-only by the service.
  - path: "{{ nas_docker_root }}/komga/config"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_media_root }}/Books"
    mode: "0755"
    recovery: user
    media_acquisition_foundation: true

  # Shared movie and series libraries remain NAS-owned user media.
  - path: "{{ nas_media_root }}/Media/Movies"
    mode: "0755"
    recovery: user
    media_acquisition_foundation: true
    media_acquisition_writer: true
  - path: "{{ nas_media_root }}/Media/Series"
    mode: "0755"
    recovery: user
    media_acquisition_foundation: true
    media_acquisition_writer: true

  # Inert media acquisition foundation. Transport activation remains explicitly
  # disabled per host class; these paths and service state are prepared so a
  # later role can start without changing the storage or recovery contract.
  - path: "{{ nas_media_root }}/Media/YouTube"
    mode: "0755"
    recovery: user
    media_acquisition_foundation: true
    media_acquisition_writer: true
  - path: "{{ nas_media_root }}/Books/Ebooks"
    mode: "0755"
    recovery: user
    media_acquisition_foundation: true
    media_acquisition_writer: true
  - path: "{{ nas_media_root }}/Books/Comics"
    mode: "0755"
    recovery: user
    media_acquisition_foundation: true
    media_acquisition_writer: true
  # The two acquisition tree roots are declared ahead of their leaves so their
  # mode is owned rather than inherited. `ansible.builtin.file` applies the
  # declared mode to intermediate parents only at the moment it creates them,
  # so a root left undeclared keeps whatever the first converge produced and no
  # later change to a leaf ever revisits it. Declared, they are re-asserted
  # every run. They are not `media_acquisition_writer`: download clients write
  # into `<transport>/<category>`, never into the root.
  - path: "{{ nas_media_root }}/Media/.acquisition"
    mode: "0755"
    recovery: cache
    media_acquisition_foundation: true
  - path: "{{ nas_media_root }}/Books/.acquisition"
    mode: "0755"
    recovery: cache
    media_acquisition_foundation: true
  - path: "{{ nas_media_root }}/Media/.acquisition/usenet/movies"
    mode: "0755"
    recovery: cache
    media_acquisition_foundation: true
    media_acquisition_writer: true
  - path: "{{ nas_media_root }}/Media/.acquisition/usenet/series"
    mode: "0755"
    recovery: cache
    media_acquisition_foundation: true
    media_acquisition_writer: true
  - path: "{{ nas_media_root }}/Media/.acquisition/usenet/audiobooks"
    mode: "0755"
    recovery: cache
    media_acquisition_foundation: true
    media_acquisition_writer: true
  - path: "{{ nas_media_root }}/Media/.acquisition/torrents/movies"
    mode: "0755"
    recovery: cache
    media_acquisition_foundation: true
    media_acquisition_writer: true
  - path: "{{ nas_media_root }}/Media/.acquisition/torrents/series"
    mode: "0755"
    recovery: cache
    media_acquisition_foundation: true
    media_acquisition_writer: true
  - path: "{{ nas_media_root }}/Media/.acquisition/torrents/audiobooks"
    mode: "0755"
    recovery: cache
    media_acquisition_foundation: true
    media_acquisition_writer: true
  - path: "{{ nas_media_root }}/Books/.acquisition/usenet/ebooks"
    mode: "0755"
    recovery: cache
    media_acquisition_foundation: true
    media_acquisition_writer: true
  - path: "{{ nas_media_root }}/Books/.acquisition/usenet/comics"
    mode: "0755"
    recovery: cache
    media_acquisition_foundation: true
    media_acquisition_writer: true
  - path: "{{ nas_media_root }}/Books/.acquisition/torrents/ebooks"
    mode: "0755"
    recovery: cache
    media_acquisition_foundation: true
    media_acquisition_writer: true
  - path: "{{ nas_media_root }}/Books/.acquisition/torrents/comics"
    mode: "0755"
    recovery: cache
    media_acquisition_foundation: true
    media_acquisition_writer: true
  - path: "{{ nas_docker_root }}/radarr/config"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
    media_acquisition_foundation: true
  - path: "{{ nas_docker_root }}/sonarr/config"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
    media_acquisition_foundation: true
  - path: "{{ nas_docker_root }}/prowlarr/config"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
    media_acquisition_foundation: true
  - path: "{{ nas_docker_root }}/bazarr/config"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
    media_acquisition_foundation: true
  - path: "{{ nas_docker_root }}/sabnzbd/config"
