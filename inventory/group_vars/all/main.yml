---
# Non-secret facts. Secrets live in vault.yml; see vault.yml.example.

nas_timezone: Europe/Berlin
nas_uid: 1000
nas_gid: 100

# Phase 1 media acquisition stays inert until a host enables Usenet. Adoption
# is a one-convergence escape hatch for the existing Movies and Series trees;
# the role never persists it. Monitoring and bulk rename remain operator gates.
media_acquisition_adopt_existing_libraries: false
media_arr_automatic_monitoring_enabled: false
media_arr_automatic_rename_enabled: false
media_bazarr_handoff_accepted: false

# Phase 2 one-convergence input. Narrows the Komga Comics library root from the
# whole Books share to Books/Comics and adds Ebooks beside it. Set true for the
# deployment that performs the migration and restored to false immediately
# after, so a later unreviewed root change is refused again. Repeating it once
# the roots match is a no-op; the value only ever unblocks a pending move.
komga_library_root_migration_allowed: true

# Providers, indexers, and subtitle preferences are operator-owned policy. An
# empty declaration is valid and starts the applications without unattended
# acquisition or a guessed content-source choice.
media_arr_indexers: []
media_bazarr_languages: []
media_bazarr_providers: []

# Optional Paperless AI integration. Enable only after replacing the documentation
# address with the reachable Ollama endpoint used by the NAS. This is the only home
# for the three values; the role declares them required rather than defaulting them
# a second time where group_vars would always win.
paperless_ai_enabled: false
paperless_ai_llm_endpoint: http://192.0.2.1:11434
paperless_ai_llm_model: gemma3:4b

# Managed Immich user preferences are nonsecret policy. Every encrypted managed
# identity uses this profile unless its email selects another declared profile;
# per-email overrides may replace only leaves in the pinned v3.1.0 schema.
immich_managed_user_preference_profile_default: standard
immich_managed_user_preference_profile_by_email: {}
immich_managed_user_preference_overrides: {}
immich_managed_user_preference_profiles:
  standard:
    albums:
      defaultAssetOrder: desc
    avatar:
      color: primary
    cast:
      gCastEnabled: false
    download:
      archiveSize: 4294967296
      includeEmbeddedVideos: false
    emailNotifications:
      enabled: true
      albumInvite: true
      albumUpdate: true
    folders:
      enabled: false
      sidebarWeb: false
    memories:
      enabled: true
      duration: 5
    people:
      enabled: true
      sidebarWeb: false
      minimumFaces: 3
    purchase:
      showSupportBadge: true
      hideBuyButtonUntil: "2022-02-12T00:00:00.000Z"
    ratings:
      enabled: false
    recentlyAdded:
      sidebarWeb: false
    sharedLinks:
      enabled: true
      sidebarWeb: false
    tags:
      enabled: false
      sidebarWeb: false

# Immutable deployments assembled from the controller checkout. Service roles
# consume only the current release, never a repository checkout on the target.
platform_compose_kind: "{{ platform_kind }}"
platform_manage_linux_ownership: false
platform_release_id: >-
  {{ lookup('pipe', 'git -C ' ~ (playbook_dir | quote) ~ ' rev-parse HEAD') | trim }}
platform_deploy_root: "{{ nas_docker_root }}/nas-platform"
platform_release_dir: "{{ platform_deploy_root }}/releases/{{ platform_release_id }}"
platform_current_dir: "{{ platform_deploy_root }}/current"
platform_runtime_dir: "{{ platform_deploy_root }}/runtime"
platform_media_control_network: >-
  {{ (platform_project_name ~ '-media-control') if platform_project_name | default('') | length > 0 else 'media-control' }}

# Lowest interpreter the plays are known to work on.
nas_python_minimum: "3.8"

# community.docker.docker_compose_v2 documents this floor.
nas_compose_minimum: "2.18.0"

# Timing policy. How long the platform waits is a platform decision, not a
# per-role one, so the ordinary stack wait and the ordinary readiness poll are
# declared once here and every role reads them. group_vars outranks role
# defaults, so a role cannot quietly redefine these: a service that genuinely
# needs to wait longer declares its own variable in roles/<name>/defaults with
# the reason beside it, which is what makes a deviation visible as a deviation.
# tests/policy_test.rb refuses a bare number for retries, delay, or wait_timeout
# in any role task, so a new literal cannot reintroduce the drift.
#
# platform_readiness_retries x platform_readiness_delay is a minute of patience,
# which is what a container that has already reported healthy needs to answer
# its own API.
platform_compose_wait_timeout: 180
platform_readiness_retries: 20
platform_readiness_delay: 3

# Single declarative storage inventory. host_prep creates ordinary entries and
# validates preservation-only entries, the policy test cross-checks them against
# Compose volume sources, and the recovery class drives the disaster-recovery
# documentation. One source of truth replaces a directory list, a set of chown
# instructions and a hand-maintained recovery table.
#
# recovery: critical  irreplaceable service state, must be backed up
#           user      NAS-managed user files, owned outside this repository
#           cache     regenerable, safe to lose
#
# owner and group are optional. Omitting them creates the directory without
# claiming ownership, which is required under the media root where the NAS owns
# the files and access is granted through its own permission controls.
nas_storage:
  # Audiobookshelf. The database, metadata, and automatic restore backups are
  # critical application state; audiobook files remain NAS-owned user media
  # mounted read-only.
  - path: "{{ nas_docker_root }}/audiobookshelf/config"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_docker_root }}/audiobookshelf/metadata"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_docker_root }}/audiobookshelf/backups"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_media_root }}/Media/Audiobooks"
    mode: "0755"
    recovery: user
    media_acquisition_foundation: true

  # Komga. Application configuration is critical state; books remain NAS-owned
  # user media and are mounted read-only by the service.
  - path: "{{ nas_docker_root }}/komga/config"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_media_root }}/Books"
    mode: "0755"
    recovery: user
    media_acquisition_foundation: true

  # Shared movie and series libraries remain NAS-owned user media.
  - path: "{{ nas_media_root }}/Media/Movies"
    mode: "0755"
    recovery: user
    media_acquisition_foundation: true
    media_acquisition_writer: true
  - path: "{{ nas_media_root }}/Media/Series"
    mode: "0755"
    recovery: user
    media_acquisition_foundation: true
    media_acquisition_writer: true

  # Inert media acquisition foundation. Transport activation remains explicitly
  # disabled per host class; these paths and service state are prepared so a
  # later role can start without changing the storage or recovery contract.
  - path: "{{ nas_media_root }}/Media/YouTube"
    mode: "0755"
    recovery: user
    media_acquisition_foundation: true
  - path: "{{ nas_media_root }}/Books/Ebooks"
    mode: "0755"
    recovery: user
    media_acquisition_foundation: true
  - path: "{{ nas_media_root }}/Books/Comics"
    mode: "0755"
    recovery: user
    media_acquisition_foundation: true
  - path: "{{ nas_media_root }}/Media/.acquisition/usenet/movies"
    mode: "0755"
    recovery: cache
    media_acquisition_foundation: true
    media_acquisition_writer: true
  - path: "{{ nas_media_root }}/Media/.acquisition/usenet/series"
    mode: "0755"
    recovery: cache
    media_acquisition_foundation: true
    media_acquisition_writer: true
  - path: "{{ nas_media_root }}/Media/.acquisition/usenet/audiobooks"
    mode: "0755"
    recovery: cache
    media_acquisition_foundation: true
    media_acquisition_writer: true
  - path: "{{ nas_media_root }}/Media/.acquisition/torrents/movies"
    mode: "0755"
    recovery: cache
    media_acquisition_foundation: true
    media_acquisition_writer: true
  - path: "{{ nas_media_root }}/Media/.acquisition/torrents/series"
    mode: "0755"
    recovery: cache
    media_acquisition_foundation: true
    media_acquisition_writer: true
  - path: "{{ nas_media_root }}/Media/.acquisition/torrents/audiobooks"
    mode: "0755"
    recovery: cache
    media_acquisition_foundation: true
    media_acquisition_writer: true
  - path: "{{ nas_media_root }}/Books/.acquisition/usenet/ebooks"
    mode: "0755"
    recovery: cache
    media_acquisition_foundation: true
    media_acquisition_writer: true
  - path: "{{ nas_media_root }}/Books/.acquisition/usenet/comics"
    mode: "0755"
    recovery: cache
    media_acquisition_foundation: true
    media_acquisition_writer: true
  - path: "{{ nas_media_root }}/Books/.acquisition/torrents/ebooks"
    mode: "0755"
    recovery: cache
    media_acquisition_foundation: true
    media_acquisition_writer: true
  - path: "{{ nas_media_root }}/Books/.acquisition/torrents/comics"
    mode: "0755"
    recovery: cache
    media_acquisition_foundation: true
    media_acquisition_writer: true
  - path: "{{ nas_docker_root }}/radarr/config"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
    media_acquisition_foundation: true
  - path: "{{ nas_docker_root }}/sonarr/config"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
    media_acquisition_foundation: true
  - path: "{{ nas_docker_root }}/prowlarr/config"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
    media_acquisition_foundation: true
  - path: "{{ nas_docker_root }}/bazarr/config"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
    media_acquisition_foundation: true
  - path: "{{ nas_docker_root }}/sabnzbd/config"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
    media_acquisition_foundation: true
  - path: "{{ nas_docker_root }}/qbittorrent/config"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
    media_acquisition_foundation: true
  - path: "{{ nas_docker_root }}/bindery/config"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
    media_acquisition_foundation: true
  - path: "{{ nas_docker_root }}/kapowarr/config"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
    media_acquisition_foundation: true
  - path: "{{ nas_docker_root }}/pinchflat/config"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
    media_acquisition_foundation: true
  - path: "{{ nas_docker_root }}/trailarr/config"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
    media_acquisition_foundation: true
  - path: "{{ nas_docker_root }}/seerr/config"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
    media_acquisition_foundation: true

  # Jellyfin. Its configuration holds users, libraries and playback state and is
  # critical; the transcode cache is regenerable working space. The media tree
  # itself is NAS-owned user media mounted read-only here.
  - path: "{{ nas_docker_root }}/jellyfin/config"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_docker_root }}/jellyfin/cache"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: cache

  # Immich. Ownership is deliberately unclaimed: the pinned images run as root
  # and rewrite ownership of everything they touch, so declaring 1000:100 here
  # would be a claim the first upload falsifies.
  #
  # The originals are irreplaceable photographs that Immich itself writes, which
  # makes them critical service state rather than NAS-managed user media. The
  # derivative trees are redirected off the media volume precisely because they
  # are regenerable and must not be carried by photograph backups.
  - path: "{{ nas_media_root }}/Immich"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_media_root }}/Immich-backups/database"
    mode: "0755"
    recovery: critical
  # 0700 because initdb sets exactly that and PostgreSQL refuses to start on a
  # data directory that is group- or world-readable. Declaring 0755 here made
  # host_prep reset it on every converge, which broke idempotence outright and,
  # on the NAS, would leave a cluster that refuses to start after its next
  # restart. Docker Desktop does not propagate the host mode into the container,
  # so only the NAS would have suffered the second half of that.
  - path: "{{ nas_docker_root }}/immich/postgres"
    mode: "0700"
    recovery: critical
  - path: "{{ nas_docker_root }}/immich/data/profile"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_docker_root }}/immich/data/thumbs"
    mode: "0755"
    recovery: cache
  - path: "{{ nas_docker_root }}/immich/data/encoded-video"
    mode: "0755"
    recovery: cache
  - path: "{{ nas_docker_root }}/immich/data/model-cache"
    mode: "0755"
    recovery: cache

  # Paperless keeps databases, indexes and working state on the Docker volume.
  # The archive, consume inbox and exports are user documents and therefore
  # remain writable on the media volume.
  # PostgreSQL 18 creates its versioned PGDATA directory beneath this mount and
  # protects that directory with mode 0700. Its parent must remain traversable
  # after the entrypoint switches from root to the postgres user.
  - path: "{{ nas_docker_root }}/paperless-ngx/postgres"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_docker_root }}/paperless-ngx/redis"
    mode: "0755"
    recovery: cache
  - path: "{{ nas_docker_root }}/paperless-ngx/data"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_docker_root }}/paperless-ngx/cache"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: cache
  - path: "{{ nas_docker_root }}/paperless-ngx/tessdata"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: cache
  - path: "{{ nas_media_root }}/Documents/archive"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_media_root }}/Documents/inbox"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_media_root }}/Documents/export"
    mode: "0755"
    recovery: critical

  # Dozzle authentication and notification configuration.
  - path: "{{ nas_docker_root }}/dozzle/data"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_docker_root }}/ntfy/data"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_docker_root }}/ntfy/cache"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: cache

  # Beszel. The hub database holds systems, alerts and notification settings.
  - path: "{{ nas_docker_root }}/beszel/hub"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_docker_root }}/beszel/agent"
    mode: "0755"
    recovery: cache
  # Empty bind sources that let Beszel report filesystem capacity without
  # exposing either volume's contents.
  - path: "{{ nas_docker_root }}/beszel/volume1"
    mode: "0755"
    recovery: cache
  - path: "{{ nas_media_root }}/.beszel"
    mode: "0755"
    recovery: cache
