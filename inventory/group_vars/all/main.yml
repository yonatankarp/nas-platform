    mode: "0755"
    recovery: critical
    media_acquisition_foundation: true
  - path: "{{ nas_docker_root }}/qbittorrent/config"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
    media_acquisition_foundation: true
  - path: "{{ nas_docker_root }}/bindery/config"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
    media_acquisition_foundation: true
  - path: "{{ nas_docker_root }}/kapowarr/config"
    owner: "{{ nas_uid }}"
