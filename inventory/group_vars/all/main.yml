  # Jellyfin. Its configuration holds users, libraries and playback state and is
  # critical; the transcode cache is regenerable working space. The media tree
  # itself is NAS-owned user media mounted read-only here.
  - path: "{{ nas_docker_root }}/jellyfin/config"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_docker_root }}/jellyfin/cache"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: cache

  # Immich. Ownership is deliberately unclaimed: the pinned images run as root
  # and rewrite ownership of everything they touch, so declaring 1000:100 here
  # would be a claim the first upload falsifies.
  #
  # The originals are irreplaceable photographs that Immich itself writes, which
  # makes them critical service state rather than NAS-managed user media. The
  # derivative trees are redirected off the media volume precisely because they
  # are regenerable and must not be carried by photograph backups.
  - path: "{{ nas_media_root }}/Immich"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_media_root }}/Immich-backups/database"
    mode: "0755"
    recovery: critical
  # 0700 because initdb sets exactly that and PostgreSQL refuses to start on a
  # data directory that is group- or world-readable. Declaring 0755 here made
  # host_prep reset it on every converge, which broke idempotence outright and,
  # on the NAS, would leave a cluster that refuses to start after its next
  # restart. Docker Desktop does not propagate the host mode into the container,
  # so only the NAS would have suffered the second half of that.
  - path: "{{ nas_docker_root }}/immich/postgres"
    mode: "0700"
    recovery: critical
  - path: "{{ nas_docker_root }}/immich/data/profile"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_docker_root }}/immich/data/thumbs"
    mode: "0755"
    recovery: cache
  - path: "{{ nas_docker_root }}/immich/data/encoded-video"
    mode: "0755"
    recovery: cache
  - path: "{{ nas_docker_root }}/immich/data/model-cache"
    mode: "0755"
    recovery: cache

  # Paperless keeps databases, indexes and working state on the Docker volume.
  # The archive, consume inbox and exports are user documents and therefore
  # remain writable on the media volume.
  # PostgreSQL 18 creates its versioned PGDATA directory beneath this mount and
  # protects that directory with mode 0700. Its parent must remain traversable
  # after the entrypoint switches from root to the postgres user.
  - path: "{{ nas_docker_root }}/paperless-ngx/postgres"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_docker_root }}/paperless-ngx/redis"
    mode: "0755"
    recovery: cache
  - path: "{{ nas_docker_root }}/paperless-ngx/data"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_docker_root }}/paperless-ngx/cache"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: cache
  - path: "{{ nas_docker_root }}/paperless-ngx/tessdata"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: cache
  - path: "{{ nas_media_root }}/Documents/archive"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_media_root }}/Documents/inbox"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_media_root }}/Documents/export"
    mode: "0755"
    recovery: critical

  # Nextcloud, and both roots are critical for the ordinary reason rather than
  # Seafile's. Nextcloud stores files as files: the data tree can be read with
  # ls and cp whatever state the database is in, which is the single biggest
  # reason #500 prefers it. So the tree is critical because it is the user's own
  # documents, and the cluster is critical because it holds the account,
  # sharing and versioning state that says what those documents mean -- neither
  # is regenerable from the other, but unlike Seafile's block store the tree is
  # still readable on its own.
  #
  # The data root is the whole of /var/www/html, not a data subdirectory. The
  # image rsyncs its PHP tree in on every version bump and keeps config/, data/,
  # custom_apps/ and themes/ across that copy, so the installation and the
  # documents share one mount by upstream's design.
  #
  # Ownership is left unclaimed for the reason the Immich and Seafile blocks
  # record: the container's entrypoint chowns these trees to its own service
  # account, and declaring an owner here that the container then falsifies makes
  # host_prep reset it on every converge.
  - path: "{{ nas_docker_root }}/nextcloud/data"
    mode: "0755"
    recovery: critical
  # 0755 rather than the 0700 an exposed database root would otherwise take, and
  # the reason is the one recorded above paperless-ngx/postgres: PostgreSQL 18
  # creates its versioned PGDATA directory beneath this mount and protects that
  # directory with 0700 itself, so the parent must stay traversable after the
  # entrypoint switches from root to the postgres user.
  - path: "{{ nas_docker_root }}/nextcloud/postgres"
    mode: "0755"
    recovery: critical

  # Vaultwarden's whole DATA_FOLDER, and it is the most irreplaceable directory
  # on this platform. It holds db.sqlite3 with its -wal and -shm siblings, which
  # is every vault item, organization and invitation; attachments/ and sends/,
  # which are files nothing else has a copy of; and rsa_key.pem, which signs
  # every session and token this server issues -- lose it and every client is
  # logged out and every API key is void, though the vault items themselves
  # survive because they are encrypted under keys derived from master passwords
  # this server never had.
  #
  # recovery: critical, and with backup parked that means one copy exists by
  # choice. Nothing here can regenerate any of it: the items are
  # client-side-encrypted blobs, so not even the household could reconstruct
  # them from a running client without exporting first.
  #
  # Owned by the platform identity because the container runs as
  # ${NAS_UID}:${NAS_GID} -- the image ships no PUID/PGID handling and no
  # entrypoint that drops privileges, so it writes as whoever it is told to be
  # and cannot repair an ownership it did not get. 0700 rather than 0755: this
  # is the one state tree on the platform whose contents are secret-bearing in
  # the ordinary filesystem sense (rsa_key.pem above), and no other account on
  # the NAS has business traversing it.
  - path: "{{ nas_docker_root }}/vaultwarden/data"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0700"
    recovery: critical

  # Dozzle authentication and notification configuration.
  - path: "{{ nas_docker_root }}/dozzle/data"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_docker_root }}/ntfy/data"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_docker_root }}/ntfy/cache"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: cache

  # Beszel. The hub database holds systems, alerts and notification settings.
  - path: "{{ nas_docker_root }}/beszel/hub"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_docker_root }}/beszel/agent"
    mode: "0755"
    recovery: cache
  # Empty bind sources that let Beszel report filesystem capacity without
  # exposing either volume's contents.
  - path: "{{ nas_docker_root }}/beszel/volume1"
    mode: "0755"
    recovery: cache
  - path: "{{ nas_media_root }}/.beszel"
    mode: "0755"
    recovery: cache
