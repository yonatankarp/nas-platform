---
# immich: non-secret settings and the storage this service owns.
# Cross-cutting facts live in main.yml; secrets in vault_immich.yml.

# Managed Immich user preferences are nonsecret policy. Every encrypted managed
# identity uses this profile unless its email selects another declared profile;
# per-email overrides may replace only leaves in the pinned v3.1.0 schema.
immich_managed_user_preference_profile_default: standard
immich_managed_user_preference_profile_by_email: {}
immich_managed_user_preference_overrides: {}
immich_managed_user_preference_profiles:
  standard:
    albums:
      defaultAssetOrder: desc
    avatar:
      color: primary
    cast:
      gCastEnabled: false
    download:
      archiveSize: 4294967296
      includeEmbeddedVideos: false
    emailNotifications:
      enabled: true
      albumInvite: true
      albumUpdate: true
    folders:
      enabled: false
      sidebarWeb: false
    memories:
      enabled: true
      duration: 5
    people:
      enabled: true
      sidebarWeb: false
      minimumFaces: 3
    purchase:
      showSupportBadge: true
      hideBuyButtonUntil: "2022-02-12T00:00:00.000Z"
    ratings:
      enabled: false
    recentlyAdded:
      sidebarWeb: false
    sharedLinks:
      enabled: true
      sidebarWeb: false
    tags:
      enabled: false
      sidebarWeb: false

# Hourly originals check (#907): max % of sampled originals missing from disk.
# Zero: the rows #907 could not recover were trashed, so any missing original pages.
immich_originals_missing_ceiling_percent: 0

nas_storage_immich:
  # Ownership unclaimed: the images run as root and rewrite it. Originals are
  # irreplaceable (critical); derivatives live off the media volume (cache).
  - path: "{{ nas_media_root }}/Immich"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_media_root }}/Immich-backups/database"
    mode: "0755"
    recovery: critical
  # 0700: PostgreSQL refuses to start on a group/world-readable data directory.
  - path: "{{ nas_docker_root }}/immich/postgres"
    mode: "0700"
    recovery: critical
  - path: "{{ nas_docker_root }}/immich/data/profile"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_docker_root }}/immich/data/thumbs"
    mode: "0755"
    recovery: cache
  - path: "{{ nas_docker_root }}/immich/data/encoded-video"
    mode: "0755"
    recovery: cache
  - path: "{{ nas_docker_root }}/immich/data/model-cache"
    mode: "0755"
    recovery: cache
