---
# vaultwarden: non-secret settings and the storage this service owns.
# Cross-cutting facts live in main.yml; secrets in vault_vaultwarden.yml.

# Vaultwarden is on (#547); the role default stays false as the floor under this.
# False converges the project to `state: absent` but leaves the Serve entry.
# Prerequisites outside this repository: HTTPS certificates enabled for the
# tailnet, and `tailscale set --operator=<deploy account>` so Serve can be
# placed; roles/vaultwarden/tasks/serve.yml refuses naming each.
# Kept here rather than in a host group: nonsecret policy, not a machine fact.
vaultwarden_deployment_enabled: true

# Registration stays open permanently: with no admin panel and no SMTP, a closed
# door leaves a fresh database with no route to a first account.
# The perimeter is services/vaultwarden/compose.yml publishing on 127.0.0.1, so
# Tailscale Serve is the only way in; restoring the wildcard opens the password
# manager to the LAN. The cost: anything that joins the tailnet can register.
# tasks/verify.yml asserts the observed door against this value both ways.
vaultwarden_signups_allowed: true

nas_storage_vaultwarden:
  # DATA_FOLDER: db.sqlite3, attachments/, sends/ and rsa_key.pem. The most
  # irreplaceable directory here (recovery: critical, one copy). 0700 because
  # rsa_key.pem signs every session; owned by the platform identity since the
  # container runs as ${NAS_UID}:${NAS_GID} and cannot fix ownership itself.
  - path: "{{ nas_docker_root }}/vaultwarden/data"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0700"
    recovery: critical
