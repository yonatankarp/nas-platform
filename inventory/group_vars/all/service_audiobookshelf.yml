---
# audiobookshelf: non-secret settings and the storage this service owns.
# Cross-cutting facts live in main.yml; secrets in vault.yml.

nas_storage_audiobookshelf:
  # Audiobookshelf. The database, metadata, and automatic restore backups are
  # critical application state; audiobook files remain NAS-owned user media
  # mounted read-only.
  - path: "{{ nas_docker_root }}/audiobookshelf/config"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_docker_root }}/audiobookshelf/metadata"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
  - path: "{{ nas_docker_root }}/audiobookshelf/backups"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
