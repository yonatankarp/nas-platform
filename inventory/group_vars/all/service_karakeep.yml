---
# karakeep: non-secret settings and the storage this service owns.
# Cross-cutting facts live in main.yml; secrets in vault_karakeep.yml.

# Karakeep is on (#551). The role default stays false as the floor under this.
# False converges the project to `state: absent`; the data root survives.
karakeep_deployment_enabled: true

# Display name only; login identity and password are vault_karakeep_admin_*.
karakeep_admin_name: admin

nas_storage_karakeep:
  # DATA_DIR: db.db (bookmarks, users, API keys, bcrypt hashes), queue.db and
  # archived assets. Nothing else has a copy. Containers run as root.
  - path: "{{ nas_docker_root }}/karakeep/data"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
  # Meilisearch index; Karakeep rebuilds it from its own database.
  - path: "{{ nas_docker_root }}/karakeep/meilisearch"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: cache
