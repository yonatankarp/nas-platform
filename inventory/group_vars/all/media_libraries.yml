---
# Media library roots, shared by construction so no service owns them. recovery: user,
# hence kept apart from the disposable staging tree in media_acquisition.yml.

nas_storage_media_libraries:
  - path: "{{ nas_media_root }}/Media/Audiobooks"
    mode: "0755"
    recovery: user
    media_acquisition_foundation: true
    media_acquisition_writer: true
  - path: "{{ nas_media_root }}/Books"
    mode: "0755"
    recovery: user
    media_acquisition_foundation: true

  # Shared movie and series libraries remain NAS-owned user media.
  - path: "{{ nas_media_root }}/Media/Movies"
    mode: "0755"
    recovery: user
    media_acquisition_foundation: true
    media_acquisition_writer: true
  - path: "{{ nas_media_root }}/Media/Series"
    mode: "0755"
    recovery: user
    media_acquisition_foundation: true
    media_acquisition_writer: true

  # Inert acquisition foundation; transport activation stays disabled per host class.
  - path: "{{ nas_media_root }}/Media/YouTube"
    mode: "0755"
    recovery: user
    media_acquisition_foundation: true
    media_acquisition_writer: true
  - path: "{{ nas_media_root }}/Books/Ebooks"
    mode: "0755"
    recovery: user
    media_acquisition_foundation: true
    media_acquisition_writer: true
  - path: "{{ nas_media_root }}/Books/Comics"
    mode: "0755"
    recovery: user
    media_acquisition_foundation: true
    media_acquisition_writer: true
