---
# trailarr: non-secret settings and the storage this service owns.
# Cross-cutting facts live in main.yml; secrets in vault_trailarr.yml.

# Whether Trailarr may fetch a trailer, which is the one outbound request this
# platform makes to a service it does not run. Derived from the empty project
# namespace (production only) so every sandbox lane is off by construction; a
# host-group literal would open it in every lane.
trailarr_monitoring_enabled: >-
  {{ platform_project_name | default('') | length == 0 }}

nas_storage_trailarr:
  - path: "{{ nas_docker_root }}/trailarr/config"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
    media_acquisition_foundation: true
