---
# pinchflat: non-secret settings and the storage this service owns.
# Cross-cutting facts live in main.yml; secrets in vault.yml.

nas_storage_pinchflat:
  - path: "{{ nas_docker_root }}/pinchflat/config"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
    media_acquisition_foundation: true
  - path: "{{ nas_docker_root }}/pinchflat/bin"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: cache
