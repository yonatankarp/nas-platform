---
# arr: non-secret settings and the storage this service owns.
# Cross-cutting facts live in main.yml; secrets in vault_arr.yml.

# Bulk rename remains an operator gate. The adoption escape hatch lives in
# main.yml (#650) because roles/downloaders reads it too.
media_arr_automatic_rename_enabled: false
# A record, not a gate: true states the Bazarr subtitle handoff was reviewed.
# No role reads it; see docs/media-acquisition-phase1.md.
media_bazarr_handoff_accepted: false

# Providers, indexers and subtitle preferences are operator-owned; empty is valid.
media_arr_indexers: []
media_bazarr_languages: []
media_bazarr_providers: []

nas_storage_arr:
  - path: "{{ nas_docker_root }}/radarr/config"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
    media_acquisition_foundation: true
  - path: "{{ nas_docker_root }}/sonarr/config"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
    media_acquisition_foundation: true
  - path: "{{ nas_docker_root }}/prowlarr/config"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
    media_acquisition_foundation: true
  - path: "{{ nas_docker_root }}/bazarr/config"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
    media_acquisition_foundation: true
