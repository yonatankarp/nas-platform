---
# komga: non-secret settings and the storage this service owns.
# Cross-cutting facts live in main.yml; secrets in vault_komga.yml.

# One-convergence input: false is the only value this file may hold, since it
# outranks the role default (#343). Move the library root once with
# `-e komga_library_root_migration_allowed=true`.
komga_library_root_migration_allowed: false

nas_storage_komga:
  # Configuration is critical; books are NAS-owned media mounted read-only.
  - path: "{{ nas_docker_root }}/komga/config"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    recovery: critical
