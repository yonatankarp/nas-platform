---
# Unavoidable NAS machine facts and capabilities. Portable identities,
# thresholds, and application behavior belong in group_vars/all.
platform_kind: nas
nas_docker_root: /volume1/Docker
nas_media_root: /volume2
media_usenet_enabled: true
media_torrent_enabled: false

# Three of four logical CPUs are available to containers; one stays container-free.
# The budget is that shared cpuset, not a pool divided between the containers.
# Each container's `cpus:` caps it on the shared set, and these workloads sit
# idle almost all the time, so the declared ceilings add up to well over three
# on purpose -- the total is not a number anything has to fit inside. A ceiling
# equal to the budget is deliberate too: whichever container is busy may have
# the whole set. A ceiling wider than the set is the error, because Docker
# clamps it to the cpuset anyway; tests/policy_test.rb rejects one.
platform_container_cpu_budget: 3

platform_render_device_available: true
platform_render_device_path: /dev/dri/renderD128
# S.M.A.R.T. devices, read off the host 2026-09-13. SATA bays are md2 (/volume2);
# the NVMe namespaces are md1 (/volume1). Each needs a slot in
# services/beszel/compose.yml, and roles/beszel refuses a list that does not match.
platform_smart_sata_devices:
  - /dev/sda
  - /dev/sdb
  - /dev/sdc
platform_smart_nvme_namespaces:
  - /dev/nvme0n1
  - /dev/nvme1n1

# Every mdraid array and its /sys/block/<md>/md/degraded on a HEALTHY host,
# which roles/host_prep/tasks/verify_mdraid.yml requires by equality. Read off
# the NAS on 2026-09-13 with `cat /proc/mdstat`:
#   md2   raid5 sdc4 sda4 sdb4           [3/3] [UUU]   SATA bays, /volume2
#   md1   raid1 nvme1n1p4 nvme0n1p4      [2/2] [UU]    NVMe, /volume1 (all service data)
#   md126 raid1 nvme1n1p3 nvme0n1p3      [4/2] [UU__]  ADM system/swap
#   md0   raid1 nvme1n1p2 nvme0n1p2      [4/2] [UU__]  ADM system
# md0 and md126 are ADM's 4-slot RAID1 with only the two NVMe members, so 2 is
# their healthy count, not a fault. Change a count only after reading the host.
#
# ADM's own firmware also notifies the operator when an array degrades. That is
# a parallel channel outside this repository's control and not described here,
# so it does not replace this check.
host_prep_mdraid_arrays:
  md0: 2
  md126: 2
  md1: 0
  md2: 0
platform_beszel_agent_available: true
platform_beszel_agent_kind: intel
beszel_required_telemetry_categories:
  - core
  - disk
  - containers
  - gpu
beszel_require_gpu_telemetry: true
