---
# Unavoidable NAS machine facts and capabilities. Portable identities,
# thresholds, and application behavior belong in group_vars/all.
platform_kind: nas
nas_docker_root: /volume1/Docker
nas_media_root: /volume2
media_usenet_enabled: true
media_torrent_enabled: false

# Three of four logical CPUs are shared by containers; one stays container-free.
# Per-container `cpus:` ceilings may sum past the budget on purpose; a ceiling
# wider than the set is the error (Docker clamps it), and policy_test rejects one.
platform_container_cpu_budget: 3

platform_render_device_available: true
platform_render_device_path: /dev/dri/renderD128
# S.M.A.R.T. devices, read off the host 2026-09-13. SATA bays are md2 (/volume2);
# the NVMe namespaces are md1 (/volume1). Each needs a slot in
# services/beszel/compose.yml, and roles/beszel refuses a list that does not match.
platform_smart_sata_devices:
  - /dev/sda
  - /dev/sdb
  - /dev/sdc
platform_smart_nvme_namespaces:
  - /dev/nvme0n1
  - /dev/nvme1n1

# Every mdraid array and its healthy `degraded` count, required by equality in
# roles/host_prep/tasks/verify_mdraid.yml. md0 and md126 are ADM's 4-slot RAID1
# with two NVMe members, so 2 is healthy. Change a count only after reading the host.
host_prep_mdraid_arrays:
  md0: 2
  md126: 2
  md1: 0
  md2: 0

platform_beszel_agent_available: true
platform_beszel_agent_kind: intel
beszel_required_telemetry_categories:
  - core
  - disk
  - containers
  - gpu
beszel_require_gpu_telemetry: true
