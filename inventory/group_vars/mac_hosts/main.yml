---
# Docker Desktop capabilities. The lifecycle harness exports isolated roots;
# no production data path or published port is inherited from the NAS.
platform_kind: mac
media_usenet_enabled: false
media_torrent_enabled: false
# Docker Desktop already isolates its VM from macOS; use all CPUs assigned to the VM.
platform_container_cpu_budget: 0
platform_project_name: "{{ lookup('env', 'PLATFORM_PROJECT_NAME') }}"
beszel_port: "{{ lookup('env', 'PLATFORM_BESZEL_PORT') | int }}"
ntfy_port: "{{ lookup('env', 'PLATFORM_NTFY_PORT') | int }}"
dozzle_port: "{{ lookup('env', 'PLATFORM_DOZZLE_PORT') | int }}"
audiobookshelf_port: "{{ lookup('env', 'PLATFORM_AUDIOBOOKSHELF_PORT') | int }}"
komga_port: "{{ lookup('env', 'PLATFORM_KOMGA_PORT') | int }}"
jellyfin_port: "{{ lookup('env', 'PLATFORM_JELLYFIN_PORT') | int }}"
immich_port: "{{ lookup('env', 'PLATFORM_IMMICH_PORT') | int }}"
paperless_port: "{{ lookup('env', 'PLATFORM_PAPERLESS_PORT') | int }}"
arr_radarr_port: "{{ lookup('env', 'PLATFORM_RADARR_PORT') | int }}"
arr_sonarr_port: "{{ lookup('env', 'PLATFORM_SONARR_PORT') | int }}"
arr_prowlarr_port: "{{ lookup('env', 'PLATFORM_PROWLARR_PORT') | int }}"
arr_bazarr_port: "{{ lookup('env', 'PLATFORM_BAZARR_PORT') | int }}"
downloaders_sabnzbd_port: "{{ lookup('env', 'PLATFORM_SABNZBD_PORT') | int }}"
bindery_port: "{{ lookup('env', 'PLATFORM_BINDERY_PORT') | int }}"
kapowarr_port: "{{ lookup('env', 'PLATFORM_KAPOWARR_PORT') | int }}"
pinchflat_port: "{{ lookup('env', 'PLATFORM_PINCHFLAT_PORT') | int }}"
trailarr_port: "{{ lookup('env', 'PLATFORM_TRAILARR_PORT') | int }}"
seerr_port: "{{ lookup('env', 'PLATFORM_SEERR_PORT') | int }}"
nas_docker_root: "{{ lookup('env', 'PLATFORM_DOCKER_ROOT') | platform_physical_path }}"
nas_media_root: "{{ lookup('env', 'PLATFORM_MEDIA_ROOT') | platform_physical_path }}"
platform_render_device_available: false
platform_render_device_path: /dev/dri/card0
platform_beszel_agent_available: true
platform_beszel_agent_kind: portable
beszel_required_telemetry_categories:
  - core
  - disk
  - containers
beszel_require_gpu_telemetry: false
