---
# Full first-installation run, identical from local.yml or remote.yml.
- name: Install and configure the NAS platform
  hosts: platform_hosts
  gather_facts: true
  vars:
    # Encrypted artifact for report identity; harnesses override it.
    platform_vault_file: >-
      {{ lookup('env', 'PLATFORM_VAULT_FILE') |
         default(playbook_dir ~ '/inventory/group_vars/all', true) }}

  pre_tasks:
    - name: Validate target Docker module dependencies before target mutation
      ansible.builtin.include_role:
        name: preflight
        tasks_from: target_docker_dependencies
        apply:
          tags: [always]
      tags: [always]

    - name: Validate portable credentials before target mutation
      ansible.builtin.include_role:
        name: vault_contract
        apply:
          tags: [always]
          no_log: true
      tags: [always]

    - name: Validate controller bundle sources before target mutation
      ansible.builtin.include_role:
        name: deployment_bundle
        tasks_from: controller
        apply:
          tags: [always]
      tags: [always]

    - name: Validate controller bundle inputs before target mutation
      ansible.builtin.include_role:
        name: deployment_bundle
        tasks_from: inputs
        apply:
          tags: [always]
      tags: [always]

    - name: Validate target containment before preflight mutation
      ansible.builtin.include_role:
        name: deployment_bundle
        tasks_from: target
        apply:
          tags: [always]
      vars:
        deployment_target_service: ""
        deployment_target_require_current_release: false
        deployment_target_extra_paths: []
      tags: [always]

  roles:
    - role: preflight
      tags: [preflight, always]

    - role: host_prep
      tags: [host_prep, storage, media_acquisition_foundation]

    - role: deployment_bundle
      tags: [deployment_bundle]

    - role: beszel
      tags: [beszel, monitoring]

    - role: dozzle
      tags: [dozzle, monitoring]

    - role: audiobookshelf
      tags: [audiobookshelf, media]

    - role: komga
      tags: [komga, media]

    # Acquisition writers follow the existing read-only library services. Arr
    # converges first because downloader reconciliation consumes its API keys.
    - role: arr
      tags: [arr, media, media_acquisition_phase1]

    - role: downloaders
      tags: [downloaders, media, media_acquisition_phase1]

    # Bindery resolves Prowlarr and SABnzbd at write time, so it follows arr
    # and downloaders.
    - role: bindery
      tags: [bindery, media, media_acquisition_phase2]

    # Kapowarr consumes no platform API; Komga (above) reads its library.
    - role: kapowarr
      tags: [kapowarr, media, media_acquisition_phase2]

    # Pinchflat consumes no platform API; Jellyfin (below) reads its output.
    - role: pinchflat
      tags: [pinchflat, media, media_acquisition_phase2]

    # Trailarr validates its Radarr/Sonarr connections live, so it follows arr.
    - role: trailarr
      tags: [trailarr, media, media_acquisition_phase3]

    - role: jellyfin
      tags: [jellyfin, media]

    # Seerr follows Jellyfin: it bootstraps its owner from Jellyfin in the same
    # play that starts it, because until then anyone reaching port 5055 can
    # claim ownership.
    - role: seerr
      tags: [seerr, media, media_acquisition_phase4]

    - role: immich
      tags: [immich, media]

    - role: paperless_ngx
      tags: [paperless, documents]

    # No `when:` here: the gate lives inside the role so the deployment_bundle
    # re-include and report still run when it is disabled.
    - role: nextcloud
      tags: [nextcloud, documents]

    # Gated inside the role, like Nextcloud above.
    - role: vaultwarden
      tags: [vaultwarden, secrets]

    # Karakeep last: nothing depends on it. Gated inside the role.
    - role: karakeep
      tags: [karakeep, documents]

  post_tasks:
    # After every service, so the summary reports a finished deployment.
    - name: Summarize what the run deployed
      ansible.builtin.include_role:
        name: deployment_bundle
        tasks_from: summary
        apply:
          tags: [deployment_summary]
      tags: [deployment_summary]
