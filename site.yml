---
# Full first-installation run. Identical whether Ansible executes on the NAS
# (inventory/local.yml) or reaches it from a workstation (inventory/remote.yml):
# service and HTTP tasks run on the NAS host, so loopback addresses are correct
# in both modes. Read-only source and Git checks are explicitly delegated to the
# controller checkout.
- name: Install and configure the NAS platform
  hosts: platform_hosts
  gather_facts: true
  vars:
    # Controller-side encrypted artifact used for report identity. Disposable
    # harnesses override this with their encrypted copy.
    platform_vault_file: >-
      {{ lookup('env', 'PLATFORM_VAULT_FILE') |
         default(playbook_dir ~ '/inventory/group_vars/all/vault.yml', true) }}

  pre_tasks:
    - name: Validate target Docker module dependencies before target mutation
      ansible.builtin.include_role:
        name: preflight
        tasks_from: target_docker_dependencies
        apply:
          tags: [always]
      tags: [always]

    - name: Validate portable credentials before target mutation
      ansible.builtin.include_role:
        name: vault_contract
        apply:
          tags: [always]
          no_log: true
      tags: [always]

    - name: Validate controller bundle sources before target mutation
      ansible.builtin.include_role:
        name: deployment_bundle
        tasks_from: controller
        apply:
          tags: [always]
      tags: [always]

    - name: Validate controller bundle inputs before target mutation
      ansible.builtin.include_role:
        name: deployment_bundle
        tasks_from: inputs
        apply:
          tags: [always]
      tags: [always]

    - name: Validate target containment before preflight mutation
      ansible.builtin.include_role:
        name: deployment_bundle
        tasks_from: target
        apply:
          tags: [always]
      vars:
        deployment_target_require_current_release: false
      tags: [always]

  roles:
    - role: preflight
      tags: [preflight, always]

    - role: host_prep
      tags: [host_prep, storage, media_acquisition_foundation]

    - role: deployment_bundle
      tags: [deployment_bundle]

    # ntfy first: it is the sink every monitor publishes to, and its tokens are
    # the values the other services are configured with.
    - role: ntfy
      tags: [ntfy, monitoring]

    - role: beszel
      tags: [beszel, monitoring]

    - role: dozzle
      tags: [dozzle, monitoring]

    - role: audiobookshelf
      tags: [audiobookshelf, media]

    - role: komga
      tags: [komga, media]

    # Acquisition writers follow the existing read-only library services. Arr
    # converges first because downloader reconciliation consumes its API keys.
    - role: arr
      tags: [arr, media, media_acquisition_phase1]

    - role: downloaders
      tags: [downloaders, media, media_acquisition_phase1]

    - role: jellyfin
      tags: [jellyfin, media]

    - role: immich
      tags: [immich, media]

    - role: paperless_ngx
      tags: [paperless, documents]

  post_tasks:
    # After every service, so reaching it means the whole run converged: the
    # summary reports a deployment that actually finished. The per-service
    # reports remain the detail behind it.
    - name: Summarize what the run deployed
      ansible.builtin.include_role:
        name: ntfy
        tasks_from: deployment_summary
        apply:
          tags: [deployment_summary]
      tags: [deployment_summary]
