---
# Verification is intentionally separate from site.yml. Explicit verification
# tags select only read/assert tasks already carried by application roles; no
# host preparation, bundle installation, Compose deployment, or reconciliation
# task can run from this playbook.
- name: Verify the deployed platform without converging it
  hosts: platform_hosts
  gather_facts: false
  vars:
    platform_vault_file: >-
      {{ lookup('env', 'PLATFORM_VAULT_FILE') |
         default(playbook_dir ~ '/inventory/group_vars/all/vault.yml', true) }}
  pre_tasks:
    - name: Validate target Docker module dependencies for verification
      ansible.builtin.include_role:
        name: preflight
        tasks_from: target_docker_dependencies
        apply:
          tags: [always]
      tags: [always]

    - name: Validate portable credentials for verification
      ansible.builtin.include_role:
        name: vault_contract
        apply:
          tags: [always]
          no_log: true
      tags: [always]

    - name: Resolve hardware acceleration for verification
      ansible.builtin.include_role:
        name: preflight
        tasks_from: gpu
        apply:
          tags: [always]
      tags: [always]

    - name: Select the deployed Compose definitions for verification
      ansible.builtin.include_role:
        name: deployment_bundle
        tasks_from: compose_files
        apply:
          tags: [always]
      tags: [always]
  tasks:
    - name: Verify the inert media acquisition foundation
      ansible.builtin.include_role:
        name: host_prep
        tasks_from: verify_media_acquisition
        apply:
          tags: [platform_verify_media_acquisition_foundation]
      tags: [never, platform_verify_media_acquisition_foundation]
  roles:
    - role: ntfy
      tags: [never]
    - role: beszel
      tags: [never]
    - role: dozzle
      tags: [never]
    - role: audiobookshelf
      tags: [never]
    - role: komga
      tags: [never]
    - role: arr
      tags: [never]
    - role: downloaders
      tags: [never]
    - role: bindery
      tags: [never]
    - role: kapowarr
      tags: [never]
    - role: pinchflat
      tags: [never]
    - role: trailarr
      tags: [never]
    - role: jellyfin
      tags: [never]
    - role: seerr
      tags: [never]
    - role: immich
      tags: [never]
    - role: paperless_ngx
      tags: [never]
