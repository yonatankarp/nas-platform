---
- name: Install the NAS production deployment poller and its maintenance schedule
  hosts: platform_hosts
  gather_facts: true
  vars:
    platform_vault_file: >-
      {{ lookup('env', 'PLATFORM_VAULT_FILE') |
         default(playbook_dir ~ '/inventory/group_vars/all/vault.yml', true) }}

  pre_tasks:
    - name: Validate portable credentials before poller installation
      ansible.builtin.include_role:
        name: vault_contract
        apply:
          tags: [always]
          no_log: true
      tags: [always]

    - name: Restrict poller installation to the NAS
      ansible.builtin.assert:
        that:
          - platform_kind == 'nas'
        fail_msg: Production auto-deployment installation is NAS-only.
      tags: [always]

  roles:
    - role: production_auto_deploy

    # Second, and in this playbook rather than one of its own: the prune runs as
    # the same account, from the same crond, publishes with the same token, and
    # serialises on the lock the poller creates. Installing it here also means
    # the poller's own reinstall replays it, so the schedule reconverges on
    # every deployment instead of drifting until someone notices.
    - role: image_prune
