---
# Platform fragments. Anchors are file-local, so each stack carries its own
# copy; tests/policy_test.rb pins the copies equal.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-service-defaults: &service-defaults
  cpuset: ${PLATFORM_CONTAINER_CPUSET:?}
  # Nothing here executes a setuid binary, so refusing escalation costs nothing.
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *default-logging

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 60s

services:
  karakeep:
    <<: *service-defaults
    container_name: karakeep
    # THIS IMAGE MIGRATES ITS OWN STORE (drizzle migrations against /data/db.db on
    # start), so a bump is one-way; renovate.json withholds automerge and
    # roles/image_downgrade_guard refuses a downgrade (#511).
    image: ghcr.io/karakeep-app/karakeep:0.33.2@sha256:b069e4307dec06ea06d16989c6861c30a1ff208568be44ed5fb5d422cd3e950c
    cpus: 2.0
    labels:
      dev.dozzle.group: karakeep
      dev.dozzle.name: karakeep
    depends_on:
      meilisearch:
        condition: service_healthy
      chrome:
        condition: service_healthy
    # The bind address is 127.0.0.1 only while bootstrap.yml opens signups for the
    # single first-administrator request (the first account becomes admin), so
    # nothing on the LAN can take it; otherwise 0.0.0.0 (IPv4 only).
    ports:
      - "${KARAKEEP_PUBLISH_ADDRESS:?}:8087:3000"
    volumes:
      - ${KARAKEEP_DATA_PATH:?}:/data
    environment:
      TZ: ${TZ:?}
      DATA_DIR: /data
      # Must be the address clients type, or NextAuth redirects elsewhere.
      NEXTAUTH_URL: ${KARAKEEP_NEXTAUTH_URL:?}
      # Required: upstream has no default and refuses to start without it.
      NEXTAUTH_SECRET: ${KARAKEEP_NEXTAUTH_SECRET:?}
      MEILI_ADDR: http://meilisearch:7700
      MEILI_MASTER_KEY: ${KARAKEEP_MEILI_MASTER_KEY:?}
      BROWSER_WEB_URL: http://chrome:9222
      DISABLE_SIGNUPS: ${KARAKEEP_DISABLE_SIGNUPS:?}
      DISABLE_NEW_RELEASE_CHECK: "true"
      # AI tagging is OFF deliberately: inference would send every archived page to
      # a third party (#551).
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD-SHELL, "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
    # SQLite db.db and queue.db are recovery: critical; 30s commits the open transaction.
    stop_grace_period: 30s
    networks:
      - browser
      - search

  chrome:
    <<: *service-defaults
    container_name: karakeep-chrome
    # Tags are Chromium versions, not Karakeep versions.
    image: ghcr.io/karakeep-app/karakeep-chrome:151.0.7922.47-r1@sha256:5b19bbb160e9ff60681a3abd97e1c4ec9f64212301410de658c3900ab7ef31e7
    cpus: 1.5
    labels:
      dev.dozzle.group: karakeep
      dev.dozzle.name: chrome
    init: true
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900
    healthcheck:
      <<: *healthcheck-defaults
      # No curl or wget in this image.
      test: [CMD, bash, -c, "exec 3<>/dev/tcp/127.0.0.1/9222"]
    # THIS CONTAINER LOADS WHATEVER URL A USER BOOKMARKS, SO IT IS NEVER ON
    # media-control: a bookmark naming a service there would be fetched from inside.
    # It joins `browser` alone; the network is the containment, not upstream's guard.
    networks:
      - browser

  meilisearch:
    <<: *service-defaults
    container_name: karakeep-meilisearch
    # MEILISEARCH MIGRATES ITS INDEX ONLY WITH MEILI_UPGRADE_DB set (below);
    # without it a newer engine crash-loops on an older index. The upgrade is still
    # one-way, so the downgrade guard and automerge hold apply. Index is recovery: cache.
    image: docker.io/getmeili/meilisearch:v1.54.1@sha256:6f6c72d43008f227a7329422aa723ab5b4929e1fad8e68743062b050c36fb7ad
    cpus: 1.0
    labels:
      dev.dozzle.group: karakeep
      dev.dozzle.name: meilisearch
    volumes:
      - ${KARAKEEP_MEILISEARCH_PATH:?}:/meili_data
    environment:
      TZ: ${TZ:?}
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${KARAKEEP_MEILI_MASTER_KEY:?}
      # Upgrade an older engine's index in place on start; harmless when there is none.
      MEILI_UPGRADE_DB: "true"
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:7700/health || exit 1"]
    # An LMDB write transaction in flight.
    stop_grace_period: 30s
    networks:
      - search

networks:
  # Not internal: chrome needs internet egress to fetch bookmarks.
  browser: {}
  # Internal: the index has no reason to reach anything.
  search:
    internal: true
