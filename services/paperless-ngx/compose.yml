---
# Platform fragments, one copy per stack (anchors are file-local); policy_test
# pins the copies equal. Health-check deviations override only changed fields.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-service-defaults: &service-defaults
  cpuset: ${PLATFORM_CONTAINER_CPUSET:?}
  # Entrypoints drop privileges via setuid(2), which no_new_privs allows.
  # Gotenberg runs Chromium with --no-sandbox, so its setuid helper is never used.
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *default-logging

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 60s

services:
  broker:
    <<: *service-defaults
    container_name: paperless_redis
    image: docker.io/valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    cpus: 0.5
    labels:
      dev.dozzle.group: paperless
      dev.dozzle.name: broker
    volumes:
      - ${PAPERLESS_REDIS_PATH:?}:/data
    environment:
      TZ: ${TZ:?}
    # Valkey writes a final snapshot on SIGTERM; the data is cache, 30s is ample.
    stop_grace_period: 30s
    healthcheck:
      # Not merged from the fragment: no start_period, and the webserver gates
      # its start on this check (10s/5s/12 unrecorded reason).
      test: [CMD, valkey-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 12

  db:
    <<: *service-defaults
    container_name: paperless_postgres
    image: docker.io/library/postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    cpus: 2.0
    labels:
      dev.dozzle.group: paperless
      dev.dozzle.name: db
    volumes:
      - ${PAPERLESS_POSTGRES_PATH:?}:/var/lib/postgresql
    environment:
      TZ: ${TZ:?}
      POSTGRES_DB: ${DB_NAME:?}
      POSTGRES_USER: ${DB_USER:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    # STOPSIGNAL SIGINT is a fast shutdown ending in a checkpoint; recovery:
    # critical data should not come back through WAL recovery.
    stop_grace_period: 1m
    healthcheck:
      # Not merged from the fragment: no start_period, and the webserver gates
      # its start on this check (10s/5s/12 unrecorded reason).
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  webserver:
    <<: *service-defaults
    container_name: paperless_webserver
    image: ghcr.io/paperless-ngx/paperless-ngx:3.3.0@sha256:6b94799bc769a063b3340cc5847402e626d4d91d29a295a8e747f8e9bead4207
    cpus: 3.0
    labels:
      dev.dozzle.group: paperless
      dev.dozzle.name: webserver
    depends_on:
      broker:
        condition: service_healthy
      db:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      tika:
        condition: service_healthy
    # Siblings are reached by service name and publish nothing; only this port
    # is visible on the host.
    ports:
      - "8000:8000"
    volumes:
      - ${PAPERLESS_DATA_PATH:?}:/usr/src/paperless/data
      - ${PAPERLESS_CACHE_PATH:?}:/usr/src/paperless/cache
      - ${PAPERLESS_EXPORT_PATH:?}:/usr/src/paperless/export
      - ${PAPERLESS_TESSDATA_PATH:?}/heb.traineddata:/usr/share/tesseract-ocr/5/tessdata/heb.traineddata:ro
      - ${PAPERLESS_MEDIA_PATH:?}:/usr/src/paperless/media
      - ${PAPERLESS_CONSUME_PATH:?}:/usr/src/paperless/consume
    environment:
      PAPERLESS_AI_ENABLED: ${PAPERLESS_AI_ENABLED:?}
      PAPERLESS_AI_LLM_BACKEND: ollama
      PAPERLESS_AI_LLM_CONTEXT_SIZE: 4096
      PAPERLESS_AI_LLM_ENDPOINT: ${PAPERLESS_AI_LLM_ENDPOINT:?}
      PAPERLESS_AI_LLM_MODEL: ${PAPERLESS_AI_LLM_MODEL:?}
      PAPERLESS_AI_LLM_REQUEST_TIMEOUT: 300
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:?}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:?}
      PAPERLESS_ADMIN_MAIL: ${PAPERLESS_ADMIN_MAIL:?}
      PAPERLESS_BIND_ADDR: 0.0.0.0
      PAPERLESS_CONSUMER_DELETE_DUPLICATES: "true"
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: ${PAPERLESS_DBHOST:?}
      PAPERLESS_DBNAME: ${DB_NAME:?}
      PAPERLESS_DBPASS: ${DB_PASSWORD:?}
      PAPERLESS_DBUSER: ${DB_USER:?}
      PAPERLESS_OCR_LANGUAGE: deu+eng+heb
      PAPERLESS_REDIS: ${PAPERLESS_REDIS:?}
      PAPERLESS_SCRATCH_DIR: /usr/src/paperless/cache
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?}
      PAPERLESS_TASK_WORKERS: ${PAPERLESS_TASK_WORKERS:-2}
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_ENDPOINT: ${PAPERLESS_TIKA_ENDPOINT:?}
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: ${PAPERLESS_GOTENBERG_ENDPOINT:?}
      PAPERLESS_THREADS_PER_WORKER: ${PAPERLESS_THREADS_PER_WORKER:-1}
      PAPERLESS_TIME_ZONE: ${TZ:?}
      TZ: ${TZ:?}
      USERMAP_GID: ${GROUP_ID:?}
      USERMAP_UID: ${USER_ID:?}
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD, curl, --fail, --silent, --show-error, http://localhost:8000]
      retries: 4
      # A fresh database migrates before binding; first NAS boot took over 3 min.
      start_period: 300s
    # Lets the document being consumed reach both archive and Postgres; queued
    # OCR is re-queued in the broker.
    stop_grace_period: 1m

  gotenberg:
    <<: *service-defaults
    container_name: paperless_gotenberg
    image: docker.io/gotenberg/gotenberg:8.37.0@sha256:f29984bd1e226bf1b93ba90af06000afa8b315853e99d27b9aaa41b93f15c769
    cpus: 2.0
    labels:
      dev.dozzle.group: paperless
      dev.dozzle.name: gotenberg
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=file:///tmp/.*
    environment:
      TZ: ${TZ:?}
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD, curl, --fail, --silent, --show-error, http://localhost:3000/health]
      # Deviation kept from before the defaults; reason unrecorded.
      retries: 4
      start_period: 30s

  tika:
    <<: *service-defaults
    container_name: paperless_tika
    image: docker.io/apache/tika:3.3.1.0@sha256:90b7fa1dc018434075fce9e1d9b88b1e3d0ea6979d0cf86e116c79a8073ae973
    cpus: 2.0
    # A JVM sizes its heap from visible memory (a quarter of the host without a
    # limit, #447). With 2g the default 25% gives a 512 MiB heap. A heap stated
    # outright must be at most half the limit (tests/policy_test.rb).
    mem_limit: 2g
    labels:
      dev.dozzle.group: paperless
      dev.dozzle.name: tika
    environment:
      TZ: ${TZ:?}
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD, bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/9998"]
      # Deviation kept from before the defaults; reason unrecorded.
      retries: 4
      start_period: 30s
