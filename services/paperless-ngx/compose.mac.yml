---
services:
  broker:
    container_name: ${PLATFORM_PROJECT_NAME:?}-paperless-redis
    volumes: !override
      - ${PAPERLESS_REDIS_PATH:?}:/data
  db:
    container_name: ${PLATFORM_PROJECT_NAME:?}-paperless-postgres
    volumes: !override
      - ${PAPERLESS_POSTGRES_PATH:?}:/var/lib/postgresql
  webserver:
    container_name: ${PLATFORM_PROJECT_NAME:?}-paperless-webserver
    ports: !override
      - "${PAPERLESS_HOST_PORT:?}:8000"
    volumes: !override
      - ${PAPERLESS_DATA_PATH:?}:/usr/src/paperless/data
      - ${PAPERLESS_CACHE_PATH:?}:/usr/src/paperless/cache
      - ${PAPERLESS_EXPORT_PATH:?}:/usr/src/paperless/export
      - ${PAPERLESS_TESSDATA_PATH:?}/heb.traineddata:/usr/share/tesseract-ocr/5/tessdata/heb.traineddata:ro
      - ${PAPERLESS_MEDIA_PATH:?}:/usr/src/paperless/media
      - ${PAPERLESS_CONSUME_PATH:?}:/usr/src/paperless/consume
  gotenberg:
    container_name: ${PLATFORM_PROJECT_NAME:?}-paperless-gotenberg
  tika:
    container_name: ${PLATFORM_PROJECT_NAME:?}-paperless-tika
