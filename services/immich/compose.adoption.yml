---
services:
  immich-server:
    volumes: !override
      - ${PLATFORM_ADOPTION_ROOT:?}/legacy/immich/data:/data
      - ${PLATFORM_ADOPTION_ROOT:?}/legacy/immich/thumbs:/data/thumbs
      - ${PLATFORM_ADOPTION_ROOT:?}/legacy/immich/encoded-video:/data/encoded-video
      - ${PLATFORM_ADOPTION_ROOT:?}/legacy/immich/profile:/data/profile
      - ${PLATFORM_ADOPTION_ROOT:?}/legacy/immich/backups:/data/backups
  immich-machine-learning:
    volumes: !override
      - ${PLATFORM_ADOPTION_ROOT:?}/legacy/immich/model-cache:/cache
  database:
    volumes: !override
      - ${PLATFORM_ADOPTION_ROOT:?}/legacy/immich/postgres:/var/lib/postgresql/data
      - ${NAS_MEDIA_ROOT:?}/Immich-backups/database:/immich-backups:ro
