---
services:
  immich-server:
    container_name: ${PLATFORM_PROJECT_NAME:?}-immich-server
    # Docker Desktop exposes no /dev/dri, so the NAS render node is removed and
    # transcoding falls back to CPU. The tag is what does the work: Compose
    # appends sequences, so a bare empty list would leave the device in place.
    devices: !override []
    ports: !override
      - "${IMMICH_HOST_PORT:?}:2283"

  # Only container names move. Renaming the Compose services themselves would
  # break machineLearning.urls, which Immich stores as
  # http://immich-machine-learning:3003, and the database and cache hostnames
  # the application resolves.
  immich-machine-learning:
    container_name: ${PLATFORM_PROJECT_NAME:?}-immich-machine-learning

  redis:
    container_name: ${PLATFORM_PROJECT_NAME:?}-immich-redis

  database:
    container_name: ${PLATFORM_PROJECT_NAME:?}-immich-postgres
