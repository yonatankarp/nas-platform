---
services:
  immich-server:
    container_name: ${PLATFORM_PROJECT_NAME:?}-immich-server
    # No /dev/dri on Docker Desktop. `!override` is required: Compose appends sequences.
    devices: !override []
    ports: !override
      - "${IMMICH_HOST_PORT:?}:2283"

  # Only container names move: Immich stores service hostnames such as
  # http://immich-machine-learning:3003.
  immich-machine-learning:
    container_name: ${PLATFORM_PROJECT_NAME:?}-immich-machine-learning

  redis:
    container_name: ${PLATFORM_PROJECT_NAME:?}-immich-redis

  database:
    container_name: ${PLATFORM_PROJECT_NAME:?}-immich-postgres
