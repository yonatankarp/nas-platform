---
# Platform fragments: anchors are file-local; tests/policy_test.rb pins the copies.
# No x-healthcheck-defaults on purpose: these containers run their image's own health
# check, and platform timing would replace it rather than share a default.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-service-defaults: &service-defaults
  cpuset: ${PLATFORM_CONTAINER_CPUSET:?}
  # No `user:` here, so PID 1 is root; no_new_privs keeps it root-in-a-namespace.
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *default-logging

services:
  immich-server:
    <<: *service-defaults
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:v3.2.4@sha256:d317916b28090c33eb36b308464ea391f8b7df1d850fcfea227a39ec879718c2
    cpus: 3.0
    labels:
      dev.dozzle.group: immich
      dev.dozzle.name: immich-server
    ports:
      - "2283:2283"
    # Regenerable derivatives go to the Docker root; the media volume keeps originals only.
    volumes:
      - ${NAS_MEDIA_ROOT:?}/Immich:/data
      - ${NAS_DOCKER_ROOT:?}/immich/data/thumbs:/data/thumbs
      - ${NAS_DOCKER_ROOT:?}/immich/data/encoded-video:/data/encoded-video
      - ${NAS_DOCKER_ROOT:?}/immich/data/profile:/data/profile
      - ${NAS_MEDIA_ROOT:?}/Immich-backups/database:/data/backups
    environment:
      TZ: ${TZ:?}
      DB_DATABASE_NAME: ${IMMICH_DB_NAME:?}
      DB_USERNAME: ${IMMICH_DB_USERNAME:?}
      DB_PASSWORD: ${IMMICH_DB_PASSWORD:?}
    # Immich migrates its own store on start and refuses to go back; both dependencies
    # are gated on health.
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    # Quick Sync on the NAS; overrides without a render node remove it.
    devices:
      - /dev/dri:/dev/dri
    # Enabled explicitly so `compose up --wait` waits for it.
    healthcheck:
      disable: false
    # A minute lets an in-flight upload land in /data and Postgres; derivatives resume.
    stop_grace_period: 1m

  immich-machine-learning:
    <<: *service-defaults
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:v3.2.4@sha256:e16c2f166a8174901959fdf85e2e4c7bd1ebc4b37e0b6655de97c41408a260c4
    cpus: 3.0
    labels:
      dev.dozzle.group: immich
      dev.dozzle.name: immich-machine-learning
    volumes:
      - ${NAS_DOCKER_ROOT:?}/immich/data/model-cache:/cache
    environment:
      TZ: ${TZ:?}
    healthcheck:
      disable: false

  # Named redis because Immich resolves it by service name; the image is Valkey. Its
  # digest may differ from Immich's own compose: refreshes are wanted for base patches.
  redis:
    <<: *service-defaults
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    cpus: 0.5
    labels:
      dev.dozzle.group: immich
      dev.dozzle.name: redis
    healthcheck:
      test: redis-cli ping || exit 1
    # No volume here; 30s is just for a clean exit.
    stop_grace_period: 30s

  # Immich's Postgres: the tag couples the Postgres major, VectorChord and pgvector.
  # Diverges from Immich's compose (#839); recheck POSTGRES_VERSION_RANGE and
  # VECTORCHORD_VERSION_RANGE (server/src/constants.ts) when moving the server pin.
  # A major change is a dump and restore: docs/immich-postgres-17-cutover.md.
  database:
    <<: *service-defaults
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:17-vectorchord1.1.1-pgvector0.8.5@sha256:7f0b786ed5a7a9d26522dacbf46114a76e043a515ce5e020690fc6702e987b72
    cpus: 2.0
    labels:
      dev.dozzle.group: immich
      dev.dozzle.name: database
    environment:
      POSTGRES_DB: ${IMMICH_DB_NAME:?}
      POSTGRES_USER: ${IMMICH_DB_USERNAME:?}
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD:?}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - ${NAS_DOCKER_ROOT:?}/immich/postgres:/var/lib/postgresql/data
      - ${NAS_MEDIA_ROOT:?}/Immich-backups/database:/immich-backups:ro
    shm_size: 128mb
    healthcheck:
      disable: false
    # SIGINT fast shutdown ends in a checkpoint; 2m for the larger buffer cache, since a
    # kill means WAL recovery on recovery: critical data.
    stop_grace_period: 2m
