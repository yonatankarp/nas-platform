---
# Platform fragments. Compose resolves a YAML anchor only inside the file that
# declares it, so every stack carries its own copy; tests/policy_test.rb pins the
# copies equal and records there why cross-file sharing was not taken.
#
# This stack declares no x-healthcheck-defaults on purpose. Three of these four
# containers run the health check their image ships, and the fourth supplies
# only a test; giving any of them the platform's interval, timeout, retries and
# start_period would replace the image's own timing rather than share a default.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-service-defaults: &service-defaults
  cpuset: ${PLATFORM_CONTAINER_CPUSET:?}
  # These containers carry no `user:`, so PID 1 starts as root. Refusing
  # privilege escalation is what keeps that from being a path to more than
  # root-in-a-namespace: nothing in the Immich images executes a setuid binary,
  # and the Postgres entrypoint reaches its own account with setuid(2) as root,
  # which no_new_privs does not restrict.
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *default-logging

services:
  immich-server:
    <<: *service-defaults
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:v3.1.0@sha256:b434cb9287eea1471c9974845914d4dd328c9c2d652e446ed4930f99944f0ceb
    cpus: 3.0
    labels:
      dev.dozzle.group: immich
      dev.dozzle.name: immich-server
    ports:
      - "2283:2283"
    # The nested bind layout of the source deployment. /data holds the
    # originals on the media volume; the regenerable derivatives and the
    # profile tree are redirected onto the Docker root so the media volume
    # carries only irreplaceable photographs.
    volumes:
      - ${NAS_MEDIA_ROOT:?}/Immich:/data
      - ${NAS_DOCKER_ROOT:?}/immich/data/thumbs:/data/thumbs
      - ${NAS_DOCKER_ROOT:?}/immich/data/encoded-video:/data/encoded-video
      - ${NAS_DOCKER_ROOT:?}/immich/data/profile:/data/profile
      - ${NAS_MEDIA_ROOT:?}/Immich-backups/database:/data/backups
    environment:
      TZ: ${TZ:?}
      DB_DATABASE_NAME: ${IMMICH_DB_NAME:?}
      DB_USERNAME: ${IMMICH_DB_USERNAME:?}
      DB_PASSWORD: ${IMMICH_DB_PASSWORD:?}
    # Immich runs its own schema migrations at startup and will corrupt neither
    # an empty nor a half-initialized database, so both dependencies are gated
    # on health rather than on start.
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    # Intel Quick Sync on the NAS. This is the production capability; platforms
    # without a render node remove it in their override and transcode on CPU.
    devices:
      - /dev/dri:/dev/dri
    # The image ships its own health check. Enabling it explicitly is what makes
    # `compose up --wait` mean anything: Compose treats a container with no
    # health check as ready the moment it is running.
    healthcheck:
      disable: false
    # This is the process that writes an original photograph to /data and its
    # row to Postgres. A minute is enough for an upload in flight to land on
    # both sides; it is deliberately not longer, because background transcodes
    # and thumbnail jobs write only regenerable derivatives and pick themselves
    # up again on the next start.
    stop_grace_period: 1m

  immich-machine-learning:
    <<: *service-defaults
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:v3.1.0@sha256:5a0839dc5303cd7215bcd2180a26aed3af41675aefb3e75e5157e9f10ad16e6e
    cpus: 3.0
    labels:
      dev.dozzle.group: immich
      dev.dozzle.name: immich-machine-learning
    # Models are downloaded on first use and are regenerable, so this volume is
    # a cache in the storage inventory rather than service state.
    volumes:
      - ${NAS_DOCKER_ROOT:?}/immich/data/model-cache:/cache
    environment:
      TZ: ${TZ:?}
    healthcheck:
      disable: false

  # Deliberately still named redis: Immich resolves its cache by this Compose
  # service name, and the image behind it is Valkey.
  # Tracks the digest Immich's own compose carries, but it is a cache, not part
  # of the release contract: upstream refreshes this digest independently of
  # Immich releases, so ours need not equal the one the pinned tag shipped with.
  # Digest refreshes are wanted here for base-image patches.
  redis:
    <<: *service-defaults
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    cpus: 0.5
    labels:
      dev.dozzle.group: immich
      dev.dozzle.name: redis
    healthcheck:
      test: redis-cli ping || exit 1
    # Valkey answers SIGTERM by writing one final snapshot before it exits. This
    # one keeps no volume at all — the job queue is rebuilt from Postgres — so
    # the window is only about exiting cleanly rather than being killed with a
    # write open. 30s is well past what that snapshot costs.
    stop_grace_period: 30s

  # Not a version we chose, and not really one version. This is Immich's own
  # purpose-built Postgres image, and the tag encodes three coupled things:
  # Postgres major 14, VectorChord 0.4.3 and pgvecto.rs 0.2.0. Immich's schema
  # depends on those exact extension versions for smart search and face
  # recognition, so the value is dictated by the Immich release, not chosen here.
  #
  # This line, digest included, is copied verbatim from docker/docker-compose.yml
  # at the git tag of the Immich release pinned above, which is the only authority
  # for it. Re-copy it when changing that release; never bump it on its own.
  # immich_restore_expected_postgres_major in roles/immich/defaults/main.yml
  # records the major and must agree.
  database:
    <<: *service-defaults
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    cpus: 2.0
    labels:
      dev.dozzle.group: immich
      dev.dozzle.name: database
    environment:
      POSTGRES_DB: ${IMMICH_DB_NAME:?}
      POSTGRES_USER: ${IMMICH_DB_USERNAME:?}
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD:?}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - ${NAS_DOCKER_ROOT:?}/immich/postgres:/var/lib/postgresql/data
      - ${NAS_MEDIA_ROOT:?}/Immich-backups/database:/immich-backups:ro
    shm_size: 128mb
    healthcheck:
      disable: false
    # The image's STOPSIGNAL is SIGINT, which is a Postgres fast shutdown:
    # connections dropped, open transactions aborted, then a checkpoint that
    # flushes every dirty buffer. Two minutes, twice what the Paperless cluster
    # gets, because this one carries the photo library's VectorChord indexes and
    # a proportionally larger buffer cache to write out. Killed mid-checkpoint
    # the cluster is not lost, but it comes back through WAL recovery — and this
    # directory is recovery: critical.
    stop_grace_period: 2m
