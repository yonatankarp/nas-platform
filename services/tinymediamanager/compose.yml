---
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  tinymediamanager:
    container_name: tinymediamanager
    image: docker.io/tinymediamanager/tinymediamanager:5.3.1@sha256:bada62a398e3aabe7a67b0e081c40dc08ce74aa86b7ba63e0a34a1bf278146a4
    cpuset: ${PLATFORM_CONTAINER_CPUSET:?}
    cpus: 3.0
    labels:
      dev.dozzle.name: tinymediamanager
    network_mode: host
    volumes:
      - ${TINYMEDIAMANAGER_DATA_PATH:?}:/data
      - ${TINYMEDIAMANAGER_MOVIES_PATH:?}:/media/Movies
      - ${TINYMEDIAMANAGER_SERIES_PATH:?}:/media/Series
    environment:
      TZ: ${TZ:?}
      USER_ID: ${USER_ID:?}
      GROUP_ID: ${GROUP_ID:?}
      PASSWORD: ${TINYMEDIAMANAGER_PASSWORD:?}
      ALLOW_DIRECT_VNC: "false"
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true
    # Without this, the container has no healthcheck, so `compose up --wait`
    # returns as soon as it is running and callers race the application. The
    # bound API port is the readiness signal: the application binds it only
    # after its X session is up, and the image ships no HTTP client that
    # treats the API's unauthenticated 403 as success. The port is the
    # container side of the mapping and so is the same on every platform.
    healthcheck:
      test: [CMD-SHELL, "ss -ltn | grep -q ':7878 '"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped
    logging: *default-logging
