---
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  tinymediamanager:
    container_name: tinymediamanager
    image: docker.io/tinymediamanager/tinymediamanager:5.3.0@sha256:e33769b278eefbec646b659342a86a7831869c5a3fa3cca97e7c47f518da4d89
    network_mode: host
    volumes:
      - ${TINYMEDIAMANAGER_DATA_PATH:?}:/data
      - ${TINYMEDIAMANAGER_MOVIES_PATH:?}:/media/Movies
      - ${TINYMEDIAMANAGER_SERIES_PATH:?}:/media/Series
    environment:
      TZ: ${TZ:?}
      USER_ID: ${USER_ID:?}
      GROUP_ID: ${GROUP_ID:?}
      PASSWORD: ${TINYMEDIAMANAGER_PASSWORD:?}
      ALLOW_DIRECT_VNC: "false"
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true
    restart: unless-stopped
    logging: *default-logging
