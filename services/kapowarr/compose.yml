---
# Platform fragments; anchors are file-local, so each stack carries a copy
# (tests/policy_test.rb pins them equal).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-service-defaults: &service-defaults
  cpuset: ${PLATFORM_CONTAINER_CPUSET:?}
  # gosu's re-exec is a setuid(2) call by root, so no-new-privileges keeps the remap intact.
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *default-logging

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 60s

services:
  # Owns Books/Comics and its SQLite store; calls no other service, so no media-control.
  kapowarr:
    <<: *service-defaults
    container_name: kapowarr
    # THIS IMAGE MIGRATES ITS OWN STORE on start, one-way (v1.3.2 took db 45 to 51, #671).
    # Automerge is withheld and roles/image_downgrade_guard refuses an older pin.
    image: docker.io/mrcas/kapowarr:v1.3.2@sha256:cd3f004caff59636dde73b06df5b2f8068b485b47ff5fe82f6129562c0f2ac3b
    cpus: 1.0
    labels:
      dev.dozzle.name: kapowarr
      # Carried patch's sha256 (#696): a changed label recreates the container, a changed
      # bind source alone does not.
      dev.nas-platform.kapowarr.task-patch-sha256: ${KAPOWARR_TASK_PATCH_SHA256:?}
    ports:
      - "5656:5656"
    # One bind mount under /data/books so an import is a rename, not a copy (rename(2)
    # cannot cross mounts); the old /comics paths are migrated by roles/kapowarr.
    # The third mount is a carried patch (#696): tasks.py guards two thread joins that made
    # shutdown raise; tests/contracts/kapowarr-static.rb ties it to the image pin above.
    volumes:
      - ${KAPOWARR_CONFIG_PATH:?}:/app/db
      - ${KAPOWARR_BOOKS_PATH:?}:/data/books
      - ${PLATFORM_CURRENT_DIR:?}/services/kapowarr/tasks.py:/app/backend/features/tasks.py:ro
    environment:
      TZ: ${TZ:?}
      # The entrypoint remaps its account to this pair and re-execs via gosu.
      PUID: ${NAS_UID:?}
      PGID: ${NAS_GID:?}
    healthcheck:
      <<: *healthcheck-defaults
      # The image has neither curl nor wget, so Python is the probe.
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:5656/api/public', timeout=5)"
    # Stop grace: with the patch, shutdown completes in about 5s (waitress's floor), so 10s
    # covers it (#696). SQLite stays crash-safe if a stop is cut short.
    stop_grace_period: 10s
