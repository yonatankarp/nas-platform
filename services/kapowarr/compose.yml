---
# Platform fragments. Compose resolves a YAML anchor only inside the file that
# declares it, so every stack carries its own copy; tests/policy_test.rb pins the
# copies equal and records there why cross-file sharing was not taken. A
# container needing different health-check timing overrides only the fields it
# changes, so a deviation reads as a deviation.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-service-defaults: &service-defaults
  cpuset: ${PLATFORM_CONTAINER_CPUSET:?}
  # The entrypoint's gosu re-exec is a setuid(2) call made by root, not the
  # execution of a setuid binary, so refusing privilege escalation leaves the
  # PUID/PGID remap below intact.
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *default-logging

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 60s

services:
  # Kapowarr owns the Books/Comics library and its own SQLite database. In this
  # slice it calls no other platform service — no Prowlarr indexer and no
  # download client are declared for it — so it stays off the media-control
  # network, the same reason Komga and Pinchflat do. Komga keeps reading the
  # library from disk.
  kapowarr:
    <<: *service-defaults
    container_name: kapowarr
    image: docker.io/mrcas/kapowarr:v1.3.1@sha256:d455797e4f2c5b1a8ccc5ce05c427f1af2179451bb1af195ca3fa8c3e928623b
    cpus: 1.0
    labels:
      dev.dozzle.name: kapowarr
    ports:
      - "5656:5656"
    # The comics library and the staging directory that feeds it arrive inside
    # one bind mount of their common host share, which is what makes an import a
    # rename: rename(2) refuses to cross a mount boundary even when both sides
    # are the same filesystem, so the two mounts this replaces —
    # ${KAPOWARR_DOWNLOADS_PATH:?}:/app/temp_downloads beside
    # ${KAPOWARR_COMICS_PATH:?}:/comics — turned every import into a full byte
    # copy plus unlink, with transient double occupancy on a 4.19 TB library, and
    # put hardlinking out of reach. Bindery took the same shape for the same
    # reason in #300, and Radarr and Sonarr have mounted ${MEDIA_ROOT:?}/Media
    # this way since Phase 1.
    #
    # Unlike Bindery's, Kapowarr's container paths could not be preserved across
    # that change: its library was at /comics and its staging at
    # /app/temp_downloads, neither of which has a common parent that is not `/`.
    # Both therefore move under /data/books, and Kapowarr stores both — the root
    # folder, an absolute folder per volume, and the download_folder setting — so
    # the move is a stored-path migration rather than a remount. roles/kapowarr
    # refuses to converge a deployment still holding the old prefix.
    #
    # One quieter consequence: the image's entrypoint chowns /app/db, /app/logs
    # and /app/temp_downloads to PUID:PGID on every start, and the last of those
    # is now an empty directory inside the image rather than the host staging
    # tree. Kapowarr no longer rewrites ownership on a directory the NAS owns,
    # which is the same arrangement SABnzbd's staging siblings have always had:
    # host_prep creates them and the platform identity writes into them.
    volumes:
      - ${KAPOWARR_CONFIG_PATH:?}:/app/db
      - ${KAPOWARR_BOOKS_PATH:?}:/data/books
    environment:
      TZ: ${TZ:?}
      # The entrypoint starts as root, remaps its own account to this pair and
      # re-executes through gosu, so the platform identity arrives under the
      # linuxserver.io names rather than through `user:`.
      PUID: ${NAS_UID:?}
      PGID: ${NAS_GID:?}
    healthcheck:
      <<: *healthcheck-defaults
      # The runtime image is python:3.13-slim and ships neither curl nor wget,
      # so the interpreter Kapowarr itself runs on is the health probe.
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:5656/api/public', timeout=5)"
    # /app/db is the SQLite database of the whole comic library and is recovery:
    # critical. 30s commits the open transaction; an interrupted download is
    # already retried from the queue that database holds.
    stop_grace_period: 30s
