---
# Platform fragments, one copy per stack (anchors are file-local); policy_test
# pins the copies equal. Health-check deviations override only changed fields.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-service-defaults: &service-defaults
  cpuset: ${PLATFORM_CONTAINER_CPUSET:?}
  # Entrypoints reach PUID/PGID via setuid(2), which no_new_privs allows; nothing
  # here executes a setuid binary.
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *default-logging
  networks:
    - default
    - media-control

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 60s

services:
  sabnzbd:
    <<: *service-defaults
    container_name: sabnzbd
    image: lscr.io/linuxserver/sabnzbd:5.1.3@sha256:4f7ee6c53834bc336365bd0a7c35f4fc870156a72d33a334753010258aa077a4
    cpus: 2.0
    labels:
      dev.dozzle.group: downloaders
      dev.dozzle.name: sabnzbd
      # Docker resolves the bind source once at container start, so the gate's
      # sha256 makes editing it a changed definition and forces a recreate (#810).
      dev.nas-platform.downloaders.clamav-gate-sha256: ${SABNZBD_CLAMAV_GATE_SHA256:?}
    ports:
      - "8085:8080"
    volumes:
      - ${SABNZBD_CONFIG_PATH:?}:/config
      - ${MEDIA_ACQUISITION_PATH:?}:/data/media/.acquisition
      - ${BOOKS_ACQUISITION_PATH:?}:/data/books/.acquisition
      # Mounted from the immutable release; misc.script_dir and
      # misc.script_can_fail are reconciled in roles/downloaders/defaults/main.yml.
      - ${PLATFORM_CURRENT_DIR:?}/services/downloaders/clamav_gate.py:/scripts/clamav_gate.py:ro
    environment:
      PUID: ${NAS_UID:?}
      PGID: ${NAS_GID:?}
      UMASK: "022"
      TZ: ${TZ:?}
      SABNZBD_API_KEY: ${SABNZBD_API_KEY:?}
      # The gate pages when it imports a job it could not scan; the environment
      # is a post-processing script's only route to Pushover.
      PUSHOVER_API_URL: ${PUSHOVER_API_URL:?}
      PUSHOVER_ALERTS_TOKEN: ${PUSHOVER_ALERTS_TOKEN:?}
      PUSHOVER_USER_KEY: ${PUSHOVER_USER_KEY:?}
    healthcheck:
      <<: *healthcheck-defaults
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error
          "http://127.0.0.1:8080/api?mode=version&output=json&apikey=$${SABNZBD_API_KEY}"
          >/dev/null
    # A minute to pause the download and write the queue, so a restart resumes
    # rather than re-fetches. Unpackerr needs no window.
    stop_grace_period: 1m

  # A daemon rather than a clamscan per job: the ~1.4GB signature set is parsed
  # once and held resident (~1.5-2GB RSS). No mem_limit on purpose: an OOM kill
  # mid-scan reads as "scanner unavailable" and fails the download. The bundled
  # image (not `_base`) can scan before freshclam finishes its first fetch.
  clamav:
    <<: *service-defaults
    container_name: clamav
    image: docker.io/clamav/clamav:1.5.4@sha256:ebec5bc138401b36ae987caa1a3fa3c3b2a21ed3d51f0bfa5852825e663e67b0
    # The ceiling is the point: a full-volume ADM clamscan holding a core kept the
    # temperature alert ringing for 22 hours.
    cpus: 1.0
    labels:
      dev.dozzle.group: downloaders
      dev.dozzle.name: clamav
    # Paths identical to SABnzbd's on purpose: clamd resolves the gate's path
    # string in its own namespace. Change these with their twins above.
    volumes:
      - ${MEDIA_ACQUISITION_PATH:?}:/data/media/.acquisition:ro
      - ${BOOKS_ACQUISITION_PATH:?}:/data/books/.acquisition:ro
    environment:
      TZ: ${TZ:?}
    # No PUID/PGID or `user:`: freshclam runs as the image's own `clamav` user
    # and a foreign uid could not refresh the database. Read-only mounts bound it.
    healthcheck:
      <<: *healthcheck-defaults
      # clamd accepts no connection until the signatures are parsed, so PING/PONG
      # is exactly the readiness the gate needs.
      test: [CMD-SHELL, "clamdscan --ping 1"]
      # Parsing takes minutes. Longer than the 180s Compose wait on purpose: a
      # starting container is not recreated by container_health, so a slow first
      # converge fails the wait and the next tick converges; shorter would restart
      # the parse from zero in a loop.
      start_period: 240s

  unpackerr:
    <<: *service-defaults
    container_name: unpackerr
    image: docker.io/golift/unpackerr:v0.16.1@sha256:244fc45cb207308f60e8f52dd703c2b3463385752de0f9517c58ff9d331ed15e
    cpus: 1.0
    labels:
      dev.dozzle.group: downloaders
      dev.dozzle.name: unpackerr
    user: "${NAS_UID:?}:${NAS_GID:?}"
    volumes:
      - ${MEDIA_ACQUISITION_PATH:?}:/data/media/.acquisition
      - ${BOOKS_ACQUISITION_PATH:?}:/data/books/.acquisition
    environment:
      TZ: ${TZ:?}
      UN_FILE_MODE: "0644"
      UN_DIR_MODE: "0755"
      UN_PARALLEL: "1"
      UN_MAX_RETRIES: "3"
      # Unpackerr's per-app extraction caps (20GB Sonarr) silently strand season
      # packs at "Awaiting Import"; "0" disables the cap, empty restores the default.
      UN_SONARR_0_MAX_BYTES: "0"
      UN_RADARR_0_MAX_BYTES: "0"
      UN_SONARR_0_URL: http://sonarr:8989
      UN_SONARR_0_API_KEY: ${SONARR_API_KEY:?}
      UN_SONARR_0_PATHS_0: /data/media/.acquisition/usenet/series
      UN_SONARR_0_PROTOCOLS: usenet
      UN_RADARR_0_URL: http://radarr:7878
      UN_RADARR_0_API_KEY: ${RADARR_API_KEY:?}
      UN_RADARR_0_PATHS_0: /data/media/.acquisition/usenet/movies
      UN_RADARR_0_PROTOCOLS: usenet
      # `metrics` is upstream's on-switch for the whole web server; it listens on
      # the container's own loopback only, for the health check.
      UN_WEBSERVER_METRICS: "true"
      UN_WEBSERVER_LISTEN_ADDR: 127.0.0.1:5656
    healthcheck:
      <<: *healthcheck-defaults
      # Served by Unpackerr itself, so a dead or deadlocked process answers
      # nothing. GET, not HEAD: the router answers --spider's HEAD with 405.
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:5656/"]
      # Deviation kept from before the defaults, reason unrecorded; it keeps a
      # broken probe unhealthy at ~105s, inside the 180s deploy wait.
      retries: 3
      start_period: 15s

networks:
  default: {}
  media-control:
    external: true
    name: ${PLATFORM_MEDIA_NETWORK:?}
