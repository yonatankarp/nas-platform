---
# Platform fragments. Compose resolves a YAML anchor only inside the file that
# declares it, so every stack carries its own copy; tests/policy_test.rb pins the
# copies equal and records there why cross-file sharing was not taken. A
# container needing different health-check timing overrides only the fields it
# changes, so a deviation reads as a deviation.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-service-defaults: &service-defaults
  cpuset: ${PLATFORM_CONTAINER_CPUSET:?}
  # SABnzbd's linuxserver.io entrypoint reaches PUID/PGID by calling setuid(2)
  # as root, which no_new_privs does not restrict, and Unpackerr is a single Go
  # binary already running as the platform identity. Neither executes a setuid
  # binary, so neither loses anything by refusing that escalation outright.
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *default-logging
  networks:
    - default
    - media-control

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 60s

services:
  sabnzbd:
    <<: *service-defaults
    container_name: sabnzbd
    image: lscr.io/linuxserver/sabnzbd:5.1.3@sha256:948ea3dc45d68943ec14b33ba37ffa1488da3e9837bf3ca0f75621e971614d85
    cpus: 2.0
    labels:
      dev.dozzle.group: downloaders
      dev.dozzle.name: sabnzbd
    ports:
      - "8085:8080"
    volumes:
      - ${SABNZBD_CONFIG_PATH:?}:/config
      - ${MEDIA_ACQUISITION_PATH:?}:/data/media/.acquisition
      - ${BOOKS_ACQUISITION_PATH:?}:/data/books/.acquisition
      # The post-processing gate, mounted from the immutable release rather than
      # copied into /config, for the reason services/dozzle/alert_relay.py is
      # mounted the same way: the release is what a deployment replaces, so the
      # script and the compose file that references it can never be one revision
      # apart. `misc.script_dir` points SABnzbd at this directory and
      # `misc.script_can_fail` is what makes its exit code mean anything; both
      # are reconciled in roles/downloaders/defaults/main.yml.
      - ${PLATFORM_CURRENT_DIR:?}/services/downloaders/clamav_gate.py:/scripts/clamav_gate.py:ro
    environment:
      PUID: ${NAS_UID:?}
      PGID: ${NAS_GID:?}
      UMASK: "022"
      TZ: ${TZ:?}
      SABNZBD_API_KEY: ${SABNZBD_API_KEY:?}
    healthcheck:
      <<: *healthcheck-defaults
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error
          "http://127.0.0.1:8080/api?mode=version&output=json&apikey=$${SABNZBD_API_KEY}"
          >/dev/null
    # SABnzbd answers SIGTERM by pausing the active download and writing the
    # queue and history admin under its recovery: critical config directory. A
    # minute lets that finish, so a restart resumes the transfer instead of
    # re-fetching it. Unpackerr deliberately gets no window: it holds no
    # database, and a half-finished extraction is discarded and retried.
    stop_grace_period: 1m

  # The gate the SABnzbd post-processing script talks to, and the reason this is
  # a daemon rather than a `clamscan` per job: the signature database is ~1.4GB
  # to parse, which is minutes of CPU on this host, and a per-job scan would pay
  # it every time. clamd parses it once at start and holds it resident. Expect
  # roughly 1.5-2.0GB RSS from this container -- the largest single figure on the
  # host, against the 4.9GB the other thirty held when CLAUDE.md last measured
  # them -- and no `mem_limit`, deliberately: the resident set is a fixed
  # database rather than a leak, and a limit under it would OOM-kill clamd in the
  # middle of a scan, which this platform's gate reads as "scanner unavailable"
  # and turns into a failed download.
  #
  # The image carrying the bundled database rather than `1.5.1_base`, which does
  # not: `_base` cannot answer a scan until freshclam has fetched the whole set,
  # so every job completing in that window would hit the fail-closed path and
  # blocklist its release. freshclam still runs inside this container and
  # refreshes from the bundled snapshot forward.
  clamav:
    <<: *service-defaults
    container_name: clamav
    image: docker.io/clamav/clamav:1.5.1@sha256:b32e587feae9f156d660704beeec4ee69c79fcf5af092bdc0f2f93892a29b553
    # One CPU, and the ceiling is the point rather than a guess at the workload.
    # A full-volume ADM clamscan holding a whole core is what kept the Beszel
    # temperature alert ringing for 22 hours; this container is the same engine
    # pointed at far less, and the ceiling is what keeps it from becoming the
    # same thing again.
    cpus: 1.0
    labels:
      dev.dozzle.group: downloaders
      dev.dozzle.name: clamav
    # Read-only, and the paths are identical to SABnzbd's on purpose. The gate
    # sends clamd a path string that SABnzbd resolved in its own namespace, and
    # clamd resolves it again in this one; if the two mounts ever diverge, clamd
    # scans a different tree or answers ERROR. Changing one of these four lines
    # means changing its twin above.
    volumes:
      - ${MEDIA_ACQUISITION_PATH:?}:/data/media/.acquisition:ro
      - ${BOOKS_ACQUISITION_PATH:?}:/data/books/.acquisition:ro
    environment:
      TZ: ${TZ:?}
    # No PUID/PGID and no `user:`, unlike every other container in this stack.
    # The image's entrypoint runs freshclam as its own `clamav` user against
    # /var/lib/clamav, which that user owns; a foreign uid cannot write there and
    # the database would never refresh. The mounts above are read-only, so what
    # this container can reach is bounded by them rather than by its uid.
    healthcheck:
      <<: *healthcheck-defaults
      # A real round-trip to the daemon, not an observation that a process
      # exists: clamd does not accept a connection at all until it has parsed
      # the signature set, so PING/PONG is exactly the readiness the gate needs.
      # `clamdscan` reaches clamd over whichever transport clamd.conf declares,
      # which in this image is both the local socket and TCP 3310; the probe
      # therefore proves the daemon is answering rather than that this one port
      # is bound. The image's own clamdcheck.sh wraps the same call.
      test: [CMD-SHELL, "clamdscan --ping 1"]
      # Parsing ~1.4GB of signatures takes a minute or two on this host, and a
      # clamd still doing it is not broken. The shared 60s start period would
      # report it unhealthy before it had a chance to answer.
      start_period: 240s

  unpackerr:
    <<: *service-defaults
    container_name: unpackerr
    image: docker.io/golift/unpackerr:v0.16.1@sha256:244fc45cb207308f60e8f52dd703c2b3463385752de0f9517c58ff9d331ed15e
    cpus: 1.0
    labels:
      dev.dozzle.group: downloaders
      dev.dozzle.name: unpackerr
    user: "${NAS_UID:?}:${NAS_GID:?}"
    volumes:
      - ${MEDIA_ACQUISITION_PATH:?}:/data/media/.acquisition
      - ${BOOKS_ACQUISITION_PATH:?}:/data/books/.acquisition
    environment:
      TZ: ${TZ:?}
      UN_FILE_MODE: "0644"
      UN_DIR_MODE: "0755"
      UN_PARALLEL: "1"
      UN_MAX_RETRIES: "3"
      # Unpackerr caps the uncompressed size of a single extraction and defaults
      # that cap per application: 20GB for Sonarr, 75GB for Radarr
      # (unpackerr v0.16.1, pkg/unpackerr/start.go). A television season pack is
      # routinely larger than 20GB, and the refusal is neither a download failure
      # nor an archive failure -- it reports "extracted size exceeds maximum
      # bytes", holds the item at "Awaiting Import" for ever and reads, from the
      # library, as a season that silently never arrived. This platform bounds
      # extraction by the disk it writes to rather than by an archive-size
      # guess, so both caps are disabled explicitly. "0" is upstream's spelling
      # for no limit; empty would restore the default.
      UN_SONARR_0_MAX_BYTES: "0"
      UN_RADARR_0_MAX_BYTES: "0"
      UN_SONARR_0_URL: http://sonarr:8989
      UN_SONARR_0_API_KEY: ${SONARR_API_KEY:?}
      UN_SONARR_0_PATHS_0: /data/media/.acquisition/usenet/series
      UN_SONARR_0_PROTOCOLS: usenet
      UN_RADARR_0_URL: http://radarr:7878
      UN_RADARR_0_API_KEY: ${RADARR_API_KEY:?}
      UN_RADARR_0_PATHS_0: /data/media/.acquisition/usenet/movies
      UN_RADARR_0_PROTOCOLS: usenet
      # The only endpoint the binary can be asked to expose, and the only reason
      # it is asked. `metrics` is upstream's on-switch for the whole web server
      # rather than a separate exporter — WebServer.Enabled() is `Metrics &&
      # ListenAddr != ""` — so it is what turns the listener on. The address is
      # the loopback of the container's own network namespace, which is where
      # the health check runs and nowhere else: no port is published, the
      # media-control network cannot reach it, and there is no credential on it
      # to protect.
      UN_WEBSERVER_METRICS: "true"
      UN_WEBSERVER_LISTEN_ADDR: 127.0.0.1:5656
    healthcheck:
      <<: *healthcheck-defaults
      # PID 1 in this container is Unpackerr itself, so the `kill -0 1` this
      # replaces asked the process whether it existed and was answered by the
      # fact that it was asking — and a container whose PID 1 is gone is a
      # container Docker has stopped probing. The probe could not fail. This one
      # can: it is served by the same process, from a goroutine started before
      # the work loop, so a dead, deadlocked or unschedulable Unpackerr answers
      # nothing and the container goes unhealthy for Dozzle's rule to see.
      # It reads the index handler, which is a static string; /metrics would
      # walk the live extraction map from the HTTP goroutine, and the probe is
      # not the place to exercise that. busybox wget is what the alpine base
      # provides — there is no curl in this image — and the GET is deliberate,
      # because the router registers GET only and answers --spider's HEAD 405.
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:5656/"]
      # Deviation carried over unchanged from before the defaults existed; the
      # repository still records no reason for it, and replacing the probe is
      # not where a readiness window gets renegotiated either. The value is kept
      # rather than explained, and the new probe is comfortable inside it: the
      # listener binds during startup, before the first queue poll, so this
      # container is ready in about a second. Keeping it also keeps a broken
      # probe reporting unhealthy at ~105s, inside the 180s Compose deploy wait,
      # where the shared 60s/5 tuple would time the deployment out instead.
      retries: 3
      start_period: 15s

networks:
  default: {}
  media-control:
    external: true
    name: ${PLATFORM_MEDIA_NETWORK:?}
