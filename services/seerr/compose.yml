---
# Platform fragments: an anchor resolves only in its own file, so each stack
# carries a copy; tests/policy_test.rb keeps the copies equal.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-service-defaults: &service-defaults
  cpuset: ${PLATFORM_CONTAINER_CPUSET:?}
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *default-logging

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 60s

services:
  # Request front end for Jellyfin; reaches Jellyfin, Radarr and Sonarr by alias.
  # Seerr is the merged successor of Overseerr/Jellyseerr; do not substitute either.
  # Tags are v-prefixed, so Renovate needs v-prefixed versioning to offer updates.
  seerr:
    <<: *service-defaults
    container_name: seerr
    image: ghcr.io/seerr-team/seerr:v3.5.0@sha256:27602401178d54f1964442287b9f23f67a3fa2252645ee8065839ea1c3f69e45
    # Network-bound only: TMDB lookups, arr syncs and a single-page app.
    cpus: 1.0
    labels:
      dev.dozzle.name: seerr
    # The image runs as node (1000:1000) with no root entrypoint, so PUID/PGID
    # would be dead config; the gid differs from the platform's media group.
    user: "${NAS_UID:?}:${NAS_GID:?}"
    # npm start forks, and without an init the container accumulates zombies.
    init: true
    ports:
      - "5055:5055"
    # Seerr holds no media; Radarr and Sonarr own the files.
    volumes:
      - ${SEERR_CONFIG_PATH:?}:/app/config
    environment:
      TZ: ${TZ:?}
      LOG_LEVEL: info
      # One-way credential: Seerr overwrites its stored key with API_KEY on every
      # start, so a key rotated in the web UI reverts at the next start.
      API_KEY: ${SEERR_API_KEY:?}
    healthcheck:
      # No image HEALTHCHECK, and HTTP answers seconds after start, so start_period
      # is load-bearing: without it the first task after `wait: true` races the server.
      <<: *healthcheck-defaults
      # curl is absent and wget is BusyBox. /api/v1/settings/public answers 200
      # before and after bootstrap. 127.0.0.1 because localhost resolves to ::1.
      test:
        - CMD-SHELL
        - >-
          wget --no-verbose --tries=1 --spider
          http://127.0.0.1:5055/api/v1/settings/public || exit 1
    # /app/config holds the SQLite database (the first user row guards against an
    # anonymous takeover). 30s commits the open transaction.
    stop_grace_period: 30s
    networks:
      - default
      - media-control

networks:
  default: {}
  media-control:
    external: true
    name: ${PLATFORM_MEDIA_NETWORK:?}
