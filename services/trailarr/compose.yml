---
# Anchors resolve only within one file, so each stack carries its own copy;
# tests/policy_test.rb pins the copies equal.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-service-defaults: &service-defaults
  cpuset: ${PLATFORM_CONTAINER_CPUSET:?}
  # gosu re-exec is a root setuid(2), not a setuid binary, so this keeps the PUID remap.
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *default-logging

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 60s

services:
    # Joins media-control: reads Radarr/Sonarr APIs by service name. Upstream pushes
    # latest/nightly on every master push, so only X.Y.Z tags are safe; the base image
    # is unpinned upstream, which the digest pins down.
  trailarr:
    <<: *service-defaults
    container_name: trailarr
    image: docker.io/nandyalu/trailarr:0.13.1@sha256:9c8723e6ea5761c670466b534719c267f26564fd35500f1caa396f6ed6c06d1b
    # One trailer transcode at a time; ffmpeg is the only CPU-bound work.
    cpus: 1.0
    labels:
      dev.dozzle.name: trailarr
    ports:
      - "7889:7889"
    # Container paths must equal Radarr/Sonarr's: Trailarr rewrites path_mappings
    # with a trailing slash on write, so any mapping reports drift forever.
    volumes:
      - ${TRAILARR_CONFIG_PATH:?}:/config
      - ${TRAILARR_MOVIES_PATH:?}:/data/media/Movies
      - ${TRAILARR_SERIES_PATH:?}:/data/media/Series
    environment:
      TZ: ${TZ:?}
      # Entrypoint must start as root (chown + gosu); a `user:` key breaks it.
      PUID: ${NAS_UID:?}
      PGID: ${NAS_GID:?}
      # UMASK is unused by the app; declaring it would be a no-op.
      APP_DATA_DIR: /config
      # An API_KEY shorter than 32 chars is silently replaced by a random one.
      API_KEY: ${TRAILARR_API_KEY:?}
      LOG_LEVEL: INFO
      WAIT_FOR_MEDIA: "False"
      YT_COOKIES_PATH: ""
      # Must be a bcrypt hash: a plaintext makes login permanently impossible, and
      # unset would leave upstream's published default admin with library write access.
      WEBUI_USERNAME: ${TRAILARR_WEBUI_USERNAME:?}
      WEBUI_PASSWORD: ${TRAILARR_WEBUI_PASSWORD_HASH:?}
      # True mints a session for any caller; the role asserts it absent from /config/.env.
      WEBUI_DISABLE_AUTH: "False"
      # Downloads stay gated off until the operator acceptance step has run.
      MONITOR_ENABLED: ${TRAILARR_MONITOR_ENABLED:?}
      DOWNLOADS_ENABLED: ${TRAILARR_DOWNLOADS_ENABLED:?}
      # Never create library directories or delete media.
      CREATE_MISSING_FOLDERS: "False"
      DELETE_TRAILER_CONNECTION: "False"
      DELETE_TRAILER_MEDIA: "False"
      # Either would pip-install yt-dlp at start, defeating the digest pin.
      UPDATE_YTDLP: "False"
      YTDLP_NIGHTLY: "False"
      # The API cannot clear a non-empty URL_BASE.
      URL_BASE: ""
    healthcheck:
      <<: *healthcheck-defaults
      # Image has curl but no wget/nc/busybox; /status is the only unauthenticated
      # health route (no /api/v1/health).
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error
          http://127.0.0.1:7889/status >/dev/null
    # 30s lets the SQLite store (recovery: critical) commit its open transaction.
    stop_grace_period: 30s
    networks:
      - default
      - media-control

networks:
  default: {}
  media-control:
    external: true
    name: ${PLATFORM_MEDIA_NETWORK:?}
