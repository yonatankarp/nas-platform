---
# Platform fragments. Anchors are file-local, so each stack carries its own
# copy; tests/policy_test.rb pins the copies equal.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-service-defaults: &service-defaults
  cpuset: ${PLATFORM_CONTAINER_CPUSET:?}
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *default-logging

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 60s

services:
  # Self-contained writer: calls no platform service, so it is off media-control.
  pinchflat:
    <<: *service-defaults
    container_name: pinchflat
    image: ghcr.io/kieraneglin/pinchflat:v2025.6.6@sha256:4e975edf58f0861a5cbfe8fc6aac4851ff5a02dfc3f05ffeea4982e3084a5a4a
    cpus: 1.0
    labels:
      dev.dozzle.name: pinchflat
    # No PUID/PGID handling and upstream refuses root, so run as the platform identity.
    user: "${NAS_UID:?}:${NAS_GID:?}"
    ports:
      - "8945:8945"
    volumes:
      - ${PINCHFLAT_CONFIG_PATH:?}:/config
      - ${PINCHFLAT_DOWNLOADS_PATH:?}:/downloads
      # yt-dlp is mounted over the image's frozen copy, which can no longer read
      # YouTube playlists; roles/pinchflat pins it by version and sha256. Ansible must
      # create the file first, or Docker bind-mounts a directory in its place.
      - ${PINCHFLAT_YTDLP_PATH:?}:/usr/local/bin/yt-dlp:ro
    environment:
      TZ: ${TZ:?}
      UMASK: "022"
      # Pinchflat's only access control; unset, the UI is an unauthenticated LAN writer.
      BASIC_AUTH_USERNAME: ${PINCHFLAT_BASIC_AUTH_USERNAME:?}
      BASIC_AUTH_PASSWORD: ${PINCHFLAT_BASIC_AUTH_PASSWORD:?}
    healthcheck:
      <<: *healthcheck-defaults
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error
          http://127.0.0.1:8945/healthcheck >/dev/null
    # 30s commits the SQLite database; a cut-short download is re-queued from it.
    stop_grace_period: 30s
