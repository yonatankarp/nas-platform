---
services:
  vaultwarden:
    container_name: ${PLATFORM_PROJECT_NAME:?}-vaultwarden
    # The Mac lane runs several platform copies, so the host port comes from the
    # environment: MAC_SERVICE_PORT_ORDER in tests/mac/lib.sh -> PLATFORM_VAULTWARDEN_PORT
    # -> vaultwarden_port -> env.j2. Loopback kept: registration is open.
    ports: !override
      - "127.0.0.1:${VAULTWARDEN_HOST_PORT:?}:8086"
