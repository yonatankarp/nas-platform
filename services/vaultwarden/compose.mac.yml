---
services:
  vaultwarden:
    container_name: ${PLATFORM_PROJECT_NAME:?}-vaultwarden
    # The Mac lane runs several isolated copies of the platform side by side, so
    # the production host port is not available to it and the host side comes
    # from the rendered environment rather than from a literal.
    #
    # NOTHING ALLOCATES IT YET, and this file must not be read as though
    # something does. tests/mac/run.sh has no allocation for vaultwarden and
    # MAC_SERVICE_PORT_ORDER in tests/mac/lib.sh does not name it, so
    # roles/vaultwarden/templates/env.j2 renders the production 8086 into
    # VAULTWARDEN_HOST_PORT and this override republishes exactly what it was
    # meant to replace. That is inert only because the Mac lane never turns
    # vaultwarden_deployment_enabled on, which is an expired guard reading as a
    # live one -- the class of thing this repository keeps finding.
    #
    # What has to change before the lane can run this service: an entry in
    # MAC_SERVICE_PORT_ORDER, the allocation chain in tests/mac/run.sh that
    # docs/adding-a-service.md walks through, the <service>_port line in
    # inventory/group_vars/mac_hosts/main.yml, the exemption
    # tests/policy_mac_test.rb currently carries for vaultwarden, and the
    # `-e vaultwarden_deployment_enabled=true` that tests/mac/lib.sh passes for
    # Nextcloud. tests/deployment_gate_coverage_test.rb makes all of that
    # mandatory the moment the platform default flips.
    ports: !override
      - "${VAULTWARDEN_HOST_PORT:?}:8086"
