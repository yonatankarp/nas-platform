---
# Platform fragments: an anchor resolves only in its own file, so each stack
# carries a copy; tests/policy_test.rb keeps the copies equal.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-service-defaults: &service-defaults
  cpuset: ${PLATFORM_CONTAINER_CPUSET:?}
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *default-logging

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 60s

services:
  # Calls no other service and none calls it, so it stays off media-control.
  vaultwarden:
    <<: *service-defaults
    container_name: vaultwarden
    # SECURITY FLOOR: CVE-2026-27801 (2FA bypass) affects <= 1.34.3, so never
    # deploy a pin below 1.35.0. It migrates its own SQLite store, but additively,
    # so minors automerge; image_downgrade_guard and pre_upgrade_backup cover rollbacks.
    image: docker.io/vaultwarden/server:1.37.4@sha256:efb3cde962015fcc036b2ea625242248611943b27212ebf4392841fb30fad055
    cpus: 0.5
    labels:
      dev.dozzle.name: vaultwarden
    # No PUID/PGID handling or privilege-dropping entrypoint, so run as the platform identity.
    user: "${NAS_UID:?}:${NAS_GID:?}"
    ports:
      # LOOPBACK ONLY: signups are open, so a wildcard publication would make "the
      # tailnet is the perimeter" false (measured: a LAN registration succeeded, #547).
      # Serve proxies to 127.0.0.1:8086. Container side 8086 via ROCKET_PORT because
      # uid 1000 cannot bind 80.
      - "127.0.0.1:8086:8086"
    volumes:
      # The whole DATA_FOLDER; irreplaceable, see service_vaultwarden.yml.
      - ${VAULTWARDEN_DATA_PATH:?}:/data
    environment:
      TZ: ${TZ:?}
      ROCKET_PORT: "8086"
      DATA_FOLDER: /data
      # Full https:// origin, no port: WebAuthn and 2FA bind to exactly this string.
      DOMAIN: ${VAULTWARDEN_DOMAIN:?}
      # Open by decision (service_vaultwarden.yml): with no /admin and no SMTP a
      # closed door leaves no route to a first account. The 127.0.0.1 binding above
      # is the containment; tasks/verify.yml proves the door both ways.
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED:?}
      # Independent of the door: how an organization owner adds a member.
      INVITATIONS_ALLOWED: ${VAULTWARDEN_INVITATIONS_ALLOWED:?}
      # NEITHER ADMIN_TOKEN NOR DISABLE_ADMIN_TOKEN APPEARS HERE. Saving in /admin
      # writes config.json, which then silently outranks this environment, and
      # DISABLE_ADMIN_TOKEN=true serves the panel unauthenticated. deploy.yml refuses
      # all three keys and asserts config.json absent on every converge.
    healthcheck:
      <<: *healthcheck-defaults
      # Probes the pinned port, so a drifted ROCKET_PORT fails here.
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error
          http://127.0.0.1:8086/alive >/dev/null
    # SQLite in WAL mode with no backup: 30s lets it checkpoint and close cleanly.
    stop_grace_period: 30s
