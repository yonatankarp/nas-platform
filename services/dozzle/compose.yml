# Platform fragments: an anchor resolves only in its own file, so each stack
# carries a copy; tests/policy_test.rb keeps the copies equal.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-service-defaults: &service-defaults
  cpuset: ${PLATFORM_CONTAINER_CPUSET:?}
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *default-logging

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 60s

services:
  alert-relay:
    <<: *service-defaults
    container_name: dozzle_alert_relay
    image: docker.io/library/python:3.14-alpine@sha256:9e9fde4d32eedce0b661d9ab91e826b62dddf28e928c230ec55f1866cac66b01
    cpus: 0.5
    labels:
      dev.dozzle.group: dozzle
      dev.dozzle.name: alert-relay
      dev.nas-platform.alert-relay.script-sha256: ${ALERT_RELAY_SCRIPT_SHA256:?}
    user: "${NAS_UID:?}:${NAS_GID:?}"
    command: [python, /app/alert_relay.py]
    # alert-bridge is where Beszel's hub reaches this relay; default must be named
    # too, or Dozzle loses alert-relay:8081.
    networks:
      - default
      - alert-bridge
    # LOOPBACK ONLY, for golem. Its Dozzle agent dispatches the rules the hub
    # pushes to it from golem itself, to the same http://alert-relay:<port>/alerts
    # URL; golem maps that name to this host's tailnet address, where a Tailscale
    # Serve TCP forward (roles/dozzle/tasks/serve.yml) hands the connection to
    # this loopback port. So the tailnet reaches the relay and the LAN does not,
    # and the bearer token stays its authentication. Loopback rather than the
    # tailnet address because that address may not exist yet when Docker starts
    # the container at boot, and a bind to it would then fail. The same port on
    # both sides and in Serve, because the URL golem is handed carries it.
    ports:
      - "127.0.0.1:${ALERT_RELAY_PORT:?}:${ALERT_RELAY_PORT:?}"
    volumes:
      - ${PLATFORM_CURRENT_DIR:?}/services/dozzle/alert_relay.py:/app/alert_relay.py:ro
      - ${DOZZLE_STATE_ROOT:?}/alert-relay:/state
    environment:
      ALERT_RELAY_TOKEN: ${ALERT_RELAY_TOKEN:?}
      ALERT_RELAY_PORT: ${ALERT_RELAY_PORT:?}
      PUSHOVER_API_URL: ${PUSHOVER_API_URL:?}
      ALERT_RELAY_LINK_BASE: ${ALERT_RELAY_LINK_BASE:?}
      PUSHOVER_TOKEN: ${PUSHOVER_TOKEN:?}
      PUSHOVER_ALERTS_TOKEN: ${PUSHOVER_ALERTS_TOKEN:?}
      PUSHOVER_GOLEM_TOKEN: ${PUSHOVER_GOLEM_TOKEN:?}
      BESZEL_LINK_BASE: ${BESZEL_LINK_BASE:?}
      PUSHOVER_USER_KEY: ${PUSHOVER_USER_KEY:?}
      ALERT_DAILY_CONTAINER_CEILING: ${ALERT_DAILY_CONTAINER_CEILING:?}
      ALERT_DAILY_OOM_CONTAINER_CEILING: ${ALERT_DAILY_OOM_CONTAINER_CEILING:?}
      ALERT_DAILY_GLOBAL_CEILING: ${ALERT_DAILY_GLOBAL_CEILING:?}
      ALERT_STATE_PATH: /state/alert-relay.json
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${ALERT_RELAY_PORT:?}/healthz', timeout=3).read()"]
      # Short: Dozzle waits on this, and it listens within a second over loopback.
      timeout: 5s
      retries: 4
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp

  dozzle:
    <<: *service-defaults
    container_name: dozzle
    image: docker.io/amir20/dozzle:v11.1.3@sha256:a70238909232f61ebcfdc4617200cb32872be481a51d8c65cc56c4f261ba66ca
    cpus: 1.0
    labels:
      dev.dozzle.group: dozzle
      dev.dozzle.name: dozzle
    user: "${NAS_UID:?}:${NAS_GID:?}"
    ports:
      - "8080:8080"
    volumes:
      - ${DOZZLE_STATE_ROOT:?}:/data
    environment:
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_ENABLE_ACTIONS: "false"
      DOZZLE_ENABLE_MCP: "false"
      DOZZLE_ENABLE_SHELL: "false"
      DOZZLE_NO_ANALYTICS: "true"
      # `|name` sets the displayed host name; copied from beszel_system_name.
      DOZZLE_REMOTE_HOST: tcp://socket-proxy:2375|ASUSTOR-AS6704T
      # Dozzle silently falls back to the image's public keypair when a DOZZLE_CERT
      # path is missing, so these must name exactly where roles/dozzle writes ours.
      DOZZLE_REMOTE_AGENT: ${DOZZLE_REMOTE_AGENT:?}
      DOZZLE_CERT: /data/agent-cert.pem
      DOZZLE_KEY: /data/agent-key.pem
      TZ: ${TZ:?}
    # The internal docker-api network keeps everything but Dozzle off the proxy (#829).
    networks:
      - default
      - docker-api
    depends_on:
      socket-proxy:
        condition: service_healthy
      alert-relay:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD, /dozzle, healthcheck]
      # Inherited deviation with no recorded reason.
      retries: 4
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp

  socket-proxy:
    <<: *service-defaults
    container_name: dozzle_socket_proxy
    image: lscr.io/linuxserver/socket-proxy:3.4.5@sha256:ca6c0301a652232d02cb0ff9f1c5d20d9b339f391e1c1dffaae6ef3bfc59d009
    cpus: 0.5
    labels:
      dev.dozzle.group: dozzle
      dev.dozzle.name: socket-proxy
    # CONTAINERS exposes every container's environment (#829): internal network only.
    networks:
      - docker-api
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Without this every log stream is refused with 403, which Dozzle shows as "no logs yet".
      ALLOW_LOGS: "1"
      CONTAINERS: "1"
      EVENTS: "1"
      INFO: "1"
      POST: "0"
      TZ: ${TZ:?}
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD-SHELL, "wget -q -O - http://127.0.0.1:2375/_ping | grep -qx OK"]
      # Short: Dozzle waits on this, and it listens within a second over loopback.
      timeout: 5s
      retries: 4
      start_period: 5s
    read_only: true
    tmpfs:
      - /run

networks:
  default: {}
  # Created by host_prep, never by this project: Beszel's hub joins it too.
  alert-bridge:
    external: true
    name: ${PLATFORM_ALERT_RELAY_NETWORK:?}
  docker-api:
    internal: true
