x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  dozzle:
    container_name: dozzle
    image: docker.io/amir20/dozzle:v10.7.1@sha256:a8441e9d2928cc7b30d0023f5eedbb87ef6e234d87f3be02662bd8f417955b8b
    labels:
      dev.dozzle.group: dozzle
      dev.dozzle.name: dozzle
    user: "${NAS_UID:?}:${NAS_GID:?}"
    ports:
      - "8080:8080"
    volumes:
      - ${NAS_DOCKER_ROOT:?}/dozzle/data:/data
    environment:
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_ENABLE_ACTIONS: "false"
      DOZZLE_ENABLE_MCP: "false"
      DOZZLE_ENABLE_SHELL: "false"
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_REMOTE_HOST: tcp://socket-proxy:2375
      TZ: ${TZ:?}
    depends_on:
      socket-proxy:
        condition: service_healthy
    healthcheck:
      test: [CMD, /dozzle, healthcheck]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *default-logging

  socket-proxy:
    container_name: dozzle_socket_proxy
    image: lscr.io/linuxserver/socket-proxy:3.4.3@sha256:5253050dd304d351df2ee61bba43c57dd2b19bb640497a679592051de3a3c639
    labels:
      dev.dozzle.group: dozzle
      dev.dozzle.name: socket-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      INFO: "1"
      POST: "0"
      TZ: ${TZ:?}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O - http://127.0.0.1:2375/_ping | grep -qx OK"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 5s
    read_only: true
    tmpfs:
      - /run
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *default-logging
