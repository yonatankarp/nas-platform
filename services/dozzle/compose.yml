# Platform fragments. Compose resolves a YAML anchor only inside the file that
# declares it, so every stack carries its own copy; tests/policy_test.rb pins the
# copies equal and records there why cross-file sharing was not taken. A
# container needing different health-check timing overrides only the fields it
# changes, so a deviation reads as a deviation.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-service-defaults: &service-defaults
  cpuset: ${PLATFORM_CONTAINER_CPUSET:?}
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *default-logging

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 60s

services:
  alert-relay:
    <<: *service-defaults
    container_name: dozzle_alert_relay
    image: docker.io/library/python:3.14-alpine@sha256:c6ead215bfd31f1e433d968853b7a769989117115b728874824e6c0a27cb96fc
    cpus: 0.5
    labels:
      dev.dozzle.group: dozzle
      dev.dozzle.name: alert-relay
      dev.nas-platform.alert-relay.script-sha256: ${ALERT_RELAY_SCRIPT_SHA256:?}
    user: "${NAS_UID:?}:${NAS_GID:?}"
    # Nothing here can consume a capability. `user:` above makes PID 1
    # unprivileged, so the kernel already reports CapPrm and CapEff empty and
    # only the bounding set is left to clear, and this image carries no
    # file-capability binary whose exec a cleared bounding set would refuse.
    # Both halves were measured, not assumed; see issue #196. The scan covers
    # the image, not the bind-mounted alert_relay.py, which is a Python script
    # and so cannot carry a file capability in the first place.
    cap_drop: [ALL]
    command: [python, /app/alert_relay.py]
    volumes:
      - ${PLATFORM_CURRENT_DIR:?}/services/dozzle/alert_relay.py:/app/alert_relay.py:ro
      - ${DOZZLE_STATE_ROOT:?}/alert-relay:/state
    environment:
      ALERT_RELAY_TOKEN: ${ALERT_RELAY_TOKEN:?}
      ALERT_RELAY_PORT: ${ALERT_RELAY_PORT:?}
      NTFY_PUBLISH_URL: ${NTFY_PUBLISH_URL:?}
      NTFY_TOPIC: ${NTFY_TOPIC:?}
      NTFY_CONTAINERS_TOPIC: ${NTFY_CONTAINERS_TOPIC:?}
      NTFY_TOKEN: ${NTFY_TOKEN:?}
      ALERT_STATE_PATH: /state/alert-relay.json
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${ALERT_RELAY_PORT:?}/healthz', timeout=3).read()"]
      # Dozzle gates its own start on this container reporting healthy. It is
      # listening within a second and the check runs over loopback, so both ends
      # are short rather than spending the platform's grace period.
      timeout: 5s
      retries: 4
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp

  dozzle:
    <<: *service-defaults
    container_name: dozzle
    image: docker.io/amir20/dozzle:v10.9.0@sha256:7f01a2504f89788b60ad0efddd94472fd66f9a225c708356cdb815d9d8abd184
    cpus: 1.0
    labels:
      dev.dozzle.group: dozzle
      dev.dozzle.name: dozzle
    user: "${NAS_UID:?}:${NAS_GID:?}"
    # Nothing here can consume a capability. `user:` above makes PID 1
    # unprivileged, so the kernel already reports CapPrm and CapEff empty and
    # only the bounding set is left to clear, and this image carries no
    # file-capability binary whose exec a cleared bounding set would refuse.
    # Both halves were measured, not assumed; see issue #196.
    cap_drop: [ALL]
    ports:
      - "8080:8080"
    volumes:
      - ${DOZZLE_STATE_ROOT:?}:/data
    environment:
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_ENABLE_ACTIONS: "false"
      DOZZLE_ENABLE_MCP: "false"
      DOZZLE_ENABLE_SHELL: "false"
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_REMOTE_HOST: tcp://socket-proxy:2375
      TZ: ${TZ:?}
    depends_on:
      socket-proxy:
        condition: service_healthy
      alert-relay:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD, /dozzle, healthcheck]
      # Deviation carried over unchanged from before the defaults existed; the
      # repository records no reason for it, and a de-duplication is not where a
      # readiness window gets renegotiated.
      retries: 4
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp

  socket-proxy:
    <<: *service-defaults
    container_name: dozzle_socket_proxy
    image: lscr.io/linuxserver/socket-proxy:3.4.4@sha256:cba12c42b1df30a6446856028f5ab726e9d8921f1ea74be509216c5e41357d42
    cpus: 0.5
    labels:
      dev.dozzle.group: dozzle
      dev.dozzle.name: socket-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # The proxy denies /containers/<id>/logs on its own rule, before the
      # general CONTAINERS allow it would otherwise fall through to. Without
      # this the container list renders and every log stream is refused with
      # 403, which Dozzle displays as the far quieter "no logs yet".
      ALLOW_LOGS: "1"
      CONTAINERS: "1"
      EVENTS: "1"
      INFO: "1"
      POST: "0"
      TZ: ${TZ:?}
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD-SHELL, "wget -q -O - http://127.0.0.1:2375/_ping | grep -qx OK"]
      # Dozzle gates its own start on this container reporting healthy. It is
      # listening within a second and the check runs over loopback, so both ends
      # are short rather than spending the platform's grace period.
      timeout: 5s
      retries: 4
      start_period: 5s
    read_only: true
    tmpfs:
      - /run
