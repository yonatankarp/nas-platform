x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  alert-relay:
    container_name: dozzle_alert_relay
    image: docker.io/library/python:3.14-alpine@sha256:05b2b8b732ecd268fee8727a369f936f022d1321b59befd13c30ede22769dcdc
    cpuset: ${PLATFORM_CONTAINER_CPUSET:?}
    cpus: 0.5
    labels:
      dev.dozzle.group: dozzle
      dev.dozzle.name: alert-relay
      dev.nas-platform.alert-relay.script-sha256: ${ALERT_RELAY_SCRIPT_SHA256:?}
    user: "${NAS_UID:?}:${NAS_GID:?}"
    command: [python, /app/alert_relay.py]
    volumes:
      - ${PLATFORM_CURRENT_DIR:?}/services/dozzle/alert_relay.py:/app/alert_relay.py:ro
      - ${DOZZLE_STATE_ROOT:?}/alert-relay:/state
    environment:
      ALERT_RELAY_TOKEN: ${ALERT_RELAY_TOKEN:?}
      ALERT_RELAY_PORT: ${ALERT_RELAY_PORT:?}
      NTFY_PUBLISH_URL: ${NTFY_PUBLISH_URL:?}
      NTFY_TOPIC: ${NTFY_TOPIC:?}
      NTFY_CONTAINERS_TOPIC: ${NTFY_CONTAINERS_TOPIC:?}
      NTFY_TOKEN: ${NTFY_TOKEN:?}
      ALERT_STATE_PATH: /state/alert-relay.json
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${ALERT_RELAY_PORT:?}/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *default-logging

  dozzle:
    container_name: dozzle
    image: docker.io/amir20/dozzle:v10.8.0@sha256:243666b0593ff33ed1373901575236f0d6bed8a2d6b451cdae4345969a7b6d5c
    cpuset: ${PLATFORM_CONTAINER_CPUSET:?}
    cpus: 1.0
    labels:
      dev.dozzle.group: dozzle
      dev.dozzle.name: dozzle
    user: "${NAS_UID:?}:${NAS_GID:?}"
    ports:
      - "8080:8080"
    volumes:
      - ${DOZZLE_STATE_ROOT:?}:/data
    environment:
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_ENABLE_ACTIONS: "false"
      DOZZLE_ENABLE_MCP: "false"
      DOZZLE_ENABLE_SHELL: "false"
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_REMOTE_HOST: tcp://socket-proxy:2375
      TZ: ${TZ:?}
    depends_on:
      socket-proxy:
        condition: service_healthy
      alert-relay:
        condition: service_healthy
    healthcheck:
      test: [CMD, /dozzle, healthcheck]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *default-logging

  socket-proxy:
    container_name: dozzle_socket_proxy
    image: lscr.io/linuxserver/socket-proxy:3.4.4@sha256:cba12c42b1df30a6446856028f5ab726e9d8921f1ea74be509216c5e41357d42
    cpuset: ${PLATFORM_CONTAINER_CPUSET:?}
    cpus: 0.5
    labels:
      dev.dozzle.group: dozzle
      dev.dozzle.name: socket-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # The proxy denies /containers/<id>/logs on its own rule, before the
      # general CONTAINERS allow it would otherwise fall through to. Without
      # this the container list renders and every log stream is refused with
      # 403, which Dozzle displays as the far quieter "no logs yet".
      ALLOW_LOGS: "1"
      CONTAINERS: "1"
      EVENTS: "1"
      INFO: "1"
      POST: "0"
      TZ: ${TZ:?}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O - http://127.0.0.1:2375/_ping | grep -qx OK"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 5s
    read_only: true
    tmpfs:
      - /run
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *default-logging
