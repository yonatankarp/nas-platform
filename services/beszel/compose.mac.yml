---
services:
  hub:
    container_name: ${PLATFORM_PROJECT_NAME:?}-beszel
    ports: !override
      - "${BESZEL_HOST_PORT:?}:8090"
  agent-portable:
    container_name: ${PLATFORM_PROJECT_NAME:?}-beszel-agent-portable
  agent-intel:
    container_name: ${PLATFORM_PROJECT_NAME:?}-beszel-agent-intel
  socket-proxy:
    container_name: ${PLATFORM_PROJECT_NAME:?}-beszel-socket-proxy
    # The Mac runs agent-portable, which reaches the proxy by name over the
    # internal docker-api network, so the loopback port kept for the NAS's
    # host-network agent-intel is not published here.
    ports: !reset []
