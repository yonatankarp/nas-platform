# Platform fragments. Compose resolves a YAML anchor only inside the file that
# declares it, so every stack carries its own copy; tests/policy_test.rb pins the
# copies equal and records there why cross-file sharing was not taken. A
# container needing different health-check timing overrides only the fields it
# changes, so a deviation reads as a deviation.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-service-defaults: &service-defaults
  cpuset: ${PLATFORM_CONTAINER_CPUSET:?}
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *default-logging

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 60s

services:
  hub:
    <<: *service-defaults
    container_name: beszel
    image: ghcr.io/henrygd/beszel/beszel:0.20.0@sha256:c44c2c25929505930c8bb850556c8e071dd00d42ea367d9b53243ef64bd57d17
    cpus: 1.0
    labels:
      dev.dozzle.group: beszel
      dev.dozzle.name: hub
    ports:
      - "8090:8090"
    # alert-bridge reaches the Dozzle alert relay; default has to be named too, or
    # the agents lose hub:8090.
    networks:
      - default
      - alert-bridge
    volumes:
      # Holds the PocketBase database and id_ed25519. That keypair is authored in
      # vault and written here before first start, so the agent's KEY is known in
      # advance and nothing has to be read back from a running hub.
      - ${NAS_DOCKER_ROOT:?}/beszel/hub:/beszel_data
    environment:
      APP_URL: ${BESZEL_APP_URL:?}
      TZ: ${TZ:?}
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD, /beszel, health, --url, "http://localhost:8090"]
      # Both agents gate their own start on this container reporting healthy, so
      # the grace period is what the whole stack waits before it is told the hub
      # is up. The hub is listening in about a second; the platform's 60s would
      # only postpone that answer.
      retries: 4
      start_period: 5s
    # The hub writes every incoming metric into the PocketBase database in
    # /beszel_data, which is recovery: critical and also holds the keypair
    # placed there before first start. 30s lets the open transaction commit.
    # The agents get no window: they hold a cache and reconnect.
    stop_grace_period: 30s

  agent-portable:
    <<: *service-defaults
    container_name: beszel_agent_portable
    image: ghcr.io/henrygd/beszel/beszel-agent:0.20.0@sha256:2c3b2d781a8bcdb464704c0024baab5486d238d40871b67c84d906d34791c490
    cpus: 0.5
    labels:
      dev.dozzle.group: beszel
      dev.dozzle.name: agent-portable
    depends_on:
      hub:
        condition: service_healthy
      socket-proxy:
        condition: service_healthy
    volumes:
      - ${NAS_DOCKER_ROOT:?}/beszel/agent:/var/lib/beszel-agent
      - ${NAS_DOCKER_ROOT:?}/beszel/volume1:/extra-filesystems/volume1:ro
      - ${NAS_MEDIA_ROOT:?}/.beszel:/extra-filesystems/volume2:ro
    environment:
      DISABLE_SSH: "true"
      DOCKER_HOST: tcp://socket-proxy:2375
      FILESYSTEM: /extra-filesystems/volume1
      HUB_URL: http://hub:8090
      KEY: ${BESZEL_AGENT_KEY:?}
      SYSTEM_NAME: ${BESZEL_SYSTEM_NAME:?}
      TOKEN: ${BESZEL_AGENT_TOKEN:?}
      TZ: ${TZ:?}
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD, /agent, health]
      # Deviation carried over unchanged from before the defaults existed; the
      # repository records no reason for it, and a de-duplication is not where a
      # readiness window gets renegotiated.
      retries: 4
      start_period: 10s

  agent-intel:
    <<: *service-defaults
    container_name: beszel_agent
    image: ghcr.io/henrygd/beszel/beszel-agent-intel:0.20.0@sha256:00882dcb1708f1ca09487b21781c454138f88949b14b2685e3d30d3747f7aecf
    cpus: 0.5
    labels:
      dev.dozzle.group: beszel
      dev.dozzle.name: agent-intel
    # Host networking is a monitoring compatibility exception: the agent must
    # observe the NAS network interfaces rather than only its own namespace. Its
    # SSH server is disabled, it publishes no port, and it dials the hub outbound.
    network_mode: host
    cap_add:
      - CAP_PERFMON
      # S.M.A.R.T.: smartctl's SG_IO passthrough to the SATA disks needs RAWIO.
      - CAP_SYS_RAWIO
      # NVMe admin passthrough needs SYS_ADMIN, and nothing else here does. It is a
      # broad capability, accepted because the NVMe pair is md1, /volume1 -- every
      # service's data, Vaultwarden's store included -- and a dying member would
      # otherwise never be reported. Drop it with the NVMe slots, never alone.
      - CAP_SYS_ADMIN
    # Devices are host facts: inventory/group_vars/nas_hosts/main.yml lists them
    # and roles/beszel asserts one slot per disk, so a disk added there without a
    # slot here fails the run instead of going unmonitored, while a declared disk
    # missing from the host renders /dev/null and warns. `:r` refuses a write-open
    # and nothing more. It does not contain these disks: CAP_SYS_RAWIO lets SG_IO
    # send any SCSI/ATA command, WRITE included, through a read-only handle, and
    # CAP_SYS_ADMIN lets NVMe admin passthrough send Format and Sanitize.
    devices:
      - ${NAS_RENDER_DEVICE:?}:${NAS_RENDER_DEVICE:?}
      # SATA bays: base devices, never partitions (beszel-docs guide/smart-data).
      - ${NAS_SMART_SATA_DEVICE_1:?}:${NAS_SMART_SATA_DEVICE_1:?}:r
      - ${NAS_SMART_SATA_DEVICE_2:?}:${NAS_SMART_SATA_DEVICE_2:?}:r
      - ${NAS_SMART_SATA_DEVICE_3:?}:${NAS_SMART_SATA_DEVICE_3:?}:r
      # NVMe: the host namespace mapped onto the controller name, upstream's
      # documented Docker form (henrygd/beszel#1637). The namespace is the path
      # read off this host; the controller name is what the agent expects.
      - ${NAS_SMART_NVME_NAMESPACE_1:?}:/dev/nvme0:r
      - ${NAS_SMART_NVME_NAMESPACE_2:?}:/dev/nvme1:r
    depends_on:
      hub:
        condition: service_healthy
      socket-proxy:
        condition: service_healthy
    volumes:
      - ${NAS_DOCKER_ROOT:?}/beszel/agent:/var/lib/beszel-agent
      - ${NAS_DOCKER_ROOT:?}/beszel/volume1:/extra-filesystems/volume1:ro
      - ${NAS_MEDIA_ROOT:?}/.beszel:/extra-filesystems/volume2:ro
    environment:
      DISABLE_SSH: "true"
      DOCKER_HOST: tcp://127.0.0.1:2375
      # The agent finds md arrays by walking /sys/block (agent/mdraid_linux.go at
      # v0.19.0), not through the devices above, so scoping those does not hide
      # ADM's firmware-owned system arrays. md1 and md2 -- /volume1 and /volume2 --
      # are left in on purpose: their sysfs health is how a degraded array pages.
      EXCLUDE_SMART: /dev/md0,/dev/md126
      FILESYSTEM: /extra-filesystems/volume1
      HUB_URL: http://127.0.0.1:8090
      INTEL_GPU_DEVICE: drm:${NAS_RENDER_DEVICE:?}
      KEY: ${BESZEL_AGENT_KEY:?}
      SYSTEM_NAME: ${BESZEL_SYSTEM_NAME:?}
      TOKEN: ${BESZEL_AGENT_TOKEN:?}
      TZ: ${TZ:?}
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD, /agent, health]
      # Deviation carried over unchanged from before the defaults existed; the
      # repository records no reason for it, and a de-duplication is not where a
      # readiness window gets renegotiated.
      retries: 4
      start_period: 10s

  socket-proxy:
    <<: *service-defaults
    container_name: beszel_socket_proxy
    # The only Docker socket reader. Read-only access with mutation refused, and
    # never published beyond loopback.
    image: lscr.io/linuxserver/socket-proxy:3.4.5@sha256:ca6c0301a652232d02cb0ff9f1c5d20d9b339f391e1c1dffaae6ef3bfc59d009
    cpus: 0.5
    labels:
      dev.dozzle.group: beszel
      dev.dozzle.name: socket-proxy
    ports:
      - "127.0.0.1:2375:2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: "1"
      EVENTS: "0"
      POST: "0"
      TZ: ${TZ:?}
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD-SHELL, "wget -q -O - http://127.0.0.1:2375/_ping | grep -qx OK"]
      # Both agents gate their own start on this container reporting healthy. It
      # answers /_ping over loopback the moment it is listening, so the check is
      # short on both ends rather than spending the platform's grace period.
      timeout: 5s
      retries: 4
      start_period: 5s
    read_only: true
    tmpfs:
      - /run

networks:
  default: {}
  # Created by host_prep, never by this project: Dozzle's alert-relay joins it too.
  alert-bridge:
    external: true
    name: ${PLATFORM_ALERT_RELAY_NETWORK:?}
