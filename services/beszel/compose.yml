# Platform fragments. Compose resolves a YAML anchor only inside the file that
# declares it, so every stack carries its own copy; tests/policy_test.rb pins the
# copies equal and records there why cross-file sharing was not taken. A
# container needing different health-check timing overrides only the fields it
# changes, so a deviation reads as a deviation.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-service-defaults: &service-defaults
  cpuset: ${PLATFORM_CONTAINER_CPUSET:?}
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *default-logging

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 60s

services:
  hub:
    <<: *service-defaults
    container_name: beszel
    image: ghcr.io/henrygd/beszel/beszel:0.18.8@sha256:99181067e5a46b3147231f456114280a8119eed371808bce79e6e7f173946975
    cpus: 1.0
    labels:
      dev.dozzle.group: beszel
      dev.dozzle.name: hub
    ports:
      - "8090:8090"
    volumes:
      # Holds the PocketBase database and id_ed25519. That keypair is authored in
      # vault and written here before first start, so the agent's KEY is known in
      # advance and nothing has to be read back from a running hub.
      - ${NAS_DOCKER_ROOT:?}/beszel/hub:/beszel_data
    environment:
      APP_URL: ${BESZEL_APP_URL:?}
      TZ: ${TZ:?}
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD, /beszel, health, --url, "http://localhost:8090"]
      # Both agents gate their own start on this container reporting healthy, so
      # the grace period is what the whole stack waits before it is told the hub
      # is up. The hub is listening in about a second; the platform's 60s would
      # only postpone that answer.
      retries: 4
      start_period: 5s
    # The hub writes every incoming metric into the PocketBase database in
    # /beszel_data, which is recovery: critical and also holds the keypair
    # placed there before first start. 30s lets the open transaction commit.
    # The agents get no window: they hold a cache and reconnect.
    stop_grace_period: 30s

  agent-portable:
    <<: *service-defaults
    container_name: beszel_agent_portable
    image: ghcr.io/henrygd/beszel/beszel-agent:0.18.8@sha256:0f0c8939e7ed95707bd8a8da47fd20a7f1a61c2eebbe3b5eb82422486df1f2bf
    cpus: 0.5
    labels:
      dev.dozzle.group: beszel
      dev.dozzle.name: agent-portable
    depends_on:
      hub:
        condition: service_healthy
      socket-proxy:
        condition: service_healthy
    volumes:
      - ${NAS_DOCKER_ROOT:?}/beszel/agent:/var/lib/beszel-agent
      - ${NAS_DOCKER_ROOT:?}/beszel/volume1:/extra-filesystems/volume1:ro
      - ${NAS_MEDIA_ROOT:?}/.beszel:/extra-filesystems/volume2:ro
    environment:
      DISABLE_SSH: "true"
      DOCKER_HOST: tcp://socket-proxy:2375
      FILESYSTEM: /extra-filesystems/volume1
      HUB_URL: http://hub:8090
      KEY: ${BESZEL_AGENT_KEY:?}
      SYSTEM_NAME: ${BESZEL_SYSTEM_NAME:?}
      TOKEN: ${BESZEL_AGENT_TOKEN:?}
      TZ: ${TZ:?}
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD, /agent, health]
      # Deviation carried over unchanged from before the defaults existed; the
      # repository records no reason for it, and a de-duplication is not where a
      # readiness window gets renegotiated.
      retries: 4
      start_period: 10s

  agent-intel:
    <<: *service-defaults
    container_name: beszel_agent
    image: ghcr.io/henrygd/beszel/beszel-agent-intel:0.18.8@sha256:fdbb316e2b1366844f8e8926a3f8e8166ab0b7a10309c0f6aa6281f82c5c136a
    cpus: 0.5
    labels:
      dev.dozzle.group: beszel
      dev.dozzle.name: agent-intel
    # Host networking is a monitoring compatibility exception: the agent must
    # observe the NAS network interfaces rather than only its own namespace. Its
    # SSH server is disabled, it publishes no port, and it dials the hub outbound.
    network_mode: host
    cap_add:
      - CAP_PERFMON
    devices:
      - ${NAS_RENDER_DEVICE:?}:${NAS_RENDER_DEVICE:?}
    depends_on:
      hub:
        condition: service_healthy
      socket-proxy:
        condition: service_healthy
    volumes:
      - ${NAS_DOCKER_ROOT:?}/beszel/agent:/var/lib/beszel-agent
      - ${NAS_DOCKER_ROOT:?}/beszel/volume1:/extra-filesystems/volume1:ro
      - ${NAS_MEDIA_ROOT:?}/.beszel:/extra-filesystems/volume2:ro
    environment:
      DISABLE_SSH: "true"
      DOCKER_HOST: tcp://127.0.0.1:2375
      EXCLUDE_SMART: /dev/md0,/dev/md126
      FILESYSTEM: /extra-filesystems/volume1
      HUB_URL: http://127.0.0.1:8090
      INTEL_GPU_DEVICE: drm:${NAS_RENDER_DEVICE:?}
      KEY: ${BESZEL_AGENT_KEY:?}
      SYSTEM_NAME: ${BESZEL_SYSTEM_NAME:?}
      TOKEN: ${BESZEL_AGENT_TOKEN:?}
      TZ: ${TZ:?}
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD, /agent, health]
      # Deviation carried over unchanged from before the defaults existed; the
      # repository records no reason for it, and a de-duplication is not where a
      # readiness window gets renegotiated.
      retries: 4
      start_period: 10s

  socket-proxy:
    <<: *service-defaults
    container_name: beszel_socket_proxy
    # The only Docker socket reader. Read-only access with mutation refused, and
    # never published beyond loopback.
    image: lscr.io/linuxserver/socket-proxy:3.4.4@sha256:cba12c42b1df30a6446856028f5ab726e9d8921f1ea74be509216c5e41357d42
    cpus: 0.5
    labels:
      dev.dozzle.group: beszel
      dev.dozzle.name: socket-proxy
    ports:
      - "127.0.0.1:2375:2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: "1"
      EVENTS: "0"
      POST: "0"
      TZ: ${TZ:?}
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD-SHELL, "wget -q -O - http://127.0.0.1:2375/_ping | grep -qx OK"]
      # Both agents gate their own start on this container reporting healthy. It
      # answers /_ping over loopback the moment it is listening, so the check is
      # short on both ends rather than spending the platform's grace period.
      timeout: 5s
      retries: 4
      start_period: 5s
    read_only: true
    tmpfs:
      - /run
