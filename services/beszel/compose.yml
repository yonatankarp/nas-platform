# Platform fragments: anchors are file-local, so each stack carries a copy that
# tests/policy_test.rb pins equal. Overrides change only the fields that differ.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-service-defaults: &service-defaults
  cpuset: ${PLATFORM_CONTAINER_CPUSET:?}
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *default-logging

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 60s

services:
  hub:
    <<: *service-defaults
    container_name: beszel
    image: ghcr.io/henrygd/beszel/beszel:0.20.0@sha256:c44c2c25929505930c8bb850556c8e071dd00d42ea367d9b53243ef64bd57d17
    cpus: 1.0
    labels:
      dev.dozzle.group: beszel
      dev.dozzle.name: hub
    ports:
      - "8090:8090"
    # default must be named too, or the agents lose hub:8090.
    networks:
      - default
      - alert-bridge
    volumes:
      # Holds the vault-authored keypair, placed before first start.
      - ${NAS_DOCKER_ROOT:?}/beszel/hub:/beszel_data
    environment:
      APP_URL: ${BESZEL_APP_URL:?}
      TZ: ${TZ:?}
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD, /beszel, health, --url, "http://localhost:8090"]
      # Both agents wait on this; the hub listens in about a second.
      retries: 4
      start_period: 5s
    # 30s lets the open PocketBase transaction commit (recovery: critical).
    stop_grace_period: 30s

  agent-portable:
    <<: *service-defaults
    container_name: beszel_agent_portable
    image: ghcr.io/henrygd/beszel/beszel-agent:0.20.0@sha256:2c3b2d781a8bcdb464704c0024baab5486d238d40871b67c84d906d34791c490
    cpus: 0.5
    labels:
      dev.dozzle.group: beszel
      dev.dozzle.name: agent-portable
    depends_on:
      hub:
        condition: service_healthy
      socket-proxy:
        condition: service_healthy
    # docker-api is shared with the proxy alone (#829); default keeps hub:8090.
    networks:
      - default
      - docker-api
    volumes:
      - ${NAS_DOCKER_ROOT:?}/beszel/agent:/var/lib/beszel-agent
      - ${NAS_DOCKER_ROOT:?}/beszel/volume1:/extra-filesystems/volume1:ro
      - ${NAS_MEDIA_ROOT:?}/.beszel:/extra-filesystems/volume2:ro
    environment:
      DISABLE_SSH: "true"
      DOCKER_HOST: tcp://socket-proxy:2375
      FILESYSTEM: /extra-filesystems/volume1
      HUB_URL: http://hub:8090
      KEY: ${BESZEL_AGENT_KEY:?}
      SYSTEM_NAME: ${BESZEL_SYSTEM_NAME:?}
      TOKEN: ${BESZEL_AGENT_TOKEN:?}
      TZ: ${TZ:?}
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD, /agent, health]
      # Inherited deviation with no recorded reason; not renegotiated here.
      retries: 4
      start_period: 10s

  agent-intel:
    <<: *service-defaults
    container_name: beszel_agent
    image: ghcr.io/henrygd/beszel/beszel-agent-intel:0.20.0@sha256:00882dcb1708f1ca09487b21781c454138f88949b14b2685e3d30d3747f7aecf
    cpus: 0.5
    labels:
      dev.dozzle.group: beszel
      dev.dozzle.name: agent-intel
    # Host networking so the agent sees the NAS interfaces; no SSH, no published port.
    network_mode: host
    cap_add:
      - CAP_PERFMON
      # S.M.A.R.T.: smartctl's SG_IO passthrough to the SATA disks needs RAWIO.
      - CAP_SYS_RAWIO
      # NVMe admin passthrough; broad, accepted to monitor /volume1's NVMe pair (#607).
      # Drop it with the NVMe slots, never alone.
      - CAP_SYS_ADMIN
    # Slots come from inventory/group_vars/nas_hosts/main.yml, asserted by roles/beszel.
    # `:r` only refuses a write-open: RAWIO SG_IO and NVMe admin can still write.
    devices:
      - ${NAS_RENDER_DEVICE:?}:${NAS_RENDER_DEVICE:?}
      # SATA bays: base devices, never partitions (beszel-docs guide/smart-data).
      - ${NAS_SMART_SATA_DEVICE_1:?}:${NAS_SMART_SATA_DEVICE_1:?}:r
      - ${NAS_SMART_SATA_DEVICE_2:?}:${NAS_SMART_SATA_DEVICE_2:?}:r
      - ${NAS_SMART_SATA_DEVICE_3:?}:${NAS_SMART_SATA_DEVICE_3:?}:r
      # NVMe: host namespace mapped onto the controller name (henrygd/beszel#1637).
      - ${NAS_SMART_NVME_NAMESPACE_1:?}:/dev/nvme0:r
      - ${NAS_SMART_NVME_NAMESPACE_2:?}:/dev/nvme1:r
    depends_on:
      hub:
        condition: service_healthy
      socket-proxy:
        condition: service_healthy
    volumes:
      - ${NAS_DOCKER_ROOT:?}/beszel/agent:/var/lib/beszel-agent
      - ${NAS_DOCKER_ROOT:?}/beszel/volume1:/extra-filesystems/volume1:ro
      - ${NAS_MEDIA_ROOT:?}/.beszel:/extra-filesystems/volume2:ro
    environment:
      DISABLE_SSH: "true"
      DOCKER_HOST: tcp://127.0.0.1:2375
      # md arrays are found via /sys/block, not the devices above; md1/md2 stay in so a
      # degraded array pages.
      EXCLUDE_SMART: /dev/md0,/dev/md126
      FILESYSTEM: /extra-filesystems/volume1
      HUB_URL: http://127.0.0.1:8090
      INTEL_GPU_DEVICE: drm:${NAS_RENDER_DEVICE:?}
      KEY: ${BESZEL_AGENT_KEY:?}
      SYSTEM_NAME: ${BESZEL_SYSTEM_NAME:?}
      TOKEN: ${BESZEL_AGENT_TOKEN:?}
      TZ: ${TZ:?}
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD, /agent, health]
      # Inherited deviation with no recorded reason; not renegotiated here.
      retries: 4
      start_period: 10s

  socket-proxy:
    <<: *service-defaults
    container_name: beszel_socket_proxy
    # Serves every container's environment, i.e. every rendered .env (#829), so it is
    # kept off default where the wildcard-bound hub could reach it.
    image: lscr.io/linuxserver/socket-proxy:3.4.6@sha256:0357c479cc98e863917d1cd8b10e83d35a50ca46a0788f5a192bf792c3b7100d
    cpus: 0.5
    labels:
      dev.dozzle.group: beszel
      dev.dozzle.name: socket-proxy
    # docker-api-publish exists only so Docker will publish the loopback port below.
    networks:
      - docker-api
      - docker-api-publish
    # agent-intel's only route (host networking). Any NAS process can read container
    # environments through it; a unix socket would close that (#829).
    ports:
      - "127.0.0.1:2375:2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: "1"
      EVENTS: "0"
      POST: "0"
      TZ: ${TZ:?}
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD-SHELL, "wget -q -O - http://127.0.0.1:2375/_ping | grep -qx OK"]
      # Both agents wait on this; it answers /_ping as soon as it listens.
      timeout: 5s
      retries: 4
      start_period: 5s
    read_only: true
    tmpfs:
      - /run

networks:
  default: {}
  # Created by host_prep, never by this project: Dozzle's alert-relay joins it too.
  alert-bridge:
    external: true
    name: ${PLATFORM_ALERT_RELAY_NETWORK:?}
  docker-api:
    internal: true
  docker-api-publish: {}
