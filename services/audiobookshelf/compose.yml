---
# Platform fragments: Compose anchors are file-local, so every stack carries a
# copy that tests/policy_test.rb pins equal.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-service-defaults: &service-defaults
  cpuset: ${PLATFORM_CONTAINER_CPUSET:?}
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *default-logging

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 60s

services:
  audiobookshelf:
    <<: *service-defaults
    container_name: audiobookshelf
    image: ghcr.io/advplyr/audiobookshelf:2.37.0@sha256:6432d1dc58951b0280b29144ffc69834a8ae02786a2126f6b7c9bd453801c78b
    cpus: 1.5
    labels:
      dev.dozzle.name: audiobookshelf
    user: "${NAS_UID:?}:${NAS_GID:?}"
    ports:
      - "13378:80"
    volumes:
      - ${AUDIOBOOKSHELF_CONFIG_PATH:?}:/config
      - ${AUDIOBOOKSHELF_METADATA_PATH:?}:/metadata
      - ${AUDIOBOOKSHELF_MEDIA_PATH:?}:/audiobooks:ro
      - ${AUDIOBOOKSHELF_BACKUP_PATH:?}:/metadata/backups
    environment:
      TZ: ${TZ:?}
    networks:
      - default
      - media-control
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://localhost:80/healthcheck]
      # Carried-over deviation with no recorded reason.
      retries: 4
      start_period: 30s
    # Listening progress lives in SQLite; 30s commits the open transaction and
    # checkpoints the WAL.
    stop_grace_period: 30s

networks:
  default: {}
  media-control:
    external: true
    name: ${PLATFORM_MEDIA_NETWORK:?}
