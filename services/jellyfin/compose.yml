---
# Platform fragments. Compose resolves a YAML anchor only inside the file that
# declares it, so every stack carries its own copy; tests/policy_test.rb pins the
# copies equal and records there why cross-file sharing was not taken. A
# container needing different health-check timing overrides only the fields it
# changes, so a deviation reads as a deviation.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-service-defaults: &service-defaults
  cpuset: ${PLATFORM_CONTAINER_CPUSET:?}
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *default-logging

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 60s

services:
  jellyfin:
    <<: *service-defaults
    container_name: jellyfin
    # THIS IMAGE MIGRATES ITS OWN STORE. 12.0 made playlists and collections
    # relational behind a new LinkedChildren table, turned OwnerId and
    # PrimaryVersionId into real GUID foreign keys, dropped ExtraIds, and runs
    # cleanup migrations over the existing rows on first boot. Upstream states it
    # plainly: the release "includes database changes that prevent rolling back
    # without a full restore". So a bump is one-way. renovate.json withholds its
    # major, minor and patch updates from automerge, and roles/image_downgrade_guard
    # refuses a pin older than one that has already run here.
    #
    # Unlike Bindery, nothing proves this bump before the merge: the `upgrade`
    # integration lane is the only one that starts from a store a previous version
    # wrote, and Jellyfin is not one of its subjects -- there is no
    # tests/contracts/jellyfin-upgrade.rb. Every other lane creates /config empty
    # and takes the fresh-install path, so a green run says 12.1 installs clean and
    # says nothing about 10.11.11 -> 12.1.
    #
    # THE TAG IS TWO-PART ON PURPOSE, and it is the fix for a silent freeze rather
    # than a style choice. Renovate's docker versioning matches candidate tags at
    # the precision of the current one, so the previous three-part 10.11.11 could
    # never be offered 12.0 or 12.1, and the pin sat unproposed from 2026-09-08
    # while the dependency dashboard listed it as detected with no update. The
    # date-stamped 12.1.20260915-010956 would re-freeze it the same way -- three
    # parts plus an 010956 suffix the current value does not carry -- so the
    # two-part tag is what keeps 12.2 and 13.0 arriving as pull requests.
    image: docker.io/jellyfin/jellyfin:12.1@sha256:78d3ea1207d1322471fcac39a614f004f2ccf7e878f95ab2977d752f07e4dd7e
    cpus: 3.0
    labels:
      dev.dozzle.name: jellyfin
    user: "${NAS_UID:?}:${NAS_GID:?}"
    # The NAS render node is owned by root, so opening it needs the root group
    # as a supplementary group. The process itself still runs as the platform
    # identity.
    group_add:
      - "0"
    ports:
      - "8096:8096/tcp"
    volumes:
      - ${JELLYFIN_CONFIG_PATH:?}:/config
      - ${JELLYFIN_CACHE_PATH:?}:/cache
      # Read-only on purpose: media writers own adjacent metadata while
      # Jellyfin remains read-only alongside the media.
      - ${JELLYFIN_MEDIA_PATH:?}:/media:ro
    environment:
      TZ: ${TZ:?}
    networks:
      - default
      - media-control
    # Intel Quick Sync on the NAS. This is the production capability; platforms
    # without a render node remove it in their override and transcode on CPU.
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD, curl, --fail, --silent, --show-error, "http://localhost:8096/health"]
      # Deviation carried over unchanged from before the defaults existed; the
      # repository records no reason for it, and a de-duplication is not where a
      # readiness window gets renegotiated.
      retries: 4
      start_period: 30s
    # Long enough to finish an in-flight transcode and flush the library
    # database instead of being killed mid-write.
    stop_grace_period: 1m

networks:
  default: {}
  media-control:
    external: true
    name: ${PLATFORM_MEDIA_NETWORK:?}
