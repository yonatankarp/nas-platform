---
# Platform fragments: Compose anchors are file-local, so every stack carries a
# copy that tests/policy_test.rb pins equal.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-service-defaults: &service-defaults
  cpuset: ${PLATFORM_CONTAINER_CPUSET:?}
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *default-logging

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 60s

services:
  jellyfin:
    <<: *service-defaults
    container_name: jellyfin
    # THIS IMAGE MIGRATES ITS OWN STORE: 12.0's migrations cannot be rolled back
    # without a full restore, so a bump is one-way (renovate.json, image_downgrade_guard).
    # The tag is two-part on purpose: Renovate matches tag precision (see CLAUDE.md).
    image: docker.io/jellyfin/jellyfin:12.1@sha256:78d3ea1207d1322471fcac39a614f004f2ccf7e878f95ab2977d752f07e4dd7e
    cpus: 3.0
    labels:
      dev.dozzle.name: jellyfin
    user: "${NAS_UID:?}:${NAS_GID:?}"
    # The render node is root-owned; the process still runs as the platform identity.
    group_add:
      - "0"
    ports:
      - "8096:8096/tcp"
    volumes:
      - ${JELLYFIN_CONFIG_PATH:?}:/config
      - ${JELLYFIN_CACHE_PATH:?}:/cache
      # Read-only on purpose: media writers own adjacent metadata while
      # Jellyfin remains read-only alongside the media.
      - ${JELLYFIN_MEDIA_PATH:?}:/media:ro
    environment:
      TZ: ${TZ:?}
    networks:
      - default
      - media-control
    # Intel Quick Sync; overrides without a render node remove it and use CPU.
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD, curl, --fail, --silent, --show-error, "http://localhost:8096/health"]
      # Carried-over deviation with no recorded reason.
      retries: 4
      start_period: 30s
    # Long enough to finish an in-flight transcode and flush the library
    # database instead of being killed mid-write.
    stop_grace_period: 1m

networks:
  default: {}
  media-control:
    external: true
    name: ${PLATFORM_MEDIA_NETWORK:?}
