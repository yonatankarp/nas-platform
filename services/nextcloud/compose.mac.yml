---
services:
  nextcloud:
    container_name: ${PLATFORM_PROJECT_NAME:?}-nextcloud
    ports: !override
      - "${NEXTCLOUD_HOST_PORT:?}:80"
    volumes: !override
      - ${NEXTCLOUD_DATA_PATH:?}:/var/www/html

  # Restated because !override replaces the list: without it cron would run
  # against an empty /var/www/html.
  cron:
    container_name: ${PLATFORM_PROJECT_NAME:?}-nextcloud-cron
    volumes: !override
      - ${NEXTCLOUD_DATA_PATH:?}:/var/www/html

  db:
    container_name: ${PLATFORM_PROJECT_NAME:?}-nextcloud-db
    volumes: !override
      - ${NEXTCLOUD_POSTGRES_PATH:?}:/var/lib/postgresql

  # The cache persists nothing, so the container name is the whole override.
  cache:
    container_name: ${PLATFORM_PROJECT_NAME:?}-nextcloud-cache
