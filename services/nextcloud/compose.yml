---
# Platform fragments: an anchor resolves only in its own file, so each stack
# carries a copy; tests/policy_test.rb keeps the copies equal.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-service-defaults: &service-defaults
  cpuset: ${PLATFORM_CONTAINER_CPUSET:?}
  # Application, cron and Postgres drop privileges with setuid(2), which
  # no_new_privs does not restrict; nothing here execs a setuid binary afterwards.
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *default-logging

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 60s

services:
  nextcloud:
    <<: *service-defaults
    container_name: nextcloud
    # Apache variant because fpm needs a web server in front and this platform runs
    # no reverse proxy. Exact version rather than a channel tag.
    image: docker.io/library/nextcloud:35.0.1-apache@sha256:276547e033df451770dbf9c0065929e5ea179a613b1884bd3fa807ba1c2703e7
    cpus: 2.0
    labels:
      dev.dozzle.group: nextcloud
      dev.dozzle.name: nextcloud
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    # Plain HTTP like every published port here: no TLS termination on the LAN.
    ports:
      - "8084:80"
    # The cron container mounts the identical source at the identical target: it
    # runs the same installation's cron.php.
    volumes:
      - ${NEXTCLOUD_DATA_PATH:?}:/var/www/html
    environment:
      TZ: ${TZ:?}
      # ------------------------------------------------------------------
      # INSTALL ONLY: the entrypoint runs its init block only while the volume has no
      # version.php, so changing these on a converged deployment is a silent no-op.
      # ------------------------------------------------------------------
      POSTGRES_HOST: db
      POSTGRES_DB: ${NEXTCLOUD_DB_NAME:?}
      POSTGRES_USER: ${NEXTCLOUD_DB_USERNAME:?}
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USERNAME:?}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?}
      # Also reconciled by occ later; set here so the first boot already trusts the
      # published addresses. The install prepends `localhost` itself.
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:?}
      # MUST BE SET ON THE FIRST CONVERGE. With PostgreSQL the installer otherwise
      # sees a role-creating account, replaces it with a generated `oc_admin` user
      # and password nothing here can reproduce, and writes those into config.php.
      # The install branch never runs again, so adding it later changes nothing;
      # recovery is manual (occ dbuser/dbpassword, drop the stray role). Never remove it.
      NC_setup_create_db_user: "false"
      # ------------------------------------------------------------------
      # EVERY READ: NC_* overrides are consulted before config.php and never written
      # back, so rotating these is an ordinary converge. Array settings cannot be
      # carried this way: NC_trusted_domains makes every request answer HTTP 400.
      # ------------------------------------------------------------------
      NC_dbhost: db
      NC_dbname: ${NEXTCLOUD_DB_NAME:?}
      NC_dbuser: ${NEXTCLOUD_DB_USERNAME:?}
      NC_dbpassword: ${NEXTCLOUD_DB_PASSWORD:?}
      # Rebuilt from these on every start, so a rotated cache password just converges.
      # Valkey is a drop-in Redis.
      REDIS_HOST: cache
      REDIS_HOST_PORT: "6379"
      REDIS_HOST_PASSWORD: ${NEXTCLOUD_CACHE_PASSWORD:?}
      # Used for URLs cron.php and occ build without a request; otherwise localhost.
      OVERWRITEPROTOCOL: http
      OVERWRITECLIURL: ${NEXTCLOUD_OVERWRITE_CLI_URL:?}
      # Declared, not self-sized (PHP reads ini, not the host), so no mem_limit here.
      PHP_MEMORY_LIMIT: ${NEXTCLOUD_PHP_MEMORY_LIMIT:?}
    healthcheck:
      <<: *healthcheck-defaults
      # /status.php answers 200 with "installed":false during install, and 500 with
      # Postgres down, so requiring "installed":true covers both ends.
      test: [CMD-SHELL, "curl --fail --silent http://localhost/status.php | grep -q '\"installed\":true'"]
      # Pinned because the arithmetic below depends on it (Docker 25.0+).
      start_interval: 5s
      # First boot rsyncs the whole tree into the mount (51s measured on a laptop SSD);
      # 300s leaves room for the NAS. Ceiling 300 + 4x30 = 420s, which
      # nextcloud_compose_wait_timeout must exceed so Docker's own message names the container.
      start_period: 300s
    # Sized for `occ upgrade` on an image bump: killing it midway is a restore.
    stop_grace_period: 2m

  cron:
    <<: *service-defaults
    container_name: nextcloud-cron
    # Must equal the application's image: both run the code in the shared volume.
    # This image migrates its own store; renovate.json withholds its majors.
    image: docker.io/library/nextcloud:35.0.1-apache@sha256:276547e033df451770dbf9c0065929e5ea179a613b1884bd3fa807ba1c2703e7
    cpus: 1.0
    labels:
      dev.dozzle.group: nextcloud
      dev.dozzle.name: cron
    depends_on:
      nextcloud:
        condition: service_healthy
    # /cron.sh just execs busybox crond (www-data crontab runs cron.php every 5 min);
    # AJAX background jobs would never run on an idle instance.
    entrypoint: /cron.sh
    volumes:
      - ${NEXTCLOUD_DATA_PATH:?}:/var/www/html
    environment:
      TZ: ${TZ:?}
    healthcheck:
      <<: *healthcheck-defaults
      # crond is PID 1, so its death stops the container. This checks what cron.php
      # needs: the installation visible and the database reachable. bash for /dev/tcp.
      test: [CMD, bash, -ec, "test -f /var/www/html/occ && exec 3<>/dev/tcp/db/5432"]
      # Nothing to install, so the long application start_period would only delay.
      start_period: 30s
    # Both keys are needed: the image's STOPSIGNAL is SIGWINCH (ignored), and crond
    # as PID 1 gets no default disposition either, so stops ended in exit 137.
    init: true
    stop_signal: SIGTERM
    # A ceiling, not a window for a job to finish: crond exits on the signal.
    stop_grace_period: 30s

  db:
    <<: *service-defaults
    container_name: nextcloud-db
    # Same Postgres as Paperless, sharing its major-version story in renovate.json.
    image: docker.io/library/postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    cpus: 2.0
    labels:
      dev.dozzle.group: nextcloud
      dev.dozzle.name: db
    # /var/lib/postgresql, not .../data: PG18's PGDATA is a versioned directory
    # beneath it, so one level deeper would miss the cluster (data-loss shape).
    volumes:
      - ${NEXTCLOUD_POSTGRES_PATH:?}:/var/lib/postgresql
    # Used only on an empty data directory; NC_setup_create_db_user keeps them in use.
    environment:
      TZ: ${TZ:?}
      POSTGRES_DB: ${NEXTCLOUD_DB_NAME:?}
      POSTGRES_USER: ${NEXTCLOUD_DB_USERNAME:?}
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?}
    healthcheck:
      <<: *healthcheck-defaults
      # The stack's own database and role, so a wrong credential is not ready.
      # $$ is Compose escaping: resolved inside the container.
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    # SIGINT is a fast shutdown ending in a checkpoint; a kill means WAL recovery.
    stop_grace_period: 2m

  cache:
    <<: *service-defaults
    container_name: nextcloud-cache
    image: docker.io/valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    cpus: 0.5
    labels:
      dev.dozzle.group: nextcloud
      dev.dozzle.name: cache
    # Named because `command: sh` stops the entrypoint dropping to valkey itself.
    user: valkey
    environment:
      TZ: ${TZ:?}
      VALKEY_PASSWORD: ${NEXTCLOUD_CACHE_PASSWORD:?}
    # Password via environment, not argv, so it stays out of the process table.
    # Persistence off: a failed RDB save would otherwise refuse writes.
    command:
      - sh
      - -c
      - exec valkey-server --requirepass "$$VALKEY_PASSWORD" --save "" --appendonly no
    healthcheck:
      <<: *healthcheck-defaults
      # Match PONG: valkey-cli exits 0 on NOAUTH and WRONGPASS too.
      test:
        - CMD-SHELL
        - valkey-cli --no-auth-warning -a "$$VALKEY_PASSWORD" ping | grep -q '^PONG$$'
    # Nextcloud keeps file locks here, so let in-flight replies finish.
    stop_grace_period: 30s
