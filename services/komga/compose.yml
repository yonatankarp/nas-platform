---
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  komga:
    container_name: komga
    image: docker.io/gotson/komga:1.26.1@sha256:e109902ebebb8a05f633f48d84a2ac7bb1334bf0f6fbc17262a333082c7de44d
    labels:
      dev.dozzle.name: komga
    user: "1000:100"
    ports:
      - "25600:25600"
    volumes:
      - ${KOMGA_CONFIG_PATH:?}:/config
      - ${KOMGA_LIBRARY_PATH:?}:/data:ro
    environment:
      TZ: ${TZ:?}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$$(/usr/bin/curl --fail --silent --show-error
          http://127.0.0.1:25600/actuator/health)" = '{"status":"UP"}'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    logging: *default-logging
