---
# Platform fragments: anchors are file-local; tests/policy_test.rb pins the copies.
# Overrides change only the fields that differ.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-service-defaults: &service-defaults
  cpuset: ${PLATFORM_CONTAINER_CPUSET:?}
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *default-logging

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 60s

services:
  komga:
    <<: *service-defaults
    container_name: komga
    image: docker.io/gotson/komga:1.28.1@sha256:d8f772dce7b3dcd8baa0ce7481bd890e68446065ab6c8eb2cb5b24df62fb3c4f
    cpus: 1.5
    labels:
      dev.dozzle.name: komga
    user: "${NAS_UID:?}:${NAS_GID:?}"
    ports:
      - "25600:25600"
    volumes:
      - ${KOMGA_CONFIG_PATH:?}:/config
      - ${KOMGA_LIBRARY_PATH:?}:/data:ro
    environment:
      TZ: ${TZ:?}
    healthcheck:
      <<: *healthcheck-defaults
      test:
        - CMD-SHELL
        - >-
          test "$$(/usr/bin/curl --fail --silent --show-error
          http://127.0.0.1:25600/actuator/health)" = '{"status":"UP"}'
    # 30s covers the library database commit and index flush; scans resume on start.
    stop_grace_period: 30s
