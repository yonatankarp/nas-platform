---
services:
  adguard:
    container_name: ${PLATFORM_PROJECT_NAME:?}-adguard
    # The one integration override in this repository that moves a port, and the
    # reason is the same shape as the `devices: !override []` that Immich and
    # Jellyfin carry here: the sandbox host cannot supply what production
    # declares. A CI runner already resolves through systemd-resolved, whose stub
    # listener holds 127.0.0.53:53, and a publication of 0.0.0.0:53 overlaps it;
    # whether the two binds are permitted depends on SO_REUSEADDR on both
    # sockets, which is not a property this lane should be betting a converge on.
    #
    # Literals rather than ${...} references, and deliberately: the host side of
    # a publication in services/adguard/compose.yml has to be a literal for
    # tests/media_acquisition_foundation_test.rb to parse it, and keeping the
    # sandbox's ports literal here means the lane can hand the contract its port
    # numbers without a second inventory override travelling through
    # tests/integration_controller_lib.sh to reach the .env.
    #
    # 18083 and 15353 are the production numbers moved out of the privileged and
    # already-occupied ranges; both must agree with the PLATFORM_ADGUARD_PORT and
    # PLATFORM_ADGUARD_DNS_PORT the lane exports in
    # tests/integration_controller_lib.sh.
    ports: !override
      - "18083:3000"
      - "15353:5353/tcp"
      - "15353:5353/udp"
