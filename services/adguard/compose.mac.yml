---
services:
  adguard:
    container_name: ${PLATFORM_PROJECT_NAME:?}-adguard
    # The Mac lane runs several isolated copies of the platform on a laptop that
    # already has a resolver, so neither the production web port nor the
    # privileged 53 is available to it. Both host sides therefore come from the
    # rendered environment rather than from a literal.
    #
    # services/adguard/compose.integration.yml is now the same shape for the
    # same reason, and it carries the measurement that says why the sandbox
    # cannot simply publish 53.
    #
    # BOTH ARE ALLOCATED, and this file may now be read as though something
    # does. MAC_SERVICE_PORT_ORDER in tests/mac/lib.sh names `adguard` and
    # `adguard_dns` -- a roster entry is a port name rather than a service, which
    # is what lets one service claim two -- so tests/mac/run.sh asks the kernel
    # for two free ephemeral ports, tests/mac/report.rb records them,
    # inventory/group_vars/mac_hosts/main.yml reads them back into `adguard_port`
    # and `adguard_dns_port`, roles/adguard/templates/env.j2 renders those into
    # the two names below, and every Mac hook group deploys, verifies and
    # recreates the service rather than exempting it. The lane asks for the stack
    # explicitly with `-e adguard_deployment_enabled=true` in
    # mac_ansible_playbook, even though the platform default is now true, for the
    # #295 reason that line records.
    #
    # THE PRIVILEGED PORT IS NEVER PUBLISHED HERE. The whole of the production
    # publication -- 8083 and 53/tcp+udp -- exists only in
    # services/adguard/compose.yml, and this override replaces the list outright.
    # An ephemeral pair is what a laptop with its own resolver can hold, and a
    # literal here would be a second authority on where the service listens that
    # roles/adguard cannot see; tests/contracts/adguard-static.rb refuses one in
    # either disposable override.
    ports: !override
      - "${ADGUARD_HOST_PORT:?}:3000"
      - "${ADGUARD_DNS_HOST_PORT:?}:5353/tcp"
      - "${ADGUARD_DNS_HOST_PORT:?}:5353/udp"
