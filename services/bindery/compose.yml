---
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 60s

services:
  # Ebook/audiobook acquisition. It resolves Prowlarr and SABnzbd by name at write time,
  # so it joins media-control and converges after arr and downloaders.
  bindery:
    container_name: bindery
    image: ghcr.io/vavallee/bindery:v1.39.1@sha256:bc9442016e80f8fc29db394a826ecae6e706b908967dc1a3b0b82ee32774fa26
    cpuset: ${PLATFORM_CONTAINER_CPUSET:?}
    cpus: 1.0
    labels:
      dev.dozzle.name: bindery
    # Distroless: no shell, root phase or gosu, so identity arrives only through `user:`.
    # BINDERY_PUID/PGID are checked at startup (exit 1 on mismatch), not remapped.
    user: "${NAS_UID:?}:${NAS_GID:?}"
    ports:
      - "8787:8787"
    # One bind mount of the common share so an import is a rename (rename(2) cannot cross
    # mounts); container paths match SABnzbd's, so no path remap is needed.
    volumes:
      - ${BINDERY_CONFIG_PATH:?}:/config
      - ${BINDERY_BOOKS_PATH:?}:/data/books
      - ${BINDERY_MEDIA_PATH:?}:/data/media
    environment:
      TZ: ${TZ:?}
      BINDERY_PUID: ${NAS_UID:?}
      BINDERY_PGID: ${NAS_GID:?}
      # Seeds the API key on first boot, closing the anonymous setup window.
      BINDERY_API_KEY: ${BINDERY_API_KEY:?}
      # Omitting either audiobook variable silently merges the two libraries.
      BINDERY_LIBRARY_DIR: /data/books/Ebooks
      BINDERY_AUDIOBOOK_DIR: /data/media/Audiobooks
      BINDERY_DOWNLOAD_DIR: /data/books/.acquisition/usenet/ebooks
      BINDERY_AUDIOBOOK_DOWNLOAD_DIR: /data/media/.acquisition/usenet/audiobooks
      # Takes effect before the first daily ping; the role also reconciles the setting.
      BINDERY_TELEMETRY_DISABLED: "true"
      # URL_BASE and TRUSTED_PROXY unset: an over-broad proxy entry disables login rate limits.
    healthcheck:
      # Distroless, so the probe is the binary's own subcommand (unauthenticated /api/v1/health).
      <<: *healthcheck-defaults
      test: [CMD, /bindery, healthcheck]
    security_opt:
      - no-new-privileges:true
    # Stop grace: Docker's default, stated; the upgrade lane requires exit 0/143 inside it
    # (#781, #696). SQLite stays crash-safe if a stop is cut short.
    stop_grace_period: 10s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - default
      - media-control

networks:
  default: {}
  media-control:
    external: true
    name: ${PLATFORM_MEDIA_NETWORK:?}
