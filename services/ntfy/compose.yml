# Platform fragments. Compose resolves a YAML anchor only inside the file that
# declares it, so every stack carries its own copy; tests/policy_test.rb pins the
# copies equal and records there why cross-file sharing was not taken. A
# container needing different health-check timing overrides only the fields it
# changes, so a deviation reads as a deviation.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-service-defaults: &service-defaults
  cpuset: ${PLATFORM_CONTAINER_CPUSET:?}
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *default-logging

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 60s

services:
  ntfy:
    <<: *service-defaults
    container_name: ntfy
    image: docker.io/binwiederhier/ntfy:v2.28.0@sha256:6ef4b819f722fccdc036af611c4774cfdc2de821ab74fdd48bbf4c9d6f8973da
    cpus: 1.0
    labels:
      dev.dozzle.name: ntfy
    command:
      - serve
    user: "${NAS_UID:?}:${NAS_GID:?}"
    # Nothing here can consume a capability. `user:` above makes PID 1
    # unprivileged, so the kernel already reports CapPrm and CapEff empty and
    # only the bounding set is left to clear, and this image carries no
    # file-capability binary whose exec a cleared bounding set would refuse.
    # Both halves were measured, not assumed; see issue #196.
    cap_drop: [ALL]
    ports:
      - "2586:80"
    volumes:
      - ${NAS_DOCKER_ROOT:?}/ntfy/cache:/var/cache/ntfy
      - ${NAS_DOCKER_ROOT:?}/ntfy/data:/var/lib/ntfy
    environment:
      NTFY_ATTACHMENT_CACHE_DIR: /var/cache/ntfy/attachments
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_ENABLE_LOGIN: "true"
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
      NTFY_BASE_URL: ${NTFY_BASE_URL:?}
      # Declarative provisioning. Ansible renders these from vault; empty means
      # no accounts, which stays safe because default access is deny-all.
      #
      # Bcrypt hashes contain $, which Compose interpolates. Values must arrive
      # with every $ doubled. Verified: both --env-file and service-level
      # env_file interpolate, and an unescaped hash is silently truncated rather
      # than rejected, so the escaping is enforced by tests/policy_test.rb.
      NTFY_AUTH_USERS: ${NTFY_AUTH_USERS:-}
      NTFY_AUTH_ACCESS: ${NTFY_AUTH_ACCESS:-}
      NTFY_AUTH_TOKENS: ${NTFY_AUTH_TOKENS:-}
      TZ: ${TZ:?}
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD-SHELL, "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      # Deviation carried over unchanged from before the defaults existed; the
      # repository records no reason for it, and a de-duplication is not where a
      # readiness window gets renegotiated.
      retries: 4
      start_period: 40s
    # Carried from ntfy's own reference Compose, and deliberately not copied
    # outward. An init shim is only ever the answer where PID 1 would be an
    # application that never reaps what it forks; every other image here either
    # ships its own init — s6-overlay in the linuxserver.io images, which
    # refuses to run as anything but PID 1 — or runs a single process that forks
    # nothing. Adding this key elsewhere would be cargo, and in the s6 case it
    # would break the container outright.
    init: true
    # The auth database and the message cache are SQLite files, and /var/lib/ntfy
    # is recovery: critical — it is where the credentials this platform pushes
    # outward actually live. 30s commits the open transaction and checks the
    # write-ahead log back in.
    stop_grace_period: 30s
