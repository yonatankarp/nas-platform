---
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-linuxserver-environment: &linuxserver-environment
  PUID: ${NAS_UID:?}
  PGID: ${NAS_GID:?}
  UMASK: "022"
  TZ: ${TZ:?}

x-service-defaults: &service-defaults
  cpuset: ${PLATFORM_CONTAINER_CPUSET:?}
  # The linuxserver.io entrypoint reaches PUID/PGID by calling setuid(2) as
  # root, which no_new_privs does not restrict; nothing in these images executes
  # a setuid binary, so the flag costs them nothing.
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  # Each of these owns a SQLite database under a recovery: critical config
  # directory. A shutdown only has to commit the open transaction and check the
  # write-ahead log back into it; 30s is far past that and short enough that a
  # stack restart stays quick.
  stop_grace_period: 30s
  logging: *default-logging
  networks:
    - default
    - media-control

x-job-defaults: &job-defaults
  cpuset: ${PLATFORM_CONTAINER_CPUSET:?}
  security_opt:
    - no-new-privileges:true
  logging: *default-logging
  networks:
    - media-control

services:
  radarr:
    <<: *service-defaults
    container_name: radarr
    image: lscr.io/linuxserver/radarr:6.3.0@sha256:119aaa4a4f7349bcd2a136c5373a0d7925b5479915c7dfe0c0ad352db2a6d438
    cpus: 1.0
    labels:
      dev.dozzle.name: radarr
    ports:
      - "7878:7878"
    volumes:
      - ${RADARR_CONFIG_PATH:?}:/config
      - ${MEDIA_ROOT:?}/Media:/data/media
    environment: *linuxserver-environment
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, http://127.0.0.1:7878/ping]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  sonarr:
    <<: *service-defaults
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:4.0.19@sha256:c19aa4ecdf03d73e1d5c901da33744cb7eb4d921f89bafed1ca264601d7fa224
    cpus: 1.0
    labels:
      dev.dozzle.name: sonarr
    ports:
      - "8989:8989"
    volumes:
      - ${SONARR_CONFIG_PATH:?}:/config
      - ${MEDIA_ROOT:?}/Media:/data/media
    environment: *linuxserver-environment
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, http://127.0.0.1:8989/ping]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  prowlarr:
    <<: *service-defaults
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr:2.5.2@sha256:ab91301778251f82a31bbfc87f0497376d59e84439d9a1ceff6a61d594d1e3d7
    cpus: 0.5
    labels:
      dev.dozzle.name: prowlarr
    ports:
      - "9696:9696"
    volumes:
      - ${PROWLARR_CONFIG_PATH:?}:/config
    environment: *linuxserver-environment
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, http://127.0.0.1:9696/ping]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  bazarr:
    <<: *service-defaults
    container_name: bazarr
    image: lscr.io/linuxserver/bazarr:1.6.0@sha256:3a820372f19fcb2981ea19fe4b5382934d67414afaba974bce831ddda0a64a02
    cpus: 1.0
    labels:
      dev.dozzle.name: bazarr
    ports:
      - "6767:6767"
    volumes:
      - ${BAZARR_CONFIG_PATH:?}:/config
      - ${MEDIA_ROOT:?}/Media:/data/media
    environment: *linuxserver-environment
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, http://127.0.0.1:6767/]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  configarr:
    <<: *job-defaults
    profiles: [jobs]
    image: ghcr.io/raydak-labs/configarr:1.30.2@sha256:ec585b6d2530f6090ee26fdcc9701f279666c24dc96c9087208e88ec867c2416
    user: "${NAS_UID:?}:${NAS_GID:?}"
    cpus: 0.5
    environment:
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /app/repos/trash-guides
      GIT_CONFIG_KEY_1: safe.directory
      GIT_CONFIG_VALUE_1: /app/repos/recyclarr-config
    volumes:
      - ${CONFIGARR_CONFIG_PATH:?}:/app/config/config.yml:ro
      - ${CONFIGARR_SECRETS_PATH:?}:/app/config/secrets.yml:ro
      - ${CONFIGARR_REPOS_PATH:?}:/app/repos

networks:
  default: {}
  media-control:
    external: true
    name: ${PLATFORM_MEDIA_NETWORK:?}
