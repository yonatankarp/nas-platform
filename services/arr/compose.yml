---
# Platform fragments: anchors are per-file, so each stack carries a copy that
# tests/policy_test.rb pins equal.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-linuxserver-environment: &linuxserver-environment
  PUID: ${NAS_UID:?}
  PGID: ${NAS_GID:?}
  UMASK: "022"
  TZ: ${TZ:?}

x-service-defaults: &service-defaults
  cpuset: ${PLATFORM_CONTAINER_CPUSET:?}
  # The linuxserver.io entrypoint's setuid(2) is unaffected by no_new_privs.
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  # Each owns a critical SQLite database; 30s covers a WAL checkpoint.
  stop_grace_period: 30s
  logging: *default-logging
  networks:
    - default
    - media-control

x-job-defaults: &job-defaults
  cpuset: ${PLATFORM_CONTAINER_CPUSET:?}
  security_opt:
    - no-new-privileges:true
  logging: *default-logging
  networks:
    - media-control

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 60s

services:
  radarr:
    <<: *service-defaults
    container_name: radarr
    image: lscr.io/linuxserver/radarr:6.4.4@sha256:adb6c09d6b729ea5e642c99cea35af72702ef476bf4763f153299ac5db9f0b4f
    cpus: 1.0
    labels:
      dev.dozzle.group: arr
      dev.dozzle.name: radarr
    ports:
      - "7878:7878"
    volumes:
      - ${RADARR_CONFIG_PATH:?}:/config
      - ${MEDIA_ROOT:?}/Media:/data/media
    environment: *linuxserver-environment
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD, curl, --fail, --silent, --show-error, http://127.0.0.1:7878/ping]

  sonarr:
    <<: *service-defaults
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:4.0.20@sha256:f247545d23ba8b233d6604575347e48a623fe6ad75dda02348bf81917f3b5c06
    cpus: 1.0
    labels:
      dev.dozzle.group: arr
      dev.dozzle.name: sonarr
    ports:
      - "8989:8989"
    volumes:
      - ${SONARR_CONFIG_PATH:?}:/config
      - ${MEDIA_ROOT:?}/Media:/data/media
    environment: *linuxserver-environment
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD, curl, --fail, --silent, --show-error, http://127.0.0.1:8989/ping]

  prowlarr:
    <<: *service-defaults
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr:2.6.5@sha256:f2b26429893d4c4cb71941b7ee50b1bdecd9d5f9f9e02d5410615e9f4f7c8d95
    cpus: 0.5
    labels:
      dev.dozzle.group: arr
      dev.dozzle.name: prowlarr
    ports:
      - "9696:9696"
    volumes:
      - ${PROWLARR_CONFIG_PATH:?}:/config
    environment: *linuxserver-environment
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD, curl, --fail, --silent, --show-error, http://127.0.0.1:9696/ping]

  bazarr:
    <<: *service-defaults
    container_name: bazarr
    # A random container ID like 123e45678901 parses as `.inf` in Bazarr's TOML
    # settings and every later submit answers 406 (#708); a fixed name heals it.
    hostname: bazarr
    image: lscr.io/linuxserver/bazarr:1.6.2@sha256:8b30e81c4aec2991f469e78fae8afaa89ecc9b21a80e3897f50427216b55470c
    cpus: 1.0
    labels:
      dev.dozzle.group: arr
      dev.dozzle.name: bazarr
    ports:
      - "6767:6767"
    volumes:
      - ${BAZARR_CONFIG_PATH:?}:/config
      - ${MEDIA_ROOT:?}/Media:/data/media
    environment: *linuxserver-environment
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD, curl, --fail, --silent, --show-error, http://127.0.0.1:6767/]

  configarr:
    <<: *job-defaults
    profiles: [jobs]
    image: ghcr.io/raydak-labs/configarr:1.33.0@sha256:1f9d46382417e4625c77c3cb47b9e364affc4d980e0bf45ed78a3dd3625f4220
    user: "${NAS_UID:?}:${NAS_GID:?}"
    cpus: 0.5
    environment:
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /app/repos/trash-guides
      GIT_CONFIG_KEY_1: safe.directory
      GIT_CONFIG_VALUE_1: /app/repos/recyclarr-config
    volumes:
      - ${CONFIGARR_CONFIG_PATH:?}:/app/config/config.yml:ro
      - ${CONFIGARR_SECRETS_PATH:?}:/app/config/secrets.yml:ro
      - ${CONFIGARR_REPOS_PATH:?}:/app/repos

networks:
  default: {}
  media-control:
    external: true
    name: ${PLATFORM_MEDIA_NETWORK:?}
