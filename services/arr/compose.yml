---
# Platform fragments. Compose resolves a YAML anchor only inside the file that
# declares it, so every stack carries its own copy; tests/policy_test.rb pins the
# copies equal and records there why cross-file sharing was not taken. A
# container needing different health-check timing overrides only the fields it
# changes, so a deviation reads as a deviation.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-linuxserver-environment: &linuxserver-environment
  PUID: ${NAS_UID:?}
  PGID: ${NAS_GID:?}
  UMASK: "022"
  TZ: ${TZ:?}

x-service-defaults: &service-defaults
  cpuset: ${PLATFORM_CONTAINER_CPUSET:?}
  # The linuxserver.io entrypoint reaches PUID/PGID by calling setuid(2) as
  # root, which no_new_privs does not restrict; nothing in these images executes
  # a setuid binary, so the flag costs them nothing.
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  # Each of these owns a SQLite database under a recovery: critical config
  # directory. A shutdown only has to commit the open transaction and check the
  # write-ahead log back into it; 30s is far past that and short enough that a
  # stack restart stays quick. A container wanting a different window states its
  # own instead of joining this fragment: shutdown behaviour is never inherited.
  stop_grace_period: 30s
  logging: *default-logging
  networks:
    - default
    - media-control

x-job-defaults: &job-defaults
  cpuset: ${PLATFORM_CONTAINER_CPUSET:?}
  security_opt:
    - no-new-privileges:true
  logging: *default-logging
  networks:
    - media-control

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 60s

services:
  radarr:
    <<: *service-defaults
    container_name: radarr
    image: lscr.io/linuxserver/radarr:6.3.0@sha256:fe051413dfd91b383ba04910552e83fb0306895fefee275c48dafe7bb90807dc
    cpus: 1.0
    labels:
      dev.dozzle.group: arr
      dev.dozzle.name: radarr
    ports:
      - "7878:7878"
    volumes:
      - ${RADARR_CONFIG_PATH:?}:/config
      - ${MEDIA_ROOT:?}/Media:/data/media
    environment: *linuxserver-environment
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD, curl, --fail, --silent, --show-error, http://127.0.0.1:7878/ping]

  sonarr:
    <<: *service-defaults
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:4.0.20@sha256:a5c1a5fecbef946927ab90ad68df319ac5fe644057e5fc18cd993f01ac07b2b2
    cpus: 1.0
    labels:
      dev.dozzle.group: arr
      dev.dozzle.name: sonarr
    ports:
      - "8989:8989"
    volumes:
      - ${SONARR_CONFIG_PATH:?}:/config
      - ${MEDIA_ROOT:?}/Media:/data/media
    environment: *linuxserver-environment
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD, curl, --fail, --silent, --show-error, http://127.0.0.1:8989/ping]

  prowlarr:
    <<: *service-defaults
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr:2.5.2@sha256:aaa16ba7d66e413db6d0358d3b6c68d833578ba7f176f24a51807181e7637fce
    cpus: 0.5
    labels:
      dev.dozzle.group: arr
      dev.dozzle.name: prowlarr
    ports:
      - "9696:9696"
    volumes:
      - ${PROWLARR_CONFIG_PATH:?}:/config
    environment: *linuxserver-environment
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD, curl, --fail, --silent, --show-error, http://127.0.0.1:9696/ping]

  bazarr:
    <<: *service-defaults
    container_name: bazarr
    # Bazarr defaults general.hostname to platform.node() and stores that default
    # through dynaconf's TOML parser, so a Docker-assigned hostname -- the random
    # container ID -- shaped like 123e45678901 is saved as `.inf` and every later
    # settings submit answers 406 over general.hostname (#708). A fixed,
    # non-numeric hostname removes the draw, and heals a config already holding
    # `.inf` at the next start, because Bazarr resets it to this value.
    hostname: bazarr
    image: lscr.io/linuxserver/bazarr:1.6.1@sha256:d24bd0048c759a468970989e9df11a6b96a7628d556d00f923e60a35ba59237b
    cpus: 1.0
    labels:
      dev.dozzle.group: arr
      dev.dozzle.name: bazarr
    ports:
      - "6767:6767"
    volumes:
      - ${BAZARR_CONFIG_PATH:?}:/config
      - ${MEDIA_ROOT:?}/Media:/data/media
    environment: *linuxserver-environment
    healthcheck:
      <<: *healthcheck-defaults
      test: [CMD, curl, --fail, --silent, --show-error, http://127.0.0.1:6767/]

  configarr:
    <<: *job-defaults
    profiles: [jobs]
    image: ghcr.io/raydak-labs/configarr:1.31.0@sha256:ae97eb6eb4009bbbe81a754e7b6e8d33608443c1353b3a1197c55a8ff3e989fa
    user: "${NAS_UID:?}:${NAS_GID:?}"
    cpus: 0.5
    environment:
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /app/repos/trash-guides
      GIT_CONFIG_KEY_1: safe.directory
      GIT_CONFIG_VALUE_1: /app/repos/recyclarr-config
    volumes:
      - ${CONFIGARR_CONFIG_PATH:?}:/app/config/config.yml:ro
      - ${CONFIGARR_SECRETS_PATH:?}:/app/config/secrets.yml:ro
      - ${CONFIGARR_REPOS_PATH:?}:/app/repos

networks:
  default: {}
  media-control:
    external: true
    name: ${PLATFORM_MEDIA_NETWORK:?}
