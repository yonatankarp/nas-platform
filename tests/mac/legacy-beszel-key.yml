---
- name: Install the legacy Beszel hub identity before first start
  hosts: localhost
  gather_facts: false
  vars:
    beszel_legacy_key_path: "{{ beszel_legacy_hub_root }}/id_ed25519"
  tasks:
    - name: Inspect the owned legacy Beszel hub bind
      ansible.builtin.stat:
        path: "{{ beszel_legacy_hub_root }}"
        follow: false
      register: beszel_legacy_hub_stat

    - name: Require a protected legacy Beszel hub bind
      ansible.builtin.assert:
        that:
          - beszel_legacy_hub_root is match('^/.+/legacy/beszel/hub$')
          - beszel_legacy_hub_stat.stat.exists
          - beszel_legacy_hub_stat.stat.isdir
          - not beszel_legacy_hub_stat.stat.islnk
          - beszel_legacy_hub_stat.stat.mode == '0700'
        quiet: true

    - name: Inspect an existing legacy Beszel hub identity
      ansible.builtin.stat:
        path: "{{ beszel_legacy_key_path }}"
        follow: false
      register: beszel_legacy_key_stat

    - name: Reject an unsafe existing legacy Beszel hub identity
      ansible.builtin.assert:
        that:
          - not beszel_legacy_key_stat.stat.exists or not beszel_legacy_key_stat.stat.islnk
          - not beszel_legacy_key_stat.stat.exists or beszel_legacy_key_stat.stat.isreg
          - not beszel_legacy_key_stat.stat.exists or beszel_legacy_key_stat.stat.uid == beszel_legacy_hub_stat.stat.uid
        quiet: true

    - name: Install the deployment-vault Beszel hub identity atomically
      ansible.builtin.copy:
        content: "{{ vault_beszel_hub_private_key }}"
        dest: "{{ beszel_legacy_key_path }}"
        mode: "0600"
        force: true
      no_log: true
