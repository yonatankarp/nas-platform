---
services:
  hub:
    container_name: !reset null
    ports: !override
      - "127.0.0.1:${BESZEL_HOST_PORT:?}:8090"
    volumes: !override
      - ${PLATFORM_MAC_SANDBOX:?}/legacy/beszel/hub:/beszel_data

  # The pinned legacy commit contains only the Intel agent image. Keep that
  # image, but remove its NAS-only capabilities and run it in portable posture.
  agent:
    container_name: !reset null
    network_mode: !reset null
    cap_add: !override []
    devices: !override []
    volumes: !override
      - ${PLATFORM_MAC_SANDBOX:?}/legacy/beszel/agent:/var/lib/beszel-agent
      - ${PLATFORM_MAC_SANDBOX:?}/legacy/beszel/volume1:/extra-filesystems/volume1:ro
      - ${PLATFORM_MAC_SANDBOX:?}/legacy/beszel/volume2:/extra-filesystems/volume2:ro
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      EXCLUDE_SMART: !reset null
      HUB_URL: http://hub:8090
      INTEL_GPU_DEVICE: !reset null

  socket-proxy:
    container_name: !reset null
    ports: !override []
