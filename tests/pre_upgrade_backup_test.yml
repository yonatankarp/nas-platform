---
# Behaviour of roles/pre_upgrade_backup (#836, #826), which no integration lane
# reaches, run through include_role against fixture trees and a `docker` stub.
- name: Prove the pre-upgrade copy
  hosts: localhost
  gather_facts: false
  # Play level, because `environment` is not a task attribute of an include and
  # the stub has to be on PATH for the modules the role runs inside it.
  environment:
    PATH: "{{ backup_root }}/bin:{{ lookup('env', 'PATH') }}"
  vars:
    # Per worktree: several worktrees run the gate at once.
    backup_root: "{{ lookup('env', 'TMPDIR') | default('/tmp', true) }}/nas-platform-pre-upgrade-backup-{{ backup_worktree_id }}"
    backup_worktree_id: "{{ (playbook_dir | hash('sha1'))[:12] }}"
    backup_store_file: db.sqlite3
    platform_current_dir: "{{ backup_root }}/current"
    platform_runtime_dir: "{{ backup_root }}/runtime"
    platform_service_compose_files: {fixture: [compose.yml]}
    platform_compose_wait_timeout: 5
    backup_old: registry.example/fixture:v1.0.0@sha256:aaaa
    backup_new: registry.example/fixture:v1.1.0@sha256:bbbb
    # The candidate's pin in every live case, so reading it instead of `current`
    # fails the converged cases.
    backup_decoy: registry.example/fixture:v9.9.9@sha256:ffff
    # Another Compose service in the same stack, listed ahead of the fixture's,
    # so a pin read off anything but the key the role is given reads this.
    backup_other: registry.example/other:v1.1.0@sha256:cccc
    # The CLI calls `state: stopped` makes.
    backup_stop_calls: ["up --no-start --no-recreate", "ps", "stop", "ps"]
    backup_cases:
      # Not a real SQLite state, but the copy reads the set rather than the
      # journal mode, so one case carries all three.
      - name: a pending upgrade copies the store, its journals and the signing key privately after the stop
        deployed: "{{ backup_old }}"
        pinned: "{{ backup_new }}"
        store: [db.sqlite3, db.sqlite3-wal, db.sqlite3-shm, db.sqlite3-journal, rsa_key.pem, rsa_key.pub.pem,
                attachments.txt]
        manage_ownership: true
        expect_calls: "{{ backup_stop_calls }}"
        expect_state: exited
        expect_copy: [db.sqlite3, db.sqlite3-wal, db.sqlite3-shm, db.sqlite3-journal, rsa_key.pem, rsa_key.pub.pem]
      - name: a later upgrade keeps one generation, and ownership is left alone when not managed
        deployed: "{{ backup_old }}"
        pinned: "{{ backup_new }}"
        store: [db.sqlite3, rsa_key.pem]
        # A stale -journal is the dangerous one: SQLite would treat it as hot
        # and roll the restored store back with another generation's pages.
        stale_backup: [db.sqlite3-wal, db.sqlite3-shm, db.sqlite3-journal]
        manage_ownership: false
        expect_calls: "{{ backup_stop_calls }}"
        expect_state: exited
        expect_copy: [db.sqlite3, rsa_key.pem]
      - name: a converged host stops and copies nothing
        deployed: "{{ backup_new }}"
        pinned: "{{ backup_new }}"
        store: [db.sqlite3, db.sqlite3-wal]
        expect_calls: []
        expect_state: running
        expect_copy_absent: true
      - name: a converged host stops and copies nothing on the second run either
        deployed: "{{ backup_new }}"
        pinned: "{{ backup_new }}"
        store: [db.sqlite3, db.sqlite3-wal]
        expect_calls: []
        expect_state: running
        expect_copy_absent: true
      - name: a host that never ran the service has nothing to protect
        pinned: "{{ backup_new }}"
        store: []
        expect_calls: []
        expect_state: running
        expect_copy_absent: true
      # A review reads the candidate, because `current` still names the release
      # the run replaces (#858).
      - name: a review of a bump reports the copy against the candidate's pin and stops and writes nothing
        check_mode: true
        deployed: "{{ backup_old }}"
        pinned: "{{ backup_old }}"
        candidate: "{{ backup_new }}"
        expect_review_pending: true
        store: [db.sqlite3, db.sqlite3-wal, rsa_key.pem]
        expect_calls: []
        expect_state: running
        expect_copy_absent: true
      - name: a review whose candidate pins the running image reports no copy, whatever current pins
        check_mode: true
        deployed: "{{ backup_new }}"
        pinned: "{{ backup_old }}"
        candidate: "{{ backup_new }}"
        expect_review_pending: false
        store: [db.sqlite3]
        expect_calls: []
        expect_state: running
        expect_copy_absent: true
      - name: a pending upgrade with no store is refused before anything stops
        deployed: "{{ backup_old }}"
        pinned: "{{ backup_new }}"
        store: [db.sqlite3-wal]
        expect_message: No regular file db.sqlite3 was found
        expect_calls: []
        expect_state: running
        expect_copy_absent: true
      - name: a copy that cannot create its directory starts the old container again and fails
        deployed: "{{ backup_old }}"
        pinned: "{{ backup_new }}"
        store: [db.sqlite3, db.sqlite3-wal]
        plant_file_at_backup: true
        expect_message: >-
          failed at "Create the pre-upgrade copy directory".*was not performed.*is running on its old image
        expect_calls: "{{ backup_stop_calls + ['up --no-recreate', 'ps'] }}"
        expect_state: running
      - name: a copy that fails partway starts the old container again and fails
        deployed: "{{ backup_old }}"
        pinned: "{{ backup_new }}"
        store: [db.sqlite3, db.sqlite3-wal, db.sqlite3-shm]
        block_copy_of: db.sqlite3-wal
        expect_message: >-
          failed at "Copy the store aside before the pinned upgrade".*was not performed.*is running on its old image
        expect_calls: "{{ backup_stop_calls + ['up --no-recreate', 'ps'] }}"
        expect_state: running
      - name: a store lost as the container stopped is not started over
        deployed: "{{ backup_old }}"
        pinned: "{{ backup_new }}"
        store: [db.sqlite3]
        faults: [stop-removes-store]
        expect_message: FIXTURE IS STOPPED, and was deliberately not started again
        expect_calls: "{{ backup_stop_calls }}"
        expect_state: exited
      # The pin is read from the Compose service key the role is given, never a
      # stale host-scoped guard fact (#858).
      - name: a pin is read from the given Compose service, never another service or a stale guard fact
        deployed: "{{ backup_new }}"
        pinned: "{{ backup_new }}"
        guard_pin: "{{ backup_other }}"
        store: [db.sqlite3]
        expect_calls: []
        expect_state: running
        expect_copy_absent: true
      - name: a copy directory that is the store directory is refused before anything stops
        deployed: "{{ backup_old }}"
        pinned: "{{ backup_new }}"
        store: [db.sqlite3]
        backup_path: store/
        expect_message: is the store directory or one above it
        expect_calls: []
        expect_state: running
        expect_copy_absent: true
      - name: a copy directory above the store directory is refused before anything stops
        deployed: "{{ backup_old }}"
        pinned: "{{ backup_new }}"
        store: [db.sqlite3]
        backup_path: ""
        expect_message: is the store directory or one above it
        expect_calls: []
        expect_state: running
        expect_copy_absent: true
      - name: an old container that does not come back says it is not serving
        deployed: "{{ backup_old }}"
        pinned: "{{ backup_new }}"
        store: [db.sqlite3]
        plant_file_at_backup: true
        faults: [up-fails]
        expect_message: FIXTURE IS NOT SERVING
        expect_calls: "{{ backup_stop_calls + ['up --no-recreate', 'ps'] }}"
        expect_state: exited
      # tasks_from: pg_dump (#826): the application stops, the database dumps
      # itself; the fake pg_dump records the application's state at dump time.
      - name: a pending upgrade dumps the database privately after stopping the application
        method: pg_dump
        deployed: "{{ backup_old }}"
        pinned: "{{ backup_new }}"
        stale_dump: true
        expect_calls: "{{ backup_stop_calls + ['exec'] }}"
        expect_state: exited
        expect_dump: true
      # With a stale guard fact naming another image: the pin is the entry's
      # own read, as main's is (#858).
      - name: a converged host dumps nothing, whatever a guard left behind
        method: pg_dump
        code: true
        deployed: "{{ backup_new }}"
        pinned: "{{ backup_new }}"
        guard_pin: "{{ backup_other }}"
        expect_calls: []
        expect_state: running
        expect_copy_absent: true
      - name: a review of a bump reports the dump against the candidate's pin and stops and writes nothing
        method: pg_dump
        check_mode: true
        deployed: "{{ backup_old }}"
        pinned: "{{ backup_old }}"
        candidate: "{{ backup_new }}"
        expect_review_pending: true
        expect_calls: []
        expect_state: running
        expect_copy_absent: true
      - name: a dump that fails starts the application again and fails
        method: pg_dump
        deployed: "{{ backup_old }}"
        pinned: "{{ backup_new }}"
        faults: [dump-fails]
        expect_message: >-
          failed at "Dump the database before the pinned upgrade".*was not performed.*is running on its old image
        expect_calls: "{{ backup_stop_calls + ['exec', 'up --no-recreate', 'ps'] }}"
        expect_state: running
      # The code archive Nextcloud takes beside its dump (#884).
      - name: a pending upgrade archives the code tree beside the dump, without the user's data
        method: pg_dump
        code: true
        deployed: "{{ backup_old }}"
        pinned: "{{ backup_new }}"
        expect_calls: "{{ backup_stop_calls + ['exec', 'run id:' ~ backup_old] }}"
        expect_state: exited
        expect_dump: true
        expect_code: true
      - name: an archive that fails starts the application again and fails
        method: pg_dump
        code: true
        deployed: "{{ backup_old }}"
        pinned: "{{ backup_new }}"
        faults: [archive-fails]
        # The dump ahead of it completed, and stays: it is still the database
        # as it stood before the upgrade that did not happen.
        expect_dump: true
        expect_message: >-
          failed at "Archive the code tree the old image runs, beside the dump": the code archive exited 2 writing
          .*/postgres/pre-upgrade-backup/code.tar.gz from .*/code: tar: config/config.php: Cannot open: Permission denied.*was not
          performed.*is running on its old image
        expect_calls: "{{ backup_stop_calls + ['exec', 'run id:' ~ backup_old, 'up --no-recreate', 'ps'] }}"
        expect_state: running
      - name: a review reports the archive and stops and writes nothing
        method: pg_dump
        code: true
        check_mode: true
        expect_review_pending: true
        deployed: "{{ backup_old }}"
        pinned: "{{ backup_new }}"
        expect_calls: []
        expect_state: running
        expect_copy_absent: true
      # Inside the tree, the archive would be deleted by the next upgrade's
      # rsync --delete and would archive itself.
      - name: an archive directory inside the code tree is refused before anything stops
        method: pg_dump
        code: true
        code_archive_dir: code/pre-upgrade-backup
        deployed: "{{ backup_old }}"
        pinned: "{{ backup_new }}"
        expect_message: is inside the code tree
        expect_calls: []
        expect_state: running
        expect_copy_absent: true
      - name: an application that does not come back after a failed dump says it is not serving
        method: pg_dump
        deployed: "{{ backup_old }}"
        pinned: "{{ backup_new }}"
        faults: [dump-fails, up-fails]
        expect_message: FIXTURE IS NOT SERVING
        expect_calls: "{{ backup_stop_calls + ['exec', 'up --no-recreate', 'ps'] }}"
        expect_state: exited
      # Nextcloud stops its application and its cron (#889). The start reports
      # success and cron exits again: the rescue reads every service it
      # stopped, so the one that did not come back is named.
      - name: a failed dump that leaves one stopped service down names it
        method: pg_dump
        deployed: "{{ backup_old }}"
        pinned: "{{ backup_new }}"
        stop_services: [fixture, cron]
        faults: [dump-fails, stays-down.cron]
        expect_message: FIXTURE IS NOT SERVING.*cron
        expect_calls: "{{ backup_stop_calls + ['exec', 'up --no-recreate', 'ps'] }}"
        expect_state: running
        expect_other_state: exited
      # pg_dump's refusal names the database user and database (#889): the
      # message says what failed without them.
      - name: a failed dump says where and how it failed without naming the database or its user
        method: pg_dump
        deployed: "{{ backup_old }}"
        pinned: "{{ backup_new }}"
        stop_services: [fixture, cron]
        faults: [dump-fails]
        expect_message: >-
          failed at "Dump the database before the pinned upgrade": pg_dump exited 1 .*pre-upgrade-backup/database.sql.gz
        expect_calls: "{{ backup_stop_calls + ['exec', 'up --no-recreate', 'ps'] }}"
        expect_state: running
        expect_other_state: running

  tasks:
    # At the start as well as the end, so a run that failed cannot leave a tree
    # the next one reads; safe only because the path is per worktree.
    - name: Remove a fixture tree an interrupted earlier run left behind
      ansible.builtin.file:
        path: "{{ backup_root }}"
        state: absent

    - name: Build the fixture release and runtime trees
      ansible.builtin.file:
        path: "{{ backup_root }}/{{ item }}"
        state: directory
        mode: "0755"
      loop: [bin, current/services/fixture, candidate/services/fixture, runtime/services/fixture]

    # The database container's pg_dump, run by the stub's `exec`.
    - name: Install the pg_dump the database container runs
      ansible.builtin.copy:
        dest: "{{ backup_root }}/bin/pg_dump"
        mode: "0755"
        content: |
          #!/bin/sh
          daemon="{{ backup_root }}/daemon"
          # What a real refusal prints: the database user and database by name.
          if [ -f "$daemon/dump-fails" ]; then
            printf 'pg_dump: error: FATAL:  password authentication failed for user "%s" to database "%s"\n' \
              "$POSTGRES_USER" "$POSTGRES_DB" >&2
            exit 1
          fi
          echo "-- dumped while the application was $(cat "$daemon/state")"

    - name: Write the fixture's rendered environment
      ansible.builtin.copy:
        dest: "{{ backup_root }}/runtime/services/fixture/.env"
        content: "---\n"
        mode: "0600"

    - name: Install the Docker stub the role and the Compose module read the daemon through
      ansible.builtin.copy:
        dest: "{{ backup_root }}/bin/docker"
        mode: "0755"
        content: |
          #!/bin/sh
          daemon="{{ backup_root }}/daemon"
          while [ "$1" = --host ] || [ "$1" = --context ]; do shift 2; done
          case "$1" in
            version)
              echo '{"Client":{"Version":"27.0.0"},"Server":{"Version":"27.0.0","ApiVersion":"1.46"}}'
              exit 0 ;;
            container)
              case "$2" in
                # The fixture's container is `state` and `container-id`; any
                # other service a case declares is `state.<service>`.
                ls)
                  [ -f "$daemon/container-id" ] || exit 0
                  svc=$(printf '%s\n' "$@" | sed -n 's/^label=com.docker.compose.service=//p')
                  state="$daemon/state" id=$(cat "$daemon/container-id")
                  if [ "$svc" != fixture ]; then
                    state="$daemon/state.$svc" id="$svc-0001"
                    [ -f "$state" ] || exit 0
                  fi
                  case "$*" in
                    *status=running*) [ "$(cat "$state")" = running ] || exit 0 ;;
                  esac
                  echo "$id"
                  exit 0 ;;
                inspect)
                  printf '[{"Image":"id:%s","Config":{"Image":"%s"}}]\n' "$(cat "$daemon/image")" "$(cat "$daemon/image")"
                  exit 0 ;;
              esac
              exit 64 ;;
            # The pg_dump entry's code archive (#884): a one-shot container of
            # the image the application was created from. Options up to the
            # image, each bind mount's target mapped back onto its source in
            # the argv, and the entrypoint -- sh -- run here.
            run)
              shift
              map=""
              while [ $# -gt 0 ]; do
                case "$1" in
                  --rm) shift ;;
                  --mount)
                    source=$(printf '%s' "$2" | sed -n 's/.*source=\([^,]*\).*/\1/p')
                    target=$(printf '%s' "$2" | sed -n 's/.*target=\([^,]*\).*/\1/p')
                    [ -d "$source" ] || { echo "invalid mount config: bind source path does not exist: $source" >&2; exit 125; }
                    map="$map$target=$source
          "
                    shift 2 ;;
                  --entrypoint) entrypoint=$2; shift 2 ;;
                  --*) shift 2 ;;
                  *) break ;;
                esac
              done
              echo "run $1" >>"$daemon/calls"
              shift
              if [ -f "$daemon/archive-fails" ]; then
                echo 'tar: config/config.php: Cannot open: Permission denied' >&2
                exit 2
              fi
              for arg; do
                shift
                mapped=$(printf '%s' "$map" | sed -n "s#^ *$arg=##p")
                set -- "$@" "${mapped:-$arg}"
              done
              exec "$entrypoint" "$@" ;;
            compose) shift ;;
            *) exit 64 ;;
          esac
          # Every global option the module passes takes a value.
          while [ $# -gt 0 ]; do
            case "$1" in --*) shift 2 ;; *) break ;; esac
          done
          verb=$1
          shift
          # The services an `up` or a `stop` names, after its `--`.
          services=$(printf '%s\n' "$@" | awk 'seen; /^--$/ {seen = 1}')
          state_of() { if [ "$1" = fixture ]; then echo "$daemon/state"; else echo "$daemon/state.$1"; fi; }
          case "$verb" in
            version) echo '{"version":"v2.20.0"}' ;;
            # The module lists the project's images around an `up`, to tell a
            # pull from a start; there are none to report.
            images) echo '[]' ;;
            # The database container's shell, run here: options up to `--`,
            # then the service, then the argv. Its mount point is the fixture's.
            exec)
              echo exec >>"$daemon/calls"
              while [ "$1" != -- ]; do shift; done
              shift 2
              for arg; do
                shift
                set -- "$@" "$(printf '%s' "$arg" | sed "s#^/var/lib/postgresql#{{ backup_root }}/postgres#")"
              done
              # What the database container was created with.
              # Names that appear nowhere else, so a message carrying them leaked them.
              POSTGRES_USER=fx_dbuser POSTGRES_PASSWORD=fx_dbpass POSTGRES_DB=fx_dbname exec "$@" ;;
            ps)
              echo ps >>"$daemon/calls"
              printf '[{"Name":"fixture-1","Service":"fixture","State":"%s","Labels":""}' "$(cat "$daemon/state")"
              for other in "$daemon"/state.*; do
                [ -f "$other" ] || continue
                printf ',{"Name":"%s-1","Service":"%s","State":"%s","Labels":""}' \
                  "${other##*.}" "${other##*.}" "$(cat "$other")"
              done
              echo ']' ;;
            up)
              line=up
              case " $* " in *" --no-start "*) line="$line --no-start" ;; esac
              case " $* " in
                *" --no-recreate "*) line="$line --no-recreate" ;;
                # What Compose does to a container whose definition moved on.
                *) cp "$daemon/pinned" "$daemon/image" ;;
              esac
              echo "$line" >>"$daemon/calls"
              case " $* " in *" --no-start "*) exit 0 ;; esac
              if [ -f "$daemon/up-fails" ]; then
                echo "container fixture-1 is unhealthy" >&2
                exit 1
              fi
              # A service can come up and exit again with `up` still reporting
              # success: one with no healthcheck, which --wait does not hold.
              for svc in $services; do
                [ -f "$daemon/stays-down.$svc" ] || echo running >"$(state_of "$svc")"
              done ;;
            stop)
              echo stop >>"$daemon/calls"
              for svc in $services; do echo exited >"$(state_of "$svc")"; done
              store=$(cat "$daemon/store")
              if [ -f "$daemon/stop-removes-store" ]; then
                rm -f "$store"
              elif [ -f "$store" ]; then
                # A clean stop checkpoints the log into the store.
                echo "checkpointed by stop" >>"$store"
              fi ;;
            *) exit 64 ;;
          esac

    - name: Read the account the fixture runs as
      ansible.builtin.command:
        argv: [id, -u]
      register: backup_uid
      changed_when: false
      check_mode: false

    - name: Read the groups the fixture account holds
      ansible.builtin.command:
        argv: [id, -G]
      register: backup_groups
      changed_when: false
      check_mode: false

    # Prefer a supplementary group, so the managed chown is seen to change
    # something; the primary group stands in when there is none.
    - name: Resolve the owner a managed copy is handed to
      ansible.builtin.set_fact:
        backup_owner_uid: "{{ backup_uid.stdout | int }}"
        backup_owner_gid: >-
          {{ ((backup_groups.stdout.split()[1:] | map('int') | list) + [backup_groups.stdout.split()[0] | int])
             | first }}
        backup_results: []

    - name: Run every case
      ansible.builtin.include_tasks: pre_upgrade_backup_case.yml
      loop: "{{ backup_cases }}"
      loop_control:
        label: "{{ item.name }}"

    # A shrunken case list reaches no per-case assertion, so hold the list.
    - name: Require the case list to have run whole
      ansible.builtin.assert:
        that:
          - backup_results | length == backup_cases | length
          - backup_results | length >= 26
          - backup_results | selectattr('failed') | list | length >= 13
          - backup_results | rejectattr('failed') | list | length >= 13
          - backup_results | selectattr('method', 'eq', 'pg_dump') | list | length >= 11
        fail_msg: >-
          The pre-upgrade copy ran {{ backup_results | length }} of
          {{ backup_cases | length }} cases, failing
          {{ backup_results | selectattr('failed') | list | length }} of them.

    - name: Remove the fixture tree
      ansible.builtin.file:
        path: "{{ backup_root }}"
        state: absent

    - name: Report what was proved
      ansible.builtin.debug:
        msg: >-
          pre-upgrade copy: {{ backup_results | length }} cases hold --
          {{ backup_results | rejectattr('failed') | list | length }} converged or copied and
          {{ backup_results | selectattr('failed') | list | length }} refused.
