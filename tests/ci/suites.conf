# The integration suite table: which suites exist, and which Ansible tags each
# one converges. This file is the single source of truth for both readers.
#
# tests/integration.sh reads it for --list-suites, for refusing an unknown
# --suite, and for the tags a suite converges when the caller passes none.
# tests/ci/classify_changes.rb reads it for LANES, SUITES, SERVICE_TAGS and the
# acquisition/service lane groupings. The two used to hold separate copies of
# this table kept equal by a policy check; there is now nothing to keep equal.
#
# Columns, whitespace separated:
#
#   suite  the name tests/integration.sh --suite takes and the CI matrix runs.
#          The classifier's lane is that name with hyphens written as
#          underscores, because a lane is also a GitHub Actions output key.
#   kind   acquisition  a media acquisition lane; CI narrows the site to its tags
#          service      a service lane; CI narrows the site to its tags
#          untagged     a CI lane the classifier never selects tags for: it
#                       either converges a fixed slice of its own (foundation) or
#                       is handed the tags some other lane selected (smoke,
#                       idempotence-check)
#          harness      not a CI lane at all -- the runner's own default
#   tags   the comma-separated Ansible tags the suite converges, or - for none.
#
# Row order is the order the CI matrix runs the suites and the order
# --list-suites prints them.
#
# Every service suite converges ntfy: each service role reports its own
# deployment to it, so a suite that left the sink out would fail at the report
# rather than at anything the suite is about. tests/policy_ci_test.rb requires
# that of every lane but the two planned acquisition foundations, which start
# no sink because they converge only the shared inert foundation.
#
# suite              kind         tags
foundation           untagged     deployment_bundle
arr                  acquisition  host_prep,deployment_bundle,ntfy,arr
downloaders          acquisition  host_prep,deployment_bundle,ntfy,arr,downloaders
bindery              acquisition  host_prep,deployment_bundle,ntfy,arr,downloaders,bindery
kapowarr             acquisition  host_prep,deployment_bundle,ntfy,kapowarr
pinchflat            acquisition  host_prep,deployment_bundle,ntfy,pinchflat
trailarr             acquisition  host_prep,deployment_bundle,media_acquisition_foundation
seerr                acquisition  host_prep,deployment_bundle,media_acquisition_foundation
smoke                untagged     -
beszel               service      host_prep,deployment_bundle,ntfy,beszel
dozzle               service      host_prep,deployment_bundle,ntfy,dozzle
audiobookshelf       service      host_prep,deployment_bundle,ntfy,audiobookshelf
komga                service      host_prep,deployment_bundle,ntfy,komga
jellyfin             service      host_prep,deployment_bundle,ntfy,jellyfin
immich               service      host_prep,deployment_bundle,ntfy,immich
paperless            service      host_prep,deployment_bundle,ntfy,paperless
idempotence-check    untagged     -
full                 harness      -
