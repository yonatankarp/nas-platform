# The integration suite table: which suites exist, and which Ansible tags each
# one converges. This file is the single source of truth for both readers.
#
# tests/integration.sh reads it for --list-suites, for refusing an unknown
# --suite, and for the tags a suite converges when the caller passes none.
# tests/ci/classify_changes.rb reads it for LANES, SUITES, SERVICE_TAGS and the
# acquisition/service lane groupings. The two used to hold separate copies of
# this table kept equal by a policy check; there is now nothing to keep equal.
#
# Columns, whitespace separated:
#
#   suite  the name tests/integration.sh --suite takes and the CI matrix runs.
#          The classifier's lane is that name with hyphens written as
#          underscores, because a lane is also a GitHub Actions output key.
#   kind   acquisition  a media acquisition lane; CI narrows the site to its tags
#          service      a service lane; CI narrows the site to its tags
#          untagged     a CI lane the classifier never selects tags for: it
#                       either converges a fixed slice of its own (foundation) or
#                       is handed the tags some other lane selected (smoke,
#                       idempotence-check)
#          harness      not a CI lane at all -- the runner's own default
#   tags   the comma-separated Ansible tags the suite converges, or - for none.
#
# Row order is the order the CI matrix runs the suites and the order
# --list-suites prints them.
#
# Every service suite converges host_prep and deployment_bundle, the shared
# prerequisites every service role needs; the deployment reports each role sends
# live in roles/deployment_bundle. tests/policy_ci_test.rb requires that of every
# lane but the one planned acquisition foundation, which converges only the
# shared inert foundation.
#
# suite              kind         tags
foundation           untagged     deployment_bundle
arr                  acquisition  host_prep,deployment_bundle,arr
downloaders          acquisition  host_prep,deployment_bundle,arr,downloaders
bindery              acquisition  host_prep,deployment_bundle,arr,downloaders,audiobookshelf,bindery
kapowarr             acquisition  host_prep,deployment_bundle,kapowarr
pinchflat            acquisition  host_prep,deployment_bundle,pinchflat
trailarr             acquisition  host_prep,deployment_bundle,arr,trailarr
seerr                acquisition  host_prep,deployment_bundle,arr,jellyfin,seerr
smoke                untagged     -
beszel               service      host_prep,deployment_bundle,beszel
dozzle               service      host_prep,deployment_bundle,beszel,dozzle
audiobookshelf       service      host_prep,deployment_bundle,audiobookshelf
komga                service      host_prep,deployment_bundle,komga
jellyfin             service      host_prep,deployment_bundle,jellyfin
immich               service      host_prep,deployment_bundle,immich
paperless            service      host_prep,deployment_bundle,paperless
nextcloud            service      host_prep,deployment_bundle,nextcloud
vaultwarden          service      host_prep,deployment_bundle,vaultwarden
karakeep             service      host_prep,deployment_bundle,karakeep
idempotence-check    untagged     -
# The shards below are one decomposition of the untagged idempotence-check
# lane, and they exist because that lane is the critical path of a full run: 32.3
# minutes against a next-longest job of 16.5 on run 34471042365, whose own wall
# was 32.5. A shard converges its slice, re-converges it and runs it under
# --check --diff, exactly as the whole lane does, so the wall becomes the slowest
# shard rather than the sum. Routing picks one form or the other and never both:
# an unmapped path falls open to the shards, `--full` -- the nightly and
# workflow_dispatch -- keeps the single unsharded lane. See classify_changes.rb.
#
# What the shards do not prove is whole-site idempotence: a role in one shard
# interfering with a role in another is invisible to both. That is why the
# nightly keeps the unsharded pass, and it is the whole reason the split above is
# a decomposition rather than a replacement.
#
# host_prep and deployment_bundle are in every shard because every service
# role needs them, and `preflight` is tags: [preflight, always] so it runs
# regardless. That repetition is the shards' floor, and it is what stops a shard
# count from paying off indefinitely: every shard added re-converges the whole
# prerequisite set once more. The arithmetic that used to stand here was derived
# from the per-role timing table docs/ci-performance-history.md documents as corrupted, and
# the first
# sharded run measured the repetition at roughly a third of it -- so no number is
# restated here. Read the phase-1 task counts off a sharded run rather than from
# a comment.
#
# arr and downloaders appear in more than one shard for the same reason: bindery
# reads the arr APIs and seerr reads arr and jellyfin, so a prerequisite has to
# converge in the shard that needs it. Only *ownership* is exclusive, and
# tests/idempotence_shard_partition_test.rb is what holds the partition together:
# it derives the tag universe from site.yml's own roles and fails on a tag no
# shard converges. A shard that quietly loses a tag would go green, and faster.
#
# Six rather than five because a job is budgeted at fifteen minutes hard and ten
# aimed for, and the first split left shard 1 carrying the whole acquisition
# chain at 14.1 minutes on run 34514486089 -- inside the hard limit and well
# outside the aim. The bindery chain has to stay whole (bindery reads the arr
# APIs through downloaders and audiobookshelf), so the cut is between that chain
# and the three acquisition services that only need arr. Numbering is what makes
# a split like this a one-row edit.
#
# Numbered rather than named, the way tests/validate-policy.sh numbers its own
# shards. These are cost buckets and not categories: `immich` sits beside
# `dozzle` because the three heavyweights -- paperless, immich and jellyfin --
# have to land in three different shards, and no honest category groups them that
# way. A name would have to be wrong or the balance would, and a name that went
# wrong at the first rebalance is this repository's most repeated defect.
#
# The split is provisional. It balances services rather than measured cost,
# because the only per-role timings available are corrupted -- with
# display_skipped_hosts = False the default callback prints no banner for a fully
# skipped task, so every visible gap absorbs the skips after it. Rebalance from
# the first sharded run's own numbers, the way #517 rebalanced the static shards,
# and read docs/ci-performance-history.md's caveats about contended wall times before
# trusting them.
idempotence-1        untagged     host_prep,deployment_bundle,arr,downloaders,audiobookshelf,bindery
idempotence-2        untagged     host_prep,deployment_bundle,arr,jellyfin,seerr
idempotence-3        untagged     host_prep,deployment_bundle,paperless,nextcloud
idempotence-4        untagged     host_prep,deployment_bundle,immich,dozzle
idempotence-5        untagged     host_prep,deployment_bundle,beszel,komga,vaultwarden,karakeep,deployment_summary
idempotence-6        untagged     host_prep,deployment_bundle,arr,trailarr,kapowarr,pinchflat
full                 harness      -
