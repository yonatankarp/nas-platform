---
# One case of tests/pre_upgrade_backup_test.yml: a separate file because a block
# cannot be looped and a refusal has to be caught. Every fixture is rewritten first.
- name: Clear the store, the copy and the daemon the previous case left
  ansible.builtin.file:
    path: "{{ backup_root }}/{{ fixture_path }}"
    state: absent
  loop: [store, daemon, postgres, code]
  loop_control:
    loop_var: fixture_path

- name: Recreate the store and daemon directories
  ansible.builtin.file:
    path: "{{ backup_root }}/{{ fixture_path }}"
    state: directory
    mode: "0755"
  loop: [store, daemon]
  loop_control:
    loop_var: fixture_path

# Looser than the role's 0700, so the case proves the directory is tightened.
- name: Leave the dump directory an earlier upgrade made
  ansible.builtin.file:
    path: "{{ backup_root }}/postgres/pre-upgrade-backup"
    state: directory
    mode: "0755"
  when: item.stale_dump | default(false)

- name: Leave the dump an earlier upgrade made
  ansible.builtin.copy:
    dest: "{{ backup_root }}/postgres/pre-upgrade-backup/database.sql.gz"
    content: "stale\n"
    mode: "0644"
  when: item.stale_dump | default(false)

# Nextcloud's code tree (#884). apps/x/data/y is a nested `data`, which only an
# anchored exclusion keeps.
- name: Create the code tree's directories
  ansible.builtin.file:
    path: "{{ backup_root }}/code/{{ code_dir }}"
    state: directory
    mode: "0755"
  loop: [config, apps/x/data, custom_apps/a, data/u]
  loop_control:
    loop_var: code_dir
  when: item.code | default(false)

- name: Write the code tree this case holds
  ansible.builtin.copy:
    dest: "{{ backup_root }}/code/{{ code_file }}"
    content: "{{ code_file }}\n"
    mode: "0644"
  loop: [version.php, config/config.php, apps/x/data/y, custom_apps/a/info.xml, data/u/f,
         nextcloud-init-sync.lock]
  loop_control:
    loop_var: code_file
  when: item.code | default(false)

# Each store file holds its own name, so a copy can be traced to its source.
- name: Write the store files this case holds
  ansible.builtin.copy:
    dest: "{{ backup_root }}/store/{{ store_file }}"
    content: "{{ store_file }}\n"
    mode: "0644"
  loop: "{{ item.store | default([]) }}"
  loop_control:
    loop_var: store_file

# Looser than 0700, so the role must tighten a directory it did not create.
- name: Leave the copy directory an earlier upgrade made
  ansible.builtin.file:
    path: "{{ backup_root }}/store/pre-upgrade-backup"
    state: directory
    mode: "0755"
  when: item.stale_backup is defined

- name: Write what an earlier upgrade left in the copy directory
  ansible.builtin.copy:
    dest: "{{ backup_root }}/store/pre-upgrade-backup/{{ stale_file }}"
    content: "stale\n"
    mode: "0600"
  loop: "{{ item.stale_backup | default([]) }}"
  loop_control:
    loop_var: stale_file

# The failure measured on Kapowarr before the rescue existed.
- name: Plant a file where the copy directory belongs
  ansible.builtin.copy:
    dest: "{{ backup_root }}/store/pre-upgrade-backup"
    content: "not a directory\n"
    mode: "0644"
  when: item.plant_file_at_backup | default(false)

# Makes the copy fail partway: files ahead of it are written, that one is not.
- name: Plant a directory where one copied file has to land
  ansible.builtin.file:
    path: "{{ backup_root }}/store/pre-upgrade-backup/{{ item.block_copy_of }}/{{ item.block_copy_of }}"
    state: directory
    mode: "0700"
  when: item.block_copy_of is defined

# `current` pins `pinned`, which a live run reads; the candidate pins
# `candidate`, which a review reads. The stack's other service comes first.
- name: Write the release and candidate Compose files this case pins
  ansible.builtin.copy:
    dest: "{{ backup_root }}/{{ release }}/services/fixture/compose.yml"
    content: |
      ---
      services:
        other:
          image: {{ backup_other }}
        fixture:
          image: {{ item.pinned if release == 'current' else item.candidate | default(backup_decoy) }}
    mode: "0600"
  loop: [current, candidate]
  loop_control:
    loop_var: release

- name: Write the daemon this case's container lives in
  ansible.builtin.copy:
    dest: "{{ backup_root }}/daemon/{{ daemon_file.name }}"
    content: "{{ daemon_file.content }}"
    mode: "0644"
  loop:
    - {name: image, content: "{{ item.deployed | default('') }}"}
    - {name: pinned, content: "{{ item.pinned }}"}
    - {name: state, content: "{{ item.state | default('running') }}"}
    - {name: calls, content: ""}
    - {name: store, content: "{{ backup_root }}/store/{{ backup_store_file }}"}
  loop_control:
    loop_var: daemon_file
    label: "{{ daemon_file.name }}"

# Absence is how a host that never ran the service is said.
- name: Give the case a container when it has one
  ansible.builtin.copy:
    dest: "{{ backup_root }}/daemon/container-id"
    content: "cafe0001\n"
    mode: "0644"
  when: item.deployed is defined

- name: Give the case's other stopped services a running container
  ansible.builtin.copy:
    dest: "{{ backup_root }}/daemon/state.{{ other_service }}"
    content: running
    mode: "0644"
  loop: "{{ item.stop_services | default([]) | reject('eq', 'fixture') | list }}"
  loop_control:
    loop_var: other_service

- name: Arm the daemon faults this case declares
  ansible.builtin.copy:
    dest: "{{ backup_root }}/daemon/{{ fault }}"
    content: "armed\n"
    mode: "0644"
  loop: "{{ item.faults | default([]) }}"
  loop_control:
    loop_var: fault

# Resolved into facts first: the role's own loops rebind `item`, so a parameter
# templated over the case's `item` would read the wrong value.
- name: Start the case unrefused, with its parameters resolved
  ansible.builtin.set_fact:
    backup_case_failed: false
    backup_case_message: ""
    backup_case_expect_pending: "{{ item.expect_review_pending | default(false) }}"
    # What a caller's guard left behind, which the role must not read.
    image_downgrade_guard_pinned_image: "{{ item.guard_pin | default('') }}"
    backup_case_manage: "{{ item.manage_ownership | default(false) }}"
    backup_case_check: "{{ item.check_mode | default(false) }}"
    backup_case_method: "{{ item.method | default('main') }}"
    backup_case_stop_services: "{{ item.stop_services | default(['fixture']) }}"
    backup_case_path: "{{ backup_root ~ '/' ~ (item.backup_path if item.backup_path is defined else 'store/pre-upgrade-backup') }}"
    backup_case_code_root: "{{ (backup_root ~ '/code') if item.code | default(false) else '' }}"
    backup_case_code_archive_dir: >-
      {{ backup_root ~ '/' ~ (item.code_archive_dir if item.code_archive_dir is defined
                              else 'postgres/pre-upgrade-backup') }}

- name: Run the pre-upgrade copy against this case
  when: not backup_case_check | bool
  block:
    - name: Include the pre-upgrade copy the way its callers do
      ansible.builtin.include_role:
        name: pre_upgrade_backup
        tasks_from: "{{ backup_case_method }}"
      # Both entries' arguments: each validates its own and ignores the rest.
      vars:
        pre_upgrade_backup_stop_services: "{{ backup_case_stop_services }}"
        pre_upgrade_backup_database_service: db
        pre_upgrade_backup_service_name: fixture
        pre_upgrade_backup_compose_service: fixture
        pre_upgrade_backup_project_name: backup-test
        pre_upgrade_backup_candidate_root: "{{ backup_root }}/candidate"
        pre_upgrade_backup_store_dir: "{{ backup_root }}/store"
        pre_upgrade_backup_store_file: "{{ backup_store_file }}"
        pre_upgrade_backup_extra_patterns: [rsa_key*]
        pre_upgrade_backup_path: "{{ backup_case_path }}"
        pre_upgrade_backup_manage_ownership: "{{ backup_case_manage }}"
        pre_upgrade_backup_code_root: "{{ backup_case_code_root }}"
        pre_upgrade_backup_code_archive_dir: "{{ backup_case_code_archive_dir }}"
        # An owner this account cannot hand a file to, so a copy that chowned
        # when it was told not to fails rather than passing unnoticed.
        nas_uid: "{{ backup_owner_uid if backup_case_manage | bool else 4242424 }}"
        nas_gid: "{{ backup_owner_gid if backup_case_manage | bool else 4242424 }}"
  rescue:
    - name: Record that the pre-upgrade copy failed this case
      ansible.builtin.set_fact:
        backup_case_failed: true
        backup_case_message: "{{ ansible_failed_result.msg | default('') }}"

# A real `--check` run: block-level check_mode leaves ansible_check_mode false, which
# is what the role gates writes on, so it would stop and copy for real.
- name: Review the pre-upgrade copy in a check-mode run of its own
  ansible.builtin.command:
    argv:
      - ansible-playbook
      - -i
      - localhost,
      - -c
      - local
      - --check
      - tests/pre_upgrade_backup_review.yml
      - -e
      - "{{ {'backup_root': backup_root, 'backup_store_file': backup_store_file,
             'backup_expect_pending': backup_case_expect_pending | bool,
             'backup_method': backup_case_method,
             'backup_code_root': backup_case_code_root} | to_json }}"
    chdir: "{{ playbook_dir }}/.."
  register: backup_case_review
  changed_when: false
  failed_when: false
  when: backup_case_check | bool

- name: Read the daemon's record of this case
  ansible.builtin.set_fact:
    backup_case_calls: "{{ lookup('file', backup_root ~ '/daemon/calls').splitlines() }}"
    backup_case_state: "{{ lookup('file', backup_root ~ '/daemon/state') | trim }}"
    backup_case_image: "{{ lookup('file', backup_root ~ '/daemon/image') | trim }}"
    backup_case_other_states: >-
      {{ query('ansible.builtin.file', *query('ansible.builtin.fileglob', backup_root ~ '/daemon/state.*'))
         | map('trim') | unique }}

- name: Read the copy directory
  ansible.builtin.stat:
    path: "{{ backup_root }}/store/pre-upgrade-backup"
  register: backup_case_directory

- name: Read the copied files
  ansible.builtin.find:
    paths: "{{ backup_root }}/store/pre-upgrade-backup"
    file_type: file
  register: backup_case_files
  when: backup_case_directory.stat.isdir | default(false)

- name: Read the copied store
  ansible.builtin.slurp:
    path: "{{ backup_root }}/store/pre-upgrade-backup/{{ backup_store_file }}"
  register: backup_case_store_copy
  # A missing copy is the assertion's to report, with the whole case beside it.
  failed_when: false
  when: item.expect_copy is defined

- name: Read the dump directory
  ansible.builtin.stat:
    path: "{{ backup_root }}/postgres/pre-upgrade-backup"
  register: backup_case_dump_directory

- name: Read the dumps
  ansible.builtin.find:
    paths: "{{ backup_root }}/postgres/pre-upgrade-backup"
    file_type: file
    hidden: true
  register: backup_case_dumps
  when: backup_case_dump_directory.stat.isdir | default(false)

- name: Read the dump
  ansible.builtin.command:
    argv: [gzip, -dc, "{{ backup_root }}/postgres/pre-upgrade-backup/database.sql.gz"]
  register: backup_case_dump
  changed_when: false
  failed_when: false
  check_mode: false
  when: item.expect_dump | default(false)

- name: List the code archive
  ansible.builtin.command:
    argv: [tar, -tzf, "{{ backup_root }}/postgres/pre-upgrade-backup/code.tar.gz"]
  register: backup_case_code
  changed_when: false
  failed_when: false
  check_mode: false
  when: item.expect_code | default(false)

- name: Require this case to reach the outcome it declares
  ansible.builtin.assert:
    that:
      - backup_case_failed == (item.expect_message is defined)
      # The review play asserts its own plan and --check, exiting 0 only if both held.
      - not backup_case_check | bool or backup_case_review.rc == 0
      - backup_case_check | bool
        or not ((pre_upgrade_backup_plan.msg | default('')) is search('A live run would stop the container'))
      - item.expect_message is not defined or backup_case_message is search(item.expect_message)
      - backup_case_calls == item.expect_calls
      - backup_case_state == item.expect_state
      - backup_case_other_states == ([item.expect_other_state] if item.expect_other_state is defined else [])
      # pg_dump's refusal names them; the message must not (#889).
      - backup_case_message is not search('fx_dbuser|fx_dbname|fx_dbpass')
      # An unchanged image record means nothing recreated the container.
      - backup_case_image == (item.deployed | default(''))
      - item.expect_copy is defined or item.expect_copy_absent is not defined
        or not (backup_case_directory.stat.exists | default(false))
      - item.expect_copy is not defined or (
          backup_case_directory.stat.mode == '0700'
          and backup_case_files.files | map(attribute='path') | map('basename') | sort
              == item.expect_copy | sort
          and backup_case_files.files | map(attribute='mode') | unique | list == ['0600']
          and backup_case_files.files | map(attribute='uid') | unique | list == [backup_owner_uid | int]
          and (not backup_case_manage | bool or (
            backup_case_files.files | map(attribute='gid') | unique | list == [backup_owner_gid | int]
            and backup_case_directory.stat.gid == backup_owner_gid | int)))
      # The stub's stop appends to the store, so this proves the copy followed the stop.
      - item.expect_copy is not defined
        or (backup_case_store_copy.content | default('') | b64decode) is search('checkpointed by stop')
      - item.expect_copy_absent is not defined or not (backup_case_dump_directory.stat.exists | default(false))
      # A failed dump leaves nothing under the name a restore would read.
      - item.expect_dump | default(false) or item.stale_dump | default(false)
        or not (backup_case_dumps.files | default([]) | map(attribute='path') | map('basename')
                | select('eq', 'database.sql.gz') | list)
      # The fake pg_dump records the application's state: it must have been stopped.
      - not item.expect_dump | default(false) or (
          backup_case_dump_directory.stat.mode == '0700'
          and backup_case_dumps.files | map(attribute='path') | map('basename') | sort
              == (['code.tar.gz'] if item.expect_code | default(false) else []) + ['database.sql.gz']
          and backup_case_dumps.files | map(attribute='mode') | unique | list == ['0600']
          and backup_case_dump.rc == 0
          and backup_case_dump.stdout == '-- dumped while the application was exited')
      # What the older image needs to start, and nothing of the user's.
      - not item.expect_code | default(false) or (
          backup_case_code.rc == 0
          and ['version.php', 'config/config.php', 'apps/x/data/y', 'custom_apps/a/info.xml']
              | difference(backup_case_code.stdout_lines | map('regex_replace', '^\\./', '') | list) == []
          and backup_case_code.stdout_lines | map('regex_replace', '^\\./', '')
              | select('match', '^(data(/|$)|nextcloud-init-sync\\.lock$)') | list == [])
      # A failed or skipped archive leaves nothing under the name a restore reads.
      - item.expect_code | default(false)
        or not (backup_case_dumps.files | default([]) | map(attribute='path') | map('basename')
                | select('eq', 'code.tar.gz') | list)
    fail_msg: >-
      The case "{{ item.name }}" declares
      {{ ('a refusal matching ' ~ item.expect_message) if item.expect_message is defined else 'success' }},
      the daemon calls {{ item.expect_calls }}, a container left {{ item.expect_state }}
      ({{ ('owned ' ~ backup_owner_uid ~ ':' ~ backup_owner_gid) if backup_case_manage | bool
          else 'ownership left alone' }})
      on {{ item.deployed | default('no image') }}, and a copy of
      {{ item.expect_copy | default('nothing') }}. It
      {{ ('failed with: ' ~ backup_case_message) if backup_case_failed else 'succeeded' }}
      {{- (', and its review exited ' ~ backup_case_review.rc ~ ': ' ~ (backup_case_review.stdout | default('')
           | regex_findall('msg.*') | join(' '))) if backup_case_check | bool else '' }},
      the daemon saw {{ backup_case_calls }}, the container is {{ backup_case_state }} on
      {{ backup_case_image }}, and the copy directory
      {{ ('holds ' ~ (backup_case_files.files | default([]) | map(attribute='path') | map('basename') | list)
          ~ ' at modes ' ~ (backup_case_files.files | default([]) | map(attribute='mode') | list)
          ~ ' owned ' ~ (backup_case_files.files | default([]) | map(attribute='uid') | unique | list)
          ~ ':' ~ (backup_case_files.files | default([]) | map(attribute='gid') | unique | list)
          ~ ' in a ' ~ backup_case_directory.stat.mode ~ ' directory owned '
          ~ backup_case_directory.stat.uid ~ ':' ~ backup_case_directory.stat.gid)
         if backup_case_directory.stat.isdir | default(false) else 'is not a directory' }}.

- name: Accumulate the outcome of this case
  ansible.builtin.set_fact:
    backup_results: "{{ backup_results + [{'name': item.name, 'failed': backup_case_failed,
                                           'method': backup_case_method}] }}"
