---
# Behaviour of roles/image_downgrade_guard, which is the converge-time half of
# #511: it refuses to start an image older than one that has already run against
# the service's own store, because a service that migrates on start writes a
# schema the older image declines to open -- inside the container, where the
# only symptom is a crash loop.
#
# This runs the shipped role rather than a restatement of it. The release tree
# and the Docker daemon are both fixtures: the pinned image comes from a
# compose.yml written per case, and a `docker` stub on PATH answers `container
# ls` and `container inspect` from two files the case writes beside it. So the
# subject is the file's own expressions, and a change to them that breaks the
# arithmetic fails here rather than on the NAS.
#
# The version arithmetic is where the defects are, and the port row is one that
# happened rather than one imagined: reading the tag from the left of the whole
# reference resolves `registry.example:5000/x/y:v1.33.3` to 5000, and every
# comparison after that is between two registry ports.
- name: Prove the image downgrade guard
  hosts: localhost
  gather_facts: false
  # Play level, because `environment` is not a task attribute of an include and
  # the stub has to be on PATH for the command tasks the role runs inside it.
  environment:
    PATH: "{{ guard_root }}/bin:{{ lookup('env', 'PATH') }}"
  vars:
    guard_role_tasks: >-
      {{ lookup('file', playbook_dir ~ '/../roles/image_downgrade_guard/tasks/main.yml')
         | from_yaml }}
    guard_root: "{{ lookup('env', 'TMPDIR') | default('/tmp', true) }}/nas-platform-image-downgrade-guard-{{ guard_worktree_id }}"
    # Per worktree rather than one fixed path, because this repository routinely
    # has several worktrees live at once and a shared fixture makes two
    # concurrent runs read and delete each other's files. It identifies the
    # worktree rather than the run for a reason the play cannot work around: the
    # `environment` above is templated for every task including the first, so
    # `guard_root` has to resolve before anything has run. A run id from a
    # set_fact fails the play at task one with `'guard_run_id' is undefined`,
    # and so does one from ansible.builtin.tempfile; a `lookup` evaluated here
    # would re-run on every reference and hand different tasks different paths.
    guard_worktree_id: "{{ (playbook_dir | hash('sha1'))[:12] }}"
    # name, the image the release pins, the references Docker recorded for
    # containers of this service, and what the guard must conclude.
    guard_cases:
      - name: "the #511 downgrade, one release back past a migration"
        pinned: ghcr.io/vavallee/bindery:v1.33.3@sha256:aaaa
        deployed: [ghcr.io/vavallee/bindery:v1.34.0@sha256:bbbb]
        refused: true
        newer: ["1.34.0"]
      - name: a converged deployment, same version on both sides
        pinned: ghcr.io/vavallee/bindery:v1.35.0@sha256:aaaa
        deployed: [ghcr.io/vavallee/bindery:v1.35.0@sha256:aaaa]
        refused: false
        newer: []
      - name: a digest refresh on an unchanged tag
        pinned: ghcr.io/vavallee/bindery:v1.35.0@sha256:cccc
        deployed: [ghcr.io/vavallee/bindery:v1.35.0@sha256:aaaa]
        refused: false
        newer: []
      - name: an ordinary upgrade, which must not be refused
        pinned: ghcr.io/vavallee/bindery:v1.35.0@sha256:aaaa
        deployed: [ghcr.io/vavallee/bindery:v1.33.3@sha256:bbbb]
        refused: false
        newer: []
      - name: several containers left behind, one of them newer
        pinned: ghcr.io/vavallee/bindery:v1.33.3@sha256:aaaa
        deployed:
          - ghcr.io/vavallee/bindery:v1.9.0@sha256:x
          - ghcr.io/vavallee/bindery:v1.34.0@sha256:y
        refused: true
        newer: ["1.34.0"]
      - name: numeric rather than lexical ordering, 1.10 over 1.9
        pinned: ghcr.io/vavallee/bindery:v1.9.0@sha256:aaaa
        deployed: [ghcr.io/vavallee/bindery:v1.10.0@sha256:y]
        refused: true
        newer: ["1.10.0"]
      - name: a suffixed tag, as Nextcloud pins one
        pinned: docker.io/library/nextcloud:34.0.3-apache@sha256:aaaa
        deployed: [docker.io/library/nextcloud:34.0.4-apache@sha256:y]
        refused: true
        newer: ["34.0.4"]
      # #826: the tag shapes of the three roles that adopted the guard there,
      # each on a real pin pair from this repository's history, so a change
      # to the arithmetic that mishandles one of them fails here.
      - name: a Nextcloud major reverted, across the suffixed tag
        pinned: docker.io/library/nextcloud:34.0.4-apache@sha256:aaaa
        deployed: [docker.io/library/nextcloud:35.0.1-apache@sha256:y]
        refused: true
        newer: ["35.0.1"]
      - name: a Nextcloud major taken, which must not be refused
        pinned: docker.io/library/nextcloud:35.0.1-apache@sha256:aaaa
        deployed: [docker.io/library/nextcloud:34.0.4-apache@sha256:y]
        refused: false
        newer: []
      - name: a bare numeric tag, as Paperless pins one
        pinned: ghcr.io/paperless-ngx/paperless-ngx:3.2.0@sha256:aaaa
        deployed: [ghcr.io/paperless-ngx/paperless-ngx:3.2.1@sha256:y]
        refused: true
        newer: ["3.2.1"]
      - name: an Immich patch reverted
        pinned: ghcr.io/immich-app/immich-server:v3.2.1@sha256:aaaa
        deployed: [ghcr.io/immich-app/immich-server:v3.2.2@sha256:y]
        refused: true
        newer: ["3.2.2"]
      - name: a registry host carrying a port
        pinned: registry.example:5000/vavallee/bindery:v1.33.3@sha256:aaaa
        deployed: [registry.example:5000/vavallee/bindery:v1.34.0@sha256:y]
        refused: true
        newer: ["1.34.0"]
      - name: a fresh host, where the service has never run
        pinned: ghcr.io/vavallee/bindery:v1.33.3@sha256:aaaa
        deployed: []
        refused: false
        newer: []
      - name: a pinned tag that is not a version, which fails open
        pinned: ghcr.io/vavallee/bindery:latest@sha256:aaaa
        deployed: [ghcr.io/vavallee/bindery:v1.34.0@sha256:y]
        refused: false
        newer: []
      - name: a deployed tag that is not a version, which fails open
        pinned: ghcr.io/vavallee/bindery:v1.33.3@sha256:aaaa
        deployed: [ghcr.io/vavallee/bindery:edge@sha256:y]
        refused: false
        newer: []
      - name: a different repository entirely, which has no version ordering
        pinned: ghcr.io/other/bindery:v1.33.3@sha256:aaaa
        deployed: [ghcr.io/vavallee/bindery:v1.34.0@sha256:y]
        refused: false
        newer: []

    # The --check review rows (#851): the release `current` still names, the
    # candidate this run would install, and whether the review must refuse.
    guard_review_rows:
      - row: review-downgrade
        current: ghcr.io/vavallee/bindery:v1.34.0@sha256:bbbb
        candidate: ghcr.io/vavallee/bindery:v1.33.3@sha256:aaaa
        refused: true
      - row: review-heal
        current: ghcr.io/vavallee/bindery:v1.33.3@sha256:aaaa
        candidate: ghcr.io/vavallee/bindery:v1.35.0@sha256:cccc
        refused: false

  tasks:
    # At the start as well as at the end, because the end is not reached by a
    # run that failed, and this play's failure sustains itself: the tripwire
    # near the end reads a leftover `check-mode-probe` as proof that the
    # check-mode block wrote it, and the run failing there never reaches the
    # removal below -- so it fails identically forever after, accusing the
    # guard long after whatever produced the file is gone (#557).
    #
    # #557 blames an interrupt for the leftover probe, and that is measurably
    # not where it comes from. No correct run writes the probe at all, because
    # the block-level check_mode is what stops it, so an interrupt or a peer
    # session's kill leaves only a tree that the next run overwrites: a stale
    # tree holding a bogus docker stub, stale argv and a v0.0.1 compose, with
    # no probe, passes all twelve cases it then held even before this task existed. The
    # probe comes only from a run in which check mode did not reach that task
    # -- a defect this tripwire caught, or an uncommitted edit being iterated
    # on -- and it then outlives its cause.
    #
    # So wrapping the play in block/always would break the loop too, and is
    # rejected on cost rather than on correctness: it re-indents three hundred
    # lines to delete one file, and still does nothing for a kill or for a
    # concurrent peer. This task is four lines and heals a tree left by any
    # cause.
    #
    # Safe only because the suffix above is per worktree -- on a shared path it
    # would delete a concurrent run's live fixture, so the two halves are one
    # fix and not two.
    - name: Remove a fixture tree an interrupted earlier run left behind
      ansible.builtin.file:
        path: "{{ guard_root }}"
        state: absent

    - name: Build the fixture release tree
      ansible.builtin.file:
        path: "{{ guard_root }}/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - bin
        - services/bindery
        - review-downgrade/current/services/bindery
        - review-downgrade/candidate/services/bindery
        - review-heal/current/services/bindery
        - review-heal/candidate/services/bindery

    # The stub records its own argv, which is the only way to prove the guard
    # asks for stopped containers. A guard that dropped --all would still pass
    # every row above on this fixture, because the fixture answers whatever it
    # is asked -- and the container the guard exists for is the one that has
    # already exited.
    - name: Install the Docker stub the guard reads its daemon through
      ansible.builtin.copy:
        dest: "{{ guard_root }}/bin/docker"
        mode: "0755"
        content: |
          #!/bin/sh
          printf '%s\n' "$*" >>"{{ guard_root }}/docker-argv"
          [ "$1" = container ] || exit 64
          case "$2" in
            ls) cat "{{ guard_root }}/docker-ids" 2>/dev/null || : ;;
            inspect) cat "{{ guard_root }}/docker-inspect.json" ;;
            *) exit 64 ;;
          esac

    - name: Start the argv record and the result accumulator empty
      ansible.builtin.copy:
        dest: "{{ guard_root }}/docker-argv"
        content: ""
        mode: "0644"

    - name: Start the result accumulator empty
      ansible.builtin.set_fact:
        guard_results: []

    - name: Run every case
      ansible.builtin.include_tasks: image_downgrade_guard_case.yml
      loop: "{{ guard_cases }}"
      loop_control:
        label: "{{ item.name }}"

    # A floor rather than non-emptiness, and it is what survives of this
    # assertion's original job. Each case now compares its own verdict and its
    # own `newer` list against the ones it declares, in
    # image_downgrade_guard_case.yml -- so a flipped verdict is caught there
    # and no longer has to be inferred from a total. What a per-case assertion
    # cannot catch is a case list that silently became one row: every row it
    # still holds would pass, and the run would prove nothing. Sixteen is what
    # the list holds; both fail-open rows and both no-comparison rows are
    # load-bearing, so a shrink is a deliberate act with a diff. The two
    # verdict counts stay for the same reason -- a list that shrank to sixteen
    # copies of one row satisfies the length floors and reaches one verdict.
    - name: Require the case list to have run whole
      ansible.builtin.assert:
        that:
          - guard_results | length == guard_cases | length
          - guard_results | length >= 16
          - guard_results | selectattr('refused') | list | length >= 8
          - guard_results | rejectattr('refused') | list | length >= 8
        fail_msg: >-
          The guard ran {{ guard_results | length }} of {{ guard_cases | length }}
          cases, refusing {{ guard_results | selectattr('refused') | list | length }}
          of them. A run that judges too few cases, or that never reaches both
          verdicts, cannot report that the guard works.

    - name: Require the guard to read stopped containers too
      ansible.builtin.assert:
        that:
          - guard_listing is search('container ls --all --quiet')
          - guard_listing is search('label=com.docker.compose.project=guard-test')
          - guard_listing is search('label=com.docker.compose.service=bindery')
        fail_msg: >-
          The guard listed containers as `docker {{ guard_listing }}`. Without
          --all it sees only running containers, and the container it exists for
          has already exited.
      vars:
        guard_listing: >-
          {{ (lookup('file', guard_root ~ '/docker-argv').split('\n')
              | select('search', '^container ls') | list | first | default('', true)) }}

    # Structure rather than behaviour, and it is the half a fixture cannot show:
    # a read that claims a change breaks idempotence, a read that skips itself
    # under --check turns the refusal into silence exactly when an operator is
    # reading the plan, and a `when: ansible_check_mode` deferral -- which
    # roles/container_cpu is right to carry and this role is not -- would gut it.
    #
    # Collected by loop rather than by selectattr because the module key holds
    # dots: Jinja reads `ansible.builtin.command` as a path through three nested
    # mappings, so selectattr on it matches nothing and reports zero reads on a
    # file that has two.
    - name: Collect the reads the guard performs
      ansible.builtin.set_fact:
        guard_reads: >-
          {{ guard_reads | default([])
             + ([item] if 'ansible.builtin.command' in item else []) }}
      loop: "{{ guard_body }}"
      loop_control:
        label: "{{ item.name | default('-') }}"
      vars:
        guard_body: "{{ guard_role_tasks }}"

    - name: Require every read in the guard to be a read
      ansible.builtin.assert:
        that:
          - guard_reads | length == 2
          - guard_reads | selectattr('changed_when', 'defined')
            | selectattr('changed_when', 'equalto', false) | list | length == 2
          - guard_reads | selectattr('check_mode', 'defined')
            | selectattr('check_mode', 'equalto', false) | list | length == 2
          - guard_check_mode_tasks | sort == guard_pin_source_tasks | sort
        fail_msg: >-
          roles/image_downgrade_guard/tasks/main.yml holds
          {{ guard_reads | length }} command reads, of which
          {{ guard_reads | selectattr('check_mode', 'defined')
             | selectattr('check_mode', 'equalto', false) | list | length }}
          really run under --check and
          {{ guard_reads | selectattr('changed_when', 'defined')
             | selectattr('changed_when', 'equalto', false) | list | length }}
          report no change. The guard inspects state the run did not create, so
          it has to judge in check mode rather than defer.
          The tasks naming ansible_check_mode are {{ guard_check_mode_tasks }}.
      vars:
        # ansible_check_mode may choose which release the pin is read from
        # (#851) and nothing else: on a read of the daemon or on the refusal it
        # would be the deferral this assertion exists to keep out. Paired with
        # each task's rendering because `search` needs a string.
        guard_check_mode_tasks: >-
          {{ guard_role_tasks | map(attribute='name')
             | zip(guard_role_tasks | map('string'))
             | selectattr('1', 'search', 'ansible_check_mode')
             | map('first') | list }}
        guard_pin_source_tasks:
          - Read the deployed Compose definition of the guarded service
          - Resolve the pinned image reference of the guarded container

    # The refusal has to fire under --check, because a plan that reads clean and
    # then crash-loops on apply is the #511 failure with an extra step. The
    # fixture is rewritten to the downgrade first: the loop above left the last
    # case's files behind.
    - name: Write the downgrade fixture the check-mode proof reads
      ansible.builtin.copy:
        dest: "{{ guard_root }}/{{ item.path }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - path: services/bindery/compose.yml
          content: |
            ---
            services:
              bindery:
                image: ghcr.io/vavallee/bindery:v1.33.3@sha256:aaaa
        - path: docker-ids
          content: "cafe0001\n"
        - path: docker-inspect.json
          content: |
            [{"Config": {"Image": "ghcr.io/vavallee/bindery:v1.34.0@sha256:bbbb"}}]
      loop_control:
        label: "{{ item.path }}"

    - name: Refuse the downgrade while only planning
      check_mode: true
      block:
        # First, and it is not decoration. If block-level check_mode did not
        # reach the tasks inside the include, this whole block would be an
        # ordinary converge refusing for ordinary reasons and reporting green --
        # and no planted defect could tell the difference, because every plant
        # that touches `check_mode: false` trips the structural assertion above.
        # Keyword inheritance through an include is not uniform here: an
        # `environment` on the include of a case file is rejected outright,
        # which is why that one sits at play level.
        #
        # The probe is a write that check mode must not perform, rather than a
        # read of `ansible_check_mode`. That variable was the first attempt and
        # it is the wrong oracle: it reports whether the RUN carries --check, so
        # a task-level check_mode leaves it false and the tripwire fired on a
        # block that was working correctly. What a task-level check_mode does do
        # is hand every module `_ansible_check_mode`, which is the whole of what
        # the guard meets under --check, since it reads that variable nowhere --
        # the structural assertion above is what holds that true.
        - name: Probe whether check mode reaches the tasks inside this block
          ansible.builtin.file:
            path: "{{ guard_root }}/check-mode-probe"
            state: touch
            mode: "0644"

        - name: Include the downgrade guard in check mode
          ansible.builtin.include_role:
            name: image_downgrade_guard
          vars:
            image_downgrade_guard_service_name: bindery
            image_downgrade_guard_compose_service: bindery
            image_downgrade_guard_project_name: guard-test
            image_downgrade_guard_store_description: /fixture/config
            platform_current_dir: "{{ guard_root }}"

        - name: Record that check mode did not refuse
          ansible.builtin.set_fact:
            guard_check_mode_refused: false
      rescue:
        - name: Record that check mode refused
          ansible.builtin.set_fact:
            guard_check_mode_refused: true

    - name: Read whether the check-mode probe wrote anything
      ansible.builtin.stat:
        path: "{{ guard_root }}/check-mode-probe"
      register: guard_check_mode_probe

    - name: Require the refusal to reach a check-mode run
      ansible.builtin.assert:
        that:
          - not guard_check_mode_probe.stat.exists
          - guard_check_mode_refused | bool
          - image_downgrade_guard_newer_versions == ["1.34.0"]
        fail_msg: >-
          {{ 'The check-mode block wrote its probe file, so its tasks were not in
              check mode and the refusal below is an ordinary converge wearing the
              proof name.'
             if guard_check_mode_probe.stat.exists else
             'In check mode the guard read '
             ~ image_downgrade_guard_deployed_versions ~ ' against a pinned '
             ~ image_downgrade_guard_pinned_version ~ ' and '
             ~ ('refused' if guard_check_mode_refused | bool else 'did not refuse')
             ~ '. A plan that reads clean and then crash-loops on apply is #511
                with an extra step.' }}

    # #851. Under a real --check the release is not activated, so `current`
    # still names the one this run replaces, and a guard reading it judges the
    # wrong pin: a downgrade under review passes and is refused only live, and
    # the review of the merge that heals one is refused for a pin it no longer
    # carries. The block above cannot show either -- block-level check_mode
    # leaves ansible_check_mode false -- so these rows are --check runs of their
    # own, against a daemon that recorded v1.34.0 (written above).
    - name: Write the two releases each review row holds
      ansible.builtin.copy:
        dest: "{{ guard_root }}/{{ item.0.row }}/{{ item.1 }}/services/bindery/compose.yml"
        content: |
          ---
          services:
            bindery:
              image: {{ item.0[item.1] }}
        mode: "0644"
      loop: "{{ guard_review_rows | product(['current', 'candidate']) | list }}"
      loop_control:
        label: "{{ item.0.row }}/{{ item.1 }}"

    - name: Review each row in a check-mode run of its own
      ansible.builtin.command:
        argv:
          - ansible-playbook
          - -i
          - localhost,
          - -c
          - local
          - --check
          - tests/image_downgrade_guard_review.yml
          - -e
          - "{{ {'guard_root': guard_root, 'review_row': item.row,
                 'review_candidate_pin': item.candidate,
                 'review_expect_refused': item.refused} | to_json }}"
        chdir: "{{ playbook_dir }}/.."
      register: guard_reviews
      changed_when: false
      failed_when: false
      loop: "{{ guard_review_rows }}"
      loop_control:
        label: "{{ item.row }}"

    - name: Require every review to judge the release it would install
      ansible.builtin.assert:
        that:
          - guard_reviews.results | length == 2
          - guard_reviews.results | map(attribute='rc') | unique | list == [0]
        fail_msg: >-
          {{ guard_reviews.results | rejectattr('rc', 'equalto', 0)
             | map(attribute='item.row') | list }} failed their review:
          {{ guard_reviews.results | rejectattr('rc', 'equalto', 0)
             | map(attribute='stdout_lines') | flatten
             | select('search', 'msg|fatal|ERROR') | list }}

    - name: Remove the fixture tree
      ansible.builtin.file:
        path: "{{ guard_root }}"
        state: absent

    - name: Report what was proved
      ansible.builtin.debug:
        msg: >-
          image downgrade guard: {{ guard_results | length }} cases hold --
          {{ guard_results | selectattr('refused') | map(attribute='name') | list | length }}
          refused and
          {{ guard_results | rejectattr('refused') | map(attribute='name') | list | length }}
          allowed, with --all asked of the daemon.
