---
# One-time credential authoring for a brand-new platform; never use it to
# recover an existing deployment. Run it through "Brand-new platform starter"
# in docs/secrets.md. Never encrypt the result to inventory/group_vars/all/vault.yml:
# it would load before every vault_<role>.yml and break decryption (#641).
# Hashes come from each service's pinned image, so the format is what it accepts.
- name: Author credentials for the vault
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    generate_brand_new_platform: false
    # docs/secrets.md consumes this path; tests/secrets_docs_test.rb derives it from here.
    vault_plain_path: "{{ playbook_dir }}/inventory/group_vars/all/vault-plain.yml"
    # A refusal target only, so a rerun cannot overwrite an existing vault;
    # best-effort, since PLATFORM_VAULT_FILE may be unset.
    vault_external_path: >-
      {{ lookup('env', 'PLATFORM_VAULT_FILE')
         | default(lookup('env', 'HOME') ~ '/.config/nas-platform/vault.yml', true) }}
    # The retired single-file vault (#641).
    vault_retired_path: "{{ playbook_dir }}/inventory/group_vars/all/vault.yml"
    generate_vault_collisions: >-
      {{ generate_existing.results | default([]) | selectattr('stat.exists')
         | map(attribute='item') | list }}
    # A var rather than an inline conditional: a folded scalar keeps the newline
    # before a more-indented line, which broke the sentence in fail_msg.
    generate_retired_vault_guidance: >-
      {{ ' The file at ' ~ vault_retired_path ~ ' is the single-file vault #612 retired:
      move it out of the checkout rather than merging it, because it is loaded ahead of
      every vault_<role>.yml beside it.'
      if vault_retired_path in generate_vault_collisions else '' }}
    password_spec: "/dev/null chars=ascii_letters,digits length=32"

    # Review these identities before first deployment.
    audiobookshelf_admin_username: nasadmin
    dozzle_admin_username: nasadmin
    immich_admin_email: nasadmin@example.invalid
    immich_db_name: immich
    immich_db_username: immich
    jellyfin_admin_username: nasadmin
    komga_admin_email: nasadmin@example.invalid
    beszel_superuser_email: nasadmin@example.invalid
    beszel_app_user_email: nasadmin@example.invalid
    karakeep_admin_email: nasadmin@example.invalid
    paperless_admin_username: nasadmin
    paperless_admin_email: nasadmin@example.invalid
    paperless_db_name: paperless
    paperless_db_username: paperless
    paperless_gmail_account: replace-with-gmail-address
    paperless_gmail_app_password: replace-with-google-app-password
    # The first start creates this account; decide it before the first converge.
    nextcloud_admin_username: nasadmin
    nextcloud_db_name: nextcloud
    nextcloud_db_username: nextcloud

  tasks:
    - name: Require explicit confirmation of a brand-new platform
      ansible.builtin.assert:
        that:
          - generate_brand_new_platform | bool
        fail_msg: >-
          Refusing to generate recovery or rotation credentials. Populate the
          real vault from the password manager and the deployed configuration.
          For a truly brand-new platform with no existing state, rerun with
          -e generate_brand_new_platform=true.
        success_msg: Brand-new platform credential generation was explicitly confirmed.

    - name: Require Docker, since hashes come from the service images themselves
      ansible.builtin.command:
        argv: [docker, version, --format, json]
      changed_when: false
      check_mode: false

    - name: Look for existing vault material
      ansible.builtin.stat:
        path: "{{ item }}"
      register: generate_existing
      loop:
        - "{{ vault_plain_path }}"
        - "{{ vault_external_path }}"
        - "{{ vault_retired_path }}"

    - name: Refuse to overwrite credentials that already exist
      ansible.builtin.assert:
        that:
          - generate_vault_collisions | length == 0
        # Built by selection, not subscript: Ansible templates fail_msg even when the
        # assertion passes, so indexing an empty list would fail the play.
        fail_msg: >-
          Vault material already exists at {{ generate_vault_collisions | join(', ') }}.
          Regenerating would invalidate every credential already deployed. This
          playbook has no overwrite or rotation mode; use the password manager
          and deployed configuration.{{ generate_retired_vault_guidance }}
        success_msg: "No existing vault material, safe to generate"

    # Read the pin from Compose so Renovate cannot leave this play stale; the image
    # is used only for its PHP bcrypt hasher.
    - name: Read the Nextcloud Compose definition
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/services/nextcloud/compose.yml"
      register: generate_hasher_compose

    - name: Resolve the pinned bcrypt hasher image
      ansible.builtin.set_fact:
        hasher_image: "{{ (generate_hasher_compose.content | b64decode | from_yaml).services.nextcloud.image }}"

    - name: Generate passwords
      ansible.builtin.set_fact:
        arr_radarr_api_key: "{{ lookup('password', '/dev/null chars=hexdigits length=32') | lower }}"
        arr_radarr_admin_username: nasadmin
        arr_radarr_admin_password: "{{ lookup('password', password_spec) }}"
        arr_sonarr_api_key: "{{ lookup('password', '/dev/null chars=hexdigits length=32') | lower }}"
        arr_sonarr_admin_username: nasadmin
        arr_sonarr_admin_password: "{{ lookup('password', password_spec) }}"
        arr_prowlarr_api_key: "{{ lookup('password', '/dev/null chars=hexdigits length=32') | lower }}"
        arr_prowlarr_admin_username: nasadmin
        arr_prowlarr_admin_password: "{{ lookup('password', password_spec) }}"
        arr_bazarr_api_key: "{{ lookup('password', '/dev/null chars=hexdigits length=32') | lower }}"
        arr_bazarr_admin_username: nasadmin
        arr_bazarr_admin_password: "{{ lookup('password', password_spec) }}"
        downloaders_sabnzbd_api_key: "{{ lookup('password', '/dev/null chars=hexdigits length=32') | lower }}"
        downloaders_sabnzbd_admin_username: nasadmin
        downloaders_sabnzbd_admin_password: "{{ lookup('password', password_spec) }}"
        bindery_api_key: "{{ lookup('password', '/dev/null chars=hexdigits length=32') | lower }}"
        bindery_admin_username: nasadmin
        bindery_admin_password: "{{ lookup('password', password_spec) }}"
        kapowarr_admin_username: nasadmin
        kapowarr_admin_password: "{{ lookup('password', password_spec) }}"
        pinchflat_admin_username: nasadmin
        pinchflat_admin_password: "{{ lookup('password', password_spec) }}"
        trailarr_api_key: "{{ lookup('password', '/dev/null chars=hexdigits length=32') | lower }}"
        trailarr_admin_username: nasadmin
        trailarr_admin_password: "{{ lookup('password', password_spec) }}"
        seerr_api_key: "{{ lookup('password', '/dev/null chars=hexdigits length=32') | lower }}"
        audiobookshelf_admin_password: "{{ lookup('password', password_spec) }}"
        dozzle_admin_password: "{{ lookup('password', password_spec) }}"
        dozzle_alert_relay_token: >-
          {{ lookup('password', '/dev/null chars=hexdigits length=64') | lower }}
        immich_admin_password: "{{ lookup('password', password_spec) }}"
        immich_db_password: "{{ lookup('password', password_spec) }}"
        jellyfin_admin_password: "{{ lookup('password', password_spec) }}"
        komga_admin_password: "{{ lookup('password', password_spec) }}"
        beszel_superuser_password: "{{ lookup('password', password_spec) }}"
        beszel_app_user_password: "{{ lookup('password', password_spec) }}"
        paperless_admin_password: "{{ lookup('password', password_spec) }}"
        paperless_db_password: "{{ lookup('password', password_spec) }}"
        paperless_django_secret_key: >-
          {{ lookup('password', '/dev/null chars=ascii_letters,digits length=64') }}
        nextcloud_admin_password: "{{ lookup('password', password_spec) }}"
        nextcloud_db_password: "{{ lookup('password', password_spec) }}"
        nextcloud_cache_password: "{{ lookup('password', password_spec) }}"
        karakeep_nextauth_secret: >-
          {{ lookup('password', '/dev/null chars=hexdigits length=64') | lower }}
        karakeep_meili_master_key: >-
          {{ lookup('password', '/dev/null chars=hexdigits length=64') | lower }}
        karakeep_admin_password: >-
          {{ lookup('password', '/dev/null chars=hexdigits length=64') | lower }}
        # Beszel stores universal tokens as UUIDs and accepts an authored value.
        beszel_universal_token: "{{ lookup('password', password_spec) | to_uuid }}"
      no_log: true

    # The hub uses a keypair placed before first start, so the agent KEY is known
    # in advance and nothing is read back.
    - name: Create a working directory for the Beszel hub keypair
      ansible.builtin.tempfile:
        state: directory
        suffix: beszel-hub-key
      register: generate_keydir

    - name: Generate the Beszel hub keypair
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -t
          - ed25519
          - -N
          - ""
          - -C
          - beszel hub
          - -f
          - "{{ generate_keydir.path }}/id_ed25519"
      changed_when: true
      check_mode: false

    # Dozzle's agent mTLS pair: each end trusts this cert as its only CA (the
    # image's built-in pair is public).
    - name: Generate the Dozzle agent TLS pair
      ansible.builtin.command:
        argv:
          - openssl
          - req
          - -x509
          - -newkey
          - ec
          - -pkeyopt
          - ec_paramgen_curve:prime256v1
          - -nodes
          - -days
          - "3650"
          - -subj
          - /O=nas-platform dozzle agent
          - -keyout
          - "{{ generate_keydir.path }}/dozzle-agent-key.pem"
          - -out
          - "{{ generate_keydir.path }}/dozzle-agent-cert.pem"
      changed_when: true
      check_mode: false

    - name: Read the Beszel hub keypair
      ansible.builtin.slurp:
        src: "{{ generate_keydir.path }}/{{ item }}"
      register: generate_hub_key
      loop:
        - id_ed25519
        - id_ed25519.pub
        - dozzle-agent-cert.pem
        - dozzle-agent-key.pem
      no_log: true

    - name: Remove the keypair working directory
      ansible.builtin.file:
        path: "{{ generate_keydir.path }}"
        state: absent

    # The name is the one tests/policy_vault_test.rb pins. The password travels
    # on stdin, never in argv.
    - name: Hash the administrator passwords with the pinned bcrypt hasher
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - -i
          - --entrypoint
          - php
          - "{{ hasher_image }}"
          - -r
          - 'echo password_hash(rtrim(fgets(STDIN), "\n"), PASSWORD_BCRYPT), "\n";'
        stdin: "{{ item }}\n"
      register: generate_hashes
      changed_when: false
      check_mode: false
      no_log: true
      loop:
        - "{{ dozzle_admin_password }}"
        - "{{ trailarr_admin_password }}"

    - name: Collect the generated material
      ansible.builtin.set_fact:
        dozzle_admin_password_hash: "{{ generate_hashes.results[0].stdout | regex_search(bcrypt) }}"
        trailarr_admin_password_hash: "{{ generate_hashes.results[1].stdout | regex_search(bcrypt) }}"
        beszel_hub_private_key: "{{ generate_hub_key.results[0].content | b64decode }}"
        dozzle_agent_certificate: "{{ generate_hub_key.results[2].content | b64decode }}"
        dozzle_agent_private_key: "{{ generate_hub_key.results[3].content | b64decode }}"
        # Two fields only: the hub advertises no comment, so one would fail comparison.
        beszel_agent_key: >-
          {{ (generate_hub_key.results[1].content | b64decode).split()[:2] | join(' ') }}
      vars:
        bcrypt: '\$2[aby]\$[0-9]{2}\$[./A-Za-z0-9]{53}'
      no_log: true

    - name: Fail loudly if any value did not parse
      ansible.builtin.assert:
        that:
          - dozzle_admin_password_hash | length == 60
          - trailarr_admin_password_hash | length == 60
          - dozzle_alert_relay_token is match('^[0-9a-f]{64}\\Z')
          - beszel_hub_private_key is search('OPENSSH PRIVATE KEY')
          - dozzle_agent_certificate is search('-----BEGIN CERTIFICATE-----')
          - dozzle_agent_private_key is search('-----BEGIN PRIVATE KEY-----')
          - beszel_agent_key.startswith('ssh-ed25519 ')
          - beszel_universal_token | length == 36
          # Bazarr int()-casts submitted values whose key does not end in a str_key, so an
          # all-digit Radarr/Sonarr key would be answered 406 for good.
          - arr_radarr_api_key is match('^[0-9a-f]{32}\\Z')
          - arr_radarr_api_key is search('[a-f]')
          - arr_radarr_admin_username | length > 0
          - arr_radarr_admin_password | length > 0
          - arr_sonarr_api_key is match('^[0-9a-f]{32}\\Z')
          - arr_sonarr_api_key is search('[a-f]')
          - arr_sonarr_admin_username | length > 0
          - arr_sonarr_admin_password | length > 0
          - arr_prowlarr_api_key is match('^[0-9a-f]{32}\\Z')
          - arr_prowlarr_admin_username | length > 0
          - arr_prowlarr_admin_password | length > 0
          - arr_bazarr_api_key is match('^[0-9a-f]{32}\\Z')
          - arr_bazarr_admin_username | length > 0
          - arr_bazarr_admin_password | length > 0
          - downloaders_sabnzbd_api_key is match('^[0-9a-f]{32}\\Z')
          - downloaders_sabnzbd_admin_username | length > 0
          - downloaders_sabnzbd_admin_password | length > 0
          - bindery_api_key is match('^[0-9a-f]{32}\\Z')
          - bindery_admin_username | length > 0
          - bindery_admin_password | length >= 8
          - kapowarr_admin_username | length > 0
          - kapowarr_admin_password | length > 0
          - karakeep_nextauth_secret is match('^[0-9a-f]{64}\\Z')
          - karakeep_meili_master_key is match('^[0-9a-f]{64}\\Z')
          - karakeep_admin_password is match('^[0-9a-f]{64}\\Z')
          - pinchflat_admin_username | length > 0
          - pinchflat_admin_password | length > 0
          - trailarr_api_key is match('^[0-9a-f]{32}\\Z')
          - trailarr_admin_username | length > 0
          - trailarr_admin_password | length > 0
          - seerr_api_key is match('^[0-9a-f]{32}\\Z')
          - >-
            [arr_radarr_api_key, arr_sonarr_api_key, arr_prowlarr_api_key,
             arr_bazarr_api_key, downloaders_sabnzbd_api_key]
            | unique | length == 5
          - >-
            [arr_radarr_admin_password, arr_sonarr_admin_password,
             arr_prowlarr_admin_password, arr_bazarr_admin_password,
             downloaders_sabnzbd_admin_password]
            | unique | length == 5
        fail_msg: >-
          A generated credential did not match its expected shape. Refusing to
          write a partial vault file.
        success_msg: "All generated credentials have the expected shape"
      no_log: true

    - name: Write the plaintext vars file for encryption
      ansible.builtin.template:
        src: templates/vault-plain.yml.j2
        dest: "{{ vault_plain_path }}"
        mode: "0600"
      no_log: true

    - name: Explain the remaining manual step
      ansible.builtin.debug:
        msg:
          - "Wrote {{ vault_plain_path }} with mode 0600."
          - "This output is only for a brand-new platform with no state to adopt."
          - "To recover a deployment, use the password manager and deployed values instead."
          - "Review identity and external-integration fields before deployment."
          - >-
            Next: docs/secrets.md, 'Brand-new platform starter'. Move this file
            into a protected temporary directory and encrypt it there to
            $PLATFORM_VAULT_FILE.
          - >-
            Never encrypt it into this checkout.
            inventory/group_vars/all/vault.yml is retired and is loaded ahead of
            every vault_<role>.yml beside it, which are encrypted under a
            different password.
          - >-
            The repository's per-service vault files are then authored from that
            external vault one service at a time.
          - "Keep the vault password in a password manager, never in this repo."
