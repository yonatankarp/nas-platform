---
# One-time credential authoring for a brand-new platform with no existing state.
# Never use this play to recover an existing deployment: copy the deployed
# identities, database passwords, application keys, and integrations from the
# password manager and the deployed configuration into the real vault instead.
#
#   ansible-playbook generate-secrets.yml
#   mv inventory/group_vars/all/vault-plain.yml inventory/group_vars/all/vault.yml
#   ansible-vault encrypt inventory/group_vars/all/vault.yml
#
# Hashes and tokens come from each service's own pinned image rather than a
# generic library, so they are in exactly the format that service accepts. This
# also avoids passlib, which is unavailable on Python 3.13 and newer where the
# crypt module was removed, and sidesteps the $2a$ versus $2b$ question entirely.
- name: Author credentials for the vault
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # The operator must opt in deliberately. There is no migration or rotation
    # mode in this playbook.
    generate_brand_new_platform: false
    vault_plain_path: "{{ playbook_dir }}/inventory/group_vars/all/vault-plain.yml"
    vault_encrypted_path: "{{ playbook_dir }}/inventory/group_vars/all/vault.yml"
    password_spec: "/dev/null chars=ascii_letters,digits length=32"

    # Review these identities before first deployment.
    audiobookshelf_admin_username: nasadmin
    dozzle_admin_username: nasadmin
    immich_admin_email: nasadmin@example.invalid
    immich_db_name: immich
    immich_db_username: immich
    jellyfin_admin_username: nasadmin
    komga_admin_email: nasadmin@example.invalid
    ntfy_admin_user: nasadmin
    beszel_superuser_email: nasadmin@example.invalid
    beszel_app_user_email: nasadmin@example.invalid
    paperless_admin_username: nasadmin
    paperless_admin_email: nasadmin@example.invalid
    paperless_db_name: paperless
    paperless_db_username: paperless
    paperless_gmail_account: replace-with-gmail-address
    paperless_gmail_app_password: replace-with-google-app-password
    paperless_mail_account_name: gmail
    paperless_mail_rule_name: inbox

  tasks:
    - name: Require explicit confirmation of a brand-new platform
      ansible.builtin.assert:
        that:
          - generate_brand_new_platform | bool
        fail_msg: >-
          Refusing to generate recovery or rotation credentials. Populate the
          real vault from the password manager and the deployed configuration.
          For a truly brand-new platform with no existing state, rerun with
          -e generate_brand_new_platform=true.
        success_msg: Brand-new platform credential generation was explicitly confirmed.

    - name: Require Docker, since hashes come from the service images themselves
      ansible.builtin.command:
        argv: [docker, version, --format, json]
      changed_when: false
      check_mode: false

    - name: Look for existing vault material
      ansible.builtin.stat:
        path: "{{ item }}"
      register: generate_existing
      loop:
        - "{{ vault_plain_path }}"
        - "{{ vault_encrypted_path }}"

    - name: Refuse to overwrite credentials that already exist
      ansible.builtin.assert:
        that:
          - not (generate_existing.results | map(attribute='stat.exists') | select | list | length)
        fail_msg: >-
          Vault material already exists. Regenerating would invalidate every
          credential already deployed. This playbook has no overwrite or
          rotation mode; use the password manager and deployed configuration.
        success_msg: "No existing vault material, safe to generate"

    # Read the pinned image from the Compose definition rather than repeating it,
    # so a Renovate update cannot leave this play on a stale digest.
    - name: Read the ntfy Compose definition
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/services/ntfy/compose.yml"
      register: generate_ntfy_compose

    - name: Resolve the pinned ntfy image
      ansible.builtin.set_fact:
        ntfy_image: "{{ (generate_ntfy_compose.content | b64decode | from_yaml).services.ntfy.image }}"

    - name: Generate passwords
      ansible.builtin.set_fact:
        arr_radarr_api_key: "{{ lookup('password', '/dev/null chars=hexdigits length=32') | lower }}"
        arr_radarr_admin_username: nasadmin
        arr_radarr_admin_password: "{{ lookup('password', password_spec) }}"
        arr_sonarr_api_key: "{{ lookup('password', '/dev/null chars=hexdigits length=32') | lower }}"
        arr_sonarr_admin_username: nasadmin
        arr_sonarr_admin_password: "{{ lookup('password', password_spec) }}"
        arr_prowlarr_api_key: "{{ lookup('password', '/dev/null chars=hexdigits length=32') | lower }}"
        arr_prowlarr_admin_username: nasadmin
        arr_prowlarr_admin_password: "{{ lookup('password', password_spec) }}"
        arr_bazarr_api_key: "{{ lookup('password', '/dev/null chars=hexdigits length=32') | lower }}"
        arr_bazarr_admin_username: nasadmin
        arr_bazarr_admin_password: "{{ lookup('password', password_spec) }}"
        downloaders_sabnzbd_api_key: "{{ lookup('password', '/dev/null chars=hexdigits length=32') | lower }}"
        downloaders_sabnzbd_admin_username: nasadmin
        downloaders_sabnzbd_admin_password: "{{ lookup('password', password_spec) }}"
        audiobookshelf_admin_password: "{{ lookup('password', password_spec) }}"
        dozzle_admin_password: "{{ lookup('password', password_spec) }}"
        immich_admin_password: "{{ lookup('password', password_spec) }}"
        immich_db_password: "{{ lookup('password', password_spec) }}"
        jellyfin_admin_password: "{{ lookup('password', password_spec) }}"
        komga_admin_password: "{{ lookup('password', password_spec) }}"
        ntfy_admin_password: "{{ lookup('password', password_spec) }}"
        ntfy_dozzle_password: "{{ lookup('password', password_spec) }}"
        ntfy_beszel_password: "{{ lookup('password', password_spec) }}"
        ntfy_deploy_password: "{{ lookup('password', password_spec) }}"
        beszel_superuser_password: "{{ lookup('password', password_spec) }}"
        beszel_app_user_password: "{{ lookup('password', password_spec) }}"
        paperless_admin_password: "{{ lookup('password', password_spec) }}"
        paperless_db_password: "{{ lookup('password', password_spec) }}"
        paperless_django_secret_key: >-
          {{ lookup('password', '/dev/null chars=ascii_letters,digits length=64') }}
        # Beszel stores universal tokens as UUIDs and accepts an authored value.
        beszel_universal_token: "{{ lookup('password', password_spec) | to_uuid }}"
      no_log: true

    # The hub uses a keypair placed at /beszel_data/id_ed25519 before first start
    # rather than generating its own, so authoring it here means the agent's KEY
    # is known in advance and nothing is read back from a running hub.
    - name: Create a working directory for the Beszel hub keypair
      ansible.builtin.tempfile:
        state: directory
        suffix: beszel-hub-key
      register: generate_keydir

    - name: Generate the Beszel hub keypair
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -t
          - ed25519
          - -N
          - ""
          - -C
          - beszel hub
          - -f
          - "{{ generate_keydir.path }}/id_ed25519"
      changed_when: true
      check_mode: false

    - name: Read the Beszel hub keypair
      ansible.builtin.slurp:
        src: "{{ generate_keydir.path }}/{{ item }}"
      register: generate_hub_key
      loop:
        - id_ed25519
        - id_ed25519.pub
      no_log: true

    - name: Remove the keypair working directory
      ansible.builtin.file:
        path: "{{ generate_keydir.path }}"
        state: absent

    - name: Hash the ntfy passwords with ntfy's own hasher
      ansible.builtin.command:
        argv: [docker, run, --rm, -i, "{{ ntfy_image }}", user, hash]
        stdin: "{{ item }}\n{{ item }}\n"
      register: generate_hashes
      changed_when: false
      check_mode: false
      no_log: true
      loop:
        - "{{ ntfy_admin_password }}"
        - "{{ ntfy_dozzle_password }}"
        - "{{ ntfy_beszel_password }}"
        - "{{ ntfy_deploy_password }}"
        - "{{ dozzle_admin_password }}"

    # tk_ plus 29 lowercase alphanumeric characters, 32 in total, per ntfy's own
    # tokenPrefix and tokenLength where the length includes the prefix.
    - name: Generate the ntfy access tokens with ntfy's own generator
      ansible.builtin.command:
        argv: [docker, run, --rm, "{{ ntfy_image }}", token, generate]
      register: generate_tokens
      changed_when: false
      check_mode: false
      no_log: true
      loop: [dozzle, beszel, deploy]

    - name: Collect the generated material
      ansible.builtin.set_fact:
        ntfy_admin_hash: "{{ generate_hashes.results[0].stdout | regex_search(bcrypt) }}"
        ntfy_dozzle_hash: "{{ generate_hashes.results[1].stdout | regex_search(bcrypt) }}"
        ntfy_beszel_hash: "{{ generate_hashes.results[2].stdout | regex_search(bcrypt) }}"
        ntfy_deploy_hash: "{{ generate_hashes.results[3].stdout | regex_search(bcrypt) }}"
        dozzle_admin_password_hash: "{{ generate_hashes.results[4].stdout | regex_search(bcrypt) }}"
        ntfy_dozzle_token: "{{ generate_tokens.results[0].stdout | regex_search('tk_[a-z0-9]{29}') }}"
        ntfy_beszel_token: "{{ generate_tokens.results[1].stdout | regex_search('tk_[a-z0-9]{29}') }}"
        ntfy_deploy_token: "{{ generate_tokens.results[2].stdout | regex_search('tk_[a-z0-9]{29}') }}"
        beszel_hub_private_key: "{{ generate_hub_key.results[0].content | b64decode }}"
        # Two fields only. The hub advertises "type base64" with no comment, so
        # storing the comment would make every comparison against it fail.
        beszel_agent_key: >-
          {{ (generate_hub_key.results[1].content | b64decode).split()[:2] | join(' ') }}
      vars:
        bcrypt: '\$2[aby]\$[0-9]{2}\$[./A-Za-z0-9]{53}'
      no_log: true

    - name: Fail loudly if any value did not parse
      ansible.builtin.assert:
        that:
          - ntfy_admin_hash | length == 60
          - ntfy_dozzle_hash | length == 60
          - ntfy_beszel_hash | length == 60
          - ntfy_deploy_hash | length == 60
          - dozzle_admin_password_hash | length == 60
          - ntfy_dozzle_token | length == 32
          - ntfy_beszel_token | length == 32
          - ntfy_deploy_token | length == 32
          - >-
            [ntfy_dozzle_token, ntfy_beszel_token, ntfy_deploy_token]
            | unique | length == 3
          - beszel_hub_private_key is search('OPENSSH PRIVATE KEY')
          - beszel_agent_key.startswith('ssh-ed25519 ')
          - beszel_universal_token | length == 36
          - arr_radarr_api_key is match('^[0-9a-f]{32}\\Z')
          - arr_radarr_admin_username | length > 0
          - arr_radarr_admin_password | length > 0
          - arr_sonarr_api_key is match('^[0-9a-f]{32}\\Z')
          - arr_sonarr_admin_username | length > 0
          - arr_sonarr_admin_password | length > 0
          - arr_prowlarr_api_key is match('^[0-9a-f]{32}\\Z')
          - arr_prowlarr_admin_username | length > 0
          - arr_prowlarr_admin_password | length > 0
          - arr_bazarr_api_key is match('^[0-9a-f]{32}\\Z')
          - arr_bazarr_admin_username | length > 0
          - arr_bazarr_admin_password | length > 0
          - downloaders_sabnzbd_api_key is match('^[0-9a-f]{32}\\Z')
          - downloaders_sabnzbd_admin_username | length > 0
          - downloaders_sabnzbd_admin_password | length > 0
          - >-
            [arr_radarr_api_key, arr_sonarr_api_key, arr_prowlarr_api_key,
             arr_bazarr_api_key, downloaders_sabnzbd_api_key]
            | unique | length == 5
          - >-
            [arr_radarr_admin_password, arr_sonarr_admin_password,
             arr_prowlarr_admin_password, arr_bazarr_admin_password,
             downloaders_sabnzbd_admin_password]
            | unique | length == 5
        fail_msg: >-
          A generated credential did not match its expected shape. Refusing to
          write a partial vault file.
        success_msg: "All generated credentials have the expected shape"
      no_log: true

    - name: Write the plaintext vars file for encryption
      ansible.builtin.template:
        src: templates/vault-plain.yml.j2
        dest: "{{ vault_plain_path }}"
        mode: "0600"
      no_log: true

    - name: Explain the remaining manual step
      ansible.builtin.debug:
        msg:
          - "Wrote {{ vault_plain_path }} with mode 0600."
          - "This output is only for a brand-new platform with no state to adopt."
          - "To recover a deployment, use the password manager and deployed values instead."
          - "Review identity and external-integration fields before deployment."
          - "Then move it to vault.yml and run: ansible-vault encrypt vault.yml"
          - "Keep the vault password in a password manager, never in this repo."
