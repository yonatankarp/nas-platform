---
# Refuse to start an image older than one that already ran against the service's
# store (#511). Compares image versions, not schema versions: the schema is readable
# only by the application that will not start. Docker's recorded Config.Image is used.
#
# Under --check `current` still names the replaced release, so a review reads the
# candidate pin from the controller checkout through a lookup (#851).
- name: Read the deployed Compose definition of the guarded service
  ansible.builtin.slurp:
    path: >-
      {{ platform_current_dir }}/services/{{ image_downgrade_guard_service_name }}/compose.yml
  register: image_downgrade_guard_compose_source
  when: not ansible_check_mode

- name: Resolve the pinned image reference of the guarded container
  ansible.builtin.set_fact:
    image_downgrade_guard_pinned_image: >-
      {{ ((lookup('ansible.builtin.file', image_downgrade_guard_candidate_root
                  ~ '/services/' ~ image_downgrade_guard_service_name ~ '/compose.yml')
           if ansible_check_mode
           else image_downgrade_guard_compose_source.content | b64decode) | from_yaml)
         .services[image_downgrade_guard_compose_service].image }}

# --all: the container this guards is the crash-looping or dead one.
- name: List every container the guarded Compose service holds
  ansible.builtin.command:
    argv:
      - docker
      - container
      - ls
      - --all
      - --quiet
      - --filter
      - "label=com.docker.compose.project={{ image_downgrade_guard_project_name }}"
      - --filter
      - "label=com.docker.compose.service={{ image_downgrade_guard_compose_service }}"
  register: image_downgrade_guard_container_ids
  changed_when: false
  check_mode: false

# Redacted: inspect returns Env, i.e. every credential in the rendered .env.
- name: Inspect the containers of the guarded Compose service
  ansible.builtin.command:
    argv: "{{ ['docker', 'container', 'inspect'] + image_downgrade_guard_container_ids.stdout_lines }}"
  register: image_downgrade_guard_inspection
  changed_when: false
  check_mode: false
  no_log: true
  when: image_downgrade_guard_container_ids.stdout_lines | length > 0

# Only the same repository is comparable; a registry move has no version ordering.
- name: Resolve the image references this host has run for the guarded service
  ansible.builtin.set_fact:
    image_downgrade_guard_pinned_repository: >-
      {{ image_downgrade_guard_pinned_image | regex_replace('@.*$', '')
         | regex_replace(':[^:/]*$', '') }}
    image_downgrade_guard_deployed_images: >-
      {{ image_downgrade_guard_inspection.stdout | default('[]', true) | from_json
         | map(attribute='Config.Image') | select('string') | list }}

# The repository is stripped first: a registry port (host:5000/x:v1) would otherwise
# parse as the version. Unparseable tags are dropped and reported, never refused.
- name: Resolve the comparable image versions of the guarded service
  ansible.builtin.set_fact:
    image_downgrade_guard_pinned_version: >-
      {{ image_downgrade_guard_pinned_image | regex_replace('@.*$', '')
         | regex_replace('^.*/', '')
         | regex_search('(?<=:)v?[0-9]+(\.[0-9]+)*') | default('', true)
         | regex_replace('^v', '') }}
    image_downgrade_guard_deployed_versions: >-
      {{ image_downgrade_guard_deployed_images
         | select('match', (image_downgrade_guard_pinned_repository | regex_escape) ~ ':')
         | map('regex_replace', '@.*$', '') | map('regex_replace', '^.*/', '')
         | map('regex_search', '(?<=:)v?[0-9]+(\.[0-9]+)*')
         | select('string') | map('regex_replace', '^v', '') | unique | list }}

- name: Resolve the versions the pinned image would go back past
  ansible.builtin.set_fact:
    image_downgrade_guard_newer_versions: >-
      {{ image_downgrade_guard_deployed_versions
         | select('version', image_downgrade_guard_pinned_version, '>') | list
         if image_downgrade_guard_pinned_version | length > 0 else [] }}

- name: Refuse an image older than the store the host has already migrated
  ansible.builtin.assert:
    that:
      - image_downgrade_guard_newer_versions | length == 0
    fail_msg: >-
      {{ image_downgrade_guard_compose_service }} has already run
      {{ image_downgrade_guard_newer_versions | join(', ') }} against the store in
      {{ image_downgrade_guard_store_description }}, and this release pins the
      older {{ image_downgrade_guard_pinned_version }}. A service that migrates
      its own store on start writes a schema the older image does not know, and
      the older image refuses to open it rather than damage it -- inside the
      container, which is a crash loop every converge repeats rather than a
      failure a play reports (#511). Move the pin forward again, to a version at
      least as new as the ones named above, and merge it: the release the host
      converges is the one that has to go forward, because the migration the
      store already took is one-way.
    success_msg: >-
      {{ image_downgrade_guard_compose_service }} pins
      {{ image_downgrade_guard_pinned_image }} and no container on this host has
      run a newer version of it.

- name: Report a comparison the downgrade guard declined to make
  ansible.builtin.debug:
    msg: >-
      The {{ image_downgrade_guard_compose_service }} downgrade guard compared no
      versions.
      {{ 'The release pins ' ~ image_downgrade_guard_pinned_image ~ ', whose tag is not a dotted numeric version.'
         if image_downgrade_guard_pinned_version | length == 0
         else 'No container on this host was created from ' ~ image_downgrade_guard_pinned_repository
              ~ ' with a comparable tag, so there is no earlier version for the pin to go back past.' }}
      A pin is refused only where both sides parse, because a version that cannot
      be read cannot be known to have gone backwards.
  when: >-
    image_downgrade_guard_pinned_version | length == 0
    or image_downgrade_guard_deployed_versions | length == 0
