---
# Only the poller's hourly --verify runs this (#609): a degraded array still
# serves, so it must not fail a converge. Healthy is not `degraded == 0` (ADM's
# md0/md126 read 2), so each array is compared by equality to its baseline.
- name: Report why mdraid verification does not apply to this host
  ansible.builtin.debug:
    msg: >-
      mdraid verification skipped:
      {{ 'no array baseline is declared for this host'
         if host_prep_mdraid_arrays | length == 0 else
         'platform_compose_kind is ' ~ platform_compose_kind ~ ', and only nas has these arrays' }}.
  when: host_prep_mdraid_arrays | length == 0 or platform_compose_kind != 'nas'
  tags: [platform_verify_mdraid]

- name: Verify mdraid arrays against the declared healthy baseline
  when:
    - host_prep_mdraid_arrays | length > 0
    - platform_compose_kind == 'nas'
  tags: [platform_verify_mdraid]
  block:
    - name: Inspect the md block devices present on the host
      ansible.builtin.find:
        paths: "{{ host_prep_mdraid_sysfs_root }}/block"
        patterns: "md*"
        file_type: any
      register: host_prep_mdraid_devices
      changed_when: false

    # failed_when: false because absence is a verdict here, not an error: a
    # missing file becomes `absent` below and fails the assert with its name.
    - name: Read the degraded member count of every declared array
      ansible.builtin.slurp:
        src: "{{ host_prep_mdraid_sysfs_root }}/block/{{ item }}/md/degraded"
      loop: "{{ host_prep_mdraid_arrays.keys() | sort }}"
      register: host_prep_mdraid_degraded
      changed_when: false
      failed_when: false

    # Every value the assert's messages name is computed here on every path, so
    # neither message can reference a key the passing path lacks.
    - name: Compare every declared array against its baseline
      ansible.builtin.set_fact:
        host_prep_mdraid_expected: >-
          {{ host_prep_mdraid_arrays.keys() | sort |
             zip(host_prep_mdraid_arrays.keys() | sort | map('extract', host_prep_mdraid_arrays) | map('string')) |
             map('join', '=') | list }}
        host_prep_mdraid_observed: >-
          {{ host_prep_mdraid_degraded.results | map(attribute='item') |
             zip(host_prep_mdraid_degraded.results | map(attribute='content', default='') |
                 map('b64decode') | map('trim') | map('default', 'absent', true)) |
             map('join', '=') | list }}
        host_prep_mdraid_undeclared: >-
          {{ host_prep_mdraid_devices.files | map(attribute='path') | map('basename') |
             difference(host_prep_mdraid_arrays.keys()) | sort }}
      changed_when: false

    - name: Report md arrays present on the host but absent from the baseline
      ansible.builtin.debug:
        msg: >-
          UNDECLARED mdraid arrays, not verified: {{ host_prep_mdraid_undeclared | join(', ') }}.
          Read them off the host and declare them in host_prep_mdraid_arrays in
          inventory/group_vars/nas_hosts/main.yml.
      when: host_prep_mdraid_undeclared | length > 0

    # The fail_msg marker must equal the poller's MDRAID_MISMATCH_MARKER;
    # tests/production_auto_deploy_test.py reads it back from this task.
    - name: Verify no declared mdraid array has lost a member
      ansible.builtin.assert:
        that:
          - host_prep_mdraid_expected | difference(host_prep_mdraid_observed) | length == 0
        fail_msg: >-
          MDRAID-BASELINE-MISMATCH: mdraid array differs from its healthy baseline: expected degraded
          {{ host_prep_mdraid_expected | difference(host_prep_mdraid_observed) | sort | join(', ') }},
          observed {{ host_prep_mdraid_observed | difference(host_prep_mdraid_expected) | sort | join(', ') }}.
          Read /proc/mdstat on the host: a member has dropped out, a rebuild is
          still running, or the array is not assembled.
        success_msg: >-
          mdraid arrays match their healthy baseline: {{ host_prep_mdraid_observed | join(', ') }}.
