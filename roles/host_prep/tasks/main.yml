---
# Storage comes from the single nas_storage inventory, which also drives the
# policy test's cross-check against Compose volume sources and the recovery
# classification. Previously this was a directory list, a set of chown
# instructions in prose, and a hand-maintained recovery table: three places to
# forget.
- name: Validate central storage targets before directory creation
  ansible.builtin.include_role:
    name: deployment_bundle
    tasks_from: target
  vars:
    deployment_target_service: ""
    deployment_target_require_current_release: false
    deployment_target_extra_paths: "{{ nas_storage | map(attribute='path') | list }}"

- name: Inspect an existing exact-name media control network
  community.docker.docker_network_info:
    name: "{{ platform_media_control_network }}"
  register: host_prep_media_control_existing
  changed_when: false

- name: Refuse an existing media control network owned by another project
  ansible.builtin.assert:
    that:
      - host_prep_media_control_existing.network.Driver == 'bridge'
      - host_prep_media_control_existing.network.Labels | default(none) is mapping
      - host_prep_media_control_existing.network.Labels.get('nas.platform.purpose') == 'media-control'
      - host_prep_media_control_existing.network.Labels.get('nas.platform.project') == (platform_project_name | default('nas-platform', true))
      - host_prep_media_control_existing.network.Labels.keys() | sort == ['nas.platform.project', 'nas.platform.purpose']
    fail_msg: >-
      Refusing to modify the existing {{ platform_media_control_network }} network
      because its driver or complete ownership label set differs from this project.
  when: host_prep_media_control_existing.exists

- name: Create the external media control network
  ansible.builtin.command:
    argv:
      - docker
      - network
      - create
      - --driver
      - bridge
      - --label
      - nas.platform.purpose=media-control
      - --label
      - "nas.platform.project={{ platform_project_name | default('nas-platform', true) }}"
      - "{{ platform_media_control_network }}"
  register: host_prep_media_control_create
  changed_when: host_prep_media_control_create.rc == 0
  failed_when: host_prep_media_control_create.rc != 0
  when: not host_prep_media_control_existing.exists

- name: Inspect the exact media control network after create-only handling
  community.docker.docker_network_info:
    name: "{{ platform_media_control_network }}"
  register: host_prep_media_control_final
  changed_when: false

- name: Require the exact media control network after create-only handling
  ansible.builtin.assert:
    that:
      - host_prep_media_control_final.exists
      - host_prep_media_control_final.network.Name == platform_media_control_network
      - host_prep_media_control_final.network.Driver == 'bridge'
      - host_prep_media_control_final.network.Labels | default(none) is mapping
      - host_prep_media_control_final.network.Labels.get('nas.platform.purpose') == 'media-control'
      - host_prep_media_control_final.network.Labels.get('nas.platform.project') == (platform_project_name | default('nas-platform', true))
      - host_prep_media_control_final.network.Labels.keys() | sort == ['nas.platform.project', 'nas.platform.purpose']
    fail_msg: >-
      The exact {{ platform_media_control_network }} network was not present with
      the required bridge driver and complete ownership label set after create-only
      handling.
  when: not ansible_check_mode or host_prep_media_control_existing.exists

- name: Refuse to claim ownership of NAS-managed user files
  ansible.builtin.assert:
    that:
      - not (item.path is match((nas_media_root | regex_escape) ~ '/')
             and (item.owner is defined or item.group is defined))
    fail_msg: >-
      {{ item.path }} is under {{ nas_media_root }}, where the NAS owns the files.
      Grant access through the NAS permission controls rather than declaring
      owner or group here.
    success_msg: "{{ item.path }} ownership declaration is acceptable"
  loop: "{{ nas_storage }}"
  loop_control:
    label: "{{ item.path }}"

- name: Select synthetic integration writer ownership
  ansible.builtin.set_fact:
    host_prep_integration_writer_requested: >-
      {{ platform_kind == 'nas' and
         platform_compose_kind == 'integration' and
         (deployment_bundle_test_mode | bool) }}
    host_prep_integration_writer_enabled: >-
      {{ (platform_kind == 'nas') and
         (platform_compose_kind == 'integration') and
         (deployment_bundle_test_mode | bool) and
         (nas_media_root is match('^.*/nas-platform-integration[.][A-Za-z0-9]{6}/.+\Z')) }}
    host_prep_integration_writer_storage: >-
      {{ nas_storage |
         selectattr('media_acquisition_writer', 'defined') |
         selectattr('media_acquisition_writer', 'sameas', true) |
         list }}
  changed_when: false

- name: Require the exact integration media sandbox
  ansible.builtin.assert:
    that:
      - host_prep_integration_writer_enabled | bool
    fail_msg: >-
      Refusing synthetic media writer ownership for root
      {{ nas_media_root | to_json }}. Expected a root inside a disposable
      /nas-platform-integration.XXXXXX/ sandbox.
  when: host_prep_integration_writer_requested | bool

- name: Refuse preservation-only synthetic integration writers
  ansible.builtin.assert:
    that:
      - item.preserve_only is not defined
    fail_msg: >-
      Synthetic integration writer storage cannot be preservation-only:
      {{ item.path }}.
  loop: "{{ host_prep_integration_writer_storage }}"
  loop_control:
    label: "{{ item.path }}"

- name: Validate preservation-only storage declarations
  ansible.builtin.assert:
    that:
      - item.preserve_only is not defined or item.preserve_only
    fail_msg: >-
      {{ item.path }} has an invalid preservation-only declaration. Omit
      preserve_only for ordinary storage or set it to true for retained state.
  loop: "{{ nas_storage }}"
  loop_control:
    label: "{{ item.path }}"

- name: Inspect preservation-only service state directories
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
  loop: "{{ nas_storage | selectattr('preserve_only', 'defined') | list }}"
  loop_control:
    label: "{{ item.path }}"
  register: host_prep_preservation_only_storage

- name: Require safe preservation-only service state directories
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isdir
      - not item.stat.islnk
    fail_msg: >-
      Refusing storage preparation because preservation-only state at
      {{ item.item.path }} is absent or unsafe. Restore the real directory
      before retrying.
  loop: "{{ host_prep_preservation_only_storage.results }}"
  loop_control:
    label: "{{ item.item.path }}"

- name: Create service state directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    # Linux container UID/GID declarations do not map to macOS host ownership.
    owner: >-
      {{ nas_uid
         if (host_prep_integration_writer_enabled | bool) and
            (item.media_acquisition_writer | default(false)) is sameas true
         else item.owner
         if (platform_kind == 'nas' or (platform_manage_linux_ownership | bool)) and item.owner is defined
         else omit }}
    group: >-
      {{ nas_gid
         if (host_prep_integration_writer_enabled | bool) and
            (item.media_acquisition_writer | default(false)) is sameas true
         else item.group
         if (platform_kind == 'nas' or (platform_manage_linux_ownership | bool)) and item.group is defined
         else omit }}
    mode: "{{ item.mode }}"
  loop: "{{ nas_storage | rejectattr('preserve_only', 'defined') | list }}"
  loop_control:
    label: "{{ item.path }}"

- name: Inspect synthetic integration writer directories
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
  loop: "{{ host_prep_integration_writer_storage }}"
  loop_control:
    label: "{{ item.path }}"
  register: host_prep_integration_writer_stats
  changed_when: false
  when: host_prep_integration_writer_enabled | bool

- name: Require synthetic integration writer ownership
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isdir
      - not item.stat.islnk
      - item.stat.uid == (nas_uid | int)
      - item.stat.gid == (nas_gid | int)
      - item.stat.mode == item.item.mode
    fail_msg: >-
      Synthetic integration writer path differs from the application identity:
      {{ item.item.path }}.
  loop: "{{ host_prep_integration_writer_stats.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  changed_when: false
  when: host_prep_integration_writer_enabled | bool
