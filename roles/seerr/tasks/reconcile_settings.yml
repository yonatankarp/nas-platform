---
# Redacted: the request carries the API key.
- name: Read the declared Seerr main settings
  ansible.builtin.uri:
    url: "{{ seerr_api }}/settings/main"
    method: GET
    headers:
      X-Api-Key: "{{ vault_seerr_api_key }}"
    status_code: [200]
    return_content: true
  register: seerr_main_current
  changed_when: false
  check_mode: false
  no_log: true

# Only the declared keys are compared. The rest of the mapping is Seerr's own —
# the API key, the VAPID pair, the locale — and the platform has no opinion on
# it, so a change there must not read as drift.
- name: Resolve the Seerr main settings reconciliation
  ansible.builtin.set_fact:
    seerr_main_declared_now: >-
      {{ (seerr_main_current.json | default({})) | dict2items
         | selectattr('key', 'in', seerr_main_settings.keys() | list)
         | items2dict }}

- name: Decide whether the Seerr main settings need repair
  ansible.builtin.set_fact:
    seerr_main_repair: "{{ seerr_main_declared_now != seerr_main_settings }}"

- name: Report the planned Seerr main settings repair
  ansible.builtin.debug:
    msg: >-
      A live run would declare {{ seerr_main_settings | dict2items
      | map(attribute='key') | join(', ') }} on Seerr. defaultPermissions ships
      as 32 and newPlexLogin ships as true, and together they would give every
      Jellyfin user who signs in a standing request permission the design never
      granted.
  when:
    - ansible_check_mode
    - seerr_main_repair | bool

# POST /api/v1/settings/main is a deep merge rather than a replace — measured,
# the API key survived a partial body — so this sends only what the platform
# declares and leaves the rest of the mapping alone.
#
# Redacted: the request carries the API key.
- name: Declare the Seerr main settings
  ansible.builtin.uri:
    url: "{{ seerr_api }}/settings/main"
    method: POST
    headers:
      X-Api-Key: "{{ vault_seerr_api_key }}"
    body_format: json
    body: "{{ seerr_main_settings }}"
    status_code: [200]
  when:
    - not ansible_check_mode
    - seerr_main_repair | bool
  changed_when: true
  no_log: true

# Redacted: the request carries the API key, and the read-back carries the
# Pushover pair.
- name: Read the declared Seerr Pushover notification agent
  ansible.builtin.uri:
    url: "{{ seerr_api }}/settings/notifications/pushover"
    method: GET
    headers:
      X-Api-Key: "{{ vault_seerr_api_key }}"
    status_code: [200]
    return_content: true
  register: seerr_pushover_current
  changed_when: false
  check_mode: false
  no_log: true

# Redacted: the comparison reads the Pushover pair on both sides.
- name: Decide whether the Seerr Pushover notification agent needs repair
  ansible.builtin.set_fact:
    seerr_pushover_repair: "{{ (seerr_pushover_current.json | default({})) != seerr_pushover_declaration }}"
  no_log: true

- name: Report the planned Seerr Pushover notification agent repair
  ansible.builtin.debug:
    msg: >-
      A live run would declare Seerr's Pushover agent enabled for request
      events, carrying vault_pushover_token and vault_pushover_user_key. Seerr
      sends nothing through an agent missing either, and no request event
      reaches anyone.
  when:
    - ansible_check_mode
    - seerr_pushover_repair | bool

# The POST assigns the body to the agent verbatim — measured for ntfy, a partial
# body dropped embedPoster from the read-back — so the whole object goes every
# time and the comparison above is against the same shape.
#
# Redacted: the request carries the API key and the Pushover pair.
- name: Declare the Seerr Pushover notification agent
  ansible.builtin.uri:
    url: "{{ seerr_api }}/settings/notifications/pushover"
    method: POST
    headers:
      X-Api-Key: "{{ vault_seerr_api_key }}"
    body_format: json
    body: "{{ seerr_pushover_declaration }}"
    status_code: [200]
  when:
    - not ansible_check_mode
    - seerr_pushover_repair | bool
  changed_when: true
  no_log: true

# Redacted: the request carries the API key, and before the first converge after
# #558 the read-back still carries the ntfy publisher token.
- name: Read the declared Seerr ntfy notification agent
  ansible.builtin.uri:
    url: "{{ seerr_api }}/settings/notifications/ntfy"
    method: GET
    headers:
      X-Api-Key: "{{ vault_seerr_api_key }}"
    status_code: [200]
    return_content: true
  register: seerr_ntfy_current
  changed_when: false
  check_mode: false
  no_log: true

# Redacted for the same reason as the read above.
- name: Decide whether the Seerr ntfy notification agent needs repair
  ansible.builtin.set_fact:
    seerr_ntfy_repair: "{{ (seerr_ntfy_current.json | default({})) != seerr_ntfy_declaration }}"
  no_log: true

- name: Report the planned Seerr ntfy notification agent repair
  ansible.builtin.debug:
    msg: >-
      A live run would turn Seerr's ntfy agent off and clear what it stored.
      Request events go to Pushover, so an enabled ntfy agent would publish
      every one of them twice.
  when:
    - ansible_check_mode
    - seerr_ntfy_repair | bool

# Redacted: the request carries the API key.
- name: Turn off the Seerr ntfy notification agent
  ansible.builtin.uri:
    url: "{{ seerr_api }}/settings/notifications/ntfy"
    method: POST
    headers:
      X-Api-Key: "{{ vault_seerr_api_key }}"
    body_format: json
    body: "{{ seerr_ntfy_declaration }}"
    status_code: [200]
  when:
    - not ansible_check_mode
    - seerr_ntfy_repair | bool
  changed_when: true
  no_log: true

# settings.public.initialized is not a gate on the API at all; it only controls
# whether the frontend redirects to /setup. POST /api/v1/settings/initialize is
# an unconditional write, so it is guarded on the current value rather than
# called every converge.
- name: Read the anonymous Seerr public settings
  ansible.builtin.uri:
    url: "{{ seerr_public_settings_url }}"
    method: GET
    status_code: [200]
    return_content: true
  register: seerr_public_current
  changed_when: false
  check_mode: false

- name: Report the planned Seerr initialization
  ansible.builtin.debug:
    msg: >-
      A live run would mark Seerr initialized, which is what stops its web
      interface redirecting every visitor to the setup wizard the platform has
      already completed for them.
  when:
    - ansible_check_mode
    - not seerr_public_current.json.initialized | default(false) | bool

# Redacted: the request carries the API key.
- name: Mark Seerr initialized
  ansible.builtin.uri:
    url: "{{ seerr_api }}/settings/initialize"
    method: POST
    headers:
      X-Api-Key: "{{ vault_seerr_api_key }}"
    status_code: [200]
  when:
    - not ansible_check_mode
    - not seerr_public_current.json.initialized | default(false) | bool
  changed_when: true
  no_log: true
