---
argument_specs:
  main:
    short_description: Deploy Seerr and reconcile its request front end for Jellyfin
    options:
      platform_compose_kind:
        type: str
        required: true
      platform_project_name:
        type: str
        required: false
      platform_public_host:
        type: str
        required: false
      platform_callback_host:
        type: str
        required: false
      media_usenet_enabled:
        type: bool
        required: false
      seerr_port:
        type: int
        required: false
      seerr_config_host_path:
        type: path
        required: false
      seerr_application_url:
        type: str
        required: false
      seerr_jellyfin_hostname:
        type: str
        required: false
      seerr_jellyfin_port:
        type: int
        required: false
      seerr_media_server_type:
        type: int
        required: false
      seerr_main_settings:
        type: dict
        required: false
      seerr_owner_permissions:
        type: int
        required: false
      seerr_household_permissions:
        type: int
        required: false
      seerr_notification_types:
        type: int
        required: false
      seerr_pushover_access_token:
        type: str
        required: false
      seerr_pushover_user_key:
        type: str
        required: false
      seerr_pushover_declaration:
        type: dict
        required: false
      seerr_ntfy_declaration:
        type: dict
        required: false
      seerr_radarr_server:
        type: dict
        required: false
      seerr_sonarr_server:
        type: dict
        required: false
      vault_seerr_api_key:
        type: str
        required: true
      # Seerr needs no administrator credential of its own: the owner row is
      # created with a Jellyfin user type and no local password, and the
      # local-login route needs an email and password pair that only exists if
      # somebody sets one. The bootstrap therefore signs in as the Jellyfin
      # administrator this platform already authors, and the second household
      # identity is the single vault_managed_jellyfin_users entry.
      vault_jellyfin_admin_username:
        type: str
        required: true
      vault_jellyfin_admin_password:
        type: str
        required: true
      vault_managed_jellyfin_users:
        type: list
        elements: dict
        required: true
      # Radarr's and Sonarr's own keys, consumed rather than minted again. A
      # second copy would be a second thing to rotate and a second thing to
      # drift, so tests/expected/seerr.yml lists only vault_seerr_* and these
      # two are declared here as the dependency they are.
      vault_arr_radarr_api_key:
        type: str
        required: true
      vault_arr_sonarr_api_key:
        type: str
        required: true
      # Seerr sends request events to Pushover with the Media application's
      # token and the account's user key. Seerr's agent sends nothing when either
      # value is empty, so a missing one would silence request events without
      # failing anything.
      vault_pushover_media_token:
        type: str
        required: true
      vault_pushover_user_key:
        type: str
        required: true
