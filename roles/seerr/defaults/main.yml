---
seerr_port: 5055
seerr_api: "http://127.0.0.1:{{ seerr_port }}/api/v1"
# The only two routes a virgin Seerr answers anonymously; everything else is 401.
seerr_status_url: "{{ seerr_api }}/status"
seerr_public_settings_url: "{{ seerr_api }}/settings/public"
seerr_config_host_path: "{{ nas_docker_root }}/seerr/config"

# Embedded in every notification link Seerr sends.
seerr_application_url: "http://{{ platform_public_host }}:{{ seerr_port }}"

# Compose service aliases, valid whatever container_name a sandbox lane applies.
seerr_jellyfin_hostname: jellyfin
seerr_jellyfin_port: 8096
# MediaServerType.JELLYFIN. Required by the bootstrap: without it auth.js answers
# a misleading 500 NO_ADMIN_USER.
seerr_media_server_type: 2

# POST /settings/main deep-merges, so a partial body is safe. newPlexLogin false
# stops any Jellyfin sign-in auto-creating a user; do NOT set mediaServerLogin
# false, it disables Jellyfin login entirely. localLogin false closes password login.
seerr_main_settings:
  defaultPermissions: 0
  newPlexLogin: false
  localLogin: false
  applicationUrl: "{{ seerr_application_url }}"

# Owner: ADMIN (2), asserted only since the API refuses to modify user 1.
# Household: REQUEST (32) + AUTO_APPROVE (128), no 4K or MANAGE_* bits.
seerr_owner_permissions: 2
seerr_household_permissions: 160

# Each agent declaration is the complete upstream object: the POST replaces it
# verbatim. types = AVAILABLE (8) + FAILED (16) + AUTO_APPROVED (128). The two
# credential indirections exist so tests/mac/lib.sh can blank them.
seerr_notification_types: 152
seerr_pushover_access_token: "{{ vault_pushover_media_token }}"
seerr_pushover_user_key: "{{ vault_pushover_user_key }}"
seerr_pushover_declaration:
  enabled: true
  embedPoster: true
  types: "{{ seerr_notification_types }}"
  options:
    accessToken: "{{ seerr_pushover_access_token }}"
    userToken: "{{ seerr_pushover_user_key }}"
    sound: ""

# Retired ntfy agent (#558), declared off as upstream's exact default object.
seerr_ntfy_declaration:
  enabled: false
  embedPoster: true
  types: 0
  options:
    url: ""
    topic: ""
    priority: 3
    locale: en

# Complete stored rows minus id, for an exact comparison: POST /settings/radarr
# and /sonarr blindly append, so posting every run would duplicate the server.
seerr_radarr_server:
  name: Radarr
  hostname: radarr
  port: 7878
  apiKey: "{{ vault_arr_radarr_api_key }}"
  useSsl: false
  baseUrl: ""
  activeProfileId: 1
  activeProfileName: Any
  activeDirectory: /data/media/Movies
  is4k: false
  minimumAvailability: released
  isDefault: true
  externalUrl: ""
  syncEnabled: true
  preventSearch: false
  tagRequests: false
seerr_sonarr_server:
  name: Sonarr
  hostname: sonarr
  port: 8989
  apiKey: "{{ vault_arr_sonarr_api_key }}"
  useSsl: false
  baseUrl: ""
  activeProfileId: 1
  activeProfileName: Any
  activeDirectory: /data/media/Series
  activeAnimeProfileId: null
  activeAnimeProfileName: null
  activeAnimeDirectory: null
  is4k: false
  isDefault: true
  enableSeasonFolders: true
  externalUrl: ""
  syncEnabled: true
  preventSearch: false
  tagRequests: false

# Gates only the Radarr/Sonarr rows; the arrs run only where Usenet is enabled.
media_usenet_enabled: false

seerr_compose_project_name: >-
  {{ (platform_project_name ~ '-seerr')
     if platform_project_name | default('') | length > 0 else 'seerr' }}
