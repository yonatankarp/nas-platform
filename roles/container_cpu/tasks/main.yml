---
# The verification below reads the live Docker daemon: it lists the running
# containers of the Compose project and inspects the CPU controls Docker
# actually applied. Under `--check` no stack was started, so there is nothing
# truthful to inspect and the assertions would fail on a state the run never
# created.
#
# The gate lives here rather than at each call site because twelve callers
# copied it and a thirteenth that forgot it would break `--check`. A dynamic
# `include_tasks` under a false condition includes nothing, so check mode stays
# exactly as quiet as it was when the callers guarded the include themselves.
- name: Verify the effective container CPU policy
  ansible.builtin.include_tasks: inspect.yml
  when: not ansible_check_mode

- name: Report the container CPU verification check mode defers
  ansible.builtin.debug:
    msg: >-
      A live run would assert that every running container of Compose project
      {{ container_cpu_project_name }} applies the
      {{ container_cpu_service_name }} Compose CPU limits on CPUs
      {{ platform_effective_container_cpuset }}. Docker's applied controls
      belong to containers this run did not start, so check mode reports the
      intent instead of inspecting them.
  when: ansible_check_mode
