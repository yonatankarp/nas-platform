---
argument_specs:
  main:
    short_description: Deploy Seafile and prove its administrator against the database
    options:
      platform_project_name:
        type: str
        required: false
      # SEAFILE_SERVER_HOSTNAME is what the server writes into every share link
      # and every seafhttp URL it hands a client, so it must be the address a
      # human types rather than a loopback the role happens to poll.
      platform_public_host:
        type: str
        required: false
      # Declared bool rather than left to a truthy string. The teardown branch
      # and the deploy branch are selected by this one value, and a string
      # "false" is true in Jinja.
      seafile_deployment_enabled:
        type: bool
        required: true
      seafile_port:
        type: int
        required: false
      seafile_api:
        type: str
        required: false
      seafile_data_host_path:
        type: path
        required: false
      seafile_db_host_path:
        type: path
        required: false
      seafile_seafevents_config_path:
        type: path
        required: false
      seafile_server_config_path:
        type: path
        required: false
      seafile_backup_host_path:
        type: path
        required: false
      seafile_backup_databases:
        type: list
        elements: str
        required: false
      seafile_backup_excluded_paths:
        type: list
        elements: str
        required: false
      # Declared int for the reason the recreate budget below is: the prune
      # slices the sorted backup list with it, and a string there is a Jinja
      # error on the one run that has just written a backup and not yet
      # deployed anything.
      seafile_pre_upgrade_backup_retain:
        type: int
        required: false
      # Declared bool rather than left to a truthy string: the seafile lane
      # passes it as an extra variable, where "false" would arrive as a string
      # and be true in Jinja -- which would make every lane run take a backup
      # while reporting that it had not been asked to.
      seafile_pre_upgrade_backup_force:
        type: bool
        required: false
      seafile_compose_wait_timeout:
        type: int
        required: false
      seafile_data_compose_wait_timeout:
        type: int
        required: false
      seafile_readiness_retries:
        type: int
        required: false
      # Declared int rather than left to the default, because the rescue in
      # tasks/deploy.yml turns it into range(1, limit + 1) and a string there
      # would be a Jinja error at the one moment the role is already recovering
      # from a failure. 0 is a supported value and means detect and report
      # without touching the container.
      seafile_wedged_boot_recreate_limit:
        type: int
        required: false
      seafile_compose_project_name:
        type: str
        required: false
      seafile_index_files_enabled:
        type: bool
        required: false
      seafile_audit_log_enabled:
        type: bool
        required: false
      seafile_seafevents_managed_settings:
        type: list
        elements: dict
        required: false
        description: >-
          The seafevents.conf settings this platform owns, each named by the
          section it lives under. The section is required rather than optional
          because `enabled` is not a unique key in that file.
        options:
          section:
            type: str
            required: true
          key:
            type: str
            required: true
          value:
            type: str
            required: true
      # A decimal number with an optional k/kb/m/mb/g/gb/t/tb suffix, a bare
      # number meaning gigabytes, and the spelling is load-bearing: seaf-server
      # logs "Invalid default quota" for anything else and falls back to
      # unlimited, so a wrong spelling is a silent no-quota rather than an
      # error. Role argument specs cannot express a pattern, so the shape is
      # asserted in tasks/reconcile_quota.yml, where a wrong value fails the run
      # before it reaches the target.
      seafile_default_user_quota:
        type: str
        required: false
        description: Default per-user storage quota, as 20g.
      vault_seafile_admin_email:
        type: str
        required: true
      vault_seafile_admin_password:
        type: str
        required: true
      vault_seafile_db_root_password:
        type: str
        required: true
      vault_seafile_db_username:
        type: str
        required: true
      vault_seafile_db_password:
        type: str
        required: true
      vault_seafile_jwt_private_key:
        type: str
        required: true
      vault_seafile_cache_password:
        type: str
        required: true
