---
# The deployment report, and it is a stage of its own rather than the last task
# of deploy.yml because of where it has to sit. Seafile reconciles seafevents.conf
# after the stack is up -- the server writes that file itself, so there is
# nothing to repair until it has run once -- and a report rendered before that
# reconciliation cannot see it. On a converge whose only change is a drift repair
# and the restart that makes it take effect, a report placed earlier tells ntfy
# that nothing moved, which is exactly the event a deployment report exists to
# carry. roles/trailarr reports its own env repair for the same reason.
#
# The results this reads are registered in deploy.yml and reconcile_seafevents.yml.
# Both are imported statically, so they share one variable scope with this file
# and nothing has to be recomputed or passed.
#
# Ungated on purpose, and it says nothing when nothing moved: the report is
# gated on the results themselves, so a converge with the flag off and a project
# already absent is silent, and the run that first tears the project down reports
# that it did.
#
# The recreate term is the one that carries a default, and it is not tidiness.
# seafile_wedged_recreate is registered inside deploy.yml's rescue, which a
# healthy converge never enters, so on every ordinary run the name does not
# exist at all -- unlike the four beside it, whose tasks are skipped rather than
# unreached and which are therefore always defined. A recovered wedged boot is a
# converge that moved, and it is exactly the converge this platform should hear
# about, so it is a term rather than left to the failed deploy result beside it.
#
# The restart in reconcile_seafevents.yml is deliberately not one of the terms.
# It fires only when the repair beside it is changed, so it would report the same
# converge twice and never a different one.
- name: Report the Seafile deployment
  ansible.builtin.include_role:
    name: ntfy
    tasks_from: deployment_report
  vars:
    ntfy_deployment_report_service: Seafile
    ntfy_deployment_report_changed: >-
      {{ (seafile_data_deploy is changed) or (seafile_deploy is changed) or
         (seafile_teardown is changed) or
         ((seafile_wedged_recreate | default({})) is changed) or
         (seafile_seafevents_repair is changed) }}
