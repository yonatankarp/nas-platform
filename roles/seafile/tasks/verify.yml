---
# Verification, and it has to prove the database link rather than that a port is
# open.
#
# GET /api2/ping/ returns a constant 'pong' from a view that touches nothing;
# it answers exactly as happily with both databases down. GET /accounts/login/
# reads constance_config, but that read is cached, so on a warm cache it proves
# only that the cache container is up. POST /api2/auth-token/ is the one
# endpoint on the unauthenticated surface that cannot answer without the
# databases: AuthTokenSerializer authenticates against ccnet_db and seahub_db
# and then get-or-creates the token row in seahub_db.
#
# It is also the only check that can see the drift described beside
# INIT_SEAFILE_ADMIN_PASSWORD in templates/env.j2. That credential is consumed
# once, while the user table is empty, and there is no push path afterwards, so
# a rotated vault password is a silent no-op on the server. Here it is not
# silent: the request stops returning a token and the assertion below names the
# reason.

- name: Authenticate to Seafile for exact verification
  tags: [platform_verify_seafile]
  ansible.builtin.uri:
    url: "{{ seafile_api }}/auth-token/"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ vault_seafile_admin_email }}"
      password: "{{ vault_seafile_admin_password }}"
    # Every status is accepted here so that the assertion below is what fails,
    # with a message naming the two things that produce a non-200. A uri task
    # failing on its own status code reports an HTTP error and nothing about
    # which half of the stack is broken.
    status_code: "{{ range(100, 600) | list }}"
  register: seafile_verify_login
  when:
    - seafile_deployment_enabled | bool
    - not ansible_check_mode
  failed_when: false
  # A deliberate claim, not an oversight. The very first call to this endpoint
  # inserts a token row, and every call after it reads the same row back, so the
  # request writes host state exactly once in the lifetime of the account and
  # never again. Reporting that one insert as a change would make the second
  # converge disagree with the first for as long as the platform's own
  # idempotence check runs against a fresh deployment.
  changed_when: false
  check_mode: false
  # The request body is the administrator credential.
  no_log: true

# Deliberately not redacted, which is the opposite decision from the request
# above and for the same reason. This assertion carries no credential -- its
# conditions read a status and a token length, and assert prints the text of a
# condition rather than what it evaluated to -- so redacting it would hide the
# only actionable sentence the verification produces while protecting nothing.
- name: Require the vault Seafile administrator during exact verification
  tags: [platform_verify_seafile]
  ansible.builtin.assert:
    that:
      - seafile_verify_login.status | default(0) | int == 200
      - seafile_verify_login.json.token | default('') | length > 0
    fail_msg: >-
      Seafile did not issue an API token for the vault administrator. Two
      things produce this and they need different repairs. Either the server
      cannot reach its databases -- POST /api2/auth-token/ reads ccnet_db and
      seahub_db, so a failure here is a database failure and not a web one --
      or the administrator password in the vault no longer matches the account
      the server created on its first start. The second is not repairable by
      converging: INIT_SEAFILE_ADMIN_PASSWORD is consumed only while the user
      table is empty, so rotating it in the vault changes nothing on the
      server, and the documented remedy is the interactive reset-admin.sh
      inside the container.
  when:
    - seafile_deployment_enabled | bool
    - not ansible_check_mode

# So that --tags platform_verify_seafile is never an empty selection. A tag run
# that selects no task at all is indistinguishable from a tag that no longer
# exists, and PR 1 ships with this flag false everywhere.
- name: Report the deferred Seafile verification
  tags: [platform_verify_seafile]
  ansible.builtin.debug:
    msg: >-
      seafile_deployment_enabled is false, so there is no Seafile server to
      authenticate against and the administrator verification is not attempted.
      A live run would POST to {{ seafile_api }}/auth-token/ as the vault
      administrator, which reads ccnet_db and seahub_db and therefore proves the
      database link rather than the web tier alone.
  when: not seafile_deployment_enabled | bool

- name: Report the Seafile verification check mode defers
  tags: [platform_verify_seafile]
  ansible.builtin.debug:
    msg: >-
      A live run would authenticate as the vault Seafile administrator against
      {{ seafile_api }}/auth-token/. That is a real request to a server this run
      did not start, so check mode reports the intent instead of making it.
  when:
    - seafile_deployment_enabled | bool
    - ansible_check_mode
