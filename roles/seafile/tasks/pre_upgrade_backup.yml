---
# The pre-upgrade backup, and what it guards is narrower than "a backup of
# Seafile" -- narrow on purpose, and the boundary is argued here rather than
# left for a reader to discover from what the tasks happen to copy.
#
# WHAT AN UPGRADE CAN DESTROY. The seafile server runs /scripts/upgrade.py on a
# version change, which collects every intervening migration and applies them to
# ccnet_db, seafile_db and seahub_db, and rewrites conf/ as it goes. The db
# container carries MARIADB_AUTO_UPGRADE=1, so a MariaDB image change migrates
# the datadir in place before the health check goes green. Both are one-way.
# What an upgrade does NOT do is rewrite the content-addressed blocks under
# seafile-data/storage: they are immutable and appended to, and no migration
# reaches them.
#
# So this backs up the database and conf/, and it does not copy the block store.
# That is a size argument as much as a correctness one -- the store is the
# users' entire library and this fires on every pinned digest bump Renovate
# lands -- and it makes this a pre-upgrade backup rather than a
# disaster-recovery one. The full procedure, block store included, is
# docs/getting-started-nas.md's "Recover Seafile"; every backup this role takes
# carries a manifest that says so beside the bytes.
#
# THE ORDERING IS LOAD-BEARING AND IT IS THE DUMP THAT COMES FIRST. Seafile
# keeps the mapping from blocks to filenames, libraries and owners in the
# database and nowhere else, so a filesystem half taken BEFORE the dump can only
# be missing blocks the dump then names -- which restores as a library whose
# files cannot be read. Taken after, the filesystem half is a superset of what
# the dump names and the surplus is merely unreferenced. Seafile's own manual
# states the same order for the same reason. Nothing below writes into the
# backup before the dump has, and tests/contracts/seafile-static.rb pins that by
# index.
#
# THE SERVICE IS NOT STOPPED. --single-transaction opens the dump in a
# consistent snapshot of InnoDB, so the three schemas are consistent with each
# other and with the store as of that instant while seahub keeps serving. A
# backup that required an outage would be one nobody takes.
#
# AND THE UPGRADE DOES NOT PROCEED IF IT FAILED. Every task below is allowed to
# fail the play, and the assertion after the dump requires a file that exists
# and is not empty. roles/bindery/tasks/pre_upgrade_backup.yml is the shape this
# follows and the reason is the same one: by the time the new image has answered
# once, the old schema is gone.

- name: Require a Seafile backup retention that keeps the backup it just took
  ansible.builtin.assert:
    that:
      - seafile_pre_upgrade_backup_retain | int >= 1
    fail_msg: >-
      seafile_pre_upgrade_backup_retain must keep at least one backup. The prune
      runs after the backup, so 0 would delete the backup this run took and
      leave the upgrade guarded by nothing.

- name: Read the released Seafile Compose definition
  ansible.builtin.slurp:
    path: "{{ platform_current_dir }}/services/seafile/compose.yml"
  register: seafile_release_compose

# Only the two stateful containers. The cache persists nothing -- no volume, and
# --save "" --appendonly no -- so an upgrade of it cannot lose anything and it
# has no business gating a backup.
- name: Resolve the pinned Seafile stateful images
  ansible.builtin.set_fact:
    seafile_pinned_images:
      seafile: "{{ seafile_release_services.seafile.image }}"
      db: "{{ seafile_release_services.db.image }}"
  vars:
    seafile_release_services: >-
      {{ (seafile_release_compose.content | b64decode | from_yaml).services }}

# Running containers only, found by their Compose labels rather than by
# container_name: the production names are bare and both disposable overrides
# namespace them, so a name computed here would be a fourth place that has to
# agree with services/seafile/*.yml. tasks/deploy.yml and roles/container_cpu
# select the same way.
- name: List the running Seafile stack containers
  ansible.builtin.command:
    argv:
      - docker
      - container
      - ls
      - --quiet
      - --filter
      - "label=com.docker.compose.project={{ seafile_compose_project_name }}"
  register: seafile_stack_containers
  changed_when: false
  check_mode: false

# --format, and narrowly. A bare `docker container inspect` prints .Config.Env,
# which for this stack is the rendered environment file -- the MariaDB root
# password, the administrator password and the cache password in full. This
# emits one `service=image` line per container and nothing else, which is why it
# needs no no_log and can therefore appear in a failure an operator has to read.
#
# .Config.Image is comparable with the `image:` key in the Compose file, and
# that is measured rather than assumed, because the classification below is
# wrong in the loud direction if it is not: a field reporting the resolved image
# ID would differ from the pinned reference on every converge, so every converge
# would take a backup and report changed, and the idempotence check would fail
# on the second run of a stack nobody had touched. Against Docker 29.7.2 a
# container Compose created from
# docker.io/valkey/valkey:9.1.2-alpine@sha256:a0dbf4... reported .Config.Image
# as that same string byte for byte, digest included, while .Image and the
# com.docker.compose.image label both reported sha256:589f31... -- the image ID,
# which is the field that would NOT have worked here.
#
# One container per iteration, with the Go template written as a plain scalar in
# the argv list. That shape is not stylistic and it is the whole of #492.
#
# The first version of this task built its argv with an expression --
# `{{ ['docker', ..., '{%- raw -%}...{%- endraw -%}'] + ids }}` -- and Jinja does
# not process a `{%- raw -%}` tag inside a `{{ }}` expression: within a variable
# block the lexer is tokenising a STRING LITERAL, so the tag is characters rather
# than a tag. Measured against ansible-core 2.21.3: the expression form renders
# to `{%- raw -%}{{index .Config.Labels "..."}}={{.Config.Image}}{%- endraw -%}`
# with the wrapper intact, while the same text as a plain scalar renders to the
# Go template alone. Docker then does exactly what it is told -- measured against
# Docker 29.7.2, `docker container inspect --format` with that argument printed
# `{%- raw -%}probe=docker.io/valkey/...{%- endraw -%}` -- so every census line
# came back wearing a prefix, the `^(seafile|db)=` match found nothing, and the
# classifier below reported `stack-not-running` against a stack that was serving
# its API. It did that on all three of the seafile lane's converges and on a real
# NAS it would have done it for ever: no backup, no error, and a pinned upgrade
# migrating the schemas with no copy anywhere.
#
# The looped form costs one `docker` invocation per container and cannot express
# the defect, because there is no expression for a raw tag to be swallowed by.
# tasks/deploy.yml already used the plain-scalar shape and its comment already
# said it had been verified; the guard now in tests/contracts/seafile-static.rb
# is what makes that verification apply to the whole role rather than to the one
# task somebody remembered.
- name: Read the deployed Seafile stack image references
  ansible.builtin.command:
    argv:
      - docker
      - container
      - inspect
      - --format
      - "{% raw %}{{index .Config.Labels \"com.docker.compose.service\"}}={{.Config.Image}}{% endraw %}"
      - "{{ item }}"
  loop: "{{ seafile_stack_containers.stdout_lines }}"
  loop_control:
    label: "{{ item }}"
  register: seafile_deployed_images
  changed_when: false
  check_mode: false

# Resolved once and read three times -- by the guard below, by the
# classification and by the manifest -- rather than spelled out at each. Three
# copies of this expression is how the bug above survived being written down: the
# `stack-not-running` branch and the report agreed with each other perfectly and
# both were wrong.
- name: Resolve the running Seafile stateful images
  ansible.builtin.set_fact:
    seafile_stateful_deployed: >-
      {{ seafile_deployed_images.results | default([])
         | selectattr('stdout', 'defined') | map(attribute='stdout') | map('trim')
         | select('match', '^(seafile|db)=') | sort | list }}

# THE GUARD THAT WOULD HAVE MADE #492 LOUD, and it is the general lesson rather
# than a patch for one defect: a classifier whose view of the world disagrees
# with the world must fail, not choose the quietest branch. Docker naming
# containers in this project and none of them answering with a parseable
# `service=image` line is a broken read -- a format string that did not render, a
# Docker whose output shape changed, a label Compose stopped setting -- and every
# one of those degrades this whole file to a no-op that reports success.
#
# `stack-not-running` is only ever allowed to mean what it says: docker found
# nothing running.
- name: Require a readable Seafile stack census
  ansible.builtin.assert:
    that:
      - seafile_stack_containers.stdout_lines | length == 0 or
        seafile_stateful_deployed | length > 0
    fail_msg: >-
      docker reports {{ seafile_stack_containers.stdout_lines | length }} running
      container(s) in Compose project {{ seafile_compose_project_name }}, and not
      one of them answered the image census with a `service=image` line. That is
      a broken read rather than a stopped stack, and it is refused here because
      the alternative is this backup silently classifying itself away and letting
      an upgrade migrate the schemas with no copy of them anywhere. The census
      returned: {{ seafile_deployed_images.results | default([])
                   | selectattr('stdout', 'defined') | map(attribute='stdout') | list }}

# Four outcomes, named rather than reduced to a boolean, because three of them
# are things an operator wants to read in the transcript.
#
# `stack-not-running` is first and it is not a failure. With the containers
# down there is no database to dump and no consistent snapshot to be had, so
# saying so is better than taking a wrong backup -- the same call
# roles/bindery makes about a stopped SQLite database. It is also the state a
# genuine first converge is in, where there is nothing to protect yet. The guard
# above is what keeps it meaning that and nothing else.
- name: Classify the Seafile pre-upgrade backup
  ansible.builtin.set_fact:
    seafile_backup_reason: >-
      {{ 'stack-not-running' if seafile_stateful_deployed | length != 2
         else 'forced' if seafile_pre_upgrade_backup_force | bool
         else 'upgrade-pending'
         if (seafile_stateful_deployed | symmetric_difference(seafile_stateful_pinned) | length > 0)
         else 'converged' }}
  vars:
    seafile_stateful_pinned: >-
      {{ ['seafile=' ~ seafile_pinned_images['seafile'],
          'db=' ~ seafile_pinned_images['db']] }}

# `stack-not-running` still outranks `forced`, and deliberately: there is no way
# to dump a database that is not up, and a flag cannot conjure one. What is
# refused is the SILENCE. Setting the flag is an explicit request for a backup,
# so a request that cannot be honoured is a failure rather than a debug line --
# which is precisely the 14 seconds and 6m40s #492 spent finding out, the lane
# converging happily and the contract failing afterwards about a directory that
# was never created. Nothing on the NAS sets this flag, so this can only ever
# fire for a caller who asked.
- name: Require a Seafile stack that can honour a forced backup
  ansible.builtin.assert:
    that:
      - seafile_backup_reason != 'stack-not-running'
    fail_msg: >-
      seafile_pre_upgrade_backup_force was set, and no running Seafile stack was
      found in Compose project {{ seafile_compose_project_name }} to dump. A
      forced backup is an explicit request, so it fails here rather than being
      reported away: nothing downstream would have a backup to read, and the
      failure would surface somewhere that cannot name this cause.
  when: seafile_pre_upgrade_backup_force | bool

# Kept whole rather than reduced to the boolean below, because it is the one
# line an operator reads out of the manifest when deciding whether the dump
# beside it is enough. `upgrade-pending` alone says a migration was coming; the
# pair says which of the two containers was about to move, and a MariaDB datadir
# upgrade and a Seafile schema migration are not the same risk.
- name: Record the Seafile images this backup was taken against
  ansible.builtin.set_fact:
    seafile_deployed_image_report: "{{ seafile_stateful_deployed | join(', ') }}"

- name: Resolve whether the Seafile pre-upgrade backup runs
  ansible.builtin.set_fact:
    seafile_backup_required: >-
      {{ seafile_backup_reason in ['upgrade-pending', 'forced'] }}
    seafile_backup_stamp: "{{ ansible_facts['date_time']['iso8601_basic_short'] }}"

- name: Resolve the Seafile backup directory for this run
  ansible.builtin.set_fact:
    seafile_backup_run_dir: "{{ seafile_backup_host_path }}/{{ seafile_backup_stamp }}"

# Said out loud rather than left to the reader, and it is the whole of what
# check mode can do here: `docker_compose_v2_exec` does not run under --check,
# and a dump that cannot be simulated must not be claimed. The classification
# above is real in check mode -- every task it depends on carries
# check_mode: false -- so this message names the actual state of the host.
- name: Report the planned Seafile pre-upgrade backup
  ansible.builtin.debug:
    msg: >-
      Seafile pre-upgrade backup: {{ seafile_backup_reason }}.
      {{ seafile_backup_planned_report if seafile_backup_required | bool
         else seafile_backup_skipped_report }}
  vars:
    seafile_backup_planned_report: >-
      A live run would dump {{ seafile_backup_databases | join(', ') }} and copy
      the server's conf/ directory, in that order, into
      {{ seafile_backup_run_dir }}, and would refuse to deploy
      {{ seafile_pinned_images['seafile'] }} unless the dump landed.
    seafile_backup_skipped_report: >-
      Nothing is dumped. `stack-not-running` means there is no running database
      to snapshot, which is also what a first converge looks like; `converged`
      means the running images already are the ones this release pins, so no
      migration is pending and a backup would protect nothing.
  when: ansible_check_mode

# The one state a live run has to say out loud, and it is not `converged`. A
# converged stack taking no backup is the normal case and silence is right for
# it -- this fires every five minutes once the poller has Seafile -- but an
# upgrade going ahead with the containers down means the guard did not run, and
# an operator reading the transcript afterwards has no other way to know that.
- name: Report a Seafile pre-upgrade backup that could not be taken
  ansible.builtin.debug:
    msg: >-
      No Seafile container is running, so there is no database to snapshot and
      no pre-upgrade backup was taken. On a first converge that is correct and
      there is nothing to protect yet. On a host whose stack is merely down it
      is not: whatever this run deploys will migrate the schemas under
      {{ seafile_db_host_path }} with no copy of them anywhere, so bring the
      stack up and converge again before changing the pinned images.
  when:
    - not ansible_check_mode
    - seafile_backup_reason == 'stack-not-running'

# Created here rather than by the container, so that the conf/ half below can be
# written by Ansible into a directory it owns. Creating an empty directory backs
# nothing up, so this does not weaken the ordering claim above: the first thing
# WRITTEN into the backup is still the dump.
- name: Create the Seafile backup directory for this run
  ansible.builtin.file:
    path: "{{ seafile_backup_run_dir }}"
    state: directory
    mode: "0700"
  when:
    - seafile_backup_required | bool
    - not ansible_check_mode

# FIRST, and everything about this command is deliberate.
#
# Over TCP as root, for the same reason tasks/deploy.yml's credential probe is:
# addressing the service by name forces the connection through the network
# stack, where only root@% -- the account MariaDB's own entrypoint created with
# CREATE USER ... IDENTIFIED BY -- can answer, and only the password this
# platform authored gets in. The Seafile account cannot be used here in any
# case: it holds grants on the three schemas and not the SELECT on the whole
# server a dump of all three needs.
#
# --single-transaction is what lets Seafile keep serving: InnoDB gives the dump
# a consistent snapshot without locking the tables the running server is using.
# --quick streams rows rather than buffering a table at a time, which matters on
# a NAS held to cpus: 1.0. --routines and --events carry the schema objects a
# plain table dump silently drops, and their absence would only be discovered at
# a restore.
#
# --result-file rather than a redirect, so the dump never passes through this
# module's stdout: a dump captured into a registered variable would be database
# contents in Ansible's memory, would force no_log onto this task, and would
# then censor the failure message an operator needs.
#
# user: root because the backup root is mode 0700 and owned by the host's root,
# which is what makes it safe to keep a plaintext dump in. Stated rather than
# inherited: docker.io/library/mariadb:10.11.19 declares no USER, so `exec`
# already lands as root today -- measured -- and an upstream image that starts
# declaring one would otherwise turn this task into a permission error nobody
# changed anything to cause.
#
# There is deliberately no --connect-timeout. mariadb-dump does not accept it --
# measured against 10.11.19, which answers `unknown variable
# 'connect-timeout=15'` -- and the way it fails is the reason the assertion two
# tasks below reads the file rather than the exit status: it had already created
# /backups/<stamp>/databases.sql, empty, before refusing the option.
#
# Redacted: the module renders the container's environment on failure, and that
# environment is MYSQL_ROOT_PASSWORD.
- name: Dump the Seafile databases before the pinned upgrade
  community.docker.docker_compose_v2_exec:
    project_src: "{{ platform_current_dir }}/services/seafile"
    project_name: "{{ seafile_compose_project_name }}"
    files: "{{ platform_service_compose_files['seafile'] }}"
    env_files: ["{{ platform_runtime_dir }}/services/seafile/.env"]
    service: db
    user: root
    argv:
      - sh
      - -ec
      - >-
        umask 077;
        exec env MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mariadb-dump --protocol=tcp
        --host=db --port=3306 --user=root
        --single-transaction --quick --routines --events
        --databases {{ seafile_backup_databases | join(' ') }}
        --result-file="/backups/{{ seafile_backup_stamp }}/databases.sql"
    tty: false
  register: seafile_database_dump
  when:
    - seafile_backup_required | bool
    - not ansible_check_mode
  changed_when: true
  no_log: true

- name: Read the Seafile database dump this run produced
  ansible.builtin.stat:
    path: "{{ seafile_backup_run_dir }}/databases.sql"
  register: seafile_database_dump_file
  when:
    - seafile_backup_required | bool
    - not ansible_check_mode
  changed_when: false

# The refusal. mariadb-dump exits 0 on some partial failures it has already
# written a diagnostic about, and an empty result file is the shape those leave
# behind, so the file itself is what is asserted rather than the exit status
# above. Failing here fails the play with the OLD image still running and the
# OLD schema still in place, which is the entire point of taking the backup
# before the deployment rather than after it.
- name: Require the Seafile database dump before the upgrade proceeds
  ansible.builtin.assert:
    that:
      - seafile_database_dump_file.stat.exists
      - seafile_database_dump_file.stat.size > 0
    fail_msg: >-
      The Seafile pre-upgrade database dump did not land at
      {{ seafile_backup_run_dir }}/databases.sql, so the upgrade to
      {{ seafile_pinned_images['seafile'] }} is refused rather than run against
      a schema nothing has a copy of. The dump is taken over TCP as root against
      the db service; a rotated MariaDB root credential and a full
      {{ seafile_backup_host_path }} are what have to be ruled out first.
  when:
    - seafile_backup_required | bool
    - not ansible_check_mode

# SECOND. The upgrade rewrites conf/ -- seafile.conf, ccnet.conf and
# seahub_settings.py all gain and lose keys across versions -- and a restored
# database against a conf/ from the wrong version is a server that starts and
# then behaves as neither version.
- name: Create the Seafile configuration backup directory
  ansible.builtin.file:
    path: "{{ seafile_backup_run_dir }}/conf"
    state: directory
    mode: "0700"
  when:
    - seafile_backup_required | bool
    - not ansible_check_mode

# admin.txt is excluded here and the exclusion is a security requirement rather
# than a size one. /scripts/start.py writes the administrator password there in
# plaintext on EVERY container start and removes it in a `finally:`, so a
# container killed mid-start leaves it on disk -- and a backup that swept conf/
# blindly would preserve that plaintext for as long as the backup is kept, in a
# directory nothing ever revisits. The list is
# seafile_backup_excluded_paths, which the manifest renders, so the exclusion is
# stated once and readable from inside the backup.
- name: Find the Seafile configuration to preserve beside the dump
  ansible.builtin.find:
    paths: "{{ seafile_data_host_path }}/seafile/conf"
    file_type: file
    recurse: false
    excludes: ["admin.txt"]
  register: seafile_conf_sources
  when:
    - seafile_backup_required | bool
    - not ansible_check_mode
  changed_when: false

# Redacted: seafile.conf and ccnet.conf carry the Seafile database account and
# its password, seahub_settings.py the Django signing key, and the copy module
# renders file content in a diff. The credentials arrive as file content rather
# than as vault_ names, which is exactly the case tasks/reconcile_seafevents.yml
# already carries no_log for.
- name: Preserve the Seafile configuration beside the dump
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ seafile_backup_run_dir }}/conf/{{ item.path | basename }}"
    remote_src: true
    mode: "0600"
  loop: "{{ seafile_conf_sources.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when:
    - seafile_backup_required | bool
    - not ansible_check_mode
  no_log: true

# Reported rather than repaired, and reported rather than ignored. Finding
# admin.txt on disk means a container was killed between start.py writing it and
# the finally: that removes it, so the administrator password is sitting in
# plaintext inside a bind mount. It is not deleted here: a start in progress
# writes exactly this file, and a play racing it would be removing the file the
# server is about to read on a genuine first run.
- name: Read the Seafile administrator handoff file
  ansible.builtin.stat:
    path: "{{ seafile_data_host_path }}/seafile/conf/admin.txt"
  register: seafile_admin_handoff
  when:
    - seafile_backup_required | bool
    - not ansible_check_mode
  changed_when: false

- name: Report a Seafile administrator handoff file left on disk
  ansible.builtin.debug:
    msg: >-
      {{ seafile_data_host_path }}/seafile/conf/admin.txt exists. The image
      writes the administrator password there in plaintext on every start and
      removes it in a finally:, so either a start is in progress right now or a
      container was killed inside that window and left it behind. It is excluded
      from this backup either way. If no start is in progress, remove it -- and
      note that rotating the vault administrator password does not change the
      deployed account, which is why the file matters more here than it would
      elsewhere.
  when:
    - seafile_backup_required | bool
    - not ansible_check_mode
    - seafile_admin_handoff.stat.exists | default(false)

# Redacted for the same reason the conf copy is: the template renders in the
# diff, and while the manifest carries no credential of its own it names the
# images, the paths and the reason -- and `copy`-family diffs are the one place
# a future edit to that template would leak whatever it started interpolating.
- name: Record what the Seafile backup contains and what it does not
  ansible.builtin.template:
    src: backup_manifest.j2
    dest: "{{ seafile_backup_run_dir }}/MANIFEST.txt"
    mode: "0600"
  when:
    - seafile_backup_required | bool
    - not ansible_check_mode
  no_log: true

# Bounded, and bounded because this directory is on the same volume as the
# database it protects: an unbounded backup root on /volume1 is a way to lose
# the live copy too. The prune runs only on a run that took a backup, so an
# ordinary converge removes nothing, and the slice is clamped at zero so a
# retention larger than the number of backups present cannot delete the newest.
- name: List the Seafile backups on the host
  ansible.builtin.find:
    paths: "{{ seafile_backup_host_path }}"
    file_type: directory
    recurse: false
  register: seafile_existing_backups
  when:
    - seafile_backup_required | bool
    - not ansible_check_mode
  changed_when: false

- name: Prune Seafile backups beyond the retention
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ seafile_prunable_backups }}"
  vars:
    seafile_sorted_backups: >-
      {{ seafile_existing_backups.files | default([]) | map(attribute='path') | sort }}
    seafile_prunable_backups: >-
      {{ seafile_sorted_backups[:[0, (seafile_sorted_backups | length)
                                     - (seafile_pre_upgrade_backup_retain | int)] | max] }}
  when:
    - seafile_backup_required | bool
    - not ansible_check_mode

- name: Report the completed Seafile pre-upgrade backup
  ansible.builtin.debug:
    msg: >-
      Seafile {{ seafile_backup_databases | join(', ') }} and conf/ were backed
      up into {{ seafile_backup_run_dir }} before deploying
      {{ seafile_pinned_images['seafile'] }}. The block store is not in it and
      the manifest beside the dump says so; the full recovery procedure is in
      docs/getting-started-nas.md.
  when:
    - seafile_backup_required | bool
    - not ansible_check_mode
