---
# Storage. Nothing here touches the target: every task is an assertion, so a
# path this role does not own fails before the release is read.
#
# Unlike Paperless there is no second layout to resolve. Seafile keeps
# everything under the Docker root on both platforms -- there is no media tree
# involved -- so nas_docker_root alone derives the two roots and the mac lane
# gets its sandbox copy from the same expression.

- name: Require exact Seafile host storage policy
  ansible.builtin.assert:
    that:
      - seafile_data_host_path == (nas_docker_root ~ '/seafile/data')
      - seafile_db_host_path == (nas_docker_root ~ '/seafile/db')
      - seafile_seafevents_config_path == (seafile_data_host_path ~ '/seafile/conf/seafevents.conf')
      - seafile_data_host_path != seafile_db_host_path
      - not seafile_db_host_path.startswith(seafile_data_host_path ~ '/')
      - not seafile_data_host_path.startswith(seafile_db_host_path ~ '/')
    fail_msg: >-
      Seafile storage paths overlap or differ from the owned policy. The
      library and the database must be separate roots: the blocks under the
      library are meaningless without the database that names them.

# The central declaration is what host_prep creates and what the recovery
# documentation classifies, and this role refuses to deploy against a path
# nas_storage does not name.
#
# Both roots are recovery: critical, and the reason is the thing that makes
# Seafile different from every other stack here -- files on disk are not the
# files. Content is stored as content-addressed blocks under
# seafile-data/storage, and the mapping from blocks to filenames lives in the
# database. A filesystem copy of the library taken without a consistent dump of
# the database restores an unreadable pile of blocks, so neither root is
# recoverable without the other.
- name: Resolve required central Seafile storage declarations
  ansible.builtin.set_fact:
    seafile_required_storage_declarations:
      - {path: "{{ nas_docker_root }}/seafile/data", mode: "0755", recovery: critical}
      - {path: "{{ nas_docker_root }}/seafile/db", mode: "0755", recovery: critical}

- name: Require unique central Seafile storage declarations
  ansible.builtin.assert:
    that:
      - seafile_storage_matches | length == 1
      - seafile_storage_matches[0].mode == item.mode
      - seafile_storage_matches[0].recovery == item.recovery
    fail_msg: >-
      {{ item.path }} must have one exact mode/recovery declaration in nas_storage;
      host_prep alone owns its creation and ownership policy.
  vars:
    seafile_storage_matches: >-
      {{ nas_storage | selectattr('path', 'equalto', item.path) | list }}
  loop: "{{ seafile_required_storage_declarations }}"
  loop_control:
    label: "{{ item.path }}"
