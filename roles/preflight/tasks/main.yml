---
- name: Require explicit nonempty application endpoint coordinates
  ansible.builtin.assert:
    that:
      - platform_public_host | length > 0
      - platform_callback_host | length > 0
    fail_msg: >-
      Inventory must define nonempty public and container-callback host
      coordinates before target mutation. Export PLATFORM_PUBLIC_HOST with the
      address clients use to reach published services, which is not necessarily
      the address this run connects through: ntfy hashes it into the topic it
      registers for mobile push, so it must match what devices have stored.
      PLATFORM_CALLBACK_HOST is the separate address containers use to reach
      host-published callbacks.
    success_msg: Application endpoint coordinates are explicit.

- name: Restrict synthetic Linux ownership correction
  ansible.builtin.assert:
    that:
      - not (platform_manage_linux_ownership | bool) or
        (platform_kind == 'mac' and
         platform_compose_kind == 'integration' and
         (deployment_bundle_test_mode | bool) and
         ansible_facts.system == 'Linux' and
         nas_docker_root is match('^.*/nas-platform-mac\.[A-Za-z0-9]{6}/service-data/docker$') and
         nas_media_root is match('^.*/nas-platform-mac\.[A-Za-z0-9]{6}/service-data/media$'))
    fail_msg: Linux ownership correction is restricted to an owned integration adoption sandbox.
    success_msg: Linux ownership correction scope is explicit.

- name: Report how this run reaches the NAS
  ansible.builtin.debug:
    msg: >-
      Connection {{ ansible_connection | default('ssh') }},
      interpreter {{ ansible_facts['python_version'] }},
      host {{ ansible_facts['hostname'] | default('unknown') }}

- name: Require a usable Python interpreter
  ansible.builtin.assert:
    that:
      - ansible_facts['python_version'] is version(nas_python_minimum, '>=')
    fail_msg: >-
      Python {{ nas_python_minimum }} or newer is required. Found
      {{ ansible_facts['python_version'] }}. Both run modes need it: running on
      the NAS needs it for Ansible itself, and running from a workstation needs
      it as the target interpreter.
    success_msg: "Python {{ ansible_facts['python_version'] }} is usable"

# check_mode: false because command is skipped under --check, which would leave
# these registers empty and make every assertion below fail during a dry run.
# Both are read-only, so running them in check mode is safe and necessary.
- name: Confirm the Docker daemon is reachable
  ansible.builtin.command:
    argv: [docker, version, --format, json]
  changed_when: false
  check_mode: false

- name: Read the Docker Compose plugin version
  ansible.builtin.command:
    argv: [docker, compose, version, --short]
  register: preflight_compose
  changed_when: false
  check_mode: false

- name: Require a Compose plugin new enough for docker_compose_v2
  ansible.builtin.assert:
    that:
      - preflight_compose_version is version(nas_compose_minimum, '>=')
    fail_msg: >-
      Docker Compose plugin {{ nas_compose_minimum }} or newer is required, which
      is the floor community.docker.docker_compose_v2 documents. Found
      '{{ preflight_compose.stdout }}'. Compose is at v5, so this compares
      versions rather than matching a major.
    success_msg: "Docker Compose {{ preflight_compose_version }} is usable"
  vars:
    preflight_compose_version: "{{ preflight_compose.stdout | trim | regex_replace('^v', '') }}"

# Checked through /proc/mounts rather than the mounts fact, which is not
# populated on every platform and raises instead of failing cleanly when absent.
# Only applied to real NAS volumes: the integration sandbox puts the storage
# roots under a temporary directory, where a mount check would be meaningless.
- name: Require the NAS volumes to be mounted
  ansible.builtin.command:
    argv:
      - awk
      - -v
      - "target={{ item }}"
      - |-
        BEGIN {
          split(target, path, "/")
          target = "/" path[2]
        }
        $2 == target { found = 1 }
        END { exit !found }
      - /proc/mounts
  changed_when: false
  check_mode: false
  loop:
    - "{{ nas_docker_root }}"
    - "{{ nas_media_root }}"
  when:
    - platform_kind == 'nas'
    - item is match('^/volume')

# A capable host must also expose the declared path. This keeps the inventory
# contract explicit without pretending that a missing device is usable.
- name: Look for a render device
  ansible.builtin.stat:
    path: "{{ platform_render_device_path }}"
  register: preflight_render_device
  when: platform_render_device_available | bool

- name: Record whether hardware acceleration is available
  ansible.builtin.set_fact:
    preflight_gpu_available: >-
      {{ (platform_render_device_available | bool) and
         (preflight_render_device.stat.exists | default(false)) and
         (preflight_render_device.stat.ischr | default(false)) }}

- name: Report the hardware acceleration decision
  ansible.builtin.debug:
    msg: >-
      {{ platform_render_device_path }}
      {{ preflight_gpu_available | ternary('present, GPU services enabled',
                                     'absent, GPU services skipped') }}

- name: Look for the controller bundle source
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/services"
  register: preflight_services_dir
  delegate_to: localhost
  run_once: true

- name: Require the controller bundle source
  ansible.builtin.assert:
    that:
      - preflight_services_dir.stat.exists
      - preflight_services_dir.stat.isdir
    fail_msg: >-
      {{ playbook_dir }}/services not found on the controller. Run Ansible from
      the nas-platform checkout that owns the deployment definitions.
    success_msg: "Controller bundle source found at {{ playbook_dir }}/services"
  delegate_to: localhost
  run_once: true

# A probe, not a state change, so it reports unchanged. Otherwise every run looks
# changed and the idempotence check could never be clean.
- name: Inspect the deterministic write probe path
  ansible.builtin.stat:
    path: "{{ nas_docker_root }}/.nas-platform-preflight-probe"
    follow: false
  register: preflight_write_probe

- name: Refuse to remove a pre-existing write probe path
  ansible.builtin.assert:
    that:
      - not preflight_write_probe.stat.exists
    fail_msg: >-
      {{ nas_docker_root }}/.nas-platform-preflight-probe must not already exist;
      refusing to remove pre-existing data.

- name: Confirm the service state root is writable
  ansible.builtin.file:
    path: "{{ nas_docker_root }}/.nas-platform-preflight-probe"
    state: directory
    mode: "0755"
  changed_when: false

- name: Remove the write probe
  ansible.builtin.file:
    path: "{{ nas_docker_root }}/.nas-platform-preflight-probe"
    state: absent
  changed_when: false
