---
argument_specs:
  main:
    short_description: Assert the host can run the platform before anything changes
    description:
      - Fails early and specifically rather than letting a later role fail
        obscurely. Checks the interpreter, Docker, the Compose floor, that the
        NAS volumes are mounted, that the controller bundle source is present,
        and that nas_docker_root -- the service state root -- is writable, which
        is what the write-probe tasks are named for.
      - >-
        It does NOT probe platform_deploy_root. The description said it did
        until issue 654, while tasks/main.yml has only ever probed
        nas_docker_root, and a policy check requires exactly that -- see
        "fresh-install preflight must probe the existing validated
        nas_docker_root" in tests/policy_platform_test.rb, which two mutation
        rows plant platform_deploy_root against. The option was required here
        and read nowhere, so it is gone.
      - >-
        platform_deploy_root is nas_docker_root joined with nas-platform, a
        child of the probed directory, so a writable parent is what lets
        deployment_bundle create it. A deploy root that exists and is not
        writable is still caught, by deployment_bundle, later than here. Adding
        that probe is a behaviour change to a role the five-minute poller runs,
        so it belongs in an issue with a measurement rather than in a
        dead-surface cleanup.
      - >-
        The options that remain and are not read in tasks/main.yml are NOT dead.
        PLATFORM_CAPABILITIES in tests/policy_platform_test.rb are host-class
        facts that must not be all-group variables, and this role is where the
        run fails early if a host class left one undeclared: required:true in
        this spec IS that assertion. Reading them is not the point and never was.
    options:
      platform_kind:
        type: str
        required: true
        choices: [nas, mac]
        description: >-
          Production platform identifier. Test-only Compose selection uses a
          separate deployment bundle override.
      platform_container_cpu_budget:
        type: int
        required: true
        description: >-
          Logical CPUs available to managed containers. Zero means every CPU
          reported by Docker and is allowed only on non-production platforms.
      platform_public_host:
        type: str
        required: true
        description: Hostname operators use to reach published services.
      platform_callback_host:
        type: str
        required: true
        description: Hostname containers use to reach host-published callbacks.
      media_usenet_enabled:
        type: bool
        required: true
      media_torrent_enabled:
        type: bool
        required: true
      platform_render_device_available:
        type: bool
        required: true
        description: Whether this host class can expose a render device.
      platform_render_device_path:
        type: path
        required: true
        description: Host render-device path to validate when available.
      platform_smart_sata_devices:
        type: list
        elements: path
        required: true
        description: SATA base devices the Beszel Intel agent reads S.M.A.R.T. from; empty off the NAS.
      platform_smart_nvme_namespaces:
        type: list
        elements: path
        required: true
        description: NVMe namespaces the Beszel Intel agent reads S.M.A.R.T. through; empty off the NAS.
      platform_beszel_agent_available:
        type: bool
        required: true
        description: Whether this host class runs a managed Beszel agent.
      platform_beszel_agent_kind:
        type: str
        required: true
        choices: [intel, portable]
        description: Agent artifact and host wiring supported by this host class.
      nas_python_minimum:
        type: str
        required: true
        description: Lowest interpreter version the plays are known to work on.
      nas_compose_minimum:
        type: str
        required: true
        description: Compose floor required by community.docker.docker_compose_v2.
      nas_docker_root:
        type: str
        required: true
        description: Directory holding service-owned state.
      nas_media_root:
        type: str
        required: true
        description: Directory holding NAS-managed user files.
