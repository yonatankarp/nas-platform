---
argument_specs:
  main:
    short_description: Assert the host can run the platform before anything changes
    description:
      - Fails early and specifically rather than letting a later role fail
        obscurely. Checks the interpreter, Docker, the Compose floor, that the
        NAS volumes are mounted, that the controller bundle source is present,
        and that the deployment root is writable.
    options:
      platform_kind:
        type: str
        required: true
        choices: [nas, mac]
        description: >-
          Production platform identifier. Test-only Compose selection uses a
          separate deployment bundle override.
      platform_public_host:
        type: str
        required: true
        description: Hostname operators use to reach published services.
      platform_callback_host:
        type: str
        required: true
        description: Hostname containers use to reach host-published callbacks.
      platform_render_device_available:
        type: bool
        required: true
        description: Whether this host class can expose a render device.
      platform_render_device_path:
        type: path
        required: true
        description: Host render-device path to validate when available.
      platform_host_network_available:
        type: bool
        required: true
        description: Whether containers can use native host networking.
      platform_host_network_adapter:
        type: str
        required: true
        choices: [host, published_ports]
        description: Host-specific networking adaptation for service roles.
      platform_external_integration_checks:
        type: bool
        required: true
        description: Whether non-mutating external integration checks may run.
      nas_python_minimum:
        type: str
        required: true
        description: Lowest interpreter version the plays are known to work on.
      nas_compose_minimum:
        type: str
        required: true
        description: Compose floor required by community.docker.docker_compose_v2.
      nas_docker_root:
        type: str
        required: true
        description: Directory holding service-owned state.
      nas_media_root:
        type: str
        required: true
        description: Directory holding NAS-managed user files.
      platform_deploy_root:
        type: str
        required: true
        description: Root containing versioned controller deployment bundles.
