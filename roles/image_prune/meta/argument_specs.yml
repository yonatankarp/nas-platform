---
argument_specs:
  main:
    short_description: Schedule the NAS Docker image prune
    description:
      - Installs the prune script, its non-secret configuration, one protected
        Pushover publisher configuration per application, the ntfy publisher
        configuration a previous prune still reads, and one weekly cron entry.
    options:
      platform_kind:
        description: Platform discriminator; the role accepts only nas.
        type: str
        required: true
      vault_ntfy_deploy_token:
        description: >-
          The deployer's own least-privilege write-only ntfy token, still
          rendered into ntfy-prune.curl for a prune running the previous
          revision; removed with ntfy in stage 4 of #558.
        type: str
        required: true
      vault_pushover_alerts_token:
        description: Token of the Pushover Alerts application, which a failed prune goes to.
        type: str
        required: true
      vault_pushover_containers_token:
        description: Token of the Pushover Containers application, which a reclaim goes to.
        type: str
        required: true
      vault_pushover_user_key:
        description: The Pushover user key every application delivers to.
        type: str
        required: true
      ntfy_port:
        description: >-
          Port the ntfy-prune.curl a previous prune still reads addresses.
          Required rather than defaulted: this play does not run the ntfy
          role, so a default here would be the operative value rather than a
          fallback (#402). Declared in inventory/group_vars/all/main.yml.
        type: int
        required: true
      image_prune_home:
        description: Real home of the dedicated non-root deployment account.
        type: path
      image_prune_checkout:
        description: Controller checkout the prune script is installed from.
        type: path
      image_prune_cron_name:
        description: Comment identifying the managed cron entry.
        type: str
      image_prune_cron_minute:
        description: Cron minute field for the weekly prune.
        type: str
      image_prune_cron_hour:
        description: Cron hour field for the weekly prune.
        type: str
      image_prune_cron_weekday:
        description: Cron weekday field for the weekly prune.
        type: str
      image_prune_retention_hours:
        description: Images created less than this many hours ago are never removed.
        type: int
      image_prune_dangling_retention_hours:
        description: Shorter window applied to untagged images nothing can name.
        type: int
      image_prune_log_retention_days:
        description: Days of prune logs to retain.
        type: int
      image_prune_lock_wait_seconds:
        description: Seconds a prune waits for an in-flight deployment to finish.
        type: int
      image_prune_deployment_lock:
        description: The poller's deployment lock the prune serialises against.
        type: path
      image_prune_external_scheduler:
        description: Prune is scheduled outside cron; the role installs no entry.
        type: bool
      image_prune_pushover_api_url:
        description: Pushover message API the protected curl configs address.
        type: str
      image_prune_pushover_notifiers:
        description: >-
          The Alerts then the Containers Pushover curl config, each a path and
          the name of the vault variable holding that application's token.
        type: list
        elements: dict
