---
# Manifest service directory; used only in messages.
container_health_service_name: ""
# Compose project label that selects the containers; passed, not derived.
container_health_project_name: ""
# The caller's deployment failure, if any. Re-raised unchanged unless a stuck
# container explains it.
container_health_deploy_failure_message: ""
# false = detect-only pass before a force-recreate; true = the verdict pass.
container_health_refuse: true
# Message only: the refusal says a force-recreate was already spent.
container_health_retried: false
# Read only by tasks/recover.yml: the caller's own deployment arguments, passed
# so the recreate addresses exactly the release the caller declared.
container_health_compose_dir: ""
container_health_compose_files: []
container_health_env_files: []
