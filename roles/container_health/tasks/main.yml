---
# A crash-looping container survives `compose up` on an unchanged spec (only
# --force-recreate replaces it), so a converge would report success forever
# (#509). This refuses; tasks/recover.yml is the detect/recreate-once/verdict wrapper.
- name: Refuse a container that runs but never serves
  ansible.builtin.include_tasks: inspect.yml
  when: not ansible_check_mode

# Check mode starts nothing to inspect, so the intent is stated instead.
- name: Report the container health refusal check mode defers
  ansible.builtin.debug:
    msg: >-
      A live run would read every container of Compose project
      {{ container_health_project_name }} that Docker reports as restarting or
      unhealthy, print its status, exit code, restart count and health log, and
      fail the {{ container_health_service_name }} deployment rather than
      continue past it. Docker's verdict belongs to containers this run did not
      start, so check mode reports the intent instead of inspecting them.
  when: ansible_check_mode

# Under --check nothing can be classified, so a deployment failure is re-raised as is.
- name: Re-raise a deployment failure check mode cannot classify
  ansible.builtin.fail:
    msg: >-
      {{ container_health_deploy_failure_message }} (Check mode starts no
      container, so the {{ container_health_service_name }} deployment failure
      was re-raised without inspecting the project's container state.)
  when:
    - ansible_check_mode
    - container_health_deploy_failure_message | length > 0
