---
# Union of two filters: a crash-looping container with no health check is only
# `restarting`, and a running one failing its probe is only `unhealthy`. No
# `--all`: an exited one-shot keeps its last health status, and `up` restarts exited ones.
- name: List restarting containers in the managed Compose project
  ansible.builtin.command:
    argv:
      - docker
      - container
      - ls
      - --quiet
      - --filter
      - "label=com.docker.compose.project={{ container_health_project_name }}"
      - --filter
      - status=restarting
  register: container_health_restarting
  changed_when: false
  check_mode: false

- name: List unhealthy containers in the managed Compose project
  ansible.builtin.command:
    argv:
      - docker
      - container
      - ls
      - --quiet
      - --filter
      - "label=com.docker.compose.project={{ container_health_project_name }}"
      - --filter
      - health=unhealthy
  register: container_health_unhealthy
  changed_when: false
  check_mode: false

- name: Resolve the containers of the managed Compose project that never serve
  ansible.builtin.set_fact:
    container_health_stuck_ids: >-
      {{ (container_health_restarting.stdout_lines
          + container_health_unhealthy.stdout_lines) | unique }}

# SECURITY: narrow fields only; a bare inspect prints .Config.Env (every credential).
# .State.Health holds probe output but not its argv. Logs are not captured (unknown
# contents), which is why this and the report below can go without no_log.
- name: Read what the stuck containers of the managed Compose project are doing
  ansible.builtin.command:
    argv: >-
      {{ ['docker', 'container', 'inspect', '--format', container_health_format]
         + container_health_stuck_ids }}
  vars:
    container_health_format: >-
      {% raw %}{{.Name}} service={{index .Config.Labels
      "com.docker.compose.service"}} image={{.Config.Image}}
      status={{.State.Status}} exit={{.State.ExitCode}}
      restarts={{.RestartCount}} error={{.State.Error}}
      health={{if .State.Health}}{{json .State.Health}}{{else}}unset{{end}}{% endraw %}
  register: container_health_evidence
  when: container_health_stuck_ids | length > 0
  failed_when: false
  changed_when: false
  check_mode: false

# Read from the labels Docker actually applied, the same selector as the filters.
- name: Read the Compose services of the stuck containers
  ansible.builtin.command:
    argv: >-
      {{ ['docker', 'container', 'inspect', '--format', container_health_service_format]
         + container_health_stuck_ids }}
  vars:
    container_health_service_format: >-
      {% raw %}{{index .Config.Labels "com.docker.compose.service"}}{% endraw %}
  register: container_health_service_probe
  when: container_health_stuck_ids | length > 0
  failed_when: false
  changed_when: false
  check_mode: false

# Always published (empty when healthy): callers gate their recreate on it.
- name: Resolve the Compose services of the stuck containers
  ansible.builtin.set_fact:
    container_health_stuck_services: >-
      {{ container_health_service_probe.stdout_lines | default([], true)
         | select | unique | list }}

- name: Report what the stuck containers of the managed Compose project are doing
  ansible.builtin.debug:
    msg: >-
      Compose project {{ container_health_project_name }} holds
      {{ container_health_stuck_ids | length }} container(s) that Docker reports
      as restarting or unhealthy. Their state follows, one per line:
      {{ container_health_evidence.stdout | default('', true) | trim
         | default('(no container state recorded)', true) }}
  when: container_health_stuck_ids | length > 0

# Any other deployment failure keeps its own message; this role reinterprets nothing else.
- name: Re-raise a deployment failure that no stuck container explains
  ansible.builtin.fail:
    msg: "{{ container_health_deploy_failure_message }}"
  when:
    - container_health_stuck_ids | length == 0
    - container_health_deploy_failure_message | length > 0

# A refusal, not a warning: a warning let a wedged stack go unnoticed for days (#509).
- name: Refuse a Compose project holding a container that runs but never serves
  when: container_health_refuse | bool
  vars:
    container_health_retried_report: >-
      A force-recreate of exactly {{ container_health_stuck_services | join(', ') }}
      has already been spent on this and the replacement came back stuck too, so
      the container in front of you is a fresh one and THIS FAILURE ALREADY
      INCLUDES THAT RETRY -- it is not a service that needs one more converge.
    container_health_deploy_report: >-
      The deployment that produced this state also failed, and reported:
      {{ container_health_deploy_failure_message }}
    container_health_silent_report: >-
      The deployment that produced this state reported success, which is the
      part that makes this class silent: nothing else in the run would have said
      a word.
  ansible.builtin.assert:
    that:
      - container_health_stuck_ids | length == 0
    fail_msg: >-
      The {{ container_health_service_name }} deployment left
      {{ container_health_stuck_ids | length }} container(s) of Compose project
      {{ container_health_project_name }} restarting or unhealthy. Their state is
      printed above, captured before anything could destroy it.
      {{ container_health_retried_report if container_health_retried | bool else '' }}
      {{ container_health_deploy_report
         if container_health_deploy_failure_message | length > 0
         else container_health_silent_report }}
      Compose alone will not repair it: measured on Docker 29.7.2, `docker
      compose up` against an unchanged specification keeps the same container
      and recreates nothing, and `restart: unless-stopped` is what produces the
      loop rather than what ends it, so only a changed image or an explicit
      force-recreate replaces it. Read `docker logs` for each container named
      above -- a Compose project may hold several and only its own name reaches
      the daemon -- because for #509 the cause was one line there and in no
      other reading; Dozzle carries the same lines. The fix for whatever it
      names belongs in this repository and reaches the host on the poller's next
      tick.
