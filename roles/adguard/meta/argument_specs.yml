---
argument_specs:
  main:
    short_description: Deploy AdGuard Home and verify that it resolves and filters
    options:
      platform_compose_kind:
        type: str
        required: true
      platform_project_name:
        type: str
        required: false
      adguard_deployment_enabled:
        type: bool
        required: true
      adguard_port:
        type: int
        required: false
      adguard_dns_port:
        type: int
        required: false
      adguard_dns_container_port:
        type: int
        required: false
      adguard_url:
        type: str
        required: false
      adguard_config_host_path:
        type: path
        required: false
      adguard_work_host_path:
        type: path
        required: false
      adguard_upstream_dns:
        type: list
        elements: str
        required: false
      adguard_bootstrap_dns:
        type: list
        elements: str
        required: false
      adguard_filters:
        type: list
        elements: dict
        required: false
      adguard_blocked_probe_domain:
        type: str
        required: false
      adguard_allowed_probe_domain:
        type: str
        required: false
      vault_adguard_admin_username:
        type: str
        required: true
      vault_adguard_admin_password:
        type: str
        required: true
      vault_adguard_admin_password_hash:
        type: str
        required: true
