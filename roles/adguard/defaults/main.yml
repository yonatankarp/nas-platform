---
# The single operator switch. Inventory sets it, and
# inventory/group_vars/all/main.yml is where the deployment decision is made and
# explained; this default stays false so the role converges to `state: absent`
# for any caller that runs it without that inventory rather than putting a
# resolver on the household network on the strength of a missing variable. The
# gate lives inside the role rather than on the site.yml entry, because a `when:`
# there would also skip the deployment_bundle re-include that revalidates the
# paths this role touches and the deployment report that says whether anything
# moved.
adguard_deployment_enabled: false

# 8083, the web interface. It was Seafile's until #501 removed that stack, and
# it is the lowest free port on this platform: 8080 is Dozzle, 8081 the Dozzle
# alert relay, 8082 the qbittorrent web interface declared in
# config/media-acquisition.yml, 8084 Nextcloud, 8085 SABnzbd and 8090 Beszel.
adguard_port: 8083

# The DNS publication, and the first privileged port this platform publishes.
# Confirmed free on the NAS from the full `netstat -tulnp` listener table on
# 2026-09-10: no TCP or UDP listener on 53 on any interface, the nearest
# neighbour being 5353/mDNS.
#
# The container itself listens on adguard_dns_container_port, not on this one.
# 5353 is unprivileged, which is what lets the container run as the platform
# identity rather than as root; the Docker daemon binds the privileged half.
# services/adguard/compose.yml carries the production copies of both numbers,
# because a Compose file cannot read a role default.
adguard_dns_port: 53
adguard_dns_container_port: 5353

# Every role addresses services over 127.0.0.1, which is correct whether the
# play runs on the NAS itself or over SSH from a workstation.
adguard_url: "http://127.0.0.1:{{ adguard_port }}"

# Ansible owns the whole of the first; the second is AdGuard's own working
# directory and holds the downloaded filter lists, the query log, the statistics
# database and the web session store. Both are recovery: cache in
# inventory/group_vars/all/main.yml -- see the declaration there for why nothing
# under either needs backing up.
adguard_config_host_path: "{{ nas_docker_root }}/adguard/conf"
adguard_work_host_path: "{{ nas_docker_root }}/adguard/work"

adguard_compose_project_name: >-
  {{ (platform_project_name ~ '-adguard')
     if platform_project_name | default('') | length > 0 else 'adguard' }}

# WHAT THIS ROLE DELIBERATELY DOES NOT DO, and why each omission is a decision
# rather than unfinished work. Everything below is the obvious next step for a
# future reader, so the reasoning is here rather than left to be rediscovered.
#
# 1. IT DOES NOT POINT THE HOST'S OWN RESOLVER AT ADGUARD.
#
# It could not if it wanted to. Confirmed on the NAS, 2026-09-10:
# /etc/resolv.conf is generated by tailscaled, declares "DO NOT EDIT THIS FILE
# BY HAND -- CHANGES WILL BE OVERWRITTEN", and lists Tailscale MagicDNS
# (100.100.100.100 and its IPv6 equivalent) as the only nameservers, with no
# public fallback. The constraint is enforced from outside this repository.
#
# The hazard has not gone away, it has moved: setting AdGuard as the tailnet's
# global nameserver in the Tailscale admin console makes MagicDNS forward the
# NAS's own queries to AdGuard running on the NAS. An AdGuard that is down -- or
# hung, which is worse -- then means the deployment poller cannot resolve GitHub,
# cannot fetch the candidate revision, and cannot heal the host. That is the
# #327 shape exactly: the recovery path depending on the thing that is down. No
# check in this repository can see that console setting, which is why it is
# written here. Revisit only once AdGuard has a track record AND a fallback
# nameserver is configured alongside it; none is configured today.
#
# 2. IT DOES NOT ENABLE ADGUARD'S DHCP SERVER. The router owns DHCP, and the
# rejected alternative is worth stating because it looks like the tidy answer to
# item 3 below. Disabling DHCP on the router and letting AdGuard serve leases
# trades the DNS single point of failure for a strictly worse one: with the NAS
# handing out leases, a NAS outage stops devices joining the network at all
# rather than merely leaving them unfiltered.
#
# 3. IT DOES NOT DISTRIBUTE ITSELF TO CLIENTS, AND MAY NOT BE ABLE TO. The
# intended delivery mechanism is the router's DHCP scope handing out this NAS as
# the DNS server. Discovered 2026-09-10: the household router is a Vodafone
# Station, and that class of router generally does not expose a custom DNS server
# setting for its DHCP scope; the operator is confirming the exact model. If it
# cannot, the accepted fallback is per-device DNS set by hand on the devices that
# take one -- consoles, televisions, phones, laptops -- and guests stay
# unfiltered. Either way it is configuration on the network rather than in this
# repository, and no task here should grow to reach for it.

# The upstreams, and the resolvers used to reach them.
#
# DNS-over-TLS, so the queries this platform forwards are not readable by
# whoever carries them. A DoT upstream is named by hostname, which is a name the
# resolver cannot yet resolve -- that is what the bootstrap list is for, and why
# those entries are plain addresses rather than names. The two bootstrap
# addresses under each upstream belong to the same operator as the upstream
# itself.
adguard_upstream_dns:
  - tls://dns.quad9.net
  - tls://1.1.1.1
adguard_bootstrap_dns:
  - 9.9.9.9
  - 149.112.112.112
  - 1.1.1.1
  - 1.0.0.1

# The filter lists, by AdGuard's own registry identifier. One list, deliberately:
# the AdGuard DNS filter is the registry's own default and the one this platform
# is prepared to explain a false positive from. Adding a second is a one-line
# edit here; the identifiers are the registry's, so a list added with an
# identifier that is already taken silently replaces the other one.
#
# tests/contracts/adguard-runtime.rb proves this list is in force by resolving a
# name it blocks, so the list is not merely declared.
adguard_filters:
  - id: 1
    name: AdGuard DNS filter
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt

# A name the declared filter list blocks, and one it does not. The role's own
# verification and the contract both resolve the pair, which is what turns
# "AdGuard answered" into "AdGuard is filtering". Both are stable entries rather
# than sampled ones: `doubleclick.net` carries an explicit `||doubleclick.net^`
# rule in filter_1, and `example.com` is reserved by RFC 2606 and appears on no
# blocklist.
adguard_blocked_probe_domain: doubleclick.net
adguard_allowed_probe_domain: example.com
