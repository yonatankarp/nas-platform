---
# The deployment report, a stage of its own rather than the last task of
# deploy.yml so that it can see every result that stage registers -- the
# deployment, the teardown, the bounded force-recreate, and the restart that
# reverts drift made in the web interface. deploy.yml is imported statically, so
# it shares one variable scope with this file and nothing has to be passed.
#
# Ungated on purpose, and it says nothing when nothing moved: the report is
# gated on the results themselves, so a converge with the flag off and a project
# already absent is silent, and the run that first tears the project down reports
# that it did.
#
# Every term carries a default, because each of the four tasks behind them is
# conditional and a reader of an undefined name is an error rather than a false.
- name: Report the AdGuard Home deployment
  ansible.builtin.include_role:
    name: ntfy
    tasks_from: deployment_report
  vars:
    ntfy_deployment_report_service: AdGuard Home
    ntfy_deployment_report_changed: >-
      {{ ((adguard_deploy | default({})) is changed) or
         ((adguard_teardown | default({})) is changed) or
         ((adguard_wedged_recreate | default({})) is changed) or
         ((adguard_config_restart | default({})) is changed) }}
