---
# Inventory sets it true (service_nextcloud.yml); false here converges to absent. The
# gate lives in the role, not on site.yml, so deployment_bundle and the report still run.
nextcloud_deployment_enabled: false

# 8083 is free but stays unclaimed: moving a published port is a redeployment.
nextcloud_port: 8084

nextcloud_url: "http://127.0.0.1:{{ nextcloud_port }}"

nextcloud_data_host_path: "{{ nas_docker_root }}/nextcloud/data"
nextcloud_postgres_host_path: "{{ nas_docker_root }}/nextcloud/postgres"

# Nextcloud answers 400 to any Host not in trusted_domains, matched on host only (the
# port is ignored). 127.0.0.1 is what verify.yml polls; localhost is what the container's
# own health check requests, and the installer writes it itself at index 0.
nextcloud_trusted_domains: >-
  {{ (['127.0.0.1', 'localhost', platform_public_host | default('')]
      + nextcloud_additional_trusted_domains)
     | select | map('trim') | select | unique | list }}

# Extra hostnames (e.g. a mesh name), kept apart from platform_public_host, which
# Beszel, Seerr and Vaultwarden also derive URLs from. Empty until such a name exists.
nextcloud_additional_trusted_domains: []

# An off-set, not an on-set: listing the apps to keep would copy the image's
# defaultEnabled list, a copy nothing bumps. App versions come only from the image
# digest; `occ app:install` takes no version. nextcloud-static.rb pins photos,
# updatenotification and survey_client; the entries marked judgement are unpinned.
nextcloud_disabled_apps:
  # Derived from #500's scope: Immich is this platform's photo service.
  - photos
  # Principle: the NAS does not phone home; the digest pin is the only upgrade path.
  - updatenotification
  # Same principle, stricter: outbound telemetry.
  - survey_client
  # Judgement: vendor news in the notification bell.
  - nextcloud_announcements
  # Judgement: one-time welcome overlay.
  - firstrunwizard
  # Judgement: not an editor, only a navigation entry for a Collabora backend this
  # platform does not deploy.
  - office
  # Judgement: per-user weather API calls from a NAS.
  - weather_status
  # Judgement: no mail transport is configured, so this share option cannot deliver.
  - sharebymail

# Deliberately kept on: text (document editing is why #500 adopted Nextcloud);
# activity, notifications, files_* and friends (siblings silently lose features);
# security/operability apps; contactsinteraction and dav (future CalDAV/CardDAV).

# Operator extension, set in inventory/group_vars/all/service_nextcloud.yml.
nextcloud_additional_disabled_apps: []

nextcloud_disabled_apps_effective: >-
  {{ (nextcloud_disabled_apps + nextcloud_additional_disabled_apps)
     | map('trim') | select | unique | list }}

# The URL cron.php and occ build without a request; otherwise mails say localhost.
nextcloud_overwrite_cli_url: "http://{{ platform_public_host }}:{{ nextcloud_port }}"

# Not the boot budget; the compose health checks are. Each wait must stay above its
# stage's worst-case unhealthy verdict (application 450s, db/cache 210s) so a wedged
# boot surfaces as Docker naming the container rather than a bare timeout.
nextcloud_data_compose_wait_timeout: 300
nextcloud_compose_wait_timeout: 600

nextcloud_compose_project_name: >-
  {{ (platform_project_name ~ '-nextcloud')
     if platform_project_name | default('') | length > 0 else 'nextcloud' }}

# Declared, not self-sized: PHP reads it from ini, which is why no mem_limit is needed.
nextcloud_php_memory_limit: 512M
