---
# Assertions only: a path this role does not own fails before the release is read.

- name: Require exact Nextcloud host storage policy
  ansible.builtin.assert:
    that:
      - nextcloud_data_host_path == (nas_docker_root ~ '/nextcloud/data')
      - nextcloud_postgres_host_path == (nas_docker_root ~ '/nextcloud/postgres')
      - >-
        [nextcloud_data_host_path, nextcloud_postgres_host_path]
        | unique | length == 2
      - not nextcloud_postgres_host_path.startswith(nextcloud_data_host_path ~ '/')
      - not nextcloud_data_host_path.startswith(nextcloud_postgres_host_path ~ '/')
    fail_msg: >-
      Nextcloud storage paths overlap or differ from the owned policy. The
      installation tree and the database cluster must be two separate roots:
      /var/www/html is rsynced from the image on every version bump, and a
      PostgreSQL cluster living inside a directory that gets rsynced over is a
      cluster that does not survive an upgrade.

# Both roots are critical: the tree is the user's documents, the cluster their meaning.
- name: Resolve required central Nextcloud storage declarations
  ansible.builtin.set_fact:
    nextcloud_required_storage_declarations:
      - {path: "{{ nas_docker_root }}/nextcloud/data", mode: "0755", recovery: critical}
      # 0755, not 0700: PostgreSQL 18 creates a 0700 PGDATA beneath this mount, and the
      # parent must stay traversable for the postgres account.
      - {path: "{{ nas_docker_root }}/nextcloud/postgres", mode: "0755", recovery: critical}

- name: Require unique central Nextcloud storage declarations
  ansible.builtin.assert:
    that:
      - nextcloud_storage_matches | length == 1
      - nextcloud_storage_matches[0].mode == item.mode
      - nextcloud_storage_matches[0].recovery == item.recovery
    fail_msg: >-
      {{ item.path }} must have one exact mode/recovery declaration in nas_storage;
      host_prep alone owns its creation and ownership policy.
  vars:
    nextcloud_storage_matches: >-
      {{ nas_storage | selectattr('path', 'equalto', item.path) | list }}
  loop: "{{ nextcloud_required_storage_declarations }}"
  loop_control:
    label: "{{ item.path }}"
