---
# Applies defaults/main.yml's off-set. `occ upgrade` cannot re-enable a disabled
# shipped app; re-asserted each run because an operator or a reinstall onto an empty
# volume can. No restart is needed: app state is read from AppConfig per request.

- name: Read the enabled Nextcloud applications
  community.docker.docker_compose_v2_exec:
    project_src: "{{ platform_current_dir }}/services/nextcloud"
    project_name: "{{ nextcloud_compose_project_name }}"
    files: "{{ platform_service_compose_files['nextcloud'] }}"
    env_files: ["{{ platform_runtime_dir }}/services/nextcloud/.env"]
    service: nextcloud
    user: www-data
    argv: [php, occ, app:list, --output=json]
    tty: false
  register: nextcloud_app_census
  when:
    - nextcloud_deployment_enabled | bool
    - not ansible_check_mode
  # docker_compose_v2_exec checks rc only with detach; without this a failed census
  # reads as an empty app set and a false converge.
  failed_when: nextcloud_app_census.rc | default(1) | int != 0
  changed_when: false
  check_mode: false

# The intersection keeps a converged run at zero iterations. `stdout_lines | last`:
# occ may prefix its one-line JSON with a deprecation notice.
- name: Resolve the Nextcloud applications this platform still has to disable
  ansible.builtin.set_fact:
    nextcloud_apps_still_enabled: >-
      {{ nextcloud_disabled_apps_effective
         | intersect((nextcloud_app_census.stdout_lines | last | from_json)
                     .get('enabled', {}) | list) }}
  when:
    - nextcloud_deployment_enabled | bool
    - not ansible_check_mode

- name: Disable the Nextcloud applications this platform does not run
  community.docker.docker_compose_v2_exec:
    project_src: "{{ platform_current_dir }}/services/nextcloud"
    project_name: "{{ nextcloud_compose_project_name }}"
    files: "{{ platform_service_compose_files['nextcloud'] }}"
    env_files: ["{{ platform_runtime_dir }}/services/nextcloud/.env"]
    service: nextcloud
    user: www-data
    argv: [php, occ, app:disable, "{{ item }}"]
    tty: false
  register: nextcloud_app_repair
  loop: "{{ nextcloud_apps_still_enabled | default([]) }}"
  # Exit 2 means the app is alwaysEnabled upstream (not restated here); failing loudly
  # beats retrying it forever. The diagnostic is on stdout, not stderr.
  failed_when: nextcloud_app_repair.rc | default(1) | int != 0
  # Negative match: the success line embeds a moving version, the already-disabled line
  # is fixed text. Covers an app disabled between census and write.
  changed_when: "'No such app enabled' not in nextcloud_app_repair.stdout | default('')"
  when:
    - nextcloud_deployment_enabled | bool
    - not ansible_check_mode

- name: Report the Nextcloud application reconciliation check mode defers
  ansible.builtin.debug:
    msg: >-
      A live run would read Nextcloud's enabled applications with
      `occ app:list --output=json` and disable any of
      {{ nextcloud_disabled_apps_effective | join(', ') }} that are still on.
      That reads a running container this run did not start, so check mode
      reports the intent instead of acting on it. photos is the one this
      platform serves elsewhere -- Immich is the photo service -- and the rest
      are outbound calls, onboarding pages and a share transport this deployment
      has no use for.
  when:
    - nextcloud_deployment_enabled | bool
    - ansible_check_mode
