---
# Reconciled with occ: NEXTCLOUD_TRUSTED_DOMAINS is read only on install, and an NC_
# override turns the array into a scalar, after which every request gets HTTP 400.
# Append-only: an operator's own entry is indistinguishable from drift.

- name: Read the reconciled Nextcloud trusted domains
  community.docker.docker_compose_v2_exec:
    project_src: "{{ platform_current_dir }}/services/nextcloud"
    project_name: "{{ nextcloud_compose_project_name }}"
    files: "{{ platform_service_compose_files['nextcloud'] }}"
    env_files: ["{{ platform_runtime_dir }}/services/nextcloud/.env"]
    service: nextcloud
    user: www-data
    argv: [php, occ, config:system:get, trusted_domains]
    tty: false
  register: nextcloud_trusted_domains_current
  when:
    - nextcloud_deployment_enabled | bool
    - not ansible_check_mode
  # A missing key exits non-zero with no output: every domain is then missing.
  failed_when: false
  changed_when: false
  check_mode: false

- name: Resolve the missing Nextcloud trusted domains
  ansible.builtin.set_fact:
    nextcloud_trusted_domains_live: "{{ nextcloud_trusted_domains_live_value }}"
    nextcloud_trusted_domains_missing: >-
      {{ nextcloud_trusted_domains | difference(nextcloud_trusted_domains_live_value) }}
  vars:
    # splitlines(), not split('\n'): inside `{{ }}` Ansible pre-escapes backslashes, so
    # '\n' stays two characters and the list read as one blob (#500). It also handles \r\n.
    nextcloud_trusted_domains_live_value: >-
      {{ (nextcloud_trusted_domains_current.stdout | default('')).splitlines()
         | map('trim') | select | list }}
  when:
    - nextcloud_deployment_enabled | bool
    - not ansible_check_mode

# `occ config:system:set trusted_domains N` writes index N, so appending starts at the
# live length. That assumes a dense array (a deleted index would be overwritten).
# Runs only for missing domains, so a converged run reports no change.
- name: Reconcile the platform-owned Nextcloud trusted domains
  community.docker.docker_compose_v2_exec:
    project_src: "{{ platform_current_dir }}/services/nextcloud"
    project_name: "{{ nextcloud_compose_project_name }}"
    files: "{{ platform_service_compose_files['nextcloud'] }}"
    env_files: ["{{ platform_runtime_dir }}/services/nextcloud/.env"]
    service: nextcloud
    user: www-data
    argv:
      - php
      - occ
      - config:system:set
      - trusted_domains
      - "{{ nextcloud_trusted_domains_live | length + index }}"
      - "--value={{ item }}"
    tty: false
  register: nextcloud_trusted_domains_repair
  loop: "{{ nextcloud_trusted_domains_missing | default([]) }}"
  loop_control:
    index_var: index
  changed_when: true
  # docker_compose_v2_exec checks rc only with detach, so this line is the only thing
  # that fails a refused write. occ writes refusals to stdout, not stderr.
  failed_when: nextcloud_trusted_domains_repair.rc | default(1) | int != 0
  when:
    - nextcloud_deployment_enabled | bool
    - not ansible_check_mode

- name: Report the Nextcloud trusted domain reconciliation check mode defers
  ansible.builtin.debug:
    msg: >-
      A live run would read Nextcloud's trusted_domains with occ and append any
      of {{ nextcloud_trusted_domains | join(', ') }} that are missing. That
      reads a running container this run did not start, so check mode reports
      the intent instead of acting on it. An absent entry is not cosmetic:
      Nextcloud answers HTTP 400 to every request whose Host header it does not
      trust.
  when:
    - nextcloud_deployment_enabled | bool
    - ansible_check_mode
