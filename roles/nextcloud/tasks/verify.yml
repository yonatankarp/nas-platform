---
# /status.php answers 200 with "installed":false before install, so the status code
# alone proves nothing. Producing its JSON boots the server, which queries
# oc_appconfig, so the fields below prove the database link (#445).

- name: Verify the Nextcloud status endpoint
  tags: [platform_verify_nextcloud]
  ansible.builtin.uri:
    url: "{{ nextcloud_url }}/status.php"
    method: GET
    # All statuses accepted so the assertion below names the cause.
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: nextcloud_verify_status
  when:
    - nextcloud_deployment_enabled | bool
    - not ansible_check_mode
  failed_when: false
  changed_when: false
  check_mode: false

# Not redacted: no credential here, and it holds the only actionable message.
- name: Require an installed and serving Nextcloud during exact verification
  tags: [platform_verify_nextcloud]
  ansible.builtin.assert:
    that:
      - nextcloud_verify_status.status | default(0) | int == 200
      - (nextcloud_verify_status.json | default({})).installed | default(false) | bool == true
      - (nextcloud_verify_status.json | default({})).maintenance | default(true) | bool == false
      - (nextcloud_verify_status.json | default({})).needsDbUpgrade | default(true) | bool == false
    fail_msg: >-
      Nextcloud did not report an installed, serving instance at
      {{ nextcloud_url }}/status.php, and the four conditions separate the
      causes. A non-200 with an empty body is the database: status.php boots the
      server, and booting queries oc_appconfig for the installed app versions,
      so a Postgres that is gone surfaces here as HTTP 500 rather than as a
      database error anyone can see. A 400 is the opposite problem -- the Host
      header is not in trusted_domains, which is configuration rather than
      breakage, and roles/nextcloud reconciles that list. installed false means
      the entrypoint is still copying its tree in or its install failed;
      maintenance true and needsDbUpgrade true both mean an image bump ran
      `occ upgrade` and did not finish it, which is a restore rather than a
      retry.
  # Without the gate this would read the skipped register's defaults and fail every
  # disabled or --check run.
  when:
    - nextcloud_deployment_enabled | bool
    - not ansible_check_mode

# So the verify tag never selects nothing.
- name: Report the deferred Nextcloud verification
  tags: [platform_verify_nextcloud]
  ansible.builtin.debug:
    msg: >-
      nextcloud_deployment_enabled is false, so there is no Nextcloud instance
      to query and the verification is not attempted. A live run would GET
      {{ nextcloud_url }}/status.php and require installed true, maintenance
      false and needsDbUpgrade false -- fields status.php cannot produce without
      booting the server, which queries oc_appconfig and therefore proves the
      database link rather than the web tier alone.
  when: not nextcloud_deployment_enabled | bool

- name: Report the Nextcloud verification check mode defers
  tags: [platform_verify_nextcloud]
  ansible.builtin.debug:
    msg: >-
      A live run would GET {{ nextcloud_url }}/status.php and require an
      installed, non-maintenance instance reporting no pending database
      upgrade. That is a real request to a server this run did not start, so
      check mode reports the intent instead of making it.
  when:
    - nextcloud_deployment_enabled | bool
    - ansible_check_mode
