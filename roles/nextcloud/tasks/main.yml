---
# Index of stages. Static imports so the verify tag reaches tasks under
# tags: [never] and --list-tasks shows them; no when: on imports, because the
# nextcloud_deployment_enabled gate lives inside the files.
- name: Resolve and validate the Nextcloud storage layout
  ansible.builtin.import_tasks: storage.yml

- name: Deploy the Nextcloud stack
  ansible.builtin.import_tasks: deploy.yml

# After deployment, or run 2 would do run 1's repair and fail idempotence. These own
# the install-only settings with no NC_ override: admin password and trusted domains.
- name: Reconcile the platform-owned Nextcloud trusted domains
  ansible.builtin.import_tasks: reconcile_trusted_domains.yml

- name: Reconcile the vault Nextcloud administrator credential
  ansible.builtin.import_tasks: reconcile_admin.yml

# After the admin probe: disabling an app perturbs requests, which the probe would
# read as `unavailable` and so skip a real password repair. Re-asserted every run
# because an operator or a reinstall can re-enable an app.
- name: Reconcile the Nextcloud application policy
  ansible.builtin.import_tasks: reconcile_apps.yml

# After the reconciliations so the report can see their changes.
- name: Report whether the Nextcloud deployment moved
  ansible.builtin.import_tasks: report.yml

- name: Verify Nextcloud against its own database
  ansible.builtin.import_tasks: verify.yml
