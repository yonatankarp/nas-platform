---
# Nextcloud, one stage per file, in the order they run. This file is the index:
# what the role does, and nothing about how.
#
# The stages are imported statically, which is what makes verification
# selectable. verify.yml lists this role with tags: [never], and a role-level tag
# reaches a statically imported task exactly as it reaches an inline one, so each
# task in verify.yml still carries [never, platform_verify_nextcloud] and
# --tags platform_verify_nextcloud selects it. A dynamic include is skipped under
# never before its file is ever read. Static imports are also expanded by
# --list-tasks, so the transcript an operator reads before touching the NAS names
# every task the run will consider, and they are what keeps this role's files
# inside the fixture set tests/policy_mutation_support.rb derives rather than
# lists. Every import below carries a name and nothing else: a when: on a static
# import applies to every task in the file, and this role's gate is not a
# property of the file boundary.
#
# The gate is nextcloud_deployment_enabled, and it lives inside these files
# rather than on the site.yml role entry. A when: there would also skip the
# deployment_bundle re-include that revalidates the paths this role touches and
# the deployment report that says whether anything moved, and no site.yml entry
# carries one today.
- name: Resolve and validate the Nextcloud storage layout
  ansible.builtin.import_tasks: storage.yml

- name: Deploy the Nextcloud stack
  ansible.builtin.import_tasks: deploy.yml

# After the deployment, not before it. Both reconciliations drive `occ` inside
# the application container, so on a fresh converge there is nothing to drive
# until the stack above has run once. Reconciling first would let run 1 report
# nothing to do and run 2 perform the first repair, and those two runs
# disagreeing is exactly what the idempotence check compares.
#
# These two exist because the settings they own are the ones the image reads
# only while it is installing itself. services/nextcloud/compose.yml sorts every
# environment variable into that class or the other; what lands here is the
# residue -- the settings that are install-only AND cannot be expressed as an
# NC_ runtime override, which is the administrator's password and the trusted
# domain list.
- name: Reconcile the platform-owned Nextcloud trusted domains
  ansible.builtin.import_tasks: reconcile_trusted_domains.yml

- name: Reconcile the vault Nextcloud administrator credential
  ansible.builtin.import_tasks: reconcile_admin.yml

# After the reconciliations, and that placement is the whole reason it is a stage
# rather than the last task of deploy.yml. A converge whose only change is a
# trusted-domain repair or an administrator password reset is a change this
# platform has to announce, and a report rendered before those ran cannot see
# them.
- name: Report whether the Nextcloud deployment moved
  ansible.builtin.import_tasks: report.yml

- name: Verify Nextcloud against its own database
  ansible.builtin.import_tasks: verify.yml
