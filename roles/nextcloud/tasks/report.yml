---
# Its own stage so it runs after the reconciliations and can report their repairs.
# The repair results default because an empty loop or a skipped task can leave them
# unbound.
- name: Report the Nextcloud deployment
  ansible.builtin.include_role:
    name: deployment_bundle
    tasks_from: report
  vars:
    deployment_report_service: Nextcloud
    deployment_report_changed: >-
      {{ (nextcloud_data_deploy is changed) or (nextcloud_deploy is changed) or
         (nextcloud_teardown is changed) or
         ((pre_upgrade_backup_restart | default({})) is changed) or
         ((nextcloud_trusted_domains_repair | default({})) is changed) or
         ((nextcloud_admin_repair | default({})) is changed) or
         ((nextcloud_app_repair | default({})) is changed) }}
