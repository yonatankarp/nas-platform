---
# Everything through the render runs even when disabled: the containment re-include
# is owed regardless, and the teardown needs the rendered .env.
- name: Revalidate deployment paths before Nextcloud runtime use
  ansible.builtin.include_role:
    name: deployment_bundle
    tasks_from: target
  vars:
    deployment_target_service: nextcloud
    deployment_target_require_current_release: true
    deployment_target_extra_paths:
      - "{{ nextcloud_data_host_path }}"
      - "{{ nextcloud_postgres_host_path }}"

# Only the file format: a newline in a .env value truncates it silently. Shapes are
# owned by filter_plugins/vault_credential_schema.py and not restated.
- name: Require env-safe Nextcloud credentials
  ansible.builtin.assert:
    that:
      - vault_nextcloud_admin_username is match('^[^\r\n]+\Z')
      - vault_nextcloud_admin_password is match('^[^\r\n]+\Z')
      - vault_nextcloud_db_name is match('^[^\r\n]+\Z')
      - vault_nextcloud_db_username is match('^[^\r\n]+\Z')
      - vault_nextcloud_db_password is match('^[^\r\n]+\Z')
      - vault_nextcloud_cache_password is match('^[^\r\n]+\Z')
    fail_msg: >-
      Every Nextcloud credential must be a single-line value. Compose reads the
      rendered .env one key per line, so a newline truncates the value in
      silence -- a cut database password produces a server that cannot reach its
      own database and a cut administrator password produces an account nobody
      can log into.
  no_log: true

- name: Require a usable Nextcloud trusted domain set
  ansible.builtin.assert:
    that:
      - nextcloud_trusted_domains | length > 0
      - "'127.0.0.1' in nextcloud_trusted_domains"
      - "'localhost' in nextcloud_trusted_domains"
      - nextcloud_trusted_domains | select('search', '[\\s:/]') | list | length == 0
    fail_msg: >-
      nextcloud_trusted_domains must be a non-empty list of bare hostnames
      including 127.0.0.1 and localhost. Nextcloud compares each entry against
      the request's Host header alone -- no port, no scheme, no path -- and
      answers HTTP 400 for anything absent, which reads as a client problem
      rather than as configuration. 127.0.0.1 is what this role's verification
      polls; localhost is what the container's own health check requests.

# Redacted: this is where five vault credentials enter the target filesystem.
- name: Render the private Nextcloud environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ platform_runtime_dir }}/services/nextcloud/.env"
    mode: "0600"
  no_log: true

# Disabled means removed (with orphans), not left running unclaimed.
- name: Stop the disabled Nextcloud project
  community.docker.docker_compose_v2:
    project_src: "{{ platform_current_dir }}/services/nextcloud"
    project_name: "{{ nextcloud_compose_project_name }}"
    files: "{{ platform_service_compose_files['nextcloud'] }}"
    env_files: ["{{ platform_runtime_dir }}/services/nextcloud/.env"]
    state: absent
    remove_orphans: true
  register: nextcloud_teardown
  when: not nextcloud_deployment_enabled | bool

- name: Report the disabled Nextcloud deployment
  ansible.builtin.debug:
    msg: >-
      nextcloud_deployment_enabled is false, so the Nextcloud Compose project
      {{ nextcloud_compose_project_name }} is torn down rather than converged and
      nothing on {{ nextcloud_data_host_path }} or
      {{ nextcloud_postgres_host_path }} is read or written. Set
      nextcloud_deployment_enabled to true in
      inventory/group_vars/all/service_nextcloud.yml and merge; the auto-deploy
      poller brings the stack up on its next five-minute tick.
  when: not nextcloud_deployment_enabled | bool

# Before any Compose operation: Nextcloud refuses a store a newer version wrote, which
# is a crash loop, not a play failure (#511, #826). Only the app entrypoint migrates.
- name: Refuse a Nextcloud image older than the store this host has migrated
  ansible.builtin.include_role:
    name: image_downgrade_guard
  vars:
    image_downgrade_guard_service_name: nextcloud
    image_downgrade_guard_compose_service: nextcloud
    image_downgrade_guard_project_name: "{{ nextcloud_compose_project_name }}"
    image_downgrade_guard_store_description: >-
      {{ nextcloud_data_host_path }} and {{ nextcloud_postgres_host_path }}
  when: nextcloud_deployment_enabled | bool

# Two phases: the installer needs a database already accepting connections.
- name: Deploy the Nextcloud data services
  community.docker.docker_compose_v2:
    project_src: "{{ platform_current_dir }}/services/nextcloud"
    project_name: "{{ nextcloud_compose_project_name }}"
    files: "{{ platform_service_compose_files['nextcloud'] }}"
    env_files: ["{{ platform_runtime_dir }}/services/nextcloud/.env"]
    services: [db, cache]
    state: present
    wait: true
    wait_timeout: "{{ nextcloud_data_compose_wait_timeout }}"
  register: nextcloud_data_deploy
  when: nextcloud_deployment_enabled | bool

# Between data services and application, so the database is up and not yet migrated
# (#858). The dump alone is no rollback: the data root's code and version.php are
# archived too (#884); docs/dossier-nextcloud.md has the restore order. Both hold
# secrets and sit outside the data root, which the next upgrade's rsync would empty.
- name: Dump the Nextcloud database before a pinned upgrade
  ansible.builtin.include_role:
    name: pre_upgrade_backup
    tasks_from: pg_dump
  vars:
    pre_upgrade_backup_service_name: nextcloud
    pre_upgrade_backup_compose_service: nextcloud
    pre_upgrade_backup_stop_services: [nextcloud, cron]
    pre_upgrade_backup_database_service: db
    pre_upgrade_backup_project_name: "{{ nextcloud_compose_project_name }}"
    pre_upgrade_backup_code_root: "{{ nextcloud_data_host_path }}"
    pre_upgrade_backup_code_archive_dir: "{{ nextcloud_postgres_host_path }}/pre-upgrade-backup"
  when: nextcloud_deployment_enabled | bool

# No wedged-boot rescue: the entrypoint installs and upgrades in the foreground, so a
# failure exits PID 1, which restart policy and Compose both see.
- name: Deploy Nextcloud
  community.docker.docker_compose_v2:
    project_src: "{{ platform_current_dir }}/services/nextcloud"
    project_name: "{{ nextcloud_compose_project_name }}"
    files: "{{ platform_service_compose_files['nextcloud'] }}"
    env_files: ["{{ platform_runtime_dir }}/services/nextcloud/.env"]
    state: present
    wait: true
    wait_timeout: "{{ nextcloud_compose_wait_timeout }}"
  register: nextcloud_deploy
  when: nextcloud_deployment_enabled | bool

- name: Verify Nextcloud effective container CPU policy
  ansible.builtin.include_role:
    name: container_cpu
  vars:
    container_cpu_service_name: nextcloud
    container_cpu_project_name: "{{ nextcloud_compose_project_name }}"
  when: nextcloud_deployment_enabled | bool
