---
# Deployment. Revalidates the release paths this role touches, refuses a
# credential the env file cannot carry, renders the environment, and then takes
# one of two branches: tear the project down, or bring the data services up and
# let the application follow.
#
# Everything up to and including the render runs on both branches. The
# deployment_bundle re-include is the containment guard every service role owes
# the platform, and it is not conditional on whether this particular service is
# switched on; the render is what lets the teardown below interpolate the
# project's own volume paths at all.

- name: Revalidate deployment paths before Nextcloud runtime use
  ansible.builtin.include_role:
    name: deployment_bundle
    tasks_from: target
  vars:
    deployment_target_service: nextcloud
    deployment_target_require_current_release: true
    deployment_target_extra_paths:
      - "{{ nextcloud_data_host_path }}"
      - "{{ nextcloud_postgres_host_path }}"

# The file format, and nothing the credential contract already owns. Compose
# reads the rendered .env one line per key, so a value carrying a newline
# truncates the credential silently rather than failing. The shapes themselves
# are pinned once, in filter_plugins/vault_credential_schema.py, and are
# deliberately not restated here -- a second, stricter copy of the database
# identifier rule would refuse a vault the contract accepts, and the failure
# would name Nextcloud rather than the rule it disagreed with.
- name: Require env-safe Nextcloud credentials
  ansible.builtin.assert:
    that:
      - vault_nextcloud_admin_username is match('^[^\r\n]+\Z')
      - vault_nextcloud_admin_password is match('^[^\r\n]+\Z')
      - vault_nextcloud_db_name is match('^[^\r\n]+\Z')
      - vault_nextcloud_db_username is match('^[^\r\n]+\Z')
      - vault_nextcloud_db_password is match('^[^\r\n]+\Z')
      - vault_nextcloud_cache_password is match('^[^\r\n]+\Z')
    fail_msg: >-
      Every Nextcloud credential must be a single-line value. Compose reads the
      rendered .env one key per line, so a newline truncates the value in
      silence -- a cut database password produces a server that cannot reach its
      own database and a cut administrator password produces an account nobody
      can log into.
  no_log: true

# A trusted domain list that cannot do its job is refused before anything is
# deployed, because the symptom otherwise is HTTP 400 on every request and it
# reads as a client problem. 127.0.0.1 is the address verify.yml polls and
# localhost is what the application container's own health check requests, so an
# instance missing either reports itself broken for reasons that have nothing to
# do with the cause.
- name: Require a usable Nextcloud trusted domain set
  ansible.builtin.assert:
    that:
      - nextcloud_trusted_domains | length > 0
      - "'127.0.0.1' in nextcloud_trusted_domains"
      - "'localhost' in nextcloud_trusted_domains"
      - nextcloud_trusted_domains | select('search', '[\\s:/]') | list | length == 0
    fail_msg: >-
      nextcloud_trusted_domains must be a non-empty list of bare hostnames
      including 127.0.0.1 and localhost. Nextcloud compares each entry against
      the request's Host header alone -- no port, no scheme, no path -- and
      answers HTTP 400 for anything absent, which reads as a client problem
      rather than as configuration. 127.0.0.1 is what this role's verification
      polls; localhost is what the container's own health check requests.

# Redacted: this is where five vault credentials enter the target filesystem.
- name: Render the private Nextcloud environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ platform_runtime_dir }}/services/nextcloud/.env"
    mode: "0600"
  no_log: true

# The switched-off branch. Mirrors roles/seafile and roles/downloaders: the
# project is removed rather than merely left alone, so flipping the flag back off
# is a converge that actually undoes the deployment instead of leaving four
# containers running that nothing in the repository claims. remove_orphans
# reaches the ones a previous revision of the Compose file declared and this one
# no longer does.
- name: Stop the disabled Nextcloud project
  community.docker.docker_compose_v2:
    project_src: "{{ platform_current_dir }}/services/nextcloud"
    project_name: "{{ nextcloud_compose_project_name }}"
    files: "{{ platform_service_compose_files['nextcloud'] }}"
    env_files: ["{{ platform_runtime_dir }}/services/nextcloud/.env"]
    state: absent
    remove_orphans: true
  register: nextcloud_teardown
  when: not nextcloud_deployment_enabled | bool

- name: Report the disabled Nextcloud deployment
  ansible.builtin.debug:
    msg: >-
      nextcloud_deployment_enabled is false, so the Nextcloud Compose project
      {{ nextcloud_compose_project_name }} is torn down rather than converged and
      nothing on {{ nextcloud_data_host_path }} or
      {{ nextcloud_postgres_host_path }} is read or written. Set
      nextcloud_deployment_enabled to true in inventory/group_vars/all/main.yml
      and merge; the auto-deploy poller brings the stack up on its next
      five-minute tick.
  when: not nextcloud_deployment_enabled | bool

# Two phases, because the application's installer runs against a database that
# has to be accepting connections before its container starts. Postgres and the
# cache both reach their health checks quickly and neither performs an in-place
# migration, so this wait is the short one.
- name: Deploy the Nextcloud data services
  community.docker.docker_compose_v2:
    project_src: "{{ platform_current_dir }}/services/nextcloud"
    project_name: "{{ nextcloud_compose_project_name }}"
    files: "{{ platform_service_compose_files['nextcloud'] }}"
    env_files: ["{{ platform_runtime_dir }}/services/nextcloud/.env"]
    services: [db, cache]
    state: present
    wait: true
    wait_timeout: "{{ nextcloud_data_compose_wait_timeout }}"
  register: nextcloud_data_deploy
  when: nextcloud_deployment_enabled | bool

# The application and its cron sidecar. No rescue here, and that is a deliberate
# difference from roles/seafile rather than an omission.
#
# Seafile's rescue exists for a specific upstream defect: enterpoint.sh launches
# start.py in the background and then idles for ever, so a setup that raised or
# stalled leaves a container that runs and never serves, which no restart policy
# can see. Nextcloud's entrypoint is not that shape -- it runs the install and
# the upgrade in the foreground and then execs apache2-foreground, so a failure
# during either ends PID 1 and the container exits. An exited container is
# something `restart: unless-stopped` acts on and something Compose reports, so
# the failure mode that needed a recovery there reports itself here.
#
# If that turns out to be wrong in practice, roles/seafile/tasks/deploy.yml and
# recover_wedged_boot.yml are the pattern to copy, and #500 records that the
# structure is reusable.
- name: Deploy Nextcloud
  community.docker.docker_compose_v2:
    project_src: "{{ platform_current_dir }}/services/nextcloud"
    project_name: "{{ nextcloud_compose_project_name }}"
    files: "{{ platform_service_compose_files['nextcloud'] }}"
    env_files: ["{{ platform_runtime_dir }}/services/nextcloud/.env"]
    state: present
    wait: true
    wait_timeout: "{{ nextcloud_compose_wait_timeout }}"
  register: nextcloud_deploy
  when: nextcloud_deployment_enabled | bool

- name: Verify Nextcloud effective container CPU policy
  ansible.builtin.include_role:
    name: container_cpu
  vars:
    container_cpu_service_name: nextcloud
    container_cpu_project_name: "{{ nextcloud_compose_project_name }}"
  when: nextcloud_deployment_enabled | bool
