---
argument_specs:
  main:
    short_description: Deploy Pinchflat and verify its authenticated YouTube writer
    options:
      platform_compose_kind:
        type: str
        required: true
      platform_project_name:
        type: str
        required: false
      pinchflat_port:
        type: int
        required: false
      pinchflat_config_host_path:
        type: path
        required: false
      pinchflat_downloads_host_path:
        type: path
        required: false
      vault_pinchflat_admin_username:
        type: str
        required: true
      vault_pinchflat_admin_password:
        type: str
        required: true
