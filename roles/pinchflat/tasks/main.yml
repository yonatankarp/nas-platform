---
- name: Revalidate deployment paths before Pinchflat runtime use
  ansible.builtin.include_role:
    name: deployment_bundle
    tasks_from: target
  vars:
    deployment_target_service: pinchflat
    deployment_target_require_current_release: true
    deployment_target_extra_paths:
      - "{{ pinchflat_config_host_path }}"
      - "{{ pinchflat_ytdlp_host_path | dirname }}"

# Redacted: the conditions name the two halves of the Pinchflat basic-auth
# identity. Compose reads the rendered .env line by line, so a value carrying a
# newline would silently truncate the credential rather than fail.
- name: Require env-safe Pinchflat administrator credentials
  ansible.builtin.assert:
    that:
      - vault_pinchflat_admin_username is match('^[^\r\n]+$')
      - vault_pinchflat_admin_password is match('^[^\r\n]+$')
    fail_msg: Pinchflat administrator credentials must be nonempty single-line values.
  no_log: true

# Redacted: this is where the basic-auth identity enters the target filesystem.
- name: Render the private Pinchflat environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ platform_runtime_dir }}/services/pinchflat/.env"
    mode: "0600"
  no_log: true

# The extractor is deployed as a checksummed artifact because the image's own
# copy is frozen behind YouTube: v2025.6.6 ships yt-dlp 2025.05.22, which reads a
# current playlist page as zero entries, and Pinchflat refuses a source it cannot
# resolve. get_url compares the checksum against the file already on disk, so an
# unchanged version is a no-op that reports so, and a tampered or truncated
# download fails here rather than silently becoming the thing that resolves every
# source.
#
# This must precede the Compose deployment. The Compose file bind-mounts this
# path over /usr/local/bin/yt-dlp, and Docker materialises a *directory* for a
# bind source that does not exist, which the container then cannot exec.
#
# github.com is a third party that can be briefly unreachable, so the fetch
# retries under the platform download policy rather than failing the converge on
# one blip -- see #330, where the paperless equivalent did exactly that. The
# checksum above is what makes a retry safe to repeat.
- name: Deploy the declared yt-dlp build for Pinchflat
  ansible.builtin.get_url:
    url: >-
      https://github.com/yt-dlp/yt-dlp/releases/download/{{
        pinchflat_ytdlp_version }}/yt-dlp
    dest: "{{ pinchflat_ytdlp_host_path }}"
    checksum: "sha256:{{ pinchflat_ytdlp_sha256 }}"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    timeout: "{{ platform_download_timeout }}"
  register: pinchflat_ytdlp_download
  until: pinchflat_ytdlp_download is not failed
  retries: "{{ platform_download_retries }}"
  delay: "{{ platform_download_delay }}"

# The block exists for one thing the rescue does with the failure: it hands the
# deployment's own message to roles/container_health, which either explains it in
# terms of the container state Docker reports or re-raises it unchanged.
# Compose's `--wait` fails a crash-looping container with "container ... is
# unhealthy", which says nothing about why. roles/bindery/tasks/main.yml carries
# the long form of this argument; #509 built the mechanism and #537 wired the
# remaining eleven single-`up` roles into it.
- name: Deploy Pinchflat, catching a container that runs but never serves
  block:
    - name: Deploy Pinchflat
      community.docker.docker_compose_v2:
        project_src: "{{ platform_current_dir }}/services/pinchflat"
        project_name: "{{ pinchflat_compose_project_name }}"
        files: "{{ platform_service_compose_files['pinchflat'] }}"
        env_files: ["{{ platform_runtime_dir }}/services/pinchflat/.env"]
        state: present
        wait: true
        wait_timeout: "{{ platform_compose_wait_timeout }}"
      register: pinchflat_deploy
  rescue:
    # First, and before anything else can rebind it: ansible_failed_result
    # belongs to whichever rescue is running.
    - name: Record the failed Pinchflat deployment
      ansible.builtin.set_fact:
        pinchflat_deploy_failure_message: >-
          {{ ansible_failed_result.msg
             | default('the Pinchflat deployment failed and reported no message') }}

# Immediately after the deployment and before everything that trusts it. A
# container in `Restarting` still appears in `docker container ls --quiet`, so
# the CPU verification below would sail straight past one and the readiness probe
# after it would fail on a timeout that names nothing (#510).
#
# This pass detects, prints the evidence and publishes
# container_health_stuck_services WITHOUT refusing, because the recreate below
# has to happen before the verdict. It still re-raises a deployment failure that
# no stuck container explains.
- name: Detect a Pinchflat container that runs but never serves
  ansible.builtin.include_role:
    name: container_health
  vars:
    container_health_service_name: pinchflat
    container_health_project_name: "{{ pinchflat_compose_project_name }}"
    container_health_deploy_failure_message: >-
      {{ pinchflat_deploy_failure_message | default('') }}
    container_health_refuse: false

# EXACTLY ONE force-recreate, of only the services Docker says are stuck.
# FORCED, because `up -d` against an unchanged specification keeps the same
# container and recreates nothing; `dependencies: false` renders as --no-deps, so
# a healthy sibling in the same project is not taken down to repair one container.
# CONDITIONAL, and that condition is the whole idempotence argument: the list is
# empty on a converged host and empty under --check, so this task is skipped on
# every run that has nothing to repair. BOUNDED AT ONE PER RUN by being a single
# task rather than a loop, with the verdict below re-checking, so a container
# looping for a reason a recreate cannot fix never goes green and never becomes
# an invisible retry loop.
- name: Recreate a Pinchflat container that runs but never serves
  block:
    - name: Force-recreate the stuck Pinchflat services
      community.docker.docker_compose_v2:
        project_src: "{{ platform_current_dir }}/services/pinchflat"
        project_name: "{{ pinchflat_compose_project_name }}"
        files: "{{ platform_service_compose_files['pinchflat'] }}"
        env_files: ["{{ platform_runtime_dir }}/services/pinchflat/.env"]
        services: "{{ container_health_stuck_services }}"
        dependencies: false
        recreate: always
        state: present
        wait: true
        wait_timeout: "{{ platform_compose_wait_timeout }}"
      when: container_health_stuck_services | default([]) | length > 0
      register: pinchflat_wedged_recreate
  rescue:
    # Carried rather than re-raised here. `--wait` fails a container that came
    # back unhealthy, which the re-check below diagnoses far better than Compose
    # can; a recreate that failed for any OTHER reason left no stuck container
    # behind, and the second pass re-raises this message unchanged for that case.
    - name: Record the Pinchflat recreate that did not recover the service
      ansible.builtin.set_fact:
        pinchflat_recreate_failure_message: >-
          The force-recreate reported: {{ ansible_failed_result.msg
          | default('no message') }}

# Whether a recreate was actually spent, recorded before the second pass
# overwrites the list it was decided from.
- name: Record whether a Pinchflat recreate was spent
  ansible.builtin.set_fact:
    pinchflat_recreate_spent: >-
      {{ container_health_stuck_services | default([]) | length > 0 }}

- name: Report the Pinchflat wedged-container recovery check mode defers
  ansible.builtin.debug:
    msg: >-
      A live run would read every container of Compose project
      {{ pinchflat_compose_project_name }} that Docker reports as restarting or
      unhealthy, print its state, force-recreate exactly those services once
      with no dependencies, and fail naming that retry if any of them came back
      stuck. Compose's dry run starts nothing and does not wait on container
      health, so check mode cannot reach that path and recreates nothing.
  when: ansible_check_mode

# The verdict. Nothing stuck here means the recreate worked, or that there was
# never anything to repair; either way the run continues. Anything still stuck
# fails, and says the retry has already been spent.
- name: Refuse a Pinchflat container that stayed wedged after its recreate
  ansible.builtin.include_role:
    name: container_health
  vars:
    container_health_service_name: pinchflat
    container_health_project_name: "{{ pinchflat_compose_project_name }}"
    container_health_deploy_failure_message: >-
      {{ pinchflat_recreate_failure_message | default('') }}
    container_health_retried: "{{ pinchflat_recreate_spent }}"

- name: Report the Pinchflat deployment
  ansible.builtin.include_role:
    name: ntfy
    tasks_from: deployment_report
  vars:
    ntfy_deployment_report_service: Pinchflat
    # Both Compose results, because a force-recreate that repaired a wedged
    # container changed the deployment as surely as the deploy above did, and a
    # report gated on the deploy alone would say nothing on the one converge an
    # operator most wants to hear about. It is registered even when skipped, and
    # `default({})` covers the paths that never reach it at all.
    ntfy_deployment_report_changed: >-
      {{ (pinchflat_deploy is changed)
         or ((pinchflat_wedged_recreate | default({})) is changed) }}

- name: Verify Pinchflat effective container CPU policy
  ansible.builtin.include_role:
    name: container_cpu
  vars:
    container_cpu_service_name: pinchflat
    container_cpu_project_name: "{{ pinchflat_compose_project_name }}"

# /healthcheck is the one route Pinchflat leaves outside its basic-auth
# pipelines, so readiness can be polled without presenting the credential.
- name: Wait for Pinchflat application health
  ansible.builtin.uri:
    url: "{{ pinchflat_api }}/healthcheck"
    method: GET
    status_code: [200]
    return_content: true
  register: pinchflat_health
  until:
    - pinchflat_health.json | default(none) is mapping
    - pinchflat_health.json.status | default(none) == 'ok'
  retries: "{{ platform_readiness_retries }}"
  delay: "{{ platform_readiness_delay }}"
  changed_when: false
  check_mode: false

- name: Verify the Pinchflat health endpoint
  tags: [platform_verify_pinchflat]
  ansible.builtin.uri:
    url: "{{ pinchflat_api }}/healthcheck"
    method: GET
    status_code: [200]
    return_content: true
  register: pinchflat_verify_health
  changed_when: false
  check_mode: false

# The web interface is the writer: it queues downloads into the YouTube library
# and can delete from it. These two reads prove the vault-authored identity is
# the one Pinchflat accepts, and that it refuses a request without it. Both
# accept any status so the assertion below is what fails, naming which outcome
# differed: a probe that died on the HTTP code would report the failure from a
# redacted task and say nothing.
# Redacted: the credential is the request.
- name: Verify the Pinchflat interface accepts the vault administrator
  tags: [platform_verify_pinchflat]
  ansible.builtin.uri:
    url: "{{ pinchflat_api }}/"
    method: GET
    url_username: "{{ vault_pinchflat_admin_username }}"
    url_password: "{{ vault_pinchflat_admin_password }}"
    force_basic_auth: true
    status_code: "{{ range(100, 600) | list }}"
  register: pinchflat_verify_authenticated
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

- name: Verify the Pinchflat interface refuses an anonymous request
  tags: [platform_verify_pinchflat]
  ansible.builtin.uri:
    url: "{{ pinchflat_api }}/"
    method: GET
    status_code: "{{ range(100, 600) | list }}"
  register: pinchflat_verify_anonymous
  failed_when: false
  changed_when: false
  check_mode: false

- name: Require the exact Pinchflat verification results
  tags: [platform_verify_pinchflat]
  ansible.builtin.assert:
    that:
      - pinchflat_verify_health.json.status == 'ok'
      - pinchflat_verify_authenticated.status | default(0) | int == 200
      - pinchflat_verify_anonymous.status | default(0) | int == 401
    fail_msg: >-
      Pinchflat is unhealthy, or its web interface no longer accepts exactly the
      vault-authored administrator and refuses everyone else.

# The mount is the only reason the deployed extractor differs from the image's,
# so it is the thing worth verifying. A future image that ships yt-dlp
# differently -- a PyInstaller binary, or a module earlier on $PATH -- would
# leave this mount in place and quietly keep using its own frozen copy, and the
# only symptom would be sources failing to resolve again, which is exactly the
# fault this indirection exists to prevent.
#
# Read-only and check-mode-safe: under --check no stack was started, so there is
# no container to ask and the run reports the intent instead.
- name: Verify the yt-dlp build Pinchflat runs
  tags: [platform_verify_pinchflat]
  when: not ansible_check_mode
  block:
    - name: List the running Pinchflat container
      ansible.builtin.command:
        argv:
          - docker
          - container
          - ls
          - --quiet
          - --filter
          - "label=com.docker.compose.project={{ pinchflat_compose_project_name }}"
          - --filter
          - label=com.docker.compose.service=pinchflat
      register: pinchflat_verify_container
      changed_when: false
      check_mode: false

    - name: Read the yt-dlp build inside the Pinchflat container
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ pinchflat_verify_container.stdout_lines | first }}"
          - yt-dlp
          - --version
      register: pinchflat_verify_ytdlp
      changed_when: false
      check_mode: false

    - name: Require the declared yt-dlp build
      ansible.builtin.assert:
        that:
          - pinchflat_verify_container.stdout_lines | length == 1
          - pinchflat_verify_ytdlp.stdout | trim == pinchflat_ytdlp_version
        fail_msg: >-
          Pinchflat is not running the declared yt-dlp
          {{ pinchflat_ytdlp_version }}; it reports
          {{ pinchflat_verify_ytdlp.stdout | default('nothing') | trim }}. The
          bind mount over /usr/local/bin/yt-dlp is not in effect, so source
          resolution is running on whatever the image shipped.

- name: Report the yt-dlp verification check mode defers
  tags: [platform_verify_pinchflat]
  ansible.builtin.debug:
    msg: >-
      A live run would assert that the Pinchflat container executes yt-dlp
      {{ pinchflat_ytdlp_version }}. The mount belongs to a container this run
      did not start, so check mode reports the intent instead.
  when: ansible_check_mode
