---
- name: Revalidate deployment paths before Pinchflat runtime use
  ansible.builtin.include_role:
    name: deployment_bundle
    tasks_from: target
  vars:
    deployment_target_service: pinchflat
    deployment_target_require_current_release: true
    deployment_target_extra_paths:
      - "{{ pinchflat_config_host_path }}"
      - "{{ pinchflat_ytdlp_host_path | dirname }}"

# Redacted. A newline in a value would silently truncate the credential in .env.
- name: Require env-safe Pinchflat administrator credentials
  ansible.builtin.assert:
    that:
      - vault_pinchflat_admin_username is match('^[^\r\n]+$')
      - vault_pinchflat_admin_password is match('^[^\r\n]+$')
    fail_msg: Pinchflat administrator credentials must be nonempty single-line values.
  no_log: true

# Redacted: the basic-auth identity enters the target filesystem here.
- name: Render the private Pinchflat environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ platform_runtime_dir }}/services/pinchflat/.env"
    mode: "0600"
  no_log: true

# The image's bundled yt-dlp is stale, so a checksummed build is mounted over it. Must
# precede Compose: Docker creates a directory for a missing bind source. Retries (#330).
- name: Deploy the declared yt-dlp build for Pinchflat
  ansible.builtin.get_url:
    url: >-
      https://github.com/yt-dlp/yt-dlp/releases/download/{{
        pinchflat_ytdlp_version }}/yt-dlp
    dest: "{{ pinchflat_ytdlp_host_path }}"
    checksum: "sha256:{{ pinchflat_ytdlp_sha256 }}"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
    timeout: "{{ platform_download_timeout }}"
  register: pinchflat_ytdlp_download
  until: pinchflat_ytdlp_download is not failed
  retries: "{{ platform_download_retries }}"
  delay: "{{ platform_download_delay }}"

# The rescue hands the failure to roles/container_health, which explains it from
# Docker's state or re-raises it unchanged (#509, #537).
- name: Deploy Pinchflat, catching a container that runs but never serves
  block:
    - name: Deploy Pinchflat
      community.docker.docker_compose_v2:
        project_src: "{{ platform_current_dir }}/services/pinchflat"
        project_name: "{{ pinchflat_compose_project_name }}"
        files: "{{ platform_service_compose_files['pinchflat'] }}"
        env_files: ["{{ platform_runtime_dir }}/services/pinchflat/.env"]
        state: present
        wait: true
        wait_timeout: "{{ platform_compose_wait_timeout }}"
      register: pinchflat_deploy
  rescue:
    # First, before anything else rebinds ansible_failed_result.
    - name: Record the failed Pinchflat deployment
      ansible.builtin.set_fact:
        pinchflat_deploy_failure_message: >-
          {{ ansible_failed_result.msg
             | default('the Pinchflat deployment failed and reported no message') }}

# Right after deploy: a `Restarting` container would pass later checks (#510). The
# sequence lives in roles/container_health/tasks/recover.yml (#646).
- name: Recover Pinchflat from a container that runs but never serves
  ansible.builtin.include_role:
    name: container_health
    tasks_from: recover
  vars:
    container_health_service_name: pinchflat
    container_health_project_name: "{{ pinchflat_compose_project_name }}"
    container_health_compose_dir: "{{ platform_current_dir }}/services/pinchflat"
    container_health_compose_files: "{{ platform_service_compose_files['pinchflat'] }}"
    container_health_env_files: ["{{ platform_runtime_dir }}/services/pinchflat/.env"]
    container_health_deploy_failure_message: >-
      {{ pinchflat_deploy_failure_message | default('') }}

- name: Report the Pinchflat deployment
  ansible.builtin.include_role:
    name: deployment_bundle
    tasks_from: report
  vars:
    deployment_report_service: Pinchflat
    # Both Compose results: a recreate that repaired a wedged container is a change too.
    deployment_report_changed: >-
      {{ (pinchflat_deploy is changed)
         or ((container_health_wedged_recreate | default({})) is changed) }}

- name: Verify Pinchflat effective container CPU policy
  ansible.builtin.include_role:
    name: container_cpu
  vars:
    container_cpu_service_name: pinchflat
    container_cpu_project_name: "{{ pinchflat_compose_project_name }}"

# /healthcheck is the one route outside basic auth.
- name: Wait for Pinchflat application health
  ansible.builtin.uri:
    url: "{{ pinchflat_api }}/healthcheck"
    method: GET
    status_code: [200]
    return_content: true
  register: pinchflat_health
  until:
    - pinchflat_health.json | default(none) is mapping
    - pinchflat_health.json.status | default(none) == 'ok'
  retries: "{{ platform_readiness_retries }}"
  delay: "{{ platform_readiness_delay }}"
  changed_when: false
  check_mode: false

- name: Verify the Pinchflat health endpoint
  tags: [platform_verify_pinchflat]
  ansible.builtin.uri:
    url: "{{ pinchflat_api }}/healthcheck"
    method: GET
    status_code: [200]
    return_content: true
  register: pinchflat_verify_health
  changed_when: false
  check_mode: false

# Proves the vault identity is accepted and a request without it refused. Any status is
# accepted so the assertion names the outcome. Redacted: the credential is the request.
- name: Verify the Pinchflat interface accepts the vault administrator
  tags: [platform_verify_pinchflat]
  ansible.builtin.uri:
    url: "{{ pinchflat_api }}/"
    method: GET
    url_username: "{{ vault_pinchflat_admin_username }}"
    url_password: "{{ vault_pinchflat_admin_password }}"
    force_basic_auth: true
    status_code: "{{ range(100, 600) | list }}"
  register: pinchflat_verify_authenticated
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

- name: Verify the Pinchflat interface refuses an anonymous request
  tags: [platform_verify_pinchflat]
  ansible.builtin.uri:
    url: "{{ pinchflat_api }}/"
    method: GET
    status_code: "{{ range(100, 600) | list }}"
  register: pinchflat_verify_anonymous
  failed_when: false
  changed_when: false
  check_mode: false

- name: Require the exact Pinchflat verification results
  tags: [platform_verify_pinchflat]
  ansible.builtin.assert:
    that:
      - pinchflat_verify_health.json.status == 'ok'
      - pinchflat_verify_authenticated.status | default(0) | int == 200
      - pinchflat_verify_anonymous.status | default(0) | int == 401
    fail_msg: >-
      Pinchflat is unhealthy, or its web interface no longer accepts exactly the
      vault-authored administrator and refuses everyone else.

# Proves the mounted build is the one running: an image shipping yt-dlp differently would
# silently keep its stale copy. Under --check there is no container, so it reports intent.
- name: Verify the yt-dlp build Pinchflat runs
  tags: [platform_verify_pinchflat]
  when: not ansible_check_mode
  block:
    - name: List the running Pinchflat container
      ansible.builtin.command:
        argv:
          - docker
          - container
          - ls
          - --quiet
          - --filter
          - "label=com.docker.compose.project={{ pinchflat_compose_project_name }}"
          - --filter
          - label=com.docker.compose.service=pinchflat
      register: pinchflat_verify_container
      changed_when: false
      check_mode: false

    - name: Read the yt-dlp build inside the Pinchflat container
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ pinchflat_verify_container.stdout_lines | first }}"
          - yt-dlp
          - --version
      register: pinchflat_verify_ytdlp
      changed_when: false
      check_mode: false

    - name: Require the declared yt-dlp build
      ansible.builtin.assert:
        that:
          - pinchflat_verify_container.stdout_lines | length == 1
          - pinchflat_verify_ytdlp.stdout | trim == pinchflat_ytdlp_version
        fail_msg: >-
          Pinchflat is not running the declared yt-dlp
          {{ pinchflat_ytdlp_version }}; it reports
          {{ pinchflat_verify_ytdlp.stdout | default('nothing') | trim }}. The
          bind mount over /usr/local/bin/yt-dlp is not in effect, so source
          resolution is running on whatever the image shipped.

- name: Report the yt-dlp verification check mode defers
  tags: [platform_verify_pinchflat]
  ansible.builtin.debug:
    msg: >-
      A live run would assert that the Pinchflat container executes yt-dlp
      {{ pinchflat_ytdlp_version }}. The mount belongs to a container this run
      did not start, so check mode reports the intent instead.
  when: ansible_check_mode
