---
argument_specs:
  main:
    short_description: Deploy Audiobookshelf and converge its server settings, administrator, and audiobook library
    options:
      platform_project_name:
        type: str
        required: false
      platform_media_control_network:
        type: str
        required: true
      audiobookshelf_port:
        type: int
        required: false
      audiobookshelf_owned_server_settings:
        type: dict
        required: false
        options:
          storeCoverWithItem:
            type: bool
            required: true
          storeMetadataWithItem:
            type: bool
            required: true
          sortingIgnorePrefix:
            type: bool
            required: true
          scannerParseSubtitle:
            type: bool
            required: true
          scannerFindCovers:
            type: bool
            required: true
          scannerCoverProvider:
            type: str
            required: true
            choices: [google]
          scannerPreferMatchedMetadata:
            type: bool
            required: true
          scannerDisableWatcher:
            type: bool
            required: true
          chromecastEnabled:
            type: bool
            required: true
          allowIframe:
            type: bool
            required: true
          homeBookshelfView:
            type: int
            required: true
            choices: [1]
          bookshelfView:
            type: int
            required: true
            choices: [1]
          dateFormat:
            type: str
            required: true
            choices: [dd/MM/yyyy]
          timeFormat:
            type: str
            required: true
            choices: ['HH:mm']
          language:
            type: str
            required: true
            choices: [en-us]
      audiobookshelf_backup_cron:
        type: str
        required: false
        choices: ['0 3 * * *']
      audiobookshelf_backup_retention:
        type: int
        required: false
        choices: [7]
      audiobookshelf_backup_container_path:
        type: str
        required: false
        choices: [/metadata/backups]
      audiobookshelf_library_name:
        type: str
        required: false
      audiobookshelf_library_folders:
        type: list
        elements: dict
        required: false
        options:
          path:
            type: str
            required: true
      audiobookshelf_library_media_type:
        type: str
        required: false
        choices: [book]
      audiobookshelf_library_provider:
        type: str
        required: false
      audiobookshelf_library_icon:
        type: str
        required: false
      audiobookshelf_initial_scan_retries:
        type: int
        required: false
      audiobookshelf_initial_scan_delay:
        type: int
        required: false
      audiobookshelf_library_settings:
        type: dict
        required: false
      vault_audiobookshelf_admin_username:
        type: str
        required: true
      vault_audiobookshelf_admin_password:
        type: str
        required: true
      # The managed-user parameters this role hands roles/managed_users. Only
      # the ones that resolve at role entry are declared: Ansible templates
      # every declared option before the role's first task, so declaring
      # audiobookshelf_managed_users_create_body, _repair_body,
      # _repair_condition, _reconcile_path, _authenticate_body,
      # _authenticate_identity or _list_json -- each a template over the shared
      # role's per-identity `item`, its bound match or user, or the listing it
      # registers -- would fail this role at "Validating arguments against arg
      # spec 'main'". roles/managed_users asserts their presence instead.
      audiobookshelf_managed_users_identity_attribute:
        type: str
        required: false
      audiobookshelf_managed_users_id_attribute:
        type: str
        required: false
      audiobookshelf_managed_users_list_path:
        type: str
        required: false
      audiobookshelf_managed_users_authenticate_path:
        type: str
        required: false
      audiobookshelf_managed_users_create_path:
        type: str
        required: false
      audiobookshelf_managed_users_reconcile_interface:
        description: >-
          The interfaces.reconcile value config/managed-user-capabilities.yml
          declares for Audiobookshelf, asserted against the deployed register.
        type: str
        required: false
      audiobookshelf_managed_users_create_status:
        type: list
        elements: int
        required: false
      audiobookshelf_managed_users_repair_status:
        type: list
        elements: int
        required: false
      audiobookshelf_managed_users_authenticate_identity_normalized:
        type: bool
        required: false
      audiobookshelf_managed_users_listing_conditions:
        description: >-
          Brace-free pagination refusals the shared role asserts in order
          against both listings. Unbraced, so they are safe to declare here.
        type: list
        elements: str
        required: false
      audiobookshelf_managed_users_verify_conditions:
        description: >-
          Brace-free expressions the shared role's final verification asserts in
          order. Unbraced, so they are safe to declare here.
        type: list
        elements: str
        required: false
      audiobookshelf_managed_users_verify_fail_msg:
        type: str
        required: false
      audiobookshelf_managed_users_plan_create_message:
        type: str
        required: false
      audiobookshelf_managed_users_plan_repair_message:
        type: str
        required: false
      vault_managed_audiobookshelf_users:
        description: The exact declared Audiobookshelf managed-user set.
        type: list
        elements: dict
        required: true
