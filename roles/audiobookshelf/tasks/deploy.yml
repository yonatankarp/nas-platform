---
- name: Resolve the effective Audiobookshelf backup directory
  ansible.builtin.set_fact:
    audiobookshelf_effective_config_host_path: "{{ nas_docker_root }}/audiobookshelf/config"
    audiobookshelf_effective_backup_host_path: "{{ nas_docker_root }}/audiobookshelf/backups"

- name: Require bounded Audiobookshelf initial scan timing
  ansible.builtin.assert:
    that:
      - audiobookshelf_initial_scan_retries | type_debug == 'int'
      - audiobookshelf_initial_scan_retries | int >= 1
      - audiobookshelf_initial_scan_delay | type_debug == 'int'
      - audiobookshelf_initial_scan_delay | int >= 0
    fail_msg: Audiobookshelf initial scan retries and delay must be bounded non-negative integers.

- name: Revalidate deployment paths before Audiobookshelf runtime use
  ansible.builtin.include_role:
    name: deployment_bundle
    tasks_from: target
  vars:
    deployment_target_service: audiobookshelf
    deployment_target_require_current_release: true
    deployment_target_extra_paths:
      - "{{ audiobookshelf_effective_config_host_path }}"
      - "{{ audiobookshelf_effective_backup_host_path }}"
      # roles/managed_users reads the capability register off the deployed release.
      - "{{ platform_current_dir }}/config/managed-user-capabilities.yml"

- name: Render the Audiobookshelf environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ platform_runtime_dir }}/services/audiobookshelf/.env"
    mode: "0600"

# The rescue hands the failure to roles/container_health, which explains a
# crash-looping container Compose reports only as "unhealthy" (#509, #537).
- name: Deploy Audiobookshelf, catching a container that runs but never serves
  block:
    - name: Deploy Audiobookshelf
      community.docker.docker_compose_v2:
        project_src: "{{ platform_current_dir }}/services/audiobookshelf"
        project_name: "{{ audiobookshelf_compose_project_name }}"
        files: "{{ platform_service_compose_files['audiobookshelf'] }}"
        env_files: ["{{ platform_runtime_dir }}/services/audiobookshelf/.env"]
        state: present
        wait: true
        wait_timeout: "{{ platform_compose_wait_timeout }}"
      register: audiobookshelf_deploy
  rescue:
    # First: ansible_failed_result belongs to whichever rescue is running.
    - name: Record the failed Audiobookshelf deployment
      ansible.builtin.set_fact:
        audiobookshelf_deploy_failure_message: >-
          {{ ansible_failed_result.msg
             | default('the Audiobookshelf deployment failed and reported no message') }}

# A `Restarting` container still passes `docker container ls` (#510). This pass
# only detects and publishes the stuck list; the verdict follows the recreate.
- name: Detect an Audiobookshelf container that runs but never serves
  ansible.builtin.include_role:
    name: container_health
  vars:
    container_health_service_name: audiobookshelf
    container_health_project_name: "{{ audiobookshelf_compose_project_name }}"
    container_health_deploy_failure_message: >-
      {{ audiobookshelf_deploy_failure_message | default('') }}
    container_health_refuse: false

# At most one forced recreate per run, of only the stuck services, without
# deps. The list is empty on a converged host and under --check, which keeps
# this idempotent; the verdict below re-checks.
- name: Recreate an Audiobookshelf container that runs but never serves
  block:
    - name: Force-recreate the stuck Audiobookshelf services
      community.docker.docker_compose_v2:
        project_src: "{{ platform_current_dir }}/services/audiobookshelf"
        project_name: "{{ audiobookshelf_compose_project_name }}"
        files: "{{ platform_service_compose_files['audiobookshelf'] }}"
        env_files: ["{{ platform_runtime_dir }}/services/audiobookshelf/.env"]
        services: "{{ container_health_stuck_services }}"
        dependencies: false
        recreate: always
        state: present
        wait: true
        wait_timeout: "{{ platform_compose_wait_timeout }}"
      when: container_health_stuck_services | default([]) | length > 0
      register: audiobookshelf_wedged_recreate
  rescue:
    # Carried, not re-raised: the re-check below diagnoses an unhealthy container
    # better, and the second pass re-raises any other failure.
    - name: Record the Audiobookshelf recreate that did not recover the service
      ansible.builtin.set_fact:
        audiobookshelf_recreate_failure_message: >-
          The force-recreate reported: {{ ansible_failed_result.msg
          | default('no message') }}

- name: Record whether an Audiobookshelf recreate was spent
  ansible.builtin.set_fact:
    audiobookshelf_recreate_spent: >-
      {{ container_health_stuck_services | default([]) | length > 0 }}

- name: Report the Audiobookshelf wedged-container recovery check mode defers
  ansible.builtin.debug:
    msg: >-
      A live run would read every container of Compose project
      {{ audiobookshelf_compose_project_name }} that Docker reports as restarting or
      unhealthy, print its state, force-recreate exactly those services once
      with no dependencies, and fail naming that retry if any of them came back
      stuck. Compose's dry run starts nothing and does not wait on container
      health, so check mode cannot reach that path and recreates nothing.
  when: ansible_check_mode

- name: Refuse an Audiobookshelf container that stayed wedged after its recreate
  ansible.builtin.include_role:
    name: container_health
  vars:
    container_health_service_name: audiobookshelf
    container_health_project_name: "{{ audiobookshelf_compose_project_name }}"
    container_health_deploy_failure_message: >-
      {{ audiobookshelf_recreate_failure_message | default('') }}
    container_health_retried: "{{ audiobookshelf_recreate_spent }}"

- name: Report the Audiobookshelf deployment
  ansible.builtin.include_role:
    name: deployment_bundle
    tasks_from: report
  vars:
    deployment_report_service: Audiobookshelf
    # Both Compose results: a repairing force-recreate changed the deployment too.
    deployment_report_changed: >-
      {{ (audiobookshelf_deploy is changed)
         or ((audiobookshelf_wedged_recreate | default({})) is changed) }}

- name: Verify Audiobookshelf effective container CPU policy
  ansible.builtin.include_role:
    name: container_cpu
  vars:
    container_cpu_service_name: audiobookshelf
    container_cpu_project_name: "{{ audiobookshelf_compose_project_name }}"

- name: Wait for Audiobookshelf to report healthy
  ansible.builtin.uri:
    url: "{{ audiobookshelf_api }}/healthcheck"
  register: audiobookshelf_health
  until: audiobookshelf_health.status | default(0) == 200
  retries: "{{ platform_readiness_retries }}"
  delay: "{{ platform_readiness_delay }}"
  changed_when: false
  check_mode: false
