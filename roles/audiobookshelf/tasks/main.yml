---
- name: Resolve the effective Audiobookshelf backup directory
  ansible.builtin.set_fact:
    audiobookshelf_effective_config_host_path: >-
      {{ (platform_adoption_root ~ '/legacy/audiobookshelf/config')
         if platform_adoption_enabled | default(false) | bool
         else (nas_docker_root ~ '/audiobookshelf/config') }}
    audiobookshelf_effective_backup_host_path: >-
      {{ (platform_adoption_root ~ '/legacy/audiobookshelf/backups')
         if platform_adoption_enabled | default(false) | bool
         else (nas_docker_root ~ '/audiobookshelf/backups') }}

- name: Require bounded Audiobookshelf initial scan timing
  ansible.builtin.assert:
    that:
      - audiobookshelf_initial_scan_retries | type_debug == 'int'
      - audiobookshelf_initial_scan_retries | int >= 1
      - audiobookshelf_initial_scan_delay | type_debug == 'int'
      - audiobookshelf_initial_scan_delay | int >= 0
    fail_msg: Audiobookshelf initial scan retries and delay must be bounded non-negative integers.

- name: Revalidate deployment paths before Audiobookshelf runtime use
  ansible.builtin.include_role:
    name: deployment_bundle
    tasks_from: target
  vars:
    deployment_target_require_current_release: true
    deployment_target_extra_paths:
      - "{{ platform_current_dir }}/services/audiobookshelf"
      - "{{ platform_current_dir }}/services/audiobookshelf/compose.yml"
      - "{{ platform_current_dir }}/services/audiobookshelf/compose.{{ platform_compose_kind }}.yml"
      - "{{ platform_current_dir }}/services/audiobookshelf/compose.adoption.yml"
      - "{{ platform_runtime_dir }}/services/audiobookshelf"
      - "{{ platform_runtime_dir }}/services/audiobookshelf/.env"
      - "{{ audiobookshelf_effective_config_host_path }}"
      - "{{ audiobookshelf_effective_backup_host_path }}"

- name: Check for an Audiobookshelf platform override
  ansible.builtin.stat:
    path: "{{ platform_current_dir }}/services/audiobookshelf/compose.{{ platform_compose_kind }}.yml"
  register: audiobookshelf_platform_compose

- name: Select the Audiobookshelf Compose definitions
  ansible.builtin.set_fact:
    audiobookshelf_compose_files: >-
      {{ ['compose.yml'] +
         (audiobookshelf_platform_compose.stat.exists
          | ternary(['compose.' ~ platform_compose_kind ~ '.yml'], [])) +
         ((platform_adoption_enabled | default(false) | bool)
          | ternary(['compose.adoption.yml'], [])) }}

- name: Render the Audiobookshelf environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ platform_runtime_dir }}/services/audiobookshelf/.env"
    mode: "0600"

- name: Deploy Audiobookshelf
  community.docker.docker_compose_v2:
    project_src: "{{ platform_current_dir }}/services/audiobookshelf"
    project_name: "{{ audiobookshelf_compose_project_name }}"
    files: "{{ audiobookshelf_compose_files }}"
    env_files: ["{{ platform_runtime_dir }}/services/audiobookshelf/.env"]
    state: present
    wait: true
    wait_timeout: 180

- name: Wait for Audiobookshelf to report healthy
  ansible.builtin.uri:
    url: "{{ audiobookshelf_api }}/healthcheck"
  register: audiobookshelf_health
  until: audiobookshelf_health.status | default(0) == 200
  retries: 20
  delay: 3
  changed_when: false
  check_mode: false

- name: Read Audiobookshelf initialization state
  ansible.builtin.uri:
    url: "{{ audiobookshelf_api }}/status"
    return_content: true
  register: audiobookshelf_status
  changed_when: false
  check_mode: false
  no_log: true

- name: Resolve Audiobookshelf initialization state
  ansible.builtin.set_fact:
    audiobookshelf_initialized: "{{ audiobookshelf_status.json.isInit | bool }}"
  no_log: true

- name: Report planned Audiobookshelf administrator creation
  ansible.builtin.debug:
    msg: AUDIOBOOKSHELF_PLAN_ADMIN_CREATE
  when:
    - ansible_check_mode
    - not audiobookshelf_initialized | bool
  changed_when: true

- name: Initialize the vault-named Audiobookshelf administrator
  ansible.builtin.uri:
    url: "{{ audiobookshelf_api }}/init"
    method: POST
    body_format: json
    body:
      newRoot:
        username: "{{ vault_audiobookshelf_admin_username }}"
        password: "{{ vault_audiobookshelf_admin_password }}"
    status_code: [200]
  when:
    - not ansible_check_mode
    - not audiobookshelf_initialized | bool
  changed_when: true
  no_log: true

- name: Authenticate the Audiobookshelf administrator for reconciliation
  ansible.builtin.uri:
    url: "{{ audiobookshelf_api }}/login"
    method: POST
    body_format: json
    body:
      username: "{{ vault_audiobookshelf_admin_username }}"
      password: "{{ vault_audiobookshelf_admin_password }}"
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: audiobookshelf_reconcile_login
  when: not ansible_check_mode or audiobookshelf_initialized | bool
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

- name: Resolve sanitized Audiobookshelf administrator authentication response
  ansible.builtin.set_fact:
    audiobookshelf_reconcile_login_status: "{{ audiobookshelf_reconcile_login.status | default(0) | int }}"
    audiobookshelf_reconcile_login_kind: >-
      {% set media_type = audiobookshelf_reconcile_login.content_type
         | default('') | lower | regex_replace(';.*$', '') | trim %}
      {{ 'json' if media_type == 'application/json' or media_type is match('^application/.+[+]json$')
         else 'text' if media_type is match('^text/')
         else 'binary' if media_type is match('^(audio/|application/octet-stream$)')
         else 'other' }}
  when: not ansible_check_mode or audiobookshelf_initialized | bool
  no_log: true

- name: Refuse unavailable Audiobookshelf administrator authentication
  ansible.builtin.assert:
    that:
      - audiobookshelf_reconcile_login_status | int != 401
    fail_msg: >-
      Managed Audiobookshelf administrator cannot authenticate. Pinned Audiobookshelf 2.36.0
      exposes no unauthenticated API path to reactivate an inactive root; verify vault credentials
      or reactivate it through an already-authorized root session, then rerun.
  when: not ansible_check_mode or audiobookshelf_initialized | bool

- name: Refuse unexpected Audiobookshelf administrator authentication responses
  ansible.builtin.assert:
    that:
      - audiobookshelf_reconcile_login_status | int == 200
    fail_msg: >-
      Audiobookshelf administrator authentication returned an unexpected sanitized response
      (status={{ audiobookshelf_reconcile_login_status | int }},
      content={{ audiobookshelf_reconcile_login_kind }}).
  when: not ansible_check_mode or audiobookshelf_initialized | bool

- name: Resolve the Audiobookshelf reconciliation bearer
  ansible.builtin.set_fact:
    audiobookshelf_reconcile_token: "{{ audiobookshelf_reconcile_login.json.user.accessToken }}"
  when: not ansible_check_mode or audiobookshelf_initialized | bool
  no_log: true

- name: Resolve desired Audiobookshelf server settings
  ansible.builtin.set_fact:
    audiobookshelf_desired_server_settings: >-
      {{ audiobookshelf_owned_server_settings |
         combine({
           'backupPath': audiobookshelf_backup_container_path,
           'backupSchedule': audiobookshelf_backup_cron,
           'backupsToKeep': audiobookshelf_backup_retention
         }) }}
  no_log: true

- name: Read Audiobookshelf server settings for reconciliation
  ansible.builtin.uri:
    url: "{{ audiobookshelf_api }}/api/authorize"
    method: POST
    headers:
      Authorization: "Bearer {{ audiobookshelf_reconcile_token }}"
    status_code: [200]
    return_content: true
  register: audiobookshelf_server_settings_before
  when: not ansible_check_mode or audiobookshelf_initialized | bool
  changed_when: false
  check_mode: false
  no_log: true

- name: Validate current Audiobookshelf server settings schema
  ansible.builtin.assert:
    that:
      - audiobookshelf_server_settings_before.json is mapping
      - audiobookshelf_server_settings_before.json.serverSettings is mapping
      - audiobookshelf_server_settings_before.json.serverSettings.id == 'server-settings'
      - audiobookshelf_server_settings_before.json.serverSettings.version == '2.36.0'
      - audiobookshelf_server_settings_before.json.serverSettings.timeZone | type_debug == 'str'
      - audiobookshelf_server_settings_before.json.serverSettings.timeZone == 'Europe/Berlin'
      - audiobookshelf_server_settings_before.json.serverSettings.storeCoverWithItem | type_debug == 'bool'
      - audiobookshelf_server_settings_before.json.serverSettings.storeMetadataWithItem | type_debug == 'bool'
      - audiobookshelf_server_settings_before.json.serverSettings.sortingIgnorePrefix | type_debug == 'bool'
      - audiobookshelf_server_settings_before.json.serverSettings.scannerParseSubtitle | type_debug == 'bool'
      - audiobookshelf_server_settings_before.json.serverSettings.scannerFindCovers | type_debug == 'bool'
      - audiobookshelf_server_settings_before.json.serverSettings.scannerCoverProvider | type_debug == 'str'
      - audiobookshelf_server_settings_before.json.serverSettings.scannerPreferMatchedMetadata | type_debug == 'bool'
      - audiobookshelf_server_settings_before.json.serverSettings.scannerDisableWatcher | type_debug == 'bool'
      - audiobookshelf_server_settings_before.json.serverSettings.chromecastEnabled | type_debug == 'bool'
      - audiobookshelf_server_settings_before.json.serverSettings.allowIframe | type_debug == 'bool'
      - audiobookshelf_server_settings_before.json.serverSettings.homeBookshelfView | type_debug == 'int'
      - audiobookshelf_server_settings_before.json.serverSettings.bookshelfView | type_debug == 'int'
      - audiobookshelf_server_settings_before.json.serverSettings.dateFormat | type_debug == 'str'
      - audiobookshelf_server_settings_before.json.serverSettings.timeFormat | type_debug == 'str'
      - audiobookshelf_server_settings_before.json.serverSettings.language | type_debug == 'str'
      - audiobookshelf_server_settings_before.json.serverSettings.backupPath | type_debug == 'str'
      - (audiobookshelf_server_settings_before.json.serverSettings.backupSchedule | type_debug) in ['str', 'bool']
      - audiobookshelf_server_settings_before.json.serverSettings.backupsToKeep | type_debug == 'int'
    fail_msg: >-
      Audiobookshelf 2.36.0 returned an unsupported server-settings schema;
      refusing to mutate settings.
  when: not ansible_check_mode or audiobookshelf_initialized | bool

- name: Resolve Audiobookshelf server settings reconciliation requirement
  ansible.builtin.set_fact:
    audiobookshelf_server_settings_drifted: >-
      {{ dict(audiobookshelf_desired_server_settings.keys() |
              zip(audiobookshelf_desired_server_settings.keys() |
                  map('extract', audiobookshelf_server_settings_before.json.serverSettings))) !=
         audiobookshelf_desired_server_settings }}
  when: not ansible_check_mode or audiobookshelf_initialized | bool
  no_log: true

- name: Report planned Audiobookshelf server settings reconciliation
  ansible.builtin.debug:
    msg: AUDIOBOOKSHELF_PLAN_SERVER_SETTINGS_RECONCILE
  when:
    - ansible_check_mode
    - audiobookshelf_initialized | bool
    - audiobookshelf_server_settings_drifted | bool
  changed_when: true

- name: Reconcile owned Audiobookshelf server settings
  ansible.builtin.uri:
    url: "{{ audiobookshelf_api }}/api/settings"
    method: PATCH
    headers:
      Authorization: "Bearer {{ audiobookshelf_reconcile_token }}"
    body_format: json
    body: "{{ audiobookshelf_desired_server_settings }}"
    status_code: [200]
  when:
    - not ansible_check_mode
    - audiobookshelf_server_settings_drifted | bool
  changed_when: true
  no_log: true

- name: Re-authorize after Audiobookshelf server settings reconciliation
  ansible.builtin.uri:
    url: "{{ audiobookshelf_api }}/api/authorize"
    method: POST
    headers:
      Authorization: "Bearer {{ audiobookshelf_reconcile_token }}"
    status_code: [200]
    return_content: true
  register: audiobookshelf_server_settings_after
  when: not ansible_check_mode
  changed_when: false
  check_mode: false
  no_log: true

- name: Require exact owned Audiobookshelf server settings after reconciliation
  ansible.builtin.assert:
    that:
      - audiobookshelf_server_settings_after.json is mapping
      - audiobookshelf_server_settings_after.json.serverSettings is mapping
      - audiobookshelf_server_settings_after.json.serverSettings.timeZone == 'Europe/Berlin'
      - dict(audiobookshelf_desired_server_settings.keys() |
             zip(audiobookshelf_desired_server_settings.keys() |
                 map('extract', audiobookshelf_server_settings_after.json.serverSettings))) ==
        audiobookshelf_desired_server_settings
    fail_msg: Audiobookshelf server settings read-back differs from the exact owned state.
  when: not ansible_check_mode

- name: Reconcile managed Audiobookshelf users
  ansible.builtin.include_tasks: managed_users.yml
  vars:
    audiobookshelf_managed_users_phase: reconcile
    audiobookshelf_managed_users_token: "{{ audiobookshelf_reconcile_token }}"
  when: not ansible_check_mode or audiobookshelf_initialized | bool

- name: List Audiobookshelf administrators for reconciliation
  ansible.builtin.uri:
    url: "{{ audiobookshelf_api }}/api/users"
    headers:
      Authorization: "Bearer {{ audiobookshelf_reconcile_token }}"
    return_content: true
  register: audiobookshelf_users_before
  when: not ansible_check_mode or audiobookshelf_initialized | bool
  changed_when: false
  check_mode: false
  no_log: true

- name: Resolve managed Audiobookshelf administrator IDs
  ansible.builtin.set_fact:
    audiobookshelf_managed_admin_ids: >-
      {{ (audiobookshelf_users_before.json.users
          | selectattr('username', 'equalto', vault_audiobookshelf_admin_username)
          | map(attribute='id') | map('string') | sort)
         if (not ansible_check_mode or audiobookshelf_initialized | bool) else [] }}
  no_log: true

- name: Require safe managed Audiobookshelf administrator IDs
  ansible.builtin.assert:
    that:
      - audiobookshelf_managed_admin_ids
        | reject('match', '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$')
        | list | length == 0
    fail_msg: Managed Audiobookshelf administrator contains an unsafe API identifier.

- name: Refuse duplicate managed Audiobookshelf administrators
  ansible.builtin.assert:
    that:
      - audiobookshelf_managed_admin_ids | length <= 1
    fail_msg: >-
      Managed Audiobookshelf administrator is duplicated at safe IDs:
      {{ audiobookshelf_managed_admin_ids | join(', ') }}

- name: Require the initialized vault-named Audiobookshelf administrator
  ansible.builtin.assert:
    that:
      - audiobookshelf_managed_admin_ids | length == 1
    fail_msg: The initialized Audiobookshelf server does not contain the vault-named administrator.
  when: not ansible_check_mode or audiobookshelf_initialized | bool

- name: Resolve the managed Audiobookshelf administrator
  ansible.builtin.set_fact:
    audiobookshelf_existing_admin: >-
      {{ (audiobookshelf_users_before.json.users
          | selectattr('username', 'equalto', vault_audiobookshelf_admin_username)
          | list | first)
         if (not ansible_check_mode or audiobookshelf_initialized | bool) else {} }}
  no_log: true

- name: Resolve Audiobookshelf administrator repair requirement
  ansible.builtin.set_fact:
    audiobookshelf_admin_repair_required: >-
      {{ audiobookshelf_existing_admin | length > 0 and
         audiobookshelf_existing_admin.type != 'root' }}
  no_log: true

- name: Report planned Audiobookshelf administrator repair
  ansible.builtin.debug:
    msg: AUDIOBOOKSHELF_PLAN_ADMIN_REPAIR
  when:
    - ansible_check_mode
    - audiobookshelf_admin_repair_required | bool
  changed_when: true

- name: Repair the managed Audiobookshelf administrator
  ansible.builtin.uri:
    url: "{{ audiobookshelf_api }}/api/users/{{ audiobookshelf_existing_admin.id }}"
    method: PATCH
    headers:
      Authorization: "Bearer {{ audiobookshelf_reconcile_token }}"
    body_format: json
    body:
      type: root
    status_code: [200]
  when:
    - not ansible_check_mode
    - audiobookshelf_admin_repair_required | bool
  changed_when: true
  no_log: true

- name: List Audiobookshelf libraries for reconciliation
  ansible.builtin.uri:
    url: "{{ audiobookshelf_api }}/api/libraries"
    headers:
      Authorization: "Bearer {{ audiobookshelf_reconcile_token }}"
    return_content: true
  register: audiobookshelf_libraries_before
  when: not ansible_check_mode or audiobookshelf_initialized | bool
  changed_when: false
  check_mode: false
  no_log: true

- name: Resolve Audiobookshelf libraries and managed IDs
  ansible.builtin.set_fact:
    audiobookshelf_libraries: >-
      {{ audiobookshelf_libraries_before.json.libraries
         if (not ansible_check_mode or audiobookshelf_initialized | bool) else [] }}
    audiobookshelf_managed_library_ids: >-
      {{ (audiobookshelf_libraries_before.json.libraries
          | selectattr('name', 'equalto', audiobookshelf_library_name)
          | map(attribute='id') | map('string') | sort)
         if (not ansible_check_mode or audiobookshelf_initialized | bool) else [] }}
  no_log: true

- name: Require safe managed Audiobookshelf library IDs
  ansible.builtin.assert:
    that:
      - audiobookshelf_managed_library_ids
        | reject('match', '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$')
        | list | length == 0
    fail_msg: Managed Audiobookshelf library contains an unsafe API identifier.

- name: Refuse duplicate managed Audiobookshelf libraries
  ansible.builtin.assert:
    that:
      - audiobookshelf_managed_library_ids | length <= 1
    fail_msg: >-
      Managed Audiobookshelf library identity is duplicated at safe IDs:
      {{ audiobookshelf_managed_library_ids | join(', ') }}

- name: Resolve the existing managed Audiobookshelf library
  ansible.builtin.set_fact:
    audiobookshelf_existing_library: >-
      {{ audiobookshelf_libraries
         | selectattr('name', 'equalto', audiobookshelf_library_name)
         | list | first | default({}) }}
  no_log: true

- name: Resolve existing Audiobookshelf library folder paths
  ansible.builtin.set_fact:
    audiobookshelf_existing_library_paths: >-
      {{ audiobookshelf_existing_library.folders | default([])
         | map(attribute='fullPath') | list }}
  no_log: true

- name: Resolve Audiobookshelf library repair requirement
  ansible.builtin.set_fact:
    audiobookshelf_library_create_required: >-
      {{ (ansible_check_mode and not audiobookshelf_initialized | bool) or
         audiobookshelf_existing_library | length == 0 }}
    audiobookshelf_library_folder_repair_required: >-
      {{ audiobookshelf_existing_library | length > 0 and
         audiobookshelf_existing_library_paths !=
           (audiobookshelf_library_folders | map(attribute='path') | list) }}
    audiobookshelf_library_repair_required: >-
      {{ audiobookshelf_existing_library | length > 0 and
         (audiobookshelf_existing_library.mediaType != audiobookshelf_library_media_type or
          audiobookshelf_existing_library.provider != audiobookshelf_library_provider or
          audiobookshelf_existing_library.icon != audiobookshelf_library_icon or
          audiobookshelf_existing_library.settings != audiobookshelf_library_settings or
          (audiobookshelf_existing_library.folders | map(attribute='fullPath') | list) !=
            (audiobookshelf_library_folders | map(attribute='path') | list)) }}
  no_log: true

- name: Resolve Audiobookshelf initial scan marker path and expected intents
  ansible.builtin.set_fact:
    audiobookshelf_initial_scan_marker_path: >-
      {{ audiobookshelf_effective_config_host_path }}/.nas-platform-initial-scan.json
    audiobookshelf_initial_scan_precreate_state:
      schema: 1
      state: pending
      library_name: "{{ audiobookshelf_library_name }}"
      library_id: null
      folder_paths: "{{ audiobookshelf_library_folders | map(attribute='path') | list }}"
    audiobookshelf_initial_scan_existing_bound_state: >-
      {{ {'schema': 1,
          'state': 'pending',
          'library_name': audiobookshelf_library_name,
          'library_id': audiobookshelf_existing_library.id,
          'folder_paths': audiobookshelf_library_folders | map(attribute='path') | list}
         if audiobookshelf_existing_library | length > 0 else {} }}
  no_log: true

- name: Initialize Audiobookshelf initial scan marker state
  ansible.builtin.set_fact:
    audiobookshelf_initial_scan_marker_state: {}
  no_log: true

- name: Safely load Audiobookshelf initial scan marker
  no_log: true
  block:
    - name: Inspect Audiobookshelf initial scan marker
      ansible.builtin.stat:
        path: "{{ audiobookshelf_initial_scan_marker_path }}"
        follow: false
      register: audiobookshelf_initial_scan_marker_stat
      changed_when: false
      check_mode: false

    - name: Require private regular Audiobookshelf initial scan marker
      ansible.builtin.assert:
        that:
          - not audiobookshelf_initial_scan_marker_stat.stat.exists or
            audiobookshelf_initial_scan_marker_stat.stat.isreg
          - not audiobookshelf_initial_scan_marker_stat.stat.exists or
            not audiobookshelf_initial_scan_marker_stat.stat.islnk
          - not audiobookshelf_initial_scan_marker_stat.stat.exists or
            audiobookshelf_initial_scan_marker_stat.stat.mode == '0600'
          - not audiobookshelf_initial_scan_marker_stat.stat.exists or
            audiobookshelf_initial_scan_marker_stat.stat.uid | int == nas_uid | int
          - not audiobookshelf_initial_scan_marker_stat.stat.exists or
            audiobookshelf_initial_scan_marker_stat.stat.gid | int == nas_gid | int
        fail_msg: The Audiobookshelf initial scan marker is not a private regular platform file.

    - name: Atomically read Audiobookshelf initial scan marker
      atomic_safe_slurp:
        path: "{{ audiobookshelf_initial_scan_marker_path }}"
        max_bytes: 4096
      register: audiobookshelf_initial_scan_marker_source
      changed_when: false
      check_mode: false

    - name: Parse Audiobookshelf initial scan marker
      ansible.builtin.set_fact:
        audiobookshelf_initial_scan_marker_present: >-
          {{ audiobookshelf_initial_scan_marker_source.exists | bool }}
        audiobookshelf_initial_scan_marker_state: >-
          {{ (audiobookshelf_initial_scan_marker_source.content | b64decode | from_json)
             if audiobookshelf_initial_scan_marker_source.exists else {} }}

    - name: Require safe Audiobookshelf initial scan marker schema
      ansible.builtin.assert:
        that:
          - audiobookshelf_initial_scan_marker_state is mapping
          - >-
            not audiobookshelf_initial_scan_marker_present or
            audiobookshelf_initial_scan_marker_state.keys() | list | sort ==
              ['folder_paths', 'library_id', 'library_name', 'schema', 'state']
          - >-
            not audiobookshelf_initial_scan_marker_present or
            audiobookshelf_initial_scan_marker_state.schema | type_debug == 'int'
          - >-
            not audiobookshelf_initial_scan_marker_present or
            audiobookshelf_initial_scan_marker_state.schema | int == 1
          - >-
            not audiobookshelf_initial_scan_marker_present or
            audiobookshelf_initial_scan_marker_state.state | type_debug == 'str'
          - >-
            not audiobookshelf_initial_scan_marker_present or
            audiobookshelf_initial_scan_marker_state.state == 'pending'
          - >-
            not audiobookshelf_initial_scan_marker_present or
            audiobookshelf_initial_scan_marker_state.library_name | type_debug == 'str'
          - >-
            not audiobookshelf_initial_scan_marker_present or
            audiobookshelf_initial_scan_marker_state.library_id is none or
            audiobookshelf_initial_scan_marker_state.library_id | type_debug == 'str'
          - >-
            not audiobookshelf_initial_scan_marker_present or
            audiobookshelf_initial_scan_marker_state.library_id is none or
            audiobookshelf_initial_scan_marker_state.library_id | string is
              match('^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$')
          - >-
            not audiobookshelf_initial_scan_marker_present or
            audiobookshelf_initial_scan_marker_state.folder_paths | type_debug == 'list'
          - >-
            not audiobookshelf_initial_scan_marker_present or
            audiobookshelf_initial_scan_marker_state.folder_paths |
              reject('string') | list | length == 0
        fail_msg: The Audiobookshelf initial scan marker schema is malformed.
  rescue:
    - name: Refuse unsafe Audiobookshelf initial scan marker
      ansible.builtin.fail:
        msg: The Audiobookshelf initial scan marker is unsafe or malformed.

- name: Resolve Audiobookshelf initial scan marker matches
  ansible.builtin.set_fact:
    audiobookshelf_initial_scan_precreate_marker_matches: >-
      {{ audiobookshelf_initial_scan_marker_state ==
         audiobookshelf_initial_scan_precreate_state }}
    audiobookshelf_initial_scan_bound_marker_matches: >-
      {{ audiobookshelf_initial_scan_marker_state ==
         audiobookshelf_initial_scan_existing_bound_state and
         audiobookshelf_initial_scan_existing_bound_state | length > 0 }}
  no_log: true

- name: Resolve Audiobookshelf initial scan marker acceptance
  ansible.builtin.set_fact:
    audiobookshelf_initial_scan_marker_accepted: >-
      {{ not audiobookshelf_initial_scan_marker_present | bool or
         audiobookshelf_initial_scan_bound_marker_matches | bool or
         (audiobookshelf_initial_scan_precreate_marker_matches | bool and
          (audiobookshelf_existing_library | length == 0 or
           not audiobookshelf_library_repair_required | bool)) }}
  no_log: true

- name: Refuse mismatched Audiobookshelf initial scan intent
  ansible.builtin.assert:
    that:
      - audiobookshelf_initial_scan_marker_accepted | bool
    fail_msg: The Audiobookshelf initial scan intent does not match the managed library.
  no_log: true

- name: Report planned Audiobookshelf library creation
  ansible.builtin.debug:
    msg: AUDIOBOOKSHELF_PLAN_LIBRARY_CREATE
  when:
    - ansible_check_mode
    - audiobookshelf_library_create_required | bool
  changed_when: true

- name: Record pre-create Audiobookshelf initial scan intent
  ansible.builtin.copy:
    content: "{{ audiobookshelf_initial_scan_precreate_state | to_json }}\n"
    dest: "{{ audiobookshelf_initial_scan_marker_path }}"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0600"
    follow: false
    unsafe_writes: false
  when:
    - not ansible_check_mode
    - audiobookshelf_library_create_required | bool
    - not audiobookshelf_initial_scan_marker_present | bool
  no_log: true

- name: Create the managed Audiobookshelf library
  ansible.builtin.uri:
    url: "{{ audiobookshelf_api }}/api/libraries"
    method: POST
    headers:
      Authorization: "Bearer {{ audiobookshelf_reconcile_token }}"
    body_format: json
    body:
      name: "{{ audiobookshelf_library_name }}"
      folders: "{{ audiobookshelf_library_folders }}"
      mediaType: "{{ audiobookshelf_library_media_type }}"
      provider: "{{ audiobookshelf_library_provider }}"
      icon: "{{ audiobookshelf_library_icon }}"
      settings: "{{ audiobookshelf_library_settings }}"
    status_code: [200]
    return_content: true
  register: audiobookshelf_library_created
  when:
    - not ansible_check_mode
    - audiobookshelf_library_create_required | bool
  changed_when: true
  no_log: true

- name: Resolve the current managed Audiobookshelf library
  ansible.builtin.set_fact:
    audiobookshelf_current_library: >-
      {{ audiobookshelf_existing_library
         if audiobookshelf_existing_library | length > 0
         else (audiobookshelf_library_created.json if not ansible_check_mode else {}) }}
  no_log: true

- name: Require safe current managed Audiobookshelf library ID
  ansible.builtin.assert:
    that:
      - audiobookshelf_current_library.id | string is match('^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$')
    fail_msg: The current managed Audiobookshelf library has an unsafe API identifier.
  when: audiobookshelf_current_library | length > 0
  no_log: true

- name: Resolve current Audiobookshelf initial scan intent
  ansible.builtin.set_fact:
    audiobookshelf_initial_scan_bound_state:
      schema: 1
      state: pending
      library_name: "{{ audiobookshelf_library_name }}"
      library_id: "{{ audiobookshelf_current_library.id | default(none) }}"
      folder_paths: "{{ audiobookshelf_library_folders | map(attribute='path') | list }}"
  no_log: true

- name: Resolve Audiobookshelf initial scan requirement
  ansible.builtin.set_fact:
    audiobookshelf_initial_scan_required: >-
      {{ audiobookshelf_library_create_required | bool or
         audiobookshelf_library_folder_repair_required | bool or
         audiobookshelf_initial_scan_precreate_marker_matches | bool or
         audiobookshelf_initial_scan_bound_marker_matches | bool }}
  no_log: true

- name: Bind Audiobookshelf initial scan intent to current library
  ansible.builtin.copy:
    content: "{{ audiobookshelf_initial_scan_bound_state | to_json }}\n"
    dest: "{{ audiobookshelf_initial_scan_marker_path }}"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0600"
    follow: false
    unsafe_writes: false
  when:
    - not ansible_check_mode
    - audiobookshelf_initial_scan_required | bool
    - audiobookshelf_initial_scan_marker_state != audiobookshelf_initial_scan_bound_state
  no_log: true

- name: Resolve folder-safe Audiobookshelf repair payload
  ansible.builtin.set_fact:
    audiobookshelf_library_repair_folders: >-
      {{ audiobookshelf_current_library.folders
         if audiobookshelf_existing_library_paths ==
            (audiobookshelf_library_folders | map(attribute='path') | list)
         else audiobookshelf_library_folders }}
  when: audiobookshelf_current_library | length > 0
  no_log: true

- name: Report planned Audiobookshelf library repair
  ansible.builtin.debug:
    msg: AUDIOBOOKSHELF_PLAN_LIBRARY_REPAIR
  when:
    - ansible_check_mode
    - audiobookshelf_library_repair_required | bool
  changed_when: true

- name: Drain active Audiobookshelf library scan before folder repair
  ansible.builtin.uri:
    url: "{{ audiobookshelf_api }}/api/tasks"
    headers:
      Authorization: "Bearer {{ audiobookshelf_reconcile_token }}"
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: audiobookshelf_pre_repair_scan_tasks
  until:
    - audiobookshelf_pre_repair_scan_tasks.status | default(0) | int == 200
    - audiobookshelf_pre_repair_scan_tasks.json | default({}) is mapping
    - "'tasks' in (audiobookshelf_pre_repair_scan_tasks.json | default({}))"
    - audiobookshelf_pre_repair_scan_tasks.json.tasks | type_debug == 'list'
    - >-
      audiobookshelf_pre_repair_scan_tasks.json.tasks | default([])
      | selectattr('action', 'defined')
      | selectattr('action', 'equalto', 'library-scan')
      | selectattr('isFinished', 'defined')
      | selectattr('isFinished', 'equalto', false)
      | selectattr('data.libraryId', 'defined')
      | selectattr('data.libraryId', 'equalto', audiobookshelf_current_library.id)
      | list | length == 0
  retries: "{{ audiobookshelf_initial_scan_retries }}"
  delay: "{{ audiobookshelf_initial_scan_delay }}"
  failed_when: false
  when:
    - not ansible_check_mode
    - audiobookshelf_library_folder_repair_required | bool
  changed_when: false
  check_mode: false
  no_log: true

- name: Require drained Audiobookshelf library scan before folder repair
  ansible.builtin.assert:
    that:
      - audiobookshelf_pre_repair_scan_tasks.status | default(0) | int == 200
      - audiobookshelf_pre_repair_scan_tasks.json | default({}) is mapping
      - "'tasks' in (audiobookshelf_pre_repair_scan_tasks.json | default({}))"
      - audiobookshelf_pre_repair_scan_tasks.json.tasks | type_debug == 'list'
      - >-
        audiobookshelf_pre_repair_scan_tasks.json.tasks | default([])
        | selectattr('action', 'defined')
        | selectattr('action', 'equalto', 'library-scan')
        | selectattr('isFinished', 'defined')
        | selectattr('isFinished', 'equalto', false)
        | selectattr('data.libraryId', 'defined')
        | selectattr('data.libraryId', 'equalto', audiobookshelf_current_library.id)
        | list | length == 0
    fail_msg: The managed Audiobookshelf library scan did not drain before folder repair.
  when:
    - not ansible_check_mode
    - audiobookshelf_library_folder_repair_required | bool
  no_log: true

- name: Repair the managed Audiobookshelf library
  ansible.builtin.uri:
    url: "{{ audiobookshelf_api }}/api/libraries/{{ audiobookshelf_current_library.id }}"
    method: PATCH
    headers:
      Authorization: "Bearer {{ audiobookshelf_reconcile_token }}"
    body_format: json
    body:
      name: "{{ audiobookshelf_library_name }}"
      folders: "{{ audiobookshelf_library_repair_folders }}"
      mediaType: "{{ audiobookshelf_library_media_type }}"
      provider: "{{ audiobookshelf_library_provider }}"
      icon: "{{ audiobookshelf_library_icon }}"
      settings: "{{ audiobookshelf_library_settings }}"
    status_code: [200]
  when:
    - not ansible_check_mode
    - audiobookshelf_library_repair_required | bool
  changed_when: true
  no_log: true

- name: Report planned Audiobookshelf initial scan
  ansible.builtin.debug:
    msg: AUDIOBOOKSHELF_PLAN_INITIAL_SCAN
  when:
    - ansible_check_mode
    - audiobookshelf_initial_scan_required | bool
  changed_when: true

- name: Drain active Audiobookshelf library scan before initial scan request
  ansible.builtin.uri:
    url: "{{ audiobookshelf_api }}/api/tasks"
    headers:
      Authorization: "Bearer {{ audiobookshelf_reconcile_token }}"
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: audiobookshelf_pre_initial_scan_tasks
  until:
    - audiobookshelf_pre_initial_scan_tasks.status | default(0) | int == 200
    - audiobookshelf_pre_initial_scan_tasks.json | default({}) is mapping
    - "'tasks' in (audiobookshelf_pre_initial_scan_tasks.json | default({}))"
    - audiobookshelf_pre_initial_scan_tasks.json.tasks | type_debug == 'list'
    - >-
      audiobookshelf_pre_initial_scan_tasks.json.tasks | default([])
      | selectattr('action', 'defined')
      | selectattr('action', 'equalto', 'library-scan')
      | selectattr('isFinished', 'defined')
      | selectattr('isFinished', 'equalto', false)
      | selectattr('data.libraryId', 'defined')
      | selectattr('data.libraryId', 'equalto', audiobookshelf_current_library.id)
      | list | length == 0
  retries: "{{ audiobookshelf_initial_scan_retries }}"
  delay: "{{ audiobookshelf_initial_scan_delay }}"
  failed_when: false
  when:
    - not ansible_check_mode
    - audiobookshelf_initial_scan_required | bool
  changed_when: false
  check_mode: false
  no_log: true

- name: Require drained Audiobookshelf library scan before initial scan request
  ansible.builtin.assert:
    that:
      - audiobookshelf_pre_initial_scan_tasks.status | default(0) | int == 200
      - audiobookshelf_pre_initial_scan_tasks.json | default({}) is mapping
      - "'tasks' in (audiobookshelf_pre_initial_scan_tasks.json | default({}))"
      - audiobookshelf_pre_initial_scan_tasks.json.tasks | type_debug == 'list'
      - >-
        audiobookshelf_pre_initial_scan_tasks.json.tasks | default([])
        | selectattr('action', 'defined')
        | selectattr('action', 'equalto', 'library-scan')
        | selectattr('isFinished', 'defined')
        | selectattr('isFinished', 'equalto', false)
        | selectattr('data.libraryId', 'defined')
        | selectattr('data.libraryId', 'equalto', audiobookshelf_current_library.id)
        | list | length == 0
    fail_msg: The managed Audiobookshelf library scan did not drain before the initial scan request.
  when:
    - not ansible_check_mode
    - audiobookshelf_initial_scan_required | bool
  no_log: true

- name: Refetch authoritative Audiobookshelf library before initial scan
  ansible.builtin.uri:
    url: "{{ audiobookshelf_api }}/api/libraries"
    headers:
      Authorization: "Bearer {{ audiobookshelf_reconcile_token }}"
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: audiobookshelf_initial_scan_baseline_libraries
  failed_when: false
  when:
    - not ansible_check_mode
    - audiobookshelf_initial_scan_required | bool
  changed_when: false
  check_mode: false
  no_log: true

- name: Require strict authoritative Audiobookshelf library baseline response
  ansible.builtin.assert:
    that:
      - audiobookshelf_initial_scan_baseline_libraries.status | default(0) | int == 200
      - audiobookshelf_initial_scan_baseline_libraries.json | default({}) is mapping
      - "'libraries' in (audiobookshelf_initial_scan_baseline_libraries.json | default({}))"
      - audiobookshelf_initial_scan_baseline_libraries.json.libraries | type_debug == 'list'
    fail_msg: The authoritative Audiobookshelf library baseline response is malformed.
  when:
    - not ansible_check_mode
    - audiobookshelf_initial_scan_required | bool
  no_log: true

- name: Resolve authoritative Audiobookshelf library baseline
  ansible.builtin.set_fact:
    audiobookshelf_initial_scan_library_before: >-
      {{ audiobookshelf_initial_scan_baseline_libraries.json.libraries | default([])
         | selectattr('id', 'defined')
         | selectattr('id', 'equalto', audiobookshelf_current_library.id)
         | list }}
  when:
    - not ansible_check_mode
    - audiobookshelf_initial_scan_required | bool
  no_log: true

- name: Require safe authoritative Audiobookshelf last scan baseline
  ansible.builtin.assert:
    that:
      - audiobookshelf_initial_scan_library_before | type_debug == 'list'
      - audiobookshelf_initial_scan_library_before | length == 1
      - audiobookshelf_initial_scan_library_before[0] is mapping
      - audiobookshelf_initial_scan_library_before[0].lastScan is defined
      - audiobookshelf_initial_scan_library_before[0].lastScan is none or
        audiobookshelf_initial_scan_library_before[0].lastScan | type_debug == 'int'
      - audiobookshelf_initial_scan_library_before[0].lastScan is none or
        audiobookshelf_initial_scan_library_before[0].lastScan | int >= 0
    fail_msg: The managed Audiobookshelf library has a malformed last scan baseline.
  when:
    - not ansible_check_mode
    - audiobookshelf_initial_scan_required | bool
  no_log: true

- name: Capture Audiobookshelf last scan before initial scan request
  ansible.builtin.set_fact:
    audiobookshelf_initial_scan_last_scan_before: >-
      {{ audiobookshelf_initial_scan_library_before[0].lastScan }}
  when:
    - not ansible_check_mode
    - audiobookshelf_initial_scan_required | bool
  no_log: true

- name: Request Audiobookshelf initial library scan
  ansible.builtin.uri:
    url: "{{ audiobookshelf_api }}/api/libraries/{{ audiobookshelf_current_library.id }}/scan"
    method: POST
    headers:
      Authorization: "Bearer {{ audiobookshelf_reconcile_token }}"
    status_code: [200]
  when:
    - not ansible_check_mode
    - audiobookshelf_initial_scan_required | bool
  changed_when: true
  no_log: true

- name: Poll Audiobookshelf initial library scan tasks
  ansible.builtin.uri:
    url: "{{ audiobookshelf_api }}/api/tasks"
    headers:
      Authorization: "Bearer {{ audiobookshelf_reconcile_token }}"
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: audiobookshelf_initial_scan_tasks
  until:
    - audiobookshelf_initial_scan_tasks.status | default(0) | int == 200
    - audiobookshelf_initial_scan_tasks.json | default({}) is mapping
    - "'tasks' in (audiobookshelf_initial_scan_tasks.json | default({}))"
    - audiobookshelf_initial_scan_tasks.json.tasks | type_debug == 'list'
    - >-
      audiobookshelf_initial_scan_tasks.json.tasks | default([])
      | selectattr('action', 'defined')
      | selectattr('action', 'equalto', 'library-scan')
      | selectattr('isFinished', 'defined')
      | selectattr('isFinished', 'equalto', false)
      | selectattr('data.libraryId', 'defined')
      | selectattr('data.libraryId', 'equalto', audiobookshelf_current_library.id)
      | list | length == 0
  retries: "{{ audiobookshelf_initial_scan_retries }}"
  delay: "{{ audiobookshelf_initial_scan_delay }}"
  failed_when: false
  when:
    - not ansible_check_mode
    - audiobookshelf_initial_scan_required | bool
  changed_when: false
  check_mode: false
  no_log: true

- name: Poll authoritative Audiobookshelf library scan state
  ansible.builtin.uri:
    url: "{{ audiobookshelf_api }}/api/libraries"
    headers:
      Authorization: "Bearer {{ audiobookshelf_reconcile_token }}"
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: audiobookshelf_initial_scan_libraries
  until:
    - audiobookshelf_initial_scan_libraries.status | default(0) | int == 200
    - audiobookshelf_initial_scan_libraries.json | default({}) is mapping
    - "'libraries' in (audiobookshelf_initial_scan_libraries.json | default({}))"
    - audiobookshelf_initial_scan_libraries.json.libraries | type_debug == 'list'
    - >-
      (audiobookshelf_initial_scan_libraries.json.libraries | default([])
       | selectattr('id', 'defined')
       | selectattr('id', 'equalto', audiobookshelf_current_library.id)
       | list | length == 1) and
      (audiobookshelf_initial_scan_libraries.json.libraries | default([])
       | selectattr('id', 'defined')
       | selectattr('id', 'equalto', audiobookshelf_current_library.id)
       | map(attribute='lastScan') | first | default(none)) is not none and
      (audiobookshelf_initial_scan_libraries.json.libraries | default([])
       | selectattr('id', 'defined')
       | selectattr('id', 'equalto', audiobookshelf_current_library.id)
       | map(attribute='lastScan') | first | default(none) | type_debug == 'int') and
      (audiobookshelf_initial_scan_last_scan_before is none or
       (audiobookshelf_initial_scan_libraries.json.libraries | default([])
        | selectattr('id', 'defined')
        | selectattr('id', 'equalto', audiobookshelf_current_library.id)
        | map(attribute='lastScan') | first | default(0) | int) >
          audiobookshelf_initial_scan_last_scan_before | int)
  retries: "{{ audiobookshelf_initial_scan_retries }}"
  delay: "{{ audiobookshelf_initial_scan_delay }}"
  failed_when: false
  when:
    - not ansible_check_mode
    - audiobookshelf_initial_scan_required | bool
  changed_when: false
  check_mode: false
  no_log: true

- name: Poll Audiobookshelf managed library items after initial scan
  ansible.builtin.uri:
    url: >-
      {{ audiobookshelf_api }}/api/libraries/{{ audiobookshelf_current_library.id
      }}/items?limit=1&minified=1
    headers:
      Authorization: "Bearer {{ audiobookshelf_reconcile_token }}"
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: audiobookshelf_initial_scan_items
  until:
    - audiobookshelf_initial_scan_items.status | default(0) | int == 200
    - audiobookshelf_initial_scan_items.json | default({}) is mapping
    - "'results' in (audiobookshelf_initial_scan_items.json | default({}))"
    - audiobookshelf_initial_scan_items.json.results | type_debug == 'list'
    - "'total' in (audiobookshelf_initial_scan_items.json | default({}))"
    - audiobookshelf_initial_scan_items.json.total | type_debug == 'int'
  retries: "{{ audiobookshelf_initial_scan_retries }}"
  delay: "{{ audiobookshelf_initial_scan_delay }}"
  failed_when: false
  when:
    - not ansible_check_mode
    - audiobookshelf_initial_scan_required | bool
  changed_when: false
  check_mode: false
  no_log: true

- name: Resolve authoritative Audiobookshelf library after initial scan
  ansible.builtin.set_fact:
    audiobookshelf_initial_scan_library_after: >-
      {{ audiobookshelf_initial_scan_libraries.json.libraries | default([])
         | selectattr('id', 'defined')
         | selectattr('id', 'equalto', audiobookshelf_current_library.id)
         | list | first | default({}) }}
  when:
    - not ansible_check_mode
    - audiobookshelf_initial_scan_required | bool
  no_log: true

- name: Resolve sanitized Audiobookshelf initial scan observation
  ansible.builtin.set_fact:
    audiobookshelf_initial_scan_observation:
      library_id: "{{ audiobookshelf_current_library.id }}"
      scan_active: >-
        {{ audiobookshelf_initial_scan_tasks.json.tasks | default([])
           | selectattr('action', 'defined')
           | selectattr('action', 'equalto', 'library-scan')
           | selectattr('isFinished', 'defined')
           | selectattr('isFinished', 'equalto', false)
           | selectattr('data.libraryId', 'defined')
           | selectattr('data.libraryId', 'equalto', audiobookshelf_current_library.id)
           | list | length > 0 }}
      item_count: >-
        {{ audiobookshelf_initial_scan_items.json.total | default(-1) | int }}
      retry_observation: >-
        tasks={{ audiobookshelf_initial_scan_tasks.attempts | default(0) }},
        libraries={{ audiobookshelf_initial_scan_libraries.attempts | default(0) }},
        items={{ audiobookshelf_initial_scan_items.attempts | default(0) }}
  when:
    - not ansible_check_mode
    - audiobookshelf_initial_scan_required | bool
  no_log: true

- name: Require completed Audiobookshelf initial library scan
  ansible.builtin.assert:
    that:
      - audiobookshelf_initial_scan_tasks.status | default(0) | int == 200
      - audiobookshelf_initial_scan_tasks.json | default({}) is mapping
      - "'tasks' in (audiobookshelf_initial_scan_tasks.json | default({}))"
      - audiobookshelf_initial_scan_tasks.json.tasks | type_debug == 'list'
      - not audiobookshelf_initial_scan_observation.scan_active | bool
      - audiobookshelf_initial_scan_libraries.status | default(0) | int == 200
      - audiobookshelf_initial_scan_libraries.json | default({}) is mapping
      - "'libraries' in (audiobookshelf_initial_scan_libraries.json | default({}))"
      - audiobookshelf_initial_scan_libraries.json.libraries | type_debug == 'list'
      - audiobookshelf_initial_scan_library_after is mapping
      - audiobookshelf_initial_scan_library_after.lastScan | default(none) is not none
      - audiobookshelf_initial_scan_library_after.lastScan | default(none) | type_debug == 'int'
      - audiobookshelf_initial_scan_last_scan_before is none or
        audiobookshelf_initial_scan_library_after.lastScan | int >
          audiobookshelf_initial_scan_last_scan_before | int
      - audiobookshelf_initial_scan_items.status | default(0) | int == 200
      - audiobookshelf_initial_scan_items.json | default({}) is mapping
      - "'results' in (audiobookshelf_initial_scan_items.json | default({}))"
      - audiobookshelf_initial_scan_items.json.results | type_debug == 'list'
      - "'total' in (audiobookshelf_initial_scan_items.json | default({}))"
      - audiobookshelf_initial_scan_items.json.total | type_debug == 'int'
    fail_msg: >-
      Audiobookshelf initial scan did not complete
      (library_id={{ audiobookshelf_initial_scan_observation.library_id }},
      scan_active={{ audiobookshelf_initial_scan_observation.scan_active | bool }},
      item_count={{ audiobookshelf_initial_scan_observation.item_count | int }},
      retry_observation={{ audiobookshelf_initial_scan_observation.retry_observation }}).
  when:
    - not ansible_check_mode
    - audiobookshelf_initial_scan_required | bool

- name: Clear completed Audiobookshelf initial scan intent
  ansible.builtin.file:
    path: "{{ audiobookshelf_initial_scan_marker_path }}"
    state: absent
  when:
    - not ansible_check_mode
    - audiobookshelf_initial_scan_required | bool
  no_log: true

- name: Authenticate to Audiobookshelf for exact verification
  tags: [platform_verify_audiobookshelf]
  ansible.builtin.uri:
    url: "{{ audiobookshelf_api }}/login"
    method: POST
    body_format: json
    body:
      username: "{{ vault_audiobookshelf_admin_username }}"
      password: "{{ vault_audiobookshelf_admin_password }}"
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: audiobookshelf_verify_login
  when:
    - not ansible_check_mode
    - audiobookshelf_reconcile_token is not defined
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

- name: Resolve sanitized Audiobookshelf verification authentication response
  tags: [platform_verify_audiobookshelf]
  ansible.builtin.set_fact:
    audiobookshelf_verify_login_status: "{{ audiobookshelf_verify_login.status | default(0) | int }}"
    audiobookshelf_verify_login_kind: >-
      {% set media_type = audiobookshelf_verify_login.content_type
         | default('') | lower | regex_replace(';.*$', '') | trim %}
      {{ 'json' if media_type == 'application/json' or media_type is match('^application/.+[+]json$')
         else 'text' if media_type is match('^text/')
         else 'binary' if media_type is match('^(audio/|application/octet-stream$)')
         else 'other' }}
  when:
    - not ansible_check_mode
    - audiobookshelf_reconcile_token is not defined
  no_log: true

- name: Refuse unavailable Audiobookshelf administrator authentication during verification
  tags: [platform_verify_audiobookshelf]
  ansible.builtin.assert:
    that:
      - audiobookshelf_verify_login_status | int != 401
    fail_msg: >-
      Managed Audiobookshelf administrator cannot authenticate. Pinned Audiobookshelf 2.36.0
      exposes no unauthenticated API path to reactivate an inactive root; verify vault credentials
      or reactivate it through an already-authorized root session, then rerun.
  when:
    - not ansible_check_mode
    - audiobookshelf_reconcile_token is not defined

- name: Refuse unexpected Audiobookshelf administrator authentication responses during verification
  tags: [platform_verify_audiobookshelf]
  ansible.builtin.assert:
    that:
      - audiobookshelf_verify_login_status | int == 200
    fail_msg: >-
      Audiobookshelf administrator authentication returned an unexpected sanitized response
      (status={{ audiobookshelf_verify_login_status | int }},
      content={{ audiobookshelf_verify_login_kind }}).
  when:
    - not ansible_check_mode
    - audiobookshelf_reconcile_token is not defined

- name: Resolve the Audiobookshelf verification token
  tags: [platform_verify_audiobookshelf]
  ansible.builtin.set_fact:
    audiobookshelf_verification_token: >-
      {{ audiobookshelf_reconcile_token
         if audiobookshelf_reconcile_token is defined
         else audiobookshelf_verify_login.json.user.accessToken }}
  when: not ansible_check_mode
  no_log: true

- name: Resolve desired Audiobookshelf server settings for verification
  tags: [platform_verify_audiobookshelf]
  ansible.builtin.set_fact:
    audiobookshelf_desired_server_settings_for_verification: >-
      {{ audiobookshelf_owned_server_settings |
         combine({
           'backupPath': audiobookshelf_backup_container_path,
           'backupSchedule': audiobookshelf_backup_cron,
           'backupsToKeep': audiobookshelf_backup_retention
         }) }}
  when: not ansible_check_mode
  no_log: true

- name: Re-authorize for exact Audiobookshelf server settings verification
  tags: [platform_verify_audiobookshelf]
  ansible.builtin.uri:
    url: "{{ audiobookshelf_api }}/api/authorize"
    method: POST
    headers:
      Authorization: "Bearer {{ audiobookshelf_verification_token }}"
    status_code: [200]
    return_content: true
  register: audiobookshelf_verified_server_settings_response
  when: not ansible_check_mode
  changed_when: false
  check_mode: false
  no_log: true

- name: Require exact managed Audiobookshelf server settings
  tags: [platform_verify_audiobookshelf]
  ansible.builtin.assert:
    that:
      - audiobookshelf_verified_server_settings_response.json is mapping
      - audiobookshelf_verified_server_settings_response.json.serverSettings is mapping
      - audiobookshelf_verified_server_settings_response.json.serverSettings.timeZone == 'Europe/Berlin'
      - dict(audiobookshelf_desired_server_settings_for_verification.keys() |
             zip(audiobookshelf_desired_server_settings_for_verification.keys() |
                 map('extract', audiobookshelf_verified_server_settings_response.json.serverSettings))) ==
        audiobookshelf_desired_server_settings_for_verification
    fail_msg: >-
      The managed Audiobookshelf server settings or library are absent, duplicated,
      surplus, or drifted.
  when: not ansible_check_mode

- name: Verify managed Audiobookshelf users
  tags: [platform_verify_audiobookshelf]
  ansible.builtin.include_tasks:
    file: managed_users.yml
    apply:
      tags: [platform_verify_audiobookshelf]
  vars:
    audiobookshelf_managed_users_phase: verify
    audiobookshelf_managed_users_token: "{{ audiobookshelf_verification_token }}"
  when: not ansible_check_mode

- name: Read exact Audiobookshelf users and libraries
  tags: [platform_verify_audiobookshelf]
  ansible.builtin.uri:
    url: "{{ audiobookshelf_api }}/api/{{ item }}"
    headers:
      Authorization: "Bearer {{ audiobookshelf_verification_token }}"
    return_content: true
  loop: [users, libraries]
  register: audiobookshelf_verify_state
  when: not ansible_check_mode
  changed_when: false
  check_mode: false
  no_log: true

- name: Resolve exact Audiobookshelf verification state
  tags: [platform_verify_audiobookshelf]
  ansible.builtin.set_fact:
    audiobookshelf_verified_users: "{{ audiobookshelf_verify_state.results[0].json.users }}"
    audiobookshelf_verified_libraries: "{{ audiobookshelf_verify_state.results[1].json.libraries }}"
  when: not ansible_check_mode
  no_log: true

- name: Require exactly the managed Audiobookshelf administrator
  tags: [platform_verify_audiobookshelf]
  ansible.builtin.assert:
    that:
      - audiobookshelf_verified_admins | length == 1
      - audiobookshelf_verified_admins[0].type == 'root'
      - audiobookshelf_verified_admins[0].isActive
    fail_msg: The vault-named Audiobookshelf administrator is absent, duplicated, or drifted.
  vars:
    audiobookshelf_verified_admins: >-
      {{ audiobookshelf_verified_users
         | selectattr('username', 'equalto', vault_audiobookshelf_admin_username) | list }}
  when: not ansible_check_mode

- name: Require exactly the managed Audiobookshelf library
  tags: [platform_verify_audiobookshelf]
  ansible.builtin.assert:
    that:
      - audiobookshelf_verified_libraries | length == 1
      - audiobookshelf_verified_library | length == 1
      - audiobookshelf_verified_library[0].mediaType == audiobookshelf_library_media_type
      - audiobookshelf_verified_library[0].provider == audiobookshelf_library_provider
      - audiobookshelf_verified_library[0].icon == audiobookshelf_library_icon
      - audiobookshelf_verified_library[0].settings == audiobookshelf_library_settings
      - audiobookshelf_verified_library[0].folders | map(attribute='fullPath') | list ==
        audiobookshelf_library_folders | map(attribute='path') | list
    fail_msg: The managed Audiobookshelf library is absent, duplicated, surplus, or drifted.
  vars:
    audiobookshelf_verified_library: >-
      {{ audiobookshelf_verified_libraries
         | selectattr('name', 'equalto', audiobookshelf_library_name) | list }}
  when: not ansible_check_mode
