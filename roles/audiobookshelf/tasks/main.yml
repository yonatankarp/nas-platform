---
# Audiobookshelf, one stage per file, in run order. Stages are imported
# statically so the role-level [never] tag and --list-tasks reach them;
# managed_users.yml stays a dynamic include because it is phase-gated.
- name: Deploy the Audiobookshelf stack
  ansible.builtin.import_tasks: deploy.yml

- name: Bootstrap the Audiobookshelf administrator and reconciliation bearer
  ansible.builtin.import_tasks: bootstrap.yml

- name: Converge owned Audiobookshelf server settings
  ansible.builtin.import_tasks: settings.yml

- name: Reconcile managed Audiobookshelf users
  ansible.builtin.include_tasks: managed_users.yml
  vars:
    audiobookshelf_managed_users_phase: reconcile
    audiobookshelf_managed_users_token: "{{ audiobookshelf_reconcile_token }}"
  when: not ansible_check_mode or audiobookshelf_initialized | bool

- name: Reconcile the Audiobookshelf administrator record
  ansible.builtin.import_tasks: administrator.yml

- name: Read the Audiobookshelf library inventory
  ansible.builtin.import_tasks: library.yml

- name: Reconcile the Audiobookshelf library and its initial scan
  ansible.builtin.import_tasks: initial_scan.yml

- name: Run Audiobookshelf service verification
  ansible.builtin.import_tasks: verify.yml
