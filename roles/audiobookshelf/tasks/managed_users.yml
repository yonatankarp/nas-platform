---
# Audiobookshelf's managed-user reconciliation is roles/managed_users,
# parameterised, the way roles/komga/tasks/managed_users.yml is. The opening
# assert stays because it is what makes audiobookshelf_managed_users_phase a
# gated variable: include_tasks never applies meta/argument_specs.yml, so
# tests/policy_test.rb holds main.yml's and verify.yml's callers to exactly the
# phases named here, and the shared role's own argument spec cannot see a caller
# of THIS file.
#
# Every Audiobookshelf-specific value lives in defaults/main.yml as
# audiobookshelf_managed_users_*, so what follows is a one-to-one map. The two
# exceptions are the bearer header, which reads the token its caller binds, and
# the two booleans that say this service is not a basic-auth one.
- name: Validate the Audiobookshelf managed-user phase
  ansible.builtin.assert:
    that:
      - audiobookshelf_managed_users_phase in ['reconcile', 'verify']
    fail_msg: >-
      Audiobookshelf managed-user reconciliation was included with a phase it does not
      implement. The tasks this file reaches are gated on
      audiobookshelf_managed_users_phase, so an unrecognised phase silently skips them.

- name: Reconcile the declared Audiobookshelf managed users
  ansible.builtin.include_role:
    name: managed_users
  vars:
    managed_users_phase: "{{ audiobookshelf_managed_users_phase }}"
    managed_users_service: audiobookshelf
    managed_users_title: Audiobookshelf
    managed_users_declared: "{{ vault_managed_audiobookshelf_users }}"
    managed_users_identity_attribute: "{{ audiobookshelf_managed_users_identity_attribute }}"
    managed_users_id_attribute: "{{ audiobookshelf_managed_users_id_attribute }}"
    managed_users_api: "{{ audiobookshelf_api }}"
    managed_users_admin_headers:
      Authorization: "Bearer {{ audiobookshelf_managed_users_token }}"
    managed_users_admin_basic: false
    managed_users_list_path: "{{ audiobookshelf_managed_users_list_path }}"
    managed_users_list_json: "{{ audiobookshelf_managed_users_list_json }}"
    managed_users_listing_conditions: "{{ audiobookshelf_managed_users_listing_conditions }}"
    managed_users_authenticate_path: "{{ audiobookshelf_managed_users_authenticate_path }}"
    managed_users_authenticate_method: POST
    managed_users_authenticate_basic: false
    managed_users_authenticate_body_format: json
    managed_users_authenticate_body: "{{ audiobookshelf_managed_users_authenticate_body }}"
    managed_users_authenticate_identity: "{{ audiobookshelf_managed_users_authenticate_identity }}"
    managed_users_authenticate_identity_normalized: >-
      {{ audiobookshelf_managed_users_authenticate_identity_normalized }}
    managed_users_create_path: "{{ audiobookshelf_managed_users_create_path }}"
    managed_users_create_body: "{{ audiobookshelf_managed_users_create_body }}"
    managed_users_create_status: "{{ audiobookshelf_managed_users_create_status }}"
    managed_users_reconcile_interface: "{{ audiobookshelf_managed_users_reconcile_interface }}"
    managed_users_reconcile_path: "{{ audiobookshelf_managed_users_reconcile_path }}"
    managed_users_repair_body: "{{ audiobookshelf_managed_users_repair_body }}"
    managed_users_repair_status: "{{ audiobookshelf_managed_users_repair_status }}"
    managed_users_repair_condition: "{{ audiobookshelf_managed_users_repair_condition }}"
    managed_users_verify_conditions: "{{ audiobookshelf_managed_users_verify_conditions }}"
    managed_users_verify_fail_msg: "{{ audiobookshelf_managed_users_verify_fail_msg }}"
    managed_users_plan_create_message: "{{ audiobookshelf_managed_users_plan_create_message }}"
    managed_users_plan_repair_message: "{{ audiobookshelf_managed_users_plan_repair_message }}"
