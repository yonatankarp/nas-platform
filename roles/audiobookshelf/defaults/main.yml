---
audiobookshelf_port: 13378
audiobookshelf_api: "http://127.0.0.1:{{ audiobookshelf_port }}"
audiobookshelf_compose_project_name: >-
  {{ (platform_project_name ~ '-audiobookshelf')
     if platform_project_name | default('') | length > 0 else 'audiobookshelf' }}

audiobookshelf_owned_server_settings:
  # /audiobooks is read-only, so covers land under /metadata instead.
  storeCoverWithItem: false
  storeMetadataWithItem: false
  sortingIgnorePrefix: false
  scannerParseSubtitle: true
  scannerFindCovers: true
  scannerCoverProvider: google
  scannerPreferMatchedMetadata: true
  scannerDisableWatcher: false
  chromecastEnabled: true
  allowIframe: true
  homeBookshelfView: 1
  bookshelfView: 1
  dateFormat: dd/MM/yyyy
  timeFormat: HH:mm
  language: en-us
audiobookshelf_backup_cron: "0 3 * * *"
audiobookshelf_backup_retention: 7
audiobookshelf_backup_container_path: /metadata/backups

audiobookshelf_library_name: Audiobooks
audiobookshelf_library_folders:
  - path: /audiobooks
audiobookshelf_library_media_type: book
audiobookshelf_library_provider: google
audiobookshelf_library_icon: database
audiobookshelf_initial_scan_retries: 60
audiobookshelf_initial_scan_delay: 2
audiobookshelf_library_settings:
  coverAspectRatio: 1
  disableWatcher: false
  autoScanCronExpression: null
  skipMatchingMediaWithAsin: false
  skipMatchingMediaWithIsbn: false
  audiobooksOnly: false
  epubsAllowScriptedContent: false
  hideSingleBookSeries: false
  onlyShowLaterBooksInContinueSeries: false
  metadataPrecedence:
    - folderStructure
    - audioMetatags
    - nfoFile
    - txtFiles
    - opfFile
    - absMetadata
  markAsFinishedPercentComplete: null
  markAsFinishedTimeRemaining: 10

# Audiobookshelf's half of roles/managed_users; compare roles/komga/defaults/main.yml.
# The relative paths are asserted against config/managed-user-capabilities.yml.
audiobookshelf_managed_users_identity_attribute: username
audiobookshelf_managed_users_id_attribute: id
audiobookshelf_managed_users_list_path: api/users
audiobookshelf_managed_users_authenticate_path: login
audiobookshelf_managed_users_create_path: api/users
audiobookshelf_managed_users_reconcile_interface: api/users/{id}
audiobookshelf_managed_users_create_status: [200]
audiobookshelf_managed_users_repair_status: [200]
audiobookshelf_managed_users_authenticate_identity_normalized: false

# A truncated listing reads as an absent identity and would be created twice.
# Brace-free and ordered: the envelope is proved a mapping before any key is read.
audiobookshelf_managed_users_listing_conditions:
  - managed_users_listing.json is mapping
  - managed_users_listing.json.users | type_debug == 'list'
  - managed_users_listing.json.hasMore | default(false) | bool == false
  - managed_users_listing.json.nextPage | default(none) is none
  - >-
    managed_users_listing.json.total is not defined or
    managed_users_listing.json.total | int ==
      managed_users_listing.json.users | length

# Evaluated inside the shared role's loops, against its own names.
audiobookshelf_managed_users_list_json: "{{ managed_users_listing.json.users }}"
audiobookshelf_managed_users_authenticate_body:
  username: "{{ managed_users_authenticating_user.username }}"
  password: "{{ managed_users_authenticating_user.password }}"
audiobookshelf_managed_users_authenticate_identity: "{{ item.json.user.username | default('') }}"
audiobookshelf_managed_users_reconcile_path: >-
  api/users/{{ managed_users_match[managed_users_id_attribute] | urlencode }}
audiobookshelf_managed_users_create_body:
  username: "{{ item.username }}"
  password: "{{ item.password }}"
  type: "{{ item.type }}"
  isActive: "{{ item.is_active }}"
  permissions: "{{ item.permissions.flags }}"
  librariesAccessible: "{{ item.permissions.librariesAccessible }}"
  itemTagsSelected: "{{ item.permissions.itemTagsSelected }}"
# Nothing password-shaped here: an existing identity's password update is forbidden.
audiobookshelf_managed_users_repair_body:
  type: "{{ item.type }}"
  isActive: "{{ item.is_active }}"
  permissions: "{{ item.permissions.flags }}"
  librariesAccessible: "{{ item.permissions.librariesAccessible }}"
  itemTagsSelected: "{{ item.permissions.itemTagsSelected }}"
# Only declared flags are compared; Audiobookshelf adds undeclared ones.
audiobookshelf_managed_users_repair_condition: >-
  {{ managed_users_match.type != item.type or
     managed_users_match.isActive | bool != item.is_active | bool or
     (managed_users_match.permissions | dict2items |
      selectattr('key', 'in', item.permissions.flags.keys()) | items2dict) !=
       item.permissions.flags or
     managed_users_match.librariesAccessible != item.permissions.librariesAccessible or
     managed_users_match.itemTagsSelected != item.permissions.itemTagsSelected }}
# Brace-free; the first condition is what makes the rest safe, because
# managed_users_match is an empty mapping for an identity with no match.
audiobookshelf_managed_users_verify_conditions:
  - managed_users_matches[item.username] | length == 1
  - managed_users_match.username == item.username
  - managed_users_match.type == item.type
  - managed_users_match.isActive | bool == item.is_active | bool
  - >-
    (managed_users_match.permissions | dict2items |
     selectattr('key', 'in', item.permissions.flags.keys()) | items2dict) ==
      item.permissions.flags
  - >-
    managed_users_match.librariesAccessible ==
    item.permissions.librariesAccessible
  - >-
    managed_users_match.itemTagsSelected ==
    item.permissions.itemTagsSelected
audiobookshelf_managed_users_verify_fail_msg: >-
  A managed Audiobookshelf identity is absent, duplicated, aliased, or
  differs from its exact declared non-secret state.
audiobookshelf_managed_users_plan_create_message: AUDIOBOOKSHELF_PLAN_MANAGED_USER_CREATE
audiobookshelf_managed_users_plan_repair_message: AUDIOBOOKSHELF_PLAN_MANAGED_USER_REPAIR
