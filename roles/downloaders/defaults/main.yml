---
downloaders_platform_project_name: "{{ platform_project_name | default('') }}"
downloaders_compose_project_name: >-
  {{ (downloaders_platform_project_name ~ '-downloaders')
     if downloaders_platform_project_name | length > 0 else 'downloaders' }}
downloaders_sabnzbd_port: 8085
downloaders_sabnzbd_api: "http://127.0.0.1:{{ downloaders_sabnzbd_port }}/api"
downloaders_sabnzbd_config_host_path: "{{ nas_docker_root }}/sabnzbd/config"
# Each publisher carries its own copy of this endpoint.
downloaders_pushover_api_url: https://api.pushover.net/1/messages.json
downloaders_movies_host_path: "{{ nas_media_root }}/Media/Movies"
downloaders_series_host_path: "{{ nas_media_root }}/Media/Series"

media_usenet_enabled: false
media_acquisition_adopt_existing_libraries: false

# Undeclared is valid: the host (operator policy since #298, not a credential)
# says which state this target is in. tasks/main.yml asserts host and
# credentials agree before this is read.
downloaders_usenet_provider_declared: >-
  {{ media_usenet_provider.host | length > 0 }}

downloaders_sabnzbd_categories:
  movies: /data/media/.acquisition/usenet/movies
  series: /data/media/.acquisition/usenet/series
  ebooks: /data/books/.acquisition/usenet/ebooks
  audiobooks: /data/media/.acquisition/usenet/audiobooks
  comics: /data/books/.acquisition/usenet/comics

# 3 is Repair/Unpack/Delete: Unpackerr does no par2 and holds no archive
# password, so SABnzbd must unpack Usenet downloads. An integer, compared
# stringified on both sides.
downloaders_sabnzbd_category_post_processing: 3

# The file the compose mount puts in `script_dir`; SABnzbd's "no script" is "None".
downloaders_sabnzbd_category_script: clamav_gate.py

# Both sides of every `misc` comparison are normalised: SABnzbd reads back a
# never-stored default as 0/1 and a stored flag as JSON true/false. Declare
# integers: `int_conv('True')` is 0, so YAML `true` would store FALSE.
downloaders_sabnzbd_owned_misc:
  cache_limit: 256M
  direct_unpack: 0
  direct_unpack_threads: 1
  direct_write: 1
  max_art_tries: 3
  # SABnzbd offers a script to a category only from this directory.
  script_dir: /scripts
  # What makes the gate a gate: with 1 a failed script fails the job instead of
  # importing it. The gate now exits non-zero only on INFECTED (#811); see
  # services/downloaders/clamav_gate.py.
  script_can_fail: 1

# `set_config` upserts on this INI section name; the provider itself is vault-authored.
downloaders_sabnzbd_server_name: usenet

# Every field reads back unmasked, so all are compared and reverted. `enable` is
# 0/1 because `bool_conv(int_conv())` stores `true` as 0. ssl_verify 3 (Strict)
# is the only value that verifies chain and hostname.
downloaders_sabnzbd_owned_server:
  enable: 1
  priority: 0
  ssl_verify: 3
  timeout: 60
