---
argument_specs:
  main:
    short_description: Deploy and reconcile the Phase 1 Usenet downloader project
    options:
      media_usenet_enabled:
        type: bool
        required: false
      media_acquisition_adopt_existing_libraries:
        type: bool
        required: false
      downloaders_sabnzbd_config_host_path:
        type: path
        required: false
      downloaders_movies_host_path:
        type: path
        required: false
      downloaders_series_host_path:
        type: path
        required: false
      platform_media_control_network:
        type: str
        required: true
      platform_project_name:
        type: str
        required: false
      downloaders_platform_project_name:
        type: str
        required: false
      downloaders_sabnzbd_categories:
        type: dict
        required: false
      downloaders_sabnzbd_owned_misc:
        type: dict
        required: false
      downloaders_sabnzbd_category_post_processing:
        type: int
        required: false
      downloaders_sabnzbd_category_script:
        type: str
        required: false
      downloaders_sabnzbd_server_name:
        type: str
        required: false
      downloaders_sabnzbd_owned_server:
        type: dict
        required: false
      downloaders_usenet_provider_declared:
        type: bool
        required: false
      vault_downloaders_sabnzbd_api_key:
        type: str
        required: true
      vault_downloaders_sabnzbd_admin_username:
        type: str
        required: true
      vault_downloaders_sabnzbd_admin_password:
        type: str
        required: true
      # The operator-owned half of the provider, typed rather than the six vault
      # strings it replaced (#298). Ansible validates these suboptions before any
      # task runs, and it coerces as well as checks, so `port: "563"` becomes the
      # integer and `ssl: "true"` becomes the boolean rather than reaching
      # SABnzbd as a string it would store as 0. The range and hostname rules
      # that coercion cannot express live in
      # filter_plugins/media_usenet_provider.py and are asserted in tasks/main.yml.
      media_usenet_provider:
        type: dict
        required: true
        options:
          host:
            type: str
            required: true
          port:
            type: int
            required: true
          connections:
            type: int
            required: true
          ssl:
            type: bool
            required: true
      vault_downloaders_sabnzbd_server_username:
        type: str
        required: true
      vault_downloaders_sabnzbd_server_password:
        type: str
        required: true
      vault_arr_radarr_api_key:
        type: str
        required: true
      vault_arr_sonarr_api_key:
        type: str
        required: true
      downloaders_pushover_api_url:
        type: str
        required: false
      # The post-processing gate reads these two out of the container
      # environment this role renders, and pages on the Alerts application when
      # it imports a job it could not scan (#811). They are `required: true`
      # like every other vault credential a role reads: the Compose file refuses
      # to start SABnzbd without them (`${PUSHOVER_ALERTS_TOKEN:?}`), so a
      # missing one is better reported here, by name, than as a Compose
      # variable error at the deployment task.
      vault_pushover_alerts_token:
        type: str
        required: true
      vault_pushover_user_key:
        type: str
        required: true
