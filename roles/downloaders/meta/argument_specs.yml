---
argument_specs:
  main:
    short_description: Deploy and reconcile the Phase 1 Usenet downloader project
    options:
      media_usenet_enabled:
        type: bool
        required: false
      media_acquisition_adopt_existing_libraries:
        type: bool
        required: false
      downloaders_sabnzbd_config_host_path:
        type: path
        required: false
      downloaders_movies_host_path:
        type: path
        required: false
      downloaders_series_host_path:
        type: path
        required: false
      platform_media_control_network:
        type: str
        required: true
      platform_project_name:
        type: str
        required: false
      downloaders_platform_project_name:
        type: str
        required: false
      downloaders_sabnzbd_categories:
        type: dict
        required: false
      downloaders_sabnzbd_owned_misc:
        type: dict
        required: false
      downloaders_sabnzbd_category_post_processing:
        type: int
        required: false
      downloaders_sabnzbd_category_script:
        type: str
        required: false
      downloaders_sabnzbd_server_name:
        type: str
        required: false
      downloaders_sabnzbd_owned_server:
        type: dict
        required: false
      downloaders_usenet_provider_declared:
        type: bool
        required: false
      vault_downloaders_sabnzbd_api_key:
        type: str
        required: true
      vault_downloaders_sabnzbd_admin_username:
        type: str
        required: true
      vault_downloaders_sabnzbd_admin_password:
        type: str
        required: true
      # Typed provider settings (#298). Ansible coerces as well as checks, so "563"
      # reaches SABnzbd as an integer; range and hostname rules live in
      # filter_plugins/media_usenet_provider.py.
      media_usenet_provider:
        type: dict
        required: true
        options:
          host:
            type: str
            required: true
          port:
            type: int
            required: true
          connections:
            type: int
            required: true
          ssl:
            type: bool
            required: true
      vault_downloaders_sabnzbd_server_username:
        type: str
        required: true
      vault_downloaders_sabnzbd_server_password:
        type: str
        required: true
      vault_arr_radarr_api_key:
        type: str
        required: true
      vault_arr_sonarr_api_key:
        type: str
        required: true
      downloaders_pushover_api_url:
        type: str
        required: false
      # Read by the post-processing gate to page on unscanned imports (#811); required
      # so a missing one is named here rather than as a Compose variable error.
      vault_pushover_alerts_token:
        type: str
        required: true
      vault_pushover_user_key:
        type: str
        required: true
