---
- name: Read SABnzbd owned configuration before reconciliation
  ansible.builtin.uri:
    url: >-
      {{ downloaders_sabnzbd_api }}?mode=get_config&output=json&apikey={{
         vault_downloaders_sabnzbd_api_key | urlencode }}
    method: GET
    status_code: [200]
    return_content: true
  register: downloaders_sabnzbd_config_before
  changed_when: false
  check_mode: false
  no_log: true

- name: Require a complete SABnzbd configuration response
  ansible.builtin.assert:
    that:
      - downloaders_sabnzbd_config_before.json is mapping
      - downloaders_sabnzbd_config_before.json.config is mapping
      - downloaders_sabnzbd_config_before.json.config.misc is mapping
      - downloaders_sabnzbd_config_before.json.config.categories is sequence
    fail_msg: SABnzbd returned an unsupported configuration schema before reconciliation.

- name: Reconcile bounded SABnzbd miscellaneous settings
  ansible.builtin.uri:
    url: >-
      {{ downloaders_sabnzbd_api }}?mode=set_config&section=misc&keyword={{ item.key | urlencode
      }}&value={{ item.value | string | urlencode }}&output=json&apikey={{
      vault_downloaders_sabnzbd_api_key | urlencode }}
    method: GET
    status_code: [200]
    return_content: true
  loop: "{{ downloaders_sabnzbd_owned_misc | dict2items }}"
  loop_control:
    label: sabnzbd-owned-misc-setting
  # Normalised on both sides; roles/downloaders/defaults/main.yml records why.
  when: >-
    downloaders_sabnzbd_config_before.json.config.misc.get(item.key)
      | string | lower | replace('true', '1') | replace('false', '0') !=
    item.value | string | lower | replace('true', '1') | replace('false', '0')
  changed_when: true
  no_log: true

- name: Reconcile SABnzbd categories
  ansible.builtin.uri:
    url: >-
      {{ downloaders_sabnzbd_api }}?mode=set_config&section=categories&name={{ item.key | urlencode
      }}&dir={{ item.value | urlencode }}&pp={{
      downloaders_sabnzbd_category_post_processing | string | urlencode
      }}&script={{ downloaders_sabnzbd_category_script | urlencode
      }}&priority=-100&output=json&apikey={{
      vault_downloaders_sabnzbd_api_key | urlencode }}
    method: GET
    status_code: [200]
    return_content: true
  loop: "{{ downloaders_sabnzbd_categories | dict2items }}"
  loop_control:
    label: sabnzbd-category
  # All three owned fields are compared, not just the directory; otherwise a
  # matching host would never be sent `pp` or the gate script. get_config returns
  # `pp` as a string, hence both sides stringified.
  when: >-
    (downloaders_sabnzbd_config_before.json.config.categories |
     selectattr('name', 'equalto', item.key) | map(attribute='dir') |
     first | default('') != item.value) or
    (downloaders_sabnzbd_config_before.json.config.categories |
     selectattr('name', 'equalto', item.key) | map(attribute='pp') |
     first | default('') | string !=
     downloaders_sabnzbd_category_post_processing | string) or
    (downloaders_sabnzbd_config_before.json.config.categories |
     selectattr('name', 'equalto', item.key) | map(attribute='script') |
     first | default('') | string !=
     downloaders_sabnzbd_category_script | string)
  changed_when: true
  no_log: true

# Reachable only when a provider is declared; verify.yml asserts the
# undeclared state. One block so the gate is a single condition.
- name: Reconcile the declared Usenet server
  when: downloaders_usenet_provider_declared | bool
  block:
    # `servers` exists only once a server does, so the lookup defaults.
    - name: Find the operator-owned SABnzbd Usenet server
      ansible.builtin.set_fact:
        downloaders_sabnzbd_server_matches: >-
          {{ downloaders_sabnzbd_config_before.json.config.servers | default([]) |
             selectattr('name', 'equalto', downloaders_sabnzbd_server_name) | list }}
        downloaders_sabnzbd_server_desired: >-
          {{ downloaders_sabnzbd_owned_server |
             combine({
               'host': media_usenet_provider.host,
               'port': media_usenet_provider.port,
               'username': vault_downloaders_sabnzbd_server_username,
               'password': vault_downloaders_sabnzbd_server_password,
               'connections': media_usenet_provider.connections,
               'ssl': media_usenet_provider.ssl | int
             }) }}
      changed_when: false
      no_log: true

    # The API masks the password, so it is projected out and the vault-side
    # fingerprint below notices a rotation.
    - name: Build the owned SABnzbd Usenet server projections
      ansible.builtin.set_fact:
        downloaders_sabnzbd_server_current_projection: >-
          {{ (downloaders_sabnzbd_server_matches | first | default({}) | dict2items |
              selectattr('key', 'in', downloaders_sabnzbd_server_comparable_keys) |
              items2dict) if downloaders_sabnzbd_server_matches | length == 1 else {} }}
        downloaders_sabnzbd_server_desired_projection: >-
          {{ downloaders_sabnzbd_server_desired | dict2items |
             selectattr('key', 'in', downloaders_sabnzbd_server_comparable_keys) |
             items2dict }}
      vars:
        downloaders_sabnzbd_server_comparable_keys: >-
          {{ downloaders_sabnzbd_server_desired.keys() |
             reject('equalto', 'password') | list }}
      changed_when: false
      no_log: true

    - name: Determine whether the SABnzbd Usenet server differs
      ansible.builtin.set_fact:
        downloaders_sabnzbd_server_needs_update: >-
          {{ downloaders_sabnzbd_server_matches | length != 1 or
             downloaders_sabnzbd_server_current_projection !=
               downloaders_sabnzbd_server_desired_projection or
             arr_installed_reconciliation_fingerprints.downloaders_usenet_server !=
               arr_desired_reconciliation_fingerprints.downloaders_usenet_server }}
      changed_when: false
      no_log: true

    # set_config on `servers` is an upsert keyed by `keyword`. The credential goes
    # in the form body so it stays out of anything that records a URL.
    - name: Reconcile the operator-owned SABnzbd Usenet server
      ansible.builtin.uri:
        url: "{{ downloaders_sabnzbd_api }}"
        method: POST
        body_format: form-urlencoded
        body:
          mode: set_config
          section: servers
          keyword: "{{ downloaders_sabnzbd_server_name }}"
          host: "{{ media_usenet_provider.host }}"
          port: "{{ media_usenet_provider.port }}"
          username: "{{ vault_downloaders_sabnzbd_server_username }}"
          password: "{{ vault_downloaders_sabnzbd_server_password }}"
          connections: "{{ media_usenet_provider.connections }}"
          # `| int` is load-bearing: set_config parses the flag with bool_conv(int_conv()),
          # so `True` would be stored as 0 and silently disable TLS.
          ssl: "{{ media_usenet_provider.ssl | int }}"
          enable: "{{ downloaders_sabnzbd_owned_server.enable }}"
          priority: "{{ downloaders_sabnzbd_owned_server.priority }}"
          ssl_verify: "{{ downloaders_sabnzbd_owned_server.ssl_verify }}"
          timeout: "{{ downloaders_sabnzbd_owned_server.timeout }}"
          output: json
          apikey: "{{ vault_downloaders_sabnzbd_api_key }}"
        status_code: [200]
        return_content: true
      when: downloaders_sabnzbd_server_needs_update | bool
      changed_when: true
      no_log: true
