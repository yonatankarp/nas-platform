---
- name: Read SABnzbd owned configuration before reconciliation
  ansible.builtin.uri:
    url: >-
      {{ downloaders_sabnzbd_api }}?mode=get_config&output=json&apikey={{
         vault_downloaders_sabnzbd_api_key | urlencode }}
    method: GET
    status_code: [200]
    return_content: true
  register: downloaders_sabnzbd_config_before
  changed_when: false
  check_mode: false
  no_log: true

- name: Require a complete SABnzbd configuration response
  ansible.builtin.assert:
    that:
      - downloaders_sabnzbd_config_before.json is mapping
      - downloaders_sabnzbd_config_before.json.config is mapping
      - downloaders_sabnzbd_config_before.json.config.misc is mapping
      - downloaders_sabnzbd_config_before.json.config.categories is sequence
    fail_msg: SABnzbd returned an unsupported configuration schema before reconciliation.

- name: Reconcile bounded SABnzbd miscellaneous settings
  ansible.builtin.uri:
    url: >-
      {{ downloaders_sabnzbd_api }}?mode=set_config&section=misc&keyword={{ item.key | urlencode
      }}&value={{ item.value | string | urlencode }}&output=json&apikey={{
      vault_downloaders_sabnzbd_api_key | urlencode }}
    method: GET
    status_code: [200]
    return_content: true
  loop: "{{ downloaders_sabnzbd_owned_misc | dict2items }}"
  loop_control:
    label: sabnzbd-owned-misc-setting
  when: >-
    downloaders_sabnzbd_config_before.json.config.misc.get(item.key) | string !=
    item.value | string
  changed_when: true
  no_log: true

- name: Reconcile SABnzbd categories
  ansible.builtin.uri:
    url: >-
      {{ downloaders_sabnzbd_api }}?mode=set_config&section=categories&name={{ item.key | urlencode
      }}&dir={{ item.value | urlencode }}&pp={{
      downloaders_sabnzbd_category_post_processing | string | urlencode
      }}&script=None&priority=-100&output=json&apikey={{
      vault_downloaders_sabnzbd_api_key | urlencode }}
    method: GET
    status_code: [200]
    return_content: true
  loop: "{{ downloaders_sabnzbd_categories | dict2items }}"
  loop_control:
    label: sabnzbd-category
  # Both owned fields are compared, not just the directory. `pp` was written as
  # a literal here and in the bootstrap template, so the only thing that ever
  # decided whether this request ran was the destination -- and a host whose
  # directories already matched would keep whatever post-processing level it was
  # first created with, for ever. SABnzbd answers `get_config` with `pp` as a
  # JSON string, so both sides are stringified rather than trusting the type.
  when: >-
    (downloaders_sabnzbd_config_before.json.config.categories |
     selectattr('name', 'equalto', item.key) | map(attribute='dir') |
     first | default('') != item.value) or
    (downloaders_sabnzbd_config_before.json.config.categories |
     selectattr('name', 'equalto', item.key) | map(attribute='pp') |
     first | default('') | string !=
     downloaders_sabnzbd_category_post_processing | string)
  changed_when: true
  no_log: true

# Everything below reconciles the one Usenet server the platform owns, and it is
# reachable only when a provider is declared. An undeclared provider has no host,
# port, account or connection count to push, so there is nothing here to
# reconcile towards -- `verify.yml` asserts the complementary state instead, that
# no server carries the owned name. The whole section is one block so the gate is
# a single condition rather than four that could drift apart.
- name: Reconcile the declared Usenet server
  when: downloaders_usenet_provider_declared | bool
  block:
    # SABnzbd creates the `servers` section only when a server exists, so a NAS
    # that has never had a provider answers `get_config` with no `servers` key at
    # all. That is the bootstrap case this reconciliation exists for, so the
    # lookup defaults rather than indexing.
    - name: Find the operator-owned SABnzbd Usenet server
      ansible.builtin.set_fact:
        downloaders_sabnzbd_server_matches: >-
          {{ downloaders_sabnzbd_config_before.json.config.servers | default([]) |
             selectattr('name', 'equalto', downloaders_sabnzbd_server_name) | list }}
        downloaders_sabnzbd_server_desired: >-
          {{ downloaders_sabnzbd_owned_server |
             combine({
               'host': media_usenet_provider.host,
               'port': media_usenet_provider.port,
               'username': vault_downloaders_sabnzbd_server_username,
               'password': vault_downloaders_sabnzbd_server_password,
               'connections': media_usenet_provider.connections,
               'ssl': media_usenet_provider.ssl | int
             }) }}
      changed_when: false
      no_log: true

    # `get_dict(for_public_api=True)` replaces the password with ten asterisks
    # and leaves every other field plain, so the password is the one owned field
    # that cannot be compared. It is projected out of both sides and the
    # vault-side fingerprint below is what notices a rotation.
    - name: Build the owned SABnzbd Usenet server projections
      ansible.builtin.set_fact:
        downloaders_sabnzbd_server_current_projection: >-
          {{ (downloaders_sabnzbd_server_matches | first | default({}) | dict2items |
              selectattr('key', 'in', downloaders_sabnzbd_server_comparable_keys) |
              items2dict) if downloaders_sabnzbd_server_matches | length == 1 else {} }}
        downloaders_sabnzbd_server_desired_projection: >-
          {{ downloaders_sabnzbd_server_desired | dict2items |
             selectattr('key', 'in', downloaders_sabnzbd_server_comparable_keys) |
             items2dict }}
      vars:
        downloaders_sabnzbd_server_comparable_keys: >-
          {{ downloaders_sabnzbd_server_desired.keys() |
             reject('equalto', 'password') | list }}
      changed_when: false
      no_log: true

    - name: Determine whether the SABnzbd Usenet server differs
      ansible.builtin.set_fact:
        downloaders_sabnzbd_server_needs_update: >-
          {{ downloaders_sabnzbd_server_matches | length != 1 or
             downloaders_sabnzbd_server_current_projection !=
               downloaders_sabnzbd_server_desired_projection or
             arr_installed_reconciliation_fingerprints.downloaders_usenet_server !=
               arr_desired_reconciliation_fingerprints.downloaders_usenet_server }}
      changed_when: false
      no_log: true

    # `mode=set_config&section=servers` is an upsert keyed by `keyword`: SABnzbd
    # merges the parameters it recognises into an existing server of that name
    # and creates one otherwise, then calls `Downloader.update_server`, so a
    # single request is the whole operation and no restart or second mode is
    # needed. Only the fields named here are touched.
    #
    # This is the one call in the role that carries a third-party credential, and
    # it is the one that does not put its parameters in the URL. SABnzbd's own
    # request log prints the whole parameter dict either way once debug logging
    # is on, so the form body is not what keeps the password out of
    # `sabnzbd.log`; it keeps it out of anything that records a URL, which is
    # every access log, proxy and history this platform does not control today
    # and might tomorrow. CherryPy merges a form-urlencoded body into the
    # handler's keyword arguments, so the request SABnzbd sees is identical.
    - name: Reconcile the operator-owned SABnzbd Usenet server
      ansible.builtin.uri:
        url: "{{ downloaders_sabnzbd_api }}"
        method: POST
        body_format: form-urlencoded
        body:
          mode: set_config
          section: servers
          keyword: "{{ downloaders_sabnzbd_server_name }}"
          host: "{{ media_usenet_provider.host }}"
          port: "{{ media_usenet_provider.port }}"
          username: "{{ vault_downloaders_sabnzbd_server_username }}"
          password: "{{ vault_downloaders_sabnzbd_server_password }}"
          connections: "{{ media_usenet_provider.connections }}"
          # `| int` is load-bearing. `set_config` parses a server flag with
          # `bool_conv(int_conv())`, so the boolean rendered as `True` would be
          # stored as 0 -- a TLS connection silently disabled on a server that
          # still reads as configured for it. The declaration is a boolean
          # because that is the only spelling this cannot go wrong from.
          ssl: "{{ media_usenet_provider.ssl | int }}"
          enable: "{{ downloaders_sabnzbd_owned_server.enable }}"
          priority: "{{ downloaders_sabnzbd_owned_server.priority }}"
          ssl_verify: "{{ downloaders_sabnzbd_owned_server.ssl_verify }}"
          timeout: "{{ downloaders_sabnzbd_owned_server.timeout }}"
          output: json
          apikey: "{{ vault_downloaders_sabnzbd_api_key }}"
        status_code: [200]
        return_content: true
      when: downloaders_sabnzbd_server_needs_update | bool
      changed_when: true
      no_log: true
