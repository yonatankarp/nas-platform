---
- name: Guard downloader critical state before Phase 1 activation
  ansible.builtin.include_tasks: state_guard.yml
  when: media_usenet_enabled | bool

- name: Revalidate deployment paths before downloader runtime use
  ansible.builtin.include_role:
    name: deployment_bundle
    tasks_from: target
  vars:
    deployment_target_service: downloaders
    deployment_target_require_current_release: true
    deployment_target_extra_paths:
      - "{{ downloaders_sabnzbd_config_host_path }}"
      # SABnzbd bind-mounts the post-processing gate out of the release.
      - "{{ platform_current_dir }}/services/downloaders/clamav_gate.py"

- name: Require INI-safe SABnzbd administrator credentials
  ansible.builtin.assert:
    that:
      - vault_downloaders_sabnzbd_admin_username is match('^[^\r\n]+$')
      - vault_downloaders_sabnzbd_admin_password is match('^[^\r\n]+$')
    fail_msg: SABnzbd administrator credentials must be nonempty single-line values.
  no_log: true

# SABnzbd normalises host, port and connection count; a value it would rewrite
# never equals the declared one and would reconcile forever (#298). Ungated:
# an empty host is the undeclared shape, not a malformed one.
- name: Require a SABnzbd-storable Usenet provider policy
  ansible.builtin.assert:
    that: media_usenet_provider | media_usenet_provider_errors | length == 0
    fail_msg: >-
      The declared Usenet provider policy is malformed:
      {{ (media_usenet_provider | media_usenet_provider_errors) | join('; ') }}

# The credential contract no longer sees the host, so host and credentials must
# agree here, before everything that treats a declared provider as proof the
# credentials exist.
- name: Require both halves of the Usenet provider declaration to agree
  ansible.builtin.assert:
    that:
      - (media_usenet_provider.host | length > 0)
        == (vault_downloaders_sabnzbd_server_username | length > 0)
    fail_msg: >-
      A Usenet provider is half declared. media_usenet_provider.host in
      inventory and vault_downloaders_sabnzbd_server_username in the vault must
      either both be set or both be empty; the host says a subscription exists
      and the account name says who it belongs to.
  no_log: true

# sabnzbd.ini is one key per line and the account name is not escaped; OptionStr
# strips whitespace and OptionPassword.set drops all-asterisk values. Gated,
# because an undeclared provider has no credential to hold.
- name: Require INI-safe SABnzbd Usenet provider credentials
  ansible.builtin.assert:
    that:
      - vault_downloaders_sabnzbd_server_username is match('^\S([^\r\n]*\S)?\Z')
      - vault_downloaders_sabnzbd_server_password is match('^\S([^\r\n]*\S)?\Z')
      - vault_downloaders_sabnzbd_server_password is not match('^\*+\Z')
    fail_msg: >-
      SABnzbd Usenet provider credentials must be single-line values without
      leading or trailing whitespace, and the password must not be only asterisks.
  when: downloaders_usenet_provider_declared | bool
  no_log: true

# The gate's sha256 reaches a container label so an edited gate recreates
# SABnzbd; Docker resolves a bind source only at start (#810).
- name: Inspect the SABnzbd ClamAV gate carried by the release
  ansible.builtin.stat:
    path: "{{ platform_current_dir }}/services/downloaders/clamav_gate.py"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  register: downloaders_clamav_gate

# Under --check `current` is still the previous release, so the controller's
# byte-identical copy is hashed instead.
- name: Require the SABnzbd ClamAV gate to be a regular file
  ansible.builtin.assert:
    that:
      - >-
        (downloaders_clamav_gate.stat.exists and
         (downloaders_clamav_gate.stat.isreg | default(false)) and
         not (downloaders_clamav_gate.stat.islnk | default(false))) or
        (ansible_check_mode and not downloaders_clamav_gate.stat.exists)
    fail_msg: The SABnzbd ClamAV gate must be a regular file in the release.

- name: Resolve the SABnzbd ClamAV gate checksum
  ansible.builtin.set_fact:
    downloaders_clamav_gate_sha256: >-
      {{ downloaders_clamav_gate.stat.checksum if downloaders_clamav_gate.stat.exists
         else (lookup('ansible.builtin.file', playbook_dir ~ '/services/downloaders/clamav_gate.py', rstrip=false)
               | hash('sha256')) }}

- name: Require a sha256 for the SABnzbd ClamAV gate
  ansible.builtin.assert:
    that:
      - downloaders_clamav_gate_sha256 is match('^[0-9a-f]{64}$')
    fail_msg: The SABnzbd ClamAV gate checksum must be a sha256.

- name: Render the private downloader environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ platform_runtime_dir }}/services/downloaders/.env"
    mode: "0600"
  no_log: true

- name: Stop the disabled downloader project
  community.docker.docker_compose_v2:
    project_src: "{{ platform_current_dir }}/services/downloaders"
    project_name: "{{ downloaders_compose_project_name }}"
    files: "{{ platform_service_compose_files['downloaders'] }}"
    env_files: ["{{ platform_runtime_dir }}/services/downloaders/.env"]
    state: absent
    remove_orphans: true
  when: not media_usenet_enabled | bool

- name: Inspect SABnzbd bootstrap state
  ansible.builtin.stat:
    path: "{{ downloaders_sabnzbd_config_host_path }}/sabnzbd.ini"
  register: downloaders_sabnzbd_bootstrap_state
  when: media_usenet_enabled | bool
  changed_when: false

- name: Bootstrap SABnzbd from vault-authored credentials
  ansible.builtin.template:
    src: sabnzbd.ini.j2
    dest: "{{ downloaders_sabnzbd_config_host_path }}/sabnzbd.ini"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0600"
    force: false
  when:
    - media_usenet_enabled | bool
    - not downloaders_sabnzbd_bootstrap_state.stat.exists | bool
  no_log: true

# The rescue hands the failure to roles/container_health, which explains a
# crash-looping container Compose reports only as "unhealthy" (#509, #537).
- name: Deploy the Phase 1 downloader project, catching a container that runs but never serves
  when: media_usenet_enabled | bool
  block:
    - name: Deploy the Phase 1 downloader project
      community.docker.docker_compose_v2:
        project_src: "{{ platform_current_dir }}/services/downloaders"
        project_name: "{{ downloaders_compose_project_name }}"
        files: "{{ platform_service_compose_files['downloaders'] }}"
        env_files: ["{{ platform_runtime_dir }}/services/downloaders/.env"]
        state: present
        wait: true
        wait_timeout: "{{ platform_compose_wait_timeout }}"
      register: downloaders_deploy
  rescue:
    # First: ansible_failed_result belongs to whichever rescue is running.
    - name: Record the failed downloader deployment
      ansible.builtin.set_fact:
        downloaders_deploy_failure_message: >-
          {{ ansible_failed_result.msg
             | default('the downloader deployment failed and reported no message') }}

# A `Restarting` container still passes `docker container ls` (#510). This pass
# only detects and publishes the stuck list; the verdict follows the recreate.
- name: Detect a downloader container that runs but never serves
  ansible.builtin.include_role:
    name: container_health
  vars:
    container_health_service_name: downloaders
    container_health_project_name: "{{ downloaders_compose_project_name }}"
    container_health_deploy_failure_message: >-
      {{ downloaders_deploy_failure_message | default('') }}
    container_health_refuse: false
  when: media_usenet_enabled | bool

# At most one forced recreate per run, of only the stuck services, without
# deps. The list is empty on a converged host and under --check, which keeps
# this idempotent; the verdict below re-checks.
- name: Recreate a downloader container that runs but never serves
  when: media_usenet_enabled | bool
  block:
    - name: Force-recreate the stuck downloader services
      community.docker.docker_compose_v2:
        project_src: "{{ platform_current_dir }}/services/downloaders"
        project_name: "{{ downloaders_compose_project_name }}"
        files: "{{ platform_service_compose_files['downloaders'] }}"
        env_files: ["{{ platform_runtime_dir }}/services/downloaders/.env"]
        services: "{{ container_health_stuck_services }}"
        dependencies: false
        recreate: always
        state: present
        wait: true
        wait_timeout: "{{ platform_compose_wait_timeout }}"
      when: container_health_stuck_services | default([]) | length > 0
      register: downloaders_wedged_recreate
  rescue:
    # Carried, not re-raised: the re-check below diagnoses an unhealthy container
    # better, and the second pass re-raises any other failure.
    - name: Record the downloader recreate that did not recover the service
      ansible.builtin.set_fact:
        downloaders_recreate_failure_message: >-
          The force-recreate reported: {{ ansible_failed_result.msg
          | default('no message') }}

- name: Record whether a downloader recreate was spent
  ansible.builtin.set_fact:
    downloaders_recreate_spent: >-
      {{ container_health_stuck_services | default([]) | length > 0 }}
  when: media_usenet_enabled | bool

- name: Report the downloader wedged-container recovery check mode defers
  ansible.builtin.debug:
    msg: >-
      A live run would read every container of Compose project
      {{ downloaders_compose_project_name }} that Docker reports as restarting or
      unhealthy, print its state, force-recreate exactly those services once
      with no dependencies, and fail naming that retry if any of them came back
      stuck. Compose's dry run starts nothing and does not wait on container
      health, so check mode cannot reach that path and recreates nothing.
  when:
    - ansible_check_mode
    - media_usenet_enabled | bool

- name: Refuse a downloader container that stayed wedged after its recreate
  ansible.builtin.include_role:
    name: container_health
  vars:
    container_health_service_name: downloaders
    container_health_project_name: "{{ downloaders_compose_project_name }}"
    container_health_deploy_failure_message: >-
      {{ downloaders_recreate_failure_message | default('') }}
    container_health_retried: "{{ downloaders_recreate_spent }}"
  when: media_usenet_enabled | bool

- name: Load private Servarr desired-input fingerprint
  ansible.builtin.include_role:
    name: arr
    tasks_from: reconciliation_fingerprints
    apply:
      tags: [platform_verify_downloaders]
  vars:
    arr_reconciliation_fingerprint_subset: [servarr_sabnzbd, downloaders_usenet_server]
  when: media_usenet_enabled | bool
  tags: [platform_verify_downloaders]

- name: Initialize downloader relationship verification gate
  ansible.builtin.set_fact:
    downloaders_relationship_verification_succeeded: false
  changed_when: false
  when: media_usenet_enabled | bool

- name: Mark the ordinary downloader reconciliation cycle started
  ansible.builtin.set_fact:
    downloaders_reconciliation_cycle_started: true
  changed_when: false
  when: media_usenet_enabled | bool

- name: Reconcile SABnzbd owned settings
  ansible.builtin.include_tasks: reconcile_sabnzbd.yml
  when: media_usenet_enabled | bool

- name: Reconcile Arr download clients after SABnzbd startup
  ansible.builtin.include_role:
    name: arr
    tasks_from: reconcile_download_clients
  when: media_usenet_enabled | bool

- name: Report the downloader deployment
  ansible.builtin.include_role:
    name: deployment_bundle
    tasks_from: report
  vars:
    deployment_report_service: Downloaders
    # Both Compose results: a repairing force-recreate changed the deployment too.
    deployment_report_changed: >-
      {{ (downloaders_deploy is changed)
         or ((downloaders_wedged_recreate | default({})) is changed) }}
  when: media_usenet_enabled | bool

- name: Verify downloader effective container CPU policy
  ansible.builtin.include_role:
    name: container_cpu
  vars:
    container_cpu_service_name: downloaders
    container_cpu_project_name: "{{ downloaders_compose_project_name }}"
  when:
    - media_usenet_enabled | bool

- name: Run downloader service verification
  ansible.builtin.include_tasks:
    file: verify.yml
    apply:
      tags: [platform_verify_downloaders]
  when: media_usenet_enabled | bool
  tags: [platform_verify_downloaders]

- name: Persist verified Servarr desired-input fingerprint
  ansible.builtin.include_role:
    name: arr
    tasks_from: record_reconciliation_fingerprints
  vars:
    arr_reconciliation_fingerprint_subset: [servarr_sabnzbd, downloaders_usenet_server]
  when:
    - media_usenet_enabled | bool
    - not ansible_check_mode
    - downloaders_relationship_verification_succeeded is sameas true
