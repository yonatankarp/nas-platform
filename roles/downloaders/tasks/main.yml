---
- name: Guard downloader critical state before Phase 1 activation
  ansible.builtin.include_tasks: state_guard.yml
  when: media_usenet_enabled | bool

- name: Revalidate deployment paths before downloader runtime use
  ansible.builtin.include_role:
    name: deployment_bundle
    tasks_from: target
  vars:
    deployment_target_service: downloaders
    deployment_target_require_current_release: true
    deployment_target_extra_paths:
      - "{{ downloaders_sabnzbd_config_host_path }}"

- name: Require INI-safe SABnzbd administrator credentials
  ansible.builtin.assert:
    that:
      - vault_downloaders_sabnzbd_admin_username is match('^[^\r\n]+$')
      - vault_downloaders_sabnzbd_admin_password is match('^[^\r\n]+$')
    fail_msg: SABnzbd administrator credentials must be nonempty single-line values.
  no_log: true

# The operator-owned half of the provider, held to the rules SABnzbd's own
# normalization imposes: it lowercases and strips the host and clamps the port
# and the connection count, and a value it would rewrite can never equal the
# declared one, so the reconciliation below would push it again on every run for
# as long as it stood. These rules moved out of the credential contract with the
# values (#298); the filter names the offending field and never echoes a value,
# so this message is safe to print in full.
#
# Ungated on purpose. An undeclared provider is a valid state but a *malformed*
# declaration is not, and the filter already treats an empty host as the
# undeclared shape rather than as a bad one.
- name: Require a SABnzbd-storable Usenet provider policy
  ansible.builtin.assert:
    that: media_usenet_provider | media_usenet_provider_errors | length == 0
    fail_msg: >-
      The declared Usenet provider policy is malformed:
      {{ (media_usenet_provider | media_usenet_provider_errors) | join('; ') }}

# The invariant three consumers below depend on, and the one the split
# dissolved. The credential contract used to hold all six provider values in a
# single all-or-nothing group, so a non-empty host proved the credentials existed
# too and `downloaders_usenet_provider_declared` was sufficient on its own. The
# contract now sees only the two credentials and cannot see the host, so nothing
# else would notice a host declared with no account, or an account with no host
# -- the first reconciles a server that cannot authenticate, the second leaves a
# paid subscription silently unused.
#
# This runs before the provider credential guard below, before
# reconcile_sabnzbd.yml and before verify.yml, because every one of them reads
# that variable as proof the credentials are there.
- name: Require both halves of the Usenet provider declaration to agree
  ansible.builtin.assert:
    that:
      - (media_usenet_provider.host | length > 0)
        == (vault_downloaders_sabnzbd_server_username | length > 0)
    fail_msg: >-
      A Usenet provider is half declared. media_usenet_provider.host in
      inventory and vault_downloaders_sabnzbd_server_username in the vault must
      either both be set or both be empty; the host says a subscription exists
      and the account name says who it belongs to.
  no_log: true

# SABnzbd writes what it is given into `sabnzbd.ini`, whose grammar is one key
# per line. It hex-encodes a password carrying a control character but does
# nothing of the sort for the account name, so a newline there corrupts the file
# SABnzbd itself writes. The surrounding whitespace rule is `OptionStr`, which
# strips the name before storing it, and a value SABnzbd rewrites can never
# equal the declared one. The asterisk rule is `OptionPassword.set`, which
# silently discards a value that is all asterisks because that is what its own
# masked read-back looks like.
#
# These rules reject an empty value, which is what an undeclared provider is, so
# the guard is gated rather than relaxed: a declared provider is held to every
# rule and an undeclared one has no credential to hold. Left ungated it refused
# to deploy anything at all on a target with no Usenet subscription.
- name: Require INI-safe SABnzbd Usenet provider credentials
  ansible.builtin.assert:
    that:
      - vault_downloaders_sabnzbd_server_username is match('^\S([^\r\n]*\S)?\Z')
      - vault_downloaders_sabnzbd_server_password is match('^\S([^\r\n]*\S)?\Z')
      - vault_downloaders_sabnzbd_server_password is not match('^\*+\Z')
    fail_msg: >-
      SABnzbd Usenet provider credentials must be single-line values without
      leading or trailing whitespace, and the password must not be only asterisks.
  when: downloaders_usenet_provider_declared | bool
  no_log: true

- name: Render the private downloader environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ platform_runtime_dir }}/services/downloaders/.env"
    mode: "0600"
  no_log: true

- name: Stop the disabled downloader project
  community.docker.docker_compose_v2:
    project_src: "{{ platform_current_dir }}/services/downloaders"
    project_name: "{{ downloaders_compose_project_name }}"
    files: "{{ platform_service_compose_files['downloaders'] }}"
    env_files: ["{{ platform_runtime_dir }}/services/downloaders/.env"]
    state: absent
    remove_orphans: true
  when: not media_usenet_enabled | bool
  register: downloaders_stop

- name: Inspect SABnzbd bootstrap state
  ansible.builtin.stat:
    path: "{{ downloaders_sabnzbd_config_host_path }}/sabnzbd.ini"
  register: downloaders_sabnzbd_bootstrap_state
  when: media_usenet_enabled | bool
  changed_when: false

- name: Bootstrap SABnzbd from vault-authored credentials
  ansible.builtin.template:
    src: sabnzbd.ini.j2
    dest: "{{ downloaders_sabnzbd_config_host_path }}/sabnzbd.ini"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0600"
    force: false
  when:
    - media_usenet_enabled | bool
    - not downloaders_sabnzbd_bootstrap_state.stat.exists | bool
  no_log: true

# The block exists for one thing the rescue does with the failure: it hands the
# deployment's own message to roles/container_health, which either explains it in
# terms of the container state Docker reports or re-raises it unchanged.
# Compose's `--wait` fails a crash-looping container with "container ... is
# unhealthy", which says nothing about why. roles/bindery/tasks/main.yml carries
# the long form of this argument; #509 built the mechanism and #537 wired the
# remaining eleven single-`up` roles into it.
- name: Deploy the Phase 1 downloader project, catching a container that runs but never serves
  block:
    - name: Deploy the Phase 1 downloader project
      community.docker.docker_compose_v2:
        project_src: "{{ platform_current_dir }}/services/downloaders"
        project_name: "{{ downloaders_compose_project_name }}"
        files: "{{ platform_service_compose_files['downloaders'] }}"
        env_files: ["{{ platform_runtime_dir }}/services/downloaders/.env"]
        state: present
        wait: true
        wait_timeout: "{{ platform_compose_wait_timeout }}"
      register: downloaders_deploy
  rescue:
    # First, and before anything else can rebind it: ansible_failed_result
    # belongs to whichever rescue is running.
    - name: Record the failed downloader deployment
      ansible.builtin.set_fact:
        downloaders_deploy_failure_message: >-
          {{ ansible_failed_result.msg
             | default('the downloader deployment failed and reported no message') }}
  when: media_usenet_enabled | bool

# Immediately after the deployment and before everything that trusts it. A
# container in `Restarting` still appears in `docker container ls --quiet`, so
# the CPU verification below would sail straight past one and the readiness probe
# after it would fail on a timeout that names nothing (#510).
#
# This pass detects, prints the evidence and publishes
# container_health_stuck_services WITHOUT refusing, because the recreate below
# has to happen before the verdict. It still re-raises a deployment failure that
# no stuck container explains.
- name: Detect a downloader container that runs but never serves
  ansible.builtin.include_role:
    name: container_health
  vars:
    container_health_service_name: downloaders
    container_health_project_name: "{{ downloaders_compose_project_name }}"
    container_health_deploy_failure_message: >-
      {{ downloaders_deploy_failure_message | default('') }}
    container_health_refuse: false
  when: media_usenet_enabled | bool

# EXACTLY ONE force-recreate, of only the services Docker says are stuck.
# FORCED, because `up -d` against an unchanged specification keeps the same
# container and recreates nothing; `dependencies: false` renders as --no-deps, so
# a healthy sibling in the same project is not taken down to repair one container.
# CONDITIONAL, and that condition is the whole idempotence argument: the list is
# empty on a converged host and empty under --check, so this task is skipped on
# every run that has nothing to repair. BOUNDED AT ONE PER RUN by being a single
# task rather than a loop, with the verdict below re-checking, so a container
# looping for a reason a recreate cannot fix never goes green and never becomes
# an invisible retry loop.
- name: Recreate a downloader container that runs but never serves
  block:
    - name: Force-recreate the stuck downloader services
      community.docker.docker_compose_v2:
        project_src: "{{ platform_current_dir }}/services/downloaders"
        project_name: "{{ downloaders_compose_project_name }}"
        files: "{{ platform_service_compose_files['downloaders'] }}"
        env_files: ["{{ platform_runtime_dir }}/services/downloaders/.env"]
        services: "{{ container_health_stuck_services }}"
        dependencies: false
        recreate: always
        state: present
        wait: true
        wait_timeout: "{{ platform_compose_wait_timeout }}"
      when: container_health_stuck_services | default([]) | length > 0
      register: downloaders_wedged_recreate
  rescue:
    # Carried rather than re-raised here. `--wait` fails a container that came
    # back unhealthy, which the re-check below diagnoses far better than Compose
    # can; a recreate that failed for any OTHER reason left no stuck container
    # behind, and the second pass re-raises this message unchanged for that case.
    - name: Record the downloader recreate that did not recover the service
      ansible.builtin.set_fact:
        downloaders_recreate_failure_message: >-
          The force-recreate reported: {{ ansible_failed_result.msg
          | default('no message') }}
  when: media_usenet_enabled | bool

# Whether a recreate was actually spent, recorded before the second pass
# overwrites the list it was decided from.
- name: Record whether a downloader recreate was spent
  ansible.builtin.set_fact:
    downloaders_recreate_spent: >-
      {{ container_health_stuck_services | default([]) | length > 0 }}
  when: media_usenet_enabled | bool

- name: Report the downloader wedged-container recovery check mode defers
  ansible.builtin.debug:
    msg: >-
      A live run would read every container of Compose project
      {{ downloaders_compose_project_name }} that Docker reports as restarting or
      unhealthy, print its state, force-recreate exactly those services once
      with no dependencies, and fail naming that retry if any of them came back
      stuck. Compose's dry run starts nothing and does not wait on container
      health, so check mode cannot reach that path and recreates nothing.
  when:
    - ansible_check_mode
    - media_usenet_enabled | bool

# The verdict. Nothing stuck here means the recreate worked, or that there was
# never anything to repair; either way the run continues. Anything still stuck
# fails, and says the retry has already been spent.
- name: Refuse a downloader container that stayed wedged after its recreate
  ansible.builtin.include_role:
    name: container_health
  vars:
    container_health_service_name: downloaders
    container_health_project_name: "{{ downloaders_compose_project_name }}"
    container_health_deploy_failure_message: >-
      {{ downloaders_recreate_failure_message | default('') }}
    container_health_retried: "{{ downloaders_recreate_spent }}"
  when: media_usenet_enabled | bool

- name: Load private Servarr desired-input fingerprint
  ansible.builtin.include_role:
    name: arr
    tasks_from: reconciliation_fingerprints
    apply:
      tags: [platform_verify_downloaders]
  vars:
    arr_reconciliation_fingerprint_subset: [servarr_sabnzbd, downloaders_usenet_server]
  when: media_usenet_enabled | bool
  tags: [platform_verify_downloaders]

- name: Initialize downloader relationship verification gate
  ansible.builtin.set_fact:
    downloaders_relationship_verification_succeeded: false
  changed_when: false
  when: media_usenet_enabled | bool

- name: Mark the ordinary downloader reconciliation cycle started
  ansible.builtin.set_fact:
    downloaders_reconciliation_cycle_started: true
  changed_when: false
  when: media_usenet_enabled | bool

- name: Reconcile SABnzbd owned settings
  ansible.builtin.include_tasks: reconcile_sabnzbd.yml
  when: media_usenet_enabled | bool

- name: Reconcile Arr download clients after SABnzbd startup
  ansible.builtin.include_role:
    name: arr
    tasks_from: reconcile_download_clients
  when: media_usenet_enabled | bool

- name: Report the downloader deployment
  ansible.builtin.include_role:
    name: ntfy
    tasks_from: deployment_report
  vars:
    ntfy_deployment_report_service: Downloaders
    # Both Compose results, because a force-recreate that repaired a wedged
    # container changed the deployment as surely as the deploy above did, and a
    # report gated on the deploy alone would say nothing on the one converge an
    # operator most wants to hear about. It is registered even when skipped, and
    # `default({})` covers the paths that never reach it at all.
    ntfy_deployment_report_changed: >-
      {{ (downloaders_deploy is changed)
         or ((downloaders_wedged_recreate | default({})) is changed) }}
  when: media_usenet_enabled | bool

- name: Verify downloader effective container CPU policy
  ansible.builtin.include_role:
    name: container_cpu
  vars:
    container_cpu_service_name: downloaders
    container_cpu_project_name: "{{ downloaders_compose_project_name }}"
  when:
    - media_usenet_enabled | bool

- name: Run downloader service verification
  ansible.builtin.include_tasks:
    file: verify.yml
    apply:
      tags: [platform_verify_downloaders]
  when: media_usenet_enabled | bool
  tags: [platform_verify_downloaders]

- name: Persist verified Servarr desired-input fingerprint
  ansible.builtin.include_role:
    name: arr
    tasks_from: record_reconciliation_fingerprints
  vars:
    arr_reconciliation_fingerprint_subset: [servarr_sabnzbd, downloaders_usenet_server]
  when:
    - media_usenet_enabled | bool
    - not ansible_check_mode
    - downloaders_relationship_verification_succeeded is sameas true
