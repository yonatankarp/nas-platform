---
# Whether an upgrade is pending, shared by the file-copy and pg_dump entries.
# The pin is read from the service's own Compose file, never handed in: the guard's
# fact is host-scoped and once named another service's pin (#858). --check reads
# the candidate from the controller checkout, since `current` is not yet moved (#851).
- name: Read the deployed Compose definition of the service whose store is protected
  ansible.builtin.slurp:
    path: "{{ platform_current_dir }}/services/{{ pre_upgrade_backup_service_name }}/compose.yml"
  register: pre_upgrade_backup_compose_source
  when: not ansible_check_mode

- name: Resolve the image the release pins for the service whose store is protected
  ansible.builtin.set_fact:
    pre_upgrade_backup_pinned_image: >-
      {{ ((lookup('ansible.builtin.file', pre_upgrade_backup_candidate_root
                  ~ '/services/' ~ pre_upgrade_backup_service_name ~ '/compose.yml')
           if ansible_check_mode
           else pre_upgrade_backup_compose_source.content | b64decode) | from_yaml)
         .services[pre_upgrade_backup_compose_service].image }}

# Stopped containers count as a migrated store. Listed here rather than reusing the
# guard's host-scoped register, which may belong to another service.
- name: List the containers this host holds for the service whose store is protected
  ansible.builtin.command:
    argv:
      - docker
      - container
      - ls
      - --all
      - --quiet
      - --filter
      - "label=com.docker.compose.project={{ pre_upgrade_backup_project_name }}"
      - --filter
      - "label=com.docker.compose.service={{ pre_upgrade_backup_compose_service }}"
  register: pre_upgrade_backup_container_ids
  changed_when: false
  check_mode: false

# Redacted: inspect returns the container's whole Env, i.e. the rendered .env.
- name: Inspect the containers this host holds for the service whose store is protected
  ansible.builtin.command:
    argv: "{{ ['docker', 'container', 'inspect'] + pre_upgrade_backup_container_ids.stdout_lines }}"
  register: pre_upgrade_backup_inspection
  changed_when: false
  check_mode: false
  no_log: true
  when: pre_upgrade_backup_container_ids.stdout_lines | length > 0

- name: Resolve the image the service's container was created from
  ansible.builtin.set_fact:
    pre_upgrade_backup_deployed_image: >-
      {{ (pre_upgrade_backup_inspection.stdout | default('[]', true) | from_json
          | map(attribute='Config.Image') | list | first | default('', true)) }}

- name: Resolve the upgrade this converge would perform
  ansible.builtin.set_fact:
    pre_upgrade_backup_upgrade_pending: >-
      {{ pre_upgrade_backup_deployed_image | length > 0
         and pre_upgrade_backup_pinned_image | length > 0
         and pre_upgrade_backup_deployed_image != pre_upgrade_backup_pinned_image }}
