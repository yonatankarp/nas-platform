---
# THE STORE IS COPIED ASIDE BEFORE A PINNED UPGRADE, AND THIS IS NOT A BACKUP.
#
# Say the second half first, because the first half reads like a safety it does
# not provide. The copy lands under {{ pre_upgrade_backup_path }}, which every
# caller places on the same disk, inside the directory it is a copy of.
# Off-site backup for this platform is parked by decision, so a drive failure,
# a filesystem loss or a mistaken `rm -rf` of the data root takes the original
# and the copy together. docs/secrets.md is where the real exposure is recorded.
#
# WHAT IT DOES BUY IS THE FAILURE #511 ACTUALLY RECORDED. A service that
# migrates its own SQLite store when it starts makes a version bump one-way:
# the newer image writes a schema the older one declines to open, and it
# declines INSIDE the container, which is a crash loop every five minutes rather
# than a failure a play reports. roles/image_downgrade_guard, which every caller
# includes just before this, refuses to go BACK; this is what makes going back
# possible at all -- restore these files, pin the older image, converge.
#
# WHY THE CONTAINER IS STOPPED FIRST. SQLite in write-ahead-logging mode is not
# safely copied file by file while it is open: a checkpoint landing between the
# copy of the store and the copy of its -wal yields a pair that never existed.
# The container is about to be recreated anyway -- an upgrade is pending, that is
# the whole gate -- so stopping it before the copy buys a consistent store for a
# few seconds of downtime the upgrade was going to take regardless. Each caller
# records why its application offers no on-demand backup route instead.
#
# IT RUNS ONLY WHEN AN UPGRADE IS PENDING, keyed on an actual image change: a
# copy on every converge would report a change on every converge, and
# idempotence is a hard requirement here.
#
# Callers include this role between roles/image_downgrade_guard and their
# Compose deployment, and name pre_upgrade_backup_restart in their deployment
# report. INCLUDE, NEVER IMPORT: an imported role brings its argument validation
# as a task tagged `always`, which then runs in every tagged converge and in
# verify.yml with the caller's terms undefined, and fails there -- measured on a
# probe play. Its registers are host-wide, so a caller that skips the include
# still sees the last caller's; roles/vaultwarden/tasks/report.yml says why the
# copy is therefore not a report term.

# Only a container this platform actually created is considered, running or not:
# `docker container ls --all`, so a stack that is merely stopped is still read
# as having a store this host has migrated. A host with no container has no
# store to protect and no upgrade to be pending.
#
# Listed here rather than read from roles/image_downgrade_guard's identical
# listing, although the guard ran moments before: that listing is a host-scoped
# register, and a caller whose guard was skipped by a condition this role does
# not share would compute a pending upgrade from another service's containers.
- name: List the containers this host holds for the service whose store is copied
  ansible.builtin.command:
    argv:
      - docker
      - container
      - ls
      - --all
      - --quiet
      - --filter
      - "label=com.docker.compose.project={{ pre_upgrade_backup_project_name }}"
      - --filter
      - "label=com.docker.compose.service={{ pre_upgrade_backup_compose_service }}"
  register: pre_upgrade_backup_container_ids
  changed_when: false
  check_mode: false

# Redacted: `docker container inspect` returns the container's whole Env array,
# which is the rendered .env and therefore whatever credential the stack holds.
- name: Inspect the containers this host holds for the service whose store is copied
  ansible.builtin.command:
    argv: "{{ ['docker', 'container', 'inspect'] + pre_upgrade_backup_container_ids.stdout_lines }}"
  register: pre_upgrade_backup_inspection
  changed_when: false
  check_mode: false
  no_log: true
  when: pre_upgrade_backup_container_ids.stdout_lines | length > 0

# Compose records the image reference it created the container from, digest
# included, so comparing it with the pinned one names an upgrade exactly. An
# empty deployed reference is a host with no container, which is not an upgrade.
- name: Resolve the image the service's container was created from
  ansible.builtin.set_fact:
    pre_upgrade_backup_deployed_image: >-
      {{ (pre_upgrade_backup_inspection.stdout | default('[]', true) | from_json
          | map(attribute='Config.Image') | list | first | default('', true)) }}

- name: Resolve the upgrade this converge would perform
  ansible.builtin.set_fact:
    pre_upgrade_backup_upgrade_pending: >-
      {{ pre_upgrade_backup_deployed_image | length > 0
         and pre_upgrade_backup_pinned_image | length > 0
         and pre_upgrade_backup_deployed_image != pre_upgrade_backup_pinned_image }}

- name: Report the planned pre-upgrade copy
  ansible.builtin.debug:
    msg: >-
      {{ pre_upgrade_backup_service_name | capitalize }} is running
      {{ pre_upgrade_backup_deployed_image }} and this release pins
      {{ pre_upgrade_backup_pinned_image }}. A live run would stop the container,
      copy {{ pre_upgrade_backup_store_file }}, any write-ahead log beside it
      {{- (' and ' ~ (pre_upgrade_backup_extra_patterns | join(', ')))
          if pre_upgrade_backup_extra_patterns | length > 0 else '' }} into
      {{ pre_upgrade_backup_path }}, and only then start the new image, so that
      a migration that goes wrong can be undone by restoring those files and
      pinning the older image. The copy is on this same disk and is not a
      backup.
  register: pre_upgrade_backup_plan
  when:
    - ansible_check_mode
    - pre_upgrade_backup_upgrade_pending | bool

# BEFORE THE STOP, so the one refusal that has no copy to take costs no downtime.
# It covers a store missing before the stop only; the rescue below reads the
# store again before it starts anything, because starting the old image over a
# missing store would create a fresh empty one, the next converge would copy
# that, and the upgrade would run over nothing the operator recognises.
- name: Read the store before stopping the container that holds it
  ansible.builtin.stat:
    path: "{{ pre_upgrade_backup_store_dir }}/{{ pre_upgrade_backup_store_file }}"
  register: pre_upgrade_backup_store_stat
  when:
    - not ansible_check_mode
    - pre_upgrade_backup_upgrade_pending | bool

- name: Require a store for the pre-upgrade copy to take
  ansible.builtin.assert:
    that:
      - pre_upgrade_backup_store_stat.stat.isreg | default(false)
    fail_msg: >-
      No regular file {{ pre_upgrade_backup_store_file }} was found under
      {{ pre_upgrade_backup_store_dir }} on a host whose
      {{ pre_upgrade_backup_service_name | capitalize }} container reports the
      image {{ pre_upgrade_backup_deployed_image }}, so this run has a store it
      cannot copy and an upgrade to {{ pre_upgrade_backup_pinned_image }} that
      would migrate it. The upgrade is refused here rather than performed
      unprotected: a migration that goes wrong would have nothing to restore
      from. This run stopped nothing, and every converge takes this same
      refusal until the store is found. Find out what is in
      {{ pre_upgrade_backup_store_dir }} before converging again -- a store that
      moved is restored by putting it back, and a store that is genuinely empty
      is started by taking this container to `state: absent` so the next
      converge builds a fresh one.
  when:
    - not ansible_check_mode
    - pre_upgrade_backup_upgrade_pending | bool

# THE STOP AND THE COPY ARE ONE UNIT. A stop that is not followed by a completed
# copy used to leave the service down: every task after it refused, the container
# stayed `exited`, and every later converge failed at the same task with
# changed=0 until someone repaired the path by hand -- measured on Kapowarr by
# planting a file where pre-upgrade-backup/ belongs. The rescue starts the
# container this block stopped, on the image it was created from, and still
# fails the run: an upgrade without a completed copy is never taken. It is
# reachable only from a failed task inside the block, so a converged host and
# --check never see it.
- name: Copy the store aside, starting the old container again if the copy fails
  block:
    # STOPPED RATHER THAN REMOVED, and only the one service, so the caller's
    # deployment recreates it onto the new image exactly as it would have from
    # running.
    #
    # `recreate: never` IS LOAD-BEARING AND WAS FOUND BY RUNNING IT. Without it
    # the module's `state: stopped` brings the project up to the release's own
    # definition first and only then stops it, so the container is REPLACED by
    # one created from the new pin -- measured on Vaultwarden: `docker ps -a`
    # reported `Created` on the new image before the copy had been taken. A
    # created-but-never-started container migrates nothing, but the retry does
    # not survive it: the next converge would read the new image as deployed,
    # find no upgrade pending, and start it against a store this run never
    # copied. With `recreate: never` the module stops the existing container and
    # nothing else -- measured: one `Stopping` action, the container left at
    # `Exited (0)` still on the old image.
    - name: Stop the service before copying the store it is about to migrate
      community.docker.docker_compose_v2:
        project_src: "{{ platform_current_dir }}/services/{{ pre_upgrade_backup_service_name }}"
        project_name: "{{ pre_upgrade_backup_project_name }}"
        files: "{{ platform_service_compose_files[pre_upgrade_backup_service_name] }}"
        env_files: ["{{ platform_runtime_dir }}/services/{{ pre_upgrade_backup_service_name }}/.env"]
        services: ["{{ pre_upgrade_backup_compose_service }}"]
        state: stopped
        recreate: never
      when:
        - not ansible_check_mode
        - pre_upgrade_backup_upgrade_pending | bool

    # THE SET IS READ RATHER THAN LISTED. After a clean stop SQLite has
    # checkpointed the log and, for Vaultwarden, truncated -wal and -shm to zero
    # bytes rather than unlinking them -- measured -- while Kapowarr's clean stop
    # left the store alone. Reading the set is what makes both right without a
    # branch: a stop that did not complete cleanly leaves a log with content in
    # it, and a store that has never been opened has neither file. Not
    # recursive, so an application's own dated backups beside the store are
    # not taken for it. pre_upgrade_backup_extra_patterns carries anything else
    # the store is worthless without, such as Vaultwarden's rsa_key*.
    - name: Read the store files this copy must carry
      ansible.builtin.find:
        paths: "{{ pre_upgrade_backup_store_dir }}"
        patterns: "{{ [pre_upgrade_backup_store_file, pre_upgrade_backup_store_file ~ '-wal',
                      pre_upgrade_backup_store_file ~ '-shm'] + pre_upgrade_backup_extra_patterns }}"
        file_type: file
      register: pre_upgrade_backup_store_files
      changed_when: false
      when:
        - not ansible_check_mode
        - pre_upgrade_backup_upgrade_pending | bool

    - name: Require the pre-upgrade copy to have taken the store
      ansible.builtin.assert:
        that:
          - >-
            pre_upgrade_backup_store_file in (pre_upgrade_backup_store_files.files | default([])
                                             | map(attribute='path') | map('basename') | list)
        fail_msg: >-
          {{ pre_upgrade_backup_store_file }} was present under
          {{ pre_upgrade_backup_store_dir }} before the stop and cannot be read
          there after it -- it is missing or unreadable -- so the copy has
          nothing to take.
        success_msg: >-
          The {{ pre_upgrade_backup_service_name | capitalize }} store is present
          and is copied into {{ pre_upgrade_backup_path }} before this run
          upgrades to {{ pre_upgrade_backup_pinned_image }}.
      when:
        - not ansible_check_mode
        - pre_upgrade_backup_upgrade_pending | bool

    # 0700 and 0600, because the copy carries whatever the store holds, and for
    # Vaultwarden that is rsa_key.pem, the one credential in that service.
    # Ownership is set only where the caller says the platform owns it: an
    # unconditional owner fails on Docker Desktop, where a non-root controller
    # cannot chown, with "chown failed" after the container has stopped.
    - name: Create the pre-upgrade copy directory
      ansible.builtin.file:
        path: "{{ pre_upgrade_backup_path }}"
        state: directory
        owner: "{{ nas_uid if pre_upgrade_backup_manage_ownership | bool else omit }}"
        group: "{{ nas_gid if pre_upgrade_backup_manage_ownership | bool else omit }}"
        mode: "0700"
      when:
        - not ansible_check_mode
        - pre_upgrade_backup_upgrade_pending | bool

    # ansible.builtin.copy moves each file into place atomically, so a run
    # interrupted here leaves whole files rather than truncated ones.
    - name: Copy the store aside before the pinned upgrade
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ pre_upgrade_backup_path }}/{{ item.path | basename }}"
        remote_src: true
        owner: "{{ nas_uid if pre_upgrade_backup_manage_ownership | bool else omit }}"
        group: "{{ nas_gid if pre_upgrade_backup_manage_ownership | bool else omit }}"
        mode: "0600"
      loop: "{{ pre_upgrade_backup_store_files.files | default([]) }}"
      loop_control:
        label: "{{ item.path | basename }}"
      register: pre_upgrade_backup_copy
      when:
        - not ansible_check_mode
        - pre_upgrade_backup_upgrade_pending | bool

    # ONE GENERATION. A log the previous copy carried and this one did not would
    # sit beside a fresh store as a directory that looks like one store and is
    # two, so anything the copy above did not just write is removed.
    - name: Remove pre-upgrade copies this run did not write
      ansible.builtin.file:
        path: "{{ pre_upgrade_backup_path }}/{{ item }}"
        state: absent
      loop:
        - "{{ pre_upgrade_backup_store_file }}-wal"
        - "{{ pre_upgrade_backup_store_file }}-shm"
      when:
        - not ansible_check_mode
        - pre_upgrade_backup_upgrade_pending | bool
        - item not in (pre_upgrade_backup_store_files.files | default([])
                       | map(attribute='path') | map('basename') | list)
  rescue:
    # First, before anything else can rebind them. The path is the one the failed
    # task was acting on: the copy directory or file for the tasks that write, the
    # store directory for the two that read it, the project for the stop.
    - name: Record where the pre-upgrade copy failed
      ansible.builtin.set_fact:
        pre_upgrade_backup_failed_task: "{{ ansible_failed_task.name | default('an unnamed task') }}"
        pre_upgrade_backup_failed_message: >-
          {{ (ansible_failed_result.msg | default('no message', true) ~ ' '
              ~ (ansible_failed_result.results | default([]) | selectattr('failed', 'defined')
                 | selectattr('failed') | map(attribute='msg') | select('defined') | unique | join(' ')))
             | trim | regex_replace('[. ]+$', '') }}
        pre_upgrade_backup_failed_path: >-
          {{ (platform_current_dir ~ '/services/' ~ pre_upgrade_backup_service_name)
             if (ansible_failed_task.action | default('')) is search('docker_compose_v2')
             else pre_upgrade_backup_store_dir
             if (ansible_failed_task.action | default('')) is search('find|assert')
             else (ansible_failed_result.path | default(pre_upgrade_backup_path, true)) }}

    # THE STORE IS READ AGAIN BEFORE ANYTHING STARTS. The check ahead of the stop
    # proves the store was there then; a store lost after the stop -- the failure
    # the in-block assertion names -- is not covered by it. Starting the old image
    # over a missing store creates a fresh empty one, the next converge's check
    # finds that file, copies it and upgrades over it with a green run: measured
    # by deleting the store as the container exited. So only a regular file counts:
    # a dangling symlink and a directory both report `exists`, and the old image
    # started over either one runs on a store it creates somewhere else (measured).
    # `failed_when: false` because stat fails outright on a permission error rather
    # than reporting absence, and a rescue that fails here never reaches its
    # verdict; an unreadable store reads as not a regular file and is not started
    # over.
    - name: Read whether the store is still there to start over
      ansible.builtin.stat:
        path: "{{ pre_upgrade_backup_store_dir }}/{{ pre_upgrade_backup_store_file }}"
      register: pre_upgrade_backup_store_after
      failed_when: false

    # `recreate: never` again, for the reason the stop carries it: `up` without it
    # replaces the stopped container with one on the new pin, which both starts
    # the migration this block exists to protect and makes the next converge read
    # the new image as deployed and skip the copy. With it the module starts the
    # existing container and nothing else -- measured: the stopped container came
    # back `Up` on the image it was created from, with the same container ID.
    - name: Start the service again on the image it was running
      community.docker.docker_compose_v2:
        project_src: "{{ platform_current_dir }}/services/{{ pre_upgrade_backup_service_name }}"
        project_name: "{{ pre_upgrade_backup_project_name }}"
        files: "{{ platform_service_compose_files[pre_upgrade_backup_service_name] }}"
        env_files: ["{{ platform_runtime_dir }}/services/{{ pre_upgrade_backup_service_name }}/.env"]
        services: ["{{ pre_upgrade_backup_compose_service }}"]
        state: present
        recreate: never
        wait: true
        wait_timeout: "{{ platform_compose_wait_timeout }}"
      register: pre_upgrade_backup_restart
      # Tolerated rather than redacted from the verdict: `is failed` below is what
      # tells a container that came back healthy from one that is crash-looping,
      # which a running-state read taken the moment `up` returns cannot (measured).
      ignore_errors: true
      when: pre_upgrade_backup_store_after.stat.isreg | default(false)

    # What Docker reports rather than what the module claimed. The same container
    # ID running is the old image running, because a container never changes its
    # image -- and it is also what a stop that itself failed leaves behind.
    - name: Read whether the container this run stopped is running again
      ansible.builtin.command:
        argv:
          - docker
          - container
          - ls
          - --quiet
          - --filter
          - "label=com.docker.compose.project={{ pre_upgrade_backup_project_name }}"
          - --filter
          - "label=com.docker.compose.service={{ pre_upgrade_backup_compose_service }}"
          - --filter
          - status=running
      register: pre_upgrade_backup_running
      changed_when: false
      failed_when: false

    - name: Refuse the upgrade the pre-upgrade copy could not protect
      ansible.builtin.fail:
        msg: >-
          The {{ pre_upgrade_backup_service_name | capitalize }} pre-upgrade copy failed at
          "{{ pre_upgrade_backup_failed_task }}" on {{ pre_upgrade_backup_failed_path }}:
          {{ pre_upgrade_backup_failed_message }}.
          The upgrade from {{ pre_upgrade_backup_deployed_image }} to {{ pre_upgrade_backup_pinned_image }}
          was not performed.
          {{ pre_upgrade_backup_outcome }}
      vars:
        pre_upgrade_backup_label: "{{ pre_upgrade_backup_service_name | capitalize }}"
        # Running again means the same container ID is running and the start that
        # put it there waited out its health check. A start skipped because the
        # store was not a regular file still reads as running when the stop itself
        # failed and never took the container down.
        pre_upgrade_backup_running_again: >-
          {{ ((pre_upgrade_backup_running.stdout_lines | default([])
               | select('in', pre_upgrade_backup_container_ids.stdout_lines) | list | length > 0)
              and not (pre_upgrade_backup_restart is failed)) }}
        pre_upgrade_backup_outcome: >-
          {{ (pre_upgrade_backup_label ~ ' is running on its old image, ' ~ pre_upgrade_backup_deployed_image
               ~ '. Repair ' ~ pre_upgrade_backup_failed_path ~ ' and converge again; the next run takes the copy'
               ~ ' and then performs the upgrade.')
             if (pre_upgrade_backup_running_again | bool)
             else ((pre_upgrade_backup_label | upper) ~ ' IS STOPPED, and was deliberately not started again: '
                   ~ pre_upgrade_backup_store_dir ~ '/' ~ pre_upgrade_backup_store_file
                   ~ ' is missing, unreadable or not a regular file, and the old'
                   ~ ' image would create a fresh empty store there, which the next converge would copy and'
                   ~ ' upgrade over. Put the store back, then converge again.')
             if (pre_upgrade_backup_restart is skipped)
             else ((pre_upgrade_backup_label | upper) ~ ' IS NOT SERVING: it was started again on its old image'
                   ~ ' but did not become healthy within ' ~ (platform_compose_wait_timeout | string) ~ ' seconds ('
                   ~ (pre_upgrade_backup_restart.msg | default('no message', true)) ~ '), so it is stopped or'
                   ~ ' crash-looping. Read its container log, repair ' ~ pre_upgrade_backup_failed_path
                   ~ ' and converge again.') }}
