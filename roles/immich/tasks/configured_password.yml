---
- name: Validate configured Immich password phase and inputs
  ansible.builtin.assert:
    that:
      - immich_configured_password_phase in ['reconcile', 'verify']
      - vault_immich_admin_email | type_debug == 'str'
      - vault_managed_immich_users | type_debug == 'list'
    fail_msg: Immich configured-password reconciliation received unsupported inputs.
  no_log: true

- name: Validate configured Immich managed identities
  ansible.builtin.assert:
    that:
      - item | type_debug == 'dict'
      - item.email is defined
      - item.email | type_debug == 'str'
    fail_msg: An Immich configured managed identity is unsupported.
  loop: "{{ vault_managed_immich_users }}"
  loop_control:
    label: immich-configured-user
  no_log: true

- name: Initialize desired configured Immich password targets
  ansible.builtin.set_fact:
    immich_configured_password_desired_targets:
      - normalized_email: "{{ vault_immich_admin_email | trim | lower }}"
        administrator: true
  no_log: true

- name: Add desired managed Immich password targets
  ansible.builtin.set_fact:
    immich_configured_password_desired_targets: >-
      {{ immich_configured_password_desired_targets + [{
           'normalized_email': (item.email | trim | lower),
           'administrator': false
         }] }}
  loop: "{{ vault_managed_immich_users }}"
  loop_control:
    label: immich-configured-user
  no_log: true

- name: Require unique desired configured Immich identities
  ansible.builtin.assert:
    that:
      - >-
        immich_configured_password_desired_targets |
        map(attribute='normalized_email') | unique | length ==
        immich_configured_password_desired_targets | length
    fail_msg: Configured Immich identities must be unique after normalization.
  no_log: true

- name: List complete Immich users for configured-password preflight
  ansible.builtin.uri:
    url: "{{ immich_api }}/admin/users?withDeleted=true"
    headers:
      Authorization: "Bearer {{ immich_configured_password_token }}"
    status_code: [200]
    return_content: true
  register: immich_configured_password_listing
  changed_when: false
  check_mode: false
  no_log: true

- name: Require a complete configured-password Immich user listing
  ansible.builtin.assert:
    that:
      - immich_configured_password_listing.json | type_debug == 'list'
    fail_msg: Immich returned an unsupported users response for configured-password reconciliation.
  no_log: true

- name: Require indexable configured-password Immich user records
  ansible.builtin.assert:
    that:
      - item | type_debug == 'dict'
      - item.email is defined
      - item.email | type_debug == 'str'
    fail_msg: Immich returned an unsupported user identity record.
  loop: "{{ immich_configured_password_listing.json }}"
  loop_control:
    label: immich-user
  no_log: true

- name: Initialize configured-password Immich user index
  ansible.builtin.set_fact:
    immich_configured_password_users_by_normalized_email: {}
  no_log: true

- name: Index configured-password Immich users by normalized email
  ansible.builtin.set_fact:
    immich_configured_password_users_by_normalized_email: >-
      {{ immich_configured_password_users_by_normalized_email |
         combine(dict([(
           item.email | trim | lower,
           immich_configured_password_users_by_normalized_email.get(
             item.email | trim | lower, []
           ) + [item]
         )])) }}
  loop: "{{ immich_configured_password_listing.json }}"
  loop_control:
    label: immich-user
  no_log: true

- name: Initialize resolved configured-password Immich targets
  ansible.builtin.set_fact:
    immich_configured_password_targets: []
  no_log: true

- name: Resolve configured-password Immich targets
  ansible.builtin.set_fact:
    immich_configured_password_targets: >-
      {{ immich_configured_password_targets + [item | combine({
           'matches': immich_configured_password_users_by_normalized_email.get(
             item.normalized_email, []
           )
         })] }}
  loop: "{{ immich_configured_password_desired_targets }}"
  loop_control:
    label: immich-configured-user
  no_log: true

- name: Require exact configured-password Immich identities
  ansible.builtin.assert:
    that:
      - item.matches | length == 1
    fail_msg: A configured Immich identity did not resolve exactly once.
  loop: "{{ immich_configured_password_targets }}"
  loop_control:
    label: immich-configured-user
  no_log: true

- name: Require safe active configured-password Immich targets
  ansible.builtin.assert:
    that:
      - >-
        item.matches[0].id | string is
        match('^[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$')
      - item.matches[0].deletedAt is not defined or item.matches[0].deletedAt is none
      - item.matches[0].status is defined
      - item.matches[0].status | type_debug == 'str'
      - item.matches[0].status == 'active'
      - item.matches[0].isAdmin is defined
      - item.matches[0].isAdmin | type_debug == 'bool'
      - item.matches[0].shouldChangePassword is defined
      - item.matches[0].shouldChangePassword | type_debug == 'bool'
      - item.matches[0].isAdmin == item.administrator
    fail_msg: A configured Immich password target is unsafe, inactive, or has unsupported schema.
  loop: "{{ immich_configured_password_targets }}"
  loop_control:
    label: immich-configured-user
  no_log: true

- name: Require unique configured-password Immich target identifiers
  ansible.builtin.assert:
    that:
      - >-
        immich_configured_password_targets |
        map(attribute='matches') | map('first') | map(attribute='id') | unique | length ==
        immich_configured_password_targets | length
    fail_msg: Configured Immich password target identifiers must be unique.
  no_log: true

- name: Initialize configured Immich password plan count
  ansible.builtin.set_fact:
    immich_configured_password_plan_count: 0
  no_log: true

- name: Count configured Immich password repairs
  ansible.builtin.set_fact:
    immich_configured_password_plan_count: >-
      {{ immich_configured_password_plan_count | int + 1 }}
  when:
    - immich_configured_password_phase == 'reconcile'
    - ansible_check_mode
    - item.matches[0].shouldChangePassword
  loop: "{{ immich_configured_password_targets }}"
  loop_control:
    label: immich-configured-user
  no_log: true

- name: Report planned configured Immich password repair
  ansible.builtin.debug:
    msg: IMMICH_PLAN_CONFIGURED_PASSWORD
  when:
    - immich_configured_password_phase == 'reconcile'
    - ansible_check_mode
  loop: "{{ range(0, immich_configured_password_plan_count | int) | list }}"
  loop_control:
    label: immich-configured-password-plan
  changed_when: true

- name: Repair configured Immich password state
  ansible.builtin.uri:
    url: >-
      {{ immich_api }}/admin/users/{{ item.matches[0].id | urlencode }}
    method: PATCH
    headers:
      Authorization: "Bearer {{ immich_configured_password_token }}"
    body_format: json
    body:
      shouldChangePassword: false
    status_code: [200]
  when:
    - immich_configured_password_phase == 'reconcile'
    - not ansible_check_mode
    - item.matches[0].shouldChangePassword
  loop: "{{ immich_configured_password_targets }}"
  loop_control:
    label: immich-configured-user
  changed_when: true
  no_log: true

- name: Re-list complete Immich users after configured-password reconciliation
  ansible.builtin.uri:
    url: "{{ immich_api }}/admin/users?withDeleted=true"
    headers:
      Authorization: "Bearer {{ immich_configured_password_token }}"
    status_code: [200]
    return_content: true
  register: immich_configured_password_authoritative_listing
  changed_when: false
  check_mode: false
  no_log: true

- name: Require a complete authoritative configured-password user listing
  ansible.builtin.assert:
    that:
      - immich_configured_password_authoritative_listing.json | type_debug == 'list'
    fail_msg: Immich returned an unsupported authoritative configured-password user response.
  no_log: true

- name: Require indexable authoritative configured-password user records
  ansible.builtin.assert:
    that:
      - item | type_debug == 'dict'
      - item.email is defined
      - item.email | type_debug == 'str'
    fail_msg: Immich returned an unsupported authoritative user identity record.
  loop: "{{ immich_configured_password_authoritative_listing.json }}"
  loop_control:
    label: immich-user
  no_log: true

- name: Initialize authoritative configured-password Immich user index
  ansible.builtin.set_fact:
    immich_configured_password_authoritative_users_by_normalized_email: {}
  no_log: true

- name: Index authoritative configured-password users by normalized email
  ansible.builtin.set_fact:
    immich_configured_password_authoritative_users_by_normalized_email: >-
      {{ immich_configured_password_authoritative_users_by_normalized_email |
         combine(dict([(
           item.email | trim | lower,
           immich_configured_password_authoritative_users_by_normalized_email.get(
             item.email | trim | lower, []
           ) + [item]
         )])) }}
  loop: "{{ immich_configured_password_authoritative_listing.json }}"
  loop_control:
    label: immich-user
  no_log: true

- name: Initialize authoritative configured-password Immich targets
  ansible.builtin.set_fact:
    immich_configured_password_authoritative_targets: []
  no_log: true

- name: Resolve authoritative configured-password Immich targets
  ansible.builtin.set_fact:
    immich_configured_password_authoritative_targets: >-
      {{ immich_configured_password_authoritative_targets + [item | combine({
           'preflight_id': (
             immich_configured_password_targets |
             selectattr('normalized_email', 'equalto', item.normalized_email) |
             map(attribute='matches') | first | first
           ).id,
           'matches': immich_configured_password_authoritative_users_by_normalized_email.get(
             item.normalized_email, []
           )
         })] }}
  loop: "{{ immich_configured_password_desired_targets }}"
  loop_control:
    label: immich-configured-user
  no_log: true

- name: Require exact authoritative configured-password identities
  ansible.builtin.assert:
    that:
      - item.matches | length == 1
    fail_msg: An authoritative configured Immich identity did not resolve exactly once.
  loop: "{{ immich_configured_password_authoritative_targets }}"
  loop_control:
    label: immich-configured-user
  no_log: true

- name: Require safe active authoritative configured-password targets
  ansible.builtin.assert:
    that:
      - >-
        item.matches[0].id | string is
        match('^[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$')
      - item.matches[0].id == item.preflight_id
      - item.matches[0].deletedAt is not defined or item.matches[0].deletedAt is none
      - item.matches[0].status is defined
      - item.matches[0].status | type_debug == 'str'
      - item.matches[0].status == 'active'
      - item.matches[0].isAdmin is defined
      - item.matches[0].isAdmin | type_debug == 'bool'
      - item.matches[0].shouldChangePassword is defined
      - item.matches[0].shouldChangePassword | type_debug == 'bool'
      - item.matches[0].isAdmin == item.administrator
    fail_msg: An authoritative configured Immich target is unsafe, inactive, or unsupported.
  loop: "{{ immich_configured_password_authoritative_targets }}"
  loop_control:
    label: immich-configured-user
  no_log: true

- name: Require unique authoritative configured-password target identifiers
  ansible.builtin.assert:
    that:
      - >-
        immich_configured_password_authoritative_targets |
        map(attribute='matches') | map('first') | map(attribute='id') | unique | length ==
        immich_configured_password_authoritative_targets | length
    fail_msg: Authoritative configured Immich password target identifiers must be unique.
  no_log: true

- name: Require configured Immich passwords to be accepted
  ansible.builtin.assert:
    that:
      - not item.matches[0].shouldChangePassword
    fail_msg: A configured Immich user still requires a password change.
  when: immich_configured_password_phase == 'verify' or not ansible_check_mode
  loop: "{{ immich_configured_password_authoritative_targets }}"
  loop_control:
    label: immich-configured-user
  no_log: true
