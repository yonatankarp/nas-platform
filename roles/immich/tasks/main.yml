---
- name: Revalidate deployment paths before Immich runtime use
  ansible.builtin.include_role:
    name: deployment_bundle
    tasks_from: target
  vars:
    deployment_target_require_current_release: true
    deployment_target_extra_paths:
      - "{{ platform_current_dir }}/services/immich"
      - "{{ platform_current_dir }}/services/immich/compose.yml"
      - "{{ platform_current_dir }}/services/immich/compose.{{ platform_compose_kind }}.yml"
      - "{{ platform_current_dir }}/services/immich/compose.adoption.yml"
      - "{{ platform_current_dir }}/services/immich/classify_restore.py"
      - "{{ platform_runtime_dir }}/services/immich"
      - "{{ platform_runtime_dir }}/services/immich/.env"

- name: Check for an Immich platform override
  ansible.builtin.stat:
    path: "{{ platform_current_dir }}/services/immich/compose.{{ platform_compose_kind }}.yml"
  register: immich_platform_compose

- name: Select the Immich Compose definitions
  ansible.builtin.set_fact:
    immich_compose_files: >-
      {{ ['compose.yml'] +
         (immich_platform_compose.stat.exists
          | ternary(['compose.' ~ platform_compose_kind ~ '.yml'], [])) +
         ((platform_adoption_enabled | default(false) | bool)
          | ternary(['compose.adoption.yml'], [])) }}

- name: Resolve the Immich storage mode
  ansible.builtin.set_fact:
    immich_restore_adoption_enabled: >-
      {{ platform_adoption_enabled | default(false) | bool }}

- name: Derive the effective Immich storage roots
  ansible.builtin.set_fact:
    immich_restore_database_root: >-
      {{ (platform_adoption_root ~ '/legacy/immich/postgres')
         if immich_restore_adoption_enabled | bool
         else (nas_docker_root ~ '/immich/postgres') }}
    immich_restore_originals_root: >-
      {{ (platform_adoption_root ~ '/legacy/immich/data')
         if immich_restore_adoption_enabled | bool
         else (nas_media_root ~ '/Immich') }}
    immich_restore_backup_root: >-
      {{ (platform_adoption_root ~ '/legacy/immich/backups')
         if immich_restore_adoption_enabled | bool
         else (nas_media_root ~ '/Immich-backups/database') }}
    immich_restore_effective_failure_marker: >-
      {{ (platform_adoption_root ~ '/legacy/immich/.restore-failed')
         if immich_restore_adoption_enabled | bool
         else (nas_docker_root ~ '/immich/.restore-failed') }}

- name: Require exact Immich effective storage roots
  ansible.builtin.assert:
    that:
      - >-
        immich_restore_database_root ==
        ((platform_adoption_root ~ '/legacy/immich/postgres')
        if immich_restore_adoption_enabled | bool
        else (nas_docker_root ~ '/immich/postgres'))
      - >-
        immich_restore_originals_root ==
        ((platform_adoption_root ~ '/legacy/immich/data')
        if immich_restore_adoption_enabled | bool
        else (nas_media_root ~ '/Immich'))
      - >-
        immich_restore_backup_root ==
        ((platform_adoption_root ~ '/legacy/immich/backups')
        if immich_restore_adoption_enabled | bool
        else (nas_media_root ~ '/Immich-backups/database'))
      - >-
        immich_restore_effective_failure_marker ==
        ((platform_adoption_root ~ '/legacy/immich/.restore-failed')
        if immich_restore_adoption_enabled | bool
        else (nas_docker_root ~ '/immich/.restore-failed'))
      - immich_restore_failure_marker == immich_restore_effective_failure_marker
    fail_msg: >-
      Immich restore roots do not match the active Compose storage mode.
      Refusing deployment before storage classification.

- name: Render the Immich environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ platform_runtime_dir }}/services/immich/.env"
    mode: "0600"
  no_log: true

- name: Verify Immich restore classifier before storage classification
  ansible.builtin.include_tasks: verify_classifier.yml

- name: Classify Immich storage before startup
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.python.executable }}"
      - "{{ platform_current_dir }}/services/immich/classify_restore.py"
      - --postgres-dir
      - "{{ immich_restore_database_root }}"
      - --originals-root
      - "{{ immich_restore_originals_root }}"
      - --backup-dir
      - "{{ immich_restore_backup_root }}"
      - --failure-marker
      - "{{ immich_restore_effective_failure_marker }}"
      - --expected-uid
      - "{{ immich_restore_backup_uid | string }}"
      - --expected-gid
      - "{{ immich_restore_backup_gid | string }}"
      - --expected-immich-version
      - "{{ immich_restore_expected_immich_version }}"
      - --expected-postgres-major
      - "{{ immich_restore_expected_postgres_major | string }}"
  register: immich_restore_classification_command
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

- name: Resolve sanitized Immich storage classification status
  ansible.builtin.set_fact:
    immich_restore_classification_status: >-
      {{ immich_restore_classification_command.stderr | default('') | trim
         if immich_restore_classification_command.rc | default(1) | int != 0 and
            immich_restore_classification_command.stderr | default('') | trim in
             ['unsafe-storage', 'unsafe-originals', 'missing-safe-backup',
             'ambiguous-newest-backup', 'unsafe-newest-backup',
             'incompatible-newest-backup',
             'previous-failed-restore']
         else 'classification-failed'
         if immich_restore_classification_command.rc | default(1) | int != 0
         else 'classified' }}
  no_log: true

- name: Require successful Immich storage classification
  ansible.builtin.assert:
    that:
      - immich_restore_classification_command.rc | default(1) | int == 0
    fail_msg: >-
      Immich restore preflight refused deployment
      ({{ immich_restore_classification_status }}). The application server was
      not started; repair the protected storage or backup condition and rerun.

- name: Parse the Immich storage classification
  ansible.builtin.set_fact:
    immich_restore_classification: >-
      {{ immich_restore_classification_command.stdout | from_json }}
  no_log: true

- name: Require exact Immich storage classification
  ansible.builtin.assert:
    that:
      - immich_restore_classification.keys() | list | sort == ['backupFilename', 'database', 'originalsPresent', 'restoreRequired']
      - immich_restore_classification.database in ['fresh', 'existing']
      - immich_restore_classification.originalsPresent is boolean
      - immich_restore_classification.restoreRequired is boolean
      - immich_restore_classification.backupFilename is none or immich_restore_classification.backupFilename is string
      - (immich_restore_classification.database == 'fresh' and immich_restore_classification.originalsPresent) == immich_restore_classification.restoreRequired
      - not immich_restore_classification.restoreRequired or immich_restore_classification.database == 'fresh'
      - not immich_restore_classification.restoreRequired or immich_restore_classification.originalsPresent
      - not immich_restore_classification.restoreRequired or immich_restore_classification.backupFilename is string
      - immich_restore_classification.restoreRequired or immich_restore_classification.backupFilename is none
    fail_msg: >-
      Immich restore preflight returned an invalid classification. The
      application server was not started.
  no_log: true

- name: Resolve the Immich database restore decision
  ansible.builtin.set_fact:
    immich_restore_required: "{{ immich_restore_classification.restoreRequired | bool }}"
    immich_restore_backup_filename: "{{ immich_restore_classification.backupFilename }}"
  no_log: true

- name: Report planned Immich database restore
  ansible.builtin.debug:
    msg: IMMICH_PLAN_DATABASE_RESTORE
  when:
    - ansible_check_mode
    - immich_restore_required | bool
  changed_when: true

- name: Stop check mode before an Immich database restore
  ansible.builtin.meta: end_role
  when:
    - ansible_check_mode
    - immich_restore_required | bool

- name: Stop Immich application services before database restore
  community.docker.docker_compose_v2:
    project_src: "{{ platform_current_dir }}/services/immich"
    project_name: "{{ immich_compose_project_name }}"
    files: "{{ immich_compose_files }}"
    env_files: ["{{ platform_runtime_dir }}/services/immich/.env"]
    services: [immich-server, immich-machine-learning]
    state: stopped
  when:
    - immich_restore_required | bool
    - not ansible_check_mode

- name: Protect an in-progress Immich database restore
  ansible.builtin.copy:
    dest: "{{ immich_restore_effective_failure_marker }}"
    content: '{"version":1,"stage":"dependencies-start"}\n'
    mode: "0600"
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
  when:
    - immich_restore_required | bool
    - not ansible_check_mode

# The database and the cache come up first and alone. PostgreSQL honors
# POSTGRES_USER, POSTGRES_DB and POSTGRES_PASSWORD only when it initializes an
# empty data directory; against an existing cluster it ignores them silently.
# Bringing the data services up before the application is what lets the next
# task refuse a rotated credential with a clear message instead of letting the
# whole stack fail later as an opaque application startup timeout.
- name: Deploy the Immich data services
  community.docker.docker_compose_v2:
    project_src: "{{ platform_current_dir }}/services/immich"
    project_name: "{{ immich_compose_project_name }}"
    files: "{{ immich_compose_files }}"
    env_files: ["{{ platform_runtime_dir }}/services/immich/.env"]
    services: [database, redis]
    state: present
    wait: true
    wait_timeout: "{{ immich_restore_database_wait_timeout }}"
  when: not ansible_check_mode

- name: Restore and verify the Immich database
  ansible.builtin.include_tasks: restore.yml
  when:
    - immich_restore_required | bool
    - not ansible_check_mode

# Loopback inside the PostgreSQL container is trust-authenticated, so this
# deliberately connects to the Compose service name instead: that leaves the
# loopback interface, matches the final scram-sha-256 rule in the image's
# pg_hba.conf, and so verifies the database name, the role and the password
# together rather than only the first two.
- name: Refuse a rotated Immich database credential
  community.docker.docker_compose_v2_exec:
    project_src: "{{ platform_current_dir }}/services/immich"
    project_name: "{{ immich_compose_project_name }}"
    files: "{{ immich_compose_files }}"
    env_files: ["{{ platform_runtime_dir }}/services/immich/.env"]
    service: database
    argv:
      - sh
      - -ec
      - >-
        exec env PGPASSWORD="$POSTGRES_PASSWORD" PGCONNECT_TIMEOUT=15
        psql --host=database --username="$1" --dbname="$2"
        --no-align --tuples-only
        --command="select current_user || '/' || current_database()"
      - immich-database-probe
      - "{{ vault_immich_db_username }}"
      - "{{ vault_immich_db_name }}"
    tty: false
  register: immich_database_identity
  when: not ansible_check_mode
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

- name: Classify the Immich database credential probe
  ansible.builtin.set_fact:
    immich_database_probe_status: >-
      {{ 'execution-failed' if immich_database_identity.rc is not defined
         else 'connection-rejected' if immich_database_identity.rc | int != 0
         else 'identity-mismatch' if immich_database_identity.stdout | default('') | trim !=
              vault_immich_db_username ~ '/' ~ vault_immich_db_name
         else 'verified' }}
  when: not ansible_check_mode
  no_log: true

- name: Require the managed Immich database credential
  ansible.builtin.assert:
    that:
      - immich_database_probe_status == 'verified'
    fail_msg: >-
      Immich database credential verification failed
      ({{ immich_database_probe_status }}) in Compose service database.
      Restore the previous vault values or
      migrate the database credential explicitly, then rerun.
  when: not ansible_check_mode

- name: Deploy Immich
  community.docker.docker_compose_v2:
    project_src: "{{ platform_current_dir }}/services/immich"
    project_name: "{{ immich_compose_project_name }}"
    files: "{{ immich_compose_files }}"
    env_files: ["{{ platform_runtime_dir }}/services/immich/.env"]
    state: present
    wait: true
    wait_timeout: 600

# Unlike some other services in this platform, the API answers before the
# container health check reports healthy, so this waits on the application's own
# statement about whether it has an administrator yet.
- name: Read Immich initialization state
  ansible.builtin.uri:
    url: "{{ immich_api }}/server/config"
    status_code: [200]
    return_content: true
  register: immich_public_config
  until: immich_public_config.json.isInitialized is defined
  retries: 60
  delay: 3
  changed_when: false
  check_mode: false

- name: Resolve Immich initialization state
  ansible.builtin.set_fact:
    immich_initialized: "{{ immich_public_config.json.isInitialized | bool }}"

- name: Require initialized Immich after database restore
  ansible.builtin.assert:
    that:
      - immich_initialized | bool
    fail_msg: >-
      Immich reported an uninitialized server after a database restore. A new
      administrator was not created; inspect the protected restored state.
  when: immich_restore_required | bool

- name: Remove successful Immich restore provenance
  ansible.builtin.file:
    path: "{{ immich_restore_effective_failure_marker }}"
    state: absent
  when: immich_restore_required | bool

- name: Report planned Immich administrator creation
  ansible.builtin.debug:
    msg: IMMICH_PLAN_ADMINISTRATOR
  when:
    - ansible_check_mode
    - not immich_initialized | bool
  changed_when: true

# Immich accepts this exactly once: with an administrator present the server
# answers 400 regardless of the address offered, which is what makes creating
# the account and reconciling it afterwards two different code paths.
- name: Create the vault Immich administrator
  ansible.builtin.uri:
    url: "{{ immich_api }}/auth/admin-sign-up"
    method: POST
    body_format: json
    body:
      email: "{{ vault_immich_admin_email }}"
      password: "{{ vault_immich_admin_password }}"
      name: "{{ immich_admin_name }}"
    status_code: [201]
  when:
    - not ansible_check_mode
    - not immich_initialized | bool
  changed_when: true
  no_log: true

- name: Authenticate the vault Immich administrator
  ansible.builtin.uri:
    url: "{{ immich_api }}/auth/login"
    method: POST
    body_format: json
    body:
      email: "{{ vault_immich_admin_email }}"
      password: "{{ vault_immich_admin_password }}"
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: immich_reconcile_login
  when: not ansible_check_mode or immich_initialized | bool
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

- name: Resolve sanitized Immich authentication status
  ansible.builtin.set_fact:
    immich_reconcile_login_status: "{{ immich_reconcile_login.status | default(0) | int }}"
  when: not ansible_check_mode or immich_initialized | bool
  no_log: true

# A successful login answers 201, not 200.
- name: Require the vault Immich administrator
  ansible.builtin.assert:
    that:
      - immich_reconcile_login_status | int == 201
      - immich_reconcile_login.json.userEmail == vault_immich_admin_email
      - immich_reconcile_login.json.isAdmin | bool
    fail_msg: >-
      The Immich server does not accept the vault administrator or that account is not an
      administrator. Verify the preserved vault credentials in the Immich UI and rerun.
  when: not ansible_check_mode or immich_initialized | bool
  no_log: true

- name: Resolve the Immich reconciliation token
  ansible.builtin.set_fact:
    immich_reconcile_token: "{{ immich_reconcile_login.json.accessToken }}"
  when: not ansible_check_mode or immich_initialized | bool
  no_log: true

- name: Reconcile managed Immich users
  ansible.builtin.include_tasks: managed_users.yml
  vars:
    immich_managed_users_phase: reconcile
    immich_managed_users_token: "{{ immich_reconcile_token }}"
  when: not ansible_check_mode or immich_initialized | bool

- name: Reconcile configured Immich password state
  ansible.builtin.include_tasks: configured_password.yml
  vars:
    immich_configured_password_phase: reconcile
    immich_configured_password_token: "{{ immich_reconcile_token }}"
  when: not ansible_check_mode or immich_initialized | bool

- name: Reconcile configured Immich user onboarding
  ansible.builtin.include_tasks: user_onboarding.yml
  vars:
    immich_user_onboarding_phase: reconcile
  when: not ansible_check_mode or immich_initialized | bool

- name: Read the Immich system configuration
  ansible.builtin.uri:
    url: "{{ immich_api }}/system-config"
    headers:
      Authorization: "Bearer {{ immich_reconcile_token }}"
    status_code: [200]
    return_content: true
  register: immich_system_config
  when: not ansible_check_mode or immich_initialized | bool
  changed_when: false
  check_mode: false
  no_log: true

# The whole document goes back, so the desired state is the server's own
# configuration with only the managed leaves overlaid. Anything an operator
# changed outside that set survives the converge untouched.
- name: Resolve the desired Immich system configuration
  ansible.builtin.set_fact:
    immich_desired_config: >-
      {{ immich_system_config.json | combine(immich_managed_settings, recursive=True) }}
  when: not ansible_check_mode or immich_initialized | bool
  no_log: true

- name: Resolve Immich settings repair requirement
  ansible.builtin.set_fact:
    immich_settings_repair_required: >-
      {{ (ansible_check_mode and not immich_initialized | bool) or
         (immich_desired_config | default({})) != (immich_system_config.json | default({})) }}
  no_log: true

- name: Report planned Immich settings repair
  ansible.builtin.debug:
    msg: IMMICH_PLAN_SETTINGS_REPAIR
  when:
    - ansible_check_mode
    - immich_settings_repair_required | bool
  changed_when: true

- name: Repair the Immich system configuration
  ansible.builtin.uri:
    url: "{{ immich_api }}/system-config"
    method: PUT
    headers:
      Authorization: "Bearer {{ immich_reconcile_token }}"
    body_format: json
    body: "{{ immich_desired_config }}"
    status_code: [200]
  when:
    - not ansible_check_mode
    - immich_settings_repair_required | bool
  changed_when: true
  no_log: true

- name: Read Immich administrator onboarding state
  ansible.builtin.uri:
    url: "{{ immich_api }}/system-metadata/admin-onboarding"
    headers:
      Authorization: "Bearer {{ immich_reconcile_token }}"
    status_code: [200]
    return_content: true
  register: immich_onboarding
  when: not ansible_check_mode or immich_initialized | bool
  changed_when: false
  check_mode: false
  no_log: true

# Without this the UI greets every operator with the first-run wizard and
# invites them to redo the decisions this role already made.
- name: Complete Immich administrator onboarding
  ansible.builtin.uri:
    url: "{{ immich_api }}/system-metadata/admin-onboarding"
    method: POST
    headers:
      Authorization: "Bearer {{ immich_reconcile_token }}"
    body_format: json
    body:
      isOnboarded: true
    status_code: [204]
  when:
    - not ansible_check_mode
    - not immich_onboarding.json.isOnboarded | bool
  changed_when: true
  no_log: true

- name: Authenticate to Immich for exact verification
  tags: [platform_verify_immich]
  ansible.builtin.uri:
    url: "{{ immich_api }}/auth/login"
    method: POST
    body_format: json
    body:
      email: "{{ vault_immich_admin_email }}"
      password: "{{ vault_immich_admin_password }}"
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: immich_verify_login
  when:
    - not ansible_check_mode
    - immich_reconcile_token is not defined
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

- name: Require the vault Immich administrator during exact verification
  tags: [platform_verify_immich]
  ansible.builtin.assert:
    that:
      - immich_verify_login.status | default(0) | int == 201
      - immich_verify_login.json.userEmail == vault_immich_admin_email
      - immich_verify_login.json.isAdmin | bool
    fail_msg: The vault Immich administrator is absent or drifted.
  when:
    - not ansible_check_mode
    - immich_reconcile_token is not defined
  no_log: true

- name: Resolve the Immich verification token
  tags: [platform_verify_immich]
  ansible.builtin.set_fact:
    immich_verification_token: >-
      {{ immich_reconcile_token
         if immich_reconcile_token is defined
         else immich_verify_login.json.accessToken }}
  when: not ansible_check_mode
  no_log: true

- name: Verify managed Immich users
  tags: [platform_verify_immich]
  ansible.builtin.include_tasks:
    file: managed_users.yml
    apply:
      tags: [platform_verify_immich]
  vars:
    immich_managed_users_phase: verify
    immich_managed_users_token: "{{ immich_verification_token }}"
  when: not ansible_check_mode

- name: Verify configured Immich password state
  tags: [platform_verify_immich]
  ansible.builtin.include_tasks:
    file: configured_password.yml
    apply:
      tags: [platform_verify_immich]
  vars:
    immich_configured_password_phase: verify
    immich_configured_password_token: "{{ immich_verification_token }}"
  when: not ansible_check_mode

- name: Verify configured Immich user onboarding
  tags: [platform_verify_immich]
  ansible.builtin.include_tasks:
    file: user_onboarding.yml
    apply:
      tags: [platform_verify_immich]
  vars:
    immich_user_onboarding_phase: verify
  when: not ansible_check_mode

- name: Read the exact Immich system configuration
  tags: [platform_verify_immich]
  ansible.builtin.uri:
    url: "{{ immich_api }}/system-config"
    headers:
      Authorization: "Bearer {{ immich_verification_token }}"
    status_code: [200]
    return_content: true
  register: immich_verify_config
  when: not ansible_check_mode
  changed_when: false
  check_mode: false
  no_log: true

# Overlaying the managed settings onto what the server reports must be a no-op.
# Any managed leaf that drifted makes the combined document differ.
- name: Require the managed Immich settings
  tags: [platform_verify_immich]
  ansible.builtin.assert:
    that:
      - (immich_verify_config.json | combine(immich_managed_settings, recursive=True)) ==
        immich_verify_config.json
    fail_msg: The managed Immich settings are absent or drifted.
  when: not ansible_check_mode
