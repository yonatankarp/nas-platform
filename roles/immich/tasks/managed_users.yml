---
# Immich's managed-user reconciliation is roles/managed_users, parameterised,
# the way roles/komga/tasks/managed_users.yml is. The opening assert stays
# because it is what makes immich_managed_users_phase a gated variable:
# include_tasks never applies meta/argument_specs.yml, so tests/policy_test.rb
# holds main.yml's callers to exactly the phases named here.
#
# Every Immich-specific value of the account lifecycle lives in defaults/main.yml
# as immich_managed_users_*, so the include below is a one-to-one map. The
# exceptions are the admin header, which reads the token the caller resolved, and
# the literals that say this service authenticates in a request body, matches
# folded emails and binds each credential to the record it authenticates as.
#
# The preference profiles are Immich's own and stay here and in three task files
# roles/managed_users runs through its hooks: the effective profiles are resolved
# before the role (they read no listing), the targets are read and refused inside
# it, and the preference and avatar repairs follow the account repair after it.
- name: Validate the Immich managed-user phase
  ansible.builtin.assert:
    that:
      - immich_managed_users_phase in ['reconcile', 'verify']
    fail_msg: >-
      Immich managed-user reconciliation was included with a phase it does not
      implement. The tasks this file reaches are gated on
      immich_managed_users_phase, so an unrecognised phase silently skips them.

# Redacted: the mapping keys are the managed users' email addresses.
- name: Normalize Immich managed user preference policy emails
  ansible.builtin.set_fact:
    immich_managed_user_profile_by_normalized_email: >-
      {{ dict(
           immich_managed_user_preference_profile_by_email.keys() |
           map('trim') | map('lower') |
           zip(immich_managed_user_preference_profile_by_email.values())
         ) }}
    immich_managed_user_overrides_by_normalized_email: >-
      {{ dict(
           immich_managed_user_preference_overrides.keys() |
           map('trim') | map('lower') |
           zip(immich_managed_user_preference_overrides.values())
         ) }}
  no_log: true

- name: Resolve Immich managed user preference profiles
  ansible.builtin.set_fact:
    immich_managed_user_desired_profiles: >-
      {{ (immich_managed_user_desired_profiles | default({})) |
         combine({item.email:
           immich_managed_user_preference_profiles[
             immich_managed_user_profile_by_normalized_email.get(
               item.email | trim | lower, immich_managed_user_preference_profile_default
             )
           ] | combine(
             immich_managed_user_overrides_by_normalized_email.get(item.email | trim | lower, {}),
             recursive=True
           )
         }) }}
  loop: "{{ vault_managed_immich_users }}"
  loop_control:
    label: immich-managed-user
  no_log: true

- name: Validate effective Immich managed user preference policies
  ansible.builtin.assert:
    that:
      - immich_managed_user_desired_profiles[item.email] is mapping
      - >-
        'avatar' not in immich_managed_user_desired_profiles[item.email] or
        immich_managed_user_desired_profiles[item.email].avatar is mapping
      - >-
        'avatar' not in immich_managed_user_desired_profiles[item.email] or
        'color' not in immich_managed_user_desired_profiles[item.email].avatar or
        immich_managed_user_desired_profiles[item.email].avatar.color in
        ['primary', 'pink', 'red', 'yellow', 'blue', 'green', 'purple', 'orange',
         'gray', 'amber']
    fail_msg: Immich managed-user preference policy is unsupported; values are redacted.
  loop: "{{ vault_managed_immich_users }}"
  loop_control:
    label: immich-managed-user
  no_log: true

- name: Split Immich preference and durable avatar projections
  ansible.builtin.set_fact:
    immich_managed_user_desired_preferences: >-
      {{ (immich_managed_user_desired_preferences | default({})) |
         combine({item.email:
           (immich_managed_user_desired_profiles[item.email] |
            dict2items |
            rejectattr('key', 'equalto', 'avatar') |
            list |
            items2dict)
         }) }}
    immich_managed_user_desired_avatar_colors: >-
      {{ (immich_managed_user_desired_avatar_colors | default({})) |
         combine(
           {item.email: immich_managed_user_desired_profiles[item.email].avatar.color}
           if 'avatar' in immich_managed_user_desired_profiles[item.email] and
              'color' in immich_managed_user_desired_profiles[item.email].avatar
           else {}
         ) }}
  loop: "{{ vault_managed_immich_users }}"
  loop_control:
    label: immich-managed-user
  no_log: true

- name: Reconcile the declared Immich managed users
  ansible.builtin.include_role:
    name: managed_users
  vars:
    managed_users_phase: "{{ immich_managed_users_phase }}"
    managed_users_service: immich
    managed_users_title: Immich
    managed_users_declared: "{{ vault_managed_immich_users }}"
    managed_users_identity_attribute: "{{ immich_managed_users_identity_attribute }}"
    managed_users_id_attribute: "{{ immich_managed_users_id_attribute }}"
    managed_users_id_pattern: "{{ immich_managed_users_id_pattern }}"
    managed_users_match_normalized: true
    managed_users_api: "{{ immich_api }}"
    managed_users_admin_headers:
      Authorization: "Bearer {{ immich_managed_users_token }}"
    managed_users_admin_basic: false
    managed_users_list_path: "{{ immich_managed_users_list_path }}"
    managed_users_list_json: "{{ immich_managed_users_list_json }}"
    managed_users_authenticate_path: "{{ immich_managed_users_authenticate_path }}"
    managed_users_authenticate_method: POST
    managed_users_authenticate_basic: false
    managed_users_authenticate_body_format: json
    managed_users_authenticate_body: "{{ immich_managed_users_authenticate_body }}"
    managed_users_authenticate_identity: "{{ immich_managed_users_authenticate_identity }}"
    managed_users_authenticate_status: "{{ immich_managed_users_authenticate_status }}"
    managed_users_bind_authenticated_ids: true
    managed_users_authenticated_id: "{{ immich_managed_users_authenticated_id }}"
    managed_users_before_create_tasks: "{{ immich_managed_users_before_create_tasks }}"
    managed_users_before_repair_tasks: "{{ immich_managed_users_before_repair_tasks }}"
    managed_users_before_verify_tasks: "{{ immich_managed_users_before_verify_tasks }}"
    managed_users_create_path: "{{ immich_managed_users_create_path }}"
    managed_users_create_body: "{{ immich_managed_users_create_body }}"
    managed_users_create_status: "{{ immich_managed_users_create_status }}"
    managed_users_reconcile_interface: "{{ immich_managed_users_reconcile_interface }}"
    managed_users_reconcile_path: "{{ immich_managed_users_reconcile_path }}"
    managed_users_repair_body: "{{ immich_managed_users_repair_body }}"
    managed_users_repair_status: "{{ immich_managed_users_repair_status }}"
    managed_users_repair_condition: "{{ immich_managed_users_repair_condition }}"
    managed_users_verify_conditions: "{{ immich_managed_users_verify_conditions }}"
    managed_users_verify_fail_msg: "{{ immich_managed_users_verify_fail_msg }}"
    managed_users_plan_create_message: "{{ immich_managed_users_plan_create_message }}"
    managed_users_plan_repair_message: "{{ immich_managed_users_plan_repair_message }}"
    # What managed_users_preference_verification.yml compares in the verify
    # phase, where the before-verify hook reaches it: the reads the before-repair
    # hook registered, since verify repairs and re-reads nothing.
    immich_managed_user_preference_checks: "{{ immich_managed_user_preference_reads }}"
    immich_managed_user_avatar_checks: "{{ immich_managed_user_avatar_reads }}"

# The preference and avatar repairs follow the account repair, in reconcile only,
# from the reads managed_users_effective_targets.yml registered inside the role.
# managed_users_matches is the set of records that repair targeted.
- name: Report planned Immich managed user preference repair
  ansible.builtin.debug:
    msg: IMMICH_PLAN_MANAGED_USER_PREFERENCE_REPAIR
  when:
    - immich_managed_users_phase == 'reconcile'
    - ansible_check_mode
    - not item.skipped | default(false)
    - >-
      item.json | combine(
        immich_managed_user_desired_preferences[item.item.email], recursive=True
      ) != item.json
  loop: "{{ immich_managed_user_preference_reads.results | default([]) }}"
  loop_control:
    label: immich-managed-user
  changed_when: true
  no_log: true

- name: Repair Immich managed user preferences
  ansible.builtin.uri:
    url: >-
      {{ immich_api }}/admin/users/{{
         managed_users_matches[item.item.email][0].id | urlencode }}/preferences
    method: PATCH
    headers:
      Authorization: "Bearer {{ immich_managed_users_token }}"
    body_format: json
    body: "{{ immich_managed_user_desired_preferences[item.item.email] }}"
    status_code: [200]
    return_content: true
  when:
    - immich_managed_users_phase == 'reconcile'
    - not ansible_check_mode
    - not item.skipped | default(false)
    - >-
      item.json | combine(
        immich_managed_user_desired_preferences[item.item.email], recursive=True
      ) != item.json
  loop: "{{ immich_managed_user_preference_reads.results | default([]) }}"
  loop_control:
    label: immich-managed-user
  changed_when: true
  no_log: true

- name: Report planned Immich managed user avatar preference repair
  ansible.builtin.debug:
    msg: IMMICH_PLAN_MANAGED_USER_AVATAR_PREFERENCE_REPAIR
  when:
    - immich_managed_users_phase == 'reconcile'
    - ansible_check_mode
    - not item.skipped | default(false)
    - item.item.email in immich_managed_user_desired_avatar_colors
    - item.json.avatarColor != immich_managed_user_desired_avatar_colors[item.item.email]
  loop: "{{ immich_managed_user_avatar_reads.results | default([]) }}"
  loop_control:
    label: immich-managed-user
  changed_when: true
  no_log: true

- name: Repair Immich managed user avatar preference
  ansible.builtin.uri:
    url: >-
      {{ immich_api }}/admin/users/{{
         managed_users_matches[item.item.email][0].id | urlencode }}
    method: PATCH
    headers:
      Authorization: "Bearer {{ immich_managed_users_token }}"
    body_format: json
    body:
      avatarColor: "{{ immich_managed_user_desired_avatar_colors[item.item.email] }}"
    status_code: [200]
    return_content: true
  when:
    - immich_managed_users_phase == 'reconcile'
    - not ansible_check_mode
    - not item.skipped | default(false)
    - item.item.email in immich_managed_user_desired_avatar_colors
    - item.json.avatarColor != immich_managed_user_desired_avatar_colors[item.item.email]
  loop: "{{ immich_managed_user_avatar_reads.results | default([]) }}"
  loop_control:
    label: immich-managed-user
  changed_when: true
  no_log: true

- name: Read back Immich managed user preferences
  ansible.builtin.uri:
    url: >-
      {{ immich_api }}/admin/users/{{
         managed_users_matches[item.email][0].id | urlencode }}/preferences
    headers:
      Authorization: "Bearer {{ immich_managed_users_token }}"
    status_code: [200]
    return_content: true
  register: immich_managed_user_preference_verification
  when:
    - immich_managed_users_phase == 'reconcile'
    - managed_users_matches[item.email] | length == 1
  loop: "{{ vault_managed_immich_users }}"
  loop_control:
    label: immich-managed-user
  changed_when: false
  check_mode: false
  no_log: true

- name: Read back Immich managed user avatar preferences
  ansible.builtin.uri:
    url: >-
      {{ immich_api }}/admin/users/{{
         managed_users_matches[item.email][0].id | urlencode }}
    headers:
      Authorization: "Bearer {{ immich_managed_users_token }}"
    status_code: [200]
    return_content: true
  register: immich_managed_user_avatar_verification
  when:
    - immich_managed_users_phase == 'reconcile'
    - managed_users_matches[item.email] | length == 1
    - item.email in immich_managed_user_desired_avatar_colors
  loop: "{{ vault_managed_immich_users }}"
  loop_control:
    label: immich-managed-user
  changed_when: false
  check_mode: false
  no_log: true

- name: Verify the reconciled Immich managed user preferences
  ansible.builtin.include_tasks: managed_users_preference_verification.yml
  vars:
    immich_managed_user_preference_checks: "{{ immich_managed_user_preference_verification }}"
    immich_managed_user_avatar_checks: "{{ immich_managed_user_avatar_verification }}"
  when: immich_managed_users_phase == 'reconcile'
