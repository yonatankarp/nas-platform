---
argument_specs:
  main:
    short_description: Deploy Immich and converge its administrator and managed settings
    options:
      platform_compose_kind:
        type: str
        required: true
      platform_project_name:
        type: str
        required: false
      immich_port:
        type: int
        required: false
      immich_managed_settings:
        type: dict
        required: false
      immich_admin_name:
        type: str
        required: false
      immich_restore_failure_marker:
        type: str
        required: false
      immich_restore_backup_container_path:
        type: str
        required: false
      immich_restore_verify_limit:
        type: int
        required: false
      immich_restore_database_wait_timeout:
        type: int
        required: false
      immich_managed_user_preference_profile_default:
        type: str
        required: false
      immich_managed_user_preference_profile_by_email:
        type: dict
        required: false
      immich_managed_user_preference_overrides:
        type: dict
        required: false
      immich_managed_user_preference_profiles:
        type: dict
        required: false
      vault_immich_admin_email:
        type: str
        required: true
      vault_immich_admin_password:
        type: str
        required: true
      vault_immich_db_name:
        type: str
        required: true
      vault_immich_db_username:
        type: str
        required: true
      vault_immich_db_password:
        type: str
        required: true
