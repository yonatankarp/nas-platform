---
argument_specs:
  main:
    short_description: Deploy Immich and converge its administrator and managed settings
    options:
      immich_compose_wait_timeout:
        type: int
        required: false
      immich_initialization_retries:
        type: int
        required: false
      platform_project_name:
        type: str
        required: false
      immich_port:
        type: int
        required: false
      immich_managed_settings:
        type: dict
        required: false
      immich_admin_name:
        type: str
        required: false
      immich_restore_failure_marker:
        type: str
        required: false
      immich_restore_backup_container_path:
        type: str
        required: false
      immich_restore_backup_uid:
        type: int
        required: false
      immich_restore_backup_gid:
        type: int
        required: false
      immich_restore_expected_immich_version:
        type: str
        required: false
      immich_restore_expected_postgres_major:
        type: int
        required: false
      immich_restore_verify_limit:
        type: int
        required: false
      immich_restore_database_wait_timeout:
        type: int
        required: false
      immich_managed_user_preference_profile_default:
        type: str
        required: false
      immich_managed_user_preference_profile_by_email:
        type: dict
        required: false
      immich_managed_user_preference_overrides:
        type: dict
        required: false
      immich_managed_user_preference_profiles:
        type: dict
        required: false
      # Immich's half of roles/managed_users (#647). Only the parameters that
      # resolve at role entry are declared: Ansible templates every declared
      # option before the role's first task, so declaring
      # immich_managed_users_create_body, _repair_body, _repair_condition,
      # _reconcile_path, _authenticate_body, _authenticate_identity,
      # _authenticated_id or _list_json -- each a template over the shared role's
      # per-identity `item`, its bound match or user, or the listing it registers
      # -- would fail this role at "Validating arguments against arg spec 'main'".
      # roles/managed_users asserts their presence instead.
      immich_managed_users_identity_attribute:
        type: str
        required: false
      immich_managed_users_id_attribute:
        type: str
        required: false
      immich_managed_users_id_pattern:
        type: str
        required: false
      immich_managed_users_list_path:
        type: str
        required: false
      immich_managed_users_authenticate_path:
        type: str
        required: false
      immich_managed_users_create_path:
        type: str
        required: false
      immich_managed_users_reconcile_interface:
        description: >-
          The interfaces.reconcile value config/managed-user-capabilities.yml
          declares for Immich, asserted against the deployed register.
        type: str
        required: false
      immich_managed_users_authenticate_status:
        type: int
        required: false
      immich_managed_users_create_status:
        type: list
        elements: int
        required: false
      immich_managed_users_repair_status:
        type: list
        elements: int
        required: false
      immich_managed_users_before_create_tasks:
        type: str
        required: false
      immich_managed_users_before_repair_tasks:
        type: str
        required: false
      immich_managed_users_before_verify_tasks:
        type: str
        required: false
      immich_managed_users_verify_conditions:
        description: >-
          Brace-free expressions the shared role's final verification asserts in
          order. Unbraced, so they are safe to declare here.
        type: list
        elements: str
        required: false
      immich_managed_users_verify_fail_msg:
        type: str
        required: false
      immich_managed_users_plan_create_message:
        type: str
        required: false
      immich_managed_users_plan_repair_message:
        type: str
        required: false
      vault_immich_admin_email:
        type: str
        required: true
      vault_immich_admin_password:
        type: str
        required: true
      vault_immich_db_name:
        type: str
        required: true
      vault_immich_db_username:
        type: str
        required: true
      vault_immich_db_password:
        type: str
        required: true
