---
# Validated before the first task runs, so a vault missing a key fails
# immediately naming the key rather than midway with an undefined-variable trace.
argument_specs:
  main:
    short_description: Provision ntfy declaratively and prove the alerting sink works
    description:
      - Renders the environment from vault, deploys the stack, then verifies that
        provisioning took effect rather than only that a file was written.
    options:
      platform_compose_kind:
        type: str
        required: true
        description: Platform-specific Compose override suffix selected by the bundle.
      platform_project_name:
        type: str
        required: false
        description: Disposable Mac proof namespace; empty preserves canonical NAS naming.
      platform_public_host:
        type: str
        required: true
      ntfy_port:
        type: int
        required: false
      ntfy_topic:
        type: str
        required: false
        description: Topic for anything that should get a human out of their chair.
      ntfy_deployment_topic:
        type: str
        required: false
        description: Topic for the routine deployment record.
      ntfy_containers_topic:
        type: str
        required: false
        description: Topic for the routine container record; recoveries.
      ntfy_topics:
        type: list
        elements: str
        required: false
        description: Every topic the platform provisions, in declaration order.
      ntfy_base_url:
        type: str
        required: false
        description: Exact URL clients use, which ntfy needs for correct links.
      ntfy_account_api:
        type: str
        required: false
        description: Pinned local ntfy account API endpoint.
      ntfy_account_subscription_api:
        type: str
        required: false
        description: Pinned local ntfy account-subscription API endpoint.
      ntfy_publishers:
        type: list
        elements: dict
        required: false
        description: Write-only publisher identities, one token each.
        options:
          name:
            type: str
            required: true
          password_hash:
            type: str
            required: true
          token:
            type: str
            required: true
          topics:
            type: list
            elements: str
            required: true
            description: Exactly the topics this publisher may write to.
      vault_ntfy_admin_user:
        type: str
        required: true
      vault_ntfy_admin_password_hash:
        type: str
        required: true
        description: Bcrypt hash from the pinned ntfy image's own hasher.

  deployment_report:
    short_description: Publish one deployment report for a service Compose recreated
    description:
      - Called by every service role after its Compose deployment, so the caller
        needs no ntfy port, topic or token of its own.
    options:
      ntfy_deployment_report_service:
        type: str
        required: true
        description: Service name as it should read in the notification title.
      ntfy_deployment_report_changed:
        type: bool
        required: true
        description: Whether Compose recreated anything; false publishes nothing.
      platform_release_id:
        type: str
        required: true
        description: Git SHA of the release the service was deployed from.
      ntfy_port:
        type: int
        required: false
      ntfy_deployment_topic:
        type: str
        required: false
        description: Topic for the routine deployment record.
      vault_ntfy_deploy_token:
        type: str
        required: true
        description: Write-only token of the deploy publisher.
