---
# Non-secret policy. Credentials come from vault.
ntfy_port: 2586
ntfy_base_url: "http://{{ platform_public_host }}:{{ ntfy_port }}"
ntfy_account_api: "http://127.0.0.1:{{ ntfy_port }}/v1/account"
ntfy_account_subscription_api: "{{ ntfy_account_api }}/subscription"
ntfy_compose_project_name: >-
  {{ (platform_project_name ~ '-ntfy')
     if platform_project_name | default('') | length > 0 else 'ntfy' }}

# Severity first, then subject. nas-critical cuts across every publisher and
# carries only what should get a human out of their chair, so it stays worth
# reacting to. The remaining topics are the routine record, one per subject, so
# deployment chatter can be muted without also muting container events.
ntfy_topic: nas-critical
ntfy_deployment_topic: nas-deployment
ntfy_containers_topic: nas-containers
# Seerr's request events. Their own subject, because a household member asking
# for a film is a different thing from a container restarting and a different
# thing again from a release landing, and each has to be mutable on its own.
ntfy_requests_topic: nas-requests
ntfy_topics: >-
  {{ [ntfy_topic, ntfy_deployment_topic, ntfy_containers_topic,
      ntfy_requests_topic] }}

# Where the provisioning proof publishes. Deliberately outside ntfy_topics: that
# list is what a managed user may declare access to and what subscriptions are
# synchronized for, so a topic absent from it is one no device can subscribe to
# and therefore one no human is ever notified about.
#
# Cache and Firebase headers do not achieve that. ntfy forwards a poll request
# to its upstream push server for every message when upstream-base-url is set,
# carrying the message id and nothing else; the phone then fetches the body from
# this server. Refusing the cache only removes the body it would fetch, so the
# proof arrived as an empty "New message" on every converge.
ntfy_verification_topic: nas-verification
ntfy_publishable_topics: "{{ ntfy_topics + [ntfy_verification_topic] }}"

# Each publisher is its own user with write-only access and one token, because a
# token inherits all of its user's rights. Sharing one identity would let a
# leaked token read notification history.
#
# topics lists exactly what each publisher may write to, so a leaked token
# cannot reach a subject its owner never reports on. Beszel emits only threshold
# breaches, so it needs nothing but the critical topic. Every publisher also
# holds the verification topic, which is what its provisioning proof writes to.
ntfy_publishers:
  - name: dozzle
    password_hash: "{{ vault_ntfy_dozzle_password_hash }}"
    token: "{{ vault_ntfy_dozzle_token }}"
    topics: "{{ [ntfy_topic, ntfy_containers_topic, ntfy_verification_topic] }}"
  - name: beszel
    password_hash: "{{ vault_ntfy_beszel_password_hash }}"
    token: "{{ vault_ntfy_beszel_token }}"
    topics: "{{ [ntfy_topic, ntfy_verification_topic] }}"
  - name: deploy
    password_hash: "{{ vault_ntfy_deploy_password_hash }}"
    token: "{{ vault_ntfy_deploy_token }}"
    topics: "{{ [ntfy_topic, ntfy_deployment_topic, ntfy_verification_topic] }}"
  # Seerr publishes only request events. It is the one publisher that is a
  # user-facing application rather than an operator tool, and it holds its own
  # identity rather than the deploy account's so it can be revoked without
  # silencing deployment reporting.
  - name: seerr
    password_hash: "{{ vault_ntfy_seerr_password_hash }}"
    token: "{{ vault_ntfy_seerr_token }}"
    topics: "{{ [ntfy_requests_topic, ntfy_verification_topic] }}"

# What counts as a deployment, for both the per-service reports and the
# run-level summary: a run that moved the release. The two must agree, or a
# service would report a deployment the summary denies happened.
#
# previous is published as a fact by deployment_bundle before it moves the
# deployment pointer. Empty means a first install, where every image really is
# new; absent means the bundle never ran — a selective converge — where the
# release did not move and there is nothing to report.
ntfy_deployment_previous_release: >-
  {{ deployment_bundle_previous_release_id
     if deployment_bundle_previous_release_id is defined
     else platform_release_id }}
ntfy_deployment_release_moved: >-
  {{ ntfy_deployment_previous_release != platform_release_id }}
# The controller checkout, which is the only place the Git history exists. The
# target holds releases, not a repository.
ntfy_deployment_summary_checkout: "{{ playbook_dir }}"
# A lock screen shows a few lines. Beyond this the body says how many were cut
# rather than scrolling a wall of subjects nobody reads on a phone.
ntfy_deployment_summary_max_commits: 8
ntfy_deployment_summary_changes: []
ntfy_deployment_summary_commits: []
