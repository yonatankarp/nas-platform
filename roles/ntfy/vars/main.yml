---
# Derived values live here rather than in set_fact: role vars are evaluated
# lazily where used, are not persisted as host facts, and keep the task list
# describing actions instead of computing strings.
#
# CAUTION: managed_users.yml's provision phase set_facts all three of these
# before env.j2 is rendered, and set_fact outranks role vars, so the values
# below are shadowed at render time. They are kept in step with that
# accumulator deliberately; change both or neither. Consolidating the two is
# tracked separately, in issue #21.
#
# ntfy's provisioning formats are <user>:<hash>:<role>, <user>:<topic>:<access>
# and <user>:<token>[:<label>], each a comma-separated list.
ntfy_auth_users: >-
  {{ ([vault_ntfy_admin_user ~ ':' ~ vault_ntfy_admin_password_hash ~ ':admin']
      + ntfy_publishers
        | map(attribute='name')
        | zip(ntfy_publishers | map(attribute='password_hash'))
        | map('join', ':')
        | map('regex_replace', '^(.*)$', '\1:user')
        | list) | join(',') }}

# One entry per publisher and topic it declares, rather than one topic for
# everybody: a publisher must not be able to write to a topic it has no reason
# to reach.
ntfy_auth_access: >-
  {{ (ntfy_publishers | subelements('topics') | map(attribute='0.name') | list)
     | zip(ntfy_publishers | subelements('topics') | map(attribute='1') | list)
     | map('join', ':')
     | map('regex_replace', '^(.*)$', '\1:write-only')
     | list | join(',') }}

ntfy_auth_tokens: >-
  {{ ntfy_publishers
     | map(attribute='name')
     | zip(ntfy_publishers | map(attribute='token'))
     | map('join', ':')
     | list | join(',') }}
