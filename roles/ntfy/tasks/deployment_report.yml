---
# One message per service Compose actually recreated. The report is published by
# the controller rather than from inside the container, so a service reports its
# own deployment without needing a credential baked into its image.
#
# Delivered through Pushover (pushover_publish.yml), not ntfy, since #558 stage
# 2b. The file, its include name and its ntfy_deployment_report_* variables keep
# the ntfy prefix until stage 3 deletes the role; see pushover_publish.yml.
#
# It used to speak for every service on every run that moved the release, so
# that a silent service could not be confused with one that was never deployed.
# That answer belongs to deployment_summary.yml, which publishes once per
# release with the full image diff and the commit subjects it carries: the
# reader already learns that the deployment happened and what it moved. Repeated
# per service, "already current" was fifteen notifications of which fourteen
# said nothing, and nobody read them.
#
# So the gate is the Compose result alone. A release that repins one image
# reports that one service; a converge that recreates nothing is silent in both
# directions.
- name: Publish the service deployment report
  ansible.builtin.include_tasks: pushover_publish.yml
  vars:
    ntfy_pushover_title: "{{ ntfy_deployment_report_service }} deployed (recreated)"
    ntfy_pushover_message: >-
      Compose recreated {{ ntfy_deployment_report_service }}
      at release {{ platform_release_id[:12] }}.
    # Quiet (a badge, no sound), because this is the per-service detail behind
    # the deployment summary, which is sent at normal priority.
    ntfy_pushover_priority: -1
  when:
    - ntfy_deployment_report_changed | bool
    - not ansible_check_mode
