---
# One message per service, on every run that moved the release. The report is
# published by the controller rather than from inside the container, so a
# service reports its own deployment without needing a token baked into its
# image: only dozzle and beszel hold tokens, and only because they alert while
# nothing else is running.
#
# It reports the service's outcome, not only the interesting half of it. Gating
# the message on "Compose recreated something" made the record unreadable: a
# release usually moves one image, Compose leaves every other stack running,
# and a service that says nothing is indistinguishable from one that was never
# deployed. Saying "already current" is the answer to the question the reader
# actually has.
#
# A converge that does not move the release still publishes nothing unless
# Compose recreated the service, so a selective converge and a re-run of the
# installed revision stay silent.
- name: Publish the service deployment report
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ ntfy_port }}/"
    method: POST
    headers:
      Authorization: "Bearer {{ vault_ntfy_deploy_token }}"
    body_format: json
    body:
      topic: "{{ ntfy_deployment_topic }}"
      title: >-
        {{ ntfy_deployment_report_service }} deployed
        ({{ 'recreated' if ntfy_deployment_report_changed | bool
            else 'already current' }})
      message: >-
        {{ ('Compose recreated ' ~ ntfy_deployment_report_service)
           if ntfy_deployment_report_changed | bool
           else ('Compose left ' ~ ntfy_deployment_report_service
                 ~ ' running unchanged') }}
        at release {{ platform_release_id[:12] }}.
      # Low, because this is the per-service detail behind the deployment
      # summary the poller sends at default priority.
      priority: 2
      tags: "{{ ['package'] if ntfy_deployment_report_changed | bool else ['heavy_check_mark'] }}"
    status_code: [200]
  # A refused publish fails the converge on purpose. It costs nothing: ntfy is
  # deployed and its publish path verified before any service role runs, so a
  # sink this task cannot reach has already aborted the play.
  #
  # Publishing is not host state, and the converge-every-run model asserts a
  # second run reports no changes.
  changed_when: false
  no_log: true
  when:
    - >-
      (ntfy_deployment_report_changed | bool) or
      (ntfy_deployment_release_moved | bool)
    - not ansible_check_mode
