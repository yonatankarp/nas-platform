---
# Provisioning is declarative: users, ACL entries and tokens are supplied as
# configuration, so nothing is created by CLI against a running server and the
# tokens are the same values the other services are given. ntfy deletes entries
# it previously provisioned once they leave the configuration, and refuses to
# change a provisioned token through its own API, which enforces the sole-owner
# model at the server rather than only in Ansible.
- name: Revalidate deployment paths before ntfy runtime use
  ansible.builtin.include_role:
    name: deployment_bundle
    tasks_from: target
  vars:
    deployment_target_service: ntfy
    deployment_target_require_current_release: true
    deployment_target_extra_paths:
      - "{{ nas_docker_root }}/ntfy/data/auth.db"

- name: Select the ntfy mounted state root
  ansible.builtin.set_fact:
    ntfy_state_root: "{{ nas_docker_root }}/ntfy/data"

- name: Require the internally derived ntfy mounted state root
  ansible.builtin.assert:
    that:
      - ntfy_state_root == (nas_docker_root ~ '/ntfy/data')

- name: Inspect existing ntfy declarative ownership and users
  block:
    - name: Inspect the prior ntfy runtime environment
      ansible.builtin.stat:
        path: "{{ platform_runtime_dir }}/services/ntfy/.env"
        follow: false
      register: ntfy_prior_environment_stat

    - name: Inspect the existing ntfy authentication database
      ansible.builtin.stat:
        path: "{{ ntfy_state_root }}/auth.db"
        follow: false
      register: ntfy_auth_database_stat

    - name: Require safe existing ntfy state files
      ansible.builtin.assert:
        that:
          - >-
            not ntfy_prior_environment_stat.stat.exists or
            (ntfy_prior_environment_stat.stat.isreg | default(false) and
             not (ntfy_prior_environment_stat.stat.islnk | default(false)))
          - >-
            not ntfy_auth_database_stat.stat.exists or
            (ntfy_auth_database_stat.stat.isreg | default(false) and
             not (ntfy_auth_database_stat.stat.islnk | default(false)))
        fail_msg: Existing ntfy state must use regular, non-symlink files.

    - name: Read the prior ntfy runtime environment
      ansible.builtin.slurp:
        src: "{{ platform_runtime_dir }}/services/ntfy/.env"
      register: ntfy_prior_environment_source
      when: ntfy_prior_environment_stat.stat.exists
      no_log: true

    - name: Parse prior ntfy declarative ownership
      ansible.builtin.set_fact:
        ntfy_prior_environment: >-
          {{ (ntfy_prior_environment_source.content | b64decode | managed_user_env)
             if ntfy_prior_environment_stat.stat.exists else {} }}
      no_log: true

    - name: Resolve prior ntfy declarative users
      ansible.builtin.set_fact:
        ntfy_prior_provisioned_users: >-
          {{ ntfy_prior_environment.NTFY_AUTH_USERS | default('') |
             ntfy_auth_users }}
      no_log: true
  rescue:
    - name: Refuse unsafe prior ntfy state
      ansible.builtin.fail:
        msg: >-
          Existing ntfy ownership state is malformed or unsafe; no configuration
          was changed. Restore the reviewed prior runtime environment and retry.

- name: Require prior ownership for an existing ntfy authentication database
  ansible.builtin.assert:
    that:
      - >-
        not ntfy_auth_database_stat.stat.exists or
        ntfy_prior_environment_stat.stat.exists
    fail_msg: >-
      Existing ntfy authentication state has no declarative ownership record.
      Restore the reviewed prior runtime environment before managing users.

- name: List authoritative existing ntfy users
  community.docker.docker_compose_v2_run:
    project_src: "{{ platform_current_dir }}/services/ntfy"
    project_name: "{{ ntfy_compose_project_name }}"
    files: "{{ platform_service_compose_files['ntfy'] }}"
    env_files: ["{{ platform_runtime_dir }}/services/ntfy/.env"]
    service: ntfy
    argv:
      - user
      - --auth-file=/var/lib/ntfy/auth.db
      - --auth-default-access=deny-all
      - list
    cleanup: true
    no_deps: true
    service_ports: false
    # community.docker 5.2.1 maps false to --no-interactive, which pinned
    # Compose v5.1.4 does not support. True omits the flag; no stdin is supplied.
    interactive: true
    tty: false
  register: ntfy_existing_user_list
  when:
    - ntfy_auth_database_stat.stat.exists
    - not ansible_check_mode
  failed_when: false
  changed_when: false
  no_log: true
  # The Compose file comes from the newly published bundle, but this runs before
  # the environment is rendered below, so the on-disk .env is still the previous
  # deployment's. Compose interpolates from the process environment too, which
  # keeps a first upgrade across a new required variable from failing here.
  environment:
    PLATFORM_CONTAINER_CPUSET: "{{ platform_effective_container_cpuset | default('') }}"

- name: Require authoritative ntfy user listing
  ansible.builtin.assert:
    that:
      - >-
        not ntfy_auth_database_stat.stat.exists or ansible_check_mode or
        ntfy_existing_user_list.rc | default(1) | int == 0
    fail_msg: >-
      Existing ntfy users could not be listed authoritatively; no configuration
      was changed. Restore runtime access to the auth database and retry.

- name: Resolve authoritative existing ntfy users
  ansible.builtin.set_fact:
    ntfy_existing_user_records: >-
      {{ (ntfy_existing_user_list.stdout | ntfy_user_list)
         if ntfy_auth_database_stat.stat.exists and not ansible_check_mode else {} }}
    ntfy_authoritative_absence_established: >-
      {{ not ntfy_auth_database_stat.stat.exists or
         (not ansible_check_mode and
          ntfy_existing_user_list.rc | default(1) | int == 0) }}
  no_log: true

- name: Report deferred authoritative ntfy inspection in check mode
  ansible.builtin.debug:
    msg: >-
      Existing ntfy identities require authoritative inspection during a normal
      convergence; check mode will not create a one-off probe container.
  when:
    - ansible_check_mode
    - ntfy_auth_database_stat.stat.exists
  changed_when: false

- name: Resolve declarative ntfy managed-user provisioning
  ansible.builtin.include_tasks: managed_users.yml
  vars:
    ntfy_managed_users_phase: provision

- name: Render the ntfy environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ platform_runtime_dir }}/services/ntfy/.env"
    mode: "0600"
  no_log: true

# The block exists for one thing the rescue does with the failure: it hands the
# deployment's own message to roles/container_health, which either explains it in
# terms of the container state Docker reports or re-raises it unchanged.
# Compose's `--wait` fails a crash-looping container with "container ... is
# unhealthy", which says nothing about why. roles/bindery/tasks/main.yml carries
# the long form of this argument; #509 built the mechanism and #537 wired the
# remaining eleven single-`up` roles into it.
- name: Deploy ntfy, catching a container that runs but never serves
  block:
    - name: Deploy ntfy
      community.docker.docker_compose_v2:
        project_src: "{{ platform_current_dir }}/services/ntfy"
        project_name: "{{ ntfy_compose_project_name }}"
        files: "{{ platform_service_compose_files['ntfy'] }}"
        env_files: ["{{ platform_runtime_dir }}/services/ntfy/.env"]
        state: present
        wait: true
        wait_timeout: "{{ platform_compose_wait_timeout }}"
      register: ntfy_deploy
  rescue:
    # First, and before anything else can rebind it: ansible_failed_result
    # belongs to whichever rescue is running.
    - name: Record the failed ntfy deployment
      ansible.builtin.set_fact:
        ntfy_deploy_failure_message: >-
          {{ ansible_failed_result.msg
             | default('the ntfy deployment failed and reported no message') }}

# Immediately after the deployment and before everything that trusts it. A
# container in `Restarting` still appears in `docker container ls --quiet`, so
# the CPU verification below would sail straight past one and the readiness probe
# after it would fail on a timeout that names nothing (#510).
#
# This pass detects, prints the evidence and publishes
# container_health_stuck_services WITHOUT refusing, because the recreate below
# has to happen before the verdict. It still re-raises a deployment failure that
# no stuck container explains.
- name: Detect an ntfy container that runs but never serves
  ansible.builtin.include_role:
    name: container_health
  vars:
    container_health_service_name: ntfy
    container_health_project_name: "{{ ntfy_compose_project_name }}"
    container_health_deploy_failure_message: >-
      {{ ntfy_deploy_failure_message | default('') }}
    container_health_refuse: false

# EXACTLY ONE force-recreate, of only the services Docker says are stuck.
# FORCED, because `up -d` against an unchanged specification keeps the same
# container and recreates nothing; `dependencies: false` renders as --no-deps, so
# a healthy sibling in the same project is not taken down to repair one container.
# CONDITIONAL, and that condition is the whole idempotence argument: the list is
# empty on a converged host and empty under --check, so this task is skipped on
# every run that has nothing to repair. BOUNDED AT ONE PER RUN by being a single
# task rather than a loop, with the verdict below re-checking, so a container
# looping for a reason a recreate cannot fix never goes green and never becomes
# an invisible retry loop.
- name: Recreate an ntfy container that runs but never serves
  block:
    - name: Force-recreate the stuck ntfy services
      community.docker.docker_compose_v2:
        project_src: "{{ platform_current_dir }}/services/ntfy"
        project_name: "{{ ntfy_compose_project_name }}"
        files: "{{ platform_service_compose_files['ntfy'] }}"
        env_files: ["{{ platform_runtime_dir }}/services/ntfy/.env"]
        services: "{{ container_health_stuck_services }}"
        dependencies: false
        recreate: always
        state: present
        wait: true
        wait_timeout: "{{ platform_compose_wait_timeout }}"
      when: container_health_stuck_services | default([]) | length > 0
      register: ntfy_wedged_recreate
  rescue:
    # Carried rather than re-raised here. `--wait` fails a container that came
    # back unhealthy, which the re-check below diagnoses far better than Compose
    # can; a recreate that failed for any OTHER reason left no stuck container
    # behind, and the second pass re-raises this message unchanged for that case.
    - name: Record the ntfy recreate that did not recover the service
      ansible.builtin.set_fact:
        ntfy_recreate_failure_message: >-
          The force-recreate reported: {{ ansible_failed_result.msg
          | default('no message') }}

# Whether a recreate was actually spent, recorded before the second pass
# overwrites the list it was decided from.
- name: Record whether an ntfy recreate was spent
  ansible.builtin.set_fact:
    ntfy_recreate_spent: >-
      {{ container_health_stuck_services | default([]) | length > 0 }}

- name: Report the ntfy wedged-container recovery check mode defers
  ansible.builtin.debug:
    msg: >-
      A live run would read every container of Compose project
      {{ ntfy_compose_project_name }} that Docker reports as restarting or
      unhealthy, print its state, force-recreate exactly those services once
      with no dependencies, and fail naming that retry if any of them came back
      stuck. Compose's dry run starts nothing and does not wait on container
      health, so check mode cannot reach that path and recreates nothing.
  when: ansible_check_mode

# The verdict. Nothing stuck here means the recreate worked, or that there was
# never anything to repair; either way the run continues. Anything still stuck
# fails, and says the retry has already been spent.
- name: Refuse an ntfy container that stayed wedged after its recreate
  ansible.builtin.include_role:
    name: container_health
  vars:
    container_health_service_name: ntfy
    container_health_project_name: "{{ ntfy_compose_project_name }}"
    container_health_deploy_failure_message: >-
      {{ ntfy_recreate_failure_message | default('') }}
    container_health_retried: "{{ ntfy_recreate_spent }}"

- name: Verify ntfy effective container CPU policy
  ansible.builtin.include_role:
    name: container_cpu
  vars:
    container_cpu_service_name: ntfy
    container_cpu_project_name: "{{ ntfy_compose_project_name }}"

- name: Wait for ntfy to report healthy
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ ntfy_port }}/v1/health"
    return_content: true
  register: ntfy_health
  until: ntfy_health.json.healthy | default(false)
  retries: "{{ platform_readiness_retries }}"
  delay: "{{ platform_readiness_delay }}"

- name: Synchronize managed ntfy account subscriptions
  ansible.builtin.include_tasks: managed_users.yml
  vars:
    ntfy_managed_users_phase: subscription_sync
  when: not ansible_check_mode

- name: Report the ntfy deployment
  ansible.builtin.include_tasks: deployment_report.yml
  vars:
    ntfy_deployment_report_service: ntfy
    # Both Compose results, because a force-recreate that repaired a wedged
    # container changed the deployment as surely as the deploy above did, and a
    # report gated on the deploy alone would say nothing on the one converge an
    # operator most wants to hear about. It is registered even when skipped, and
    # `default({})` covers the paths that never reach it at all.
    ntfy_deployment_report_changed: >-
      {{ (ntfy_deploy is changed)
         or ((ntfy_wedged_recreate | default({})) is changed) }}

- name: Verify managed ntfy users and declared access
  ansible.builtin.include_tasks:
    file: managed_users.yml
    apply:
      tags: [platform_verify_ntfy]
  vars:
    ntfy_managed_users_phase: verify
  tags: [platform_verify_ntfy]
  when: not ansible_check_mode

# Proving provisioning took effect matters more than proving a file was written:
# an unescaped or malformed hash leaves the server running with the alerting
# chain silently dead.
- name: Verify anonymous reads are refused
  tags: [platform_verify_ntfy]
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ ntfy_port }}/{{ ntfy_topic }}/json?poll=1"
    status_code: [403]

# Publishing is the only proof a publisher token actually works: the write-only
# check below reads with the same token and expects 403, which an invalid token
# also returns once anonymous reads are denied, so it cannot tell a working
# write-only token from a broken one. The token that matters most here is
# dozzle's, which nothing else exercises end to end; beszel proves its own
# webhook and the deploy publisher is proven by the deployment report failing
# the converge when publishing is refused.
#
# Published to the verification topic, which no managed user may declare access
# to and no device is subscribed to, so the proof reaches nobody. Cache and
# Firebase headers cannot achieve that on their own: ntfy forwards a poll request
# upstream for every message once upstream-base-url is set, and it carries the
# message id alone, so a phone is woken and then finds no body to fetch. Refusing
# the cache turned the proof into an empty notification rather than no
# notification, three times a converge, on the topic reserved for what is wrong.
#
# They are kept anyway: nothing should read this topic, so nothing should store
# it either.
- name: Verify each provisioned token can publish
  tags: [platform_verify_ntfy]
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ ntfy_port }}/{{ ntfy_verification_topic }}"
    method: POST
    headers:
      Authorization: "Bearer {{ item.token }}"
      Cache: "no"
      Firebase: "no"
    body: "provisioning verified for {{ item.name }}"
    status_code: [200]
  loop: "{{ ntfy_publishers }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false
  no_log: true

- name: Verify publisher tokens cannot read, proving the write-only ACL applied
  tags: [platform_verify_ntfy]
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ ntfy_port }}/{{ ntfy_topic }}/json?poll=1"
    headers:
      Authorization: "Bearer {{ item.token }}"
    status_code: [403]
  loop: "{{ ntfy_publishers }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
