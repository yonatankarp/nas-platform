---
# include_tasks never applies meta/argument_specs.yml, and the tasks below are
# gated on this phase, so an unrecognised value would silently skip them while
# the run still reported success. verify.yml reaches its verification tasks
# through exactly this mechanism.
- name: Validate the ntfy managed-user phase
  ansible.builtin.assert:
    that:
      - ntfy_managed_users_phase in ['provision', 'subscription_sync', 'verify']
    fail_msg: >-
      ntfy managed-user provisioning was included with a phase it does not
      implement. The tasks in this file are gated on ntfy_managed_users_phase,
      so an unrecognised phase silently skips them.

- name: Resolve ntfy provisioning ownership sets
  ansible.builtin.set_fact:
    ntfy_provisioned_identities: >-
      {{ ([vault_ntfy_admin_user] +
          (ntfy_publishers | map(attribute='name') | list) +
          (vault_managed_ntfy_users | map(attribute='username') | list)) |
         map('trim') | map('lower') | list }}
    ntfy_provisioned_tokens: >-
      {{ (ntfy_publishers | map(attribute='token') | list) +
         (vault_managed_ntfy_users | map(attribute='tokens') | list | flatten) }}
  when: ntfy_managed_users_phase == 'provision'
  no_log: true

- name: Refuse duplicate ntfy identities
  ansible.builtin.assert:
    that:
      - ntfy_provisioned_identities | reject('equalto', '') | list | length == ntfy_provisioned_identities | length
      - ntfy_provisioned_identities | unique | length == ntfy_provisioned_identities | length
    fail_msg: ntfy administrator, publisher, and managed identities must be separate.
  when: ntfy_managed_users_phase == 'provision'

- name: Refuse duplicate ntfy token ownership
  ansible.builtin.assert:
    that:
      - ntfy_provisioned_tokens | unique | length == ntfy_provisioned_tokens | length
    fail_msg: ntfy provisioning tokens must each have exactly one owner.
  when: ntfy_managed_users_phase == 'provision'

- name: Refuse duplicate managed ntfy topic declarations
  ansible.builtin.assert:
    that:
      - >-
        item.access | map(attribute='topic') | list | unique | length ==
        item.access | length
    fail_msg: Managed ntfy topic access declarations must be unique per user.
  loop: "{{ vault_managed_ntfy_users }}"
  loop_control:
    label: ntfy-managed-user
  when: ntfy_managed_users_phase == 'provision'
  no_log: true

- name: Validate ntfy provisioning encodings
  when: ntfy_managed_users_phase == 'provision'
  no_log: true
  block:
    - name: Validate ntfy administrator and publisher topic encoding
      ansible.builtin.assert:
        that:
          - vault_ntfy_admin_user is match('^[-_.+@A-Za-z0-9]+$')
          - ntfy_topic is match('^[-_A-Za-z0-9]{1,64}$')
        fail_msg: ntfy provisioning contains an unsafe identity or topic; values are redacted.

    - name: Validate ntfy publisher identity encoding
      ansible.builtin.assert:
        that:
          - item.name is string
          - item.name is match('^[-_.+@A-Za-z0-9]+$')
          - item.topics is sequence
          - item.topics is not string
          - item.topics is not mapping
          - item.topics | length > 0
          - item.topics | unique | length == item.topics | length
          - item.topics | difference(ntfy_publishable_topics) | length == 0
        fail_msg: ntfy provisioning contains an unsafe identity; values are redacted.
      loop: "{{ ntfy_publishers }}"
      loop_control:
        label: ntfy-publisher

    - name: Validate ntfy publisher topic encoding
      ansible.builtin.assert:
        that:
          - item.1 is string
          - item.1 is match('^[-_A-Za-z0-9]{1,64}$')
        fail_msg: ntfy provisioning contains an unsafe topic; values are redacted.
      loop: "{{ ntfy_publishers | subelements('topics') }}"
      loop_control:
        label: ntfy-publisher-topic

    - name: Validate managed ntfy identity encoding
      ansible.builtin.assert:
        that:
          - item.username is string
          - item.username is match('^[-_.+@A-Za-z0-9]+$')
        fail_msg: ntfy provisioning contains an unsafe identity; values are redacted.
      loop: "{{ vault_managed_ntfy_users }}"
      loop_control:
        label: ntfy-managed-user

    - name: Validate managed ntfy literal topic encoding
      ansible.builtin.assert:
        that:
          - item.1.topic is string
          - item.1.topic is match('^[-_A-Za-z0-9]{1,64}$')
        fail_msg: ntfy provisioning contains an unsafe topic; values are redacted.
      loop: "{{ vault_managed_ntfy_users | subelements('access') }}"
      loop_control:
        label: ntfy-managed-access

- name: Require managed ntfy accounts to remain nonadministrative
  ansible.builtin.assert:
    that:
      - item.role == 'user'
    fail_msg: >-
      Managed ntfy accounts are interactive nonadministrative users; values
      are redacted.
  loop: "{{ vault_managed_ntfy_users }}"
  loop_control:
    label: ntfy-managed-user
  when: ntfy_managed_users_phase == 'provision'
  no_log: true

- name: Initialize desired ntfy user ownership
  ansible.builtin.set_fact:
    ntfy_desired_owned_users:
      "{{ vault_ntfy_admin_user | trim | lower }}":
        username: "{{ vault_ntfy_admin_user }}"
        password_hash: "{{ vault_ntfy_admin_password_hash }}"
        role: admin
  when: ntfy_managed_users_phase == 'provision'
  no_log: true

- name: Add ntfy publishers to desired ownership
  ansible.builtin.set_fact:
    ntfy_desired_owned_users: >-
      {{ ntfy_desired_owned_users | combine({(item.name | trim | lower): {
           'username': item.name,
           'password_hash': item.password_hash,
           'role': 'user'
         }}) }}
  loop: "{{ ntfy_publishers }}"
  loop_control:
    label: ntfy-publisher
  when: ntfy_managed_users_phase == 'provision'
  no_log: true

- name: Add managed ntfy users to desired ownership
  ansible.builtin.set_fact:
    ntfy_desired_owned_users: >-
      {{ ntfy_desired_owned_users | combine({(item.username | trim | lower): {
           'username': item.username,
           'password_hash': item.password_hash,
           'role': item.role
         }}) }}
  loop: "{{ vault_managed_ntfy_users }}"
  loop_control:
    label: ntfy-managed-user
  when: ntfy_managed_users_phase == 'provision'
  no_log: true

- name: Refuse password hash replacement for owned ntfy identities
  ansible.builtin.assert:
    that:
      - >-
        item.key not in ntfy_prior_provisioned_users or
        ntfy_prior_provisioned_users[item.key].password_hash == item.value.password_hash
    fail_msg: >-
      Existing declaratively owned ntfy user does not have its preserved vault
      password hash. Run the reviewed credential-migration procedure; Ansible
      will not replace it automatically.
  loop: "{{ ntfy_desired_owned_users | dict2items }}"
  loop_control:
    label: ntfy-owned-user
  when: ntfy_managed_users_phase == 'provision'
  no_log: true

- name: Refuse out-of-ownership provisioned ntfy identities
  ansible.builtin.assert:
    that:
      - >-
        not (item.value.provisioned | default(false) | bool) or
        item.key in ntfy_prior_provisioned_users
    fail_msg: >-
      Existing server-config ntfy state is outside the prior declarative
      ownership record; no configuration was changed. Restore reviewed
      ownership state before retrying.
  loop: "{{ ntfy_existing_user_records | dict2items }}"
  loop_control:
    label: ntfy-existing-user
  when:
    - ntfy_managed_users_phase == 'provision'
    - not ansible_check_mode
  no_log: true

- name: Refuse automatic adoption of unmanaged ntfy identities
  ansible.builtin.assert:
    that:
      - >-
        item.key in ntfy_prior_provisioned_users or
        item.key not in ntfy_existing_user_records
    fail_msg: >-
      An existing ntfy identity is outside declarative ownership. Ansible will
      not adopt it or replace its password; run the reviewed credential-migration
      procedure first.
  loop: "{{ ntfy_desired_owned_users | dict2items }}"
  loop_control:
    label: ntfy-owned-user
  when:
    - ntfy_managed_users_phase == 'provision'
    - not ansible_check_mode
  no_log: true

- name: Require authoritative absence before provisioning new ntfy identities
  ansible.builtin.assert:
    that:
      - >-
        item.key in ntfy_prior_provisioned_users or
        ntfy_authoritative_absence_established | bool
    fail_msg: >-
      Absence of a new ntfy identity was not established authoritatively; no
      configuration was changed. Restore the prior state and retry.
  loop: "{{ ntfy_desired_owned_users | dict2items }}"
  loop_control:
    label: ntfy-owned-user
  when:
    - ntfy_managed_users_phase == 'provision'
    - not ansible_check_mode
  no_log: true

# The four tasks below append to these three lists one declaration at a time,
# which is the accumulator shape replaced elsewhere in this file. They keep it
# deliberately: none of them filters anything, they project every declaration
# into one auth-file record, and the record interleaves two or three fields of
# the same declaration. Jinja has no per-item format expression, so the loop-free
# form has to rebuild each record from parallel map(attribute=) passes zipped
# back together, which is correct only while those passes stay aligned. That is a
# silent-misalignment hazard over password hashes and access tokens that the loop
# cannot have, because the loop keeps one declaration's fields together. The
# order the records accumulate in is also load-bearing: the administrator leads,
# then publishers, then managed accounts, and the joined strings below depend on
# it.
- name: Initialize ntfy declarative provisioning entries
  ansible.builtin.set_fact:
    ntfy_auth_user_entries:
      - "{{ vault_ntfy_admin_user }}:{{ vault_ntfy_admin_password_hash }}:admin"
    ntfy_auth_access_entries: []
    ntfy_auth_token_entries: []
  when: ntfy_managed_users_phase == 'provision'
  no_log: true

- name: Add ntfy publisher user provisioning entries
  ansible.builtin.set_fact:
    ntfy_auth_user_entries: >-
      {{ ntfy_auth_user_entries + [item.name ~ ':' ~ item.password_hash ~ ':user'] }}
    ntfy_auth_access_entries: >-
      {{ ntfy_auth_access_entries +
         (item.topics | map('regex_replace', '^(.*)$',
                            item.name ~ ':\1:write-only') | list) }}
    ntfy_auth_token_entries: >-
      {{ ntfy_auth_token_entries + [item.name ~ ':' ~ item.token] }}
  loop: "{{ ntfy_publishers }}"
  loop_control:
    label: ntfy-publisher
  when: ntfy_managed_users_phase == 'provision'
  no_log: true

- name: Add managed ntfy user provisioning entries
  ansible.builtin.set_fact:
    ntfy_auth_user_entries: >-
      {{ ntfy_auth_user_entries +
         [item.username ~ ':' ~ item.password_hash ~ ':' ~ item.role] }}
  loop: "{{ vault_managed_ntfy_users }}"
  loop_control:
    label: ntfy-managed-user
  when: ntfy_managed_users_phase == 'provision'
  no_log: true

- name: Add managed ntfy access provisioning entries
  ansible.builtin.set_fact:
    ntfy_auth_access_entries: >-
      {{ ntfy_auth_access_entries +
         [item.0.username ~ ':' ~ item.1.topic ~ ':' ~ item.1.permission] }}
  loop: "{{ vault_managed_ntfy_users | subelements('access') }}"
  loop_control:
    label: ntfy-managed-access
  when:
    - ntfy_managed_users_phase == 'provision'
    - item.0.role == 'user'
  no_log: true

- name: Add managed ntfy token provisioning entries
  ansible.builtin.set_fact:
    ntfy_auth_token_entries: >-
      {{ ntfy_auth_token_entries + [item.0.username ~ ':' ~ item.1] }}
  loop: "{{ vault_managed_ntfy_users | subelements('tokens', skip_missing=True) }}"
  loop_control:
    label: ntfy-managed-token
  when: ntfy_managed_users_phase == 'provision'
  no_log: true

- name: Resolve ntfy declarative provisioning environment
  ansible.builtin.set_fact:
    ntfy_auth_users: "{{ ntfy_auth_user_entries | join(',') }}"
    ntfy_auth_access: "{{ ntfy_auth_access_entries | join(',') }}"
    ntfy_auth_tokens: "{{ ntfy_auth_token_entries | join(',') }}"
  when: ntfy_managed_users_phase == 'provision'
  no_log: true

- name: Validate managed ntfy subscription eligibility
  ansible.builtin.assert:
    that:
      - >-
        vault_managed_ntfy_users | map(attribute='username') | map('trim') |
        map('lower') | list | unique | length == vault_managed_ntfy_users | length
      - item.role == 'user'
      - item.access is sequence
      - item.access is not string
      - item.access is not mapping
    fail_msg: >-
      Managed ntfy subscription eligibility is invalid; no account
      subscription was changed.
  loop: "{{ vault_managed_ntfy_users }}"
  loop_control:
    label: ntfy-managed-user:subscription
  when:
    - ntfy_managed_users_phase in ['subscription_sync', 'verify']
    - not ansible_check_mode
  no_log: true

- name: Validate managed ntfy subscription ACL shape
  ansible.builtin.assert:
    that:
      - item.1 is mapping
      - item.1.keys() | list | sort == ['permission', 'topic']
      - item.1.topic is string
      - item.1.permission is string
      - item.1.topic is match('^[-_A-Za-z0-9]{1,64}$')
      - item.1.permission in ['read-only', 'write-only', 'read-write', 'deny']
    fail_msg: >-
      Managed ntfy subscription ACL data is invalid; no account subscription
      was changed.
  loop: "{{ vault_managed_ntfy_users | subelements('access') }}"
  loop_control:
    label: ntfy-managed-access
  when:
    - ntfy_managed_users_phase in ['subscription_sync', 'verify']
    - not ansible_check_mode
  no_log: true

- name: Select eligible managed ntfy subscription accounts
  ansible.builtin.set_fact:
    # An account is eligible when any of its declared access entries names a
    # configured topic it may read. subelements flattens the user-and-access
    # pairs so both halves of that predicate are one select each, and unique
    # collapses an account with several readable topics back to a single entry.
    # Two different accounts cannot be collapsed by unique: only byte-identical
    # mappings compare equal, which needs a repeated username, and the
    # eligibility assert above already refuses those.
    #
    # selectattr('access', 'sequence') is not decoration. The accumulator this
    # replaces fed a null access list straight into selectattr, which yields an
    # empty list and quietly skipped the account, whereas subelements raises on
    # it. The guard keeps that verdict rather than turning a skip into a failure.
    ntfy_subscription_eligible_users: >-
      {{ vault_managed_ntfy_users | selectattr('role', 'equalto', 'user')
         | selectattr('access', 'sequence')
         | subelements('access')
         | selectattr('1.topic', 'in', ntfy_topics)
         | selectattr('1.permission', 'in', ['read-only', 'read-write'])
         | map(attribute='0') | unique | list }}
  when:
    - ntfy_managed_users_phase in ['subscription_sync', 'verify']
    - not ansible_check_mode
  no_log: true

- name: Read all eligible managed ntfy accounts before subscription mutation
  ansible.builtin.uri:
    url: "{{ ntfy_account_api }}"
    method: GET
    url_username: "{{ item.username }}"
    url_password: "{{ item.password }}"
    force_basic_auth: true
    return_content: true
    status_code: [200]
  loop: "{{ ntfy_subscription_eligible_users }}"
  loop_control:
    label: ntfy-managed-user:subscription
  register: ntfy_subscription_account_reads
  when: ntfy_managed_users_phase == 'subscription_sync'
  changed_when: false
  no_log: true

# Redacted here and in every assert below that loops over these results: a
# failed iteration prints `item` in full, and item.item is the managed user
# record including its plaintext password.
- name: Validate all eligible managed ntfy account responses
  ansible.builtin.assert:
    that:
      - item.json is mapping
      - item.json.username | default('') == item.item.username
      - item.json.role | default('') == 'user'
      - item.json.subscriptions | default([]) is sequence
      - item.json.subscriptions | default([]) is not string
      - item.json.subscriptions | default([]) is not mapping
    fail_msg: >-
      An eligible managed ntfy account response has an unsupported schema; no
      account subscription was changed.
  loop: "{{ ntfy_subscription_account_reads.results }}"
  loop_control:
    label: ntfy-managed-user:subscription
  when: ntfy_managed_users_phase == 'subscription_sync'
  no_log: true

- name: Validate eligible managed ntfy subscription response entries
  ansible.builtin.assert:
    that:
      - item.1 is mapping
      - item.1.keys() | list | sort == ['base_url', 'display_name', 'topic']
      - item.1.base_url is string
      - item.1.topic is string
      - item.1.display_name is string or item.1.display_name is none
    fail_msg: >-
      An eligible managed ntfy subscription has an unsupported schema; no
      account subscription was changed.
  loop: "{{ ntfy_subscription_account_reads.results | subelements('json.subscriptions', skip_missing=True) }}"
  loop_control:
    label: ntfy-managed-user:subscription
  when: ntfy_managed_users_phase == 'subscription_sync'
  no_log: true

# The account read is per user, but a subscription is per user and topic, so
# every check below walks the cross product rather than one fixed topic.
- name: Refuse duplicate desired ntfy account subscriptions
  ansible.builtin.assert:
    that:
      - >-
        item.0.json.subscriptions | default([]) |
        selectattr('base_url', 'equalto', ntfy_base_url) |
        selectattr('topic', 'equalto', item.1) | list | length <= 1
    fail_msg: >-
      An eligible managed ntfy account has duplicate subscriptions to one
      topic; no account subscription was changed.
  loop: "{{ ntfy_subscription_account_reads.results | product(ntfy_topics) | list }}"
  loop_control:
    label: ntfy-managed-user:subscription
  when: ntfy_managed_users_phase == 'subscription_sync'
  no_log: true

- name: Initialize missing managed ntfy account subscriptions
  ansible.builtin.set_fact:
    ntfy_missing_subscriptions: []
  when: ntfy_managed_users_phase == 'subscription_sync'
  no_log: true

# This accumulator stays a loop where the eligibility one above became a filter
# expression. Its predicate compares one half of each pair against the other:
# whether this account may read this topic, and whether it is already subscribed
# to this topic. selectattr can only compare an attribute against a constant, so
# no filter chain expresses it. The remaining options are a Python plugin reading
# item.0.item and item.0.json, which would couple it to the internals of a
# registered uri result and unlike every plugin in filter_plugins/ would not take
# plain data, or an imperative Jinja {% for %} block, which is less readable than
# the declarative loop it would replace. Both cost more than the loop.
- name: Select missing managed ntfy account subscriptions
  ansible.builtin.set_fact:
    ntfy_missing_subscriptions: >-
      {{ ntfy_missing_subscriptions + [{'user': item.0.item, 'topic': item.1}] }}
  loop: "{{ ntfy_subscription_account_reads.results | product(ntfy_topics) | list }}"
  loop_control:
    label: ntfy-managed-user:subscription
  when:
    - ntfy_managed_users_phase == 'subscription_sync'
    # Only topics the account may actually read. A reader with critical-only
    # access must not be subscribed to the events topic it cannot fetch.
    - >-
      item.0.item.access | selectattr('topic', 'equalto', item.1) |
      selectattr('permission', 'in', ['read-only', 'read-write']) | list | length > 0
    - >-
      item.0.json.subscriptions | default([]) |
      selectattr('base_url', 'equalto', ntfy_base_url) |
      selectattr('topic', 'equalto', item.1) | list | length == 0
  no_log: true

- name: Reconcile each missing managed ntfy account subscription atomically
  ansible.builtin.include_tasks: subscription.yml
  loop: "{{ ntfy_missing_subscriptions }}"
  loop_control:
    loop_var: ntfy_subscription_pair
    label: ntfy-managed-user:subscription
  when: ntfy_managed_users_phase == 'subscription_sync'
  no_log: true

- name: Read eligible managed ntfy accounts for subscription verification
  ansible.builtin.uri:
    url: "{{ ntfy_account_api }}"
    method: GET
    url_username: "{{ item.username }}"
    url_password: "{{ item.password }}"
    force_basic_auth: true
    return_content: true
    status_code: [200]
  loop: "{{ ntfy_subscription_eligible_users }}"
  loop_control:
    label: ntfy-managed-user:subscription
  register: ntfy_subscription_verify_reads
  when:
    - ntfy_managed_users_phase == 'verify'
    - not ansible_check_mode
  changed_when: false
  no_log: true

- name: Validate eligible managed ntfy account responses for verification
  ansible.builtin.assert:
    that:
      - item.json is mapping
      - item.json.username | default('') == item.item.username
      - item.json.role | default('') == 'user'
      - item.json.subscriptions | default([]) is sequence
      - item.json.subscriptions | default([]) is not string
      - item.json.subscriptions | default([]) is not mapping
    fail_msg: >-
      An eligible managed ntfy account has an unsupported account schema.
  loop: "{{ ntfy_subscription_verify_reads.results }}"
  loop_control:
    label: ntfy-managed-user:subscription
  when:
    - ntfy_managed_users_phase == 'verify'
    - not ansible_check_mode
  no_log: true

- name: Verify managed ntfy account subscription entry schemas
  ansible.builtin.assert:
    that:
      - item.1 is mapping
      - item.1.keys() | list | sort == ['base_url', 'display_name', 'topic']
      - item.1.base_url is string
      - item.1.topic is string
      - item.1.display_name is string or item.1.display_name is none
    fail_msg: >-
      An eligible managed ntfy account has an unsupported subscription schema.
  loop: "{{ ntfy_subscription_verify_reads.results | subelements('json.subscriptions', skip_missing=True) }}"
  loop_control:
    label: ntfy-managed-user:subscription
  when:
    - ntfy_managed_users_phase == 'verify'
    - not ansible_check_mode
  no_log: true

- name: Verify synchronized managed ntfy account subscriptions
  ansible.builtin.assert:
    that:
      - >-
        item.0.json.subscriptions | default([]) |
        selectattr('base_url', 'equalto', ntfy_base_url) |
        selectattr('topic', 'equalto', item.1) | list | length ==
        (1 if item.0.item.access | selectattr('topic', 'equalto', item.1) |
              selectattr('permission', 'in', ['read-only', 'read-write']) |
              list | length > 0 else 0)
    fail_msg: >-
      An eligible managed ntfy account is not synchronized to exactly the
      topics it may read.
  loop: "{{ ntfy_subscription_verify_reads.results | product(ntfy_topics) | list }}"
  loop_control:
    label: ntfy-managed-user:subscription
  when:
    - ntfy_managed_users_phase == 'verify'
    - not ansible_check_mode
  no_log: true

- name: Basic-authenticate each managed ntfy user
  ansible.builtin.uri:
    url: "{{ ntfy_account_api }}"
    url_username: "{{ item.username }}"
    url_password: "{{ item.password }}"
    force_basic_auth: true
    status_code: [200]
  loop: "{{ vault_managed_ntfy_users }}"
  loop_control:
    label: ntfy-managed-user
  when: ntfy_managed_users_phase == 'verify'
  changed_when: false
  no_log: true

- name: Verify managed ntfy declared read access
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ ntfy_port }}/{{ item.1.topic }}/json?poll=1"
    url_username: "{{ item.0.username }}"
    url_password: "{{ item.0.password }}"
    force_basic_auth: true
    status_code: >-
      {{ [200] if item.0.role == 'admin' or
         item.1.permission in ['read-only', 'read-write'] else [403] }}
  loop: "{{ vault_managed_ntfy_users | subelements('access') }}"
  loop_control:
    label: ntfy-managed-read-access
  when:
    - ntfy_managed_users_phase == 'verify'
  changed_when: false
  no_log: true

- name: Verify managed ntfy declared write access
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ ntfy_port }}/{{ item.1.topic }}"
    method: POST
    url_username: "{{ item.0.username }}"
    url_password: "{{ item.0.password }}"
    force_basic_auth: true
    body: Managed-user provisioning verification
    status_code: >-
      {{ [200] if item.0.role == 'admin' or
         item.1.permission in ['write-only', 'read-write'] else [403] }}
  loop: "{{ vault_managed_ntfy_users | subelements('access') }}"
  loop_control:
    label: ntfy-managed-write-access
  when:
    - ntfy_managed_users_phase == 'verify'
    - not ansible_check_mode
  changed_when: false
  no_log: true
