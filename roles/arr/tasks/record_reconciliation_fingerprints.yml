---
- name: Build verified Arr reconciliation hash values
  ansible.builtin.set_fact:
    arr_reconciliation_record_values: >-
      {{ arr_desired_reconciliation_fingerprints |
         combine({
           'configarr_owned_state':
             (arr_verified_reconciliation_state_fingerprints | default({})).get(
               'configarr_owned_state', ''
             ),
           'configarr_opaque_context':
             (arr_verified_reconciliation_state_fingerprints | default({})).get(
               'configarr_opaque_context', ''
             )
         }) }}
  changed_when: false
  no_log: true

- name: Validate the recorded Arr reconciliation hash subset
  ansible.builtin.assert:
    that:
      - arr_reconciliation_fingerprint_subset_effective is sequence
      - arr_reconciliation_fingerprint_subset_effective is not mapping
      - arr_reconciliation_fingerprint_subset_effective is not string
      - >-
        arr_reconciliation_fingerprint_subset_effective | length ==
        arr_reconciliation_fingerprint_subset_effective | unique | list | length
      - >-
        arr_reconciliation_fingerprint_subset_effective |
        difference(arr_reconciliation_record_values.keys() | list) |
        length == 0
      - >-
        arr_reconciliation_fingerprint_subset_effective |
        map('extract', arr_reconciliation_record_values) |
        select('match', '^[0-9a-f]{64}$') | list | length ==
        arr_reconciliation_fingerprint_subset_effective | length
    fail_msg: The recorded Arr reconciliation hash subset is invalid.
  vars:
    arr_reconciliation_fingerprint_subset_effective: >-
      {{ arr_reconciliation_fingerprint_subset |
         default(arr_reconciliation_record_values.keys() | list) }}
  no_log: true

- name: Record verified Arr desired-input fingerprints
  ansible.builtin.copy:
    content: "{{ item.value }}\n"
    dest: >-
      {{ platform_runtime_dir }}/services/arr/{{ arr_reconciliation_fingerprint_filenames[item.key] }}
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0600"
    follow: false
  loop: >-
    {{ arr_reconciliation_record_values | dict2items |
       selectattr('key', 'in', arr_reconciliation_fingerprint_subset_effective) |
       list }}
  loop_control:
    label: "{{ item.key }}"
  vars:
    arr_reconciliation_fingerprint_subset_effective: >-
      {{ arr_reconciliation_fingerprint_subset |
         default(arr_reconciliation_record_values.keys() | list) }}
  no_log: true
