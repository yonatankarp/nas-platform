---
- name: Record verified Arr desired-input fingerprints
  ansible.builtin.copy:
    content: "{{ item.value }}\n"
    dest: >-
      {{ platform_runtime_dir }}/services/arr/{{ arr_reconciliation_fingerprint_filenames[item.key] }}
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0600"
    follow: false
  loop: "{{ arr_desired_reconciliation_fingerprints | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true
