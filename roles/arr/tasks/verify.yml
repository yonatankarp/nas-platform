---
- name: Read Servarr resources for verification
  ansible.builtin.uri:
    url: "{{ item.0.api }}/{{ item.1 }}"
    method: GET
    headers:
      X-Api-Key: "{{ item.0.api_key }}"
    status_code: [200]
    return_content: true
  loop: >-
    {{ arr_servarr_instances |
       product(['config/host', 'config/naming', 'rootfolder', 'downloadclient']) |
       list }}
  loop_control:
    label: "{{ item.0.name }}-{{ item.1 }}"
  register: arr_servarr_verification
  changed_when: false
  check_mode: false
  no_log: true
  tags: [platform_verify_arr]

- name: Verify Servarr authentication, roots, rename, and SABnzbd
  ansible.builtin.assert:
    that:
      - >-
        (arr_servarr_verification.results |
         selectattr('item.0.name', 'equalto', item.name) |
         selectattr('item.1', 'equalto', 'config/host') |
         map(attribute='json.authenticationMethod') | first | lower) == 'forms'
      - >-
        (arr_servarr_verification.results |
         selectattr('item.0.name', 'equalto', item.name) |
         selectattr('item.1', 'equalto', 'config/host') |
         map(attribute='json.authenticationRequired') | first | lower) == 'enabled'
      - >-
        (arr_servarr_verification.results |
         selectattr('item.0.name', 'equalto', item.name) |
         selectattr('item.1', 'equalto', 'config/naming') |
         map(attribute='json') | first)[item.rename_field] | bool ==
        media_arr_automatic_rename_enabled | bool
      - >-
        (arr_servarr_verification.results |
         selectattr('item.0.name', 'equalto', item.name) |
         selectattr('item.1', 'equalto', 'rootfolder') |
         map(attribute='json') | first |
         selectattr('path', 'equalto', item.root_folder) | list | length) == 1
      - arr_verify_servarr_clients_raw is sequence
      - arr_verify_servarr_clients_raw is not mapping
      - arr_verify_servarr_clients_raw is not string
      - arr_verify_servarr_sab_name_matches | length == 1
      - arr_verify_servarr_sab_url_matches | length == 1
      - >-
        arr_verify_servarr_sab_name_matches[0].id ==
        arr_verify_servarr_sab_url_matches[0].id
      - >-
        arr_verify_servarr_sab_name_matches[0] |
        acquisition_servarr_client_projection(
          arr_verify_servarr_sab_masked_fields
        ) ==
        arr_verify_servarr_sab_desired |
        acquisition_servarr_client_projection(
          arr_verify_servarr_sab_masked_fields
        )
    fail_msg: A Servarr instance differs from the declared Phase 1 state.
  loop: "{{ arr_servarr_instances }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    arr_verify_servarr_clients_raw: >-
      {{ arr_servarr_verification.results |
         selectattr('item.0.name', 'equalto', item.name) |
         selectattr('item.1', 'equalto', 'downloadclient') |
         map(attribute='json') | first | default([]) }}
    arr_verify_servarr_clients: >-
      {{ arr_verify_servarr_clients_raw
         if arr_verify_servarr_clients_raw is sequence and
            arr_verify_servarr_clients_raw is not mapping and
            arr_verify_servarr_clients_raw is not string
         else [] }}
    arr_verify_servarr_sab_name_matches: >-
      {{ arr_verify_servarr_clients |
         selectattr('name', 'equalto', arr_sabnzbd_client_name) | list }}
    arr_verify_servarr_sab_url_matches: >-
      {{ arr_verify_servarr_clients |
         acquisition_servarr_client_url_matches(arr_sabnzbd_host, arr_sabnzbd_port) }}
    arr_verify_servarr_sab_desired: >-
      {{ item |
         acquisition_servarr_client_body(
           arr_sabnzbd_client_name,
           arr_sabnzbd_host,
           arr_sabnzbd_port,
           vault_downloaders_sabnzbd_api_key,
           vault_downloaders_sabnzbd_admin_username,
           vault_downloaders_sabnzbd_admin_password
         ) }}
    arr_verify_servarr_sab_masked_fields: >-
      {{ arr_verify_servarr_sab_name_matches | first | default({}) |
         acquisition_servarr_client_masked_fields }}
  no_log: true
  tags: [platform_verify_arr]

- name: Read Prowlarr applications and indexers for verification
  ansible.builtin.uri:
    url: "{{ arr_prowlarr_api }}/{{ item }}"
    method: GET
    headers:
      X-Api-Key: "{{ vault_arr_prowlarr_api_key }}"
    status_code: [200]
    return_content: true
  loop: [applications, indexer]
  loop_control:
    label: "prowlarr-{{ item }}"
  register: arr_prowlarr_verification
  changed_when: false
  check_mode: false
  no_log: true
  tags: [platform_verify_arr]

- name: Verify both Prowlarr applications use fullSync
  ansible.builtin.assert:
    that:
      - arr_verify_prowlarr_applications_raw is sequence
      - arr_verify_prowlarr_applications_raw is not mapping
      - arr_verify_prowlarr_applications_raw is not string
      - arr_verify_prowlarr_application_matches | length == 1
      - >-
        arr_verify_prowlarr_application_matches[0] |
        acquisition_application_projection(
          arr_verify_prowlarr_application_masked_fields
        ) ==
        arr_verify_prowlarr_application_desired |
        acquisition_application_projection(
          arr_verify_prowlarr_application_masked_fields
        )
    fail_msg: A Prowlarr application differs from its complete owned projection.
  loop: "{{ arr_prowlarr_applications }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    arr_verify_prowlarr_applications_raw: >-
      {{ arr_prowlarr_verification.results |
         selectattr('item', 'equalto', 'applications') |
         map(attribute='json') | first | default([]) }}
    arr_verify_prowlarr_applications: >-
      {{ arr_verify_prowlarr_applications_raw
         if arr_verify_prowlarr_applications_raw is sequence and
            arr_verify_prowlarr_applications_raw is not mapping and
            arr_verify_prowlarr_applications_raw is not string
         else [] }}
    arr_verify_prowlarr_application_matches: >-
      {{ arr_verify_prowlarr_applications |
         selectattr('name', 'equalto', item.name) | list }}
    arr_verify_prowlarr_application_desired: >-
      {{ item |
         acquisition_application_body(
           arr_prowlarr_internal_url,
           arr_prowlarr_application_sync_level
         ) }}
    arr_verify_prowlarr_application_masked_fields: >-
      {{ arr_verify_prowlarr_application_matches | first | default({}) |
         acquisition_application_masked_fields }}
  no_log: true
  tags: [platform_verify_arr]

- name: Verify operator-owned Prowlarr indexers exist exactly once
  ansible.builtin.assert:
    that:
      - arr_verify_prowlarr_indexers_raw is sequence
      - arr_verify_prowlarr_indexers_raw is not mapping
      - arr_verify_prowlarr_indexers_raw is not string
      - arr_verify_prowlarr_indexer_matches | length == 1
      - >-
        arr_verify_prowlarr_indexer_matches[0] |
        acquisition_indexer_projection(
          item,
          arr_verify_prowlarr_indexer_masked_fields
        ) ==
        arr_verify_prowlarr_indexer_desired |
        acquisition_indexer_projection(
          item,
          arr_verify_prowlarr_indexer_masked_fields
        )
    fail_msg: An operator-owned Prowlarr indexer differs from its complete owned projection.
  loop: "{{ media_arr_indexers }}"
  loop_control:
    label: prowlarr-operator-indexer
  vars:
    arr_verify_prowlarr_indexers_raw: >-
      {{ arr_prowlarr_verification.results |
         selectattr('item', 'equalto', 'indexer') |
         map(attribute='json') | first | default([]) }}
    arr_verify_prowlarr_indexers: >-
      {{ arr_verify_prowlarr_indexers_raw
         if arr_verify_prowlarr_indexers_raw is sequence and
            arr_verify_prowlarr_indexers_raw is not mapping and
            arr_verify_prowlarr_indexers_raw is not string
         else [] }}
    arr_verify_prowlarr_indexer_matches: >-
      {{ arr_verify_prowlarr_indexers |
         selectattr('name', 'equalto', item.name) | list }}
    arr_verify_prowlarr_indexer_desired: >-
      {{ item | acquisition_indexer_body }}
    arr_verify_prowlarr_indexer_masked_fields: >-
      {{ arr_verify_prowlarr_indexer_matches | first | default({}) |
         acquisition_indexer_masked_fields(item) }}
  no_log: true
  tags: [platform_verify_arr]

- name: Read Bazarr settings for verification
  ansible.builtin.uri:
    url: "{{ arr_bazarr_api }}/system/settings"
    method: GET
    headers:
      X-API-KEY: "{{ vault_arr_bazarr_api_key }}"
    status_code: [200]
    return_content: true
  register: arr_bazarr_verification
  changed_when: false
  check_mode: false
  no_log: true
  tags: [platform_verify_arr]

- name: Verify Bazarr authentication and identical-path connections
  ansible.builtin.assert:
    that:
      - arr_bazarr_verification.json.auth.type == 'form'
      - arr_bazarr_verification.json.auth.username == vault_arr_bazarr_admin_username
      - arr_bazarr_verification.json.general.use_radarr | bool
      - arr_bazarr_verification.json.general.use_sonarr | bool
      - arr_bazarr_verification.json.radarr.ip == 'radarr'
      - arr_bazarr_verification.json.sonarr.ip == 'sonarr'
      - arr_bazarr_verification.json.general.path_mappings | length == 0
      - arr_bazarr_verification.json.general.path_mappings_movie | length == 0
      - >-
        arr_bazarr_verification.json.general.enabled_providers | sort ==
        media_bazarr_providers | map(attribute='name') | list | sort
    fail_msg: Bazarr differs from the declared Phase 1 connection state.
  no_log: true
  tags: [platform_verify_arr]

- name: Mark Arr reconciliation verification successful
  ansible.builtin.set_fact:
    arr_reconciliation_verification_succeeded: true
  changed_when: false
  no_log: true
  tags: [platform_verify_arr]
