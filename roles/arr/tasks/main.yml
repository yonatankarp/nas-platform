---
- name: Guard Arr critical state before Phase 1 activation
  ansible.builtin.include_tasks: state_guard.yml
  when: media_usenet_enabled | bool

- name: Revalidate deployment paths before Arr runtime use
  ansible.builtin.include_role:
    name: deployment_bundle
    tasks_from: target
  vars:
    deployment_target_service: arr
    deployment_target_require_current_release: true
    deployment_target_extra_paths:
      - "{{ platform_current_dir }}/services/arr/configarr.yml"
      - "{{ platform_runtime_dir }}/services/arr/configarr-repos"
      - "{{ arr_radarr_config_host_path }}"
      - "{{ arr_sonarr_config_host_path }}"
      - "{{ arr_prowlarr_config_host_path }}"
      - "{{ arr_bazarr_config_host_path }}"

- name: Require single-line Arr administrator credentials
  ansible.builtin.assert:
    that:
      - item.username is match('^[^\r\n]+$')
      - item.password is match('^[^\r\n]+$')
    fail_msg: Arr administrator credentials must be nonempty single-line values.
  loop:
    - username: "{{ vault_arr_radarr_admin_username }}"
      password: "{{ vault_arr_radarr_admin_password }}"
    - username: "{{ vault_arr_sonarr_admin_username }}"
      password: "{{ vault_arr_sonarr_admin_password }}"
    - username: "{{ vault_arr_prowlarr_admin_username }}"
      password: "{{ vault_arr_prowlarr_admin_password }}"
    - username: "{{ vault_arr_bazarr_admin_username }}"
      password: "{{ vault_arr_bazarr_admin_password }}"
  loop_control:
    label: arr-administrator-credential
  no_log: true

- name: Create the Configarr repository cache
  ansible.builtin.file:
    path: "{{ platform_runtime_dir }}/services/arr/configarr-repos"
    state: directory
    owner: "{{ nas_uid }}"
    group: "{{ nas_gid }}"
    mode: "0755"
  when: media_usenet_enabled | bool

- name: Render the private Arr environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ platform_runtime_dir }}/services/arr/.env"
    mode: "0600"
  no_log: true

- name: Stop the disabled Arr project
  community.docker.docker_compose_v2:
    project_src: "{{ platform_current_dir }}/services/arr"
    project_name: "{{ arr_compose_project_name }}"
    files: "{{ platform_service_compose_files['arr'] }}"
    env_files: ["{{ platform_runtime_dir }}/services/arr/.env"]
    state: absent
    remove_orphans: true
  when: not media_usenet_enabled | bool
  register: arr_stop

- name: Bootstrap deterministic Arr authentication
  ansible.builtin.include_tasks: bootstrap.yml
  when: media_usenet_enabled | bool

# The block exists for one thing the rescue does with the failure: it hands the
# deployment's own message to roles/container_health, which either explains it in
# terms of the container state Docker reports or re-raises it unchanged.
# Compose's `--wait` fails a crash-looping container with "container ... is
# unhealthy", which says nothing about why. roles/bindery/tasks/main.yml carries
# the long form of this argument; #509 built the mechanism and #537 wired the
# remaining eleven single-`up` roles into it.
- name: Deploy the Phase 1 Arr project, catching a container that runs but never serves
  when: media_usenet_enabled | bool
  block:
    - name: Deploy the Phase 1 Arr project
      community.docker.docker_compose_v2:
        project_src: "{{ platform_current_dir }}/services/arr"
        project_name: "{{ arr_compose_project_name }}"
        files: "{{ platform_service_compose_files['arr'] }}"
        env_files: ["{{ platform_runtime_dir }}/services/arr/.env"]
        state: present
        wait: true
        wait_timeout: "{{ arr_compose_wait_timeout }}"
      register: arr_deploy
  rescue:
    # First, and before anything else can rebind it: ansible_failed_result
    # belongs to whichever rescue is running.
    - name: Record the failed Arr deployment
      ansible.builtin.set_fact:
        arr_deploy_failure_message: >-
          {{ ansible_failed_result.msg
             | default('the Arr deployment failed and reported no message') }}

# Immediately after the deployment and before everything that trusts it. A
# container in `Restarting` still appears in `docker container ls --quiet`, so
# the CPU verification below would sail straight past one and the readiness probe
# after it would fail on a timeout that names nothing (#510).
#
# This pass detects, prints the evidence and publishes
# container_health_stuck_services WITHOUT refusing, because the recreate below
# has to happen before the verdict. It still re-raises a deployment failure that
# no stuck container explains.
- name: Detect an Arr container that runs but never serves
  ansible.builtin.include_role:
    name: container_health
  vars:
    container_health_service_name: arr
    container_health_project_name: "{{ arr_compose_project_name }}"
    container_health_deploy_failure_message: >-
      {{ arr_deploy_failure_message | default('') }}
    container_health_refuse: false
  when: media_usenet_enabled | bool

# EXACTLY ONE force-recreate, of only the services Docker says are stuck.
# FORCED, because `up -d` against an unchanged specification keeps the same
# container and recreates nothing; `dependencies: false` renders as --no-deps, so
# a healthy sibling in the same project is not taken down to repair one container.
# CONDITIONAL, and that condition is the whole idempotence argument: the list is
# empty on a converged host and empty under --check, so this task is skipped on
# every run that has nothing to repair. BOUNDED AT ONE PER RUN by being a single
# task rather than a loop, with the verdict below re-checking, so a container
# looping for a reason a recreate cannot fix never goes green and never becomes
# an invisible retry loop.
- name: Recreate an Arr container that runs but never serves
  when: media_usenet_enabled | bool
  block:
    - name: Force-recreate the stuck Arr services
      community.docker.docker_compose_v2:
        project_src: "{{ platform_current_dir }}/services/arr"
        project_name: "{{ arr_compose_project_name }}"
        files: "{{ platform_service_compose_files['arr'] }}"
        env_files: ["{{ platform_runtime_dir }}/services/arr/.env"]
        services: "{{ container_health_stuck_services }}"
        dependencies: false
        recreate: always
        state: present
        wait: true
        wait_timeout: "{{ arr_compose_wait_timeout }}"
      when: container_health_stuck_services | default([]) | length > 0
      register: arr_wedged_recreate
  rescue:
    # Carried rather than re-raised here. `--wait` fails a container that came
    # back unhealthy, which the re-check below diagnoses far better than Compose
    # can; a recreate that failed for any OTHER reason left no stuck container
    # behind, and the second pass re-raises this message unchanged for that case.
    - name: Record the Arr recreate that did not recover the service
      ansible.builtin.set_fact:
        arr_recreate_failure_message: >-
          The force-recreate reported: {{ ansible_failed_result.msg
          | default('no message') }}

# Whether a recreate was actually spent, recorded before the second pass
# overwrites the list it was decided from.
- name: Record whether an Arr recreate was spent
  ansible.builtin.set_fact:
    arr_recreate_spent: >-
      {{ container_health_stuck_services | default([]) | length > 0 }}
  when: media_usenet_enabled | bool

- name: Report the Arr wedged-container recovery check mode defers
  ansible.builtin.debug:
    msg: >-
      A live run would read every container of Compose project
      {{ arr_compose_project_name }} that Docker reports as restarting or
      unhealthy, print its state, force-recreate exactly those services once
      with no dependencies, and fail naming that retry if any of them came back
      stuck. Compose's dry run starts nothing and does not wait on container
      health, so check mode cannot reach that path and recreates nothing.
  when:
    - ansible_check_mode
    - media_usenet_enabled | bool

# The verdict. Nothing stuck here means the recreate worked, or that there was
# never anything to repair; either way the run continues. Anything still stuck
# fails, and says the retry has already been spent.
- name: Refuse an Arr container that stayed wedged after its recreate
  ansible.builtin.include_role:
    name: container_health
  vars:
    container_health_service_name: arr
    container_health_project_name: "{{ arr_compose_project_name }}"
    container_health_deploy_failure_message: >-
      {{ arr_recreate_failure_message | default('') }}
    container_health_retried: "{{ arr_recreate_spent }}"
  when: media_usenet_enabled | bool

- name: Load private Arr desired-input fingerprints
  ansible.builtin.include_tasks:
    file: reconciliation_fingerprints.yml
    apply:
      tags: [platform_verify_arr]
  vars:
    arr_reconciliation_fingerprint_subset:
      - configarr
      - configarr_owned_state
      - configarr_opaque_context
      - prowlarr_applications
      - prowlarr_indexers
      - bazarr_providers
  when: media_usenet_enabled | bool
  tags: [platform_verify_arr]

- name: Initialize Arr reconciliation verification gate
  ansible.builtin.set_fact:
    arr_reconciliation_verification_succeeded: false
  changed_when: false
  when: media_usenet_enabled | bool

- name: Mark the ordinary Arr reconciliation cycle started
  ansible.builtin.set_fact:
    arr_reconciliation_cycle_started: true
  changed_when: false
  when: media_usenet_enabled | bool

- name: Reconcile each Servarr instance
  ansible.builtin.include_tasks: reconcile_servarr.yml
  loop: "{{ arr_servarr_instances }}"
  loop_control:
    loop_var: arr_servarr_instance
    label: "{{ arr_servarr_instance.name }}"
  when: media_usenet_enabled | bool

- name: Reconcile Prowlarr applications and indexers
  ansible.builtin.include_tasks: reconcile_prowlarr.yml
  when: media_usenet_enabled | bool

- name: Reconcile Bazarr connections and operator settings
  ansible.builtin.include_tasks: reconcile_bazarr.yml
  when: media_usenet_enabled | bool

- name: Apply declarative Arr profiles with Configarr
  ansible.builtin.include_tasks: configarr.yml
  when: media_usenet_enabled | bool

- name: Report the Arr deployment
  ansible.builtin.include_role:
    name: ntfy
    tasks_from: deployment_report
  vars:
    ntfy_deployment_report_service: Arr
    # Both Compose results, because a force-recreate that repaired a wedged
    # container changed the deployment as surely as the deploy above did, and a
    # report gated on the deploy alone would say nothing on the one converge an
    # operator most wants to hear about. It is registered even when skipped, and
    # `default({})` covers the paths that never reach it at all.
    ntfy_deployment_report_changed: >-
      {{ (arr_deploy is changed)
         or ((arr_wedged_recreate | default({})) is changed) }}
  when: media_usenet_enabled | bool

- name: Verify the Arr project effective container CPU policy
  ansible.builtin.include_role:
    name: container_cpu
  vars:
    container_cpu_service_name: arr
    container_cpu_project_name: "{{ arr_compose_project_name }}"
  when:
    - media_usenet_enabled | bool

- name: Run Arr service verification
  ansible.builtin.include_tasks:
    file: verify.yml
    apply:
      tags: [platform_verify_arr]
  when: media_usenet_enabled | bool
  tags: [platform_verify_arr]

- name: Persist verified Arr desired-input fingerprints
  ansible.builtin.include_tasks: record_reconciliation_fingerprints.yml
  vars:
    arr_reconciliation_fingerprint_subset:
      - configarr
      - configarr_owned_state
      - configarr_opaque_context
      - prowlarr_applications
      - prowlarr_indexers
      - bazarr_providers
  when:
    - media_usenet_enabled | bool
    - not ansible_check_mode
    - arr_reconciliation_verification_succeeded is sameas true
