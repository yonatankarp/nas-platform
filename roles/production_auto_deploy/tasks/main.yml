---
- name: Restrict production auto-deployment to the NAS
  ansible.builtin.assert:
    that:
      - platform_kind == 'nas'
    fail_msg: Production auto-deployment installation is NAS-only.

- name: Require a dedicated non-root deployment account
  ansible.builtin.assert:
    that:
      - ansible_facts.user_uid | int != 0
      - production_auto_deploy_home | length > 1
    fail_msg: Install as the dedicated non-root deployment account.

- name: Require the public address clients actually use
  ansible.builtin.assert:
    that:
      - production_auto_deploy_public_host | length > 0
    fail_msg: >-
      Set production_auto_deploy_public_host to the address your devices use to
      reach published services, normally the same value as PLATFORM_PUBLIC_HOST.
      ntfy hashes it into the mobile push topic, so defaulting it to the LAN
      address would silently publish where nothing is subscribed.

- name: Require Python 3.12 or newer
  ansible.builtin.assert:
    that:
      - ansible_facts.python_version is version('3.12', '>=')
    fail_msg: >-
      production auto-deployment requires Python 3.12 or newer, found
      {{ ansible_facts.python_version }}.

- name: Require the reviewed vault and its password provider
  ansible.builtin.stat:
    path: "{{ item }}"
  register: production_auto_deploy_protected_inputs
  loop:
    - "{{ production_auto_deploy_vault_path }}"
    - "{{ production_auto_deploy_password_path }}"

- name: Reject missing or world-readable protected inputs
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - item.stat.mode == '0600'
    fail_msg: >-
      {{ item.item }} must exist as a regular mode-0600 file before the poller
      is installed.
  loop: "{{ production_auto_deploy_protected_inputs.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Require the controller checkout the poller deploys from
  ansible.builtin.stat:
    path: "{{ production_auto_deploy_checkout }}/.git"
  register: production_auto_deploy_checkout_git

- name: Reject an absent controller checkout
  ansible.builtin.assert:
    that:
      - production_auto_deploy_checkout_git.stat.exists
    fail_msg: >-
      Clone the repository to {{ production_auto_deploy_checkout }} before
      installing the poller.

- name: Require the controller virtualenv the poller runs Ansible from
  ansible.builtin.stat:
    path: "{{ production_auto_deploy_checkout }}/.venv/bin/ansible-playbook"
  register: production_auto_deploy_tooling

- name: Reject an absent controller virtualenv
  ansible.builtin.assert:
    that:
      - production_auto_deploy_tooling.stat.exists
    fail_msg: >-
      Create the controller virtualenv at
      {{ production_auto_deploy_checkout }}/.venv from
      controller-requirements.txt before installing the poller. Without it the
      first automatic poll fails and records the revision as attempted.

# The poller runs from cron with a deliberately narrow PATH, so it cannot rely
# on the operator's login environment. NAS firmwares scatter binaries across
# /usr/local, /usr/builtin and /opt, so discover them here instead of assuming
# /usr/bin, and record the result in the poller's configuration.
- name: Locate the tools the poller must run
  ansible.builtin.shell:
    cmd: command -v {{ item | quote }}
    executable: /bin/sh
  register: production_auto_deploy_tool_probe
  loop: [git, curl, docker]
  changed_when: false
  failed_when: false

- name: Require every tool the poller depends on
  ansible.builtin.assert:
    that:
      - item.rc | int == 0
      - item.stdout | trim | length > 0
    fail_msg: >-
      {{ item.item }} was not found on this host. The poller runs with a narrow
      PATH and cannot deploy without it.
  loop: "{{ production_auto_deploy_tool_probe.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Record the discovered tool locations
  ansible.builtin.set_fact:
    production_auto_deploy_tools: >-
      {{ dict(production_auto_deploy_tool_probe.results
              | map(attribute='item') | list
              | zip(production_auto_deploy_tool_probe.results
                    | map(attribute='stdout') | map('trim') | list)) }}

- name: Compose the poller's tool path
  ansible.builtin.set_fact:
    production_auto_deploy_tool_path: >-
      {{ (production_auto_deploy_tools.values() | map('dirname') | list
          + ['/usr/bin', '/bin']) | unique | join(':') }}

# Ansible checks locale.getlocale() and refuses to run when it reports None,
# which is what a scheduler's empty environment produces. Probe each candidate
# with the real interpreter rather than trusting locale -a, which is not
# functional on every firmware.
- name: Find a locale the installed Ansible accepts
  ansible.builtin.shell:
    cmd: >-
      env -i PATH={{ production_auto_deploy_tool_path | quote }}
      LANG={{ item | quote }}
      {{ (production_auto_deploy_checkout ~ '/.venv/bin/ansible-playbook') | quote }}
      --version
    executable: /bin/sh
  register: production_auto_deploy_locale_probe
  loop: "{{ production_auto_deploy_locale_candidates }}"
  changed_when: false
  failed_when: false

- name: Record the first locale that worked
  ansible.builtin.set_fact:
    production_auto_deploy_locale: >-
      {{ (production_auto_deploy_locale_probe.results
          | selectattr('rc', 'equalto', 0) | map(attribute='item') | list
          + ['']) | first }}

- name: Require a locale Ansible accepts
  ansible.builtin.assert:
    that:
      - production_auto_deploy_locale | length > 0
    fail_msg: >-
      None of {{ production_auto_deploy_locale_candidates | join(', ') }} is a
      usable UTF-8 locale on this host, and Ansible refuses to run without one.
      Add a working locale to production_auto_deploy_locale_candidates.

# Some NAS firmwares ship BusyBox crontab without the setuid bit and keep the
# spool root-owned, so an unprivileged account cannot schedule anything. Probe
# here rather than discovering it at the final task, after everything else has
# already been installed. An empty crontab is a success: the implementations
# differ on exit status but say so on stderr.
- name: Check whether this account can manage its own crontab
  ansible.builtin.command:
    argv: [crontab, -l]
  register: production_auto_deploy_crontab_probe
  failed_when: false
  changed_when: false
  when: not production_auto_deploy_external_scheduler | bool

- name: Require a usable crontab or an acknowledged external scheduler
  ansible.builtin.assert:
    that:
      - >-
        production_auto_deploy_crontab_probe.rc | default(1) | int == 0 or
        'no crontab' in
        (production_auto_deploy_crontab_probe.stderr | default('') | lower)
    fail_msg: >-
      This account cannot manage its own crontab:
      {{ production_auto_deploy_crontab_probe.stderr | default('crontab failed') | trim }}.
      Schedule {{ production_auto_deploy_launcher_path }} --poll every five
      minutes with the firmware's own scheduler, running as this account, then
      re-run with -e production_auto_deploy_external_scheduler=true.
  when: not production_auto_deploy_external_scheduler | bool

- name: Report the external polling schedule this installation relies on
  ansible.builtin.debug:
    msg: >-
      Cron is managed externally. Ensure
      {{ production_auto_deploy_launcher_path }} --poll runs every five minutes
      as this account.
  when: production_auto_deploy_external_scheduler | bool

- name: Create the private runtime directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ production_auto_deploy_share_root }}"
    - "{{ production_auto_deploy_poller_root }}"
    - "{{ production_auto_deploy_state_root }}"
    - "{{ production_auto_deploy_log_root }}"
    - "{{ production_auto_deploy_config_root }}"
    - "{{ production_auto_deploy_launcher_root }}"

- name: Install the reviewed poller
  ansible.builtin.copy:
    src: "{{ production_auto_deploy_checkout }}/scripts/production_auto_deploy.py"
    dest: "{{ production_auto_deploy_poller_path }}"
    mode: "0700"
    remote_src: true

- name: Install the operator launcher
  ansible.builtin.template:
    src: nas-platform-deploy.j2
    dest: "{{ production_auto_deploy_launcher_path }}"
    mode: "0700"

- name: Write the non-secret poller configuration
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ production_auto_deploy_config_path }}"
    mode: "0600"

- name: Render the protected ntfy publisher configuration
  ansible.builtin.template:
    src: ntfy.curl.j2
    dest: "{{ production_auto_deploy_notifier_path }}"
    mode: "0600"
  no_log: true

- name: Install one polling cron entry
  when: not production_auto_deploy_external_scheduler | bool
  ansible.builtin.cron:
    name: "{{ production_auto_deploy_cron_name }}"
    minute: "*/5"
    job: "{{ production_auto_deploy_launcher_path }} --poll"
    state: present
  tags:
    - production_auto_deploy_cron
