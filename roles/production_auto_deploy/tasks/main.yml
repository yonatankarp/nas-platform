---
- name: Restrict production auto-deployment to the NAS
  ansible.builtin.assert:
    that:
      - platform_kind == 'nas'
    fail_msg: Production auto-deployment is NAS-only.

- name: Restrict disposable installer test hooks to Darwin
  ansible.builtin.assert:
    that:
      - >-
        not (production_auto_deploy_test_mode | bool) or
        (ansible_facts.system == 'Darwin' and
         production_auto_deploy_test_root is match(
           '^' ~ (ansible_facts.user_dir | regex_escape) ~
           '/production-auto-deploy-role[.][A-Za-z0-9_-]+$'))
      - >-
        (production_auto_deploy_test_mode | bool) or
        (production_auto_deploy_test_root | length == 0 and
         production_auto_deploy_test_trusted_owner_uid | int == 0 and
         production_auto_deploy_test_identity | length == 0 and
         production_auto_deploy_test_poller_source | length == 0 and
         production_auto_deploy_test_fail_activation | length == 0 and
         production_auto_deploy_test_activation_delay | int == 0 and
         production_auto_deploy_test_lock_delay | int == 0 and
         production_auto_deploy_test_lock_marker | length == 0 and
         production_auto_deploy_test_power_boundary | length == 0 and
         production_auto_deploy_test_power_marker | length == 0)
    fail_msg: Disposable installer test hooks are unavailable on a production NAS.

# This command is deliberately independent of HOME and inventory account
# variables. pwd(3) is the authority for the process that will own the cron job.
- name: Resolve the effective account identity from the operating system
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.python.executable }}"
      - -c
      - |
        import json
        import os
        import pwd

        entry = pwd.getpwuid(os.geteuid())
        print(json.dumps({
            "uid": entry.pw_uid,
            "gid": entry.pw_gid,
            "user": entry.pw_name,
            "home": entry.pw_dir,
        }, separators=(",", ":")))
  register: production_auto_deploy_identity_command
  changed_when: false
  check_mode: false

- name: Record the effective deployment account
  ansible.builtin.set_fact:
    production_auto_deploy_effective_identity: >-
      {{ (production_auto_deploy_test_identity
          if (production_auto_deploy_test_mode | bool and
              production_auto_deploy_test_identity | length > 0)
          else (production_auto_deploy_identity_command.stdout | from_json)) }}

- name: Resolve exact effective account fields
  ansible.builtin.set_fact:
    production_auto_deploy_effective_uid: >-
      {{ production_auto_deploy_effective_identity.uid | int }}
    production_auto_deploy_effective_gid: >-
      {{ production_auto_deploy_effective_identity.gid | int }}
    production_auto_deploy_effective_user: >-
      {{ production_auto_deploy_effective_identity.user }}
    production_auto_deploy_effective_home: >-
      {{ production_auto_deploy_effective_identity.home }}

- name: Require an exact effective non-root account and home
  ansible.builtin.assert:
    that:
      - production_auto_deploy_effective_uid | int != 0
      - production_auto_deploy_effective_user | length > 0
      - production_auto_deploy_effective_home is match('^/.*$')
      - production_auto_deploy_effective_home != '/'
      - >-
        (production_auto_deploy_test_mode | bool) or
        (production_auto_deploy_effective_uid | int == ansible_facts.user_uid | int and
         production_auto_deploy_effective_user == ansible_facts.user_id and
         production_auto_deploy_effective_home == ansible_facts.user_dir)
    fail_msg: >-
      The production poller requires the exact effective non-root account and
      its operating-system home directory.

- name: Derive the complete private path policy
  ansible.builtin.set_fact:
    production_auto_deploy_deployment_home: >-
      {{ (production_auto_deploy_test_root
          if (production_auto_deploy_test_mode | bool)
          else production_auto_deploy_effective_home) }}
    production_auto_deploy_root: >-
      {{ (production_auto_deploy_test_root
          if (production_auto_deploy_test_mode | bool)
          else production_auto_deploy_effective_home) ~ '/.local/share/nas-platform' }}
    production_auto_deploy_protected_root: >-
      {{ (production_auto_deploy_test_root
          if (production_auto_deploy_test_mode | bool)
          else production_auto_deploy_effective_home) ~ '/.config/nas-platform' }}
    production_auto_deploy_controller_root: >-
      {{ (production_auto_deploy_test_root
          if (production_auto_deploy_test_mode | bool)
          else production_auto_deploy_effective_home) ~ '/.local/share/nas-platform/controller' }}
    production_auto_deploy_tooling_root: >-
      {{ (production_auto_deploy_test_root
          if (production_auto_deploy_test_mode | bool)
          else production_auto_deploy_effective_home) ~ '/.local/share/nas-platform/tooling' }}
    production_auto_deploy_state_root: >-
      {{ (production_auto_deploy_test_root
          if (production_auto_deploy_test_mode | bool)
          else production_auto_deploy_effective_home) ~ '/.local/share/nas-platform/state' }}
    production_auto_deploy_log_root: >-
      {{ (production_auto_deploy_test_root
          if (production_auto_deploy_test_mode | bool)
          else production_auto_deploy_effective_home) ~ '/.local/share/nas-platform/logs' }}
    production_auto_deploy_bin_root: >-
      {{ (production_auto_deploy_test_root ~ '/.local/bin')
          if (production_auto_deploy_test_mode | bool)
          else (production_auto_deploy_effective_home ~ '/.local/bin') }}
    production_auto_deploy_libexec_root: >-
      {{ (production_auto_deploy_test_root ~ '/.local/libexec/nas-platform')
          if (production_auto_deploy_test_mode | bool)
          else (production_auto_deploy_effective_home ~ '/.local/libexec/nas-platform') }}
    production_auto_deploy_poller_effective_home_line: >-
      {{ ('    effective_home = Path(' ~
          (production_auto_deploy_test_root | to_json) ~ ')')
         if (production_auto_deploy_test_mode | bool)
         else '    effective_home = Path(pwd.getpwuid(os.geteuid()).pw_dir)' }}

- name: Resolve protected input and installed asset paths
  ansible.builtin.set_fact:
    production_auto_deploy_vault_path: "{{ platform_vault_file }}"
    production_auto_deploy_password_path: >-
      {{ production_auto_deploy_vault_password_file
         if production_auto_deploy_vault_password_file | length > 0
         else production_auto_deploy_protected_root ~ '/vault-password' }}
    production_auto_deploy_config_path: "{{ production_auto_deploy_protected_root }}/deployer.json"
    production_auto_deploy_notifier_path: "{{ production_auto_deploy_protected_root }}/ntfy.curl"
    production_auto_deploy_launcher_path: "{{ production_auto_deploy_bin_root }}/nas-platform-deploy"
    production_auto_deploy_generations_root: "{{ production_auto_deploy_libexec_root }}/generations"
    production_auto_deploy_current_path: "{{ production_auto_deploy_libexec_root }}/current"
    production_auto_deploy_poller_path: "{{ production_auto_deploy_libexec_root }}/current/production_auto_deploy.py"
    production_auto_deploy_poller_source: >-
      {{ production_auto_deploy_test_poller_source
         if (production_auto_deploy_test_mode | bool and
             production_auto_deploy_test_poller_source | length > 0)
         else role_path ~ '/../../scripts/production_auto_deploy.py' }}

- name: Validate fixed coordinates and complete path derivation
  ansible.builtin.assert:
    that:
      - platform_release_id is match('^[0-9a-f]{40}$')
      - production_auto_deploy_repository == 'yonatankarp/nas-platform'
      - production_auto_deploy_repository_url == 'https://github.com/yonatankarp/nas-platform.git'
      - production_auto_deploy_workflow == 'ci.yml'
      - production_auto_deploy_workflow_name == 'CI'
      - production_auto_deploy_branch == 'main'
      - production_auto_deploy_github_api_base == 'https://api.github.com'
      - production_auto_deploy_nas_address == '192.168.0.139'
      - platform_public_host == production_auto_deploy_nas_address
      - platform_callback_host == production_auto_deploy_nas_address
      - production_auto_deploy_log_retention_count | int == 20
      - production_auto_deploy_log_retention_days | int == 30
      - production_auto_deploy_root is match('^' ~ (production_auto_deploy_effective_home | regex_escape) ~ '/')
      - >-
        production_auto_deploy_deployment_home ==
        ((production_auto_deploy_test_mode | bool) |
         ternary(production_auto_deploy_test_root,
                 production_auto_deploy_effective_home))
      - not production_auto_deploy_controller_root.startswith('/volume1/Docker/nas-platform/')
      - production_auto_deploy_controller_root != '/volume1/Docker/nas-platform'
      - production_auto_deploy_vault_path == production_auto_deploy_protected_root ~ '/vault.yml'
      - production_auto_deploy_password_path == production_auto_deploy_protected_root ~ '/vault-password'
      - production_auto_deploy_config_path == production_auto_deploy_deployment_home ~ '/.config/nas-platform/deployer.json'
      - production_auto_deploy_controller_python is match('^/')
      - >-
        (production_auto_deploy_lock_proof | length == 0 and
         production_auto_deploy_lock_pid | int == 0 and
         production_auto_deploy_lock_proof_path | length == 0) or
        (production_auto_deploy_lock_proof is match('^[0-9a-f]{64}$') and
         production_auto_deploy_lock_pid | int > 1 and
         production_auto_deploy_lock_proof_path is match(
           '^' ~ (production_auto_deploy_root | regex_escape) ~
           '/[.]production-auto-deploy-lock-proof-[0-9a-f]{64}[.]json$'))
    fail_msg: Production poller identity, address, retention, or path policy differs.

- name: Inspect private roots and protected inputs before mutation
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ production_auto_deploy_deployment_home }}"
    - "{{ production_auto_deploy_root }}"
    - "{{ production_auto_deploy_protected_root }}"
    - "{{ production_auto_deploy_vault_path }}"
    - "{{ production_auto_deploy_password_path }}"
  register: production_auto_deploy_protected_input_stats

- name: Require trusted private roots before mutation
  ansible.builtin.assert:
    that:
      - production_auto_deploy_protected_input_stats.results[0].stat.exists
      - production_auto_deploy_protected_input_stats.results[0].stat.isdir
      - not production_auto_deploy_protected_input_stats.results[0].stat.islnk
      - production_auto_deploy_protected_input_stats.results[0].stat.pw_name == production_auto_deploy_effective_user
      - production_auto_deploy_protected_input_stats.results[0].stat.mode == '0700'
      - >-
        not production_auto_deploy_protected_input_stats.results[1].stat.exists or
        (production_auto_deploy_protected_input_stats.results[1].stat.isdir and
         not production_auto_deploy_protected_input_stats.results[1].stat.islnk and
         production_auto_deploy_protected_input_stats.results[1].stat.pw_name ==
           production_auto_deploy_effective_user and
         production_auto_deploy_protected_input_stats.results[1].stat.mode == '0700')
      - production_auto_deploy_protected_input_stats.results[2].stat.isdir
      - not production_auto_deploy_protected_input_stats.results[2].stat.islnk
      - production_auto_deploy_protected_input_stats.results[2].stat.pw_name == production_auto_deploy_effective_user
      - production_auto_deploy_protected_input_stats.results[2].stat.mode == '0700'
    fail_msg: >-
      Private poller roots must be real directories owned by the effective
      account, with private roots mode 0700.

- name: Require protected vault and password files before mutation
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - not item.stat.islnk
      - item.stat.pw_name == production_auto_deploy_effective_user
      - item.stat.mode == '0600'
    fail_msg: >-
      Protected vault/password inputs must be regular non-symlink files owned
      by the effective account with mode 0600.
  loop: "{{ production_auto_deploy_protected_input_stats.results[3:] }}"
  loop_control:
    label: "{{ item.item }}"
  no_log: true

- name: Validate protected input ancestry and canonical containment
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.python.executable }}"
      - -c
      - |
        import os
        import stat
        import sys

        home, root, protected, vault, password = map(os.path.normpath, sys.argv[1:6])
        expected_uid = int(sys.argv[6])
        paths = (root, protected, vault, password)
        if not os.path.isabs(home) or os.path.realpath(home) != home:
            raise SystemExit("effective home is not canonical")
        for path in paths:
            if not os.path.isabs(path) or os.path.commonpath((home, path)) != home:
                raise SystemExit("protected path escapes effective home")
            current = home
            relative = os.path.relpath(path, home)
            for part in (() if relative == "." else relative.split(os.sep)):
                current = os.path.join(current, part)
                try:
                    entry = os.lstat(current)
                except FileNotFoundError:
                    break
                if stat.S_ISLNK(entry.st_mode) or os.path.realpath(current) != current:
                    raise SystemExit("protected ancestry is not canonical")
                if (stat.S_ISDIR(entry.st_mode)
                        and (entry.st_uid != expected_uid
                             or stat.S_IMODE(entry.st_mode) != 0o700)):
                    raise SystemExit("protected ancestry is not private")
      - "{{ production_auto_deploy_deployment_home }}"
      - "{{ production_auto_deploy_root }}"
      - "{{ production_auto_deploy_protected_root }}"
      - "{{ production_auto_deploy_vault_path }}"
      - "{{ production_auto_deploy_password_path }}"
      - "{{ production_auto_deploy_effective_uid | string }}"
  changed_when: false
  check_mode: false
  no_log: true

- name: Validate trusted executable prerequisites
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.python.executable }}"
      - -c
      - |
        import os
        import stat
        import sys

        expected_owner = int(sys.argv[1])
        test_mode = sys.argv[2] == "1"
        for index, path in enumerate(sys.argv[3:]):
            required_owner = expected_owner if index == 0 else 0
            if not os.path.isabs(path):
                raise SystemExit(f"trusted executable is not absolute: {path}")
            entry = os.lstat(path)
            if (not stat.S_ISREG(entry.st_mode) or stat.S_ISLNK(entry.st_mode)
                    or entry.st_uid != required_owner
                    or entry.st_mode & (stat.S_IWGRP | stat.S_IWOTH)
                    or not entry.st_mode & (stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
                    or os.path.realpath(path) != path):
                raise SystemExit(f"trusted executable is unsafe: {path}")
            if test_mode:
                continue
            current = os.path.dirname(path)
            while current != os.path.dirname(current):
                ancestor = os.lstat(current)
                if (not stat.S_ISDIR(ancestor.st_mode) or ancestor.st_uid != 0
                        or ancestor.st_mode & (stat.S_IWGRP | stat.S_IWOTH)):
                    raise SystemExit(f"trusted executable ancestry is unsafe: {path}")
                current = os.path.dirname(current)
      - >-
        {{ (production_auto_deploy_test_trusted_owner_uid
            if (production_auto_deploy_test_mode | bool) else 0) | string }}
      - "{{ (production_auto_deploy_test_mode | bool) | ternary('1', '0') }}"
      - "{{ production_auto_deploy_controller_python }}"
      - /usr/bin/git
      - /usr/bin/curl
  changed_when: false
  check_mode: false

- name: Read controller Python version
  ansible.builtin.command:
    argv:
      - "{{ production_auto_deploy_controller_python }}"
      - -c
      - "import sys; print(f'{sys.version_info[0]}.{sys.version_info[1]}')"
  register: production_auto_deploy_controller_python_version
  changed_when: false
  check_mode: false

- name: Read the installed Ansible Python version
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - -c
      - "import sys; print(f'{sys.version_info[0]}.{sys.version_info[1]}')"
  register: production_auto_deploy_ansible_python_version
  changed_when: false
  check_mode: false

- name: Require installed Ansible to run under Python 3.12 or newer
  ansible.builtin.assert:
    that:
      - production_auto_deploy_ansible_python_version.stdout | trim is version('3.12', '>=')
    fail_msg: >-
      Installed Ansible runs under Python
      {{ production_auto_deploy_ansible_python_version.stdout | trim }};
      production auto-deployment requires Ansible itself to run under Python
      3.12 or newer.

- name: Require controller Python 3.12 or newer
  ansible.builtin.assert:
    that:
      - production_auto_deploy_controller_python_version.stdout | trim is version('3.12', '>=')
    fail_msg: >-
      Installed Ansible runs under controller Python
      {{ production_auto_deploy_controller_python_version.stdout | trim }};
      production auto-deployment requires a trusted Python 3.12 or newer.

- name: Require controller pip bootstrap support
  ansible.builtin.command:
    argv:
      - "{{ production_auto_deploy_controller_python }}"
      - -m
      - pip
      - --version
  changed_when: false
  check_mode: false

- name: Inspect existing managed directories before mutation
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ production_auto_deploy_controller_root }}"
    - "{{ production_auto_deploy_tooling_root }}"
    - "{{ production_auto_deploy_state_root }}"
    - "{{ production_auto_deploy_log_root }}"
    - "{{ production_auto_deploy_bin_root }}"
    - "{{ production_auto_deploy_libexec_root }}"
    - "{{ production_auto_deploy_deployment_home }}/.local"
    - "{{ production_auto_deploy_deployment_home }}/.local/share"
  register: production_auto_deploy_existing_directory_stats

- name: Validate all managed path ancestry before mutation
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.python.executable }}"
      - -c
      - |
        import os
        import stat
        import sys

        home = os.path.normpath(sys.argv[1])
        for raw_path in sys.argv[2:]:
            path = os.path.normpath(raw_path)
            if not os.path.isabs(path) or os.path.commonpath((home, path)) != home:
                raise SystemExit("managed path escapes effective home")
            current = home
            relative = os.path.relpath(path, home)
            for part in (() if relative == "." else relative.split(os.sep)):
                current = os.path.join(current, part)
                try:
                    entry = os.lstat(current)
                except FileNotFoundError:
                    break
                if stat.S_ISLNK(entry.st_mode) or os.path.realpath(current) != current:
                    raise SystemExit("managed path ancestry is not canonical")
      - "{{ production_auto_deploy_deployment_home }}"
      - "{{ production_auto_deploy_root }}"
      - "{{ production_auto_deploy_protected_root }}"
      - "{{ production_auto_deploy_controller_root }}"
      - "{{ production_auto_deploy_tooling_root }}"
      - "{{ production_auto_deploy_state_root }}"
      - "{{ production_auto_deploy_log_root }}"
      - "{{ production_auto_deploy_bin_root }}"
      - "{{ production_auto_deploy_libexec_root }}"
      - "{{ production_auto_deploy_generations_root }}"
  changed_when: false
  check_mode: false

- name: Reject hostile existing managed directories before mutation
  ansible.builtin.assert:
    that:
      - not item.stat.exists or
        (item.stat.isdir and
         not item.stat.islnk and
         item.stat.pw_name == production_auto_deploy_effective_user and
         item.stat.mode == '0700')
    fail_msg: >-
      Every existing managed directory must be a real mode-0700 directory
      owned by the effective account.
  loop: "{{ production_auto_deploy_existing_directory_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Inspect existing initialized deployment state before mutation
  ansible.builtin.stat:
    path: "{{ production_auto_deploy_state_root }}/last-successful"
    follow: false
  register: production_auto_deploy_initial_state_stat

- name: Reject hostile initialized deployment state before mutation
  ansible.builtin.assert:
    that:
      - >-
        not production_auto_deploy_initial_state_stat.stat.exists or
        (production_auto_deploy_initial_state_stat.stat.isreg and
         not production_auto_deploy_initial_state_stat.stat.islnk and
         production_auto_deploy_initial_state_stat.stat.pw_name ==
           production_auto_deploy_effective_user and
         production_auto_deploy_initial_state_stat.stat.mode == '0600')
    fail_msg: >-
      Existing initialized deployment state must be a regular non-symlink
      mode-0600 file owned by the effective account.

- name: Validate the one-pointer generation activation before mutation
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.python.executable }}"
      - -B
      - -c
      - |
        import hashlib
        import os
        import re
        import stat
        import sys

        (current, generations, launcher, config, notifier, uid_text,
         launcher_target, config_target, notifier_target) = sys.argv[1:]
        uid = int(uid_text)
        paths = (launcher, config, notifier, current)
        present = [os.path.lexists(path) for path in paths]
        if not any(present):
            raise SystemExit(0)
        stable = ((launcher, launcher_target), (config, config_target),
                  (notifier, notifier_target))
        if not present[3]:
            for (path, target), exists in zip(stable, present[:3]):
                if not exists:
                    continue
                entry = os.lstat(path)
                if (not stat.S_ISLNK(entry.st_mode) or entry.st_uid != uid
                        or os.readlink(path) != target):
                    raise SystemExit("incomplete bootstrap managed symlink is unsafe")
            raise SystemExit(0)
        if not all(present):
            raise SystemExit("existing generation activation is incomplete")
        for path, target in stable:
            entry = os.lstat(path)
            if (not stat.S_ISLNK(entry.st_mode) or entry.st_uid != uid
                    or os.readlink(path) != target):
                raise SystemExit("existing stable managed symlink is unsafe")
        entry = os.lstat(current)
        link = os.readlink(current) if stat.S_ISLNK(entry.st_mode) else ""
        if (entry.st_uid != uid
                or re.fullmatch(r"generations/[0-9a-f]{64}", link) is None):
            raise SystemExit("current generation pointer is unsafe")
        generation = os.path.join(os.path.dirname(current), link)
        if (os.path.commonpath((generations, generation)) != generations
                or os.path.realpath(generation) != generation):
            raise SystemExit("current generation escapes the private libexec root")
        directory = os.lstat(generation)
        if (not stat.S_ISDIR(directory.st_mode) or directory.st_uid != uid
                or stat.S_IMODE(directory.st_mode) != 0o700):
            raise SystemExit("current generation is unsafe")
        for name, mode in (("nas-platform-deploy", 0o700),
                           ("production_auto_deploy.py", 0o700),
                           ("deployer.json", 0o600), ("ntfy.curl", 0o600)):
            path = os.path.join(generation, name)
            asset = os.lstat(path)
            if (not stat.S_ISREG(asset.st_mode) or asset.st_uid != uid
                    or stat.S_IMODE(asset.st_mode) != mode
                    or os.path.realpath(path) != path):
                raise SystemExit("current generation is incomplete")
        digest = hashlib.sha256()
        for name in ("nas-platform-deploy", "production_auto_deploy.py",
                     "deployer.json", "ntfy.curl"):
            data = open(os.path.join(generation, name), "rb").read()
            digest.update(len(name).to_bytes(2, "big") + name.encode() + data)
        if os.path.basename(generation) != digest.hexdigest():
            raise SystemExit("generation identity differs from its contents")
      - "{{ production_auto_deploy_current_path }}"
      - "{{ production_auto_deploy_generations_root }}"
      - "{{ production_auto_deploy_launcher_path }}"
      - "{{ production_auto_deploy_config_path }}"
      - "{{ production_auto_deploy_notifier_path }}"
      - "{{ production_auto_deploy_effective_uid | string }}"
      - ../libexec/nas-platform/current/nas-platform-deploy
      - ../../.local/libexec/nas-platform/current/deployer.json
      - ../../.local/libexec/nas-platform/current/ntfy.curl
  changed_when: false
  check_mode: false

- name: Validate an existing generation launcher against reviewed contracts
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.python.executable }}"
      - -B
      - -c
      - |
        import json
        import os
        import subprocess
        import sys

        launcher = sys.argv[1]
        data = open(launcher, "rb").read()
        try:
            contracts = json.load(sys.stdin)
        except (UnicodeDecodeError, ValueError):
            raise SystemExit("reviewed launcher contracts are invalid")
        if (not isinstance(contracts, list) or len(contracts) != 2
                or any(not isinstance(contract, str) for contract in contracts)
                or len(set(contracts)) != 2):
            raise SystemExit("reviewed launcher contracts are invalid")
        reviewed = {contract.encode("utf-8") for contract in contracts}
        if data not in reviewed:
            raise SystemExit("existing stable launcher violates its trusted contract")
        result = subprocess.run(["/bin/sh", "-n", launcher], check=False)
        raise SystemExit(result.returncode)
      - "{{ production_auto_deploy_launcher_path }}"
    stdin: >-
      {{ [lookup('ansible.builtin.template',
                 role_path ~ '/../../scripts/nas-platform-deploy',
                 rstrip=false),
            lookup('ansible.builtin.template',
                   role_path ~ '/templates/nas-platform-deploy-v1.j2',
                   rstrip=false)] | to_json }}
    stdin_add_newline: false
  when: production_auto_deploy_current_path is link
  changed_when: false
  check_mode: false

- name: Read the effective account crontab before mutation
  ansible.builtin.command:
    argv: [crontab, -l]
  register: production_auto_deploy_existing_crontab
  changed_when: false
  failed_when: production_auto_deploy_existing_crontab.rc not in [0, 1]
  check_mode: false

- name: Reject every unmanaged invocation of the exact deployment executables
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.python.executable }}"
      - -B
      - -c
      - |
        import shlex
        import sys

        launcher, poller, marker, expected = sys.argv[1:]
        lines = sys.stdin.read().splitlines()
        marker_positions = [index for index, line in enumerate(lines) if line == marker]
        managed = []
        invocations = []
        def invokes_exact_executable(command):
            pending = [command]
            inspected = set()
            while pending:
                fragment = pending.pop()
                if fragment in inspected:
                    continue
                inspected.add(fragment)
                try:
                    words = shlex.split(fragment, posix=True)
                except ValueError:
                    raise SystemExit("duplicate managed cron: unsafe shell syntax")
                if launcher in words or poller in words:
                    return True
                pending.extend(word for word in words if any(character.isspace() for character in word))
            return False

        for index, raw in enumerate(lines):
            stripped = raw.strip()
            if not stripped or stripped.startswith("#"):
                continue
            fields = stripped.split(None, 1) if stripped.startswith("@") else stripped.split(None, 5)
            if len(fields) != (2 if stripped.startswith("@") else 6):
                continue
            command = fields[-1]
            if invokes_exact_executable(command):
                invocations.append(index)
                if (raw == expected and index > 0 and lines[index - 1] == marker):
                    managed.append(index)
        if len(marker_positions) > 1 or len(invocations) > 1:
            raise SystemExit("duplicate managed cron invocation")
        if invocations and invocations != managed:
            raise SystemExit("duplicate managed cron invocation")
        if marker_positions and not managed:
            raise SystemExit("duplicate managed cron marker")
      - "{{ production_auto_deploy_launcher_path }}"
      - "{{ production_auto_deploy_poller_path }}"
      - "#Ansible: {{ production_auto_deploy_cron_name }}"
      - "*/5 * * * * {{ production_auto_deploy_launcher_path }} --poll"
    stdin: "{{ production_auto_deploy_existing_crontab.stdout }}"
  changed_when: false
  check_mode: false

- name: Plan poller activation without creating files
  ansible.builtin.debug:
    msg: >-
      Plan poller activation for {{ production_auto_deploy_launcher_path }} and
      one */5 user crontab entry.
  when: ansible_check_mode


- name: Install the validated versioned poller generation
  when: not ansible_check_mode
  block:
    - name: Validate a bounded inherited deployment-lock proof
      ansible.builtin.command:
        argv:
          - "{{ production_auto_deploy_controller_python }}"
          - -B
          - -c
          - |
            import json
            import fcntl
            import os
            import stat
            import sys

            path, token, pid_text, uid_text, home, state_root = sys.argv[1:]
            uid = int(uid_text)
            descriptor = os.open(path, os.O_RDONLY | os.O_NONBLOCK | os.O_NOFOLLOW)
            entry = os.fstat(descriptor)
            path_entry = os.lstat(path)
            payload = json.loads(os.read(descriptor, 4097).decode("utf-8"))
            os.close(descriptor)
            expected = {
                "production_auto_deploy_lock_proof": token,
                "production_auto_deploy_lock_pid": int(pid_text),
                "production_auto_deploy_lock_proof_path": path,
            }
            if (not stat.S_ISREG(entry.st_mode) or entry.st_uid != uid
                    or stat.S_IMODE(entry.st_mode) != 0o600
                    or entry.st_nlink != 1
                    or (entry.st_dev, entry.st_ino) != (path_entry.st_dev, path_entry.st_ino)
                    or os.path.realpath(path) != path or payload != expected
                    or int(pid_text) <= 1):
                raise SystemExit("inherited deployment lock proof is unsafe")
            os.kill(int(pid_text), 0)

            home_fd = os.open(home, os.O_RDONLY | os.O_NOFOLLOW | os.O_DIRECTORY)
            state_fd = os.open(state_root, os.O_RDONLY | os.O_NOFOLLOW | os.O_DIRECTORY)
            identity_fd = os.open(".deployment.lock.identity",
                                  os.O_RDONLY | os.O_NOFOLLOW, dir_fd=state_fd)
            lock_fd = os.open("deployment.lock", os.O_RDWR | os.O_NOFOLLOW,
                              dir_fd=state_fd)
            identity = os.fstat(identity_fd)
            lock_entry = os.fstat(lock_fd)
            if ((identity.st_dev, identity.st_ino) != (lock_entry.st_dev, lock_entry.st_ino)
                    or identity.st_nlink != 2 or lock_entry.st_nlink != 2):
                raise SystemExit("inherited deployment lock identity is unsafe")
            if sys.platform.startswith("linux"):
                held = set()
                with open("/proc/locks", encoding="ascii") as lock_table:
                    for line in lock_table:
                        fields = line.split()
                        if len(fields) < 6 or fields[1] != "FLOCK":
                            continue
                        device = fields[5].split(":")
                        if len(device) != 3:
                            continue
                        held.add((int(fields[4]), int(device[0], 16),
                                  int(device[1], 16), int(device[2])))
                expected_locks = {
                    (int(pid_text), os.major(entry.st_dev), os.minor(entry.st_dev), entry.st_ino)
                    for entry in (os.fstat(home_fd), os.fstat(state_fd), lock_entry)
                }
                if not expected_locks.issubset(held):
                    raise SystemExit("inherited deployment lock owner is unsafe")
            for locked in (home_fd, state_fd, lock_fd):
                try:
                    fcntl.flock(locked, fcntl.LOCK_EX | fcntl.LOCK_NB)
                except BlockingIOError:
                    continue
                fcntl.flock(locked, fcntl.LOCK_UN)
                raise SystemExit("inherited deployment lock proof has no live lock")
            for opened in (lock_fd, identity_fd, state_fd, home_fd):
                os.close(opened)
          - "{{ production_auto_deploy_lock_proof_path }}"
          - "{{ production_auto_deploy_lock_proof }}"
          - "{{ production_auto_deploy_lock_pid | string }}"
          - "{{ production_auto_deploy_effective_uid | string }}"
          - "{{ production_auto_deploy_deployment_home }}"
          - "{{ production_auto_deploy_state_root }}"
      when: production_auto_deploy_lock_proof | length > 0
      changed_when: false
      no_log: true

    - name: Record inherited deployment-lock ownership
      ansible.builtin.set_fact:
        production_auto_deploy_inherited_lock: >-
          {{ production_auto_deploy_lock_proof | length > 0 }}

    - name: Create a private installer coordination directory
      ansible.builtin.tempfile:
        state: directory
        prefix: nas-platform-poller-install-
      register: production_auto_deploy_coordination
      changed_when: false
      when: not production_auto_deploy_inherited_lock | bool

    - name: Create the installer lock lifetime marker
      ansible.builtin.file:
        path: "{{ production_auto_deploy_coordination.path }}/hold"
        state: touch
        owner: "{{ production_auto_deploy_effective_user }}"
        group: "{{ production_auto_deploy_effective_gid }}"
        mode: "0600"
      changed_when: false
      when: not production_auto_deploy_inherited_lock | bool

    - name: Serialize the installer with the poller's complete kernel lock order
      ansible.builtin.command:
        argv:
          - "{{ production_auto_deploy_controller_python }}"
          - -B
          - -c
          - |
            import fcntl
            import os
            import stat
            import sys
            import time

            (home, state_root, hold_path, status_path, expected_uid,
             delay_text, marker) = sys.argv[1:]
            uid = int(expected_uid)
            descriptors = []

            def owned_directory(path):
                descriptor = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_DIRECTORY)
                entry = os.fstat(descriptor)
                if (not stat.S_ISDIR(entry.st_mode) or entry.st_uid != uid
                        or stat.S_IMODE(entry.st_mode) != 0o700
                        or os.path.realpath(path) != path):
                    os.close(descriptor)
                    raise SystemExit("deployment lock directory is unsafe")
                return descriptor

            def acquire(descriptor):
                try:
                    fcntl.flock(descriptor, fcntl.LOCK_EX | fcntl.LOCK_NB)
                    return True
                except BlockingIOError:
                    return False

            def status(value):
                descriptor = os.open(status_path,
                                     os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW,
                                     0o600)
                os.write(descriptor, value.encode())
                os.fsync(descriptor)
                os.close(descriptor)

            home_fd = owned_directory(home)
            descriptors.append(home_fd)
            if not acquire(home_fd):
                status("busy")
                raise SystemExit(0)
            try:
                current = home
                relative = os.path.relpath(state_root, home)
                if relative.startswith(".."):
                    raise SystemExit("deployment state root escapes trust root")
                for component in relative.split(os.sep):
                    current = os.path.join(current, component)
                    try:
                        os.mkdir(current, 0o700)
                    except FileExistsError:
                        pass
                    os.chmod(current, 0o700)
                    check = os.lstat(current)
                    if (not stat.S_ISDIR(check.st_mode) or check.st_uid != uid
                            or stat.S_IMODE(check.st_mode) != 0o700
                            or os.path.realpath(current) != current):
                        raise SystemExit("deployment state root is unsafe")
                state_fd = owned_directory(state_root)
                descriptors.append(state_fd)
                if not acquire(state_fd):
                    status("busy")
                    raise SystemExit(0)
                flags = os.O_RDWR | os.O_NONBLOCK | os.O_NOFOLLOW
                try:
                    identity_fd = os.open(".deployment.lock.identity", flags, dir_fd=state_fd)
                except FileNotFoundError:
                    identity_fd = os.open(
                        ".deployment.lock.identity",
                        flags | os.O_CREAT | os.O_EXCL,
                        0o600,
                        dir_fd=state_fd,
                    )
                    os.fchmod(identity_fd, 0o600)
                    os.fsync(identity_fd)
                    os.fsync(state_fd)
                descriptors.append(identity_fd)
                identity = os.fstat(identity_fd)
                if (not stat.S_ISREG(identity.st_mode) or identity.st_uid != uid
                        or stat.S_IMODE(identity.st_mode) != 0o600):
                    raise SystemExit("deployment lock identity is unsafe")
                try:
                    lock_fd = os.open("deployment.lock", flags, dir_fd=state_fd)
                except FileNotFoundError:
                    if identity.st_nlink != 1:
                        raise SystemExit("deployment lock identity is unsafe")
                    os.link(".deployment.lock.identity", "deployment.lock",
                            src_dir_fd=state_fd, dst_dir_fd=state_fd,
                            follow_symlinks=False)
                    os.fsync(state_fd)
                    lock_fd = os.open("deployment.lock", flags, dir_fd=state_fd)
                descriptors.append(lock_fd)
                lock_entry = os.fstat(lock_fd)
                identity = os.fstat(identity_fd)
                if ((identity.st_dev, identity.st_ino) != (lock_entry.st_dev, lock_entry.st_ino)
                        or identity.st_nlink != 2 or lock_entry.st_nlink != 2):
                    raise SystemExit("deployment lock identity is unsafe")
                if not acquire(lock_fd):
                    status("busy")
                    raise SystemExit(0)
                status("locked")
                if marker:
                    descriptor = os.open(marker,
                                         os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW,
                                         0o600)
                    os.close(descriptor)
                time.sleep(float(delay_text))
                while os.path.exists(hold_path):
                    time.sleep(0.05)
            finally:
                for descriptor in reversed(descriptors):
                    os.close(descriptor)
          - "{{ production_auto_deploy_deployment_home }}"
          - "{{ production_auto_deploy_state_root }}"
          - "{{ production_auto_deploy_coordination.path }}/hold"
          - "{{ production_auto_deploy_coordination.path }}/status"
          - "{{ production_auto_deploy_effective_uid | string }}"
          - "{{ production_auto_deploy_test_lock_delay | string }}"
          - "{{ production_auto_deploy_test_lock_marker }}"
      async: 3600
      poll: 0
      register: production_auto_deploy_lock_holder
      changed_when: false
      when: not production_auto_deploy_inherited_lock | bool

    - name: Wait for manual installer lock arbitration
      ansible.builtin.wait_for:
        path: "{{ production_auto_deploy_coordination.path }}/status"
        state: present
        timeout: 120
      changed_when: false
      when: not production_auto_deploy_inherited_lock | bool

    - name: Read manual installer lock arbitration
      ansible.builtin.slurp:
        path: "{{ production_auto_deploy_coordination.path }}/status"
      register: production_auto_deploy_lock_status
      when: not production_auto_deploy_inherited_lock | bool

    - name: Report a clean busy installer without mutation
      ansible.builtin.debug:
        msg: Production auto-deploy installer is busy; no mutation was performed.
      when:
        - not production_auto_deploy_inherited_lock | bool
        - production_auto_deploy_lock_status.content | b64decode == 'busy'

    - name: Remove busy installer coordination files
      ansible.builtin.file:
        path: "{{ production_auto_deploy_coordination.path }}"
        state: absent
      when:
        - not production_auto_deploy_inherited_lock | bool
        - production_auto_deploy_lock_status.content | b64decode == 'busy'
      changed_when: false

    - name: Stop this role after a clean busy lock result
      ansible.builtin.meta: end_role
      when:
        - not production_auto_deploy_inherited_lock | bool
        - production_auto_deploy_lock_status.content | b64decode == 'busy'

    - name: Inspect the controller again while holding the installer lock
      ansible.builtin.stat:
        path: "{{ production_auto_deploy_controller_root }}"
        follow: false
      register: production_auto_deploy_locked_controller_stat

    - name: Create private generation and runtime directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ production_auto_deploy_effective_user }}"
        group: "{{ production_auto_deploy_effective_gid }}"
        mode: "0700"
      loop:
        - "{{ production_auto_deploy_deployment_home }}/.local"
        - "{{ production_auto_deploy_deployment_home }}/.local/share"
        - "{{ production_auto_deploy_root }}"
        - "{{ production_auto_deploy_bin_root }}"
        - "{{ production_auto_deploy_libexec_root }}"
        - "{{ production_auto_deploy_generations_root }}"
        - "{{ production_auto_deploy_tooling_root }}"
        - "{{ production_auto_deploy_state_root }}"
        - "{{ production_auto_deploy_log_root }}"

    - name: Validate an existing controller through the reviewed installed poller
      ansible.builtin.command:
        argv:
          - "{{ production_auto_deploy_controller_python }}"
          - -B
          - -c
          - |
            import importlib.util
            import sys

            poller, config_path, sha = sys.argv[1:]
            spec = importlib.util.spec_from_file_location(
                "installed_controller_validator", poller
            )
            module = importlib.util.module_from_spec(spec)
            sys.modules[spec.name] = module
            spec.loader.exec_module(module)
            config = module.load_config(config_path)
            module._validate_controller_checkout(config, sha)
          - "{{ production_auto_deploy_poller_path }}"
          - "{{ production_auto_deploy_current_path }}/deployer.json"
          - "{{ platform_release_id }}"
      environment:
        HOME: "{{ production_auto_deploy_effective_home }}"
        PATH: /usr/bin:/bin
      when: production_auto_deploy_current_path is link
      changed_when: false

    - name: Bootstrap the dedicated controller checkout under the installer lock
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - -c
          - credential.helper=
          - -c
          - core.hooksPath=/dev/null
          - -c
          - core.fsmonitor=false
          - clone
          - --no-tags
          - --single-branch
          - --branch
          - main
          - --origin
          - origin
          - "{{ production_auto_deploy_repository_url }}"
          - "{{ production_auto_deploy_controller_root }}"
      environment:
        HOME: "{{ production_auto_deploy_effective_home }}"
        PATH: /usr/bin:/bin
        GIT_TERMINAL_PROMPT: "0"
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_NOSYSTEM: "1"
      when: not production_auto_deploy_locked_controller_stat.stat.exists
      changed_when: true

    - name: Make the dedicated controller root private
      ansible.builtin.file:
        path: "{{ production_auto_deploy_controller_root }}"
        state: directory
        owner: "{{ production_auto_deploy_effective_user }}"
        group: "{{ production_auto_deploy_effective_gid }}"
        mode: "0700"

    - name: Detach a newly bootstrapped controller at the verified revision
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - -C
          - "{{ production_auto_deploy_controller_root }}"
          - -c
          - core.hooksPath=/dev/null
          - -c
          - core.fsmonitor=false
          - checkout
          - --detach
          - "{{ platform_release_id }}"
      environment:
        HOME: "{{ production_auto_deploy_effective_home }}"
        PATH: /usr/bin:/bin
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_NOSYSTEM: "1"
      when: not production_auto_deploy_locked_controller_stat.stat.exists
      changed_when: true

    - name: Initialize the verified deployment state
      ansible.builtin.copy:
        dest: "{{ production_auto_deploy_state_root }}/last-successful"
        content: >-
          {{ {'sha': platform_release_id,
              'timestamp': ansible_facts.date_time.iso8601 | regex_replace('[.][0-9]+Z$', 'Z'),
              'outcome': 'success'} | to_json }}
        owner: "{{ production_auto_deploy_effective_user }}"
        group: "{{ production_auto_deploy_effective_gid }}"
        mode: "0600"
        force: false

    - name: Remove safely abandoned private role staging directories
      ansible.builtin.command:
        argv:
          - "{{ production_auto_deploy_controller_python }}"
          - -B
          - -c
          - |
            import os
            import shutil
            import stat
            import sys

            root, uid_text = sys.argv[1:]
            uid = int(uid_text)
            changed = False
            for entry in os.scandir(root):
                if not entry.name.startswith(".poller-stage-"):
                    continue
                metadata = entry.stat(follow_symlinks=False)
                path = os.path.join(root, entry.name)
                if (not stat.S_ISDIR(metadata.st_mode) or metadata.st_uid != uid
                        or stat.S_IMODE(metadata.st_mode) != 0o700
                        or os.path.realpath(path) != path):
                    raise SystemExit("abandoned role staging path is unsafe")
                shutil.rmtree(path)
                changed = True
            descriptor = os.open(root, os.O_RDONLY | os.O_DIRECTORY)
            try:
                os.fsync(descriptor)
            finally:
                os.close(descriptor)
            print("changed" if changed else "unchanged")
          - "{{ production_auto_deploy_root }}"
          - "{{ production_auto_deploy_effective_uid | string }}"
      register: production_auto_deploy_abandoned_staging
      changed_when: production_auto_deploy_abandoned_staging.stdout | trim == 'changed'

    - name: Create a unique private generation staging directory
      ansible.builtin.tempfile:
        state: directory
        path: "{{ production_auto_deploy_root }}"
        prefix: .poller-stage-
      register: production_auto_deploy_generation_stage
      changed_when: false

    - name: Stage the literal stable launcher
      ansible.builtin.template:
        src: "{{ role_path }}/../../scripts/nas-platform-deploy"
        dest: "{{ production_auto_deploy_generation_stage.path }}/nas-platform-deploy"
        owner: "{{ production_auto_deploy_effective_user }}"
        group: "{{ production_auto_deploy_effective_gid }}"
        mode: "0700"
      changed_when: false

    - name: Stage the reviewed poller implementation
      ansible.builtin.copy:
        content: >-
          {{ lookup('ansible.builtin.file', production_auto_deploy_poller_source,
                    rstrip=false) |
             regex_replace('^#!/usr/bin/env python3',
                           '#!' ~ production_auto_deploy_controller_python) |
             regex_replace(
               '    effective_home = Path\(pwd\.getpwuid\(os\.geteuid\(\)\)\.pw_dir\)',
               production_auto_deploy_poller_effective_home_line) }}
        dest: "{{ production_auto_deploy_generation_stage.path }}/production_auto_deploy.py"
        owner: "{{ production_auto_deploy_effective_user }}"
        group: "{{ production_auto_deploy_effective_gid }}"
        mode: "0700"
      changed_when: false

    - name: Stage the non-secret poller configuration
      ansible.builtin.template:
        src: config.json.j2
        dest: "{{ production_auto_deploy_generation_stage.path }}/deployer.json"
        owner: "{{ production_auto_deploy_effective_user }}"
        group: "{{ production_auto_deploy_effective_gid }}"
        mode: "0600"
      changed_when: false

    - name: Render protected ntfy curl configuration in the generation
      ansible.builtin.template:
        src: ntfy.curl.j2
        dest: "{{ production_auto_deploy_generation_stage.path }}/ntfy.curl"
        owner: "{{ production_auto_deploy_effective_user }}"
        group: "{{ production_auto_deploy_effective_gid }}"
        mode: "0600"
      changed_when: false
      no_log: true

    - name: Validate the complete staged generation
      ansible.builtin.command:
        argv:
          - "{{ production_auto_deploy_controller_python }}"
          - -B
          - -c
          - |
            import hashlib
            import importlib.util
            import os
            import re
            import stat
            import subprocess
            import sys

            stage, old_poller, stable_config, prior_active, failure = sys.argv[1:]
            expected = {
                "nas-platform-deploy": 0o700,
                "production_auto_deploy.py": 0o700,
                "deployer.json": 0o600,
                "ntfy.curl": 0o600,
            }

            def file_identity(entry):
                return (
                    entry.st_dev,
                    entry.st_ino,
                    entry.st_mode,
                    entry.st_uid,
                    entry.st_gid,
                    entry.st_nlink,
                    entry.st_size,
                    entry.st_mtime_ns,
                    entry.st_ctime_ns,
                )

            def read_staged(name, mode):
                path = os.path.join(stage, name)
                descriptor = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
                try:
                    opened = os.fstat(descriptor)
                    named = os.lstat(path)
                    if (not stat.S_ISREG(opened.st_mode)
                            or stat.S_IMODE(opened.st_mode) != mode
                            or opened.st_uid != os.geteuid()
                            or opened.st_gid != os.getegid()
                            or opened.st_nlink != 1
                            or file_identity(opened) != file_identity(named)
                            or os.path.realpath(path) != path):
                        raise SystemExit("staged generation is unsafe")
                    chunks = []
                    while True:
                        chunk = os.read(descriptor, 65536)
                        if not chunk:
                            break
                        chunks.append(chunk)
                    after = os.fstat(descriptor)
                    named_after = os.lstat(path)
                    if (file_identity(after) != file_identity(opened)
                            or file_identity(named_after) != file_identity(opened)
                            or os.path.realpath(path) != path):
                        raise SystemExit("staged generation changed during validation")
                    return b"".join(chunks)
                finally:
                    os.close(descriptor)

            candidate_launcher = sys.stdin.buffer.read()
            digest = hashlib.sha256()
            staged = {}
            for name, mode in expected.items():
                data = read_staged(name, mode)
                staged[name] = data
                digest.update(len(name).to_bytes(2, "big") + name.encode() + data)
            if staged["nas-platform-deploy"] != candidate_launcher:
                raise SystemExit("candidate launcher differs from its exact contract")
            launcher_syntax = subprocess.run(
                ["/bin/sh", "-n", os.path.join(stage, "nas-platform-deploy")],
                stdin=subprocess.DEVNULL,
                stdout=subprocess.DEVNULL,
                stderr=subprocess.DEVNULL,
                check=False,
            ).returncode
            if failure == "candidate_syntax":
                launcher_syntax = 1
            if launcher_syntax != 0:
                raise SystemExit("candidate launcher shell syntax is invalid")
            notifier_prefix = (
                b'url = "http://127.0.0.1:2586/nas-critical"\n'
                b'header = "Authorization: Bearer '
            )
            notifier_suffix = (
                b'"\nheader = "Content-Type: application/json"\n'
            )
            notifier = staged["ntfy.curl"]
            if (not notifier.startswith(notifier_prefix)
                    or not notifier.endswith(notifier_suffix)):
                raise SystemExit("candidate notifier contract is invalid")
            token = notifier[len(notifier_prefix):-len(notifier_suffix)]
            if re.fullmatch(rb"tk_[a-z0-9]{29}", token) is None:
                raise SystemExit("candidate notifier contract is invalid")
            if token in staged["deployer.json"]:
                raise SystemExit("secret leaked into non-secret configuration")
            poller = os.path.join(stage, "production_auto_deploy.py")
            spec = importlib.util.spec_from_file_location("staged_poller", poller)
            module = importlib.util.module_from_spec(spec)
            sys.modules[spec.name] = module
            spec.loader.exec_module(module)
            module.load_config(os.path.join(stage, "deployer.json"))
            if prior_active == "true":
                old_spec = importlib.util.spec_from_file_location(
                    "prior_poller_compatibility", old_poller
                )
                old_module = importlib.util.module_from_spec(old_spec)
                sys.modules[old_spec.name] = old_module
                old_spec.loader.exec_module(old_module)
                old_module.load_config(os.path.join(stage, "deployer.json"))
                module.load_config(stable_config)
            print(digest.hexdigest())
          - "{{ production_auto_deploy_generation_stage.path }}"
          - "{{ production_auto_deploy_poller_path }}"
          - "{{ production_auto_deploy_config_path }}"
          - "{{ (production_auto_deploy_current_path is link) | string | lower }}"
          - "{{ production_auto_deploy_test_fail_activation }}"
        stdin: >-
          {{ lookup('ansible.builtin.template',
                    role_path ~ '/../../scripts/nas-platform-deploy',
                    rstrip=false) }}
        stdin_add_newline: false
      register: production_auto_deploy_generation_digest
      changed_when: false
      no_log: true

    - name: Record the immutable generation identity
      ansible.builtin.set_fact:
        production_auto_deploy_generation_id: "{{ production_auto_deploy_generation_digest.stdout | trim }}"

    - name: Apply the poller's complete controller trust validation before activation
      ansible.builtin.command:
        argv:
          - "{{ production_auto_deploy_controller_python }}"
          - -B
          - -c
          - |
            import importlib.util
            import sys

            poller, config_path, sha = sys.argv[1:]
            spec = importlib.util.spec_from_file_location("candidate_controller_validator", poller)
            module = importlib.util.module_from_spec(spec)
            sys.modules[spec.name] = module
            spec.loader.exec_module(module)
            config = module.load_config(config_path)
            module._validate_controller_checkout(config, sha)
          - "{{ production_auto_deploy_generation_stage.path }}/production_auto_deploy.py"
          - "{{ production_auto_deploy_generation_stage.path }}/deployer.json"
          - "{{ platform_release_id }}"
      environment:
        HOME: "{{ production_auto_deploy_effective_home }}"
        PATH: /usr/bin:/bin
      changed_when: false

    - name: Snapshot the exact prior activation pointer for transactional rollback
      ansible.builtin.command:
        argv:
          - "{{ production_auto_deploy_controller_python }}"
          - -B
          - -c
          - |
            import json
            import os
            import sys

            backup, current, launcher, config, notifier = sys.argv[1:]
            os.mkdir(backup, 0o700)
            manifest = {
                "stable_present": [
                    os.path.lexists(path) for path in (launcher, config, notifier)
                ],
                "current": None,
            }
            if os.path.lexists(current):
                entry = os.lstat(current)
                manifest["current"] = {
                    "path": current, "target": os.readlink(current),
                    "uid": entry.st_uid, "gid": entry.st_gid,
                }
            path = os.path.join(backup, "manifest.json")
            descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
            with os.fdopen(descriptor, "w", encoding="utf-8") as stream:
                json.dump(manifest, stream, separators=(",", ":"))
                stream.flush()
                os.fsync(stream.fileno())
            directory = os.open(backup, os.O_RDONLY | os.O_DIRECTORY)
            os.fsync(directory)
            os.close(directory)
          - "{{ production_auto_deploy_generation_stage.path }}/.previous"
          - "{{ production_auto_deploy_current_path }}"
          - "{{ production_auto_deploy_launcher_path }}"
          - "{{ production_auto_deploy_config_path }}"
          - "{{ production_auto_deploy_notifier_path }}"
      changed_when: false
      no_log: true

    - name: Snapshot the exact prior crontab bytes for transactional rollback
      ansible.builtin.command:
        argv:
          - "{{ production_auto_deploy_controller_python }}"
          - -B
          - -c
          - |
            import os
            import subprocess
            import sys

            path, expected_text = sys.argv[1:]
            descriptor = os.open(path,
                                 os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW,
                                 0o600)
            with os.fdopen(descriptor, "wb") as output:
                result = subprocess.run(["crontab", "-l"], stdout=output,
                                        stderr=subprocess.DEVNULL, check=False)
                output.flush()
                os.fsync(output.fileno())
            if result.returncode != int(expected_text):
                raise SystemExit("effective-account crontab changed during snapshot")
          - "{{ production_auto_deploy_generation_stage.path }}/.previous-crontab"
          - "{{ production_auto_deploy_existing_crontab.rc | string }}"
      changed_when: false
      no_log: true

    - name: Publish assets and atomically switch one current pointer
      ansible.builtin.command:
        argv:
          - "{{ production_auto_deploy_controller_python }}"
          - -B
          - -c
          - |
            import hashlib
            import os
            import re
            import secrets
            import shutil
            import stat
            import sys
            import tempfile
            import time

            (stage, generations, generation_id, current, launcher, config,
             notifier, failure, delay_text, power_name, power_marker,
             test_root) = sys.argv[1:]
            uid = os.geteuid()
            changed = False

            def regular(path, mode):
                entry = os.lstat(path)
                if (not stat.S_ISREG(entry.st_mode) or entry.st_uid != uid
                        or stat.S_IMODE(entry.st_mode) != mode
                        or os.path.realpath(path) != path):
                    raise SystemExit(f"unsafe installed asset: {path}")
                data = open(path, "rb").read()
                return data

            def fsync_directory(path):
                descriptor = os.open(path, os.O_RDONLY | os.O_DIRECTORY)
                try:
                    os.fsync(descriptor)
                finally:
                    os.close(descriptor)

            def pause_for_power_loss(name):
                if power_name != name:
                    return
                if (sys.platform != "darwin" or not os.path.isabs(power_marker)
                        or os.path.commonpath((test_root, power_marker)) != test_root):
                    raise SystemExit("power-loss test hook is unsafe")
                descriptor = os.open(
                    power_marker,
                    os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW,
                    0o600,
                )
                with os.fdopen(descriptor, "wb") as marker:
                    marker.write(name.encode("ascii"))
                    marker.flush()
                    os.fsync(marker.fileno())
                fsync_directory(os.path.dirname(power_marker))
                time.sleep(300)

            def complete_generation(path):
                entry = os.lstat(path)
                if (not stat.S_ISDIR(entry.st_mode) or entry.st_uid != uid
                        or stat.S_IMODE(entry.st_mode) != 0o700
                        or os.path.realpath(path) != path):
                    raise SystemExit("generation directory is unsafe")
                digest = hashlib.sha256()
                for name, mode in (("nas-platform-deploy", 0o700),
                                   ("production_auto_deploy.py", 0o700),
                                   ("deployer.json", 0o600), ("ntfy.curl", 0o600)):
                    data = regular(os.path.join(path, name), mode)
                    digest.update(len(name).to_bytes(2, "big") + name.encode() + data)
                if os.path.basename(path) != digest.hexdigest():
                    raise SystemExit("generation identity differs from its contents")

            def bootstrap_symlink(path, target):
                global changed
                if os.path.lexists(path):
                    entry = os.lstat(path)
                    if (not stat.S_ISLNK(entry.st_mode) or entry.st_uid != uid
                            or os.readlink(path) != target):
                        raise SystemExit(f"unsafe stable managed symlink: {path}")
                    return
                directory = os.path.dirname(path)
                temporary = os.path.join(
                    directory,
                    f".managed-link-{os.getpid()}-{secrets.token_hex(8)}",
                )
                try:
                    os.symlink(target, temporary)
                    os.replace(temporary, path)
                    fsync_directory(directory)
                    changed = True
                finally:
                    try:
                        os.unlink(temporary)
                    except FileNotFoundError:
                        pass

            if re.fullmatch(r"[0-9a-f]{64}", generation_id) is None:
                raise SystemExit("invalid generation identity")
            generation = os.path.join(generations, generation_id)
            source = {
                name: open(os.path.join(stage, name), "rb").read()
                for name in ("nas-platform-deploy", "production_auto_deploy.py",
                             "deployer.json", "ntfy.curl")
            }

            stable_links = (
                (launcher, "../libexec/nas-platform/current/nas-platform-deploy"),
                (config, "../../.local/libexec/nas-platform/current/deployer.json"),
                (notifier, "../../.local/libexec/nas-platform/current/ntfy.curl"),
            )
            if os.path.lexists(current):
                for path, target in stable_links:
                    entry = os.lstat(path)
                    if (not stat.S_ISLNK(entry.st_mode) or entry.st_uid != uid
                            or os.readlink(path) != target):
                        raise SystemExit("existing stable managed symlink is unsafe")
                link = os.readlink(current)
                if re.fullmatch(r"generations/[0-9a-f]{64}", link) is None:
                    raise SystemExit("current generation pointer is unsafe")
                complete_generation(os.path.join(os.path.dirname(current), link))

            for entry in os.scandir(generations):
                if not entry.name.startswith(".generation-"):
                    continue
                metadata = entry.stat(follow_symlinks=False)
                path = os.path.join(generations, entry.name)
                if (not stat.S_ISDIR(metadata.st_mode) or metadata.st_uid != uid
                        or stat.S_IMODE(metadata.st_mode) != 0o700
                        or os.path.realpath(path) != path):
                    raise SystemExit("abandoned generation staging path is unsafe")
                shutil.rmtree(path)
                changed = True
            fsync_directory(generations)

            if not os.path.exists(generation):
                temporary = tempfile.mkdtemp(prefix=".generation-", dir=generations)
                try:
                    os.chmod(temporary, 0o700)
                    for name, mode in (("nas-platform-deploy", 0o700),
                                       ("production_auto_deploy.py", 0o700),
                                       ("deployer.json", 0o600), ("ntfy.curl", 0o600)):
                        path = os.path.join(temporary, name)
                        descriptor = os.open(
                            path,
                            os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW,
                            mode,
                        )
                        with os.fdopen(descriptor, "wb") as stream:
                            stream.write(source[name])
                            stream.flush()
                            os.fsync(stream.fileno())
                        pause_for_power_loss({
                            "nas-platform-deploy": "after_build_launcher",
                            "production_auto_deploy.py": "after_build_poller",
                            "deployer.json": "after_build_config",
                            "ntfy.curl": "after_build_notifier",
                        }[name])
                    fsync_directory(temporary)
                    os.rename(temporary, generation)
                    fsync_directory(generations)
                    changed = True
                    pause_for_power_loss("after_generation_rename")
                finally:
                    if os.path.exists(temporary):
                        shutil.rmtree(temporary)
            complete_generation(generation)
            if failure == "after_generation":
                raise SystemExit("injected activation failure after generation publication")

            for path, target in stable_links:
                bootstrap_symlink(path, target)
            pause_for_power_loss("before_current")
            if failure == "before_current":
                raise SystemExit("injected activation failure before current switch")
            time.sleep(float(delay_text))

            expected_link = f"generations/{generation_id}"
            if not os.path.islink(current) or os.readlink(current) != expected_link:
                temporary_link = os.path.join(
                    os.path.dirname(current),
                    f".current-{os.getpid()}-{secrets.token_hex(8)}",
                )
                try:
                    os.symlink(expected_link, temporary_link)
                    os.replace(temporary_link, current)
                    fsync_directory(os.path.dirname(current))
                    changed = True
                finally:
                    try:
                        os.unlink(temporary_link)
                    except FileNotFoundError:
                        pass
            complete_generation(os.path.join(os.path.dirname(current), os.readlink(current)))
            pause_for_power_loss("after_current")
            if failure == "after_current":
                raise SystemExit("injected activation failure after current switch")
            print("changed" if changed else "unchanged")
          - "{{ production_auto_deploy_generation_stage.path }}"
          - "{{ production_auto_deploy_generations_root }}"
          - "{{ production_auto_deploy_generation_id }}"
          - "{{ production_auto_deploy_current_path }}"
          - "{{ production_auto_deploy_launcher_path }}"
          - "{{ production_auto_deploy_config_path }}"
          - "{{ production_auto_deploy_notifier_path }}"
          - "{{ production_auto_deploy_test_fail_activation }}"
          - "{{ production_auto_deploy_test_activation_delay | string }}"
          - "{{ production_auto_deploy_test_power_boundary }}"
          - "{{ production_auto_deploy_test_power_marker }}"
          - "{{ production_auto_deploy_test_root }}"
      register: production_auto_deploy_publication
      changed_when: production_auto_deploy_publication.stdout | trim == 'changed'
      no_log: true

    - name: Validate the complete installed poller runtime
      ansible.builtin.command:
        argv:
          - "{{ production_auto_deploy_launcher_path }}"
          - --status
      environment:
        HOME: /ambient/home/is/not/trusted
        PATH: /ambient/path/is/not/trusted
      changed_when: false

    - name: Re-read the effective-account crontab under the installer lock
      ansible.builtin.command:
        argv: [crontab, -l]
      register: production_auto_deploy_locked_crontab
      changed_when: false
      failed_when: production_auto_deploy_locked_crontab.rc not in [0, 1]

    - name: Reject a cron race before publication
      ansible.builtin.assert:
        that:
          - production_auto_deploy_locked_crontab.rc == production_auto_deploy_existing_crontab.rc
          - production_auto_deploy_locked_crontab.stdout == production_auto_deploy_existing_crontab.stdout
        fail_msg: Refusing to mutate a crontab changed during installer serialization.

    - name: Install one effective-account polling cron entry after current is valid
      ansible.builtin.cron:
        name: "{{ production_auto_deploy_cron_name }}"
        minute: "*/5"
        hour: "*"
        day: "*"
        month: "*"
        weekday: "*"
        job: "{{ production_auto_deploy_launcher_path }} --poll"
        state: present

    - name: Inject a disposable failure after cron activation
      ansible.builtin.command:
        argv: [/usr/bin/false]
      when: production_auto_deploy_test_fail_activation == 'after_cron'
      changed_when: false

    - name: Read the activated effective-account crontab
      ansible.builtin.command:
        argv: [crontab, -l]
      register: production_auto_deploy_versioned_crontab
      changed_when: false

    - name: Require exactly one activated polling cron entry
      ansible.builtin.assert:
        that:
          - >-
            production_auto_deploy_versioned_crontab.stdout.splitlines() |
            select('equalto', '#Ansible: ' ~ production_auto_deploy_cron_name) |
            list | length == 1
          - >-
            production_auto_deploy_versioned_crontab.stdout.splitlines() |
            select('equalto', '*/5 * * * * ' ~ production_auto_deploy_launcher_path ~ ' --poll') |
            list | length == 1
        fail_msg: Activated poller cron entry differs from the exact five-minute policy.

  rescue:
    - name: Restore the exact prior current pointer and bootstrap link presence
      ansible.builtin.command:
        argv:
          - "{{ production_auto_deploy_controller_python }}"
          - -B
          - -c
          - |
            import json
            import os
            import sys
            backup, current_path, launcher, config, notifier = sys.argv[1:]
            manifest_path = os.path.join(backup, "manifest.json")
            if not os.path.isfile(manifest_path):
                raise SystemExit(0)
            manifest = json.loads(open(manifest_path, encoding="utf-8").read())

            def fsync_directory(path):
                descriptor = os.open(path, os.O_RDONLY | os.O_DIRECTORY)
                try:
                    os.fsync(descriptor)
                finally:
                    os.close(descriptor)

            def remove(path):
                try:
                    os.unlink(path)
                    fsync_directory(os.path.dirname(path))
                except FileNotFoundError:
                    pass

            prior = manifest["current"]
            if prior is None:
                remove(current_path)
            else:
                temporary = os.path.join(os.path.dirname(current_path),
                                         f".rollback-current-{os.getpid()}")
                try:
                    os.symlink(prior["target"], temporary)
                    os.lchown(temporary, prior["uid"], prior["gid"])
                    os.replace(temporary, current_path)
                    fsync_directory(os.path.dirname(current_path))
                finally:
                    try:
                        os.unlink(temporary)
                    except FileNotFoundError:
                        pass
            for path, was_present in zip(
                (launcher, config, notifier), manifest["stable_present"]
            ):
                if not was_present:
                    remove(path)
          - "{{ production_auto_deploy_generation_stage.path }}/.previous"
          - "{{ production_auto_deploy_current_path }}"
          - "{{ production_auto_deploy_launcher_path }}"
          - "{{ production_auto_deploy_config_path }}"
          - "{{ production_auto_deploy_notifier_path }}"
      when: production_auto_deploy_generation_stage is defined
      changed_when: false
      no_log: true

    - name: Restore the exact prior effective-account crontab
      ansible.builtin.command:
        argv:
          - crontab
          - "{{ production_auto_deploy_generation_stage.path }}/.previous-crontab"
      when:
        - production_auto_deploy_generation_stage is defined
        - production_auto_deploy_existing_crontab.rc == 0
      changed_when: false

    - name: Restore an absent prior effective-account crontab
      ansible.builtin.command:
        argv: [crontab, -r]
      when:
        - production_auto_deploy_generation_stage is defined
        - production_auto_deploy_existing_crontab.rc == 1
      register: production_auto_deploy_remove_crontab
      failed_when: production_auto_deploy_remove_crontab.rc not in [0, 1]
      changed_when: false

    - name: Fail closed after transactional installer rollback
      ansible.builtin.fail:
        msg: >-
          Production auto-deploy installation failed at
          {{ ansible_failed_task.name | default('an unknown stage') }}; the prior
          activation was restored.

  always:
    - name: Release the canonical installer lock
      ansible.builtin.file:
        path: "{{ production_auto_deploy_coordination.path }}/hold"
        state: absent
      when: production_auto_deploy_coordination.path is defined
      changed_when: false

    - name: Wait for the canonical lock holder to exit
      ansible.builtin.async_status:
        jid: "{{ production_auto_deploy_lock_holder.ansible_job_id }}"
      register: production_auto_deploy_lock_holder_status
      until: production_auto_deploy_lock_holder_status.finished
      retries: 100
      delay: 1
      when: production_auto_deploy_lock_holder.ansible_job_id is defined
      changed_when: false

    - name: Remove private per-installer temporary directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: >-
        {{ ([production_auto_deploy_generation_stage.path]
            if production_auto_deploy_generation_stage is defined else []) +
           ([production_auto_deploy_coordination.path]
            if production_auto_deploy_coordination.path is defined else []) }}
      changed_when: false
      no_log: true
