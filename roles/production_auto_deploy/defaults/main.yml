---
production_auto_deploy_repository: yonatankarp/nas-platform
production_auto_deploy_repository_url: https://github.com/yonatankarp/nas-platform.git
production_auto_deploy_workflow: ci.yml
production_auto_deploy_workflow_name: CI
production_auto_deploy_branch: main
production_auto_deploy_github_api_base: https://api.github.com
production_auto_deploy_pushover_api_url: https://api.pushover.net/1/messages.json
# No inventory-level analogue exists: inventory/remote.yml spends
# PLATFORM_NAS_ADDRESS on ansible_host, which is a transport detail the local
# and Mac inventories do not carry at all. So this stays a literal, and it is
# the LAN address of the NAS rather than the address clients use.
production_auto_deploy_nas_address: 192.168.0.139
# The address clients actually use. Every other role reads platform_public_host, declared once per
# inventory from PLATFORM_PUBLIC_HOST; this role demanded a second `-e` for the
# same value, which made reinstalling the poller irreproducible from the
# repository alone. It reads the same variable now. `| default('')` rather than
# a bare reference, so an inventory that never declared it fails on the
# assertion below -- which says what to set and why -- instead of on an
# undefined variable.
production_auto_deploy_public_host: "{{ platform_public_host | default('') }}"
# Only differs when containers reach the host at another address, which is
# exactly what platform_callback_host declares, in the same inventory block.
production_auto_deploy_callback_host: >-
  {{ platform_callback_host | default(production_auto_deploy_nas_address, true) }}
production_auto_deploy_log_retention_days: 30
production_auto_deploy_cron_name: NAS platform production auto-deploy
# Hourly rather than with every poll: each run pays preflight and vault_contract
# before eighteen roles of probes. Minute 37 is off the five-minute poll grid and
# the prune's minute 0; the deployment lock serialises any overlap regardless.
production_auto_deploy_verify_cron_name: NAS platform periodic verification
production_auto_deploy_verify_cron_minute: "37"
# Some NAS firmwares ship BusyBox crontab without the setuid bit and keep the
# spool root-owned, so an unprivileged account cannot schedule anything. Set
# this when the poll is driven by an external scheduler instead, which the role
# then leaves alone rather than failing at its last task.
production_auto_deploy_external_scheduler: false
# Ansible refuses to run unless locale.getlocale() reports UTF-8, and a
# scheduler supplies no locale at all. Which UTF-8 locale exists varies by
# firmware: C.UTF-8 is absent on some, en_US.UTF-8 on others. Tried in order.
production_auto_deploy_locale_candidates:
  - en_US.UTF-8
  - C.UTF-8
  - en_US.utf8
  - C.utf8
production_auto_deploy_verify_tags: >-
  platform_verify_media_acquisition_foundation,platform_verify_ntfy,platform_verify_beszel,platform_verify_dozzle,platform_verify_audiobookshelf,platform_verify_komga,platform_verify_arr,platform_verify_downloaders,platform_verify_bindery,platform_verify_kapowarr,platform_verify_pinchflat,platform_verify_trailarr,platform_verify_jellyfin,platform_verify_seerr,platform_verify_immich,platform_verify_paperless,platform_verify_nextcloud,platform_verify_vaultwarden,platform_verify_karakeep
# Checks only the hourly --verify run selects, after the deploy list and each in
# an invocation and verdict record of its own, so neither masks the other. They
# must never fail a deployment. platform_verify_mdraid is one (#609): a degraded
# array still serves, and a deployment whose verify play fails is quarantined and
# never retried, so a rebuild would record every converged revision as failed.
production_auto_deploy_hourly_only_verify_tags: platform_verify_mdraid

# Every managed path derives from the effective account's real home, so the role
# cannot be pointed at another account's tree by overriding one variable.
production_auto_deploy_home: "{{ ansible_facts.user_dir }}"
production_auto_deploy_share_root: "{{ production_auto_deploy_home }}/.local/share/nas-platform"
production_auto_deploy_checkout: "{{ production_auto_deploy_share_root }}/controller"
production_auto_deploy_poller_root: "{{ production_auto_deploy_share_root }}/poller"
production_auto_deploy_state_root: "{{ production_auto_deploy_share_root }}/state"
production_auto_deploy_log_root: "{{ production_auto_deploy_share_root }}/logs"
production_auto_deploy_config_root: "{{ production_auto_deploy_home }}/.config/nas-platform"
production_auto_deploy_config_path: "{{ production_auto_deploy_config_root }}/deployer.json"
# Rendered, unchanged, until stage 4 of #558 deletes ntfy. The poller no longer
# reads it, but a poller process started from the previous revision still does:
# the install play runs inside that process's own tick, and anything it reports
# afterwards goes through the file it loaded its configuration for (#327).
production_auto_deploy_notifier_path: "{{ production_auto_deploy_config_root }}/ntfy.curl"
# One protected curl config per Pushover application, each carrying only its own
# application's token. The Deployments config has no poller sender until the
# release message lands; it is rendered now so that change needs no role change.
production_auto_deploy_pushover_notifiers:
  - path: "{{ production_auto_deploy_config_root }}/pushover-alerts.curl"
    token_variable: vault_pushover_alerts_token
  - path: "{{ production_auto_deploy_config_root }}/pushover-deployments.curl"
    token_variable: vault_pushover_deployments_token
production_auto_deploy_password_path: "{{ production_auto_deploy_config_root }}/vault-password"
production_auto_deploy_launcher_root: "{{ production_auto_deploy_home }}/.local/bin"
production_auto_deploy_launcher_path: "{{ production_auto_deploy_launcher_root }}/nas-platform-deploy"
production_auto_deploy_poller_path: "{{ production_auto_deploy_poller_root }}/production_auto_deploy.py"
