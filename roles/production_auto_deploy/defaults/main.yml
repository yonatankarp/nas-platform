---
production_auto_deploy_repository: yonatankarp/nas-platform
production_auto_deploy_repository_url: https://github.com/yonatankarp/nas-platform.git
production_auto_deploy_workflow: ci.yml
production_auto_deploy_workflow_name: CI
production_auto_deploy_branch: main
production_auto_deploy_github_api_base: https://api.github.com
production_auto_deploy_pushover_api_url: https://api.pushover.net/1/messages.json
# The NAS's LAN address. A literal: no inventory-level analogue exists.
production_auto_deploy_nas_address: 192.168.0.139
# `| default('')` so an inventory without platform_public_host fails on the
# assertion that says what to set, not on an undefined variable.
production_auto_deploy_public_host: "{{ platform_public_host | default('') }}"
production_auto_deploy_callback_host: >-
  {{ platform_callback_host | default(production_auto_deploy_nas_address, true) }}
production_auto_deploy_log_retention_days: 30
production_auto_deploy_cron_name: NAS platform production auto-deploy
# Hourly, at minute 37: off the five-minute poll grid and the prune's minute 0.
production_auto_deploy_verify_cron_name: NAS platform periodic verification
production_auto_deploy_verify_cron_minute: "37"
# Set when BusyBox crontab lacks setuid and an external scheduler drives the poll.
production_auto_deploy_external_scheduler: false
# Ansible refuses a non-UTF-8 locale and cron supplies none; which UTF-8 locale
# exists varies by firmware. Tried in order.
production_auto_deploy_locale_candidates:
  - en_US.UTF-8
  - C.UTF-8
  - en_US.utf8
  - C.utf8
production_auto_deploy_verify_tags: >-
  platform_verify_media_acquisition_foundation,platform_verify_beszel,platform_verify_dozzle,platform_verify_audiobookshelf,platform_verify_komga,platform_verify_arr,platform_verify_downloaders,platform_verify_bindery,platform_verify_kapowarr,platform_verify_pinchflat,platform_verify_trailarr,platform_verify_jellyfin,platform_verify_seerr,platform_verify_immich,platform_verify_paperless,platform_verify_nextcloud,platform_verify_vaultwarden,platform_verify_karakeep
# Checks only the hourly --verify run selects; they must never fail a deployment,
# because a failed verify quarantines the revision for good (#609, #907).
production_auto_deploy_hourly_only_verify_tags: platform_verify_mdraid,platform_verify_immich_originals

# Derived from the effective account's home so no single override can retarget it.
production_auto_deploy_home: "{{ ansible_facts.user_dir }}"
production_auto_deploy_share_root: "{{ production_auto_deploy_home }}/.local/share/nas-platform"
production_auto_deploy_checkout: "{{ production_auto_deploy_share_root }}/controller"
production_auto_deploy_poller_root: "{{ production_auto_deploy_share_root }}/poller"
production_auto_deploy_state_root: "{{ production_auto_deploy_share_root }}/state"
production_auto_deploy_log_root: "{{ production_auto_deploy_share_root }}/logs"
production_auto_deploy_config_root: "{{ production_auto_deploy_home }}/.config/nas-platform"
production_auto_deploy_config_path: "{{ production_auto_deploy_config_root }}/deployer.json"
# One curl config per Pushover application, each with only its own token.
production_auto_deploy_pushover_notifiers:
  - path: "{{ production_auto_deploy_config_root }}/pushover-alerts.curl"
    token_variable: vault_pushover_alerts_token
  - path: "{{ production_auto_deploy_config_root }}/pushover-deployments.curl"
    token_variable: vault_pushover_deployments_token
production_auto_deploy_password_path: "{{ production_auto_deploy_config_root }}/vault-password"
production_auto_deploy_launcher_root: "{{ production_auto_deploy_home }}/.local/bin"
production_auto_deploy_launcher_path: "{{ production_auto_deploy_launcher_root }}/nas-platform-deploy"
production_auto_deploy_poller_path: "{{ production_auto_deploy_poller_root }}/production_auto_deploy.py"
