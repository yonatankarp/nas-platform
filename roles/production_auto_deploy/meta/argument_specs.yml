---
argument_specs:
  main:
    short_description: Install the NAS production deployment poller
    description:
      - Installs the poller, its protected configuration, one protected
        Pushover publisher configuration per application, a five-minute
        polling cron entry and an hourly verification cron entry.
    options:
      platform_kind:
        description: Platform discriminator; the role accepts only nas.
        type: str
        required: true
      vault_pushover_alerts_token:
        description: >-
          Token of the Pushover Alerts application, which the poller sends a
          failed deployment, a CI refusal, blindness and verify verdicts to.
        type: str
        required: true
      vault_pushover_deployments_token:
        description: Token of the Pushover Deployments application.
        type: str
        required: true
      vault_pushover_user_key:
        description: The Pushover user key every application delivers to.
        type: str
        required: true
      vault_healthchecks_poller_ping_url:
        description: >-
          healthchecks.io ping URL the poller reports every --poll tick to, or
          its /fail when the tick failed (#606). Secret: the token in the path
          is the check's whole authentication.
        type: str
        required: true
      vault_healthchecks_verify_ping_url:
        description: >-
          healthchecks.io ping URL each hourly --verify verdict is reported to
          (#610). Secret for the same reason.
        type: str
        required: true
      production_auto_deploy_home:
        description: Real home of the dedicated non-root deployment account.
        type: path
      production_auto_deploy_repository:
        description: Owner and name of the deployed repository.
        type: str
      production_auto_deploy_repository_url:
        description: Anonymous HTTPS clone URL for the deployed repository.
        type: str
      production_auto_deploy_workflow:
        description: Workflow file whose run gates a deployment.
        type: str
      production_auto_deploy_workflow_name:
        description: Display name of the gating workflow.
        type: str
      production_auto_deploy_branch:
        description: Branch the poller deploys from.
        type: str
      production_auto_deploy_github_api_base:
        description: HTTPS base URL of the GitHub API.
        type: str
      production_auto_deploy_pushover_api_url:
        description: Pushover message API the protected curl configs address.
        type: str
      production_auto_deploy_pushover_notifiers:
        description: >-
          The Alerts then the Deployments Pushover curl config, each a path and
          the name of the vault variable holding that application's token.
        type: list
        elements: dict
      production_auto_deploy_nas_address:
        description: LAN address of the NAS itself.
        type: str
      production_auto_deploy_public_host:
        description: Address clients use to reach published services.
        type: str
      production_auto_deploy_callback_host:
        description: Address containers use to reach the host.
        type: str
      production_auto_deploy_log_retention_days:
        description: Days of attempt logs to retain.
        type: int
      production_auto_deploy_cron_name:
        description: Comment identifying the managed polling cron entry.
        type: str
      production_auto_deploy_verify_cron_name:
        description: Comment identifying the managed hourly verification cron entry.
        type: str
      production_auto_deploy_verify_cron_minute:
        description: Minute of each hour the verification cron entry runs.
        type: str
      production_auto_deploy_external_scheduler:
        description: Poll is scheduled outside cron; the role installs no entry.
        type: bool
      production_auto_deploy_locale_candidates:
        description: UTF-8 locales to try, in order, for running Ansible.
        type: list
        elements: str
      production_auto_deploy_verify_tags:
        description: Exact verification tag list passed to verify.yml.
        type: str
      production_auto_deploy_hourly_only_verify_tags:
        description: Verification tags only the hourly --verify run selects, each in its own verify.yml invocation.
        type: str
