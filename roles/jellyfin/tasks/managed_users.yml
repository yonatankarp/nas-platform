---
- name: List complete Jellyfin users for managed-user reconciliation
  ansible.builtin.uri:
    url: "{{ jellyfin_api }}/Users"
    headers:
      Authorization: '{{ jellyfin_client_header }}, Token="{{ jellyfin_managed_users_token }}"'
    status_code: [200]
    return_content: true
  register: jellyfin_managed_users_listing
  changed_when: false
  check_mode: false
  no_log: true

- name: Refuse incomplete Jellyfin managed-user listing
  ansible.builtin.assert:
    that:
      - jellyfin_managed_users_listing.json | type_debug == 'list'
    fail_msg: >-
      Jellyfin returned an unsupported or paginated users response;
      reconciliation is refusing a partial identity view.

- name: Resolve normalized Jellyfin managed identities
  ansible.builtin.set_fact:
    jellyfin_managed_user_matches: >-
      {{ (jellyfin_managed_user_matches | default({})) |
         combine(dict([(item.username,
           jellyfin_managed_users_listing.json |
           selectattr('Name', 'equalto', item.username) | list)])) }}
  loop: "{{ vault_managed_jellyfin_users }}"
  loop_control:
    label: jellyfin-managed-user
  no_log: true

- name: Refuse ambiguous normalized Jellyfin managed identities
  ansible.builtin.assert:
    that:
      - jellyfin_managed_user_matches[item.username] | length <= 1
      - >-
        jellyfin_managed_users_listing.json | map(attribute='Name') |
        map('trim') | map('lower') | select('equalto', item.username | trim | lower) |
        list | length == jellyfin_managed_user_matches[item.username] | length
    fail_msg: >-
      Jellyfin contains duplicate normalized managed usernames; resolve the
      ambiguity manually before reconciliation.
  loop: "{{ vault_managed_jellyfin_users }}"
  loop_control:
    label: jellyfin-managed-user
  no_log: true

- name: Require safe Jellyfin managed-user identifiers
  ansible.builtin.assert:
    that:
      - >-
        jellyfin_managed_user_matches[item.username] | length == 0 or
        jellyfin_managed_user_matches[item.username][0].Id | string
          is match('^[A-Fa-f0-9-]{32,36}$')
    fail_msg: Jellyfin returned an unsafe managed-user API identifier.
  loop: "{{ vault_managed_jellyfin_users }}"
  loop_control:
    label: jellyfin-managed-user
  no_log: true

- name: Authenticate existing Jellyfin managed users
  ansible.builtin.uri:
    url: "{{ jellyfin_api }}/Users/AuthenticateByName"
    method: POST
    headers:
      Authorization: "{{ jellyfin_client_header }}"
    body_format: json
    body:
      Username: "{{ item.username }}"
      Pw: "{{ item.password }}"
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: jellyfin_managed_user_authentication
  when:
    - jellyfin_managed_users_phase in ['preflight', 'reconcile']
    - not ansible_check_mode
    - jellyfin_managed_user_matches[item.username] | length == 1
  loop: "{{ vault_managed_jellyfin_users }}"
  loop_control:
    label: jellyfin-managed-user
  failed_when: false
  changed_when: false
  no_log: true

- name: Require preserved Jellyfin managed-user credentials
  ansible.builtin.assert:
    that:
      - item.status | default(0) | int == 200
      - item.json.User.Name | default('') | trim | lower == item.item.username | trim | lower
    fail_msg: >-
      Existing Jellyfin managed user does not accept its preserved vault
      password. Run the reviewed credential-migration procedure; Ansible will
      not reset it automatically.
  loop: >-
    {{ jellyfin_managed_user_authentication.results | default([]) |
       rejectattr('skipped', 'defined') | list }}
  loop_control:
    label: jellyfin-managed-user
  when:
    - jellyfin_managed_users_phase in ['preflight', 'reconcile']
    - not ansible_check_mode
  no_log: true

- name: Define forbidden Jellyfin complete-policy fields
  ansible.builtin.set_fact:
    jellyfin_forbidden_policy_update_fields:
      - password
      - passwordhash
      - password_hash
      - passwordconfirm
      - password_confirmation
      - token
      - access_token
      - secret
      - credential
      - api_key
      - apikey
  changed_when: false

- name: Require complete safe existing Jellyfin managed-user policies
  ansible.builtin.assert:
    that:
      - jellyfin_managed_user_matches[item.username][0].Policy is mapping
      - >-
        jellyfin_managed_user_matches[item.username][0].Policy.keys() |
        reject('string') | list | length == 0
      - >-
        jellyfin_managed_user_matches[item.username][0].Policy.keys() | map('lower') |
        intersect(jellyfin_forbidden_policy_update_fields) | length == 0
      - >-
        jellyfin_managed_user_matches[item.username][0].Policy.AuthenticationProviderId |
        default('') | string | length > 0
      - >-
        jellyfin_managed_user_matches[item.username][0].Policy.PasswordResetProviderId |
        default('') | string | length > 0
    fail_msg: >-
      Jellyfin returned an incomplete or unsafe complete policy; reconciliation
      refuses to replace policy state without preserved provider identifiers.
  when:
    - jellyfin_managed_users_phase in ['preflight', 'reconcile']
    - jellyfin_managed_user_matches[item.username] | length == 1
  loop: "{{ vault_managed_jellyfin_users }}"
  loop_control:
    label: jellyfin-managed-user
  no_log: true

- name: Report planned Jellyfin managed-user creation
  ansible.builtin.debug:
    msg: JELLYFIN_PLAN_MANAGED_USER_CREATE
  when:
    - jellyfin_managed_users_phase == 'reconcile'
    - ansible_check_mode
    - jellyfin_managed_user_matches[item.username] | length == 0
  loop: "{{ vault_managed_jellyfin_users }}"
  loop_control:
    label: jellyfin-managed-user
  changed_when: true

- name: Create absent Jellyfin managed users with initial passwords
  ansible.builtin.uri:
    url: "{{ jellyfin_api }}/Users/New"
    method: POST
    headers:
      Authorization: '{{ jellyfin_client_header }}, Token="{{ jellyfin_managed_users_token }}"'
    body_format: json
    body:
      Name: "{{ item.username }}"
      Password: "{{ item.password }}"
    status_code: [200]
    return_content: true
  register: jellyfin_managed_user_creation
  when:
    - jellyfin_managed_users_phase == 'reconcile'
    - not ansible_check_mode
    - jellyfin_managed_user_matches[item.username] | length == 0
  loop: "{{ vault_managed_jellyfin_users }}"
  loop_control:
    label: jellyfin-managed-user
  changed_when: true
  no_log: true

- name: Require safe newly created Jellyfin managed-user identifiers
  ansible.builtin.assert:
    that:
      - item.json.Id | string is match('^[A-Fa-f0-9-]{32,36}$')
      - item.json.Name == item.item.username
    fail_msg: Jellyfin returned an unsafe or ambiguous created-user identity.
  loop: >-
    {{ jellyfin_managed_user_creation.results | default([]) |
       rejectattr('skipped', 'defined') | list }}
  loop_control:
    label: jellyfin-managed-user
  no_log: true

- name: Re-list Jellyfin users after managed-user creation
  ansible.builtin.uri:
    url: "{{ jellyfin_api }}/Users"
    headers:
      Authorization: '{{ jellyfin_client_header }}, Token="{{ jellyfin_managed_users_token }}"'
    status_code: [200]
    return_content: true
  register: jellyfin_managed_users_refreshed_listing
  when:
    - jellyfin_managed_users_phase == 'reconcile'
    - not ansible_check_mode
  changed_when: false
  check_mode: false
  no_log: true

- name: Refuse incomplete refreshed Jellyfin managed-user listing
  ansible.builtin.assert:
    that:
      - jellyfin_managed_users_refreshed_listing.json | type_debug == 'list'
    fail_msg: >-
      Jellyfin returned an unsupported refreshed users response; reconciliation
      refuses to update policy from a partial identity view.
  when:
    - jellyfin_managed_users_phase == 'reconcile'
    - not ansible_check_mode

- name: Resolve refreshed Jellyfin managed identities
  ansible.builtin.set_fact:
    jellyfin_managed_user_matches: >-
      {{ jellyfin_managed_user_matches |
         combine(dict([(item.username,
           jellyfin_managed_users_refreshed_listing.json |
           selectattr('Name', 'equalto', item.username) | list)])) }}
  when:
    - jellyfin_managed_users_phase == 'reconcile'
    - not ansible_check_mode
  loop: "{{ vault_managed_jellyfin_users }}"
  loop_control:
    label: jellyfin-managed-user
  no_log: true

- name: Require complete safe refreshed Jellyfin managed-user policies
  ansible.builtin.assert:
    that:
      - jellyfin_managed_user_matches[item.username] | length == 1
      - >-
        jellyfin_managed_users_refreshed_listing.json | map(attribute='Name') |
        map('trim') | map('lower') | select('equalto', item.username | trim | lower) |
        list | length == 1
      - >-
        jellyfin_managed_user_matches[item.username][0].Id | string
          is match('^[A-Fa-f0-9-]{32,36}$')
      - jellyfin_managed_user_matches[item.username][0].Policy is mapping
      - >-
        jellyfin_managed_user_matches[item.username][0].Policy.keys() |
        reject('string') | list | length == 0
      - >-
        jellyfin_managed_user_matches[item.username][0].Policy.keys() | map('lower') |
        intersect(jellyfin_forbidden_policy_update_fields) | length == 0
      - >-
        jellyfin_managed_user_matches[item.username][0].Policy.AuthenticationProviderId |
        default('') | string | length > 0
      - >-
        jellyfin_managed_user_matches[item.username][0].Policy.PasswordResetProviderId |
        default('') | string | length > 0
    fail_msg: >-
      Jellyfin returned an absent, ambiguous, incomplete, or unsafe refreshed
      policy; reconciliation refuses to replace policy state.
  when:
    - jellyfin_managed_users_phase == 'reconcile'
    - not ansible_check_mode
  loop: "{{ vault_managed_jellyfin_users }}"
  loop_control:
    label: jellyfin-managed-user
  no_log: true

- name: Authenticate newly created Jellyfin managed users
  ansible.builtin.uri:
    url: "{{ jellyfin_api }}/Users/AuthenticateByName"
    method: POST
    headers:
      Authorization: "{{ jellyfin_client_header }}"
    body_format: json
    body:
      Username: "{{ item.item.username }}"
      Pw: "{{ item.item.password }}"
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: jellyfin_new_managed_user_authentication
  loop: >-
    {{ jellyfin_managed_user_creation.results | default([]) |
       rejectattr('skipped', 'defined') | list }}
  loop_control:
    label: jellyfin-managed-user
  when:
    - jellyfin_managed_users_phase == 'reconcile'
    - not ansible_check_mode
  failed_when: false
  changed_when: false
  no_log: true

- name: Require newly created Jellyfin managed-user credentials
  ansible.builtin.assert:
    that:
      - item.status | default(0) | int == 200
      - >-
        item.json.User.Name | default('') | trim | lower ==
        item.item.item.username | trim | lower
    fail_msg: >-
      Newly created Jellyfin managed user does not accept its vault password.
      Run the reviewed credential-migration procedure; Ansible will not reset
      it automatically or continue privilege reconciliation.
  loop: >-
    {{ jellyfin_new_managed_user_authentication.results | default([]) |
       rejectattr('skipped', 'defined') | list }}
  loop_control:
    label: jellyfin-managed-user
  when:
    - jellyfin_managed_users_phase == 'reconcile'
    - not ansible_check_mode
  no_log: true

- name: Record complete expected Jellyfin managed-user policies
  ansible.builtin.set_fact:
    jellyfin_managed_user_expected_policies: >-
      {{ (jellyfin_managed_user_expected_policies | default({})) |
         combine(dict([(item.username,
           jellyfin_managed_user_matches[item.username][0].Policy |
           combine(item.policy, recursive=false))])) }}
  when:
    - jellyfin_managed_users_phase == 'reconcile'
    - not ansible_check_mode
  loop: "{{ vault_managed_jellyfin_users }}"
  loop_control:
    label: jellyfin-managed-user
  no_log: true

- name: Report planned Jellyfin managed-user policy repair
  ansible.builtin.debug:
    msg: JELLYFIN_PLAN_MANAGED_USER_REPAIR
  when:
    - jellyfin_managed_users_phase == 'reconcile'
    - ansible_check_mode
    - jellyfin_managed_user_matches[item.username] | length == 1
    - >-
      (jellyfin_managed_user_matches[item.username][0].Policy | dict2items |
       selectattr('key', 'in', item.policy.keys()) | items2dict) != item.policy
  loop: "{{ vault_managed_jellyfin_users }}"
  loop_control:
    label: jellyfin-managed-user
  changed_when: true

- name: Repair Jellyfin managed-user policies
  ansible.builtin.uri:
    url: >-
      {{ jellyfin_api }}/Users/{{
         jellyfin_managed_user_matches[item.username][0].Id | urlencode }}/Policy
    method: POST
    headers:
      Authorization: '{{ jellyfin_client_header }}, Token="{{ jellyfin_managed_users_token }}"'
    body_format: json
    body: >-
      {{ jellyfin_managed_user_matches[item.username][0].Policy |
         combine(item.policy, recursive=false) }}
    status_code: [204]
  when:
    - jellyfin_managed_users_phase == 'reconcile'
    - not ansible_check_mode
    - jellyfin_managed_user_matches[item.username] | length == 1
    - >-
      (jellyfin_managed_user_matches[item.username][0].Policy | dict2items |
       selectattr('key', 'in', item.policy.keys()) | items2dict) != item.policy
  loop: "{{ vault_managed_jellyfin_users }}"
  loop_control:
    label: jellyfin-managed-user
  changed_when: true
  no_log: true

- name: Verify exact Jellyfin managed users
  ansible.builtin.assert:
    that:
      - jellyfin_managed_user_matches[item.username] | length == 1
      - jellyfin_managed_user_matches[item.username][0].Name | trim | lower == item.username | trim | lower
      - >-
        (jellyfin_managed_user_matches[item.username][0].Policy | dict2items |
         selectattr('key', 'in', item.policy.keys()) | items2dict) == item.policy
      - >-
        jellyfin_managed_user_expected_policies is not defined or
        jellyfin_managed_user_matches[item.username][0].Policy ==
          jellyfin_managed_user_expected_policies[item.username]
    fail_msg: >-
      A managed Jellyfin identity is absent, duplicated, or differs from its
      exact declared policy fields.
  when: jellyfin_managed_users_phase == 'verify'
  loop: "{{ vault_managed_jellyfin_users }}"
  loop_control:
    label: jellyfin-managed-user
  no_log: true
