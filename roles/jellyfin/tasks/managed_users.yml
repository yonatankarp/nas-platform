---
# roles/managed_users, parameterised from defaults/main.yml. The opening assert
# gates jellyfin_managed_users_phase: include_tasks never applies argument_specs.
# Jellyfin's policy refusals run inside the shared role through its two hooks.
- name: Validate the Jellyfin managed-user phase
  ansible.builtin.assert:
    that:
      - jellyfin_managed_users_phase in ['preflight', 'reconcile', 'verify']
    fail_msg: >-
      Jellyfin managed-user reconciliation was included with a phase it does not
      implement. The tasks this file reaches are gated on
      jellyfin_managed_users_phase, so an unrecognised phase silently skips them.

- name: Reconcile the declared Jellyfin managed users
  ansible.builtin.include_role:
    name: managed_users
  vars:
    managed_users_phase: "{{ jellyfin_managed_users_phase }}"
    managed_users_service: jellyfin
    managed_users_title: Jellyfin
    managed_users_declared: "{{ vault_managed_jellyfin_users }}"
    managed_users_identity_attribute: "{{ jellyfin_managed_users_identity_attribute }}"
    managed_users_listed_identity_attribute: "{{ jellyfin_managed_users_listed_identity_attribute }}"
    managed_users_id_attribute: "{{ jellyfin_managed_users_id_attribute }}"
    managed_users_id_pattern: "{{ jellyfin_managed_users_id_pattern }}"
    managed_users_api: "{{ jellyfin_api }}"
    managed_users_admin_headers:
      Authorization: '{{ jellyfin_client_header }}, Token="{{ jellyfin_managed_users_token }}"'
    managed_users_admin_basic: false
    managed_users_list_path: "{{ jellyfin_managed_users_list_path }}"
    managed_users_list_json: "{{ jellyfin_managed_users_list_json }}"
    managed_users_authenticate_path: "{{ jellyfin_managed_users_authenticate_path }}"
    managed_users_authenticate_method: POST
    managed_users_authenticate_basic: false
    managed_users_authenticate_headers:
      Authorization: "{{ jellyfin_client_header }}"
    managed_users_authenticate_body_format: json
    managed_users_authenticate_body: "{{ jellyfin_managed_users_authenticate_body }}"
    managed_users_authenticate_identity: "{{ jellyfin_managed_users_authenticate_identity }}"
    managed_users_reresolve_after_creation: true
    managed_users_before_create_tasks: "{{ jellyfin_managed_users_before_create_tasks }}"
    managed_users_after_creation_tasks: "{{ jellyfin_managed_users_after_creation_tasks }}"
    managed_users_create_path: "{{ jellyfin_managed_users_create_path }}"
    managed_users_create_body: "{{ jellyfin_managed_users_create_body }}"
    managed_users_create_status: "{{ jellyfin_managed_users_create_status }}"
    managed_users_reconcile_interface: "{{ jellyfin_managed_users_reconcile_interface }}"
    managed_users_reconcile_path: "{{ jellyfin_managed_users_reconcile_path }}"
    managed_users_reconcile_method: POST
    managed_users_repair_body: "{{ jellyfin_managed_users_repair_body }}"
    managed_users_repair_status: "{{ jellyfin_managed_users_repair_status }}"
    managed_users_repair_condition: "{{ jellyfin_managed_users_repair_condition }}"
    managed_users_verify_conditions: "{{ jellyfin_managed_users_verify_conditions }}"
    managed_users_verify_fail_msg: "{{ jellyfin_managed_users_verify_fail_msg }}"
    managed_users_plan_create_message: "{{ jellyfin_managed_users_plan_create_message }}"
    managed_users_plan_repair_message: "{{ jellyfin_managed_users_plan_repair_message }}"

# The policy each identity must hold once repaired, compared in the verify phase;
# the repair re-reads nothing, so recording it after the role is exact.
- name: Record complete expected Jellyfin managed-user policies
  ansible.builtin.set_fact:
    jellyfin_managed_user_expected_policies: >-
      {{ (jellyfin_managed_user_expected_policies | default({})) |
         combine(dict([(item.username,
           managed_users_matches[item.username][0].Policy |
           combine(item.policy, recursive=false))])) }}
  when:
    - jellyfin_managed_users_phase == 'reconcile'
    - not ansible_check_mode
  loop: "{{ vault_managed_jellyfin_users }}"
  loop_control:
    label: jellyfin-managed-user
  no_log: true
