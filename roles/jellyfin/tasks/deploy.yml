---
- name: Revalidate deployment paths before Jellyfin runtime use
  ansible.builtin.include_role:
    name: deployment_bundle
    tasks_from: target
  vars:
    deployment_target_service: jellyfin
    deployment_target_require_current_release: true
    deployment_target_extra_paths:
      # roles/managed_users reads the capability register off the deployed release.
      - "{{ platform_current_dir }}/config/managed-user-capabilities.yml"

# Not redacted: no_log hides only the result dict (fail_msg prints anyway), and
# an unlooped assert reports condition source, not values. Field types live in
# filter_plugins/jellyfin_encoding_schema.py; these equalities pin the defaults.
- name: Require explicit Jellyfin acceleration and plugin policy
  ansible.builtin.assert:
    that:
      - jellyfin_encoding_schema_errors | length == 0
      - platform_kind in jellyfin_encoding_profiles
      - jellyfin_encoding_profiles.nas == jellyfin_required_nas_encoding_policy
      - jellyfin_encoding_profiles.mac == jellyfin_required_mac_encoding_policy
      - >-
        jellyfin_encoding_policy == jellyfin_encoding_profiles[
          'mac'
          if ((platform_compose_kind | default('') == 'integration') and
              (deployment_bundle_test_mode | default(false) | bool))
          else platform_kind
        ]
      - jellyfin_plugin_repositories | type_debug == 'list'
      - jellyfin_plugin_repositories | length == 2
      - jellyfin_plugin_repositories[0] is mapping
      - jellyfin_plugin_repositories[1] is mapping
      - jellyfin_plugin_repositories[0].Name is string
      - jellyfin_plugin_repositories[1].Name is string
      - >-
        jellyfin_plugin_repositories | map(attribute='Name') | list ==
        ['Jellyfin Stable', 'Intro Skipper']
      - >-
        jellyfin_plugin_repositories[0].Url is string and
        jellyfin_plugin_repositories[1].Url is string
      - >-
        jellyfin_plugin_repositories | map(attribute='Url') | list ==
        ['https://repo.jellyfin.org/files/plugin/manifest.json',
         'https://intro-skipper.org/manifest.json']
      - >-
        jellyfin_plugin_repositories[0].Enabled is boolean and
        jellyfin_plugin_repositories[1].Enabled is boolean
      - jellyfin_plugin_repositories[0].Enabled
      - jellyfin_plugin_repositories[1].Enabled
      - >-
        jellyfin_retired_plugin_repository_urls ==
        ['https://repo.jellyfin.org/releases/plugin/manifest-stable.json']
      - jellyfin_plugins | type_debug == 'list'
      - jellyfin_plugins | select('string') | list | length == jellyfin_plugins | length
      - jellyfin_plugins == ['Intro Skipper', 'Open Subtitles']
      - jellyfin_plugin_packages == jellyfin_required_plugin_packages
      - jellyfin_opensubtitles_plugin_id is string
      - jellyfin_opensubtitles_plugin_id == '4b9ed42f-5185-48b5-9803-6ff2989014c4'
      - vault_jellyfin_opensubtitles_username | length > 0
      - vault_jellyfin_opensubtitles_password | length > 0
    fail_msg: >-
      Jellyfin requires an explicit pinned platform encoding policy, unique managed
      repositories, exact plugin identities, and nonempty Open Subtitles credentials.
      {{ jellyfin_encoding_schema_errors |
         ternary('Encoding schema violations: ' ~
                 (jellyfin_encoding_schema_errors | join('; ')),
                 'The encoding schema itself is well formed, so a pinned value differs.') }}
  vars:
    jellyfin_encoding_schema_errors: >-
      {{ jellyfin_encoding_profiles |
         jellyfin_encoding_errors(jellyfin_encoding_policy) }}
    jellyfin_required_nas_encoding_policy:
      HardwareAccelerationType: qsv
      QsvDevice: /dev/dri/renderD128
      HardwareDecodingCodecs: [h264, hevc, mpeg2video, vc1, vp8, vp9]
      EnableDecodingColorDepth10Hevc: true
      EnableDecodingColorDepth10Vp9: true
      EnableHardwareEncoding: false
      AllowHevcEncoding: false
      AllowAv1Encoding: false
      EnableIntelLowPowerH264HwEncoder: true
      EnableIntelLowPowerHevcHwEncoder: true
      EnableVppTonemapping: true
      EnableTonemapping: false
    jellyfin_required_mac_encoding_policy:
      HardwareAccelerationType: none
      QsvDevice: ""
      HardwareDecodingCodecs: []
      EnableDecodingColorDepth10Hevc: false
      EnableDecodingColorDepth10Vp9: false
      EnableHardwareEncoding: false
      AllowHevcEncoding: false
      AllowAv1Encoding: false
      EnableIntelLowPowerH264HwEncoder: false
      EnableIntelLowPowerHevcHwEncoder: false
      EnableVppTonemapping: false
      EnableTonemapping: false
    jellyfin_required_plugin_packages:
      - Name: Intro Skipper
        AssemblyGuid: c83d86bb-a1e0-4c35-a113-e2101cf4ee6b
        RepositoryUrl: https://intro-skipper.org/manifest.json
      - Name: Open Subtitles
        AssemblyGuid: 4b9ed42f-5185-48b5-9803-6ff2989014c4
        RepositoryUrl: https://repo.jellyfin.org/files/plugin/manifest.json

- name: Inspect the exact NAS Jellyfin render device
  ansible.builtin.stat:
    path: "{{ platform_render_device_path }}"
    follow: false
  register: jellyfin_render_device
  when:
    - platform_kind == 'nas'
    - >-
      not ((platform_compose_kind | default('') == 'integration') and
           (deployment_bundle_test_mode | default(false) | bool))
  changed_when: false
  check_mode: false

# The renderD128 literal is deliberate: Compose passes that device by name and
# the encoding policy names it; gated on platform_kind so Macs are unaffected.
- name: Require the exact NAS Jellyfin render device
  ansible.builtin.assert:
    that:
      - platform_render_device_available | bool
      - platform_render_device_path == '/dev/dri/renderD128'
      - jellyfin_render_device.stat.exists
      - jellyfin_render_device.stat.ischr
      - not jellyfin_render_device.stat.islnk
    fail_msg: >-
      The NAS must expose /dev/dri/renderD128 as the exact character render device
      before Jellyfin Compose or application state is changed.
  when:
    - platform_kind == 'nas'
    - >-
      not ((platform_compose_kind | default('') == 'integration') and
           (deployment_bundle_test_mode | default(false) | bool))

- name: Render the Jellyfin environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ platform_runtime_dir }}/services/jellyfin/.env"
    mode: "0600"

# Before Compose: Jellyfin's 12.0 migration of jellyfin.db is one-way, and no
# lane proves a Jellyfin bump, so this guard is what stops a reverted pin.
- name: Refuse a Jellyfin image older than the store on disk
  ansible.builtin.include_role:
    name: image_downgrade_guard
  vars:
    image_downgrade_guard_service_name: jellyfin
    image_downgrade_guard_compose_service: jellyfin
    image_downgrade_guard_project_name: "{{ jellyfin_compose_project_name }}"
    image_downgrade_guard_store_description: "{{ nas_docker_root }}/jellyfin/config"

# Copies the store aside between the guard and the deployment (roles/pre_upgrade_backup).
# Jellyfin's own MigrationBackupFast copy is deleted once a migration succeeds, so
# nothing else on disk can return the store to the older pin.
- name: Guard the Jellyfin store before a pinned upgrade
  ansible.builtin.include_role:
    name: pre_upgrade_backup
  vars:
    pre_upgrade_backup_service_name: jellyfin
    pre_upgrade_backup_compose_service: jellyfin
    pre_upgrade_backup_project_name: "{{ jellyfin_compose_project_name }}"
    pre_upgrade_backup_store_dir: "{{ jellyfin_store_host_path }}"
    pre_upgrade_backup_store_file: jellyfin.db
    pre_upgrade_backup_path: "{{ jellyfin_pre_upgrade_backup_path }}"
    pre_upgrade_backup_manage_ownership: "{{ platform_kind == 'nas' or (platform_manage_linux_ownership | bool) }}"

# The rescue hands the deployment's failure to roles/container_health, which
# explains it from Docker's container state or re-raises it (#509, #537).
- name: Deploy Jellyfin, catching a container that runs but never serves
  block:
    - name: Deploy Jellyfin
      community.docker.docker_compose_v2:
        project_src: "{{ platform_current_dir }}/services/jellyfin"
        project_name: "{{ jellyfin_compose_project_name }}"
        files: "{{ platform_service_compose_files['jellyfin'] }}"
        env_files: ["{{ platform_runtime_dir }}/services/jellyfin/.env"]
        state: present
        wait: true
        wait_timeout: "{{ jellyfin_compose_wait_timeout }}"
      register: jellyfin_deploy
  rescue:
    # First: ansible_failed_result belongs to whichever rescue is running.
    - name: Record the failed Jellyfin deployment
      ansible.builtin.set_fact:
        jellyfin_deploy_failure_message: >-
          {{ ansible_failed_result.msg
             | default('the Jellyfin deployment failed and reported no message') }}

# A `Restarting` container still appears in `docker container ls`, so detect it
# before the CPU check (#510). Publishes the stuck list without refusing yet.
- name: Detect a Jellyfin container that runs but never serves
  ansible.builtin.include_role:
    name: container_health
  vars:
    container_health_service_name: jellyfin
    container_health_project_name: "{{ jellyfin_compose_project_name }}"
    container_health_deploy_failure_message: >-
      {{ jellyfin_deploy_failure_message | default('') }}
    container_health_refuse: false

# Exactly one forced recreate (--no-deps) of only the stuck services; the list is
# empty on a converged host and under --check, so this is idempotent. A single
# task, not a loop, so an unfixable loop never becomes an invisible retry.
- name: Recreate a Jellyfin container that runs but never serves
  block:
    - name: Force-recreate the stuck Jellyfin services
      community.docker.docker_compose_v2:
        project_src: "{{ platform_current_dir }}/services/jellyfin"
        project_name: "{{ jellyfin_compose_project_name }}"
        files: "{{ platform_service_compose_files['jellyfin'] }}"
        env_files: ["{{ platform_runtime_dir }}/services/jellyfin/.env"]
        services: "{{ container_health_stuck_services }}"
        dependencies: false
        recreate: always
        state: present
        wait: true
        wait_timeout: "{{ jellyfin_compose_wait_timeout }}"
      when: container_health_stuck_services | default([]) | length > 0
      register: jellyfin_wedged_recreate
  rescue:
    # Carried rather than re-raised: the re-check below diagnoses an unhealthy
    # container better, and re-raises any other failure unchanged.
    - name: Record the Jellyfin recreate that did not recover the service
      ansible.builtin.set_fact:
        jellyfin_recreate_failure_message: >-
          The force-recreate reported: {{ ansible_failed_result.msg
          | default('no message') }}

# Recorded before the second pass overwrites the list it was decided from.
- name: Record whether a Jellyfin recreate was spent
  ansible.builtin.set_fact:
    jellyfin_recreate_spent: >-
      {{ container_health_stuck_services | default([]) | length > 0 }}

- name: Report the Jellyfin wedged-container recovery check mode defers
  ansible.builtin.debug:
    msg: >-
      A live run would read every container of Compose project
      {{ jellyfin_compose_project_name }} that Docker reports as restarting or
      unhealthy, print its state, force-recreate exactly those services once
      with no dependencies, and fail naming that retry if any of them came back
      stuck. Compose's dry run starts nothing and does not wait on container
      health, so check mode cannot reach that path and recreates nothing.
  when: ansible_check_mode

- name: Refuse a Jellyfin container that stayed wedged after its recreate
  ansible.builtin.include_role:
    name: container_health
  vars:
    container_health_service_name: jellyfin
    container_health_project_name: "{{ jellyfin_compose_project_name }}"
    container_health_deploy_failure_message: >-
      {{ jellyfin_recreate_failure_message | default('') }}
    container_health_retried: "{{ jellyfin_recreate_spent }}"

- name: Report the Jellyfin deployment
  ansible.builtin.include_role:
    name: deployment_bundle
    tasks_from: report
  vars:
    deployment_report_service: Jellyfin
    # Every Compose result: a repairing recreate or a rescue start also changed it.
    deployment_report_changed: >-
      {{ (jellyfin_deploy is changed)
         or ((jellyfin_wedged_recreate | default({})) is changed)
         or ((pre_upgrade_backup_restart | default({})) is changed) }}

- name: Verify Jellyfin effective container CPU policy
  ansible.builtin.include_role:
    name: container_cpu
  vars:
    container_cpu_service_name: jellyfin
    container_cpu_project_name: "{{ jellyfin_compose_project_name }}"

# The container health check passes as soon as /health answers
# well before the startup API serves (503 until initialized). 12.x also runs a
# startup server answering /health and /System/Info/Public with camelCase bodies
# during migration, so only /Startup/Configuration proves the real server. A long
# migration can exhaust this wait; the store is safe and the next tick retries.
- name: Wait for the Jellyfin startup API
  ansible.builtin.uri:
    url: "{{ jellyfin_api }}/Startup/Configuration"
    headers:
      Authorization: "{{ jellyfin_client_header }}"
    status_code: "{{ range(100, 600) | list }}"
  register: jellyfin_startup_api
  until: jellyfin_startup_api.status | default(0) | int in [200, 401, 403]
  retries: "{{ jellyfin_startup_retries }}"
  delay: "{{ platform_readiness_delay }}"
  changed_when: false
  check_mode: false
