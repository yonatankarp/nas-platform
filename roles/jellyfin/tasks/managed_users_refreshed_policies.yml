---
# Run by roles/managed_users as soon as the listing re-read after creation is
# bound as managed_users_listing, before that role reads anything out of it
# (managed_users_after_creation_tasks), in reconcile outside --check. The shared
# role re-resolves its matches from this listing further on, and the repair
# merges into exactly these records, so these are the records proved here. That
# holds only while 'Name' below and jellyfin_managed_users_listed_identity_attribute
# name the same attribute: the shim's expected-policy record subscripts the
# re-resolved match on the strength of this file's length check.
- name: Require safe newly created Jellyfin managed-user identifiers
  ansible.builtin.assert:
    that:
      - item.json.Id | string is match(jellyfin_managed_users_id_pattern)
      - item.json.Name == item.item.username
    fail_msg: Jellyfin returned an unsafe or ambiguous created-user identity.
  loop: >-
    {{ managed_users_creation.results | default([]) |
       rejectattr('skipped', 'defined') | list }}
  loop_control:
    label: jellyfin-managed-user
  no_log: true

- name: Refuse incomplete refreshed Jellyfin managed-user listing
  ansible.builtin.assert:
    that:
      - managed_users_listing.json | type_debug == 'list'
    fail_msg: >-
      Jellyfin returned an unsupported refreshed users response; reconciliation
      refuses to update policy from a partial identity view.

- name: Require complete safe refreshed Jellyfin managed-user policies
  ansible.builtin.assert:
    that:
      - jellyfin_refreshed_matches | length == 1
      - >-
        managed_users_listing.json | map(attribute='Name') |
        map('trim') | map('lower') | select('equalto', item.username | trim | lower) |
        list | length == 1
      - >-
        jellyfin_refreshed_matches[0].Id | string
          is match(jellyfin_managed_users_id_pattern)
      - jellyfin_refreshed_matches[0].Policy is mapping
      - >-
        jellyfin_refreshed_matches[0].Policy.keys() |
        reject('string') | list | length == 0
      - >-
        jellyfin_refreshed_matches[0].Policy.keys() | map('lower') |
        intersect(jellyfin_managed_users_forbidden_policy_fields) | length == 0
      - >-
        jellyfin_refreshed_matches[0].Policy.AuthenticationProviderId |
        default('') | string | length > 0
      - >-
        jellyfin_refreshed_matches[0].Policy.PasswordResetProviderId |
        default('') | string | length > 0
    fail_msg: >-
      Jellyfin returned an absent, ambiguous, incomplete, or unsafe refreshed
      policy; reconciliation refuses to replace policy state.
  vars:
    jellyfin_refreshed_matches: >-
      {{ managed_users_listing.json |
         selectattr('Name', 'equalto', item.username) | list }}
  loop: "{{ managed_users_declared }}"
  loop_control:
    label: jellyfin-managed-user
  no_log: true
