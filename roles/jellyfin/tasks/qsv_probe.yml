---
# Redacted: `docker container inspect` returns the container Env array, which
# is the rendered .env and therefore every Jellyfin credential.
- name: Inspect Jellyfin container availability for a check-mode QSV proof
  ansible.builtin.command:
    argv: [docker, container, inspect, jellyfin]
  register: jellyfin_qsv_container_info
  when:
    - platform_kind == 'nas'
    - >-
      not ((platform_compose_kind | default('') == 'integration') and
           (deployment_bundle_test_mode | default(false) | bool))
    - ansible_check_mode
  changed_when: false
  check_mode: false
  failed_when: jellyfin_qsv_container_info.rc | int not in [0, 1]
  no_log: true

- name: Report planned Jellyfin QSV hardware-device proof
  ansible.builtin.debug:
    msg: JELLYFIN_PLAN_QSV_PROBE
  when:
    - platform_kind == 'nas'
    - >-
      not ((platform_compose_kind | default('') == 'integration') and
           (deployment_bundle_test_mode | default(false) | bool))
    - ansible_check_mode
    - jellyfin_qsv_container_info.rc | default(1) | int == 1
  changed_when: false

- name: Probe the Jellyfin QSV hardware device
  community.docker.docker_compose_v2_exec:
    project_src: "{{ platform_current_dir }}/services/jellyfin"
    project_name: "{{ jellyfin_compose_project_name }}"
    files: "{{ platform_service_compose_files['jellyfin'] }}"
    env_files: ["{{ platform_runtime_dir }}/services/jellyfin/.env"]
    service: jellyfin
    argv:
      - /usr/lib/jellyfin-ffmpeg/ffmpeg
      - -hide_banner
      - -loglevel
      - error
      - -init_hw_device
      # This runs inside the container, but the host variable is still the right
      # source: services/jellyfin/compose.yml maps the render device onto itself
      # rather than renaming it, and tests/contracts/jellyfin-static.rb pins that exact
      # identity mapping, so the container path is the host path.
      - vaapi=va:{{ platform_render_device_path }},driver=iHD
      - -init_hw_device
      - qsv=qs@va
      - -filter_hw_device
      - qs
      - -f
      - lavfi
      - -i
      - color=size=16x16:duration=0.01
      - -frames:v
      - "1"
      - -f
      - "null"
      - "-"
    tty: false
  register: jellyfin_qsv_probe
  when:
    - platform_kind == 'nas'
    - >-
      not ((platform_compose_kind | default('') == 'integration') and
           (deployment_bundle_test_mode | default(false) | bool))
    - >-
      not ansible_check_mode or
      jellyfin_qsv_container_info.rc | default(1) | int == 0
  changed_when: false
  check_mode: false
  # A proof, and until this line it could not fail. Both callers say so in their
  # own names -- deploy.yml's "Prove Jellyfin QSV during convergence",
  # verify.yml's "Prove Jellyfin QSV during exact verification" -- and nothing
  # registers or reads the result anywhere, so the exit code is the whole of
  # what this task establishes. Measured against community.docker 5.3.0:
  # docker_compose_v2_exec sets check_rc only when `detach` is true, so a render
  # device the container could not open, an iHD driver that stopped loading, or
  # a QSV stack an image bump broke all exited nonzero and reported success.
  #
  # `failed_when: false` was the honest alternative and it is refused here rather
  # than left implicit: a probe permitted to fail whose result nothing reads
  # asserts nothing at all, and the treatment for that is deleting the task, not
  # documenting it.
  #
  # No message is written. ffmpeg puts its diagnosis on stderr and -loglevel
  # error keeps stdout empty, but a message naming one stream is exactly the
  # wager tests/contracts/nextcloud-runtime.rb's diagnosis helper exists to
  # avoid; this task carries no no_log -- its argv holds a device path and no
  # credential -- so the failed result renders rc, stdout and stderr together
  # and nothing has to choose between them.
  failed_when: jellyfin_qsv_probe.rc | default(0) | int != 0
