---
# Redacted: `docker container inspect` returns the container Env array, which
# is the rendered .env and therefore every Jellyfin credential.
- name: Inspect Jellyfin container availability for a check-mode QSV proof
  ansible.builtin.command:
    argv: [docker, container, inspect, jellyfin]
  register: jellyfin_qsv_container_info
  when:
    - platform_kind == 'nas'
    - >-
      not ((platform_compose_kind | default('') == 'integration') and
           (deployment_bundle_test_mode | default(false) | bool))
    - ansible_check_mode
  changed_when: false
  check_mode: false
  failed_when: jellyfin_qsv_container_info.rc | int not in [0, 1]
  no_log: true

- name: Report planned Jellyfin QSV hardware-device proof
  ansible.builtin.debug:
    msg: JELLYFIN_PLAN_QSV_PROBE
  when:
    - platform_kind == 'nas'
    - >-
      not ((platform_compose_kind | default('') == 'integration') and
           (deployment_bundle_test_mode | default(false) | bool))
    - ansible_check_mode
    - jellyfin_qsv_container_info.rc | default(1) | int == 1
  changed_when: false

- name: Probe the Jellyfin QSV hardware device
  community.docker.docker_compose_v2_exec:
    project_src: "{{ platform_current_dir }}/services/jellyfin"
    project_name: "{{ jellyfin_compose_project_name }}"
    files: "{{ platform_service_compose_files['jellyfin'] }}"
    env_files: ["{{ platform_runtime_dir }}/services/jellyfin/.env"]
    service: jellyfin
    argv:
      - /usr/lib/jellyfin-ffmpeg/ffmpeg
      - -hide_banner
      - -loglevel
      - error
      - -init_hw_device
      # This runs inside the container, but the host variable is still the right
      # source: services/jellyfin/compose.yml maps the render device onto itself
      # rather than renaming it, and tests/contracts/jellyfin-static.rb pins that exact
      # identity mapping, so the container path is the host path.
      - vaapi=va:{{ platform_render_device_path }},driver=iHD
      - -init_hw_device
      - qsv=qs@va
      - -filter_hw_device
      - qs
      - -f
      - lavfi
      - -i
      - color=size=16x16:duration=0.01
      - -frames:v
      - "1"
      - -f
      - "null"
      - "-"
    tty: false
  register: jellyfin_qsv_probe
  when:
    - platform_kind == 'nas'
    - >-
      not ((platform_compose_kind | default('') == 'integration') and
           (deployment_bundle_test_mode | default(false) | bool))
    - >-
      not ansible_check_mode or
      jellyfin_qsv_container_info.rc | default(1) | int == 0
  changed_when: false
  check_mode: false
  # A proof that cannot fail, stated rather than left to be inferred from a
  # missing line -- which is the whole point of the #521 rule: a task tolerating
  # failure says so, because deleting the line would not make it fail.
  #
  # Measured against community.docker 5.3.0: docker_compose_v2_exec sets
  # check_rc only when `detach` is true, so a render device the container could
  # not open, an iHD driver that stopped loading, or a QSV stack an image bump
  # broke all exit nonzero and report success. Nothing registers or reads the
  # result, so today this task establishes nothing at all.
  #
  # Making it fatal was implemented and then withdrawn, because it is a bigger
  # decision than an exit-code sweep should carry. This file is included from
  # BOTH roles/jellyfin/tasks/deploy.yml and roles/jellyfin/tasks/verify.yml,
  # and it runs for real under --check (check_mode: false, and its `when` admits
  # check mode whenever the container exists). So a fatal probe fails the
  # converge, the poller's platform_verify_jellyfin leg, AND the --check --diff
  # review the platform requires before applying -- and because jellyfin
  # precedes seerr, immich, paperless_ngx and nextcloud in site.yml, it would
  # strand those four unconverged on a hardware fault that harms none of them.
  #
  # The question that leaves open -- whether a proof belongs in the converge
  # path at all, or only in verify.yml, which CLAUDE.md calls structurally
  # incapable of converging -- is filed separately. It needs the probe's live
  # exit code on the NAS to decide, which is not knowable from the tree.
  failed_when: false
