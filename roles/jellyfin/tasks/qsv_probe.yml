---
# Hardware proof that the container can open the render device, load iHD and
# decode through Quick Sync; nothing converges it. Reached only from verify.yml,
# never the converge (#535). QSV worked on 2026-09-10, so a nonzero exit is a
# regression and means software transcoding on pinned CPUs.
- name: Probe the Jellyfin QSV hardware device
  community.docker.docker_compose_v2_exec:
    project_src: "{{ platform_current_dir }}/services/jellyfin"
    project_name: "{{ jellyfin_compose_project_name }}"
    files: "{{ platform_service_compose_files['jellyfin'] }}"
    env_files: ["{{ platform_runtime_dir }}/services/jellyfin/.env"]
    service: jellyfin
    argv:
      - /usr/lib/jellyfin-ffmpeg/ffmpeg
      - -hide_banner
      - -loglevel
      - error
      - -init_hw_device
      # Compose maps the render device onto itself, so the host path is the
      # container path (pinned by tests/contracts/jellyfin-static.rb).
      - vaapi=va:{{ platform_render_device_path }},driver=iHD
      - -init_hw_device
      - qsv=qs@va
      - -filter_hw_device
      - qs
      - -f
      - lavfi
      - -i
      - color=size=16x16:duration=0.01
      - -frames:v
      - "1"
      - -f
      - "null"
      - "-"
    tty: false
  register: jellyfin_qsv_probe
  when:
    - platform_kind == 'nas'
    - >-
      not ((platform_compose_kind | default('') == 'integration') and
           (deployment_bundle_test_mode | default(false) | bool))
  changed_when: false
  check_mode: false
  # docker_compose_v2_exec checks rc only with detach (#521); default(1) so a
  # module that refused before running is not read as a pass.
  failed_when: jellyfin_qsv_probe.rc | default(1) | int != 0
