---
# Jellyfin, one stage per file, in the order they run. Stages are imported
# statically so role-level `never` tags reach each verify task; a when:/vars:/tags:
# on a static import would apply to every task in the file. The phase-gated
# settings.yml and managed_users.yml stay dynamic includes.
- name: Deploy the Jellyfin stack
  ansible.builtin.import_tasks: deploy.yml

- name: Bootstrap the Jellyfin server through its startup wizard
  ansible.builtin.import_tasks: bootstrap.yml

- name: Authenticate the Jellyfin primary administrator and resolve its token
  ansible.builtin.import_tasks: authentication.yml

- name: Preflight Jellyfin acceleration and plugins
  ansible.builtin.include_tasks: settings.yml
  vars:
    jellyfin_settings_phase: preflight
    jellyfin_settings_token: "{{ jellyfin_reconcile_token }}"
  when: not ansible_check_mode or jellyfin_wizard_completed | bool

- name: Preflight Jellyfin managed users
  ansible.builtin.include_tasks: managed_users.yml
  vars:
    jellyfin_managed_users_phase: preflight
    jellyfin_managed_users_token: "{{ jellyfin_reconcile_token }}"
  when: not ansible_check_mode or jellyfin_wizard_completed | bool

- name: Read the owned Jellyfin state before any mutation
  ansible.builtin.import_tasks: preflight.yml

- name: Prepare Jellyfin plugin repositories and package catalog
  ansible.builtin.include_tasks: settings.yml
  vars:
    jellyfin_settings_phase: prepare
    jellyfin_settings_token: "{{ jellyfin_reconcile_token }}"
  when: not ansible_check_mode

- name: Activate and validate the Open Subtitles plugin when immediately available
  ansible.builtin.include_tasks: settings.yml
  vars:
    jellyfin_settings_phase: activate
    jellyfin_activation_scope: opensubtitles
    jellyfin_settings_token: "{{ jellyfin_reconcile_token }}"
  when: not ansible_check_mode

- name: Activate remaining required Jellyfin plugins
  ansible.builtin.include_tasks: settings.yml
  vars:
    jellyfin_settings_phase: activate
    jellyfin_activation_scope: remaining
    jellyfin_settings_token: "{{ jellyfin_reconcile_token }}"
  when: not ansible_check_mode

- name: Finalize required Jellyfin plugin activation through one restart barrier
  ansible.builtin.include_tasks: settings.yml
  vars:
    jellyfin_settings_phase: finalize
    jellyfin_settings_token: "{{ jellyfin_reconcile_token }}"
  when: not ansible_check_mode

- name: Reconcile Jellyfin acceleration and plugins
  ansible.builtin.include_tasks: settings.yml
  vars:
    jellyfin_settings_phase: reconcile
    jellyfin_settings_token: "{{ jellyfin_reconcile_token }}"

- name: Reconcile the Jellyfin administrator name, server name and image
  ansible.builtin.import_tasks: identity.yml

- name: Reconcile the managed Jellyfin libraries
  ansible.builtin.import_tasks: libraries.yml

- name: Declare the Jellyfin scheduled task triggers
  ansible.builtin.import_tasks: scheduled_tasks.yml

- name: Reconcile managed Jellyfin users
  ansible.builtin.include_tasks: managed_users.yml
  vars:
    jellyfin_managed_users_phase: reconcile
    jellyfin_managed_users_token: "{{ jellyfin_reconcile_token }}"
  when: not ansible_check_mode

- name: Run Jellyfin service verification
  ansible.builtin.import_tasks: verify.yml
