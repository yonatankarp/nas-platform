---
- name: Revalidate deployment paths before Jellyfin runtime use
  ansible.builtin.include_role:
    name: deployment_bundle
    tasks_from: target
  vars:
    deployment_target_require_current_release: true
    deployment_target_extra_paths:
      - "{{ platform_current_dir }}/services/jellyfin"
      - "{{ platform_current_dir }}/services/jellyfin/compose.yml"
      - "{{ platform_current_dir }}/services/jellyfin/compose.{{ platform_compose_kind }}.yml"
      - "{{ platform_runtime_dir }}/services/jellyfin"
      - "{{ platform_runtime_dir }}/services/jellyfin/.env"

# Deliberately not redacted. On ansible-core 2.21.3 no_log on an assert hides only
# the result dict; fail_msg prints from the error header either way. Hiding the dict
# here costs the name of whichever of these 68 conditions failed, under a fail_msg
# that lists four unrelated causes. The dict cannot carry credential material: the
# assert is unlooped, so there is no item to echo, and the reported "assertion" field
# is the source text of the condition rather than its rendered value, so the two
# vault_jellyfin_opensubtitles_* presence checks disclose their variable names only.
- name: Require explicit Jellyfin acceleration and plugin policy
  ansible.builtin.assert:
    that:
      - platform_kind in jellyfin_encoding_profiles
      - jellyfin_encoding_profiles is mapping
      - jellyfin_encoding_profiles.nas is mapping
      - jellyfin_encoding_profiles.mac is mapping
      - jellyfin_encoding_policy is mapping
      - jellyfin_encoding_policy.HardwareAccelerationType is string
      - jellyfin_encoding_policy.QsvDevice is string
      - jellyfin_encoding_policy.HardwareDecodingCodecs | type_debug == 'list'
      - >-
        jellyfin_encoding_policy.HardwareDecodingCodecs |
        select('string') | list | length ==
        jellyfin_encoding_policy.HardwareDecodingCodecs | length
      - jellyfin_encoding_policy.EnableDecodingColorDepth10Hevc is boolean
      - jellyfin_encoding_policy.EnableDecodingColorDepth10Vp9 is boolean
      - jellyfin_encoding_policy.EnableHardwareEncoding is boolean
      - jellyfin_encoding_policy.AllowHevcEncoding is boolean
      - jellyfin_encoding_policy.AllowAv1Encoding is boolean
      - jellyfin_encoding_policy.EnableIntelLowPowerH264HwEncoder is boolean
      - jellyfin_encoding_policy.EnableIntelLowPowerHevcHwEncoder is boolean
      - jellyfin_encoding_policy.EnableVppTonemapping is boolean
      - jellyfin_encoding_policy.EnableTonemapping is boolean
      - jellyfin_encoding_profiles.nas.HardwareAccelerationType is string
      - jellyfin_encoding_profiles.nas.QsvDevice is string
      - jellyfin_encoding_profiles.nas.HardwareDecodingCodecs | type_debug == 'list'
      - >-
        jellyfin_encoding_profiles.nas.HardwareDecodingCodecs |
        select('string') | list | length ==
        jellyfin_encoding_profiles.nas.HardwareDecodingCodecs | length
      - jellyfin_encoding_profiles.nas.EnableDecodingColorDepth10Hevc is boolean
      - jellyfin_encoding_profiles.nas.EnableDecodingColorDepth10Vp9 is boolean
      - jellyfin_encoding_profiles.nas.EnableHardwareEncoding is boolean
      - jellyfin_encoding_profiles.nas.AllowHevcEncoding is boolean
      - jellyfin_encoding_profiles.nas.AllowAv1Encoding is boolean
      - jellyfin_encoding_profiles.nas.EnableIntelLowPowerH264HwEncoder is boolean
      - jellyfin_encoding_profiles.nas.EnableIntelLowPowerHevcHwEncoder is boolean
      - jellyfin_encoding_profiles.nas.EnableVppTonemapping is boolean
      - jellyfin_encoding_profiles.nas.EnableTonemapping is boolean
      - jellyfin_encoding_profiles.mac.HardwareAccelerationType is string
      - jellyfin_encoding_profiles.mac.QsvDevice is string
      - jellyfin_encoding_profiles.mac.HardwareDecodingCodecs | type_debug == 'list'
      - >-
        jellyfin_encoding_profiles.mac.HardwareDecodingCodecs |
        select('string') | list | length ==
        jellyfin_encoding_profiles.mac.HardwareDecodingCodecs | length
      - jellyfin_encoding_profiles.mac.EnableDecodingColorDepth10Hevc is boolean
      - jellyfin_encoding_profiles.mac.EnableDecodingColorDepth10Vp9 is boolean
      - jellyfin_encoding_profiles.mac.EnableHardwareEncoding is boolean
      - jellyfin_encoding_profiles.mac.AllowHevcEncoding is boolean
      - jellyfin_encoding_profiles.mac.AllowAv1Encoding is boolean
      - jellyfin_encoding_profiles.mac.EnableIntelLowPowerH264HwEncoder is boolean
      - jellyfin_encoding_profiles.mac.EnableIntelLowPowerHevcHwEncoder is boolean
      - jellyfin_encoding_profiles.mac.EnableVppTonemapping is boolean
      - jellyfin_encoding_profiles.mac.EnableTonemapping is boolean
      - jellyfin_encoding_profiles.nas == jellyfin_required_nas_encoding_policy
      - jellyfin_encoding_profiles.mac == jellyfin_required_mac_encoding_policy
      - >-
        jellyfin_encoding_policy == jellyfin_encoding_profiles[
          'mac'
          if ((platform_compose_kind | default('') == 'integration') and
              (deployment_bundle_test_mode | default(false) | bool))
          else platform_kind
        ]
      - jellyfin_plugin_repositories | type_debug == 'list'
      - jellyfin_plugin_repositories | length == 2
      - jellyfin_plugin_repositories[0] is mapping
      - jellyfin_plugin_repositories[1] is mapping
      - jellyfin_plugin_repositories[0].Name is string
      - jellyfin_plugin_repositories[1].Name is string
      - >-
        jellyfin_plugin_repositories | map(attribute='Name') | list ==
        ['Jellyfin Stable', 'Intro Skipper']
      - >-
        jellyfin_plugin_repositories[0].Url is string and
        jellyfin_plugin_repositories[1].Url is string
      - >-
        jellyfin_plugin_repositories | map(attribute='Url') | list ==
        ['https://repo.jellyfin.org/files/plugin/manifest.json',
         'https://intro-skipper.org/manifest.json']
      - >-
        jellyfin_plugin_repositories[0].Enabled is boolean and
        jellyfin_plugin_repositories[1].Enabled is boolean
      - jellyfin_plugin_repositories[0].Enabled
      - jellyfin_plugin_repositories[1].Enabled
      - >-
        jellyfin_retired_plugin_repository_urls ==
        ['https://repo.jellyfin.org/releases/plugin/manifest-stable.json']
      - jellyfin_plugins | type_debug == 'list'
      - jellyfin_plugins | select('string') | list | length == jellyfin_plugins | length
      - jellyfin_plugins == ['Intro Skipper', 'Open Subtitles']
      - jellyfin_plugin_packages == jellyfin_required_plugin_packages
      - jellyfin_opensubtitles_plugin_id is string
      - jellyfin_opensubtitles_plugin_id == '4b9ed42f-5185-48b5-9803-6ff2989014c4'
      - vault_jellyfin_opensubtitles_username | length > 0
      - vault_jellyfin_opensubtitles_password | length > 0
    fail_msg: >-
      Jellyfin requires an explicit pinned platform encoding policy, unique managed
      repositories, exact plugin identities, and nonempty Open Subtitles credentials.
  vars:
    jellyfin_required_nas_encoding_policy:
      HardwareAccelerationType: qsv
      QsvDevice: /dev/dri/renderD128
      HardwareDecodingCodecs: [h264, hevc, mpeg2video, vc1, vp8, vp9]
      EnableDecodingColorDepth10Hevc: true
      EnableDecodingColorDepth10Vp9: true
      EnableHardwareEncoding: true
      AllowHevcEncoding: true
      AllowAv1Encoding: false
      EnableIntelLowPowerH264HwEncoder: true
      EnableIntelLowPowerHevcHwEncoder: true
      EnableVppTonemapping: true
      EnableTonemapping: false
    jellyfin_required_mac_encoding_policy:
      HardwareAccelerationType: none
      QsvDevice: ""
      HardwareDecodingCodecs: []
      EnableDecodingColorDepth10Hevc: false
      EnableDecodingColorDepth10Vp9: false
      EnableHardwareEncoding: false
      AllowHevcEncoding: false
      AllowAv1Encoding: false
      EnableIntelLowPowerH264HwEncoder: false
      EnableIntelLowPowerHevcHwEncoder: false
      EnableVppTonemapping: false
      EnableTonemapping: false
    jellyfin_required_plugin_packages:
      - Name: Intro Skipper
        AssemblyGuid: c83d86bb-a1e0-4c35-a113-e2101cf4ee6b
        RepositoryUrl: https://intro-skipper.org/manifest.json
      - Name: Open Subtitles
        AssemblyGuid: 4b9ed42f-5185-48b5-9803-6ff2989014c4
        RepositoryUrl: https://repo.jellyfin.org/files/plugin/manifest.json

- name: Inspect the exact NAS Jellyfin render device
  ansible.builtin.stat:
    path: "{{ platform_render_device_path }}"
    follow: false
  register: jellyfin_render_device
  when:
    - platform_kind == 'nas'
    - >-
      not ((platform_compose_kind | default('') == 'integration') and
           (deployment_bundle_test_mode | default(false) | bool))
  changed_when: false
  check_mode: false

# The literal here is deliberate, not a missed substitution. NAS hosts are
# pinned to renderD128 by design: the Compose definition passes that exact
# device through by name, and the encoding policy above names it as QsvDevice.
# This assert is what makes that pinning explicit rather than accidental, and it
# is gated on platform_kind so it never constrains a Mac host, where the
# variable is /dev/dri/card0 and no QSV device is expected at all.
- name: Require the exact NAS Jellyfin render device
  ansible.builtin.assert:
    that:
      - platform_render_device_available | bool
      - platform_render_device_path == '/dev/dri/renderD128'
      - jellyfin_render_device.stat.exists
      - jellyfin_render_device.stat.ischr
      - not jellyfin_render_device.stat.islnk
    fail_msg: >-
      The NAS must expose /dev/dri/renderD128 as the exact character render device
      before Jellyfin Compose or application state is changed.
  when:
    - platform_kind == 'nas'
    - >-
      not ((platform_compose_kind | default('') == 'integration') and
           (deployment_bundle_test_mode | default(false) | bool))

- name: Render the Jellyfin environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ platform_runtime_dir }}/services/jellyfin/.env"
    mode: "0600"

- name: Deploy Jellyfin
  community.docker.docker_compose_v2:
    project_src: "{{ platform_current_dir }}/services/jellyfin"
    project_name: "{{ jellyfin_compose_project_name }}"
    files: "{{ platform_service_compose_files['jellyfin'] }}"
    env_files: ["{{ platform_runtime_dir }}/services/jellyfin/.env"]
    state: present
    wait: true
    wait_timeout: "{{ jellyfin_compose_wait_timeout }}"
  register: jellyfin_deploy

- name: Report the Jellyfin deployment
  ansible.builtin.include_role:
    name: ntfy
    tasks_from: deployment_report
  vars:
    ntfy_deployment_report_service: Jellyfin
    ntfy_deployment_report_changed: "{{ jellyfin_deploy is changed }}"

- name: Verify Jellyfin effective container CPU policy
  ansible.builtin.include_role:
    name: container_cpu
  vars:
    container_cpu_service_name: jellyfin
    container_cpu_project_name: "{{ jellyfin_compose_project_name }}"

- name: Prove Jellyfin QSV during convergence
  ansible.builtin.include_tasks: qsv_probe.yml
  when:
    - platform_kind == 'nas'
    - >-
      not ((platform_compose_kind | default('') == 'integration') and
           (deployment_bundle_test_mode | default(false) | bool))

# The container health check passes as soon as /health answers, which happens
# well before the application can serve its own startup API: that endpoint
# returns 503 until the server has finished initializing. Waiting on the
# endpoint this role actually calls is what makes the next tasks meaningful.
- name: Wait for the Jellyfin startup API
  ansible.builtin.uri:
    url: "{{ jellyfin_api }}/Startup/Configuration"
    headers:
      Authorization: "{{ jellyfin_client_header }}"
    status_code: "{{ range(100, 600) | list }}"
  register: jellyfin_startup_api
  until: jellyfin_startup_api.status | default(0) | int in [200, 401, 403]
  retries: "{{ jellyfin_startup_retries }}"
  delay: "{{ platform_readiness_delay }}"
  changed_when: false
  check_mode: false

# The wait above polls /Startup/Configuration and accepts 401 and 403, which
# Jellyfin can answer before it has finished loading. This endpoint is a
# different one and returns 503 until initialization completes, so it needs its
# own wait rather than inheriting the previous task's.
- name: Read Jellyfin startup state
  ansible.builtin.uri:
    url: "{{ jellyfin_api }}/System/Info/Public"
    return_content: true
    status_code: "{{ range(100, 600) | list }}"
  register: jellyfin_public_info
  until: jellyfin_public_info.status | default(0) | int == 200
  retries: "{{ jellyfin_startup_retries }}"
  delay: "{{ platform_readiness_delay }}"
  changed_when: false
  check_mode: false

- name: Resolve Jellyfin startup state
  ansible.builtin.set_fact:
    jellyfin_wizard_completed: "{{ jellyfin_public_info.json.StartupWizardCompleted | bool }}"

- name: Report planned Jellyfin administrator creation
  ansible.builtin.debug:
    msg: JELLYFIN_PLAN_WIZARD
  when:
    - ansible_check_mode
    - not jellyfin_wizard_completed | bool
  changed_when: true

# Pinned 10.11.11 creates the default first user lazily. POST /Startup/User
# updates that user and answers 404 when it does not exist yet, so this read is
# a required part of the wizard rather than a diagnostic.
- name: Materialize the Jellyfin first user
  ansible.builtin.uri:
    url: "{{ jellyfin_api }}/Startup/User"
    headers:
      Authorization: "{{ jellyfin_client_header }}"
    status_code: [200]
  when:
    - not ansible_check_mode
    - not jellyfin_wizard_completed | bool
  changed_when: false
  check_mode: false
  no_log: true

- name: Set the Jellyfin startup configuration
  ansible.builtin.uri:
    url: "{{ jellyfin_api }}/Startup/Configuration"
    method: POST
    headers:
      Authorization: "{{ jellyfin_client_header }}"
    body_format: json
    body:
      ServerName: "{{ jellyfin_server_name }}"
      UICulture: en-US
      PreferredMetadataLanguage: "{{ jellyfin_library_options.PreferredMetadataLanguage }}"
      MetadataCountryCode: "{{ jellyfin_library_options.MetadataCountryCode }}"
    status_code: [204]
  when:
    - not ansible_check_mode
    - not jellyfin_wizard_completed | bool
  changed_when: true

- name: Create the vault Jellyfin administrator
  ansible.builtin.uri:
    url: "{{ jellyfin_api }}/Startup/User"
    method: POST
    headers:
      Authorization: "{{ jellyfin_client_header }}"
    body_format: json
    body:
      Name: "{{ vault_jellyfin_admin_username }}"
      Password: "{{ vault_jellyfin_admin_password }}"
    status_code: [204]
  when:
    - not ansible_check_mode
    - not jellyfin_wizard_completed | bool
  changed_when: true
  no_log: true

- name: Complete the Jellyfin startup wizard
  ansible.builtin.uri:
    url: "{{ jellyfin_api }}/Startup/Complete"
    method: POST
    headers:
      Authorization: "{{ jellyfin_client_header }}"
    status_code: [204]
  when:
    - not ansible_check_mode
    - not jellyfin_wizard_completed | bool
  changed_when: true

# Deliberately not redacted, on the same reasoning as the acceleration policy assert
# above: unlooped, so nothing but condition source text reaches the result dict, and
# the fail_msg names four unrelated causes without saying which one fired. The only
# vault reference is the administrator username, which this same task pins to the
# repository literal 'Yonatan' and so is not secret.
- name: Require the fixed Jellyfin ownership declaration
  ansible.builtin.assert:
    that:
      - jellyfin_admin_username == 'Yonatan'
      - vault_jellyfin_admin_username == jellyfin_admin_username
      - jellyfin_server_name == 'Yonflix 2.0'
      - jellyfin_admin_avatar_sha256 is match('^[a-f0-9]{64}$')
      - jellyfin_libraries | type_debug == 'list'
      - jellyfin_libraries | length == 2
      - jellyfin_libraries | map(attribute='name') | list == ['Movies', 'Shows']
      - jellyfin_libraries | map(attribute='collection_type') | list == ['movies', 'tvshows']
      - jellyfin_libraries | map(attribute='path') | list == ['/media/Movies', '/media/Series']
      - jellyfin_libraries | selectattr('name', 'equalto', 'Collections') | list | length == 0
    fail_msg: The fixed Jellyfin identity, branding, avatar, or library declaration differs.

- name: Report planned Jellyfin administrator image upload after startup
  ansible.builtin.debug:
    msg: JELLYFIN_PLAN_ADMIN_IMAGE
  when:
    - ansible_check_mode
    - not jellyfin_wizard_completed | bool
  changed_when: true

- name: Report planned Jellyfin managed library creation after startup
  ansible.builtin.debug:
    msg: "JELLYFIN_PLAN_LIBRARY_CREATE {{ item.name }}"
  loop: "{{ jellyfin_libraries }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - ansible_check_mode
    - not jellyfin_wizard_completed | bool
  changed_when: true

- name: Inspect Jellyfin primary administrator recovery marker
  ansible.builtin.stat:
    path: "{{ jellyfin_primary_recovery_marker }}"
  register: jellyfin_primary_recovery_marker_state
  changed_when: false
  check_mode: false

- name: Require safe Jellyfin primary administrator recovery marker file
  ansible.builtin.assert:
    that:
      - not jellyfin_primary_recovery_marker_state.stat.exists or
        jellyfin_primary_recovery_marker_state.stat.isreg
      - not jellyfin_primary_recovery_marker_state.stat.exists or
        not jellyfin_primary_recovery_marker_state.stat.islnk
      - not jellyfin_primary_recovery_marker_state.stat.exists or
        jellyfin_primary_recovery_marker_state.stat.mode == '0600'
      - not jellyfin_primary_recovery_marker_state.stat.exists or
        (ansible_facts.user_id is defined and
         jellyfin_primary_recovery_marker_state.stat.pw_name == ansible_facts.user_id)
    fail_msg: >-
      The Jellyfin primary administrator recovery marker is not a private regular
      file owned by the effective platform user.

# Redacted through the parse below: the marker records the primary
# administrator's original name, which is vault_jellyfin_admin_username.
- name: Read Jellyfin primary administrator recovery marker
  ansible.builtin.slurp:
    src: "{{ jellyfin_primary_recovery_marker }}"
  register: jellyfin_primary_recovery_marker_content
  when: jellyfin_primary_recovery_marker_state.stat.exists
  changed_when: false
  check_mode: false
  no_log: true

- name: Resolve Jellyfin primary administrator recovery state
  ansible.builtin.set_fact:
    jellyfin_primary_recovery_state: >-
      {{ (jellyfin_primary_recovery_marker_content.content | b64decode | from_json)
         if jellyfin_primary_recovery_marker_state.stat.exists else {} }}
  no_log: true

- name: Require safe Jellyfin primary administrator recovery state
  ansible.builtin.assert:
    that:
      - >-
        jellyfin_primary_recovery_state | length == 0 or
        jellyfin_primary_recovery_state.keys() | list | sort == ['id', 'original_name']
      - >-
        jellyfin_primary_recovery_state | length == 0 or
        jellyfin_primary_recovery_state.id | string is match('^[A-Fa-f0-9-]{32,36}$')
      - >-
        jellyfin_primary_recovery_state | length == 0 or
        (jellyfin_primary_recovery_state.original_name is string and
         jellyfin_primary_recovery_state.original_name | trim | length > 0)
    fail_msg: The Jellyfin primary administrator recovery marker is malformed.

- name: Resolve Jellyfin primary administrator authentication name
  ansible.builtin.set_fact:
    jellyfin_primary_authentication_name: >-
      {{ ('nas-platform-admin-' ~ (jellyfin_primary_recovery_state.id | string)[0:12])
         if jellyfin_primary_recovery_state | length > 0 else jellyfin_admin_username }}
  no_log: true

- name: Authenticate the expected Jellyfin primary administrator identity
  ansible.builtin.uri:
    url: "{{ jellyfin_api }}/Users/AuthenticateByName"
    method: POST
    headers:
      Authorization: "{{ jellyfin_client_header }}"
    body_format: json
    body:
      Username: "{{ jellyfin_primary_authentication_name }}"
      Pw: "{{ vault_jellyfin_admin_password }}"
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: jellyfin_primary_authentication_attempt
  when: not ansible_check_mode or jellyfin_wizard_completed | bool
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

- name: Authenticate the pre-hop Jellyfin primary administrator identity
  ansible.builtin.uri:
    url: "{{ jellyfin_api }}/Users/AuthenticateByName"
    method: POST
    headers:
      Authorization: "{{ jellyfin_client_header }}"
    body_format: json
    body:
      Username: "{{ jellyfin_primary_recovery_state.original_name }}"
      Pw: "{{ vault_jellyfin_admin_password }}"
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: jellyfin_primary_fallback_authentication
  when:
    - not ansible_check_mode or jellyfin_wizard_completed | bool
    - jellyfin_primary_recovery_state | length > 0
    - jellyfin_primary_authentication_attempt.status | default(0) | int != 200
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

- name: Resolve authenticated Jellyfin primary administrator identity
  ansible.builtin.set_fact:
    jellyfin_reconcile_login: >-
      {{ jellyfin_primary_authentication_attempt
         if jellyfin_primary_authentication_attempt.status | default(0) | int == 200
         else (jellyfin_primary_fallback_authentication |
               default(jellyfin_primary_authentication_attempt)) }}
  when: not ansible_check_mode or jellyfin_wizard_completed | bool
  no_log: true

- name: Require the vault Jellyfin administrator
  ansible.builtin.assert:
    that:
      - jellyfin_reconcile_login.status | default(0) | int == 200
      - jellyfin_reconcile_login.json.User.Id | string is match('^[A-Fa-f0-9-]{32,36}$')
      - jellyfin_reconcile_login.json.User.Policy.IsAdministrator | bool
      - jellyfin_reconcile_login.json.User.Configuration is mapping
      - jellyfin_reconcile_login.json.AccessToken | default('') | length > 0
      - >-
        jellyfin_primary_recovery_state | length == 0 or
        jellyfin_reconcile_login.json.User.Id | string == jellyfin_primary_recovery_state.id | string
      - >-
        jellyfin_primary_recovery_state | length == 0 or
        jellyfin_reconcile_login.json.User.Name in
          [jellyfin_primary_authentication_name,
           jellyfin_primary_recovery_state.original_name,
           jellyfin_admin_username]
    fail_msg: >-
      Jellyfin does not accept the preserved primary administrator credential,
      or the authenticated identity is not an administrator. No owned state was changed.
  when: not ansible_check_mode or jellyfin_wizard_completed | bool

- name: Resolve the Jellyfin reconciliation identity and token
  ansible.builtin.set_fact:
    jellyfin_reconcile_token: "{{ jellyfin_reconcile_login.json.AccessToken }}"
    jellyfin_primary_authenticated_id: "{{ jellyfin_reconcile_login.json.User.Id | string }}"
    jellyfin_primary_temporary_name: >-
      {{ 'nas-platform-admin-' ~ (jellyfin_reconcile_login.json.User.Id | string)[0:12] }}
  when: not ansible_check_mode or jellyfin_wizard_completed | bool
  no_log: true

- name: Preflight Jellyfin acceleration and plugins
  ansible.builtin.include_tasks: settings.yml
  vars:
    jellyfin_settings_phase: preflight
    jellyfin_settings_token: "{{ jellyfin_reconcile_token }}"
  when: not ansible_check_mode or jellyfin_wizard_completed | bool

- name: Preflight Jellyfin managed users
  ansible.builtin.include_tasks: managed_users.yml
  vars:
    jellyfin_managed_users_phase: preflight
    jellyfin_managed_users_token: "{{ jellyfin_reconcile_token }}"
  when: not ansible_check_mode or jellyfin_wizard_completed | bool

- name: List Jellyfin users for primary administrator preflight
  ansible.builtin.uri:
    url: "{{ jellyfin_api }}/Users"
    headers:
      Authorization: '{{ jellyfin_client_header }}, Token="{{ jellyfin_reconcile_token }}"'
    status_code: [200]
    return_content: true
  register: jellyfin_primary_users_before
  when: not ansible_check_mode or jellyfin_wizard_completed | bool
  changed_when: false
  check_mode: false
  no_log: true

- name: Initialize Jellyfin primary administrator matches
  ansible.builtin.set_fact:
    jellyfin_primary_id_matches: []
    jellyfin_primary_exact_matches: []
    jellyfin_primary_normalized_matches: []
    jellyfin_primary_temporary_matches: []
  when: not ansible_check_mode or jellyfin_wizard_completed | bool
  no_log: true

- name: Resolve Jellyfin primary administrator matches
  ansible.builtin.set_fact:
    jellyfin_primary_id_matches: >-
      {{ jellyfin_primary_id_matches +
         ([item] if item.Id | string == jellyfin_primary_authenticated_id else []) }}
    jellyfin_primary_exact_matches: >-
      {{ jellyfin_primary_exact_matches +
         ([item] if item.Name == jellyfin_admin_username else []) }}
    jellyfin_primary_normalized_matches: >-
      {{ jellyfin_primary_normalized_matches +
         ([item] if item.Name | trim | lower == jellyfin_admin_username | trim | lower else []) }}
    jellyfin_primary_temporary_matches: >-
      {{ jellyfin_primary_temporary_matches +
         ([item] if item.Name == jellyfin_primary_temporary_name else []) }}
  loop: "{{ jellyfin_primary_users_before.json | default([]) }}"
  loop_control:
    label: jellyfin-primary-user
  when: not ansible_check_mode or jellyfin_wizard_completed | bool
  no_log: true

- name: Refuse ambiguous Jellyfin primary administrator identity
  ansible.builtin.assert:
    that:
      - jellyfin_primary_users_before.json | type_debug == 'list'
      - jellyfin_primary_id_matches | length == 1
      - >-
        jellyfin_primary_normalized_matches | length == 1 or
        jellyfin_primary_temporary_matches | length == 1
      - jellyfin_primary_exact_matches | length <= 1
      - >-
        jellyfin_primary_exact_matches | length == 0 or
        jellyfin_primary_exact_matches[0].Id | string == jellyfin_primary_authenticated_id
      - jellyfin_primary_temporary_matches | length <= 1
      - >-
        jellyfin_primary_temporary_matches | length == 0 or
        jellyfin_primary_temporary_matches[0].Id | string == jellyfin_primary_authenticated_id
      - >-
        jellyfin_primary_normalized_matches | length +
        jellyfin_primary_temporary_matches | length == 1
      - jellyfin_primary_id_matches[0].Policy.IsAdministrator | bool
      - jellyfin_primary_id_matches[0].Configuration is mapping
    fail_msg: >-
      The configured Jellyfin primary administrator is absent, duplicated, or conflicts
      with a separate exact or temporary identity. Resolve it manually; no users were changed.
  when: not ansible_check_mode or jellyfin_wizard_completed | bool

- name: Resolve the existing Jellyfin primary administrator
  ansible.builtin.set_fact:
    jellyfin_primary_user_before: "{{ jellyfin_primary_id_matches[0] }}"
    jellyfin_primary_rename_required: >-
      {{ jellyfin_primary_id_matches[0].Name != jellyfin_admin_username }}
    jellyfin_primary_temporary_recovery: >-
      {{ jellyfin_primary_id_matches[0].Name == jellyfin_primary_temporary_name }}
    jellyfin_primary_recovery_name: >-
      {{ jellyfin_primary_recovery_state.original_name
         if jellyfin_primary_recovery_state | length > 0
         else jellyfin_primary_id_matches[0].Name }}
  when: not ansible_check_mode or jellyfin_wizard_completed | bool
  no_log: true

- name: Read Jellyfin server configuration for preflight
  ansible.builtin.uri:
    url: "{{ jellyfin_api }}/System/Configuration"
    headers:
      Authorization: '{{ jellyfin_client_header }}, Token="{{ jellyfin_reconcile_token }}"'
    status_code: [200]
    return_content: true
  register: jellyfin_server_configuration_before
  when: not ansible_check_mode or jellyfin_wizard_completed | bool
  changed_when: false
  check_mode: false
  no_log: true

# Deliberately not redacted. Unlooped, so the result dict adds only the source text of
# the failing condition, and the three conditions read the server-configuration document
# Jellyfin returned, reaching one field, ServerName. The registered response above stays
# redacted because it was fetched with the reconcile token. "Incomplete" covered three
# faults that need different responses: Jellyfin answered with something that is not a
# document at all, answered without a ServerName, or answered with a ServerName that is
# not a string.
- name: Require complete Jellyfin server configuration
  ansible.builtin.assert:
    that:
      - jellyfin_server_configuration_before.json is mapping
      - jellyfin_server_configuration_before.json.ServerName is defined
      - jellyfin_server_configuration_before.json.ServerName is string
    fail_msg: Jellyfin returned an incomplete server configuration; no owned state was changed.
  when: not ansible_check_mode or jellyfin_wizard_completed | bool

- name: Resolve Jellyfin server name repair requirement
  ansible.builtin.set_fact:
    jellyfin_server_name_update_required: >-
      {{ jellyfin_server_configuration_before.json.ServerName != jellyfin_server_name }}
  when: not ansible_check_mode or jellyfin_wizard_completed | bool

- name: List Jellyfin libraries for preflight
  ansible.builtin.uri:
    url: "{{ jellyfin_api }}/Library/VirtualFolders"
    headers:
      Authorization: '{{ jellyfin_client_header }}, Token="{{ jellyfin_reconcile_token }}"'
    status_code: [200]
    return_content: true
  register: jellyfin_libraries_before
  when: not ansible_check_mode or jellyfin_wizard_completed | bool
  changed_when: false
  check_mode: false
  no_log: true

- name: Validate and resolve Jellyfin managed library inventory
  ansible.builtin.include_tasks: library_inventory.yml
  vars:
    jellyfin_library_inventory_response: "{{ jellyfin_libraries_before.json }}"
  when: not ansible_check_mode or jellyfin_wizard_completed | bool

- name: Inspect the approved Jellyfin administrator image
  ansible.builtin.stat:
    path: "{{ jellyfin_admin_avatar_source }}"
    checksum_algorithm: sha256
  register: jellyfin_admin_avatar_source_state
  delegate_to: localhost
  changed_when: false
  check_mode: false

- name: Require the approved Jellyfin administrator image
  ansible.builtin.assert:
    that:
      - jellyfin_admin_avatar_source_state.stat.exists
      - jellyfin_admin_avatar_source_state.stat.isreg
      - not jellyfin_admin_avatar_source_state.stat.islnk
      - jellyfin_admin_avatar_source_state.stat.size | int > 0
      - jellyfin_admin_avatar_source_state.stat.checksum == jellyfin_admin_avatar_sha256
    fail_msg: The approved Jellyfin administrator image is absent, unsafe, or has unexpected bytes.

- name: Remove stale Jellyfin administrator image probe
  ansible.builtin.file:
    path: "{{ jellyfin_admin_avatar_probe }}"
    state: absent
  when: not ansible_check_mode
  changed_when: false

- name: Read the current Jellyfin primary administrator image
  ansible.builtin.uri:
    url: >-
      {{ jellyfin_api ~ '/UserImage?userId=' ~
         (jellyfin_primary_authenticated_id | urlencode) ~ '&tag=' ~
         (jellyfin_primary_user_before.PrimaryImageTag | default('') | urlencode) ~
         '&format=original' }}
    headers:
      Authorization: '{{ jellyfin_client_header }}, Token="{{ jellyfin_reconcile_token }}"'
    dest: "{{ jellyfin_admin_avatar_probe }}"
    status_code: [200, 404]
  register: jellyfin_admin_avatar_before
  when:
    - not ansible_check_mode
    - jellyfin_primary_user_before.PrimaryImageTag | default('') | length > 0
  changed_when: false
  no_log: true

- name: Inspect the current Jellyfin primary administrator image bytes
  ansible.builtin.stat:
    path: "{{ jellyfin_admin_avatar_probe }}"
    checksum_algorithm: sha256
  register: jellyfin_admin_avatar_before_state
  when:
    - not ansible_check_mode
    - jellyfin_admin_avatar_before.status | default(404) | int == 200
  changed_when: false

# Comparing the published bytes means downloading them into the probe file, and
# a check-mode review must write nothing. What check mode can still decide is
# the case it reads for free: a primary administrator carrying no image tag at
# all has no image, so that repair is reported. A byte difference hiding behind
# an existing tag stays unknown and is treated as "no upload required" —
# assuming an upload instead would make every review of a converged NAS report a
# change it never proved, which is noise that hides real drift rather than
# revealing it. The debug below discloses that the comparison was deferred.
- name: Resolve Jellyfin primary administrator image repair requirement
  ansible.builtin.set_fact:
    jellyfin_admin_avatar_upload_required: >-
      {{ jellyfin_primary_user_before.PrimaryImageTag | default('') | length == 0 or
         (not ansible_check_mode and
          (jellyfin_admin_avatar_before.status | default(404) | int != 200 or
           jellyfin_admin_avatar_before_state.stat.checksum |
             default('') != jellyfin_admin_avatar_sha256)) }}
  when: not ansible_check_mode or jellyfin_wizard_completed | bool
  no_log: true

- name: Report deferred Jellyfin administrator image comparison in check mode
  ansible.builtin.debug:
    msg: >-
      The published Jellyfin administrator image is compared by downloading it,
      which check mode will not do; an image that differs from the approved
      bytes behind the existing image tag is repaired during a normal
      convergence.
  when:
    - ansible_check_mode
    - jellyfin_wizard_completed | bool
    - jellyfin_primary_user_before.PrimaryImageTag | default('') | length > 0
  changed_when: false

- name: Remove the Jellyfin administrator image preflight probe
  ansible.builtin.file:
    path: "{{ jellyfin_admin_avatar_probe }}"
    state: absent
  when: not ansible_check_mode
  changed_when: false

- name: Prepare Jellyfin plugin repositories and package catalog
  ansible.builtin.include_tasks: settings.yml
  vars:
    jellyfin_settings_phase: prepare
    jellyfin_settings_token: "{{ jellyfin_reconcile_token }}"
  when: not ansible_check_mode

- name: Activate and validate the Open Subtitles plugin when immediately available
  ansible.builtin.include_tasks: settings.yml
  vars:
    jellyfin_settings_phase: activate
    jellyfin_activation_scope: opensubtitles
    jellyfin_settings_token: "{{ jellyfin_reconcile_token }}"
  when: not ansible_check_mode

- name: Activate remaining required Jellyfin plugins
  ansible.builtin.include_tasks: settings.yml
  vars:
    jellyfin_settings_phase: activate
    jellyfin_activation_scope: remaining
    jellyfin_settings_token: "{{ jellyfin_reconcile_token }}"
  when: not ansible_check_mode

- name: Finalize required Jellyfin plugin activation through one restart barrier
  ansible.builtin.include_tasks: settings.yml
  vars:
    jellyfin_settings_phase: finalize
    jellyfin_settings_token: "{{ jellyfin_reconcile_token }}"
  when: not ansible_check_mode

- name: Reconcile Jellyfin acceleration and plugins
  ansible.builtin.include_tasks: settings.yml
  vars:
    jellyfin_settings_phase: reconcile
    jellyfin_settings_token: "{{ jellyfin_reconcile_token }}"

- name: Report planned Jellyfin primary administrator rename
  ansible.builtin.debug:
    msg: JELLYFIN_PLAN_ADMIN_RENAME
  when:
    - ansible_check_mode
    - jellyfin_primary_rename_required | default(false) | bool
  changed_when: true

# Pinned 10.11.11 rejects a direct case-only rename. The helper uses the
# authenticated stable ID, a deterministic collision-checked temporary name,
# and block/rescue read-back so an interrupted hop is safely rerunnable.
- name: Reconcile Jellyfin primary administrator identity
  ansible.builtin.include_tasks: primary_identity.yml
  when: not ansible_check_mode

- name: Report planned Jellyfin server name update
  ansible.builtin.debug:
    msg: JELLYFIN_PLAN_SERVER_NAME
  when:
    - ansible_check_mode
    - jellyfin_server_name_update_required | default(false) | bool
  changed_when: true

- name: Refresh Jellyfin server configuration before name update
  ansible.builtin.uri:
    url: "{{ jellyfin_api }}/System/Configuration"
    headers:
      Authorization: '{{ jellyfin_client_header }}, Token="{{ jellyfin_reconcile_token }}"'
    status_code: [200]
    return_content: true
  register: jellyfin_server_configuration_for_update
  when:
    - not ansible_check_mode
    - jellyfin_server_name_update_required | default(false) | bool
  changed_when: false
  check_mode: false
  no_log: true

# Deliberately not redacted, for the same reasons as the preflight read of the same
# document above. This one guards the write: it runs immediately before the server name
# is POSTed back, so knowing which of the three shape checks failed is what distinguishes
# a Jellyfin that lost the document from one that changed the field's type.
- name: Require complete refreshed Jellyfin server configuration
  ansible.builtin.assert:
    that:
      - jellyfin_server_configuration_for_update.json is mapping
      - jellyfin_server_configuration_for_update.json.ServerName is defined
      - jellyfin_server_configuration_for_update.json.ServerName is string
    fail_msg: >-
      Jellyfin returned an incomplete refreshed server configuration; the server
      name was not changed.
  when:
    - not ansible_check_mode
    - jellyfin_server_name_update_required | default(false) | bool

- name: Update the Jellyfin server name
  ansible.builtin.uri:
    url: "{{ jellyfin_api }}/System/Configuration"
    method: POST
    headers:
      Authorization: '{{ jellyfin_client_header }}, Token="{{ jellyfin_reconcile_token }}"'
    body_format: json
    body: >-
      {{ jellyfin_server_configuration_for_update.json |
         combine({'ServerName': jellyfin_server_name}) }}
    status_code: [204]
  when:
    - not ansible_check_mode
    - jellyfin_server_name_update_required | default(false) | bool
  changed_when: true
  no_log: true

- name: Report planned Jellyfin primary administrator image upload
  ansible.builtin.debug:
    msg: JELLYFIN_PLAN_ADMIN_IMAGE
  when:
    - ansible_check_mode
    - jellyfin_admin_avatar_upload_required | default(false) | bool
  changed_when: true

- name: Stage the approved Jellyfin primary administrator image
  ansible.builtin.copy:
    src: yonatan-avatar.jpeg
    dest: "{{ jellyfin_admin_avatar_remote }}"
    mode: "0600"
  when:
    - not ansible_check_mode
    - jellyfin_admin_avatar_upload_required | default(false) | bool
  no_log: true

- name: Read the staged Jellyfin primary administrator image
  ansible.builtin.slurp:
    src: "{{ jellyfin_admin_avatar_remote }}"
  register: jellyfin_admin_avatar_staged
  when:
    - not ansible_check_mode
    - jellyfin_admin_avatar_upload_required | default(false) | bool
  changed_when: false
  no_log: true

- name: Upload the Jellyfin primary administrator image
  ansible.builtin.uri:
    url: "{{ jellyfin_api }}/UserImage?userId={{ jellyfin_primary_authenticated_id | urlencode }}"
    method: POST
    headers:
      Authorization: '{{ jellyfin_client_header }}, Token="{{ jellyfin_reconcile_token }}"'
      Content-Type: image/jpeg
    body: "{{ jellyfin_admin_avatar_staged.content }}"
    status_code: [204]
  when:
    - not ansible_check_mode
    - jellyfin_admin_avatar_upload_required | default(false) | bool
  changed_when: true
  no_log: true

- name: Report planned Jellyfin managed library renames
  ansible.builtin.debug:
    msg: "JELLYFIN_PLAN_LIBRARY_RENAME {{ item.desired.name }}"
  loop: "{{ jellyfin_library_targets | default([]) }}"
  loop_control:
    label: "{{ item.desired.name }}"
  when:
    - ansible_check_mode
    - item.path_matches | length == 1
    - item.path_matches[0].raw.Name != item.desired.name
  changed_when: true

- name: Rename adopted Jellyfin managed libraries
  ansible.builtin.uri:
    url: >-
      {{ jellyfin_api ~ '/Library/VirtualFolders/Name?name=' ~
         (item.path_matches[0].raw.Name | urlencode) ~ '&newName=' ~
         (item.desired.name | urlencode) ~ '&refreshLibrary=true' }}
    method: POST
    headers:
      Authorization: '{{ jellyfin_client_header }}, Token="{{ jellyfin_reconcile_token }}"'
    status_code: [204]
  loop: "{{ jellyfin_library_targets | default([]) }}"
  loop_control:
    label: "{{ item.desired.name }}"
  when:
    - not ansible_check_mode
    - item.path_matches | length == 1
    - item.path_matches[0].raw.Name != item.desired.name
  register: jellyfin_library_renames
  changed_when: true
  no_log: true

# Jellyfin 10.11 can return from a virtual-folder rename before the replacement
# CollectionFolder (and its path-derived ItemId) is visible. Do not carry the
# pre-rename identity into an ItemId-scoped mutation.
- name: Wait for renamed Jellyfin managed library identities
  ansible.builtin.uri:
    url: "{{ jellyfin_api }}/Library/VirtualFolders"
    headers:
      Authorization: '{{ jellyfin_client_header }}, Token="{{ jellyfin_reconcile_token }}"'
    status_code: [200]
    return_content: true
    timeout: 5
  loop: "{{ jellyfin_library_targets | default([]) }}"
  loop_control:
    label: "{{ item.desired.name }}"
  when:
    - not ansible_check_mode
    - item.path_matches | length == 1
    - item.path_matches[0].raw.Name != item.desired.name
  register: jellyfin_library_identity_observations
  until:
    - jellyfin_library_identity_observation.json | default(none) | type_debug == 'list'
    - jellyfin_library_identity_inventory_globally_settled | bool
    - jellyfin_library_identity_name_matches | length == 1
    - jellyfin_library_identity_match.Name | default(none) is string
    - jellyfin_library_identity_match.Name == item.desired.name
    - jellyfin_library_identity_match.CollectionType | default(none) is string
    - jellyfin_library_identity_match.CollectionType == item.desired.collection_type
    - >-
      jellyfin_library_identity_match.ItemId | default('') | string
      is match('^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$')
    - jellyfin_library_identity_match.Locations | default(none) | type_debug == 'list'
    - >-
      jellyfin_library_identity_match.Locations | select('string') | list | length ==
      jellyfin_library_identity_match.Locations | length
    - jellyfin_library_identity_match.LibraryOptions | default(none) is mapping
    - >-
      jellyfin_library_identity_match.LibraryOptions.PathInfos |
      default(none) | type_debug == 'list'
    - item.normalized_path in jellyfin_library_identity_normalized_paths
  retries: "{{ jellyfin_library_identity_retries }}"
  delay: "{{ jellyfin_library_identity_delay }}"
  vars:
    jellyfin_library_identity_observation: "{{ jellyfin_library_identity_observations }}"
    jellyfin_library_identity_folders: >-
      {{ jellyfin_library_identity_observation.json
         if jellyfin_library_identity_observation.json | default(none) |
           type_debug == 'list' else [] }}
    jellyfin_library_identity_folder_count: "{{ jellyfin_library_identity_folders | length }}"
    jellyfin_library_identity_inventory_globally_settled: >-
      {{
        jellyfin_library_identity_folders | select('mapping') | list | length ==
          jellyfin_library_identity_folder_count | int and
        jellyfin_library_identity_folders | selectattr('Name', 'defined') | list | length ==
          jellyfin_library_identity_folder_count | int and
        jellyfin_library_identity_folders | map(attribute='Name') |
          select('string') | list | length == jellyfin_library_identity_folder_count | int and
        jellyfin_library_identity_folders | selectattr('ItemId', 'defined') | list | length ==
          jellyfin_library_identity_folder_count | int and
        jellyfin_library_identity_folders | map(attribute='ItemId') |
          select('string') |
          select('match', '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$') | list | length ==
          jellyfin_library_identity_folder_count | int and
        jellyfin_library_identity_folders | selectattr('CollectionType', 'defined') |
          list | length == jellyfin_library_identity_folder_count | int and
        jellyfin_library_identity_folders | map(attribute='CollectionType') |
          select('string') | list | length == jellyfin_library_identity_folder_count | int and
        jellyfin_library_identity_folders | selectattr('Locations', 'defined') | list | length ==
          jellyfin_library_identity_folder_count | int and
        jellyfin_library_identity_folders | map(attribute='Locations') | map('type_debug') |
          select('equalto', 'list') | list | length == jellyfin_library_identity_folder_count | int and
        jellyfin_library_identity_folders | map(attribute='Locations') | flatten |
          select('string') | list | length ==
          jellyfin_library_identity_folders | map(attribute='Locations') | flatten | list | length and
        jellyfin_library_identity_folders | selectattr('LibraryOptions', 'defined') |
          list | length == jellyfin_library_identity_folder_count | int and
        jellyfin_library_identity_folders | map(attribute='LibraryOptions') |
          select('mapping') | list | length == jellyfin_library_identity_folder_count | int and
        jellyfin_library_identity_folders |
          selectattr('LibraryOptions.PathInfos', 'defined') | list | length ==
          jellyfin_library_identity_folder_count | int and
        jellyfin_library_identity_folders | map(attribute='LibraryOptions.PathInfos') |
          map('type_debug') | select('equalto', 'list') | list | length ==
          jellyfin_library_identity_folder_count | int and
        jellyfin_library_identity_folders | map(attribute='LibraryOptions.PathInfos') | flatten |
          select('mapping') | list | length ==
          jellyfin_library_identity_folders | map(attribute='LibraryOptions.PathInfos') |
            flatten | list | length and
        jellyfin_library_identity_folders | map(attribute='LibraryOptions.PathInfos') | flatten |
          selectattr('Path', 'defined') | list | length ==
          jellyfin_library_identity_folders | map(attribute='LibraryOptions.PathInfos') |
            flatten | list | length and
        jellyfin_library_identity_folders | map(attribute='LibraryOptions.PathInfos') | flatten |
          map(attribute='Path') | select('string') | list | length ==
          jellyfin_library_identity_folders | map(attribute='LibraryOptions.PathInfos') |
            flatten | list | length
      }}
    jellyfin_library_identity_name_matches: >-
      {{ jellyfin_library_identity_observation.json | default([]) |
         select('mapping') | selectattr('Name', 'defined') |
         selectattr('Name', 'equalto', item.desired.name) | list }}
    jellyfin_library_identity_match: >-
      {{ jellyfin_library_identity_name_matches | first | default({}) }}
    jellyfin_library_identity_normalized_paths: >-
      {{ (((jellyfin_library_identity_match.Locations
            if jellyfin_library_identity_match.Locations | default(none) |
              type_debug == 'list' else []) | select('string') | list) +
          ((jellyfin_library_identity_match.LibraryOptions.PathInfos
            if jellyfin_library_identity_match.LibraryOptions | default(none) is mapping and
               jellyfin_library_identity_match.LibraryOptions.PathInfos |
                 default(none) | type_debug == 'list' else []) |
           select('mapping') | selectattr('Path', 'defined') |
           map(attribute='Path') | select('string') | list)) |
         map('regex_replace', '/+$', '') | list }}
  changed_when: false
  check_mode: false
  no_log: true

- name: Revalidate complete Jellyfin library inventory after renames
  ansible.builtin.include_tasks: library_inventory.yml
  vars:
    jellyfin_library_inventory_response: >-
      {{ jellyfin_library_identity_observations.results |
         selectattr('json', 'defined') | map(attribute='json') | last }}
  when:
    - not ansible_check_mode
    - jellyfin_library_renames is changed

- name: Report planned Jellyfin managed library creation
  ansible.builtin.debug:
    msg: "JELLYFIN_PLAN_LIBRARY_CREATE {{ item.desired.name }}"
  loop: "{{ jellyfin_library_targets | default([]) }}"
  loop_control:
    label: "{{ item.desired.name }}"
  when:
    - ansible_check_mode
    - item.path_matches | length == 0
  changed_when: true

- name: Create absent Jellyfin managed libraries
  ansible.builtin.uri:
    url: >-
      {{ jellyfin_api ~ '/Library/VirtualFolders?name=' ~
         (item.desired.name | urlencode) ~ '&collectionType=' ~
         (item.desired.collection_type | urlencode) ~ '&refreshLibrary=false' }}
    method: POST
    headers:
      Authorization: '{{ jellyfin_client_header }}, Token="{{ jellyfin_reconcile_token }}"'
    body_format: json
    body:
      LibraryOptions: >-
        {{ jellyfin_library_options |
           combine({'PathInfos': [{'Path': item.desired.path}]}) }}
    status_code: [204]
  loop: "{{ jellyfin_library_targets | default([]) }}"
  loop_control:
    label: "{{ item.desired.name }}"
  when:
    - not ansible_check_mode
    - item.path_matches | length == 0
  register: jellyfin_library_creations
  changed_when: true
  no_log: true

- name: Report planned Jellyfin managed library option repairs
  ansible.builtin.debug:
    msg: "JELLYFIN_PLAN_LIBRARY_OPTIONS {{ item.desired.name }}"
  loop: "{{ jellyfin_library_targets | default([]) }}"
  loop_control:
    label: "{{ item.desired.name }}"
  when:
    - ansible_check_mode
    - item.path_matches | length == 1
    - >-
      item.path_matches[0].raw.Locations != [item.desired.path] or
      item.path_matches[0].raw.LibraryOptions.PathInfos |
        map(attribute='Path') | list != [item.desired.path] or
      (item.path_matches[0].raw.LibraryOptions | dict2items |
       selectattr('key', 'in', jellyfin_library_options.keys()) |
       items2dict) != jellyfin_library_options
  changed_when: true

- name: Report planned Jellyfin managed library extra-path removals
  ansible.builtin.debug:
    msg: "JELLYFIN_PLAN_LIBRARY_REMOVE_EXTRA_PATH {{ item.0.desired.name }}"
  loop: >-
    {{ jellyfin_library_targets | default([]) |
       subelements('extra_paths', skip_missing=True) }}
  loop_control:
    label: "{{ item.0.desired.name }} extra-path"
  when: ansible_check_mode
  changed_when: true

- name: Remove extra paths from Jellyfin managed libraries
  ansible.builtin.uri:
    url: >-
      {{ jellyfin_api ~ '/Library/VirtualFolders/Paths?name=' ~
         (item.0.desired.name | urlencode) ~ '&path=' ~
         (item.1 | urlencode) ~ '&refreshLibrary=false' }}
    method: DELETE
    headers:
      Authorization: '{{ jellyfin_client_header }}, Token="{{ jellyfin_reconcile_token }}"'
    status_code: [204]
  loop: >-
    {{ jellyfin_library_targets | default([]) |
       subelements('extra_paths', skip_missing=True) }}
  loop_control:
    label: "{{ item.0.desired.name }} extra-path"
  when: not ansible_check_mode
  register: jellyfin_library_extra_path_removals
  changed_when: true
  no_log: true

- name: Repair Jellyfin managed library options
  ansible.builtin.uri:
    url: "{{ jellyfin_api }}/Library/VirtualFolders/LibraryOptions"
    method: POST
    headers:
      Authorization: '{{ jellyfin_client_header }}, Token="{{ jellyfin_reconcile_token }}"'
    body_format: json
    body:
      Id: "{{ item.path_matches[0].raw.ItemId }}"
      LibraryOptions: >-
        {{ item.path_matches[0].raw.LibraryOptions |
           combine(jellyfin_library_options) |
           combine({'PathInfos': [{'Path': item.desired.path}]}) }}
    status_code: [204]
  loop: "{{ jellyfin_library_targets | default([]) }}"
  loop_control:
    label: "{{ item.desired.name }}"
  when:
    - not ansible_check_mode
    - item.path_matches | length == 1
    - >-
      item.path_matches[0].raw.Locations != [item.desired.path] or
      item.path_matches[0].raw.LibraryOptions.PathInfos |
        map(attribute='Path') | list != [item.desired.path] or
      (item.path_matches[0].raw.LibraryOptions | dict2items |
       selectattr('key', 'in', jellyfin_library_options.keys()) |
       items2dict) != jellyfin_library_options
  register: jellyfin_library_option_repairs
  changed_when: true
  no_log: true

- name: Refresh Jellyfin after managed library changes
  ansible.builtin.uri:
    url: "{{ jellyfin_api }}/Library/Refresh"
    method: POST
    headers:
      Authorization: '{{ jellyfin_client_header }}, Token="{{ jellyfin_reconcile_token }}"'
    status_code: [204]
  when:
    - not ansible_check_mode
    - >-
      jellyfin_library_renames is changed or
      jellyfin_library_creations is changed or
      jellyfin_library_extra_path_removals is changed or
      jellyfin_library_option_repairs is changed
  changed_when: true
  no_log: true

- name: Reconcile managed Jellyfin users
  ansible.builtin.include_tasks: managed_users.yml
  vars:
    jellyfin_managed_users_phase: reconcile
    jellyfin_managed_users_token: "{{ jellyfin_reconcile_token }}"
  when: not ansible_check_mode

- name: Prove Jellyfin QSV during exact verification
  tags: [platform_verify_jellyfin]
  ansible.builtin.include_tasks:
    file: qsv_probe.yml
    apply:
      tags: [platform_verify_jellyfin]
  when:
    - platform_kind == 'nas'
    - >-
      not ((platform_compose_kind | default('') == 'integration') and
           (deployment_bundle_test_mode | default(false) | bool))

- name: Authenticate to Jellyfin for exact verification
  tags: [platform_verify_jellyfin]
  ansible.builtin.uri:
    url: "{{ jellyfin_api }}/Users/AuthenticateByName"
    method: POST
    headers:
      Authorization: "{{ jellyfin_client_header }}"
    body_format: json
    body:
      Username: "{{ jellyfin_admin_username }}"
      Pw: "{{ vault_jellyfin_admin_password }}"
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: jellyfin_verify_login
  when: not ansible_check_mode
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

- name: Require the Jellyfin primary administrator during exact verification
  tags: [platform_verify_jellyfin]
  ansible.builtin.assert:
    that:
      - jellyfin_verify_login.status | default(0) | int == 200
      - jellyfin_verify_login.json.User.Name == jellyfin_admin_username
      - jellyfin_verify_login.json.User.Policy.IsAdministrator | bool
      - jellyfin_verify_login.json.User.PrimaryImageTag | default('') | length > 0
      - >-
        jellyfin_primary_authenticated_id is not defined or
        jellyfin_verify_login.json.User.Id | string == jellyfin_primary_authenticated_id
    fail_msg: The Jellyfin primary administrator is absent, drifted, or has no image.
  when: not ansible_check_mode

- name: Resolve the Jellyfin verification token
  tags: [platform_verify_jellyfin]
  ansible.builtin.set_fact:
    jellyfin_verification_token: >-
      {{ jellyfin_verify_login.json.AccessToken }}
    jellyfin_verified_primary_user: "{{ jellyfin_verify_login.json.User }}"
  when: not ansible_check_mode
  no_log: true

- name: Verify Jellyfin acceleration and plugins
  tags: [platform_verify_jellyfin]
  ansible.builtin.include_tasks:
    file: settings.yml
    apply:
      tags: [platform_verify_jellyfin]
  vars:
    jellyfin_settings_phase: verify
    jellyfin_settings_token: "{{ jellyfin_verification_token }}"
  when: not ansible_check_mode

- name: Verify managed Jellyfin users
  tags: [platform_verify_jellyfin]
  ansible.builtin.include_tasks:
    file: managed_users.yml
    apply:
      tags: [platform_verify_jellyfin]
  vars:
    jellyfin_managed_users_phase: verify
    jellyfin_managed_users_token: "{{ jellyfin_verification_token }}"
  when: not ansible_check_mode

- name: Read exact Jellyfin users
  tags: [platform_verify_jellyfin]
  ansible.builtin.uri:
    url: "{{ jellyfin_api }}/Users"
    headers:
      Authorization: '{{ jellyfin_client_header }}, Token="{{ jellyfin_verification_token }}"'
    status_code: [200]
    return_content: true
  register: jellyfin_verified_users
  when: not ansible_check_mode
  changed_when: false
  check_mode: false
  no_log: true

- name: Read exact Jellyfin server configuration
  tags: [platform_verify_jellyfin]
  ansible.builtin.uri:
    url: "{{ jellyfin_api }}/System/Configuration"
    headers:
      Authorization: '{{ jellyfin_client_header }}, Token="{{ jellyfin_verification_token }}"'
    status_code: [200]
    return_content: true
  register: jellyfin_verified_server_configuration
  when: not ansible_check_mode
  changed_when: false
  check_mode: false
  no_log: true

- name: Read exact Jellyfin libraries
  tags: [platform_verify_jellyfin]
  ansible.builtin.uri:
    url: "{{ jellyfin_api }}/Library/VirtualFolders"
    headers:
      Authorization: '{{ jellyfin_client_header }}, Token="{{ jellyfin_verification_token }}"'
    status_code: [200]
    return_content: true
  register: jellyfin_verified_libraries
  when: not ansible_check_mode
  changed_when: false
  check_mode: false
  no_log: true

- name: Initialize exact Jellyfin library inventory
  tags: [platform_verify_jellyfin]
  ansible.builtin.set_fact:
    jellyfin_verified_library_inventory: []
  when: not ansible_check_mode

- name: Resolve exact Jellyfin library inventory
  tags: [platform_verify_jellyfin]
  ansible.builtin.set_fact:
    jellyfin_verified_library_inventory: >-
      {{ jellyfin_verified_library_inventory + [{
        'raw': item,
        'normalized_paths':
          ((((item.Locations
              if item.Locations | default(none) | type_debug == 'list' else []) |
             select('string') | map('regex_replace', '/+$', '') | list) +
            ((item.LibraryOptions.PathInfos
              if (item.LibraryOptions | default(none) is mapping and
                  item.LibraryOptions.PathInfos | default(none) | type_debug == 'list')
              else []) |
             select('mapping') | selectattr('Path', 'defined') |
             map(attribute='Path') | select('string') |
             map('regex_replace', '/+$', '') | list)) | unique)
      }] }}
  loop: "{{ jellyfin_verified_libraries.json }}"
  loop_control:
    label: jellyfin-library
  when: not ansible_check_mode
  no_log: true

- name: Remove stale exact Jellyfin administrator image probe
  tags: [platform_verify_jellyfin]
  ansible.builtin.file:
    path: "{{ jellyfin_admin_avatar_probe }}"
    state: absent
  when: not ansible_check_mode
  changed_when: false
  check_mode: false

- name: Read exact Jellyfin primary administrator image
  tags: [platform_verify_jellyfin]
  ansible.builtin.uri:
    url: >-
      {{ jellyfin_api ~ '/UserImage?userId=' ~
         (jellyfin_verified_primary_user.Id | string | urlencode) ~ '&tag=' ~
         (jellyfin_verified_primary_user.PrimaryImageTag | urlencode) ~ '&format=original' }}
    headers:
      Authorization: '{{ jellyfin_client_header }}, Token="{{ jellyfin_verification_token }}"'
    dest: "{{ jellyfin_admin_avatar_probe }}"
    status_code: [200]
  when: not ansible_check_mode
  changed_when: false
  check_mode: false
  no_log: true

- name: Inspect exact Jellyfin primary administrator image bytes
  tags: [platform_verify_jellyfin]
  ansible.builtin.stat:
    path: "{{ jellyfin_admin_avatar_probe }}"
    checksum_algorithm: sha256
  register: jellyfin_verified_admin_avatar_state
  when: not ansible_check_mode
  changed_when: false
  check_mode: false

- name: Verify exact Jellyfin owned state
  tags: [platform_verify_jellyfin]
  ansible.builtin.assert:
    that:
      - jellyfin_verified_users.json | type_debug == 'list'
      - jellyfin_verified_primary_id_matches | length == 1
      - jellyfin_verified_primary_normalized_matches | length == 1
      - jellyfin_verified_server_configuration.json.ServerName == jellyfin_server_name
      - jellyfin_verified_name_matches | length == 1
      - jellyfin_verified_path_matches | length == 1
      - jellyfin_verified_name_matches[0].raw.ItemId == jellyfin_verified_path_matches[0].raw.ItemId
      - >-
        jellyfin_preflight_target | length == 0 or
        jellyfin_preflight_target[0].path_matches | length == 0 or
        jellyfin_verified_path_matches[0].raw.ItemId ==
          jellyfin_preflight_target[0].path_matches[0].raw.ItemId
      - jellyfin_verified_path_matches[0].raw.CollectionType == item.collection_type
      - jellyfin_verified_path_matches[0].raw.Locations == [item.path]
      - >-
        jellyfin_verified_path_matches[0].raw.LibraryOptions.PathInfos |
        map(attribute='Path') | list == [item.path]
      - >-
        (jellyfin_verified_path_matches[0].raw.LibraryOptions | dict2items
         | selectattr('key', 'in', jellyfin_library_options.keys())
         | items2dict) == jellyfin_library_options
      - jellyfin_verified_admin_avatar_state.stat.checksum == jellyfin_admin_avatar_sha256
    fail_msg: The Jellyfin primary identity, branding, image, or managed library is drifted.
  loop: "{{ jellyfin_libraries }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    jellyfin_verified_primary_id_matches: >-
      {{ jellyfin_verified_users.json |
         selectattr('Id', 'equalto', jellyfin_verified_primary_user.Id) | list }}
    jellyfin_verified_primary_normalized_matches: >-
      {{ jellyfin_verified_users.json | selectattr('Name', 'defined') |
         selectattr('Name', 'equalto', jellyfin_admin_username) | list }}
    jellyfin_verified_name_matches: >-
      {{ jellyfin_verified_library_inventory |
         selectattr('raw.Name', 'equalto', item.name) | list }}
    jellyfin_verified_path_matches: >-
      {{ jellyfin_verified_library_inventory |
         selectattr('normalized_paths', 'contains', item.path | regex_replace('/+$', '')) | list }}
    jellyfin_preflight_target: >-
      {{ jellyfin_library_targets | default([]) |
         selectattr('desired.name', 'equalto', item.name) | list }}
  when: not ansible_check_mode

- name: Remove the exact Jellyfin administrator image probe
  tags: [platform_verify_jellyfin]
  ansible.builtin.file:
    path: "{{ jellyfin_admin_avatar_probe }}"
    state: absent
  when: not ansible_check_mode
  changed_when: false
  check_mode: false
