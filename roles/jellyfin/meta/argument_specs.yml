---
argument_specs:
  main:
    short_description: Deploy Jellyfin and converge its administrator and media library
    options:
      jellyfin_compose_wait_timeout:
        type: int
        required: false
      jellyfin_startup_retries:
        type: int
        required: false
      jellyfin_plugin_restart_retries:
        type: int
        required: false
      jellyfin_library_identity_retries:
        type: int
        required: false
      jellyfin_library_identity_delay:
        type: int
        required: false
      platform_compose_kind:
        type: str
        required: true
      platform_project_name:
        type: str
        required: false
      platform_media_control_network:
        type: str
        required: true
      jellyfin_port:
        type: int
        required: false
      jellyfin_admin_username:
        type: str
        required: false
      jellyfin_server_name:
        type: str
        required: false
      jellyfin_admin_avatar_sha256:
        type: str
        required: false
      jellyfin_libraries:
        type: list
        elements: dict
        required: false
      jellyfin_library_options:
        type: dict
        required: false
      # Keyed by Jellyfin's scheduled task Key, each value the exact trigger
      # list posted to /ScheduledTasks/{id}/Triggers and compared back. A dict
      # rather than a list because the key is the identity the role resolves
      # against the server's own task list.
      jellyfin_scheduled_task_triggers:
        type: dict
        required: false
      jellyfin_encoding_profiles:
        type: dict
        required: false
      jellyfin_plugin_repositories:
        type: list
        elements: dict
        required: false
      jellyfin_plugins:
        type: list
        elements: str
        required: false
      jellyfin_plugin_packages:
        type: list
        elements: dict
        required: false
      # Normalized by jellyfin_merged_repositories and compared against the
      # normalized URL of every repository Jellyfin reports, so a trailing slash
      # or an uppercase host here retires what it names (#648). A scalar is a
      # substring test rather than list membership, which the filter refuses and
      # this declaration stops one layer earlier.
      jellyfin_retired_plugin_repository_urls:
        type: list
        elements: str
        required: false
      # Selected out of jellyfin_encoding_profiles by platform_kind and posted
      # verbatim as Jellyfin's encoding configuration, so the suboptions are the
      # keys of a profile. An unlisted key here would be written to Jellyfin and
      # then compared back on every run.
      jellyfin_encoding_policy:
        type: dict
        required: false
        options:
          HardwareAccelerationType:
            type: str
            required: false
          # Empty on the Mac profile, so a string and not a path.
          QsvDevice:
            type: str
            required: false
          HardwareDecodingCodecs:
            type: list
            elements: str
            required: false
          EnableDecodingColorDepth10Hevc:
            type: bool
            required: false
          EnableDecodingColorDepth10Vp9:
            type: bool
            required: false
          EnableHardwareEncoding:
            type: bool
            required: false
          AllowHevcEncoding:
            type: bool
            required: false
          AllowAv1Encoding:
            type: bool
            required: false
          EnableIntelLowPowerH264HwEncoder:
            type: bool
            required: false
          EnableIntelLowPowerHevcHwEncoder:
            type: bool
            required: false
          EnableVppTonemapping:
            type: bool
            required: false
          EnableTonemapping:
            type: bool
            required: false
      jellyfin_opensubtitles_plugin_id:
        type: str
        required: false
      vault_jellyfin_admin_username:
        type: str
        required: true
      vault_jellyfin_admin_password:
        type: str
        required: true
      vault_jellyfin_opensubtitles_username:
        type: str
        required: true
      vault_jellyfin_opensubtitles_password:
        type: str
        required: true
      # The managed-user parameters this role hands roles/managed_users. Only
      # the ones that resolve at role entry are declared: Ansible templates
      # every declared option before the role's first task, so declaring
      # jellyfin_managed_users_create_body, _repair_body, _repair_condition,
      # _reconcile_path, _authenticate_body, _authenticate_identity or
      # _list_json -- each a template over the shared role's per-identity
      # `item`, its bound match or user, or the listing it registers -- would
      # fail this role at "Validating arguments against arg spec 'main'".
      # roles/managed_users asserts their presence instead.
      jellyfin_managed_users_identity_attribute:
        type: str
        required: false
      jellyfin_managed_users_listed_identity_attribute:
        type: str
        required: false
      jellyfin_managed_users_id_attribute:
        type: str
        required: false
      jellyfin_managed_users_id_pattern:
        type: str
        required: false
      jellyfin_managed_users_list_path:
        type: str
        required: false
      jellyfin_managed_users_authenticate_path:
        type: str
        required: false
      jellyfin_managed_users_create_path:
        type: str
        required: false
      jellyfin_managed_users_reconcile_interface:
        description: >-
          The interfaces.reconcile value config/managed-user-capabilities.yml
          declares for Jellyfin, asserted against the deployed register.
        type: str
        required: false
      jellyfin_managed_users_create_status:
        type: list
        elements: int
        required: false
      jellyfin_managed_users_repair_status:
        type: list
        elements: int
        required: false
      jellyfin_managed_users_forbidden_policy_fields:
        type: list
        elements: str
        required: false
      jellyfin_managed_users_before_create_tasks:
        type: str
        required: false
      jellyfin_managed_users_after_creation_tasks:
        type: str
        required: false
      jellyfin_managed_users_verify_conditions:
        description: >-
          Brace-free expressions the shared role's final verification asserts in
          order. Unbraced, so they are safe to declare here.
        type: list
        elements: str
        required: false
      jellyfin_managed_users_verify_fail_msg:
        type: str
        required: false
      jellyfin_managed_users_plan_create_message:
        type: str
        required: false
      jellyfin_managed_users_plan_repair_message:
        type: str
        required: false
