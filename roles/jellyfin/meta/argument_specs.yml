---
argument_specs:
  main:
    short_description: Deploy Jellyfin and converge its administrator and media library
    options:
      jellyfin_compose_wait_timeout:
        type: int
        required: false
      jellyfin_startup_retries:
        type: int
        required: false
      jellyfin_plugin_restart_retries:
        type: int
        required: false
      jellyfin_library_identity_retries:
        type: int
        required: false
      jellyfin_library_identity_delay:
        type: int
        required: false
      platform_compose_kind:
        type: str
        required: true
      platform_project_name:
        type: str
        required: false
      platform_media_control_network:
        type: str
        required: true
      jellyfin_port:
        type: int
        required: false
      jellyfin_admin_username:
        type: str
        required: false
      jellyfin_server_name:
        type: str
        required: false
      jellyfin_admin_avatar_sha256:
        type: str
        required: false
      jellyfin_libraries:
        type: list
        elements: dict
        required: false
      jellyfin_library_options:
        type: dict
        required: false
      # Keyed by Jellyfin's scheduled task Key, each value the exact trigger
      # list posted to /ScheduledTasks/{id}/Triggers and compared back. A dict
      # rather than a list because the key is the identity the role resolves
      # against the server's own task list.
      jellyfin_scheduled_task_triggers:
        type: dict
        required: false
      jellyfin_encoding_profiles:
        type: dict
        required: false
      jellyfin_plugin_repositories:
        type: list
        elements: dict
        required: false
      jellyfin_plugins:
        type: list
        elements: str
        required: false
      jellyfin_plugin_packages:
        type: list
        elements: dict
        required: false
      # Compared raw against the normalized URL of every repository Jellyfin
      # reports, by jellyfin_merged_repositories. A scalar here is a substring
      # test rather than list membership, which the filter now refuses and this
      # declaration stops one layer earlier.
      jellyfin_retired_plugin_repository_urls:
        type: list
        elements: str
        required: false
      # Selected out of jellyfin_encoding_profiles by platform_kind and posted
      # verbatim as Jellyfin's encoding configuration, so the suboptions are the
      # keys of a profile. An unlisted key here would be written to Jellyfin and
      # then compared back on every run.
      jellyfin_encoding_policy:
        type: dict
        required: false
        options:
          HardwareAccelerationType:
            type: str
            required: false
          # Empty on the Mac profile, so a string and not a path.
          QsvDevice:
            type: str
            required: false
          HardwareDecodingCodecs:
            type: list
            elements: str
            required: false
          EnableDecodingColorDepth10Hevc:
            type: bool
            required: false
          EnableDecodingColorDepth10Vp9:
            type: bool
            required: false
          EnableHardwareEncoding:
            type: bool
            required: false
          AllowHevcEncoding:
            type: bool
            required: false
          AllowAv1Encoding:
            type: bool
            required: false
          EnableIntelLowPowerH264HwEncoder:
            type: bool
            required: false
          EnableIntelLowPowerHevcHwEncoder:
            type: bool
            required: false
          EnableVppTonemapping:
            type: bool
            required: false
          EnableTonemapping:
            type: bool
            required: false
      jellyfin_opensubtitles_plugin_id:
        type: str
        required: false
      vault_jellyfin_admin_username:
        type: str
        required: true
      vault_jellyfin_admin_password:
        type: str
        required: true
      vault_jellyfin_opensubtitles_username:
        type: str
        required: true
      vault_jellyfin_opensubtitles_password:
        type: str
        required: true
