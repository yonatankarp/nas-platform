---
# The HTTP managed-user skeleton hoisted out of roles/komga (#647); nothing here
# names a service. managed_users_repair_condition is braced (no-jinja-when) and
# resolved to a fact; managed_users_verify_conditions stay brace-free so
# `assert` short-circuits. No fail_msg subscripts anything its task did not
# prove present: fail_msg is rendered on the passing path too.
- name: Validate the managed-user phase
  ansible.builtin.assert:
    that:
      - managed_users_phase in ['preflight', 'reconcile', 'verify']
    fail_msg: >-
      Managed-user reconciliation was included with a phase it does not
      implement. The tasks in this file are gated on managed_users_phase, so an
      unrecognised phase silently skips them.

# These parameters template over `item` or managed_users_match, so the argument
# spec cannot declare them; q('varnames') checks presence without resolving
# them, which `is defined` cannot.
- name: Require every deferred managed-user parameter
  ansible.builtin.assert:
    that:
      - >-
        managed_users_required_parameters
        | difference(managed_users_supplied_parameters) | length == 0
    fail_msg: >-
      A caller of roles/managed_users did not supply
      {{ managed_users_required_parameters |
         difference(managed_users_supplied_parameters) | join(', ') }}.
      meta/argument_specs.yml cannot declare these, so their absence is caught
      here rather than by Ansible.
  vars:
    # managed_users_authenticate_body is absent because this role defaults it.
    managed_users_deferred_parameters:
      - managed_users_list_json
      - managed_users_authenticate_identity
      - managed_users_create_body
      - managed_users_reconcile_path
      - managed_users_repair_body
      - managed_users_repair_condition
    # Needed only by a caller that binds authenticated identities.
    managed_users_required_parameters: >-
      {{ managed_users_deferred_parameters +
         (['managed_users_authenticated_id']
          if managed_users_bind_authenticated_ids | bool else []) }}
    managed_users_supplied_parameters: >-
      {{ q('varnames', '^' ~ (managed_users_required_parameters | join('$|^')) ~ '$') }}

# Reset, not defaulted: reconcile then verify call this role twice in one play.
# managed_users_initial_authenticated_ids is kept on purpose for verify to
# compare.
- name: Reset resolved managed-user decisions
  ansible.builtin.set_fact:
    managed_users_matches: {}
    managed_users_repairs: {}
    managed_users_authenticated_ids: {}

# This role implements only the HTTP-API shape of the register; reading the row
# stops a differently shaped service being routed here. The register is
# plaintext, so nothing in this chain needs no_log.
- name: Stat the deployed managed-user capability register
  ansible.builtin.stat:
    path: "{{ managed_users_register_path }}"
  register: managed_users_register_stat
  changed_when: false
  check_mode: false

# Under --check `current` still names the previous release, which may predate
# the register, so report instead of refusing the review.
- name: Report a managed-user capability register the deployed release predates
  ansible.builtin.debug:
    msg: >-
      MANAGED_USERS_REGISTER_UNREVIEWABLE: {{ managed_users_register_path }} is
      absent, so the release currently deployed predates the managed-user
      capability register and this review cannot verify that
      {{ managed_users_service }} still honours the contract this role
      implements. Converging will deploy the register and the next review will
      check it.
  when:
    - ansible_check_mode
    - not managed_users_register_stat.stat.exists
  changed_when: false

- name: Require the deployed managed-user capability register
  ansible.builtin.assert:
    that:
      - managed_users_register_stat.stat.exists
    fail_msg: >-
      {{ managed_users_register_path }} is absent from the deployed release.
      This role reconciles identities only against a release that declares the
      managed-user contract it implements; deploy the release that carries
      config/managed-user-capabilities.yml before reconciling
      {{ managed_users_service }}.
  when: not ansible_check_mode

- name: Read the deployed managed-user capability register
  ansible.builtin.slurp:
    src: "{{ managed_users_register_path }}"
  register: managed_users_register_read
  changed_when: false
  check_mode: false
  when: managed_users_register_stat.stat.exists

# Split so the row-naming message only renders once the row is proved present.
- name: Require a managed-user capability register row for this service
  ansible.builtin.assert:
    that:
      - managed_users_service in (managed_users_register_document.services | default({}))
    fail_msg: >-
      The deployed managed-user capability register declares no row for
      {{ managed_users_service }}, so nothing states the contract this
      reconciliation would be honouring.
  vars:
    managed_users_register_document: >-
      {{ managed_users_register_read.content | b64decode | from_yaml }}
  when: managed_users_register_stat.stat.exists

- name: Require the managed-user capability register to authorise this reconciliation
  ansible.builtin.assert:
    that:
      - managed_users_register.mode == 'api'
      - managed_users_register.password_rotation == 'refuse'
      - managed_users_register.existing_identity_password_update == 'forbidden'
      - managed_users_register.interfaces.list == managed_users_list_path
      - managed_users_register.interfaces.create == managed_users_create_path
      - managed_users_register.interfaces.authenticate == managed_users_authenticate_path
      - managed_users_register.interfaces.reconcile == managed_users_reconcile_interface
    fail_msg: >-
      The deployed managed-user capability register does not authorise this
      reconciliation of {{ managed_users_service }}. This role implements one
      contract -- mode api, password_rotation refuse,
      existing_identity_password_update forbidden -- over the exact relative
      interfaces it was configured with: list {{ managed_users_list_path }},
      create {{ managed_users_create_path }}, authenticate
      {{ managed_users_authenticate_path }}, reconcile
      {{ managed_users_reconcile_interface }}. Reconcile the register and this
      role's parameters, or give the service a reconciliation of its own.
  vars:
    managed_users_register: >-
      {{ (managed_users_register_read.content | b64decode |
          from_yaml).services[managed_users_service] }}
  when: managed_users_register_stat.stat.exists

# Password updates are forbidden for every service, so the refusal reads the
# caller-supplied body's keys rather than trusting review.
- name: Refuse a managed-user repair body carrying a credential
  ansible.builtin.assert:
    that:
      - >-
        managed_users_repair_body.keys() | list |
        select('search', '(?i)password|passwd|secret|token') | list | length == 0
    fail_msg: >-
      The managed-user repair body configured for {{ managed_users_service }}
      carries a credential-shaped key. Repairing an existing identity must never
      update its password; the capability register declares that update
      forbidden.
  # Runs before the listing, so it binds no managed_users_match; the body's keys
  # are readable without one.
  loop: "{{ managed_users_declared }}"
  loop_control:
    label: "{{ managed_users_service }}-managed-user"
  no_log: true

- name: "List complete users for managed-user reconciliation: {{ managed_users_title }}"
  ansible.builtin.uri:
    url: "{{ managed_users_api }}/{{ managed_users_list_path }}"
    url_username: "{{ managed_users_admin_username }}"
    url_password: "{{ managed_users_admin_password }}"
    force_basic_auth: "{{ managed_users_admin_basic }}"
    headers: "{{ managed_users_admin_headers }}"
    status_code: [200]
    return_content: true
  register: managed_users_listing_response
  changed_when: false
  check_mode: false
  no_log: true

# Expressed against managed_users_listing so it covers the re-read listing too.
- name: "Resolve the complete managed-user listing: {{ managed_users_title }}"
  ansible.builtin.set_fact:
    managed_users_listing: "{{ managed_users_listing_response }}"
  no_log: true

- name: "Refuse incomplete managed-user listing: {{ managed_users_title }}"
  ansible.builtin.assert:
    that: "{{ managed_users_listing_conditions }}"
    fail_msg: >-
      {{ managed_users_title }} returned an unsupported or paginated users
      response; reconciliation is refusing a partial identity view.

- name: "Resolve normalized managed identities: {{ managed_users_title }}"
  ansible.builtin.set_fact:
    managed_users_matches: >-
      {{ managed_users_matches |
         combine(dict([(item[managed_users_identity_attribute],
           managed_users_identity_matches)])) }}
  vars:
    managed_users_matching_identity: "{{ item[managed_users_identity_attribute] }}"
  loop: "{{ managed_users_declared }}"
  loop_control:
    label: "{{ managed_users_service }}-managed-user"
  no_log: true

# The shared decision lives in filter_plugins/managed_user_identity.py; its
# errors never name an identity, so they are safe under no_log.
- name: "Refuse ambiguous normalized managed identities: {{ managed_users_title }}"
  ansible.builtin.assert:
    that:
      - >-
        managed_users_list_json | managed_user_ambiguity_errors(
          managed_users_listed_identity_attribute,
          item[managed_users_identity_attribute],
          managed_users_matches[item[managed_users_identity_attribute]]
        ) | length == 0
    fail_msg: >-
      {{ managed_users_title }} contains duplicate normalized managed
      identities; resolve the ambiguity manually before reconciliation:
      {{ managed_users_list_json | managed_user_ambiguity_errors(
           managed_users_listed_identity_attribute,
           item[managed_users_identity_attribute],
           managed_users_matches[item[managed_users_identity_attribute]]
         ) | join('; ') }}
  loop: "{{ managed_users_declared }}"
  loop_control:
    label: "{{ managed_users_service }}-managed-user"
  no_log: true

- name: "Require safe managed-user identifiers: {{ managed_users_title }}"
  ansible.builtin.assert:
    that:
      - >-
        managed_users_matches[item[managed_users_identity_attribute]] | length == 0 or
        managed_users_matches[item[managed_users_identity_attribute]][0][managed_users_id_attribute]
          | string is match(managed_users_id_pattern)
    fail_msg: >-
      {{ managed_users_title }} returned an unsafe managed-user API identifier.
  loop: "{{ managed_users_declared }}"
  loop_control:
    label: "{{ managed_users_service }}-managed-user"
  no_log: true

# item.password literally: a parameter would make the vault-password check a
# check on a name. Body-authenticating services (audiobookshelf) bind the same
# user as managed_users_authenticating_user; tests/media_probes_services.rb
# proves it.
- name: "Authenticate existing managed users: {{ managed_users_title }}"
  ansible.builtin.uri:
    url: "{{ managed_users_api }}/{{ managed_users_authenticate_path }}"
    method: "{{ managed_users_authenticate_method }}"
    url_username: >-
      {{ item[managed_users_identity_attribute] if managed_users_authenticate_basic else omit }}
    url_password: "{{ item.password if managed_users_authenticate_basic else omit }}"
    force_basic_auth: "{{ managed_users_authenticate_basic }}"
    headers: "{{ managed_users_authenticate_headers }}"
    body_format: "{{ managed_users_authenticate_body_format }}"
    body: "{{ managed_users_authenticate_body }}"
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  vars:
    managed_users_authenticating_user: "{{ item }}"
  register: managed_users_authentication
  # Bound services re-prove credentials in verify; preflight stops before
  # creation.
  when:
    - managed_users_phase in ['preflight', 'reconcile'] or managed_users_bind_authenticated_ids | bool
    - not ansible_check_mode
    - managed_users_matches[item[managed_users_identity_attribute]] | length == 1
  loop: "{{ managed_users_declared }}"
  loop_control:
    label: "{{ managed_users_service }}-managed-user"
  failed_when: false
  changed_when: false
  no_log: true

- name: "Require preserved managed-user credentials: {{ managed_users_title }}"
  ansible.builtin.assert:
    that:
      - item.status | default(0) | int == managed_users_authenticate_status | int
      - >-
        managed_users_authenticate_identity ==
        item.item[managed_users_identity_attribute] or
        (managed_users_authenticate_identity_normalized | bool and
         managed_users_authenticate_identity | trim | lower ==
         item.item[managed_users_identity_attribute] | trim | lower)
      - >-
        not managed_users_bind_authenticated_ids | bool or
        managed_users_authenticated_id ==
        managed_users_matches[item.item[managed_users_identity_attribute]][0][managed_users_id_attribute]
    fail_msg: >-
      Existing {{ managed_users_title }} managed user does not accept its
      preserved vault password. Run the reviewed credential-migration procedure;
      Ansible will not reset it automatically.
  loop: >-
    {{ managed_users_authentication.results | default([]) |
       rejectattr('skipped', 'defined') | list }}
  loop_control:
    label: "{{ managed_users_service }}-managed-user"
  when:
    - managed_users_phase in ['preflight', 'reconcile'] or managed_users_bind_authenticated_ids | bool
    - not ansible_check_mode
  no_log: true

# Written only after the assert above; the initial map keeps the first id this
# play proved.
- name: "Bind authenticated existing managed-user identifiers: {{ managed_users_title }}"
  ansible.builtin.set_fact:
    managed_users_initial_authenticated_ids: >-
      {{ managed_users_initial_authenticated_ids | default({}) | combine({
           managed_users_service: {
             managed_users_bound_identity:
               (managed_users_initial_authenticated_ids | default({})).get(
                 managed_users_service, {}
               ).get(managed_users_bound_identity, managed_users_authenticated_id)
           }}, recursive=true) }}
    managed_users_authenticated_ids: >-
      {{ managed_users_authenticated_ids |
         combine({managed_users_bound_identity: managed_users_authenticated_id}) }}
  vars:
    managed_users_bound_identity: "{{ item.item[managed_users_identity_attribute] }}"
  loop: >-
    {{ managed_users_authentication.results | default([]) |
       rejectattr('skipped', 'defined') | list }}
  loop_control:
    label: "{{ managed_users_service }}-managed-user"
  when:
    - managed_users_bind_authenticated_ids | bool
    - not ansible_check_mode
  no_log: true

- name: "Run the caller's refusals before managed-user creation: {{ managed_users_title }}"
  ansible.builtin.include_tasks: "{{ managed_users_before_create_tasks }}"
  when:
    - managed_users_before_create_tasks | length > 0
    - managed_users_phase in ['preflight', 'reconcile']

- name: "Report planned managed-user creation: {{ managed_users_title }}"
  ansible.builtin.debug:
    msg: "{{ managed_users_plan_create_message }}"
  when:
    - managed_users_phase == 'reconcile'
    - ansible_check_mode
    - managed_users_matches[item[managed_users_identity_attribute]] | length == 0
  loop: "{{ managed_users_declared }}"
  loop_control:
    label: "{{ managed_users_service }}-managed-user"
  changed_when: true

- name: "Create absent managed users: {{ managed_users_title }}"
  ansible.builtin.uri:
    url: "{{ managed_users_api }}/{{ managed_users_create_path }}"
    method: POST
    url_username: "{{ managed_users_admin_username }}"
    url_password: "{{ managed_users_admin_password }}"
    force_basic_auth: "{{ managed_users_admin_basic }}"
    headers: "{{ managed_users_admin_headers }}"
    body_format: json
    body: "{{ managed_users_create_body }}"
    status_code: "{{ managed_users_create_status }}"
  register: managed_users_creation
  when:
    - managed_users_phase == 'reconcile'
    - not ansible_check_mode
    - managed_users_matches[item[managed_users_identity_attribute]] | length == 0
  loop: "{{ managed_users_declared }}"
  loop_control:
    label: "{{ managed_users_service }}-managed-user"
  changed_when: true
  no_log: true

- name: "Re-list users after managed-user creation: {{ managed_users_title }}"
  ansible.builtin.uri:
    url: "{{ managed_users_api }}/{{ managed_users_list_path }}"
    url_username: "{{ managed_users_admin_username }}"
    url_password: "{{ managed_users_admin_password }}"
    force_basic_auth: "{{ managed_users_admin_basic }}"
    headers: "{{ managed_users_admin_headers }}"
    status_code: [200]
    return_content: true
  register: managed_users_refreshed_response
  when:
    - managed_users_phase == 'reconcile'
    - not ansible_check_mode
  changed_when: false
  check_mode: false
  no_log: true

- name: "Resolve the refreshed managed-user listing: {{ managed_users_title }}"
  ansible.builtin.set_fact:
    managed_users_listing: "{{ managed_users_refreshed_response }}"
  when:
    - managed_users_phase == 'reconcile'
    - not ansible_check_mode
  no_log: true

- name: "Run the caller's refusals after managed-user creation: {{ managed_users_title }}"
  ansible.builtin.include_tasks: "{{ managed_users_after_creation_tasks }}"
  when:
    - managed_users_after_creation_tasks | length > 0
    - managed_users_phase == 'reconcile'
    - not ansible_check_mode

- name: "Require exact newly created managed identities: {{ managed_users_title }}"
  ansible.builtin.assert:
    that: "{{ managed_users_listing_conditions + managed_users_new_identity_conditions }}"
    fail_msg: >-
      {{ managed_users_title }} did not return one exact safe newly created
      managed identity; reconciliation refuses any subsequent repair.
  vars:
    # Listing conditions first, so the list short-circuits on an incomplete
    # re-read.
    managed_users_new_identity_conditions:
      - managed_users_identity_matches | length == 1
      - >-
        managed_users_list_json | map(attribute=managed_users_listed_identity_attribute) |
        map('trim') | map('lower') |
        select('equalto', item.item[managed_users_identity_attribute] | trim | lower) |
        list | length == 1
      - >-
        (managed_users_identity_matches | first)[managed_users_id_attribute] | string
          is match(managed_users_id_pattern)
    managed_users_matching_identity: "{{ item.item[managed_users_identity_attribute] }}"
  loop: >-
    {{ managed_users_creation.results | default([]) |
       rejectattr('skipped', 'defined') | list }}
  loop_control:
    label: "{{ managed_users_service }}-managed-user"
  when:
    - managed_users_phase == 'reconcile'
    - not ansible_check_mode
  no_log: true

- name: "Authenticate newly created managed users: {{ managed_users_title }}"
  ansible.builtin.uri:
    url: "{{ managed_users_api }}/{{ managed_users_authenticate_path }}"
    method: "{{ managed_users_authenticate_method }}"
    url_username: >-
      {{ item.item[managed_users_identity_attribute] if managed_users_authenticate_basic else omit }}
    url_password: "{{ item.item.password if managed_users_authenticate_basic else omit }}"
    force_basic_auth: "{{ managed_users_authenticate_basic }}"
    headers: "{{ managed_users_authenticate_headers }}"
    body_format: "{{ managed_users_authenticate_body_format }}"
    body: "{{ managed_users_authenticate_body }}"
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  vars:
    managed_users_authenticating_user: "{{ item.item }}"
  register: managed_users_new_authentication
  loop: >-
    {{ managed_users_creation.results | default([]) |
       rejectattr('skipped', 'defined') | list }}
  loop_control:
    label: "{{ managed_users_service }}-managed-user"
  when:
    - managed_users_phase == 'reconcile'
    - not ansible_check_mode
  failed_when: false
  changed_when: false
  no_log: true

- name: "Require newly created managed-user credentials: {{ managed_users_title }}"
  ansible.builtin.assert:
    that:
      - item.status | default(0) | int == managed_users_authenticate_status | int
      - >-
        managed_users_authenticate_identity ==
        item.item.item[managed_users_identity_attribute] or
        (managed_users_authenticate_identity_normalized | bool and
         managed_users_authenticate_identity | trim | lower ==
         item.item.item[managed_users_identity_attribute] | trim | lower)
      - >-
        not managed_users_bind_authenticated_ids | bool or
        managed_users_authenticated_id ==
        (managed_users_identity_matches | first)[managed_users_id_attribute]
    fail_msg: >-
      Newly created {{ managed_users_title }} managed user does not accept its
      vault password. Run the reviewed credential-migration procedure; Ansible
      will not reset it automatically or continue privilege reconciliation.
  vars:
    managed_users_matching_identity: "{{ item.item.item[managed_users_identity_attribute] }}"
  loop: >-
    {{ managed_users_new_authentication.results | default([]) |
       rejectattr('skipped', 'defined') | list }}
  loop_control:
    label: "{{ managed_users_service }}-managed-user"
  when:
    - managed_users_phase == 'reconcile'
    - not ansible_check_mode
  no_log: true

- name: "Bind authenticated newly created managed-user identifiers: {{ managed_users_title }}"
  ansible.builtin.set_fact:
    managed_users_initial_authenticated_ids: >-
      {{ managed_users_initial_authenticated_ids | default({}) | combine({
           managed_users_service: {
             managed_users_bound_identity:
               (managed_users_initial_authenticated_ids | default({})).get(
                 managed_users_service, {}
               ).get(managed_users_bound_identity, managed_users_authenticated_id)
           }}, recursive=true) }}
    managed_users_authenticated_ids: >-
      {{ managed_users_authenticated_ids |
         combine({managed_users_bound_identity: managed_users_authenticated_id}) }}
  vars:
    managed_users_bound_identity: "{{ item.item.item[managed_users_identity_attribute] }}"
  loop: >-
    {{ managed_users_new_authentication.results | default([]) |
       rejectattr('skipped', 'defined') | list }}
  loop_control:
    label: "{{ managed_users_service }}-managed-user"
  when:
    - managed_users_bind_authenticated_ids | bool
    - managed_users_phase == 'reconcile'
    - not ansible_check_mode
  no_log: true

# Repairs against the re-read listing so a record created without its properties
# is fixed this run; the stable-identity refusal guards bound services.
- name: "Re-resolve managed identities after creation: {{ managed_users_title }}"
  ansible.builtin.set_fact:
    managed_users_matches: >-
      {{ managed_users_matches |
         combine(dict([(item[managed_users_identity_attribute],
           managed_users_identity_matches)])) }}
  vars:
    managed_users_matching_identity: "{{ item[managed_users_identity_attribute] }}"
  loop: "{{ managed_users_declared }}"
  loop_control:
    label: "{{ managed_users_service }}-managed-user"
  when:
    - managed_users_bind_authenticated_ids | bool or managed_users_reresolve_after_creation | bool
    - managed_users_phase == 'reconcile'
    - not ansible_check_mode
  no_log: true

# The inline conditional keeps it total: a caller's condition may index a match
# that does not exist.
- name: "Resolve managed-user repair decisions: {{ managed_users_title }}"
  ansible.builtin.set_fact:
    managed_users_repairs: >-
      {{ managed_users_repairs | combine({
           item[managed_users_identity_attribute]:
             ((managed_users_repair_condition | bool)
              if managed_users_matches[item[managed_users_identity_attribute]] | length == 1
              else false) }) }}
  vars:
    managed_users_match: >-
      {{ managed_users_matches[item[managed_users_identity_attribute]] |
         first | default({}) }}
  when: managed_users_phase == 'reconcile'
  loop: "{{ managed_users_declared }}"
  loop_control:
    label: "{{ managed_users_service }}-managed-user"
  no_log: true

- name: "Report planned managed-user repair: {{ managed_users_title }}"
  ansible.builtin.debug:
    msg: "{{ managed_users_plan_repair_message }}"
  when:
    - managed_users_phase == 'reconcile'
    - ansible_check_mode
    - managed_users_repairs[item[managed_users_identity_attribute]]
  loop: "{{ managed_users_declared }}"
  loop_control:
    label: "{{ managed_users_service }}-managed-user"
  changed_when: true

# Every declared identity, not only those about to be repaired.
- name: "Require stable authenticated managed identities: {{ managed_users_title }}"
  ansible.builtin.assert:
    that:
      - managed_users_matches[item[managed_users_identity_attribute]] | length == 1
      - >-
        managed_users_matches[item[managed_users_identity_attribute]][0][managed_users_id_attribute] ==
        managed_users_authenticated_ids[item[managed_users_identity_attribute]]
      - >-
        managed_users_matches[item[managed_users_identity_attribute]][0][managed_users_id_attribute] ==
        managed_users_initial_authenticated_ids[managed_users_service][item[managed_users_identity_attribute]]
    fail_msg: >-
      A managed {{ managed_users_title }} identity resolved to a different record
      after credential proof. Run the reviewed credential-migration procedure;
      Ansible will not mutate a replacement identity.
  loop: "{{ managed_users_declared }}"
  loop_control:
    label: "{{ managed_users_service }}-managed-user"
  when:
    - managed_users_bind_authenticated_ids | bool
    - managed_users_phase == 'reconcile'
    - not ansible_check_mode
  no_log: true

# Runs in verify too, feeding the final verification; its tasks see the repair's
# matches.
- name: "Run the caller's refusals before managed-user repair: {{ managed_users_title }}"
  ansible.builtin.include_tasks: "{{ managed_users_before_repair_tasks }}"
  when:
    - managed_users_before_repair_tasks | length > 0
    - managed_users_phase in ['reconcile', 'verify']

- name: "Repair non-secret managed-user properties: {{ managed_users_title }}"
  ansible.builtin.uri:
    url: "{{ managed_users_api }}/{{ managed_users_reconcile_path }}"
    method: "{{ managed_users_reconcile_method }}"
    url_username: "{{ managed_users_admin_username }}"
    url_password: "{{ managed_users_admin_password }}"
    force_basic_auth: "{{ managed_users_admin_basic }}"
    headers: "{{ managed_users_admin_headers }}"
    body_format: json
    body: "{{ managed_users_repair_body }}"
    status_code: "{{ managed_users_repair_status }}"
  vars:
    managed_users_match: >-
      {{ managed_users_matches[item[managed_users_identity_attribute]] |
         first | default({}) }}
  when:
    - managed_users_phase == 'reconcile'
    - not ansible_check_mode
    - managed_users_repairs[item[managed_users_identity_attribute]]
  loop: "{{ managed_users_declared }}"
  loop_control:
    label: "{{ managed_users_service }}-managed-user"
  changed_when: true
  no_log: true

- name: "Run the caller's verifications before exact managed-user verification: {{ managed_users_title }}"
  ansible.builtin.include_tasks: "{{ managed_users_before_verify_tasks }}"
  when:
    - managed_users_before_verify_tasks | length > 0
    - managed_users_phase == 'verify'

- name: "Verify exact managed users: {{ managed_users_title }}"
  ansible.builtin.assert:
    that: "{{ managed_users_verify_conditions }}"
    fail_msg: "{{ managed_users_verify_fail_msg }}"
  vars:
    managed_users_match: >-
      {{ managed_users_matches[item[managed_users_identity_attribute]] |
         first | default({}) }}
  when: managed_users_phase == 'verify'
  loop: "{{ managed_users_declared }}"
  loop_control:
    label: "{{ managed_users_service }}-managed-user"
  no_log: true
