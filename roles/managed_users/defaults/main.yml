---
# Read from the deployed release, not the controller checkout; every caller
# lists it in deployment_target_extra_paths.
managed_users_register_path: >-
  {{ platform_current_dir }}/config/managed-user-capabilities.yml

# Header-authenticated services set managed_users_admin_headers and omit these.
managed_users_admin_headers: {}
managed_users_admin_username: "{{ omit }}"
managed_users_admin_password: "{{ omit }}"
managed_users_admin_basic: true

managed_users_authenticate_method: GET
managed_users_authenticate_basic: true
managed_users_authenticate_body: "{{ omit }}"
managed_users_authenticate_body_format: "{{ omit }}"
# Non-credential headers on every authenticate call (jellyfin names its client).
managed_users_authenticate_headers: {}
managed_users_authenticate_status: 200

# Listed attribute when it differs from the declared one (jellyfin lists
# `Name`).
managed_users_listed_identity_attribute: "{{ managed_users_identity_attribute }}"

# Bound per identity as managed_users_matching_identity. Normalized matching
# (immich) compares the `trim | lower` bucket instead of exact equality.
managed_users_match_normalized: false
managed_users_identity_matches: >-
  {{ (managed_users_list_json |
      zip(managed_users_list_json | map(attribute=managed_users_listed_identity_attribute) |
          map('trim') | map('lower')) |
      selectattr('1', 'equalto', managed_users_matching_identity | trim | lower) |
      map('first') | list)
     if managed_users_match_normalized | bool else
     (managed_users_list_json |
      selectattr(managed_users_listed_identity_attribute, 'equalto',
                 managed_users_matching_identity) | list) }}

managed_users_id_attribute: id
managed_users_create_status: [201]
managed_users_reconcile_method: PATCH
managed_users_repair_status: [204]

# Brace-free so `assert` stops at the first false: an envelope is proved a
# mapping before a key is read out of it.
managed_users_listing_conditions:
  - managed_users_list_json | type_debug == 'list'

# Whether an authenticated identity may differ from the declared one by case or
# whitespace.
managed_users_authenticate_identity_normalized: true

# A service with a narrower known id shape states it, so the guard never widens.
managed_users_id_pattern: "{{ platform_safe_api_identifier_pattern }}"

# Credential-bound identities (beszel): proves each credential authenticates as
# the listed record, re-resolves after creation, and refuses to repair a record
# its credential did not prove.
managed_users_bind_authenticated_ids: false

# Re-resolve after creation without binding ids (jellyfin); implied by the
# above.
managed_users_reresolve_after_creation: false

# Caller task files run inside this role, as ../../<role>/tasks/<file>.yml:
# before_create (preflight+reconcile), after_creation (reconcile, not --check),
# before_repair (reconcile+verify), before_verify (verify only).
managed_users_before_create_tasks: ""
managed_users_after_creation_tasks: ""
managed_users_before_repair_tasks: ""
managed_users_before_verify_tasks: ""
