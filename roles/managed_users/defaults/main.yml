---
# The managed-user capability register, read from the DEPLOYED release rather
# than from the controller checkout: roles/arr/tasks/configarr.yml is the
# precedent, and the reason is the same -- what the target honours is what the
# target carries. Every caller lists this path in its own
# deployment_target_extra_paths.
managed_users_register_path: >-
  {{ platform_current_dir }}/config/managed-user-capabilities.yml

# Administrative credentials for the list, create and repair requests. A service
# authenticating with a bearer or API-key header sets managed_users_admin_headers
# and leaves these omitted.
managed_users_admin_headers: {}
managed_users_admin_username: "{{ omit }}"
managed_users_admin_password: "{{ omit }}"
managed_users_admin_basic: true

# The per-identity authentication probe. komga answers a GET against the
# identity's own basic credentials; the POST services send a credential body.
managed_users_authenticate_method: GET
managed_users_authenticate_basic: true
managed_users_authenticate_body: "{{ omit }}"
managed_users_authenticate_body_format: "{{ omit }}"

managed_users_id_attribute: id
managed_users_create_status: [201]
managed_users_reconcile_method: PATCH
managed_users_repair_status: [204]

# What a complete listing must satisfy, asserted against the first listing and
# again against the one re-read after creation. BRACE-FREE, like
# managed_users_verify_conditions, so `assert` evaluates them in order and stops
# at the first false: a service that wraps its list in a paginated envelope
# (audiobookshelf) proves the envelope is a mapping before anything reads a key
# out of it.
managed_users_listing_conditions:
  - managed_users_list_json | type_debug == 'list'

# Whether an authenticated identity may differ from the declared one by case or
# surrounding whitespace. komga compares emails normalised; audiobookshelf has
# always required the login response to echo the declared username exactly.
managed_users_authenticate_identity_normalized: true
