---
# Delivers one per-service deployment notification to Pushover. The caller names the
# token's vault variable, not its value, so a refusal can name it without leaking it.
# With deployment_pushover_html set, the caller must pre-escape and stay under 1024.
# Verdict follows roles/beszel/tasks/configure.yml (#598): only an authoritative
# refusal fails; an outage must not fail a converge whose services already deployed.

# Pushover refuses an over-long title or message with a 400, so both are cut here.
# leeway 0: Jinja's default lets a string run five characters past the limit.
- name: Publish the deployment notification to Pushover
  ansible.builtin.uri:
    url: "{{ deployment_pushover_api_url }}"
    method: POST
    body_format: form-urlencoded
    body:
      token: "{{ lookup('ansible.builtin.vars', deployment_pushover_token_variable) }}"
      user: "{{ vault_pushover_user_key }}"
      title: "{{ deployment_pushover_title | truncate(250, false, '…', 0) }}"
      message: "{{ deployment_pushover_message | truncate(1024, false, '…', 0) }}"
      priority: "{{ deployment_pushover_priority }}"
      ttl: "{{ deployment_pushover_ttl | default(omit) }}"
      html: "{{ deployment_pushover_html | default(omit) }}"
    # failed_when replaces the verdict below; uri parses the JSON body whatever the status.
    status_code: [200, 400]
    timeout: 10
  register: deployment_pushover_delivery
  failed_when: false
  changed_when: false
  no_log: true

# A verdict needs both an authoritative code and Pushover's own status field: a proxy
# can answer 200/4xx with no verdict. 429 is a quota answer, not a refusal. `is integer`
# rejects booleans and "0", which `| int` and `== 0` would read as a refusal.
- name: Summarize the Pushover answer without the credentials it carried
  ansible.builtin.set_fact:
    deployment_pushover_verdict: >-
      {%- set code = deployment_pushover_delivery.status | default(-1) | int -%}
      {%- set body = deployment_pushover_delivery.json | default(none) -%}
      {%- set answer = body.get('status') if body is mapping else none -%}
      {%- set answer = answer if answer is integer else none -%}
      {%- if code == 200 and answer == 1 -%}accepted{%- elif 400 <= code <= 499
      and code != 429 and answer == 0 -%}refused{%- else -%}unanswered{%- endif -%}

# Its own task: no_log suppresses an assert's success_msg but not its fail_msg.
- name: Report that Pushover did not answer, which is not a refusal
  ansible.builtin.debug:
    msg: >-
      Pushover did not answer "{{ deployment_pushover_title }}", so its delivery is
      unverified this run. This is not a refusal and is not a failure; the
      deployment itself converged.
  when: deployment_pushover_verdict == 'unanswered'

- name: Refuse a deployment notification Pushover rejected
  ansible.builtin.assert:
    that:
      - deployment_pushover_verdict != 'refused'
    fail_msg: >-
      Pushover refused the deployment notification. Check
      {{ deployment_pushover_token_variable }} against its application's own page at
      pushover.net and vault_pushover_user_key against the account dashboard; a
      token regenerated
      in the console has to be re-authored in vault. The services in this run
      already converged. Values are not shown.
  no_log: true
