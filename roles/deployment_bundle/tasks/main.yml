---
- name: Validate controller bundle sources when not already checked by the play
  ansible.builtin.include_tasks: controller.yml
  when: not (deployment_bundle_controller_validated | default(false))

- name: Validate controller inputs when not already checked by the play
  ansible.builtin.include_tasks: inputs.yml
  when: not (deployment_bundle_controller_inputs_validated | default(false) | bool)

# Once, ahead of every mutation this role makes, and only when the play has
# not already validated the same paths in its pre_tasks. site.yml validates
# them before preflight, so a full converge skips this; a playbook that uses
# the role on its own still validates before it touches anything.
- name: Validate target containment when not already checked by the play
  ansible.builtin.include_tasks: target.yml
  vars:
    # A deployment may legitimately replace an older active release. Runtime
    # service callers require the current release once the pointer is active.
    deployment_target_require_current_release: false
  when: not (deployment_bundle_target_validated | default(false) | bool)

- name: Resolve the deployment staging directory
  ansible.builtin.set_fact:
    deployment_bundle_staging_dir: >-
      {{ platform_deploy_root }}/.release-{{ platform_release_id }}

- name: Validate deployment paths before destructive operations
  ansible.builtin.assert:
    that:
      - platform_release_id is match('^[0-9a-f]{40}$')
      - platform_kind in ['nas', 'mac']
      - platform_compose_kind is match('^[a-z][a-z0-9_-]*$')
      - platform_compose_kind == platform_kind or
        (deployment_bundle_test_mode | bool)
      - platform_deploy_root == deployment_bundle_expected_root
      - platform_release_dir == deployment_bundle_expected_release_dir
      - platform_current_dir == platform_deploy_root ~ '/current'
      - platform_runtime_dir == platform_deploy_root ~ '/runtime'
    fail_msg: >-
      Deployment paths must be derived from nas_docker_root and a full Git SHA;
      refusing to create, remove, or replace an uncontained path.
  vars:
    deployment_bundle_expected_root: >-
      {{ (nas_docker_root | regex_replace('/+$', '')) ~ '/nas-platform' }}
    deployment_bundle_expected_release_dir: >-
      {{ platform_deploy_root }}/releases/{{ platform_release_id }}

- name: Inspect canonical controller Compose definitions
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/services/{{ item.name }}/compose.yml"
  loop: "{{ deployment_bundle_services }}"
  loop_control:
    label: "{{ item.name }}"
  register: deployment_bundle_canonical_sources
  delegate_to: localhost

- name: Require canonical Compose for each implemented service
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - not item.stat.islnk
    fail_msg: >-
      Implemented service {{ item.item.name }} has no canonical controller
      Compose definition at {{ item.stat.path }}.
  loop: "{{ deployment_bundle_canonical_sources.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Inspect platform-specific controller Compose definitions
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/services/{{ item.name }}/compose.{{ platform_compose_kind }}.yml"
  loop: "{{ deployment_bundle_services }}"
  loop_control:
    label: "{{ item.name }}"
  register: deployment_bundle_platform_sources
  delegate_to: localhost

- name: Create deployment and mutable runtime directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ platform_deploy_root }}"
    - "{{ platform_deploy_root }}/releases"
    - "{{ platform_runtime_dir }}"
    - "{{ platform_runtime_dir }}/services"

- name: Create mutable service runtime directories
  ansible.builtin.file:
    path: "{{ platform_runtime_dir }}/services/{{ item.name }}"
    state: directory
    mode: "0755"
  loop: "{{ deployment_bundle_services }}"
  loop_control:
    label: "{{ item.name }}"

- name: Inspect the current deployment pointer
  ansible.builtin.stat:
    path: "{{ platform_current_dir }}"
    follow: false
  register: deployment_bundle_current

# Read before the pointer moves: after activation nothing on the target still
# names the release this run replaced, and the deployment summary needs it to
# say what changed rather than only what is now installed.
- name: Record the release the deployment pointer named
  ansible.builtin.set_fact:
    deployment_bundle_previous_release_id: >-
      {{ (deployment_bundle_current.stat.lnk_source | default('') | basename)
         if ((deployment_bundle_current.stat.islnk | default(false)) and
             (deployment_bundle_current.stat.lnk_source | default('') | basename)
               is match('^[0-9a-f]{40}$'))
         else '' }}

- name: Remove an abandoned staging release
  ansible.builtin.file:
    path: "{{ deployment_bundle_staging_dir }}"
    state: absent
  changed_when: false
  when: not ansible_check_mode

- name: Create the clean staging release
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ deployment_bundle_staging_dir }}"
    - "{{ deployment_bundle_staging_dir }}/config"
    - "{{ deployment_bundle_staging_dir }}/services"
  changed_when: false
  when: not ansible_check_mode

- name: Copy the media acquisition catalog from the controller
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/config/media-acquisition.yml"
    dest: "{{ deployment_bundle_staging_dir }}/config/media-acquisition.yml"
    mode: "0644"
  changed_when: false
  when: not ansible_check_mode

- name: Create implemented service staging directories
  ansible.builtin.file:
    path: "{{ deployment_bundle_staging_dir }}/services/{{ item.name }}"
    state: directory
    mode: "0755"
  loop: "{{ deployment_bundle_services }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false
  when: not ansible_check_mode

- name: Copy canonical Compose definitions from the controller
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/services/{{ item.name }}/compose.yml"
    dest: "{{ deployment_bundle_staging_dir }}/services/{{ item.name }}/compose.yml"
    mode: "0644"
  loop: "{{ deployment_bundle_services }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false
  when: not ansible_check_mode

- name: Create dedicated tracked helper directories in the release
  ansible.builtin.file:
    path: "{{ deployment_bundle_staging_dir }}/services/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - dozzle
    - immich
  changed_when: false
  when: not ansible_check_mode

- name: Copy the tracked Dozzle alert relay from the controller
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/services/dozzle/alert_relay.py"
    dest: "{{ deployment_bundle_staging_dir }}/services/dozzle/alert_relay.py"
    mode: "0644"
  changed_when: false
  when: not ansible_check_mode

- name: Copy the tracked Immich restore classifier from the controller
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/services/immich/classify_restore.py"
    dest: "{{ deployment_bundle_staging_dir }}/services/immich/classify_restore.py"
    mode: "0644"
  changed_when: false
  when: not ansible_check_mode

- name: Copy the tracked Configarr declaration from the controller
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/arr/files/configarr/config.yml"
    dest: "{{ deployment_bundle_staging_dir }}/services/arr/configarr.yml"
    mode: "0644"
  changed_when: false
  when:
    - not ansible_check_mode
    - >-
      deployment_bundle_services |
      selectattr('name', 'equalto', 'arr') | list | length == 1

- name: Copy present platform-specific Compose definitions from the controller
  ansible.builtin.copy:
    src: "{{ item.stat.path }}"
    dest: >-
      {{ deployment_bundle_staging_dir }}/services/{{ item.item.name }}/compose.{{ platform_compose_kind }}.yml
    mode: "0644"
  loop: "{{ deployment_bundle_platform_sources.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  changed_when: false
  when:
    - not ansible_check_mode
    - item.stat.exists

- name: Write the deployment manifest
  ansible.builtin.template:
    src: manifest.yml.j2
    dest: "{{ deployment_bundle_staging_dir }}/manifest.yml"
    mode: "0644"
  changed_when: false
  when: not ansible_check_mode

- name: Inspect the immutable release
  ansible.builtin.stat:
    path: "{{ platform_release_dir }}"
    follow: false
  register: deployment_bundle_release

- name: Compare the staged and immutable releases
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.python.executable }}"
      - -c
      - "{{ lookup('ansible.builtin.file', role_path ~ '/files/compare_release_trees.py') }}"
      - "{{ deployment_bundle_staging_dir }}"
      - "{{ platform_release_dir }}"
  register: deployment_bundle_release_compare
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - deployment_bundle_release.stat.exists
    - not ansible_check_mode

- name: Decide whether the immutable release needs installation
  ansible.builtin.set_fact:
    deployment_bundle_release_install_required: >-
      {{ not deployment_bundle_release.stat.exists or
         deployment_bundle_release_compare.rc | default(0) != 0 }}

- name: Refuse to mutate an active immutable release
  ansible.builtin.assert:
    that:
      - not deployment_bundle_release_install_required or
        not (deployment_bundle_current.stat.islnk | default(false)) or
        deployment_bundle_current.stat.lnk_source | default('') != platform_release_dir
    fail_msg: >-
      Active release {{ platform_release_dir }} differs from the controller
      bundle. Refusing to mutate it in place; deploy a new controller revision.

- name: Remove an inactive stale release
  ansible.builtin.file:
    path: "{{ platform_release_dir }}"
    state: absent
  when:
    - not ansible_check_mode
    - deployment_bundle_release.stat.exists
    - deployment_bundle_release_install_required

- name: Atomically install the immutable release
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.python.executable }}"
      - -c
      - import os, sys; os.replace(sys.argv[1], sys.argv[2])
      - "{{ deployment_bundle_staging_dir }}"
      - "{{ platform_release_dir }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - deployment_bundle_release_install_required

- name: Remove the verified staging release
  ansible.builtin.file:
    path: "{{ deployment_bundle_staging_dir }}"
    state: absent
  changed_when: false
  when:
    - not ansible_check_mode
    - not deployment_bundle_release_install_required

- name: Decide whether the deployment pointer needs to move
  ansible.builtin.set_fact:
    deployment_bundle_switch_required: >-
      {{ not (deployment_bundle_current.stat.islnk | default(false)) or
         deployment_bundle_current.stat.lnk_source | default('') != platform_release_dir }}

- name: Remove a legacy non-symlink deployment directory
  ansible.builtin.file:
    path: "{{ platform_current_dir }}"
    state: absent
  when:
    - deployment_bundle_current.stat.exists
    - not (deployment_bundle_current.stat.islnk | default(false))

- name: Create the next deployment pointer
  ansible.builtin.file:
    src: "{{ platform_release_dir }}"
    dest: "{{ platform_deploy_root }}/.current-{{ platform_release_id }}"
    state: link
    force: true
  when: deployment_bundle_switch_required

- name: Atomically activate the controller release
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.python.executable }}"
      - -c
      - import os, sys; os.replace(sys.argv[1], sys.argv[2])
      - "{{ platform_deploy_root }}/.current-{{ platform_release_id }}"
      - "{{ platform_current_dir }}"
  changed_when: true
  when: deployment_bundle_switch_required

# Tagged always so a selective converge (--tags komga) still resolves the Compose
# selection its service role needs, against whichever release `current` names.
# Placed last so a full run reads the release this play just activated.
- name: Resolve the deployed Compose selection for every service
  ansible.builtin.include_tasks:
    file: compose_files.yml
    apply:
      tags: [always]
  tags: [always]
