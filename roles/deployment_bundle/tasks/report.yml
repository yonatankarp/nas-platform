---
# One message per service Compose actually recreated. The report is published by
# the controller rather than from inside the container, so a service reports its
# own deployment without needing a credential baked into its image.
#
# Delivered through Pushover (pushover_publish.yml), not ntfy, since #558 stage
# 2b. It lives in roles/deployment_bundle since stage 4a moved it out of
# roles/ntfy, whose retirement it must not share: every deploying role reports
# through it, and deployment_bundle is the one role every one of them already
# includes.
#
# It used to speak for every service on every run that moved the release, so
# that a silent service could not be confused with one that was never deployed.
# That answer belongs to summary.yml, which publishes once per
# release with the full image diff and the commit subjects it carries: the
# reader already learns that the deployment happened and what it moved. Repeated
# per service, "already current" was fifteen notifications of which fourteen
# said nothing, and nobody read them.
#
# So the gate is the Compose result alone. A release that repins one image
# reports that one service; a converge that recreates nothing is silent in both
# directions.
- name: Publish the service deployment report
  ansible.builtin.include_tasks: pushover_publish.yml
  vars:
    # The Containers application: a recreated container is container
    # lifecycle, beside the Dozzle relay's alerts, while the poller announces
    # each release in the Deployments application.
    deployment_pushover_token_variable: vault_pushover_containers_token
    # The title is plain text on Pushover's side, so it stays raw. The message
    # is HTML, so every value in it is escaped, and the service name is cut
    # BEFORE it is escaped: 128 characters escape to at most 768, so the message
    # never reaches pushover_publish.yml's 1024 cut, which could split an entity
    # or the closing tag.
    #
    # The platform's message style, which the poller's release message set in
    # #633: an emoji leads the title, the subject is bold, the verb is the
    # mid-tone green (#2e7d32) and metadata the mid-tone grey (#9e9e9e), both
    # readable on light and dark backgrounds, each metadata line labelled.
    #
    # When is now() at render time, on the controller, in UTC. Not
    # ansible_facts.date_time: that is stamped when the play gathered facts,
    # which for the last roles of a full converge is half an hour before the
    # recreation this reports.
    #
    # The closing pointer is true only when a Deployments message will exist:
    # the poller asked for the summary and the release moved. Those are the two
    # variables summary.yml gates its hand-off on, read here rather than restated,
    # so the report and the summary cannot disagree. A hand-run converge, or a
    # recreation outside a release move, ends at the When line. (The summary also
    # needs the installed manifest to be readable; a release whose manifest is
    # missing is one no service could have been deployed from.)
    deployment_pushover_title: "♻️ {{ deployment_report_service }} recreated"
    deployment_pushover_message: |-
      <b>{{ deployment_report_service | truncate(128, true, '', 0) | escape }}</b> was <font color="#2e7d32">recreated</font> by Compose

      🔖 <b>Release</b> <font color="#9e9e9e">{{ platform_release_id[:12] | escape }}</font>
      🕒 <b>When</b> <font color="#9e9e9e">{{ now(utc=true, fmt='%d %b %H:%M UTC') | escape }}</font>{{ deployment_report_details if deployment_report_announced else '' }}
    deployment_pushover_html: 1
    deployment_report_announced: >-
      {{ deployment_summary_path | length > 0 and deployment_release_moved | bool }}
    deployment_report_details: "\n\n<i>Details are in the Deployments message for this release.</i>"
    # Quiet (a badge, no sound), because this is the per-service detail behind
    # the deployment summary. A day's ttl because it is stale by the next
    # release, and Pushover then removes it from the device by itself.
    deployment_pushover_priority: -1
    deployment_pushover_ttl: 86400
  when:
    - deployment_report_changed | bool
    - not ansible_check_mode
