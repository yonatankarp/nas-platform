---
# One message for the whole run, published after every service has converged.
# The per-service reports say a service was recreated; this says what shipped —
# which images moved between which versions, and the commit subjects the release
# carries — because the reader is usually a phone nowhere near a checkout, where
# a revision is a lookup they cannot perform.
#
# Silent unless the release actually moved. A converge that reinstalls the same
# revision recreated nothing, and the per-service reports stay silent for the
# same reason.
#
# Two ways out, never both (#558). Under the deployment poller, which alone sets
# deployment_summary_path, the summary is written as JSON and published by
# nobody here: the poller announces it after verify.yml passes, with links this
# play cannot build. Everywhere else it is published as plain text, as before.
# Exactly one message per release either way, whichever side is the older code.
- name: Read the installed deployment manifest
  atomic_safe_slurp:
    path: "{{ platform_release_dir }}/manifest.yml"
    max_bytes: 1048576
  register: deployment_summary_current_source
  when:
    - deployment_release_moved | bool
    - not ansible_check_mode

- name: Read the manifest of the release this deployment replaced
  atomic_safe_slurp:
    path: >-
      {{ platform_deploy_root }}/releases/{{ deployment_previous_release }}/manifest.yml
    max_bytes: 1048576
  register: deployment_summary_previous_source
  when:
    - deployment_release_moved | bool
    - not ansible_check_mode
    - deployment_previous_release is match('^[0-9a-f]{40}$')

# A first install has no previous manifest, and every image in it is genuinely
# new rather than unchanged.
- name: Resolve which images the release moved
  ansible.builtin.set_fact:
    deployment_summary_changes: >-
      {{ ((deployment_summary_previous_source.content | b64decode | from_yaml)
          if (deployment_summary_previous_source.exists | default(false)) else none)
         | deployment_image_changes(deployment_summary_current_document) }}
  vars:
    deployment_summary_current_document: >-
      {{ deployment_summary_current_source.content | b64decode | from_yaml }}
  when:
    - deployment_release_moved | bool
    - not ansible_check_mode
    - deployment_summary_current_source.exists | default(false)

# Delegated because the Git history lives in the controller checkout, which the
# target never has. Best effort: a release whose predecessor the checkout no
# longer contains still deserves the image summary rather than a failed run.
- name: Read the commit subjects this deployment carries
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ deployment_summary_checkout }}"
      - log
      - --no-merges
      - --format=%H%x09%s
      - "{{ deployment_previous_release }}..{{ platform_release_id }}"
  register: deployment_summary_git_log
  changed_when: false
  failed_when: false
  check_mode: false
  delegate_to: localhost
  run_once: true
  when:
    - deployment_release_moved | bool
    - not ansible_check_mode
    - deployment_summary_current_source.exists | default(false)
    - deployment_previous_release is match('^[0-9a-f]{40}$')

- name: Resolve the commit subjects to report
  ansible.builtin.set_fact:
    deployment_summary_commits: >-
      {{ (deployment_summary_git_log.stdout_lines | default([]))
         if (deployment_summary_git_log.rc | default(1)) == 0 else [] }}
  when:
    - deployment_release_moved | bool
    - not ansible_check_mode
    - deployment_summary_current_source.exists | default(false)

# The poller links each image to the pull request that moved it, so it needs
# the commit that introduced the image's exact pinned reference. A pickaxe on
# the whole reference, because one Compose file can pin several images
# (services/arr/compose.yml pins four), and only under services/, where every
# Compose definition lives: a later commit that merely mentions the reference
# in a document would otherwise be the newest match and take the image's link.
# Best effort, like the log above: a lookup that finds nothing costs that image
# its link.
- name: Find the commit that introduced each image the release runs
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ deployment_summary_checkout }}"
      - log
      - -1
      - --format=%H
      - "-S{{ item.reference }}"
      - "{{ deployment_previous_release }}..{{ platform_release_id }}"
      - --
      - services/
  loop: "{{ deployment_summary_changes }}"
  loop_control:
    label: "{{ item.name }}"
  register: deployment_summary_image_commits
  changed_when: false
  failed_when: false
  check_mode: false
  delegate_to: localhost
  run_once: true
  when:
    - deployment_summary_path | length > 0
    - deployment_release_moved | bool
    - not ansible_check_mode
    - deployment_summary_current_source.exists | default(false)
    - deployment_previous_release is match('^[0-9a-f]{40}$')
    - item.reference is defined

# Beside the poller's other state, which is where the path points, and on the
# controller because the poller reads it there; on the NAS the two are one host.
# It carries versions, SHAs and commit subjects, nothing secret, and is private
# anyway like every other file in that directory.
#
# A write that fails is rescued, never fatal. By now every service has
# converged, and failing here would mark the release failed and skip verify and
# the poller's reinstall -- over a notification input a full or read-only disk
# refused. The poller already sends nothing for a release with no summary, so
# the cost is this release's message, and the rescue says so.
- name: Hand the deployment summary to the poller
  when:
    - deployment_summary_path | length > 0
    - deployment_release_moved | bool
    - not ansible_check_mode
    - deployment_summary_current_source.exists | default(false)
  block:
    - name: Write the deployment summary for the poller to announce
      ansible.builtin.copy:
        content: >-
          {{ deployment_summary_changes
             | deployment_summary_document(deployment_summary_image_commits.results | default([]),
                                           deployment_summary_commits, platform_release_id,
                                           deployment_previous_release)
             | to_nice_json }}
        dest: "{{ deployment_summary_path }}"
        mode: "0600"
      delegate_to: localhost
      run_once: true
  rescue:
    - name: Report that this release will not be announced
      ansible.builtin.debug:
        msg: >-
          The release summary could not be written to {{ deployment_summary_path }},
          so the deployment poller will not announce this release. This is not a
          deployment failure; the services in this run already converged.
      run_once: true

# Delivered through Pushover (pushover_publish.yml), not ntfy, since #558 stage
# 2b. A refused publish fails the converge on purpose, exactly as the
# per-service report does; an unreachable Pushover does not. Normal priority,
# above the quiet per-service detail, and the Deployments application, which
# carries nothing but one message per release. Plain text, and only when no
# poller asked for the summary: the poller's richer message replaces this one.
- name: Publish the deployment summary
  ansible.builtin.include_tasks: pushover_publish.yml
  vars:
    deployment_pushover_token_variable: vault_pushover_deployments_token
    deployment_pushover_title: >-
      {{ deployment_summary_changes
         | deployment_report_headline(deployment_summary_commits) }}
    deployment_pushover_message: "{{ lookup('ansible.builtin.template', 'deployment_summary.j2') }}"
    deployment_pushover_priority: 0
  when:
    - deployment_summary_path | length == 0
    - deployment_release_moved | bool
    - not ansible_check_mode
    - deployment_summary_current_source.exists | default(false)

- name: Report the deployment summary withheld by check mode
  ansible.builtin.debug:
    msg: >-
      Check mode publishes and writes no deployment summary; a real run that
      moves the release sends one Pushover message, or hands it to the
      deployment poller to send.
  when: ansible_check_mode
