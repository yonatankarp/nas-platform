---
- name: Inspect the adoption state root
  ansible.builtin.stat:
    path: "{{ platform_adoption_root }}"
    follow: false
  register: deployment_adoption_root
  when: platform_adoption_enabled | default(false) | bool

- name: Inspect the immutable adoption binding marker
  ansible.builtin.stat:
    path: "{{ platform_adoption_root }}/snapshot/pre-cutover/binding.json"
    follow: false
    checksum_algorithm: sha256
  register: deployment_adoption_binding
  when: platform_adoption_enabled | default(false) | bool

- name: Read the immutable adoption binding marker
  ansible.builtin.slurp:
    path: "{{ platform_adoption_root }}/snapshot/pre-cutover/binding.json"
  register: deployment_adoption_binding_content
  when: platform_adoption_enabled | default(false) | bool

- name: Require the exact immutable adoption binding marker
  ansible.builtin.assert:
    that:
      - platform_kind == 'mac'
      - deployment_adoption_root.stat.exists
      - deployment_adoption_root.stat.isdir
      - not deployment_adoption_root.stat.islnk
      - deployment_adoption_root.stat.mode == '0700'
      - deployment_adoption_root.stat.pw_name == ansible_facts.user_id
      - platform_adoption_marker is match('^[0-9a-f]{64}$')
      - deployment_adoption_binding.stat.exists
      - deployment_adoption_binding.stat.isreg
      - not deployment_adoption_binding.stat.islnk
      - deployment_adoption_binding.stat.mode == '0400'
      - deployment_adoption_binding.stat.pw_name == ansible_facts.user_id
      - deployment_adoption_binding.stat.checksum == platform_adoption_marker
      - >-
        (deployment_adoption_binding_content.content | b64decode | from_json).lane == 'adoption'
      - >-
        (deployment_adoption_binding_content.content | b64decode | from_json).sandbox_id ==
        (platform_adoption_root | basename)
    fail_msg: Adoption state root is not bound to the immutable pre-cutover snapshot.
  when: platform_adoption_enabled | default(false) | bool

- name: Validate exact deployment path derivation
  ansible.builtin.assert:
    that:
      - platform_release_id is match('^[0-9a-f]{40}$')
      - platform_kind in ['nas', 'mac']
      - platform_compose_kind is match('^[a-z][a-z0-9_-]*$')
      - platform_compose_kind == platform_kind or
        (deployment_bundle_test_mode | bool)
      - platform_deploy_root == deployment_target_expected_root
      - platform_release_dir == platform_deploy_root ~ '/releases/' ~ platform_release_id
      - platform_current_dir == platform_deploy_root ~ '/current'
      - platform_runtime_dir == platform_deploy_root ~ '/runtime'
    fail_msg: >-
      Deployment paths must be derived from nas_docker_root and a full Git SHA.
  vars:
    deployment_target_expected_root: >-
      {{ (nas_docker_root | regex_replace('/+$', '')) ~ '/nas-platform' }}

# This is a read-only check against pre-existing symlinks and canonical escapes.
# Repeating it adjacent to mutations narrows the race window, but it does not
# eliminate concurrent privileged filesystem mutation between Ansible tasks.
- name: Validate target path ancestry and canonical containment
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.python.executable }}"
      - -c
      - "{{ lookup('ansible.builtin.file', role_path ~ '/files/validate_target.py') }}"
      - "{{ nas_docker_root }}"
      - "{{ nas_media_root }}"
      - "{{ platform_release_dir }}"
      - "{{ platform_current_dir }}"
      - "{{ platform_deploy_root }}/.current-{{ platform_release_id }}"
      - "{{ (deployment_target_require_current_release | default(false) | bool) | ternary('1', '0') }}"
      - >-
        {{ (deployment_target_candidate_paths
            if (platform_adoption_enabled | default(false) | bool)
            else (deployment_target_candidate_paths
                  | reject('search', '/compose[.]adoption[.]yml$') | list)) | to_json }}
      - "{{ platform_adoption_root | default('') }}"
      - "{{ (platform_adoption_enabled | default(false) | bool) | ternary('1', '0') }}"
  changed_when: false
  check_mode: false
  vars:
    deployment_target_candidate_paths: >-
      {{ (deployment_target_paths | list) +
         (deployment_target_extra_paths | default([]) | list) }}
    deployment_target_paths: >-
      {{ [nas_docker_root,
          nas_docker_root ~ '/.nas-platform-preflight-probe',
          platform_deploy_root,
          platform_deploy_root ~ '/releases',
          platform_release_dir,
          platform_runtime_dir,
          platform_runtime_dir ~ '/services',
          platform_current_dir,
          platform_deploy_root ~ '/.release-' ~ platform_release_id,
          platform_deploy_root ~ '/.current-' ~ platform_release_id]
         + (deployment_bundle_services | default([])
            | map(attribute='name')
            | map('regex_replace', '^', platform_runtime_dir ~ '/services/')
            | list) }}
