---
- name: Validate exact deployment path derivation
  ansible.builtin.assert:
    that:
      - platform_release_id is match('^[0-9a-f]{40}$')
      - platform_kind in ['nas', 'mac']
      - platform_compose_kind is match('^[a-z][a-z0-9_-]*$')
      - platform_compose_kind == platform_kind or
        (deployment_bundle_test_mode | bool)
      - platform_deploy_root == deployment_target_expected_root
      - platform_release_dir == platform_deploy_root ~ '/releases/' ~ platform_release_id
      - platform_current_dir == platform_deploy_root ~ '/current'
      - platform_runtime_dir == platform_deploy_root ~ '/runtime'
    fail_msg: >-
      Deployment paths must be derived from nas_docker_root and a full Git SHA.
  vars:
    deployment_target_expected_root: >-
      {{ (nas_docker_root | regex_replace('/+$', '')) ~ '/nas-platform' }}

# A read-only check against pre-existing symlinks and canonical escapes, run
# once per distinct set of paths, before the tasks that mutate them: once for
# the play in site.yml pre_tasks, and once per role for the extra paths only
# that role knows it is about to touch. It is deliberately not repeated beside
# each individual mutation. That would narrow the window between check and use
# without closing it, because nothing here excludes a
# concurrent privileged filesystem mutation between two Ansible tasks; closing
# it takes the check inside the operation, against a held descriptor, the way
# library/atomic_safe_slurp.py does. A subprocess per mutation buys only the
# narrower window, so this role no longer spends one.
- name: Validate target path ancestry and canonical containment
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.python.executable }}"
      - -c
      - "{{ lookup('ansible.builtin.file', role_path ~ '/files/validate_target.py') }}"
      - "{{ nas_docker_root }}"
      - "{{ nas_media_root }}"
      - "{{ platform_release_dir }}"
      - "{{ platform_current_dir }}"
      - "{{ platform_deploy_root }}/.current-{{ platform_release_id }}"
      - "{{ (deployment_target_require_current_release | bool) | ternary('1', '0') }}"
      - "{{ deployment_target_candidate_paths | to_json }}"
  changed_when: false
  check_mode: false
  vars:
    deployment_target_candidate_paths: >-
      {{ (deployment_target_paths | list) +
         (deployment_target_extra_paths | list) }}
    deployment_target_paths: >-
      {{ [nas_docker_root,
          nas_docker_root ~ '/.nas-platform-preflight-probe',
          platform_deploy_root,
          platform_deploy_root ~ '/releases',
          platform_release_dir,
          platform_runtime_dir,
          platform_runtime_dir ~ '/services',
          platform_current_dir,
          platform_deploy_root ~ '/.release-' ~ platform_release_id,
          platform_deploy_root ~ '/.current-' ~ platform_release_id]
         + (deployment_bundle_services | default([])
            | map(attribute='name')
            | map('regex_replace', '^', platform_runtime_dir ~ '/services/')
            | list) }}

# Lets deployment_bundle's own body skip a validation the play already ran,
# while a playbook that uses the role without site.yml's pre_tasks still gets
# one. Mirrors deployment_bundle_controller_validated in controller.yml.
- name: Record target containment validation
  ansible.builtin.set_fact:
    deployment_bundle_target_validated: true
