---
# First, ahead of everything else this file checks, because it is the check that
# explains the others. Issue #326: a hand-run ansible-playbook and the poller's
# five-minute tick converged the same host at once. The poller repointed
# `current` at its own release while the manual run was still deploying services
# against the release that run had activated, and the manual run died 1463 tasks
# in -- at the *last* role -- on the containment guard below, reporting an unsafe
# deployment target whose pointer did not resolve to the expected release. That
# message is a real security control and says exactly the right thing for the
# cases it is for; it is simply not what was wrong. An operator cannot tell a
# benign race from a path traversal by reading it, and the natural response to it
# -- run it again -- adds a third converge to the two already running.
#
# So the probe runs here rather than only in site.yml's pre_tasks: every service
# role re-includes this file as its first task, which is what makes a poller that
# started *after* the manual run -- the ordering the #326 timestamps prove -- fail
# the very next role with "a deployment is already running" instead of failing at
# task 1463 with an integrity refusal.
#
# It is advisory, not a security control: the lock is cooperative, the owner
# declaration below is an environment variable anyone able to run ansible-playbook
# could export, and nothing here is load-bearing for containment. The guard that
# is load-bearing is the containment validator further down, which is unchanged.
- name: Probe the deployment lock for a concurrent deployment
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.python.executable }}"
      - -c
      - "{{ lookup('ansible.builtin.file', role_path ~ '/files/probe_deployment_lock.py') }}"
      - "{{ deployment_bundle_lock_path }}"
  register: deployment_bundle_lock_probe
  changed_when: false
  # A read, and one that has to really happen under --check. Answering it from a
  # simulation would report every host as unlocked, which is precisely the state
  # this exists to disprove.
  check_mode: false

# Refused under --check too, deliberately. A check-mode review predicts against a
# tree another converge is in the middle of rewriting, so its diff is stale before
# it finishes printing -- and the thing the operator most needs to learn from a
# review that cannot be trusted is *why*: a deployment is running. Reviewing again
# once it finishes costs a few minutes; acting on a diff taken mid-converge costs
# more.
#
# Exactly one held lock is tolerated: the one whose holder recorded nothing about
# itself. The record and this guard shipped in the same commit, but the poller
# that writes the record is installed by install-production-auto-deploy.yml,
# which the poller only reaches *after* site.yml succeeds. So on a host still
# running the previous poller this guard met a held lock carrying no pid, refused,
# and deadlocked the very upgrade that installs the record-writing poller -- the
# run of 20f97a9 on the NAS died here, at "an unnamed holder". A record-less
# holder is by definition one that predates that poller, and this guard is
# advisory rather than a security control, so it says what it found and continues.
# The load-bearing containment validator below is unchanged and still catches a
# genuine bad pointer. What #326 was actually about -- a record naming a *different*
# pid -- is still refused exactly as before.
- name: Judge the deployment lock this host reports
  vars:
    deployment_bundle_lock_state: >-
      {{ deployment_bundle_lock_probe.stdout | from_json }}
    # Named rather than compared inline so the message can say "operator converge
    # (pid 4711, started ...)" when the holder wrote a record, and still say
    # something true when it did not.
    deployment_bundle_lock_holder: >-
      {{ (deployment_bundle_lock_state.holder | default('an unnamed holder')) ~
         (' (pid ' ~ deployment_bundle_lock_state.pid ~
          (', started ' ~ deployment_bundle_lock_state.started
           if deployment_bundle_lock_state.started is defined else '') ~ ')'
          if deployment_bundle_lock_state.pid is defined else '') }}
    # The holder is this run's own ancestor when it says so and the pids agree:
    # `nas-platform-deploy --converge` and the poller both take the lock and then
    # run these plays, so without this every locked converge would refuse itself.
    # An empty declaration -- a bare ansible-playbook -- can never match.
    deployment_bundle_lock_held_by_this_run: >-
      {{ (deployment_bundle_lock_owner | string | trim | length > 0) and
         (deployment_bundle_lock_owner | string | trim ==
          deployment_bundle_lock_state.pid | default('') | string) }}
    # A pid is what makes a holder answerable. Without one there is nothing to
    # tell apart from this run, so there is no second deployment to name and no
    # refusal that could be justified by what was actually read.
    deployment_bundle_lock_identified: >-
      {{ deployment_bundle_lock_state.pid is defined }}
  block:
    - name: Refuse to converge a target another deployment is already converging
      ansible.builtin.assert:
        that:
          - not (deployment_bundle_lock_state.held | bool) or
            deployment_bundle_lock_held_by_this_run | bool or
            not (deployment_bundle_lock_identified | bool)
        fail_msg: >-
          A deployment is already running on this host: {{ deployment_bundle_lock_holder }}
          holds {{ deployment_bundle_lock_path }}. That is the poller's five-minute
          tick, another operator's converge, or the weekly image prune, which takes
          the same lock. This run would race it -- both converge the same services
          and repoint the same release, and the loser fails later, on a guard that
          reports an unsafe deployment target rather than this. Wait for the running
          deployment to finish, then re-run;
          `nas-platform-deploy --status` reports what the poller last did, and
          `nas-platform-deploy --converge -- <ansible-playbook arguments>` takes this
          same lock so the poller skips its tick instead of racing you.

    - name: Continue past a deployment lock whose holder recorded no identity
      ansible.builtin.debug:
        msg: >-
          {{ deployment_bundle_lock_path }} is held by a holder that recorded no
          identity, so this run cannot tell it from itself and does not refuse it.
          A holder that writes no record predates the poller this converge
          installs; refusing it would deadlock that upgrade. Containment is
          validated below regardless. If this repeats on a host whose poller is
          current, look for a process holding the lock outside
          scripts/production_auto_deploy.py and scripts/image_prune.py, which both
          record themselves.
      when:
        - deployment_bundle_lock_state.held | bool
        - not (deployment_bundle_lock_identified | bool)

- name: Validate exact deployment path derivation
  ansible.builtin.assert:
    that:
      - platform_release_id is match('^[0-9a-f]{40}$')
      - platform_kind in ['nas', 'mac']
      - platform_compose_kind is match('^[a-z][a-z0-9_-]*$')
      - platform_compose_kind == platform_kind or
        (deployment_bundle_test_mode | bool)
      - platform_deploy_root == deployment_target_expected_root
      - platform_release_dir == platform_deploy_root ~ '/releases/' ~ platform_release_id
      - platform_current_dir == platform_deploy_root ~ '/current'
      - platform_runtime_dir == platform_deploy_root ~ '/runtime'
    fail_msg: >-
      Deployment paths must be derived from nas_docker_root and a full Git SHA.
  vars:
    deployment_target_expected_root: >-
      {{ (nas_docker_root | regex_replace('/+$', '')) ~ '/nas-platform' }}

# The service a caller names is the manifest service *directory*, not its role:
# roles/paperless_ngx deploys services/paperless-ngx, so a name derived from the
# role would validate five paths that do not exist while the five it is about to
# touch went unchecked. Membership in the manifest is asserted rather than
# assumed, so that mistake fails the run at the caller instead of silently
# weakening containment. deployment_bundle_services is absent in the playbooks
# that validate target paths without parsing controller inputs, and the shape
# check still applies there.
- name: Validate the named deployment target service
  ansible.builtin.assert:
    that:
      - deployment_target_service is string
      - deployment_target_service == '' or
        deployment_target_service is match('^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$')
      - deployment_target_service == '' or
        deployment_target_known_services | length == 0 or
        deployment_target_service in deployment_target_known_services
    fail_msg: >-
      A caller naming a deployment target service must name a service directory
      the controller manifest carries, not its Ansible role name. An empty
      string is written by the callers that own no single service.
  vars:
    deployment_target_known_services: >-
      {{ deployment_bundle_services | default([]) | map(attribute='name') | list }}

# A read-only check against pre-existing symlinks and canonical escapes, run
# once per distinct set of paths, before the tasks that mutate them: once for
# the play in site.yml pre_tasks, and once per role for the extra paths only
# that role knows it is about to touch. It is deliberately not repeated beside
# each individual mutation. That would narrow the window between check and use
# without closing it, because nothing here excludes a
# concurrent privileged filesystem mutation between two Ansible tasks; closing
# it takes the check inside the operation, against a held descriptor, the way
# library/atomic_safe_slurp.py does. A subprocess per mutation buys only the
# narrower window, so this role no longer spends one.
- name: Validate target path ancestry and canonical containment
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.python.executable }}"
      - -c
      - "{{ lookup('ansible.builtin.file', role_path ~ '/files/validate_target.py') }}"
      - "{{ nas_docker_root }}"
      - "{{ nas_media_root }}"
      - "{{ platform_release_dir }}"
      - "{{ platform_current_dir }}"
      - "{{ platform_deploy_root }}/.current-{{ platform_release_id }}"
      # Relaxed under --check, and only there. Activating the release is a
      # command task, which check mode skips, so `current` still names the
      # previous release when this runs -- requiring the new one would fail every
      # --check on a host that has ever deployed, which is every real target.
      # Containment is not weakened: the current-pointer branch still refuses a
      # pointer that escapes releases/ or whose basename is not a release id. Only
      # the equality check that check mode structurally cannot satisfy is dropped,
      # and a real run still passes 1.
      - >-
        {{ ((deployment_target_require_current_release | bool) and
            not ansible_check_mode) | ternary('1', '0') }}
      - "{{ deployment_target_candidate_paths | to_json }}"
  changed_when: false
  check_mode: false
  vars:
    deployment_target_candidate_paths: >-
      {{ (deployment_target_paths | list) +
         (deployment_target_service_paths | list) +
         (deployment_target_extra_paths | list) }}
    # The five paths every service role touches, built here rather than copied
    # into fifteen role bodies: the service directory in the current release,
    # both Compose files a selective run may deploy from, and the runtime
    # directory holding the rendered .env. A caller owning no single service
    # names the empty string and derives nothing.
    deployment_target_service_paths: >-
      {{ []
         if deployment_target_service | length == 0
         else [deployment_target_service_release,
               deployment_target_service_release ~ '/compose.yml',
               deployment_target_service_release ~ '/compose.' ~ platform_compose_kind ~ '.yml',
               deployment_target_service_runtime,
               deployment_target_service_runtime ~ '/.env'] }}
    deployment_target_service_release: >-
      {{ platform_current_dir ~ '/services/' ~ deployment_target_service }}
    deployment_target_service_runtime: >-
      {{ platform_runtime_dir ~ '/services/' ~ deployment_target_service }}
    deployment_target_paths: >-
      {{ [nas_docker_root,
          nas_docker_root ~ '/.nas-platform-preflight-probe',
          platform_deploy_root,
          platform_deploy_root ~ '/releases',
          platform_release_dir,
          platform_runtime_dir,
          platform_runtime_dir ~ '/services',
          platform_current_dir,
          platform_deploy_root ~ '/.release-' ~ platform_release_id,
          platform_deploy_root ~ '/.current-' ~ platform_release_id]
         + (deployment_bundle_services | default([])
            | map(attribute='name')
            | map('regex_replace', '^', platform_runtime_dir ~ '/services/')
            | list) }}

# Lets deployment_bundle's own body skip a validation the play already ran,
# while a playbook that uses the role without site.yml's pre_tasks still gets
# one. Mirrors deployment_bundle_controller_validated in controller.yml.
- name: Record target containment validation
  ansible.builtin.set_fact:
    deployment_bundle_target_validated: true
