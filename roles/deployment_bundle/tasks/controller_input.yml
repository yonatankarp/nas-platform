---
# One subprocess for every input (#333). The validator stops at the first refusal in
# list order, which tests/integration_controller.sh greps for; see inputs.yml.
- name: Validate controller bundle input identity
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - -c
      - "{{ lookup('ansible.builtin.file', role_path ~ '/files/validate_controller_input.py') }}"
      - --batch
      - "{{ playbook_dir }}"
      - "{{ deployment_controller_inputs | to_json }}"
  changed_when: false
  check_mode: false
  delegate_to: localhost
