---
# Production releases map one committed SHA to one exact checkout; tests opt out.
deployment_bundle_allow_dirty_controller: false
deployment_bundle_test_mode: false

# The poller's flock, derived exactly as roles/production_auto_deploy derives it, or
# it would be a lock nobody shares. No poller installed means no file and no guard.
deployment_bundle_lock_path: >-
  {{ ansible_facts['user_dir'] }}/.local/share/nas-platform/state/deployment.lock
# Pid of the lock holder acting for this run, exported by the launcher and the poller;
# empty for a bare ansible-playbook.
deployment_bundle_lock_owner: >-
  {{ lookup('ansible.builtin.env', 'PLATFORM_DEPLOYMENT_LOCK_OWNER') }}

# A variable so no test lane reaches real devices: tests point it at a dead address,
# which tests/deployment_summary_test.rb enforces.
deployment_pushover_api_url: https://api.pushover.net/1/messages.json

# A deployment is a run that moved the release; reports and summary must agree.
# Empty previous = first install; undefined = selective converge, nothing moved.
deployment_previous_release: >-
  {{ deployment_bundle_previous_release_id
     if deployment_bundle_previous_release_id is defined
     else platform_release_id }}
deployment_release_moved: >-
  {{ deployment_previous_release != platform_release_id }}
deployment_summary_checkout: "{{ playbook_dir }}"
deployment_summary_changes: []
deployment_summary_commits: []
# Set by the poller (#558): the summary is written there as JSON. Empty means nothing
# is written; site.yml must tolerate its absence.
deployment_summary_path: "{{ lookup('ansible.builtin.env', 'PLATFORM_DEPLOYMENT_SUMMARY_PATH') }}"
