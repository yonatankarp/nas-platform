---
beszel_port: 8090
beszel_app_url: "http://{{ platform_public_host }}:{{ beszel_port }}"
beszel_system_name: ASUSTOR-AS6704T

# Beszel persists one sample per minute. Three samples of freshness tolerance
# avoids false negatives from scheduling jitter while still rejecting a healthy
# agent that has stopped writing collection records. A 90-second poll spans the
# next expected sample without making verification unbounded.
# Host inventories must select an exact supported policy. Empty defaults fail
# closed if a new host class does not declare its telemetry capability.
beszel_required_telemetry_categories: []
beszel_require_gpu_telemetry: false
beszel_telemetry_freshness_seconds: 180
beszel_telemetry_poll_timeout_seconds: 90
beszel_telemetry_request_timeout_seconds: 3
beszel_telemetry_poll_delay_seconds: 3

# Alerts to maintain for the monitored system. name must be one of Beszel's alert
# types; value and min are its threshold and sustain period.
beszel_alerts:
  - name: Status
    value: 0
    min: 0
  - name: CPU
    value: 90
    min: 10
  - name: Memory
    value: 90
    min: 10
  - name: Disk
    value: 85
    min: 10

# Shoutrrr URL. Built from the Pushover application token and user key in vault,
# so the value Beszel stores is authored in one place rather than copied between
# two web interfaces -- the same property the ntfy form had, over a transport
# that reaches a phone without the NAS being reachable from it. Pushover itself
# takes only the application token and the user key, which are this URL's
# password and host and are what the two vault values are. The `shoutrrr` user
# component is a filler the library reads and discards: `pushover://:token@userkey/`
# is accepted just the same, measured against this pin. It is kept because an
# empty user component reads as a typo, not because anything requires it.
#
# Priority is deliberately not set, and the reason is NOT that the library caps
# it. Beszel 0.19.0 vendors nicholas-fedor/shoutrrr, whose priority is an int8
# with no clamp: `?priority=2` is accepted and sent, and only a value like
# `?priority=200` is refused -- by integer range, not by anything Pushover means.
# What is genuinely unreachable here is retry-until-acknowledged, because
# Pushover requires a retry and an expire alongside priority 2 and this service
# has nowhere to put them: asked for one, it names its own key set and refuses,
# `not a valid config key: expire (valid keys: [devices encryptionkey key
# priority title])`. A priority 2 set here would therefore pass shoutrrr and be
# refused at the far end, which is worse than not setting it. Do not design
# around priority 2.
#
# Every sentence above is measured against the pinned hub image rather than read
# from shoutrrr's documentation. The widely cited -1..1 cap belongs to
# containrrr's shoutrrr, a different fork from the one Beszel vendors, and it is
# what an earlier revision of this comment wrongly asserted.
beszel_notification_url: >-
  pushover://shoutrrr:{{ vault_pushover_token }}@{{ vault_pushover_user_key }}/
