---
beszel_port: 8090
beszel_app_url: "http://{{ platform_public_host }}:{{ beszel_port }}"
beszel_system_name: ASUSTOR-AS6704T

# Beszel persists one sample per minute. Three samples of freshness tolerance
# avoids false negatives from scheduling jitter while still rejecting a healthy
# agent that has stopped writing collection records. A 90-second poll spans the
# next expected sample without making verification unbounded.
# Host inventories must select an exact supported policy. Empty defaults fail
# closed if a new host class does not declare its telemetry capability.
beszel_required_telemetry_categories: []
beszel_require_gpu_telemetry: false
beszel_telemetry_freshness_seconds: 180
beszel_telemetry_poll_timeout_seconds: 90
beszel_telemetry_request_timeout_seconds: 3
beszel_telemetry_poll_delay_seconds: 3

# Alerts to maintain for the monitored system. name must be one of Beszel's alert
# types; value and min are its threshold and sustain period.
beszel_alerts:
  - name: Status
    value: 0
    min: 0
  - name: CPU
    value: 90
    min: 10
  - name: Memory
    value: 90
    min: 10
  - name: Disk
    value: 85
    min: 10

# Shoutrrr URL. Built from the Pushover application token and user key in vault,
# so the value Beszel stores is authored in one place rather than copied between
# two web interfaces -- the same property the ntfy form had, over a transport
# that reaches a phone without the NAS being reachable from it. `shoutrrr` is
# shoutrrr's own required placeholder for the URL's user component; Pushover
# itself takes the application token and the user key, which are what the two
# vault values are.
#
# Priority is deliberately not set here, and -1..1 is the whole range available
# if it ever is: shoutrrr's Pushover service carries no retry or expire
# parameter, and Pushover rejects priority 2 without them, so
# retry-until-acknowledged cannot be reached through this transport at all.
# Nothing should be designed around it.
beszel_notification_url: >-
  pushover://shoutrrr:{{ vault_pushover_token }}@{{ vault_pushover_user_key }}/
