---
# beszel_port and beszel_app_url live in inventory/group_vars/all/service_beszel.yml:
# the Dozzle alert relay validates Beszel's links against the same app URL.
beszel_system_name: ASUSTOR-AS6704T

# Beszel persists one sample per minute. Three samples of freshness tolerance
# avoids false negatives from scheduling jitter while still rejecting a healthy
# agent that has stopped writing collection records. A 90-second poll spans the
# next expected sample without making verification unbounded.
# Host inventories must select an exact supported policy. Empty defaults fail
# closed if a new host class does not declare its telemetry capability.
beszel_required_telemetry_categories: []
beszel_require_gpu_telemetry: false
beszel_telemetry_freshness_seconds: 180
beszel_telemetry_poll_timeout_seconds: 90
beszel_telemetry_request_timeout_seconds: 3
beszel_telemetry_poll_delay_seconds: 3

# Alerts to maintain for the monitored system. name must be one of Beszel's alert
# types; value and min are its threshold and sustain period.
beszel_alerts:
  - name: Status
    value: 0
    min: 0
  - name: CPU
    value: 90
    min: 10
  - name: Memory
    value: 90
    min: 10
  - name: Disk
    value: 85
    min: 10
  # Watches CPU, NVMe and cooling, not the SATA bay disks: the hub's temperature
  # panel on 2026-09-13 showed coretemp package/cores at ~64°C with spikes to
  # ~85°C under load, NVMe at ~51-54°C, acpitz at ~28°C, and no sensor for the
  # bay disks at all (SMART, #607, is what would cover those). In 0.19.0 an alert
  # with min above 1 fires only when the hottest sensor right now is above value
  # AND the hottest sensor's own mean over min minutes is above it, strictly
  # (internal/alerts/alerts_system.go:89-131,325-356). No PRIMARY_SENSOR is set,
  # so "hottest" is the max across sensors.
  #
  # 87, not the 85 #608 chose: 85 turned out to be where ordinary sustained load
  # sits, not a spike. On 2026-09-14 it fired at 16:38 ("coretemp_core_2 averaged
  # 85.53°C for the previous 15 minutes") and resolved at 16:41 at 84.47°C, and
  # 0.19.0 has no hysteresis, so a threshold at the load plateau re-notifies on
  # every crossing. 87 keeps the alert meaning sustained heat beyond normal load,
  # still well below the CPU's thermal limit. The Disk alert's 85 above is a
  # percentage and unrelated.
  - name: Temperature
    value: 87
    min: 15

# Shoutrrr URL. Beszel sends to the Dozzle alert relay's /beszel route, and the
# relay publishes to Pushover's Alerts application. It used to send to Pushover
# directly, at priority 1 for everything. Beszel 0.19.0 builds an alert and its
# recovery ("... below threshold", "... is up") from one stored webhook, so a
# direct URL gives both the same priority and every recovery rang like the
# problem it closed. The relay reads the title and sends a problem at 1, which
# rings through quiet hours, and its recovery at -1, a badge with no sound
# (services/dozzle/alert_relay.py: render_beszel).
#
# What Beszel stores, and shows on its settings page, is now the relay's bearer
# token instead of the Pushover Alerts token. That is the weaker credential:
# it can only POST to a relay on a private bridge, under the relay's own daily
# ceiling. It cannot publish to Pushover or reach any other application. The
# relay's token is still a secret. Dozzle already keeps it in cleartext (#172),
# and shoutrrr writes the whole URL into Beszel's log when a send fails, as it
# did the Pushover token before.
#
# The form, read from source at the pins and measured against a real 0.19.0 hub
# in #697. Beszel 0.19.0 vendors github.com/nicholas-fedor/shoutrrr v0.19.0,
# whose generic service:
#   - posts over plain http only with `disabletls=yes`;
#   - sends exactly {"message","title"} as application/json with
#     `template=json`, and Beszel adds the title only when a template is set;
#   - turns every `@` query key into a header.
# The header value is URL-encoded because it sits in a query string. `urlencode`
# turns the space into %20 and every reserved character into its escape, and
# shoutrrr decodes it back. #697 round-tripped `%2B`, `/`, `%3D`, `%26` and `%25`
# that way. `alert-relay` resolves on the external bridge host_prep creates,
# which only the hub and the relay join. The port is shared inventory
# (service_dozzle.yml), because Beszel converges before Dozzle and cannot read
# Dozzle's role defaults.
#
# Priority lives in the relay now, so nothing in this URL sets it, and the
# emergency priority the shoutrrr fork cannot send is still reachable only
# through the relay. Revert this value to go back to the direct URL. Nothing
# else has to be reverted with it: the relay keeps serving /beszel.
beszel_notification_url: >-
  generic://alert-relay:{{ dozzle_alert_relay_port }}/beszel?disabletls=yes&template=json&@Authorization={{ ('Bearer ' ~ vault_dozzle_alert_relay_token) | urlencode }}

# Pushover's own credential check, which is the only thing on this platform that
# can tell a working notification chain from a stored string. Pushover documents
# validation requests as exempt from the message quota, so running one on every
# verification costs nothing and sends nothing to anybody's phone.
#
# A variable rather than a literal for the reason
# production_auto_deploy_github_api_base is one: the endpoint has to be
# redirectable to prove the task's own branches without involving the real
# service.
beszel_pushover_validation_url: https://api.pushover.net/1/users/validate.json
