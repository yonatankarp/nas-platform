---
# Derived values, evaluated lazily where used rather than stored as host facts.
beszel_api: "http://127.0.0.1:{{ beszel_port }}"
beszel_compose_project_name: >-
  {{ (platform_project_name ~ '-beszel')
     if platform_project_name | default('') | length > 0 else 'beszel' }}

# Records returned by URL-encoded PocketBase identity filters. Jinja repeats the
# exact match defensively after each read; task assertions verify the filtered
# result fits in the complete response page before reconciliation proceeds.
beszel_matching_users: >-
  {{ beszel_users.json.get('items', [])
     | selectattr('email', 'equalto', vault_beszel_app_user_email) | list }}

beszel_user_filter: "email = {{ vault_beszel_app_user_email | to_json }}"
beszel_token_filter: "user = {{ beszel_user_id | default('') | to_json }}"
beszel_settings_filter: "user = {{ beszel_user_id | default('') | to_json }}"
beszel_system_filter: "name = {{ beszel_system_name | to_json }}"

beszel_effective_required_telemetry_categories: >-
  {{ beszel_required_telemetry_categories }}

beszel_latest_system_stats_record: >-
  {{ beszel_system_stats | default({}) | beszel_latest_telemetry_record }}
beszel_latest_system_stats: >-
  {{ beszel_latest_system_stats_record.get('stats', {}) }}
beszel_latest_container_stats_record: >-
  {{ beszel_container_stats | default({}) | beszel_latest_telemetry_record }}
beszel_latest_container_stats: >-
  {{ beszel_latest_container_stats_record.get('stats', []) }}
beszel_telemetry_system_id: >-
  {{ (beszel_matching_systems | first | default({})).get('id', '[absent]') }}

beszel_telemetry_evidence: >-
  {{ beszel_telemetry_system_id | beszel_telemetry_evidence(
       beszel_latest_system_stats_record,
       beszel_latest_container_stats_record,
       beszel_effective_required_telemetry_categories,
       beszel_telemetry_freshness_seconds | int) }}
beszel_missing_system_telemetry_categories: >-
  {{ beszel_telemetry_evidence.missing_categories | difference(['containers']) }}
beszel_missing_telemetry_categories: >-
  {{ beszel_telemetry_evidence.missing_categories }}
beszel_core_telemetry_ready: >-
  {{ 'core' not in beszel_missing_telemetry_categories }}
beszel_disk_telemetry_ready: >-
  {{ 'disk' not in beszel_missing_telemetry_categories }}
beszel_gpu_telemetry_ready: >-
  {{ 'gpu' not in beszel_missing_telemetry_categories }}
beszel_containers_telemetry_ready: >-
  {{ 'containers' not in beszel_missing_telemetry_categories }}

beszel_matching_settings: >-
  {{ beszel_settings.json.get('items', [])
     | selectattr('user', 'equalto', beszel_user_id | default('')) | list }}

beszel_current_notification_settings: "{{ (beszel_matching_settings | first | default({})).settings | default({}) }}"

beszel_matching_systems: >-
  {{ beszel_systems.json.get('items', [])
     | selectattr('name', 'equalto', beszel_system_name)
     | selectattr('users', 'contains', beszel_user_id | default('')) | list }}

beszel_wrong_owner_systems: >-
  {{ beszel_systems.json.get('items', [])
     | selectattr('name', 'equalto', beszel_system_name)
     | rejectattr('users', 'contains', beszel_user_id | default('')) | list }}

beszel_agent_enabled: >-
  {{ (platform_beszel_agent_available | bool) and
     (platform_beszel_agent_kind == 'portable' or preflight_gpu_available | bool) }}

beszel_agent_service: >-
  {{ ('agent-' ~ platform_beszel_agent_kind) if beszel_agent_enabled else '' }}

beszel_inactive_agent_services: >-
  {{ ['agent-portable', 'agent-intel'] | reject('equalto', beszel_agent_service) | list }}

beszel_compose_cli_argv: >-
  {{ ['docker', 'compose', '--project-directory',
     platform_current_dir ~ '/services/beszel', '--project-name',
     beszel_compose_project_name]
     + (beszel_compose_files
        | map('regex_replace', '^',
              '--file=' ~ platform_current_dir ~ '/services/beszel/') | list)
     + ['--env-file', platform_runtime_dir ~ '/services/beszel/.env'] }}
