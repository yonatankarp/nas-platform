---
# Derived values, evaluated lazily where used rather than stored as host facts.
beszel_api: "http://127.0.0.1:{{ beszel_port }}"
beszel_compose_project_name: >-
  {{ (platform_project_name ~ '-beszel')
     if platform_project_name | default('') | length > 0 else 'beszel' }}

# Records from URL-encoded PocketBase identity filters, re-matched exactly in
# Jinja; tasks verify the result fits in one response page.
beszel_matching_users: >-
  {{ beszel_users.json.get('items', [])
     | selectattr('email', 'equalto', vault_beszel_app_user_email) | list }}

beszel_user_filter: "email = {{ vault_beszel_app_user_email | to_json }}"
beszel_token_filter: "user = {{ beszel_user_id | default('') | to_json }}"
beszel_settings_filter: "user = {{ beszel_user_id | default('') | to_json }}"
beszel_system_filter: "name = {{ beszel_system_name | to_json }}"

beszel_integration_test_capability: >-
  {{ (platform_compose_kind | default('') == 'integration') and
     (deployment_bundle_test_mode | default(false) | bool) }}
beszel_effective_required_telemetry_categories: >-
  {{ ['core', 'disk', 'containers']
     if (beszel_integration_test_capability | bool)
     else beszel_required_telemetry_categories }}
beszel_effective_require_gpu_telemetry: >-
  {{ false
     if (beszel_integration_test_capability | bool)
     else (beszel_require_gpu_telemetry | bool) }}

beszel_matching_settings: >-
  {{ beszel_settings.json.get('items', [])
     | selectattr('user', 'equalto', beszel_user_id | default('')) | list }}

beszel_current_notification_settings: "{{ (beszel_matching_settings | first | default({})).settings | default({}) }}"

beszel_matching_systems: >-
  {{ beszel_systems.json.get('items', [])
     | selectattr('name', 'equalto', beszel_system_name)
     | selectattr('users', 'contains', beszel_user_id | default('')) | list }}

beszel_wrong_owner_systems: >-
  {{ beszel_systems.json.get('items', [])
     | selectattr('name', 'equalto', beszel_system_name)
     | rejectattr('users', 'contains', beszel_user_id | default('')) | list }}

# beszel_remote_systems, read in one request. The read is skipped when the list
# is empty (an empty filter is not a filter), so every reader defaults its json.
beszel_remote_system_names: "{{ beszel_remote_systems | map(attribute='name') | list }}"
# former_names -> name. The hub keeps the name an agent first registered under,
# so a rename is made on the record (configure.yml), found by its former name.
beszel_remote_former_pairs: "{{ beszel_remote_systems | subelements('former_names', skip_missing=True) }}"
beszel_remote_former_to_current: >-
  {{ dict(beszel_remote_former_pairs | map('last')
          | zip(beszel_remote_former_pairs | map('first') | map(attribute='name'))) }}
beszel_remote_system_read_names: "{{ beszel_remote_system_names + (beszel_remote_former_to_current | list) }}"
beszel_remote_system_filter: >-
  {{ beszel_remote_system_read_names | map('to_json') | map('regex_replace', '^', 'name = ')
     | join(' || ') }}
beszel_remote_system_records: >-
  {{ (beszel_remote_systems_read.json | default({}, true)).get('items', [])
     | selectattr('name', 'in', beszel_remote_system_read_names) | list }}
beszel_remote_owned_records: >-
  {{ beszel_remote_system_records
     | selectattr('users', 'contains', beszel_user_id | default('')) | list }}
beszel_remote_owned_former_records: >-
  {{ beszel_remote_owned_records
     | selectattr('name', 'in', beszel_remote_former_to_current | list) | list }}
# Under their current names, a record configure.yml renames included as {id, name}.
beszel_remote_owned_systems: >-
  {{ (beszel_remote_owned_records | selectattr('name', 'in', beszel_remote_system_names) | list)
     + (beszel_remote_renames | default([])) }}
# A former-name record beside one under the current name: not renamed, reported.
beszel_remote_lingering_systems: >-
  {{ beszel_remote_owned_former_records
     | rejectattr('id', 'in', beszel_remote_renames | default([]) | map(attribute='id') | list) | list }}
beszel_remote_wrong_owner_systems: >-
  {{ beszel_remote_system_records
     | rejectattr('users', 'contains', beszel_user_id | default('')) | list }}
beszel_remote_absent_names: >-
  {{ beszel_remote_system_names
     | reject('in', beszel_remote_owned_systems | map(attribute='name') | list) | list }}

beszel_agent_enabled: >-
  {{ (platform_beszel_agent_available | bool) and
     (platform_beszel_agent_kind == 'portable' or preflight_gpu_available | bool) }}

beszel_agent_service: >-
  {{ ('agent-' ~ platform_beszel_agent_kind) if beszel_agent_enabled else '' }}

beszel_inactive_agent_services: >-
  {{ ['agent-portable', 'agent-intel'] | reject('equalto', beszel_agent_service) | list }}

beszel_compose_cli_argv: >-
  {{ ['docker', 'compose', '--project-directory',
     platform_current_dir ~ '/services/beszel', '--project-name',
     beszel_compose_project_name]
     + (['--file=' ~ platform_current_dir ~ '/services/beszel/']
        | product(platform_service_compose_files['beszel'])
        | map('join') | list)
     + ['--env-file', platform_runtime_dir ~ '/services/beszel/.env'] }}

# S.M.A.R.T. slots as [Compose variable, declared path], in Compose order. zip
# stops at the shorter side; deploy.yml's count assertion makes that the list.
beszel_smart_device_slots: >-
  {{ (['NAS_SMART_SATA_DEVICE_1', 'NAS_SMART_SATA_DEVICE_2', 'NAS_SMART_SATA_DEVICE_3']
      | zip(platform_smart_sata_devices) | list)
     + (['NAS_SMART_NVME_NAMESPACE_1', 'NAS_SMART_NVME_NAMESPACE_2']
      | zip(platform_smart_nvme_namespaces) | list) }}
# Declared paths deploy.yml found as a device node. Docker refuses a regular file
# or a directory in devices: as firmly as an absent path, so existence is not enough.
beszel_smart_present_devices: >-
  {{ (beszel_smart_device_stats.results | selectattr('stat.exists')
      | selectattr('stat.isblk') | map(attribute='item.1') | list)
     + (beszel_smart_device_stats.results | selectattr('stat.exists')
      | selectattr('stat.ischr') | map(attribute='item.1') | list) }}
beszel_smart_missing_slots: >-
  {{ beszel_smart_device_slots | rejectattr('1', 'in', beszel_smart_present_devices) | list }}
# What env.j2 renders: present devices by slot. A slot not in here is /dev/null.
beszel_smart_rendered_slots: >-
  {{ dict(beszel_smart_device_slots | selectattr('1', 'in', beszel_smart_present_devices) | list) }}
