---
argument_specs:
  main:
    short_description: Deploy Beszel and wire it to ntfy with no value read back
    description:
      - Installs the hub keypair from vault before first start, so the agent key
        and universal token are known in advance and the run converges in one pass.
    options:
      platform_kind:
        type: str
        required: true
        choices: [nas, mac]
        description: Selects the persisted telemetry capability policy.
      platform_compose_kind:
        type: str
        required: true
        description: Platform-specific Compose override suffix selected by the bundle.
      platform_project_name:
        type: str
        required: false
        description: Disposable Mac proof namespace; empty preserves canonical NAS naming.
      platform_public_host:
        type: str
        required: true
      platform_callback_host:
        type: str
        required: true
      platform_render_device_path:
        type: path
        required: true
        description: Host render device exported to the Beszel agent environment.
      platform_beszel_agent_available:
        type: bool
        required: true
      platform_beszel_agent_kind:
        type: str
        required: true
        choices: [intel, portable]
      beszel_port:
        type: int
        required: false
      beszel_app_url:
        type: str
        required: false
      beszel_system_name:
        type: str
        required: false
      beszel_required_telemetry_categories:
        type: list
        elements: str
        required: false
        description: Persisted categories required on every supported platform.
      beszel_require_gpu_telemetry:
        type: bool
        required: false
        description: Whether the platform must persist native GPU telemetry.
      beszel_telemetry_freshness_seconds:
        type: int
        required: false
        description: Maximum accepted age of a persisted one-minute sample.
      beszel_telemetry_poll_timeout_seconds:
        type: int
        required: false
        description: Maximum bounded wait for required persisted telemetry.
      beszel_telemetry_request_timeout_seconds:
        type: int
        required: false
        description: Per-request timeout included in the shared telemetry budget.
      beszel_telemetry_poll_delay_seconds:
        type: int
        required: false
        description: Delay between persisted collection reads.
      beszel_alerts:
        type: list
        elements: dict
        required: false
        options:
          name:
            type: str
            required: true
          value:
            type: int
            required: true
          min:
            type: int
            required: true
      beszel_notification_url:
        type: str
        required: false
        description: Shoutrrr URL, built from the ntfy token in vault.
      vault_beszel_hub_private_key:
        type: str
        required: true
        description: OpenSSH ed25519 private key placed at /beszel_data/id_ed25519.
      vault_beszel_agent_key:
        type: str
        required: true
        description: Public half of that keypair, given to the agent as KEY.
      vault_beszel_universal_token:
        type: str
        required: true
      vault_beszel_superuser_email:
        type: str
        required: true
      vault_beszel_superuser_password:
        type: str
        required: true
      vault_beszel_app_user_email:
        type: str
        required: true
      vault_beszel_app_user_password:
        type: str
        required: true
      vault_ntfy_beszel_token:
        type: str
        required: true
