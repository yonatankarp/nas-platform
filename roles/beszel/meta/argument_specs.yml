---
argument_specs:
  main:
    short_description: Deploy Beszel and wire it to the Dozzle alert relay with no value read back
    description:
      - Installs the hub keypair from vault before first start, so the agent key
        and universal token are known in advance and the run converges in one pass.
    options:
      platform_kind:
        type: str
        required: true
        choices: [nas, mac]
        description: Selects the persisted telemetry capability policy.
      platform_compose_kind:
        type: str
        required: true
        description: Platform-specific Compose override suffix selected by the bundle.
      platform_project_name:
        type: str
        required: false
        description: Disposable Mac proof namespace; empty preserves canonical NAS naming.
      platform_alert_relay_network:
        type: str
        required: true
        description: External bridge host_prep creates for Beszel's hub to reach the Dozzle alert relay.
      platform_public_host:
        type: str
        required: true
      platform_callback_host:
        type: str
        required: true
      platform_render_device_path:
        type: path
        required: true
        description: Host render device exported to the Beszel agent environment.
      platform_smart_sata_devices:
        type: list
        elements: path
        required: true
        description: SATA base devices the Intel agent reads S.M.A.R.T. from; empty off the NAS.
      platform_smart_nvme_namespaces:
        type: list
        elements: path
        required: true
        description: NVMe namespaces mapped onto the Intel agent's controller paths; empty off the NAS.
      platform_beszel_agent_available:
        type: bool
        required: true
      platform_beszel_agent_kind:
        type: str
        required: true
        choices: [intel, portable]
      beszel_port:
        type: int
        required: false
      beszel_app_url:
        type: str
        required: false
      beszel_system_name:
        type: str
        required: false
      beszel_required_telemetry_categories:
        type: list
        elements: str
        required: false
        description: Persisted categories required on every supported platform.
      beszel_require_gpu_telemetry:
        type: bool
        required: false
        description: Whether the platform must persist native GPU telemetry.
      beszel_telemetry_freshness_seconds:
        type: int
        required: false
        description: Maximum accepted age of a persisted one-minute sample.
      beszel_telemetry_poll_timeout_seconds:
        type: int
        required: false
        description: Maximum bounded wait for required persisted telemetry.
      beszel_telemetry_request_timeout_seconds:
        type: int
        required: false
        description: Per-request timeout included in the shared telemetry budget.
      beszel_telemetry_poll_delay_seconds:
        type: int
        required: false
        description: Delay between persisted collection reads.
      beszel_alerts:
        type: list
        elements: dict
        required: false
        options:
          name:
            type: str
            required: true
          value:
            type: int
            required: true
          min:
            type: int
            required: true
      beszel_notification_url:
        type: str
        required: false
        description: Shoutrrr URL naming the Dozzle alert relay's /beszel route, authenticated with the relay token from vault.
      beszel_pushover_validation_url:
        type: str
        required: false
        description: Pushover endpoint answering whether the managed pair is still valid.
      vault_beszel_hub_private_key:
        type: str
        required: true
        description: OpenSSH ed25519 private key placed at /beszel_data/id_ed25519.
      vault_beszel_agent_key:
        type: str
        required: true
        description: Public half of that keypair, given to the agent as KEY.
      vault_beszel_universal_token:
        type: str
        required: true
      vault_beszel_superuser_email:
        type: str
        required: true
      vault_beszel_superuser_password:
        type: str
        required: true
      vault_beszel_app_user_email:
        type: str
        required: true
      vault_beszel_app_user_password:
        type: str
        required: true
      dozzle_alert_relay_port:
        type: int
        required: true
        description: The Dozzle alert relay's container port, shared inventory in service_dozzle.yml.
      vault_dozzle_alert_relay_token:
        type: str
        required: true
        description: Bearer token the relay's /beszel route requires; carried in the notification URL.
      vault_pushover_alerts_token:
        type: str
        required: true
        description: Pushover Alerts application token; only validated here, the relay sends with it.
      vault_pushover_containers_token:
        type: str
        required: true
        description: Pushover Containers application token; only validated here.
      vault_pushover_deployments_token:
        type: str
        required: true
        description: Pushover Deployments application token; only validated here.
      vault_pushover_media_token:
        type: str
        required: true
        description: Pushover Media application token; only validated here.
      vault_pushover_user_key:
        type: str
        required: true
        description: Pushover user key; the URL's host component.
      # The managed-user parameters this role hands roles/managed_users. Only
      # the ones that resolve at role entry are declared: Ansible templates
      # every declared option before the role's first task, so declaring
      # beszel_managed_users_create_body, _repair_body, _repair_condition,
      # _reconcile_path, _authenticate_body, _authenticate_identity,
      # _authenticated_id or _list_json -- each a template over the shared
      # role's per-identity `item`, its bound match or user, or the listing it
      # registers -- would fail this role at "Validating arguments against arg
      # spec 'main'". roles/managed_users asserts their presence instead.
      beszel_managed_users_identity_attribute:
        type: str
        required: false
      beszel_managed_users_id_attribute:
        type: str
        required: false
      beszel_managed_users_id_pattern:
        type: str
        required: false
      beszel_managed_users_list_path:
        type: str
        required: false
      beszel_managed_users_authenticate_path:
        type: str
        required: false
      beszel_managed_users_create_path:
        type: str
        required: false
      beszel_managed_users_reconcile_interface:
        description: >-
          The interfaces.reconcile value config/managed-user-capabilities.yml
          declares for Beszel, asserted against the deployed register.
        type: str
        required: false
      beszel_managed_users_create_status:
        type: list
        elements: int
        required: false
      beszel_managed_users_repair_status:
        type: list
        elements: int
        required: false
      beszel_managed_users_listing_conditions:
        description: >-
          Brace-free pagination refusals the shared role asserts in order
          against both listings. Unbraced, so they are safe to declare here.
        type: list
        elements: str
        required: false
      beszel_managed_users_verify_conditions:
        description: >-
          Brace-free expressions the shared role's final verification asserts in
          order. Unbraced, so they are safe to declare here.
        type: list
        elements: str
        required: false
      beszel_managed_users_verify_fail_msg:
        type: str
        required: false
      beszel_managed_users_plan_create_message:
        type: str
        required: false
      beszel_managed_users_plan_repair_message:
        type: str
        required: false
