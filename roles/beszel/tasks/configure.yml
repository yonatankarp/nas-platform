---
# Everything the resolved application user owns. Gated on beszel_user_id because
# a dry run resolves no id and every read below keys on it.

- name: Report when Beszel configuration cannot continue
  ansible.builtin.debug:
    msg: >-
      No application user id resolved, so the universal token, notification URL
      and alerts were skipped. Expected during a dry run, where no record is
      created.
  when: beszel_user_id | length == 0

- name: Configure the application user
  when: beszel_user_id | length > 0
  block:
    # Authored verbatim, which Beszel accepts, so the agent's TOKEN comes from
    # vault rather than a value revealed in the hub's settings page.
    - name: List universal tokens
      tags: [platform_verify_beszel]
      ansible.builtin.uri:
        url: >-
          {{ beszel_api }}/api/collections/universal_tokens/records?perPage=500&filter={{
             beszel_token_filter | urlencode }}
        headers:
          Authorization: "{{ beszel_auth.json.token }}"
      register: beszel_tokens
      changed_when: false
      check_mode: false
      no_log: true

    - name: Require the complete managed universal token result set
      ansible.builtin.assert:
        that: beszel_tokens.json.get('totalPages', 0) | int <= 1
        fail_msg: Managed universal token identity returned more than 500 records; refusing incomplete reconciliation.

    - name: Refuse duplicate managed universal tokens
      tags: [platform_verify_beszel]
      ansible.builtin.assert:
        that:
          - (beszel_tokens.json.get('items', [])
             | selectattr('user', 'equalto', beszel_user_id) | list | length) <= 1
        fail_msg: >-
          Duplicate managed universal token record IDs:
          {{ beszel_tokens.json.get('items', [])
             | selectattr('user', 'equalto', beszel_user_id)
             | map(attribute='id') | join(',') }}
      no_log: false

    - name: Create the universal token from vault
      ansible.builtin.uri:
        url: "{{ beszel_api }}/api/collections/universal_tokens/records"
        method: POST
        headers:
          Authorization: "{{ beszel_auth.json.token }}"
        body_format: json
        body:
          user: "{{ beszel_user_id }}"
          token: "{{ vault_beszel_universal_token }}"
        status_code: [200]
      when: >-
        beszel_tokens.json.get('items', [])
        | selectattr('user', 'equalto', beszel_user_id) | list | length == 0
      changed_when: true
      no_log: true

    - name: Reconcile the universal token from vault
      ansible.builtin.uri:
        url: "{{ beszel_api }}/api/collections/universal_tokens/records/{{ beszel_managed_token.id }}"
        method: PATCH
        headers:
          Authorization: "{{ beszel_auth.json.token }}"
        body_format: json
        body:
          token: "{{ vault_beszel_universal_token }}"
        status_code: [200]
      when:
        - (beszel_tokens.json.get('items', [])
           | selectattr('user', 'equalto', beszel_user_id) | list | length) == 1
        - (beszel_tokens.json.get('items', [])
           | selectattr('user', 'equalto', beszel_user_id) | first).token
          != vault_beszel_universal_token
      changed_when: true
      no_log: true
      vars:
        beszel_managed_token: >-
          {{ beszel_tokens.json.get('items', [])
             | selectattr('user', 'equalto', beszel_user_id) | first }}

    - name: Report planned universal token reconciliation
      ansible.builtin.debug:
        msg: Managed universal token would be created or reconciled from vault.
      when:
        - ansible_check_mode
        - >-
          (beszel_tokens.json.get('items', [])
           | selectattr('user', 'equalto', beszel_user_id) | list | length) == 0
          or ((beszel_tokens.json.get('items', [])
               | selectattr('user', 'equalto', beszel_user_id) | list | length) == 1
              and (beszel_tokens.json.get('items', [])
                   | selectattr('user', 'equalto', beszel_user_id) | first).token
                  != vault_beszel_universal_token)
      changed_when: true
      no_log: true

    - name: Refresh universal tokens after reconciliation
      tags: [platform_verify_beszel]
      ansible.builtin.uri:
        url: >-
          {{ beszel_api }}/api/collections/universal_tokens/records?perPage=500&filter={{
             beszel_token_filter | urlencode }}
        headers:
          Authorization: "{{ beszel_auth.json.token }}"
      register: beszel_tokens
      changed_when: false
      check_mode: false
      no_log: true

    - name: Verify the exact managed universal token
      tags: [platform_verify_beszel]
      ansible.builtin.assert:
        that:
          - (beszel_tokens.json.get('items', [])
             | selectattr('user', 'equalto', beszel_user_id) | list | length) == 1
          - (beszel_tokens.json.get('items', [])
             | selectattr('user', 'equalto', beszel_user_id) | first).token
            == vault_beszel_universal_token
        fail_msg: Managed universal token is absent, duplicated, or differs from vault.
      no_log: true
      when: not ansible_check_mode

    - name: List notification settings
      tags: [platform_verify_beszel]
      ansible.builtin.uri:
        url: >-
          {{ beszel_api }}/api/collections/user_settings/records?perPage=500&filter={{
             beszel_settings_filter | urlencode }}
        headers:
          Authorization: "{{ beszel_auth.json.token }}"
      register: beszel_settings
      changed_when: false
      check_mode: false
      no_log: true

    - name: Require the complete managed notification settings result set
      ansible.builtin.assert:
        that: beszel_settings.json.get('totalPages', 0) | int <= 1
        fail_msg: Managed notification settings identity returned more than 500 records; refusing incomplete reconciliation.

    - name: Refuse duplicate managed notification settings
      tags: [platform_verify_beszel]
      ansible.builtin.assert:
        that: beszel_matching_settings | length <= 1
        fail_msg: >-
          Duplicate managed notification setting record IDs:
          {{ beszel_matching_settings | map(attribute='id') | join(',') }}
      no_log: false

    - name: Create absent notification settings
      ansible.builtin.uri:
        url: "{{ beszel_api }}/api/collections/user_settings/records"
        method: POST
        headers:
          Authorization: "{{ beszel_auth.json.token }}"
        body_format: json
        body:
          user: "{{ beszel_user_id }}"
        status_code: [200]
      when: beszel_matching_settings | length == 0
      changed_when: true
      no_log: true

    # Beszel's create hook authors email/chart defaults and intentionally
    # replaces a settings payload supplied on POST. Read that created record,
    # then PATCH the managed webhook while preserving its defaults.
    - name: Refresh notification settings after creation
      tags: [platform_verify_beszel]
      ansible.builtin.uri:
        url: >-
          {{ beszel_api }}/api/collections/user_settings/records?perPage=500&filter={{
             beszel_settings_filter | urlencode }}
        headers:
          Authorization: "{{ beszel_auth.json.token }}"
      register: beszel_settings
      changed_when: false
      check_mode: false
      no_log: true

    - name: Point Beszel notifications at the Dozzle alert relay
      ansible.builtin.uri:
        url: "{{ beszel_api }}/api/collections/user_settings/records/{{ (beszel_matching_settings | first).id }}"
        method: PATCH
        headers:
          Authorization: "{{ beszel_auth.json.token }}"
        body_format: json
        body:
          settings: >-
            {{ beszel_current_notification_settings
               | combine({'webhooks': [beszel_notification_url | trim]}) }}
        status_code: [200]
      when:
        - beszel_matching_settings | length == 1
        - (beszel_current_notification_settings.webhooks | default([]))
          != [beszel_notification_url | trim]
      changed_when: true
      no_log: true

    - name: Report planned notification webhook reconciliation
      ansible.builtin.debug:
        msg: Managed alert relay notification webhook would be created or reconciled.
      when:
        - ansible_check_mode
        - beszel_matching_settings | length == 0
          or (beszel_matching_settings | length == 1
              and (beszel_current_notification_settings.webhooks | default([]))
                  != [beszel_notification_url | trim])
      changed_when: true

    - name: Refresh notification settings after reconciliation
      tags: [platform_verify_beszel]
      ansible.builtin.uri:
        url: >-
          {{ beszel_api }}/api/collections/user_settings/records?perPage=500&filter={{
             beszel_settings_filter | urlencode }}
        headers:
          Authorization: "{{ beszel_auth.json.token }}"
      register: beszel_settings
      changed_when: false
      check_mode: false
      no_log: true

    # The scheme is the only part of the URL a diagnostic may name, and it must
    # be the managed URL's own, or the correct webhook prints [REDACTED] (#598).
    - name: Summarize the managed relay webhook without URL bodies
      tags: [platform_verify_beszel]
      ansible.builtin.set_fact:
        beszel_webhook_record_count: "{{ beszel_matching_settings | length }}"
        beszel_webhook_exact: >-
          {{ beszel_matching_settings | length == 1 and
             (beszel_current_notification_settings.webhooks | default([]))
             == [beszel_notification_url | trim] }}
        beszel_webhook_scheme: >-
          {{ 'generic'
             if (beszel_current_notification_settings.webhooks | default([])
                 | select('match', '^generic://') | list | length)
                == (beszel_current_notification_settings.webhooks | default([]) | length)
                and (beszel_current_notification_settings.webhooks | default([]) | length) > 0
             else '[REDACTED]' }}
      no_log: true

    - name: Verify the managed relay webhook
      tags: [platform_verify_beszel]
      ansible.builtin.assert:
        that:
          - beszel_webhook_record_count | int == 1
          - beszel_webhook_exact | bool
        fail_msg: >-
          Managed relay webhook differs (records={{ beszel_webhook_record_count }},
          exact={{ beszel_webhook_exact }},
          scheme={{ beszel_webhook_scheme | default('[REDACTED]') }}).
      no_log: false
      when: not ansible_check_mode

    # The only check here that proves the stored credentials still work, by
    # asking Pushover. Kept off the converge by a `when` on ansible_run_tags, not
    # by `never` alone: inherited role tags (--tags beszel, the CI lane) select a
    # `never` task. `never` stays so --list-tasks omits them.
    - name: Ask Pushover whether it still accepts the managed credentials
      tags: [never, platform_verify_beszel]
      when: "'platform_verify_beszel' in ansible_run_tags"
      # Every Pushover application token, not only Alerts: this is the one place
      # credentials are proved. The loop carries vault key NAMES, so a verdict is
      # attributed to a key without the value reaching any message.
      loop:
        - vault_pushover_alerts_token
        - vault_pushover_containers_token
        - vault_pushover_deployments_token
        - vault_pushover_media_token
        - vault_pushover_golem_token
      ansible.builtin.uri:
        url: "{{ beszel_pushover_validation_url }}"
        method: POST
        body_format: form-urlencoded
        body:
          token: "{{ lookup('ansible.builtin.vars', item) }}"
          user: "{{ vault_pushover_user_key }}"
        # 200 accepts, 400 refuses; anything else is not an answer (handled below).
        status_code: [200, 400]
        # Third-party budget, deliberately no retry ladder: a missed verdict is
        # harmless and announced by the debug below.
        timeout: "{{ platform_download_timeout }}"
      register: beszel_pushover_validation
      # The verdict is the assert's; otherwise deploys would hinge on Pushover's uptime.
      failed_when: false
      changed_when: false
      check_mode: false
      no_log: true

    - name: Summarize the Pushover answer without the credentials it carried
      tags: [never, platform_verify_beszel]
      when: "'platform_verify_beszel' in ansible_run_tags"
      ansible.builtin.set_fact:
        # -1 default: a module that refused before any request registers no
        # status, and must never read as "refused". A verdict needs BOTH an
        # authoritative code and Pushover's own status field (a captive portal can
        # return 200). Only key names and a count are collected, never a response.
        beszel_pushover_refused_tokens: >-
          {%- set verdicts = namespace(refused=[]) -%}
          {%- for result in beszel_pushover_validation.results | default([]) -%}
          {%- set body = result.json | default({}, true) -%}
          {%- set answer = (body.get('status', -1) | int) if body is mapping else -1 -%}
          {%- if (result.status | default(-1) | int) in [200, 400] and answer == 0 -%}
          {%- set verdicts.refused = verdicts.refused + [result.item] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ verdicts.refused | join(', ') }}
        beszel_pushover_unanswered_count: >-
          {%- set verdicts = namespace(unanswered=0) -%}
          {%- for result in beszel_pushover_validation.results | default([]) -%}
          {%- set body = result.json | default({}, true) -%}
          {%- set answer = (body.get('status', -1) | int) if body is mapping else -1 -%}
          {%- if not ((result.status | default(-1) | int) in [200, 400] and answer in [0, 1]) -%}
          {%- set verdicts.unanswered = verdicts.unanswered + 1 -%}
          {%- endif -%}
          {%- endfor -%}
          {{ verdicts.unanswered }}
      no_log: true

    # A separate unredacted task: no_log suppresses success_msg but not
    # fail_msg, so the assert cannot report "Pushover did not answer".
    - name: Report that Pushover did not answer, which is not a refusal
      tags: [never, platform_verify_beszel]
      ansible.builtin.debug:
        msg: >-
          Pushover did not answer for {{ beszel_pushover_unanswered_count }} of
          the application tokens, so their validity is unverified this run.
          This is not a refusal and is not a failure; the managed webhook was
          still reconciled.
      when:
        - "'platform_verify_beszel' in ansible_run_tags"
        - beszel_pushover_unanswered_count | int > 0

    # fail_msg is finalized on the passing path too, so it names only the derived
    # key list. No check-mode gate: this read really runs under --check.
    - name: Verify Pushover still accepts the managed credentials
      tags: [never, platform_verify_beszel]
      when: "'platform_verify_beszel' in ansible_run_tags"
      ansible.builtin.assert:
        that:
          - beszel_pushover_refused_tokens | length == 0
        fail_msg: >-
          Pushover refused the managed credentials for
          {{ beszel_pushover_refused_tokens }}. Check each named token against
          its application's own page at pushover.net and vault_pushover_user_key
          against the account dashboard -- a refusal of every token is the user
          key; a token regenerated in the console has to be re-authored in
          vault. Until it is, that application delivers nothing. Values are not
          shown.
      # Redacted because fail_msg names vault keys (tests/policy_vault_test.rb);
      # no_log still shows fail_msg. No success_msg: no_log would hide it.
      no_log: true

    # Alerts relate to a system, which exists once the agent has registered.
    - name: Wait for the agent to register its system
      tags: [platform_verify_beszel]
      ansible.builtin.uri:
        url: >-
          {{ beszel_api }}/api/collections/systems/records?perPage=500&filter={{
             beszel_system_filter | urlencode }}
        headers:
          Authorization: "{{ beszel_auth.json.token }}"
      register: beszel_systems
      until: beszel_matching_systems | length > 0
      retries: "{{ beszel_agent_enabled | ternary(platform_readiness_retries, 1) }}"
      delay: "{{ platform_readiness_delay }}"
      failed_when: false
      changed_when: false
      check_mode: false
      no_log: true

    - name: Require the complete same-name system result set
      ansible.builtin.assert:
        that: beszel_systems.json.get('totalPages', 0) | int <= 1
        fail_msg: Managed system name returned more than 500 records; refusing incomplete reconciliation.

    - name: Refuse same-name systems outside the managed user relation
      tags: [platform_verify_beszel]
      ansible.builtin.assert:
        that: beszel_wrong_owner_systems | length == 0
        fail_msg: >-
          Same-name wrong-owner system record IDs:
          {{ beszel_wrong_owner_systems | map(attribute='id') | join(',') }}
      no_log: false

    - name: Refuse duplicate managed systems
      tags: [platform_verify_beszel]
      ansible.builtin.assert:
        that: beszel_matching_systems | length <= 1
        fail_msg: >-
          Duplicate managed system record IDs:
          {{ beszel_matching_systems | map(attribute='id') | join(',') }}
      no_log: false

    - name: Require exactly one managed Beszel system for telemetry
      tags: [platform_verify_beszel]
      ansible.builtin.assert:
        that: beszel_matching_systems | length == 1
        fail_msg: >-
          Managed Beszel telemetry system record count differs (records={{
          beszel_matching_systems | length }}, IDs={{
          beszel_matching_systems | map(attribute='id') | join(',') | default('[none]', true) }}).
      no_log: false

    # Persisted PocketBase collections prove collection capability; health and
    # live WebSocket cannot. Container samples exist only when containers are seen.
    - name: Poll persisted Beszel telemetry collections
      tags: [platform_verify_beszel]
      beszel_telemetry_probe:
        api_url: "{{ beszel_api }}"
        auth_token: "{{ beszel_auth.json.token }}"
        system_id: "{{ (beszel_matching_systems | first).id }}"
        required_categories: "{{ beszel_effective_required_telemetry_categories }}"
        freshness_seconds: "{{ beszel_telemetry_freshness_seconds }}"
        timeout_seconds: "{{ beszel_telemetry_poll_timeout_seconds }}"
        request_timeout_seconds: "{{ beszel_telemetry_request_timeout_seconds }}"
        delay_seconds: "{{ beszel_telemetry_poll_delay_seconds }}"
      register: beszel_telemetry_probe_result
      check_mode: false
      no_log: true

    - name: Resolve persisted Beszel telemetry evidence
      tags: [platform_verify_beszel]
      ansible.builtin.set_fact:
        beszel_telemetry_system_id: "{{ beszel_telemetry_probe_result.evidence.system_id }}"
        beszel_telemetry_system_stats_id: >-
          {{ beszel_telemetry_probe_result.evidence.system_stats_id }}
        beszel_telemetry_container_stats_id: >-
          {{ beszel_telemetry_probe_result.evidence.container_stats_id }}
        beszel_telemetry_missing_categories: >-
          {{ beszel_telemetry_probe_result.evidence.missing_categories }}
        # Resolved on every converge, passing ones included.
        beszel_telemetry_transient_failures: >-
          {{ beszel_telemetry_probe_result.evidence.transient_failures }}
      no_log: true

    - name: Verify persisted Beszel telemetry categories
      tags: [platform_verify_beszel]
      ansible.builtin.assert:
        that:
          - beszel_telemetry_missing_categories | length == 0
        fail_msg: >-
          Persisted Beszel telemetry categories unavailable or stale for system
          ID {{ beszel_telemetry_system_id }}: categories={{
          beszel_telemetry_missing_categories | join(',') }};
          record IDs=system_stats:{{ beszel_telemetry_system_stats_id }},container_stats:{{
          beszel_telemetry_container_stats_id }};
          retried-away fetch failures={{ beszel_telemetry_transient_failures }}.
          A non-zero count is a hub that could not be read within the deadline;
          zero is an agent that reached the hub and collected nothing.
      no_log: false

    - name: Reconcile each managed alert
      tags: [platform_verify_beszel]
      ansible.builtin.include_tasks: alert.yml
      loop: "{{ beszel_alerts }}"
      loop_control:
        loop_var: beszel_alert
        label: "{{ beszel_alert.name }}"
      vars:
        beszel_alert_system_id: "{{ (beszel_matching_systems | first).id }}"
        beszel_alert_system_name: "{{ beszel_system_name }}"
        beszel_alert_absent_is_pending: false

    # Agents deployed by another repository: absence is reported, never refused,
    # so a late registration does not fail every poller tick. Once present, the
    # NAS system's strictness applies, minus the telemetry probe.
    - name: Read the remote managed systems
      tags: [platform_verify_beszel]
      ansible.builtin.uri:
        url: >-
          {{ beszel_api }}/api/collections/systems/records?perPage=500&filter={{
             beszel_remote_system_filter | urlencode }}
        headers:
          Authorization: "{{ beszel_auth.json.token }}"
      register: beszel_remote_systems_read
      when: beszel_remote_systems | length > 0
      changed_when: false
      check_mode: false
      no_log: true

    - name: Require the complete remote system result set
      tags: [platform_verify_beszel]
      ansible.builtin.assert:
        that: (beszel_remote_systems_read.json | default({}, true)).get('totalPages', 0) | int <= 1
        fail_msg: Remote system names returned more than 500 records; refusing incomplete reconciliation.

    - name: Refuse remote systems outside the managed user relation
      tags: [platform_verify_beszel]
      ansible.builtin.assert:
        that: beszel_remote_wrong_owner_systems | length == 0
        fail_msg: >-
          Same-name wrong-owner remote system record IDs:
          {{ beszel_remote_wrong_owner_systems | map(attribute='id') | join(',') }}
      no_log: false

    - name: Refuse duplicate remote managed systems
      tags: [platform_verify_beszel]
      ansible.builtin.assert:
        that: >-
          beszel_remote_owned_systems | length ==
          beszel_remote_owned_systems | map(attribute='name') | unique | list | length
        fail_msg: >-
          Duplicate remote managed system records (name:id):
          {{ beszel_remote_owned_systems | map(attribute='name')
             | zip(beszel_remote_owned_systems | map(attribute='id'))
             | map('join', ':') | join(',') }}
      no_log: false

    - name: Report remote systems that have not registered yet
      tags: [platform_verify_beszel]
      ansible.builtin.debug:
        msg: >-
          Beszel system {{ beszel_remote_absent_names | join(', ') }} has not
          registered with the hub yet, so its alerts were skipped. This is not a
          failure; they are created on the first converge after its agent
          registers.
      when: beszel_remote_absent_names | length > 0

    - name: Reconcile each remote managed alert
      tags: [platform_verify_beszel]
      ansible.builtin.include_tasks: alert.yml
      loop: >-
        {{ beszel_remote_systems
           | selectattr('name', 'in', beszel_remote_owned_systems | map(attribute='name') | list)
           | subelements('alerts') }}
      loop_control:
        loop_var: beszel_remote_alert
        label: "{{ beszel_remote_alert.0.name }} {{ beszel_remote_alert.1.name }}"
      vars:
        beszel_alert: "{{ beszel_remote_alert.1 }}"
        beszel_alert_system_name: "{{ beszel_remote_alert.0.name }}"
        beszel_alert_system_id: >-
          {{ (beszel_remote_owned_systems
              | selectattr('name', 'equalto', beszel_remote_alert.0.name) | first).id }}
        # Under verify.yml only (#911): alert.yml says why.
        beszel_alert_absent_is_pending: "{{ 'platform_verify_beszel' in ansible_run_tags }}"
