---
# What the resolved application user owns: the universal token the agent
# authenticates with, the Pushover notification webhook, the registered system, the
# telemetry that system persists, and each managed alert. One block gated on
# beszel_user_id, because a dry run resolves no id and every read below has
# nothing to key on without one.

- name: Report when Beszel configuration cannot continue
  ansible.builtin.debug:
    msg: >-
      No application user id resolved, so the universal token, notification URL
      and alerts were skipped. Expected during a dry run, where no record is
      created.
  when: beszel_user_id | length == 0

- name: Configure the application user
  when: beszel_user_id | length > 0
  block:
    # Authored verbatim, which Beszel accepts, so the agent's TOKEN comes from
    # vault rather than a value revealed in the hub's settings page.
    - name: List universal tokens
      tags: [platform_verify_beszel]
      ansible.builtin.uri:
        url: >-
          {{ beszel_api }}/api/collections/universal_tokens/records?perPage=500&filter={{
             beszel_token_filter | urlencode }}
        headers:
          Authorization: "{{ beszel_auth.json.token }}"
      register: beszel_tokens
      changed_when: false
      check_mode: false
      no_log: true

    - name: Require the complete managed universal token result set
      ansible.builtin.assert:
        that: beszel_tokens.json.get('totalPages', 0) | int <= 1
        fail_msg: Managed universal token identity returned more than 500 records; refusing incomplete reconciliation.

    - name: Refuse duplicate managed universal tokens
      tags: [platform_verify_beszel]
      ansible.builtin.assert:
        that:
          - (beszel_tokens.json.get('items', [])
             | selectattr('user', 'equalto', beszel_user_id) | list | length) <= 1
        fail_msg: >-
          Duplicate managed universal token record IDs:
          {{ beszel_tokens.json.get('items', [])
             | selectattr('user', 'equalto', beszel_user_id)
             | map(attribute='id') | join(',') }}
      no_log: false

    - name: Create the universal token from vault
      ansible.builtin.uri:
        url: "{{ beszel_api }}/api/collections/universal_tokens/records"
        method: POST
        headers:
          Authorization: "{{ beszel_auth.json.token }}"
        body_format: json
        body:
          user: "{{ beszel_user_id }}"
          token: "{{ vault_beszel_universal_token }}"
        status_code: [200]
      when: >-
        beszel_tokens.json.get('items', [])
        | selectattr('user', 'equalto', beszel_user_id) | list | length == 0
      changed_when: true
      no_log: true

    - name: Reconcile the universal token from vault
      ansible.builtin.uri:
        url: "{{ beszel_api }}/api/collections/universal_tokens/records/{{ beszel_managed_token.id }}"
        method: PATCH
        headers:
          Authorization: "{{ beszel_auth.json.token }}"
        body_format: json
        body:
          token: "{{ vault_beszel_universal_token }}"
        status_code: [200]
      when:
        - (beszel_tokens.json.get('items', [])
           | selectattr('user', 'equalto', beszel_user_id) | list | length) == 1
        - (beszel_tokens.json.get('items', [])
           | selectattr('user', 'equalto', beszel_user_id) | first).token
          != vault_beszel_universal_token
      changed_when: true
      no_log: true
      vars:
        beszel_managed_token: >-
          {{ beszel_tokens.json.get('items', [])
             | selectattr('user', 'equalto', beszel_user_id) | first }}

    - name: Report planned universal token reconciliation
      ansible.builtin.debug:
        msg: Managed universal token would be created or reconciled from vault.
      when:
        - ansible_check_mode
        - >-
          (beszel_tokens.json.get('items', [])
           | selectattr('user', 'equalto', beszel_user_id) | list | length) == 0
          or ((beszel_tokens.json.get('items', [])
               | selectattr('user', 'equalto', beszel_user_id) | list | length) == 1
              and (beszel_tokens.json.get('items', [])
                   | selectattr('user', 'equalto', beszel_user_id) | first).token
                  != vault_beszel_universal_token)
      changed_when: true
      no_log: true

    - name: Refresh universal tokens after reconciliation
      tags: [platform_verify_beszel]
      ansible.builtin.uri:
        url: >-
          {{ beszel_api }}/api/collections/universal_tokens/records?perPage=500&filter={{
             beszel_token_filter | urlencode }}
        headers:
          Authorization: "{{ beszel_auth.json.token }}"
      register: beszel_tokens
      changed_when: false
      check_mode: false
      no_log: true

    - name: Verify the exact managed universal token
      tags: [platform_verify_beszel]
      ansible.builtin.assert:
        that:
          - (beszel_tokens.json.get('items', [])
             | selectattr('user', 'equalto', beszel_user_id) | list | length) == 1
          - (beszel_tokens.json.get('items', [])
             | selectattr('user', 'equalto', beszel_user_id) | first).token
            == vault_beszel_universal_token
        fail_msg: Managed universal token is absent, duplicated, or differs from vault.
      no_log: true
      when: not ansible_check_mode

    - name: List notification settings
      tags: [platform_verify_beszel]
      ansible.builtin.uri:
        url: >-
          {{ beszel_api }}/api/collections/user_settings/records?perPage=500&filter={{
             beszel_settings_filter | urlencode }}
        headers:
          Authorization: "{{ beszel_auth.json.token }}"
      register: beszel_settings
      changed_when: false
      check_mode: false
      no_log: true

    - name: Require the complete managed notification settings result set
      ansible.builtin.assert:
        that: beszel_settings.json.get('totalPages', 0) | int <= 1
        fail_msg: Managed notification settings identity returned more than 500 records; refusing incomplete reconciliation.

    - name: Refuse duplicate managed notification settings
      tags: [platform_verify_beszel]
      ansible.builtin.assert:
        that: beszel_matching_settings | length <= 1
        fail_msg: >-
          Duplicate managed notification setting record IDs:
          {{ beszel_matching_settings | map(attribute='id') | join(',') }}
      no_log: false

    - name: Create absent notification settings
      ansible.builtin.uri:
        url: "{{ beszel_api }}/api/collections/user_settings/records"
        method: POST
        headers:
          Authorization: "{{ beszel_auth.json.token }}"
        body_format: json
        body:
          user: "{{ beszel_user_id }}"
        status_code: [200]
      when: beszel_matching_settings | length == 0
      changed_when: true
      no_log: true

    # Beszel's create hook authors email/chart defaults and intentionally
    # replaces a settings payload supplied on POST. Read that created record,
    # then PATCH the managed webhook while preserving its defaults.
    - name: Refresh notification settings after creation
      tags: [platform_verify_beszel]
      ansible.builtin.uri:
        url: >-
          {{ beszel_api }}/api/collections/user_settings/records?perPage=500&filter={{
             beszel_settings_filter | urlencode }}
        headers:
          Authorization: "{{ beszel_auth.json.token }}"
      register: beszel_settings
      changed_when: false
      check_mode: false
      no_log: true

    - name: Point Beszel notifications at Pushover
      ansible.builtin.uri:
        url: "{{ beszel_api }}/api/collections/user_settings/records/{{ (beszel_matching_settings | first).id }}"
        method: PATCH
        headers:
          Authorization: "{{ beszel_auth.json.token }}"
        body_format: json
        body:
          settings: >-
            {{ beszel_current_notification_settings
               | combine({'webhooks': [beszel_notification_url | trim]}) }}
        status_code: [200]
      when:
        - beszel_matching_settings | length == 1
        - (beszel_current_notification_settings.webhooks | default([]))
          != [beszel_notification_url | trim]
      changed_when: true
      no_log: true

    - name: Report planned notification webhook reconciliation
      ansible.builtin.debug:
        msg: Managed Pushover notification webhook would be created or reconciled.
      when:
        - ansible_check_mode
        - beszel_matching_settings | length == 0
          or (beszel_matching_settings | length == 1
              and (beszel_current_notification_settings.webhooks | default([]))
                  != [beszel_notification_url | trim])
      changed_when: true

    - name: Refresh notification settings after reconciliation
      tags: [platform_verify_beszel]
      ansible.builtin.uri:
        url: >-
          {{ beszel_api }}/api/collections/user_settings/records?perPage=500&filter={{
             beszel_settings_filter | urlencode }}
        headers:
          Authorization: "{{ beszel_auth.json.token }}"
      register: beszel_settings
      changed_when: false
      check_mode: false
      no_log: true

    - name: Summarize the managed Pushover webhook without URL bodies
      tags: [platform_verify_beszel]
      ansible.builtin.set_fact:
        beszel_webhook_record_count: "{{ beszel_matching_settings | length }}"
        beszel_webhook_exact: >-
          {{ beszel_matching_settings | length == 1 and
             (beszel_current_notification_settings.webhooks | default([]))
             == [beszel_notification_url | trim] }}
        beszel_webhook_scheme: >-
          {{ 'pushover'
             if (beszel_current_notification_settings.webhooks | default([])
                 | select('match', '^pushover://') | list | length)
                == (beszel_current_notification_settings.webhooks | default([]) | length)
                and (beszel_current_notification_settings.webhooks | default([]) | length) > 0
             else '[REDACTED]' }}
      no_log: true

    - name: Verify the managed Pushover webhook
      tags: [platform_verify_beszel]
      ansible.builtin.assert:
        that:
          - beszel_webhook_record_count | int == 1
          - beszel_webhook_exact | bool
        fail_msg: >-
          Managed Pushover webhook differs (records={{ beszel_webhook_record_count }},
          exact={{ beszel_webhook_exact }},
          scheme={{ beszel_webhook_scheme | default('[REDACTED]') }}).
      no_log: false
      when: not ansible_check_mode

    # Everything above compares the stored string to the intended string, and
    # Beszel stores whatever it is PATCHed -- so all of it passes just as well
    # when the credentials inside that string no longer work. A token revoked or
    # regenerated in the Pushover console leaves every check in this role green,
    # and the first symptom is silence during exactly the event Beszel exists to
    # report. These three tasks are the only thing on this platform that can tell
    # those two states apart, so they ask Pushover rather than the hub.
    #
    # KEEPING THEM OFF THE CONVERGE TAKES A `when`, NOT A TAG, and the first
    # revision of this block got that wrong in a way worth stating so nobody
    # re-derives it. `never` alone is not enough: Ansible inherits the role's own
    # tags onto every task in it, so these carry [beszel, monitoring, never,
    # platform_verify_beszel], and naming ANY inherited tag counts as explicitly
    # requesting the task. `--tags beszel` selects them. So does `--tags
    # monitoring`. So does the beszel CI lane, whose tag string is
    # `host_prep,deployment_bundle,beszel` in tests/ci/suites.conf -- which
    # would have converged with the ephemeral vault, asked Pushover about
    # credentials that were never real, and turned that lane red.
    #
    # ansible_run_tags is what the tags cannot say: which tag somebody actually
    # asked for. It is a magic variable rather than a fact, so
    # `inject_facts_as_vars = False` does not touch it -- measured, not assumed:
    # it reads ['all'] for a bare run, ['beszel', 'host_prep', ...] for the CI
    # lane, and ['platform_verify_beszel'] for the poller's verification.
    #
    # `never` stays alongside it for the untagged case, where it keeps these out
    # of --list-tasks as well as out of the run. The `when` is the load-bearing
    # half; that a `when` is invisible to --list-tasks is exactly why the tag
    # alone read as sufficient.
    #
    # site.yml is every service's deployment path, and nothing else in this
    # repository puts a third party on it. verify.yml reaches these through
    # --tags platform_verify_beszel, which is how the poller runs them: once per
    # deployed revision, not once per tick, because a revision already attempted
    # is never re-converged.
    - name: Ask Pushover whether it still accepts the managed credentials
      tags: [never, platform_verify_beszel]
      when: "'platform_verify_beszel' in ansible_run_tags"
      # Every Pushover application on this platform, not only the Alerts one
      # Beszel sends with: this is the one place the poller proves credentials
      # once per deployed revision, and a Containers, Deployments or Media token
      # regenerated in the console would otherwise surface only as a refused
      # message -- or, for Seerr, as nothing at all. The loop carries vault key
      # NAMES and reads each value through the vars lookup, so a verdict can be
      # attributed to a key without the value reaching any message.
      loop:
        - vault_pushover_alerts_token
        - vault_pushover_containers_token
        - vault_pushover_deployments_token
        - vault_pushover_media_token
      ansible.builtin.uri:
        url: "{{ beszel_pushover_validation_url }}"
        method: POST
        body_format: form-urlencoded
        body:
          token: "{{ lookup('ansible.builtin.vars', item) }}"
          user: "{{ vault_pushover_user_key }}"
        # Both halves of a real answer are data here rather than a module
        # failure: 200 is Pushover accepting the pair, 400 is Pushover refusing
        # it. Anything else is not an answer at all and is handled below.
        status_code: [200, 400]
        # The third-party fetch budget, not the readiness one -- this waits on a
        # host somewhere else, once per token. No retry ladder beside it on
        # purpose: a retry would spend up to 170 seconds of the poller's critical
        # path to make a
        # verdict marginally likelier, and the verdict it fails to get is
        # harmless and is announced by the debug task below rather than swallowed.
        timeout: "{{ platform_download_timeout }}"
      register: beszel_pushover_validation
      # The verdict is the assert's, not the module's. Without this line a DNS
      # failure, a timeout or a 5xx fails the run, which would make this NAS's
      # deployment succeed or fail on Pushover's uptime.
      failed_when: false
      changed_when: false
      check_mode: false
      no_log: true

    - name: Summarize the Pushover answer without the credentials it carried
      tags: [never, platform_verify_beszel]
      when: "'platform_verify_beszel' in ansible_run_tags"
      ansible.builtin.set_fact:
        # -1 rather than 0, for the reason CLAUDE.md gives for rc under
        # failed_when: the line above replaces the module's own verdict, so a
        # module that refused before it made a request registers no status at
        # all. A default that fell inside the authoritative set would turn
        # "Pushover is unreachable" into "Pushover refused these credentials",
        # which is the one verdict this must never invent.
        # An HTTP code alone is not an answer, and assuming it was is a defect
        # this task shipped with until the fixture caught it: anything between
        # here and Pushover -- a captive portal, a proxy, a provider's block page
        # -- can return 200 with a body that carries no verdict at all, and
        # reading that as "Pushover refused these credentials" is the exact
        # invention this must not make. So a verdict requires BOTH an
        # authoritative code and a parseable status field of Pushover's own.
        #
        # One verdict per token, with those semantics unchanged, collected as
        # the vault key NAMES that were refused and the count that went
        # unanswered -- names and a number, never a response, because the assert
        # below templates its fail_msg on the passing path too. .get() rather
        # than a chained attribute, the idiom this file already uses for
        # beszel_tokens.json: a 5xx can register a body that is not a mapping, or
        # no json key at all, and both have to read as "no verdict" rather than
        # raise.
        beszel_pushover_refused_tokens: >-
          {%- set verdicts = namespace(refused=[]) -%}
          {%- for result in beszel_pushover_validation.results | default([]) -%}
          {%- set body = result.json | default({}, true) -%}
          {%- set answer = (body.get('status', -1) | int) if body is mapping else -1 -%}
          {%- if (result.status | default(-1) | int) in [200, 400] and answer == 0 -%}
          {%- set verdicts.refused = verdicts.refused + [result.item] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ verdicts.refused | join(', ') }}
        beszel_pushover_unanswered_count: >-
          {%- set verdicts = namespace(unanswered=0) -%}
          {%- for result in beszel_pushover_validation.results | default([]) -%}
          {%- set body = result.json | default({}, true) -%}
          {%- set answer = (body.get('status', -1) | int) if body is mapping else -1 -%}
          {%- if not ((result.status | default(-1) | int) in [200, 400] and answer in [0, 1]) -%}
          {%- set verdicts.unanswered = verdicts.unanswered + 1 -%}
          {%- endif -%}
          {%- endfor -%}
          {{ verdicts.unanswered }}
      no_log: true

    # The non-verdict, said out loud, and a separate task because of a property
    # worth knowing before relying on the assert to say it: no_log suppresses
    # success_msg. It does NOT suppress fail_msg -- that asymmetry is measured in
    # tests/beszel_pushover_validation_test.rb -- so a redacted assert can still
    # name what broke and cannot report that nothing did. This task therefore
    # carries the "we did not find out" half, and it names no vault key, which is
    # what lets it stay unredacted and visible.
    #
    # It is also why there is no retry ladder on the read above: a silent skip
    # would be worth retrying for, and this line is what keeps it from being
    # silent.
    - name: Report that Pushover did not answer, which is not a refusal
      tags: [never, platform_verify_beszel]
      ansible.builtin.debug:
        msg: >-
          Pushover did not answer for {{ beszel_pushover_unanswered_count }} of
          the application tokens, so their validity is unverified this run.
          This is not a refusal and is not a failure; the managed webhook was
          still reconciled.
      when:
        - "'platform_verify_beszel' in ansible_run_tags"
        - beszel_pushover_unanswered_count | int > 0

    # Only the derived list of refused key names is named below. Ansible finalizes a task's
    # arguments before it decides whether the assert holds, so a fail_msg
    # reaching into the response would be evaluated on the passing path too --
    # which is how this repository shipped a verification that died exactly when
    # it should have stayed quiet.
    #
    # No `not ansible_check_mode` gate, unlike the webhook assert above: that one
    # is gated because under --check its PATCH never ran, while this read really
    # did (check_mode: false), so the answer is as true under review as it is on
    # a converge. A --check --diff that surfaces a revoked token is the point.
    - name: Verify Pushover still accepts the managed credentials
      tags: [never, platform_verify_beszel]
      when: "'platform_verify_beszel' in ansible_run_tags"
      ansible.builtin.assert:
        that:
          - beszel_pushover_refused_tokens | length == 0
        fail_msg: >-
          Pushover refused the managed credentials for
          {{ beszel_pushover_refused_tokens }}. Check each named token against
          its application's own page at pushover.net and vault_pushover_user_key
          against the account dashboard -- a refusal of every token is the user
          key; a token regenerated in the console has to be re-authored in
          vault. Until it is, that application delivers nothing. Values are not
          shown.
      # Redacted although it renders only key names, because the fail_msg names
      # the vault keys an operator has to go and fix, and
      # tests/policy_vault_test.rb requires redaction of any message that does.
      # no_log does not suppress fail_msg -- that is the property
      # roles/vault_contract depends on to name a bad credential without printing
      # one, and tests/beszel_pushover_validation_test.rb proves it here by
      # requiring this refusal in the output of a redacted run.
      #
      # There is deliberately no success_msg: no_log DOES suppress that one,
      # measured rather than assumed, so a success_msg here would be a message
      # nobody can ever read. The debug above carries what there is to say.
      no_log: true

    # Alerts relate to a system, which exists once the agent has registered.
    - name: Wait for the agent to register its system
      tags: [platform_verify_beszel]
      ansible.builtin.uri:
        url: >-
          {{ beszel_api }}/api/collections/systems/records?perPage=500&filter={{
             beszel_system_filter | urlencode }}
        headers:
          Authorization: "{{ beszel_auth.json.token }}"
      register: beszel_systems
      until: beszel_matching_systems | length > 0
      retries: "{{ beszel_agent_enabled | ternary(platform_readiness_retries, 1) }}"
      delay: "{{ platform_readiness_delay }}"
      failed_when: false
      changed_when: false
      check_mode: false
      no_log: true

    - name: Require the complete same-name system result set
      ansible.builtin.assert:
        that: beszel_systems.json.get('totalPages', 0) | int <= 1
        fail_msg: Managed system name returned more than 500 records; refusing incomplete reconciliation.

    - name: Refuse same-name systems outside the managed user relation
      tags: [platform_verify_beszel]
      ansible.builtin.assert:
        that: beszel_wrong_owner_systems | length == 0
        fail_msg: >-
          Same-name wrong-owner system record IDs:
          {{ beszel_wrong_owner_systems | map(attribute='id') | join(',') }}
      no_log: false

    - name: Refuse duplicate managed systems
      tags: [platform_verify_beszel]
      ansible.builtin.assert:
        that: beszel_matching_systems | length <= 1
        fail_msg: >-
          Duplicate managed system record IDs:
          {{ beszel_matching_systems | map(attribute='id') | join(',') }}
      no_log: false

    - name: Require exactly one managed Beszel system for telemetry
      tags: [platform_verify_beszel]
      ansible.builtin.assert:
        that: beszel_matching_systems | length == 1
        fail_msg: >-
          Managed Beszel telemetry system record count differs (records={{
          beszel_matching_systems | length }}, IDs={{
          beszel_matching_systems | map(attribute='id') | join(',') | default('[none]', true) }}).
      no_log: false

    # Beszel 0.18.7 stores core, disk, and GPU fields together in the newest
    # one-minute system_stats record. Container samples are written separately
    # and only when the agent actually observes containers. Querying these
    # persisted PocketBase collections proves collection capability; health,
    # system status, and the live WebSocket cannot substitute for these reads.
    - name: Poll persisted Beszel telemetry collections
      tags: [platform_verify_beszel]
      beszel_telemetry_probe:
        api_url: "{{ beszel_api }}"
        auth_token: "{{ beszel_auth.json.token }}"
        system_id: "{{ (beszel_matching_systems | first).id }}"
        required_categories: "{{ beszel_effective_required_telemetry_categories }}"
        freshness_seconds: "{{ beszel_telemetry_freshness_seconds }}"
        timeout_seconds: "{{ beszel_telemetry_poll_timeout_seconds }}"
        request_timeout_seconds: "{{ beszel_telemetry_request_timeout_seconds }}"
        delay_seconds: "{{ beszel_telemetry_poll_delay_seconds }}"
      register: beszel_telemetry_probe_result
      check_mode: false
      no_log: true

    - name: Resolve persisted Beszel telemetry evidence
      tags: [platform_verify_beszel]
      ansible.builtin.set_fact:
        beszel_telemetry_system_id: "{{ beszel_telemetry_probe_result.evidence.system_id }}"
        beszel_telemetry_system_stats_id: >-
          {{ beszel_telemetry_probe_result.evidence.system_stats_id }}
        beszel_telemetry_container_stats_id: >-
          {{ beszel_telemetry_probe_result.evidence.container_stats_id }}
        beszel_telemetry_missing_categories: >-
          {{ beszel_telemetry_probe_result.evidence.missing_categories }}
      no_log: true

    - name: Verify persisted Beszel telemetry categories
      tags: [platform_verify_beszel]
      ansible.builtin.assert:
        that:
          - beszel_telemetry_missing_categories | length == 0
        fail_msg: >-
          Persisted Beszel telemetry categories unavailable or stale for system
          ID {{ beszel_telemetry_system_id }}: categories={{
          beszel_telemetry_missing_categories | join(',') }};
          record IDs=system_stats:{{ beszel_telemetry_system_stats_id }},container_stats:{{
          beszel_telemetry_container_stats_id }}.
      no_log: false

    - name: Reconcile each managed alert
      tags: [platform_verify_beszel]
      ansible.builtin.include_tasks: alert.yml
      loop: "{{ beszel_alerts }}"
      loop_control:
        loop_var: beszel_alert
        label: "{{ beszel_alert.name }}"
