---
# A keypair placed at /beszel_data/id_ed25519 before first start is adopted
# rather than regenerated, so vault authors it and no read-back is needed.
# Read-only uri lookups carry check_mode: false, or --check leaves registers empty.
- name: Revalidate deployment paths before Beszel runtime use
  ansible.builtin.include_role:
    name: deployment_bundle
    tasks_from: target
  vars:
    deployment_target_service: beszel
    deployment_target_require_current_release: true
    deployment_target_extra_paths:
      - "{{ nas_docker_root }}/beszel/hub/id_ed25519"
      # roles/managed_users reads the capability register off the deployed
      # release, the way roles/komga and roles/audiobookshelf name it.
      - "{{ platform_current_dir }}/config/managed-user-capabilities.yml"

- name: Select the Beszel mounted state root
  tags: [platform_verify_beszel]
  ansible.builtin.set_fact:
    beszel_state_root: "{{ nas_docker_root }}/beszel/hub"

- name: Require the internally derived Beszel mounted state root
  ansible.builtin.assert:
    that:
      - beszel_state_root == (nas_docker_root ~ '/beszel/hub')

- name: Require the selected Beszel telemetry capability
  ansible.builtin.assert:
    that:
      - platform_kind in ['mac', 'nas']
      - beszel_effective_required_telemetry_categories | length > 0
      - beszel_effective_required_telemetry_categories | unique | list | length ==
        beszel_effective_required_telemetry_categories | length
      - beszel_effective_required_telemetry_categories |
        difference(['core', 'disk', 'containers', 'gpu']) | length == 0
      - beszel_telemetry_freshness_seconds | int >= 60
      - beszel_telemetry_poll_timeout_seconds | int >= 90
      - beszel_telemetry_request_timeout_seconds | int > 0
      - beszel_telemetry_request_timeout_seconds | int <= 10
      - beszel_telemetry_poll_delay_seconds | int > 0
      - beszel_telemetry_poll_delay_seconds | int <= 10
      - >-
        beszel_integration_test_capability | bool ==
        ((platform_compose_kind | default('') == 'integration') and
         (deployment_bundle_test_mode | default(false) | bool))
      - >-
        beszel_effective_required_telemetry_categories ==
        (['core', 'disk', 'containers']
         if (beszel_integration_test_capability | bool)
         else beszel_required_telemetry_categories)
      - >-
        beszel_effective_require_gpu_telemetry | bool ==
        (false
         if (beszel_integration_test_capability | bool)
         else (beszel_require_gpu_telemetry | bool))
      - >-
        platform_kind != 'mac' or
        (not (beszel_integration_test_capability | bool) and
         beszel_effective_required_telemetry_categories | sort == ['containers', 'core', 'disk'] and
         not (beszel_effective_require_gpu_telemetry | bool) and
         platform_beszel_agent_kind == 'portable')
      # The renderD128 literal is deliberate: NAS hosts are pinned to it, and this
      # disjunct applies only on a NAS with a real Intel GPU.
      - >-
        platform_kind != 'nas' or
        ((beszel_integration_test_capability | bool) and
         beszel_effective_required_telemetry_categories | sort == ['containers', 'core', 'disk'] and
         not (beszel_effective_require_gpu_telemetry | bool) and
         platform_beszel_agent_kind == 'portable' and
         not (preflight_gpu_available | bool)) or
        (not (beszel_integration_test_capability | bool) and
         beszel_effective_required_telemetry_categories | sort == ['containers', 'core', 'disk', 'gpu'] and
         beszel_effective_require_gpu_telemetry | bool and
         platform_beszel_agent_kind == 'intel' and
         platform_render_device_path == '/dev/dri/renderD128' and
         preflight_gpu_available | bool)
    fail_msg: >-
      Beszel telemetry capability does not match platform {{ platform_kind }}.
      Required categories: {{ beszel_effective_required_telemetry_categories | join(',') }}.

# Compose cannot take a list, so the agent has fixed device slots (unused ones
# get /dev/null); this stops a disk without a slot being dropped silently.
- name: Require one Compose S.M.A.R.T. slot for every declared disk
  ansible.builtin.assert:
    that:
      - >-
        platform_kind != 'nas' or
        (platform_smart_sata_devices | length == 3 and
         platform_smart_nvme_namespaces | length == 2)
      - >-
        platform_kind != 'mac' or
        (platform_smart_sata_devices | length == 0 and
         platform_smart_nvme_namespaces | length == 0)
    fail_msg: >-
      services/beszel/compose.yml has 3 SATA and 2 NVMe S.M.A.R.T. slots, but
      inventory declares {{ platform_smart_sata_devices | length }} SATA and
      {{ platform_smart_nvme_namespaces | length }} NVMe devices for
      {{ platform_kind }}. Change the slots and the assertion with the list.

- name: Install the hub keypair before the hub can generate its own
  ansible.builtin.copy:
    content: "{{ vault_beszel_hub_private_key }}"
    dest: "{{ beszel_state_root }}/id_ed25519"
    mode: "0600"
  no_log: true

# A devices: entry naming an absent node stops the agent starting, so an absent
# node gets /dev/null and a warning instead of blocking every deploy. A reboot
# losing a node leaves the agent down until the next converge; Status alert pages.
- name: Look for each declared S.M.A.R.T. device node on this host
  ansible.builtin.stat:
    path: "{{ item.1 }}"
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: "{{ beszel_smart_device_slots }}"
  loop_control:
    label: "{{ item.0 }}={{ item.1 }}"
  register: beszel_smart_device_stats
  changed_when: false
  check_mode: false

- name: Warn about declared S.M.A.R.T. devices absent from this host
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ item.1 }} is declared in inventory for {{ item.0 }} but is not a
      device node on this host, so {{ item.0 }} renders /dev/null and that disk
      is not monitored until it returns.
  loop: "{{ beszel_smart_missing_slots }}"
  loop_control:
    label: "{{ item.0 }}={{ item.1 }}"

- name: Render the Beszel environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ platform_runtime_dir }}/services/beszel/.env"
    mode: "0600"
  no_log: true

- name: List deployed Beszel Compose services
  ansible.builtin.command:
    argv: "{{ beszel_compose_cli_argv + ['ps', '--services', '--all'] }}"
  register: beszel_deployed_compose_services
  changed_when: false
  check_mode: false

- name: Remove managed Beszel agents not selected by host capabilities
  community.docker.docker_compose_v2:
    project_src: "{{ platform_current_dir }}/services/beszel"
    project_name: "{{ beszel_compose_project_name }}"
    files: "{{ platform_service_compose_files['beszel'] }}"
    env_files: ["{{ platform_runtime_dir }}/services/beszel/.env"]
    services: >-
      {{ beszel_inactive_agent_services
         | intersect(beszel_deployed_compose_services.stdout_lines) }}
    state: absent
  when: >-
    beszel_inactive_agent_services
    | intersect(beszel_deployed_compose_services.stdout_lines) | length > 0

- name: Deploy Beszel
  community.docker.docker_compose_v2:
    project_src: "{{ platform_current_dir }}/services/beszel"
    project_name: "{{ beszel_compose_project_name }}"
    files: "{{ platform_service_compose_files['beszel'] }}"
    env_files: ["{{ platform_runtime_dir }}/services/beszel/.env"]
    services: "{{ ['hub', 'socket-proxy'] + ([beszel_agent_service] if beszel_agent_enabled else []) }}"
    state: present
    wait: true
    wait_timeout: "{{ platform_compose_wait_timeout }}"
  register: beszel_deploy

- name: Report the Beszel deployment
  ansible.builtin.include_role:
    name: deployment_bundle
    tasks_from: report
  vars:
    deployment_report_service: Beszel
    deployment_report_changed: "{{ beszel_deploy is changed }}"

- name: Verify Beszel effective container CPU policy
  ansible.builtin.include_role:
    name: container_cpu
  vars:
    container_cpu_service_name: beszel
    container_cpu_project_name: "{{ beszel_compose_project_name }}"
    container_cpu_expected_services: >-
      {{ ['hub', 'socket-proxy'] + ([beszel_agent_service] if beszel_agent_enabled else []) }}

- name: Wait for the hub to report healthy
  ansible.builtin.uri:
    url: "{{ beszel_api }}/api/health"
  register: beszel_health
  until: beszel_health.status | default(0) == 200
  retries: "{{ platform_readiness_retries }}"
  delay: "{{ platform_readiness_delay }}"
  changed_when: false
  check_mode: false
