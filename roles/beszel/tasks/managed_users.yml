---
# roles/managed_users, parameterised from defaults/main.yml. The opening assert
# gates beszel_managed_users_phase: include_tasks never applies argument_specs.
- name: Validate the Beszel managed-user phase
  ansible.builtin.assert:
    that:
      - beszel_managed_users_phase in ['reconcile', 'verify']
    fail_msg: >-
      Beszel managed-user reconciliation was included with a phase it does not
      implement. The tasks this file reaches are gated on
      beszel_managed_users_phase, so an unrecognised phase silently skips them.

- name: Reconcile the declared Beszel managed users
  ansible.builtin.include_role:
    name: managed_users
  vars:
    managed_users_phase: "{{ beszel_managed_users_phase }}"
    managed_users_service: beszel
    managed_users_title: Beszel
    managed_users_declared: "{{ vault_managed_beszel_users }}"
    managed_users_identity_attribute: "{{ beszel_managed_users_identity_attribute }}"
    managed_users_id_attribute: "{{ beszel_managed_users_id_attribute }}"
    managed_users_id_pattern: "{{ beszel_managed_users_id_pattern }}"
    managed_users_api: "{{ beszel_api }}"
    managed_users_admin_headers:
      Authorization: "{{ beszel_auth.json.token }}"
    managed_users_admin_basic: false
    managed_users_list_path: "{{ beszel_managed_users_list_path }}"
    managed_users_list_json: "{{ beszel_managed_users_list_json }}"
    managed_users_listing_conditions: "{{ beszel_managed_users_listing_conditions }}"
    managed_users_authenticate_path: "{{ beszel_managed_users_authenticate_path }}"
    managed_users_authenticate_method: POST
    managed_users_authenticate_basic: false
    managed_users_authenticate_body_format: json
    managed_users_authenticate_body: "{{ beszel_managed_users_authenticate_body }}"
    managed_users_authenticate_identity: "{{ beszel_managed_users_authenticate_identity }}"
    managed_users_bind_authenticated_ids: true
    managed_users_authenticated_id: "{{ beszel_managed_users_authenticated_id }}"
    managed_users_create_path: "{{ beszel_managed_users_create_path }}"
    managed_users_create_body: "{{ beszel_managed_users_create_body }}"
    managed_users_create_status: "{{ beszel_managed_users_create_status }}"
    managed_users_reconcile_interface: "{{ beszel_managed_users_reconcile_interface }}"
    managed_users_reconcile_path: "{{ beszel_managed_users_reconcile_path }}"
    managed_users_repair_body: "{{ beszel_managed_users_repair_body }}"
    managed_users_repair_status: "{{ beszel_managed_users_repair_status }}"
    managed_users_repair_condition: "{{ beszel_managed_users_repair_condition }}"
    managed_users_verify_conditions: "{{ beszel_managed_users_verify_conditions }}"
    managed_users_verify_fail_msg: "{{ beszel_managed_users_verify_fail_msg }}"
    managed_users_plan_create_message: "{{ beszel_managed_users_plan_create_message }}"
    managed_users_plan_repair_message: "{{ beszel_managed_users_plan_repair_message }}"
