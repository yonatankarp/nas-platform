---
# Beszel appears to force a read-back: the hub generates a keypair on first start
# and its documentation says to copy the public key out of the Add System dialog.
# It does not. The keypair is /beszel_data/id_ed25519, the advertised public key is
# exactly `ssh-keygen -y` of that file, and a keypair placed there before first
# start is used rather than regenerated. Authoring it in vault therefore removes
# the read-back, the second deploy pass it required, and the least idempotent step
# in the design.
#
# Read-only lookups below carry check_mode: false. uri is skipped under --check,
# which would leave their registers without a status or json key and break every
# conditional that follows. They change nothing, so running them is safe.
- name: Revalidate deployment paths before Beszel runtime use
  ansible.builtin.include_role:
    name: deployment_bundle
    tasks_from: target
  vars:
    deployment_target_require_current_release: true
    deployment_target_extra_paths:
      - "{{ platform_current_dir }}/services/beszel"
      - "{{ platform_current_dir }}/services/beszel/compose.yml"
      - "{{ platform_current_dir }}/services/beszel/compose.{{ platform_compose_kind }}.yml"
      - "{{ platform_current_dir }}/services/beszel/compose.adoption.yml"
      - "{{ platform_runtime_dir }}/services/beszel"
      - "{{ platform_runtime_dir }}/services/beszel/.env"
      - >-
        {{ (platform_adoption_root ~ '/legacy/beszel/hub/id_ed25519')
           if (platform_adoption_enabled | default(false) | bool)
           else (nas_docker_root ~ '/beszel/hub/id_ed25519') }}

- name: Check for a Beszel platform override
  ansible.builtin.stat:
    path: "{{ platform_current_dir }}/services/beszel/compose.{{ platform_compose_kind }}.yml"
  register: beszel_platform_compose

- name: Select the Beszel Compose definitions
  ansible.builtin.set_fact:
    beszel_compose_files: >-
      {{ ['compose.yml'] +
         (beszel_platform_compose.stat.exists
          | ternary(['compose.' ~ platform_compose_kind ~ '.yml'], [])) +
         ((platform_adoption_enabled | default(false) | bool)
          | ternary(['compose.adoption.yml'], [])) }}

- name: Select the Beszel mounted state root
  ansible.builtin.set_fact:
    beszel_state_root: >-
      {{ (platform_adoption_root ~ '/legacy/beszel/hub')
         if (platform_adoption_enabled | default(false) | bool)
         else (nas_docker_root ~ '/beszel/hub') }}

- name: Require the internally derived Beszel mounted state root
  ansible.builtin.assert:
    that:
      - beszel_state_root == ((platform_adoption_root ~ '/legacy/beszel/hub') if
        (platform_adoption_enabled | default(false) | bool) else (nas_docker_root ~ '/beszel/hub'))

- name: Install the hub keypair before the hub can generate its own
  ansible.builtin.copy:
    content: "{{ vault_beszel_hub_private_key }}"
    dest: "{{ beszel_state_root }}/id_ed25519"
    mode: "0600"
  no_log: "{{ beszel_no_log | default(true) }}"

- name: Render the Beszel environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ platform_runtime_dir }}/services/beszel/.env"
    mode: "0600"
  no_log: "{{ beszel_no_log | default(true) }}"

- name: List deployed Beszel Compose services
  ansible.builtin.command:
    argv: "{{ beszel_compose_cli_argv + ['ps', '--services', '--all'] }}"
  register: beszel_deployed_compose_services
  changed_when: false
  check_mode: false

- name: Remove managed Beszel agents not selected by host capabilities
  community.docker.docker_compose_v2:
    project_src: "{{ platform_current_dir }}/services/beszel"
    project_name: "{{ beszel_compose_project_name }}"
    files: "{{ beszel_compose_files }}"
    env_files: ["{{ platform_runtime_dir }}/services/beszel/.env"]
    services: >-
      {{ beszel_inactive_agent_services
         | intersect(beszel_deployed_compose_services.stdout_lines) }}
    state: absent
  when: >-
    beszel_inactive_agent_services
    | intersect(beszel_deployed_compose_services.stdout_lines) | length > 0

- name: Deploy Beszel
  community.docker.docker_compose_v2:
    project_src: "{{ platform_current_dir }}/services/beszel"
    project_name: "{{ beszel_compose_project_name }}"
    files: "{{ beszel_compose_files }}"
    env_files: ["{{ platform_runtime_dir }}/services/beszel/.env"]
    services: "{{ ['hub', 'socket-proxy'] + ([beszel_agent_service] if beszel_agent_enabled else []) }}"
    state: present
    wait: true
    wait_timeout: 180

- name: Wait for the hub to report healthy
  ansible.builtin.uri:
    url: "{{ beszel_api }}/api/health"
  register: beszel_health
  until: beszel_health.status | default(0) == 200
  retries: 20
  delay: 3
  changed_when: false
  check_mode: false

# PocketBase has no supported non-secret list or existence command. Exact
# authentication safely proves the desired identity already exists; otherwise
# its atomic create command is the reviewed exception. The command creates an
# absent identity but cannot update an existing password. Post-authentication
# distinguishes successful creation from an existing identity with another
# password. Beszel 0.18.7 prints one exact non-secret success line only for the
# controller that creates the record; duplicate create attempts print the unique
# email error while still exiting zero. Exact post-authentication remains the
# authority for credentials, and the pinned success line only owns the change.
- name: Check for an existing Beszel superuser with vault credentials
  ansible.builtin.uri:
    url: "{{ beszel_api }}/api/collections/_superusers/auth-with-password"
    method: POST
    body_format: json
    body:
      identity: "{{ vault_beszel_superuser_email }}"
      password: "{{ vault_beszel_superuser_password }}"
    status_code: [200, 400, 403]
  register: beszel_superuser_pre_auth
  changed_when: false
  check_mode: false
  no_log: "{{ beszel_no_log | default(true) }}"

- name: Create the superuser without updating an existing identity
  community.docker.docker_compose_v2_exec:
    project_src: "{{ platform_current_dir }}/services/beszel"
    project_name: "{{ beszel_compose_project_name }}"
    files: "{{ beszel_compose_files }}"
    env_files: ["{{ platform_runtime_dir }}/services/beszel/.env"]
    service: hub
    argv:
      - /beszel
      - superuser
      - create
      - "{{ vault_beszel_superuser_email }}"
      - "{{ vault_beszel_superuser_password }}"
  register: beszel_superuser_create
  when:
    - not ansible_check_mode
    - beszel_superuser_pre_auth.status | int != 200
  failed_when: false
  changed_when: false
  no_log: "{{ beszel_no_log | default(true) }}"

- name: Authenticate as the superuser
  tags: [platform_verify_beszel]
  ansible.builtin.uri:
    url: "{{ beszel_api }}/api/collections/_superusers/auth-with-password"
    method: POST
    body_format: json
    body:
      identity: "{{ vault_beszel_superuser_email }}"
      password: "{{ vault_beszel_superuser_password }}"
    status_code: [200, 400, 403]
  register: beszel_auth
  changed_when: false
  check_mode: false
  no_log: "{{ beszel_no_log | default(true) }}"

- name: Require created or preserved Beszel superuser credentials
  tags: [platform_verify_beszel]
  ansible.builtin.assert:
    that:
      - ansible_check_mode or beszel_auth.status | int == 200
    fail_msg: >-
      Beszel superuser creation failed or the existing identity does not accept
      its preserved vault password. Run the reviewed credential-migration
      procedure; Ansible will not reset it automatically.
  no_log: true

- name: Report newly created Beszel superuser
  ansible.builtin.debug:
    msg: Beszel superuser was created and authenticated.
  when:
    - not ansible_check_mode
    - beszel_superuser_pre_auth.status | int != 200
    - >-
      beszel_superuser_create.stdout | default('') ==
      'Successfully created new superuser "' ~ vault_beszel_superuser_email ~ '"!'
    - beszel_auth.status | int == 200
  changed_when: true
  no_log: true

- name: Report planned Beszel superuser creation
  ansible.builtin.debug:
    msg: Beszel superuser would be created and authenticated.
  when:
    - ansible_check_mode
    - beszel_superuser_pre_auth.status | int != 200
  changed_when: true

# The point of authoring the keypair is that the hub adopts it, so assert rather
# than assume. getkey needs superuser authentication, hence its position here.
- name: Read the public key the hub advertises
  tags: [platform_verify_beszel]
  ansible.builtin.uri:
    url: "{{ beszel_api }}/api/beszel/getkey"
    headers:
      Authorization: "{{ beszel_auth.json.token }}"
  register: beszel_advertised_key
  changed_when: false
  check_mode: false
  no_log: "{{ beszel_no_log | default(true) }}"

- name: Verify the advertised key matches vault, proving no read-back is needed
  tags: [platform_verify_beszel]
  ansible.builtin.assert:
    that:
      # Type and key material only: SSH public keys carry an optional trailing
      # comment which the hub does not advertise.
      - (beszel_advertised_key.json.key | default('')).split()[:2]
        == vault_beszel_agent_key.split()[:2]
    fail_msg: >-
      The hub advertises a different public key than vault holds, so the agent
      would be rejected. This happens when the hub started once before the keypair
      was installed. Remove {{ beszel_state_root }}/id_ed25519 together
      with the generated database, then run again.
      Hub advertises '{{ beszel_advertised_key.json.key | default('<none>') }}',
      vault holds '{{ vault_beszel_agent_key }}'.
    success_msg: "Hub advertises the keypair from vault, no read-back needed"

# Collections use URL-encoded PocketBase identity filters, then repeat the exact
# identity selection in Jinja before resolving a record. Totals remain enabled so
# each read can refuse a result spanning more than the complete 500-record page.
- name: Read the complete PocketBase users collection for managed users
  ansible.builtin.uri:
    url: "{{ beszel_api }}/api/collections/users/records?perPage=500"
    headers:
      Authorization: "{{ beszel_auth.json.token }}"
    status_code: [200]
    return_content: true
  register: beszel_complete_users
  changed_when: false
  check_mode: false
  no_log: "{{ beszel_no_log | default(true) }}"

- name: Require a complete PocketBase users collection
  ansible.builtin.assert:
    that:
      - beszel_complete_users.json.get('totalPages', 0) | int <= 1
      - beszel_complete_users.json.get('items', []) | type_debug == 'list'
      - >-
        beszel_complete_users.json.get('totalItems',
          beszel_complete_users.json.get('items', []) | length) | int ==
        beszel_complete_users.json.get('items', []) | length
    fail_msg: PocketBase users collection exceeds one complete page.

- name: List application users
  tags: [platform_verify_beszel]
  ansible.builtin.uri:
    url: >-
      {{ beszel_api }}/api/collections/users/records?perPage=500&filter={{
         beszel_user_filter | urlencode }}
    headers:
      Authorization: "{{ beszel_auth.json.token }}"
  register: beszel_users
  changed_when: false
  check_mode: false
  no_log: "{{ beszel_no_log | default(true) }}"

- name: Require the complete managed application user result set
  ansible.builtin.assert:
    that: beszel_users.json.get('totalPages', 0) | int <= 1
    fail_msg: Managed application user identity returned more than 500 records; refusing incomplete reconciliation.

- name: Refuse duplicate managed application users
  tags: [platform_verify_beszel]
  ansible.builtin.assert:
    that: beszel_matching_users | length <= 1
    fail_msg: >-
      Duplicate managed application user record IDs:
      {{ beszel_matching_users | map(attribute='id') | join(',') }}
  no_log: false

# Alerts, tokens and settings all relate to the users collection, not to
# _superusers, so an application user is required alongside the superuser.
- name: Create the application user
  ansible.builtin.uri:
    url: "{{ beszel_api }}/api/collections/users/records"
    method: POST
    headers:
      Authorization: "{{ beszel_auth.json.token }}"
    body_format: json
    body:
      email: "{{ vault_beszel_app_user_email }}"
      password: "{{ vault_beszel_app_user_password }}"
      passwordConfirm: "{{ vault_beszel_app_user_password }}"
      verified: true
      # Defaults to user, so the admin equivalent is set explicitly. Verified not
      # to be the cause of the list failure described below.
      role: admin
    status_code: [200]
  register: beszel_created_user
  when: beszel_matching_users | length == 0
  changed_when: true
  no_log: "{{ beszel_no_log | default(true) }}"

- name: Report planned application user creation
  ansible.builtin.debug:
    msg: Managed application user would be created.
  when:
    - ansible_check_mode
    - beszel_matching_users | length == 0
  changed_when: true

# PocketBase writes through one SQLite connection and validates relations through
# another. Refreshing the pool after this one-time insert prevents the validator
# from seeing a stale snapshot when the token and settings records are created.
- name: Refresh Beszel database connections after creating the application user
  community.docker.docker_compose_v2:
    project_src: "{{ platform_current_dir }}/services/beszel"
    project_name: "{{ beszel_compose_project_name }}"
    files: "{{ beszel_compose_files }}"
    env_files: ["{{ platform_runtime_dir }}/services/beszel/.env"]
    services: [hub]
    state: restarted
    wait: true
    wait_timeout: 180
  when: beszel_matching_users | length == 0

# Read the id back from the collection rather than trusting the create response.
# The id returned by the POST was rejected as a missing relation when used
# immediately, while an id read from the collection is accepted.
- name: List application users again to resolve the id
  tags: [platform_verify_beszel]
  ansible.builtin.uri:
    url: >-
      {{ beszel_api }}/api/collections/users/records?perPage=500&filter={{
         beszel_user_filter | urlencode }}
    headers:
      Authorization: "{{ beszel_auth.json.token }}"
  register: beszel_users_after
  changed_when: false
  check_mode: false
  no_log: "{{ beszel_no_log | default(true) }}"

- name: Refuse duplicate managed application users after reconciliation
  tags: [platform_verify_beszel]
  ansible.builtin.assert:
    that:
      - (beszel_users_after.json.get('items', [])
         | selectattr('email', 'equalto', vault_beszel_app_user_email)
         | list | length) <= 1
    fail_msg: >-
      Duplicate managed application user record IDs:
      {{ beszel_users_after.json.get('items', [])
         | selectattr('email', 'equalto', vault_beszel_app_user_email)
         | map(attribute='id') | join(',') }}
  no_log: false

- name: Resolve the application user id
  tags: [platform_verify_beszel]
  ansible.builtin.set_fact:
    beszel_user_id: >-
      {{ (beszel_users_after.json.get('items', [])
          | selectattr('email', 'equalto', vault_beszel_app_user_email)
          | list | first | default({})).id | default('') }}
  no_log: "{{ beszel_no_log | default(true) }}"

- name: Check whether the managed application user accepts vault credentials
  tags: [platform_verify_beszel]
  ansible.builtin.uri:
    url: "{{ beszel_api }}/api/collections/users/auth-with-password"
    method: POST
    body_format: json
    body:
      identity: "{{ vault_beszel_app_user_email }}"
      password: "{{ vault_beszel_app_user_password }}"
    status_code: [200, 400, 403]
  register: beszel_app_user_auth
  changed_when: false
  check_mode: false
  no_log: "{{ beszel_no_log | default(true) }}"
  when: beszel_user_id | length > 0

- name: Require preserved Beszel application-user credentials
  ansible.builtin.assert:
    that:
      - beszel_app_user_auth.status | int == 200
    fail_msg: >-
      Existing Beszel application user does not accept its preserved vault
      password. Run the reviewed credential-migration procedure; Ansible will
      not reset it automatically.
  when: beszel_user_id | length > 0
  no_log: true

- name: Reconcile managed application user role and verification
  ansible.builtin.uri:
    url: "{{ beszel_api }}/api/collections/users/records/{{ beszel_user_id }}"
    method: PATCH
    headers:
      Authorization: "{{ beszel_auth.json.token }}"
    body_format: json
    body:
      verified: true
      role: admin
    status_code: [200]
  when:
    - beszel_user_id | length > 0
    - >-
      not (beszel_users_after.json.get('items', [])
           | selectattr('id', 'equalto', beszel_user_id) | first).verified
      or (beszel_users_after.json.get('items', [])
          | selectattr('id', 'equalto', beszel_user_id) | first).role != 'admin'
  changed_when: true
  no_log: "{{ beszel_no_log | default(true) }}"

- name: Report planned managed application user reconciliation
  ansible.builtin.debug:
    msg: Managed application user role or verification would be reconciled.
  when:
    - ansible_check_mode
    - beszel_user_id | length > 0
    - >-
      not (beszel_users_after.json.get('items', [])
           | selectattr('id', 'equalto', beszel_user_id) | first).verified
      or (beszel_users_after.json.get('items', [])
          | selectattr('id', 'equalto', beszel_user_id) | first).role != 'admin'
  changed_when: true

- name: Refresh application users after reconciliation
  tags: [platform_verify_beszel]
  ansible.builtin.uri:
    url: >-
      {{ beszel_api }}/api/collections/users/records?perPage=500&filter={{
         beszel_user_filter | urlencode }}
    headers:
      Authorization: "{{ beszel_auth.json.token }}"
  register: beszel_users_after
  changed_when: false
  check_mode: false
  no_log: "{{ beszel_no_log | default(true) }}"

- name: Resolve the reconciled application user id
  tags: [platform_verify_beszel]
  ansible.builtin.set_fact:
    beszel_user_id: >-
      {{ (beszel_users_after.json.get('items', [])
          | selectattr('email', 'equalto', vault_beszel_app_user_email)
          | list | first | default({})).id | default('') }}
  no_log: "{{ beszel_no_log | default(true) }}"

- name: Verify the managed application user contract
  tags: [platform_verify_beszel]
  ansible.builtin.assert:
    that:
      - beszel_user_id | length > 0
      - (beszel_users_after.json.get('items', [])
         | selectattr('id', 'equalto', beszel_user_id) | first).verified == true
      - (beszel_users_after.json.get('items', [])
         | selectattr('id', 'equalto', beszel_user_id) | first).role == 'admin'
    fail_msg: Managed application user is absent or differs from the verified admin contract.
  when: not ansible_check_mode

- name: Verify the managed application user accepts vault credentials
  tags: [platform_verify_beszel]
  ansible.builtin.uri:
    url: "{{ beszel_api }}/api/collections/users/auth-with-password"
    method: POST
    body_format: json
    body:
      identity: "{{ vault_beszel_app_user_email }}"
      password: "{{ vault_beszel_app_user_password }}"
    status_code: [200]
  changed_when: false
  check_mode: false
  no_log: "{{ beszel_no_log | default(true) }}"
  when: not ansible_check_mode

- name: Reconcile managed Beszel users
  ansible.builtin.include_tasks: managed_users.yml
  vars:
    beszel_managed_users_phase: reconcile

- name: Report when Beszel configuration cannot continue
  ansible.builtin.debug:
    msg: >-
      No application user id resolved, so the universal token, notification URL
      and alerts were skipped. Expected during a dry run, where no record is
      created.
  when: beszel_user_id | length == 0

- name: Configure the application user
  when: beszel_user_id | length > 0
  block:
    # Authored verbatim, which Beszel accepts, so the agent's TOKEN comes from
    # vault rather than a value revealed in the hub's settings page.
    - name: List universal tokens
      tags: [platform_verify_beszel]
      ansible.builtin.uri:
        url: >-
          {{ beszel_api }}/api/collections/universal_tokens/records?perPage=500&filter={{
             beszel_token_filter | urlencode }}
        headers:
          Authorization: "{{ beszel_auth.json.token }}"
      register: beszel_tokens
      changed_when: false
      check_mode: false
      no_log: "{{ beszel_no_log | default(true) }}"

    - name: Require the complete managed universal token result set
      ansible.builtin.assert:
        that: beszel_tokens.json.get('totalPages', 0) | int <= 1
        fail_msg: Managed universal token identity returned more than 500 records; refusing incomplete reconciliation.

    - name: Refuse duplicate managed universal tokens
      tags: [platform_verify_beszel]
      ansible.builtin.assert:
        that:
          - (beszel_tokens.json.get('items', [])
             | selectattr('user', 'equalto', beszel_user_id) | list | length) <= 1
        fail_msg: >-
          Duplicate managed universal token record IDs:
          {{ beszel_tokens.json.get('items', [])
             | selectattr('user', 'equalto', beszel_user_id)
             | map(attribute='id') | join(',') }}
      no_log: false

    - name: Create the universal token from vault
      ansible.builtin.uri:
        url: "{{ beszel_api }}/api/collections/universal_tokens/records"
        method: POST
        headers:
          Authorization: "{{ beszel_auth.json.token }}"
        body_format: json
        body:
          user: "{{ beszel_user_id }}"
          token: "{{ vault_beszel_universal_token }}"
        status_code: [200]
      when: >-
        beszel_tokens.json.get('items', [])
        | selectattr('user', 'equalto', beszel_user_id) | list | length == 0
      changed_when: true
      no_log: "{{ beszel_no_log | default(true) }}"

    - name: Reconcile the universal token from vault
      ansible.builtin.uri:
        url: "{{ beszel_api }}/api/collections/universal_tokens/records/{{ beszel_managed_token.id }}"
        method: PATCH
        headers:
          Authorization: "{{ beszel_auth.json.token }}"
        body_format: json
        body:
          token: "{{ vault_beszel_universal_token }}"
        status_code: [200]
      when:
        - (beszel_tokens.json.get('items', [])
           | selectattr('user', 'equalto', beszel_user_id) | list | length) == 1
        - (beszel_tokens.json.get('items', [])
           | selectattr('user', 'equalto', beszel_user_id) | first).token
          != vault_beszel_universal_token
      changed_when: true
      no_log: "{{ beszel_no_log | default(true) }}"
      vars:
        beszel_managed_token: >-
          {{ beszel_tokens.json.get('items', [])
             | selectattr('user', 'equalto', beszel_user_id) | first }}

    - name: Report planned universal token reconciliation
      ansible.builtin.debug:
        msg: Managed universal token would be created or reconciled from vault.
      when:
        - ansible_check_mode
        - >-
          (beszel_tokens.json.get('items', [])
           | selectattr('user', 'equalto', beszel_user_id) | list | length) == 0
          or ((beszel_tokens.json.get('items', [])
               | selectattr('user', 'equalto', beszel_user_id) | list | length) == 1
              and (beszel_tokens.json.get('items', [])
                   | selectattr('user', 'equalto', beszel_user_id) | first).token
                  != vault_beszel_universal_token)
      changed_when: true
      no_log: "{{ beszel_no_log | default(true) }}"

    - name: Refresh universal tokens after reconciliation
      tags: [platform_verify_beszel]
      ansible.builtin.uri:
        url: >-
          {{ beszel_api }}/api/collections/universal_tokens/records?perPage=500&filter={{
             beszel_token_filter | urlencode }}
        headers:
          Authorization: "{{ beszel_auth.json.token }}"
      register: beszel_tokens
      changed_when: false
      check_mode: false
      no_log: "{{ beszel_no_log | default(true) }}"

    - name: Verify the exact managed universal token
      tags: [platform_verify_beszel]
      ansible.builtin.assert:
        that:
          - (beszel_tokens.json.get('items', [])
             | selectattr('user', 'equalto', beszel_user_id) | list | length) == 1
          - (beszel_tokens.json.get('items', [])
             | selectattr('user', 'equalto', beszel_user_id) | first).token
            == vault_beszel_universal_token
        fail_msg: Managed universal token is absent, duplicated, or differs from vault.
      no_log: "{{ beszel_no_log | default(true) }}"
      when: not ansible_check_mode

    - name: List notification settings
      tags: [platform_verify_beszel]
      ansible.builtin.uri:
        url: >-
          {{ beszel_api }}/api/collections/user_settings/records?perPage=500&filter={{
             beszel_settings_filter | urlencode }}
        headers:
          Authorization: "{{ beszel_auth.json.token }}"
      register: beszel_settings
      changed_when: false
      check_mode: false
      no_log: "{{ beszel_no_log | default(true) }}"

    - name: Require the complete managed notification settings result set
      ansible.builtin.assert:
        that: beszel_settings.json.get('totalPages', 0) | int <= 1
        fail_msg: Managed notification settings identity returned more than 500 records; refusing incomplete reconciliation.

    - name: Refuse duplicate managed notification settings
      tags: [platform_verify_beszel]
      ansible.builtin.assert:
        that: beszel_matching_settings | length <= 1
        fail_msg: >-
          Duplicate managed notification setting record IDs:
          {{ beszel_matching_settings | map(attribute='id') | join(',') }}
      no_log: false

    - name: Create absent notification settings
      ansible.builtin.uri:
        url: "{{ beszel_api }}/api/collections/user_settings/records"
        method: POST
        headers:
          Authorization: "{{ beszel_auth.json.token }}"
        body_format: json
        body:
          user: "{{ beszel_user_id }}"
        status_code: [200]
      when: beszel_matching_settings | length == 0
      changed_when: true
      no_log: "{{ beszel_no_log | default(true) }}"

    # Beszel's create hook authors email/chart defaults and intentionally
    # replaces a settings payload supplied on POST. Read that created record,
    # then PATCH the managed webhook while preserving its defaults.
    - name: Refresh notification settings after creation
      tags: [platform_verify_beszel]
      ansible.builtin.uri:
        url: >-
          {{ beszel_api }}/api/collections/user_settings/records?perPage=500&filter={{
             beszel_settings_filter | urlencode }}
        headers:
          Authorization: "{{ beszel_auth.json.token }}"
      register: beszel_settings
      changed_when: false
      check_mode: false
      no_log: "{{ beszel_no_log | default(true) }}"

    - name: Point Beszel notifications at ntfy
      ansible.builtin.uri:
        url: "{{ beszel_api }}/api/collections/user_settings/records/{{ (beszel_matching_settings | first).id }}"
        method: PATCH
        headers:
          Authorization: "{{ beszel_auth.json.token }}"
        body_format: json
        body:
          settings: >-
            {{ beszel_current_notification_settings
               | combine({'webhooks': [beszel_notification_url | trim]}) }}
        status_code: [200]
      when:
        - beszel_matching_settings | length == 1
        - (beszel_current_notification_settings.webhooks | default([]))
          != [beszel_notification_url | trim]
      changed_when: true
      no_log: "{{ beszel_no_log | default(true) }}"

    - name: Report planned notification webhook reconciliation
      ansible.builtin.debug:
        msg: Managed ntfy notification webhook would be created or reconciled.
      when:
        - ansible_check_mode
        - beszel_matching_settings | length == 0
          or (beszel_matching_settings | length == 1
              and (beszel_current_notification_settings.webhooks | default([]))
                  != [beszel_notification_url | trim])
      changed_when: true

    - name: Refresh notification settings after reconciliation
      tags: [platform_verify_beszel]
      ansible.builtin.uri:
        url: >-
          {{ beszel_api }}/api/collections/user_settings/records?perPage=500&filter={{
             beszel_settings_filter | urlencode }}
        headers:
          Authorization: "{{ beszel_auth.json.token }}"
      register: beszel_settings
      changed_when: false
      check_mode: false
      no_log: "{{ beszel_no_log | default(true) }}"

    - name: Summarize the managed ntfy webhook without URL bodies
      tags: [platform_verify_beszel]
      ansible.builtin.set_fact:
        beszel_webhook_record_count: "{{ beszel_matching_settings | length }}"
        beszel_webhook_exact: >-
          {{ beszel_matching_settings | length == 1 and
             (beszel_current_notification_settings.webhooks | default([]))
             == [beszel_notification_url | trim] }}
        beszel_webhook_scheme: >-
          {{ 'ntfy'
             if (beszel_current_notification_settings.webhooks | default([])
                 | select('match', '^ntfy://') | list | length)
                == (beszel_current_notification_settings.webhooks | default([]) | length)
                and (beszel_current_notification_settings.webhooks | default([]) | length) > 0
             else '[REDACTED]' }}
      no_log: true

    - name: Verify the managed ntfy webhook
      tags: [platform_verify_beszel]
      ansible.builtin.assert:
        that:
          - beszel_webhook_record_count | int == 1
          - beszel_webhook_exact | bool
        fail_msg: >-
          Managed ntfy webhook differs (records={{ beszel_webhook_record_count }},
          exact={{ beszel_webhook_exact }},
          scheme={{ beszel_webhook_scheme | default('[REDACTED]') }}).
      no_log: false
      when: not ansible_check_mode

    # Alerts relate to a system, which exists once the agent has registered.
    - name: Wait for the agent to register its system
      tags: [platform_verify_beszel]
      ansible.builtin.uri:
        url: >-
          {{ beszel_api }}/api/collections/systems/records?perPage=500&filter={{
             beszel_system_filter | urlencode }}
        headers:
          Authorization: "{{ beszel_auth.json.token }}"
      register: beszel_systems
      until: beszel_matching_systems | length > 0
      retries: "{{ beszel_agent_enabled | ternary(20, 1) }}"
      delay: 3
      failed_when: false
      changed_when: false
      check_mode: false
      no_log: "{{ beszel_no_log | default(true) }}"

    - name: Require the complete same-name system result set
      ansible.builtin.assert:
        that: beszel_systems.json.get('totalPages', 0) | int <= 1
        fail_msg: Managed system name returned more than 500 records; refusing incomplete reconciliation.

    - name: Refuse same-name systems outside the managed user relation
      tags: [platform_verify_beszel]
      ansible.builtin.assert:
        that: beszel_wrong_owner_systems | length == 0
        fail_msg: >-
          Same-name wrong-owner system record IDs:
          {{ beszel_wrong_owner_systems | map(attribute='id') | join(',') }}
      no_log: false

    - name: Refuse duplicate managed systems
      tags: [platform_verify_beszel]
      ansible.builtin.assert:
        that: beszel_matching_systems | length <= 1
        fail_msg: >-
          Duplicate managed system record IDs:
          {{ beszel_matching_systems | map(attribute='id') | join(',') }}
      no_log: false

    - name: Report that alerts need a registered system
      ansible.builtin.debug:
        msg: >-
          No managed Beszel system is registered, so alerts were skipped. This is
          expected when the host capability explicitly disables the agent.
      when: beszel_matching_systems | length == 0

    - name: Reconcile each managed alert
      tags: [platform_verify_beszel]
      ansible.builtin.include_tasks: alert.yml
      loop: "{{ beszel_alerts }}"
      loop_control:
        loop_var: beszel_alert
        label: "{{ beszel_alert.name }}"
      when: beszel_matching_systems | length == 1

- name: Verify managed Beszel users
  tags: [platform_verify_beszel]
  ansible.builtin.include_tasks:
    file: managed_users.yml
    apply:
      tags: [platform_verify_beszel]
  vars:
    beszel_managed_users_phase: verify
  when: not ansible_check_mode
