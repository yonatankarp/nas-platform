---
# One alert on one system. The caller binds beszel_alert, beszel_alert_system_id,
# beszel_alert_system_name and beszel_alert_absent_is_pending as include vars;
# they are per-include, so they are deliberately absent from
# meta/argument_specs.yml, and the last has no default so an includer that
# forgets it fails rather than silently choosing.
#
# beszel_alert_absent_is_pending is true only for a remote system under
# verify.yml (#911). Verify runs only platform_verify_beszel tasks, so the create
# and patch below never run there, and a remote agent that registered between
# the poller's site.yml and its verify.yml has no alerts yet: that absence is
# pending the next converge, not a failure. A duplicate or a wrong value still
# fails. The NAS system's own alerts pass false in every mode, because site.yml
# created them before verify could read them.
- name: Query managed-identity alerts for {{ beszel_alert.name }}
  tags: [platform_verify_beszel]
  ansible.builtin.uri:
    url: >-
      {{ beszel_api }}/api/collections/alerts/records?perPage=500&filter={{
         beszel_alert_filter | urlencode }}
    headers:
      Authorization: "{{ beszel_auth.json.token }}"
  register: beszel_alert_records
  changed_when: false
  check_mode: false
  no_log: true
  vars:
    beszel_alert_filter: >-
      user = {{ beszel_user_id | to_json }} &&
      system = {{ beszel_alert_system_id | to_json }} &&
      name = {{ beszel_alert.name | to_json }}

- name: Require the complete alert result set for {{ beszel_alert.name }}
  ansible.builtin.assert:
    that: beszel_alert_records.json.get('totalPages', 0) | int <= 1
    fail_msg: Managed {{ beszel_alert.name }} alert identity returned more than 500 records; refusing incomplete reconciliation.

- name: Resolve existing managed-system alerts for {{ beszel_alert.name }}
  tags: [platform_verify_beszel]
  ansible.builtin.set_fact:
    beszel_current_alerts: >-
      {{ beszel_alert_records.json.get('items', []) }}

- name: Refuse duplicate managed-system alerts for {{ beszel_alert.name }}
  tags: [platform_verify_beszel]
  ansible.builtin.assert:
    that: beszel_current_alerts | length <= 1
    fail_msg: >-
      Duplicate managed {{ beszel_alert.name }} alert record IDs on system
      {{ beszel_alert_system_name }}:
      {{ beszel_current_alerts | map(attribute='id') | join(',') }}
  no_log: false

- name: Create the absent managed-system alert for {{ beszel_alert.name }}
  ansible.builtin.uri:
    url: "{{ beszel_api }}/api/collections/alerts/records"
    method: POST
    headers:
      Authorization: "{{ beszel_auth.json.token }}"
    body_format: json
    body:
      user: "{{ beszel_user_id }}"
      system: "{{ beszel_alert_system_id }}"
      name: "{{ beszel_alert.name }}"
      value: "{{ beszel_alert.value }}"
      min: "{{ beszel_alert.min }}"
    status_code: [200]
  when: beszel_current_alerts | length == 0
  changed_when: true
  no_log: true

- name: Patch the mismatched managed-system alert for {{ beszel_alert.name }}
  ansible.builtin.uri:
    url: "{{ beszel_api }}/api/collections/alerts/records/{{ (beszel_current_alerts | first).id }}"
    method: PATCH
    headers:
      Authorization: "{{ beszel_auth.json.token }}"
    body_format: json
    body:
      value: "{{ beszel_alert.value }}"
      min: "{{ beszel_alert.min }}"
    status_code: [200]
  when:
    - beszel_current_alerts | length == 1
    - (beszel_current_alerts | first).value != beszel_alert.value
      or (beszel_current_alerts | first).min != beszel_alert.min
  changed_when: true
  no_log: true

- name: Report planned alert reconciliation for {{ beszel_alert.name }}
  ansible.builtin.debug:
    msg: Managed {{ beszel_alert.name }} alert would be created or reconciled.
  when:
    - ansible_check_mode
    - beszel_current_alerts | length == 0
      or (beszel_current_alerts | length == 1
          and ((beszel_current_alerts | first).value != beszel_alert.value
               or (beszel_current_alerts | first).min != beszel_alert.min))
  changed_when: true

- name: Refresh alerts after reconciling {{ beszel_alert.name }}
  tags: [platform_verify_beszel]
  ansible.builtin.uri:
    url: >-
      {{ beszel_api }}/api/collections/alerts/records?perPage=500&filter={{
         beszel_alert_filter | urlencode }}
    headers:
      Authorization: "{{ beszel_auth.json.token }}"
  register: beszel_refreshed_alerts
  changed_when: false
  check_mode: false
  no_log: true
  vars:
    beszel_alert_filter: >-
      user = {{ beszel_user_id | to_json }} &&
      system = {{ beszel_alert_system_id | to_json }} &&
      name = {{ beszel_alert.name | to_json }}

- name: Resolve reconciled managed-system alerts for {{ beszel_alert.name }}
  tags: [platform_verify_beszel]
  ansible.builtin.set_fact:
    beszel_current_alerts: >-
      {{ beszel_refreshed_alerts.json.get('items', []) }}

- name: Report a remote alert pending the next converge for {{ beszel_alert.name }}
  tags: [platform_verify_beszel]
  ansible.builtin.debug:
    msg: >-
      Managed {{ beszel_alert.name }} alert on system {{ beszel_alert_system_name }}
      is absent; its system registered after the last converge, so it is
      pending the next converge rather than a failure.
  when:
    - beszel_alert_absent_is_pending | bool
    - beszel_current_alerts | length == 0

- name: Verify exact alert configuration for {{ beszel_alert.name }}
  tags: [platform_verify_beszel]
  ansible.builtin.assert:
    that:
      - beszel_current_alerts | length == 1
      - (beszel_current_alerts | first).value == beszel_alert.value
      - (beszel_current_alerts | first).min == beszel_alert.min
    fail_msg: >-
      Managed {{ beszel_alert.name }} alert on system {{ beszel_alert_system_name }}
      is absent, duplicated, or differs from threshold and duration configuration.
  when:
    - not ansible_check_mode
    - not (beszel_alert_absent_is_pending | bool and beszel_current_alerts | length == 0)
