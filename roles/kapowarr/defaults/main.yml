---
kapowarr_port: 5656
kapowarr_api: "http://127.0.0.1:{{ kapowarr_port }}"
kapowarr_config_host_path: "{{ nas_docker_root }}/kapowarr/config"
# The shared parent of the comics library and its staging directory, mounted once so an
# import is a rename: rename(2) cannot cross a mount boundary even on one filesystem.
# tests/contracts/kapowarr-static.rb pins the mount list (policy_test cannot see it).
kapowarr_books_host_path: "{{ nas_media_root }}/Books"
# Mounted via the parent; still declared so deployment_bundle's containment check covers
# the tree the volume folder migration moves directories inside.
kapowarr_comics_host_path: "{{ nas_media_root }}/Books/Comics"
# Container paths Kapowarr stores (root folder, download_folder), not environment. The
# move from /comics and /app/temp_downloads is a stored-path migration; the tasks refuse
# a deployment still on the old prefix. Staging matches SABnzbd's container path.
kapowarr_library_root: /data/books/Comics
kapowarr_staging_root: /data/books/.acquisition/usenet/comics
# Inside the config mount (already critical in nas_storage). One generation; Kapowarr's
# own dated-backup rotation does not match this name.
kapowarr_pre_upgrade_backup_path: "{{ kapowarr_config_host_path }}/pre-upgrade-backup"
kapowarr_compose_project_name: >-
  {{ (platform_project_name ~ '-kapowarr')
     if platform_project_name | default('') | length > 0 else 'kapowarr' }}

# One-convergence input; only false is stored. Pass
# `-e kapowarr_volume_folder_migration_allowed=true` for the single reviewed run.
kapowarr_volume_folder_migration_allowed: false

# Settings are a partial merge: only these keys are written. All are Kapowarr defaults
# except download_folder and volume_folder_naming. A settings write renames nothing;
# folder migration is the separate gated step in tasks/main.yml.
kapowarr_settings:
  # Declared because the parent mount moved it off the image default. Keep the trailing
  # separator (Kapowarr reads it back suffixed) and the literal (the runtime contract
  # parses without Jinja). Must not become a child of the library root: keep Comics a leaf.
  download_folder: /data/books/.acquisition/usenet/comics/
  # One directory level: Komga names a series from the directory directly containing books,
  # and Kapowarr writes no ComicInfo.xml. The year disambiguates volumes in this library.
  volume_folder_naming: "{series_name} ({year})"
  file_naming: "{series_name} ({year}) Volume {volume_number} Issue {issue_number}"
  file_naming_empty: "{series_name} ({year}) Volume {volume_number} Issue {issue_number}"
  file_naming_special_version: "{series_name} ({year}) Volume {volume_number} {special_version}"
  file_naming_vai: "{series_name} ({year}) Volume {issue_number}"
  volume_padding: 2
  issue_padding: 3
  long_special_version: false
  replace_illegal_characters: true
  rename_downloaded_files: true
  create_empty_volume_folders: true
  delete_empty_folders: false
  unmonitor_deleted_issues: false
  convert: false
  extract_issue_ranges: false
  concurrent_direct_downloads: 1
  failing_download_timeout: 0
  delete_completed_downloads: true
  seeding_handling: copy
  date_type: cover_date

# GetComics service order (#671). Kapowarr accepts only a full permutation, so this is a
# partial order: named services first, the rest keep their order. v1.3.2's default, so
# no write reaches getcomics.org on a fresh converge.
kapowarr_service_preference:
  - Mega
  - MediaFire
  - WeTransfer
  - Pixeldrain
  - GetComics
  - GetComics (torrent)

# Kapowarr masks stored credentials as asterisks, so they could never converge; refused
# in the declaration by name.
kapowarr_settings_credential_keys:
  - api_key
  - auth_username
  - auth_password
  - comicvine_api_key
  - proxy_username
  - proxy_password
