---
- name: Revalidate deployment paths before Kapowarr runtime use
  ansible.builtin.include_role:
    name: deployment_bundle
    tasks_from: target
  vars:
    deployment_target_service: kapowarr
    deployment_target_require_current_release: true
    deployment_target_extra_paths:
      - "{{ platform_current_dir }}/services/kapowarr/tasks.py"
      - "{{ kapowarr_config_host_path }}"
      # Named so the containment check refuses a symlink or escape before the volume folder
      # migration moves anything inside it.
      - "{{ kapowarr_comics_host_path }}"

# Authored but not pushed: Kapowarr validates the ComicVine key against a third party
# before storing it. The vault stays its authority; its shape is checked here.
- name: Require a well-formed Kapowarr ComicVine credential
  ansible.builtin.assert:
    that:
      - vault_kapowarr_comicvine_api_key is match('^[^\r\n]+$')
    fail_msg: The Kapowarr ComicVine credential must be a nonempty single-line value.

# Redacted: the two halves of the administrator identity.
- name: Require env-safe Kapowarr administrator credentials
  ansible.builtin.assert:
    that:
      - vault_kapowarr_admin_username is match('^[^\r\n]+$')
      - vault_kapowarr_admin_password is match('^[^\r\n]+$')
    fail_msg: Kapowarr administrator credentials must be nonempty single-line values.
  no_log: true

# The patch (#696) is bind-mounted; its sha256 goes into a label so a changed patch
# recreates the container.
- name: Inspect the carried Kapowarr task handler patch
  ansible.builtin.stat:
    path: "{{ platform_current_dir }}/services/kapowarr/tasks.py"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  register: kapowarr_task_patch

# Under --check `current` is the previous release, so the controller's identical copy
# is hashed instead.
- name: Require the carried Kapowarr task handler patch to be a regular file
  ansible.builtin.assert:
    that:
      - >-
        (kapowarr_task_patch.stat.exists and
         (kapowarr_task_patch.stat.isreg | default(false)) and
         not (kapowarr_task_patch.stat.islnk | default(false))) or
        (ansible_check_mode and not kapowarr_task_patch.stat.exists)
    fail_msg: The carried Kapowarr task handler patch must be a regular file in the release.

- name: Resolve the carried Kapowarr task handler patch checksum
  ansible.builtin.set_fact:
    kapowarr_task_patch_sha256: >-
      {{ kapowarr_task_patch.stat.checksum if kapowarr_task_patch.stat.exists
         else (lookup('ansible.builtin.file', playbook_dir ~ '/services/kapowarr/tasks.py', rstrip=false)
               | hash('sha256')) }}

- name: Require a sha256 for the carried Kapowarr task handler patch
  ansible.builtin.assert:
    that:
      - kapowarr_task_patch_sha256 is match('^[0-9a-f]{64}$')
    fail_msg: The carried Kapowarr task handler patch checksum must be a sha256.

- name: Render the Kapowarr environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ platform_runtime_dir }}/services/kapowarr/.env"
    mode: "0600"

# Before Compose: the store migrates one-way on start (#671, #511).
- name: Refuse a Kapowarr image older than the store on disk
  ansible.builtin.include_role:
    name: image_downgrade_guard
  vars:
    image_downgrade_guard_service_name: kapowarr
    image_downgrade_guard_compose_service: kapowarr
    image_downgrade_guard_project_name: "{{ kapowarr_compose_project_name }}"
    image_downgrade_guard_store_description: "{{ kapowarr_config_host_path }}"

# Copies the store aside between the guard and the deployment (roles/pre_upgrade_backup).
# Kapowarr has no on-demand backup and no sqlite3, so a stopped-container file copy it is;
# -wal/-shm are carried in case the stop was cut short.
- name: Guard the Kapowarr store before a pinned upgrade
  ansible.builtin.include_role:
    name: pre_upgrade_backup
  vars:
    pre_upgrade_backup_service_name: kapowarr
    pre_upgrade_backup_compose_service: kapowarr
    pre_upgrade_backup_project_name: "{{ kapowarr_compose_project_name }}"
    pre_upgrade_backup_store_dir: "{{ kapowarr_config_host_path }}"
    pre_upgrade_backup_store_file: Kapowarr.db
    pre_upgrade_backup_path: "{{ kapowarr_pre_upgrade_backup_path }}"
    pre_upgrade_backup_manage_ownership: "{{ platform_kind == 'nas' or (platform_manage_linux_ownership | bool) }}"

# The rescue hands the failure to roles/container_health, which explains it from
# Docker's state or re-raises it unchanged (#509, #537).
- name: Deploy Kapowarr, catching a container that runs but never serves
  block:
    - name: Deploy Kapowarr
      community.docker.docker_compose_v2:
        project_src: "{{ platform_current_dir }}/services/kapowarr"
        project_name: "{{ kapowarr_compose_project_name }}"
        files: "{{ platform_service_compose_files['kapowarr'] }}"
        env_files: ["{{ platform_runtime_dir }}/services/kapowarr/.env"]
        state: present
        wait: true
        wait_timeout: "{{ platform_compose_wait_timeout }}"
      register: kapowarr_deploy
  rescue:
    # First, before anything else rebinds ansible_failed_result.
    - name: Record the failed Kapowarr deployment
      ansible.builtin.set_fact:
        kapowarr_deploy_failure_message: >-
          {{ ansible_failed_result.msg
             | default('the Kapowarr deployment failed and reported no message') }}

# Right after deploy: a `Restarting` container would pass later checks (#510). The
# sequence lives in roles/container_health/tasks/recover.yml (#646).
- name: Recover Kapowarr from a container that runs but never serves
  ansible.builtin.include_role:
    name: container_health
    tasks_from: recover
  vars:
    container_health_service_name: kapowarr
    container_health_project_name: "{{ kapowarr_compose_project_name }}"
    container_health_compose_dir: "{{ platform_current_dir }}/services/kapowarr"
    container_health_compose_files: "{{ platform_service_compose_files['kapowarr'] }}"
    container_health_env_files: ["{{ platform_runtime_dir }}/services/kapowarr/.env"]
    container_health_deploy_failure_message: >-
      {{ kapowarr_deploy_failure_message | default('') }}

- name: Report the Kapowarr deployment
  ansible.builtin.include_role:
    name: deployment_bundle
    tasks_from: report
  vars:
    deployment_report_service: Kapowarr
    # Both Compose results: a recreate that repaired a wedged container is a change too.
    deployment_report_changed: >-
      {{ (kapowarr_deploy is changed)
         or ((container_health_wedged_recreate | default({})) is changed)
         or ((pre_upgrade_backup_restart | default({})) is changed) }}

- name: Verify Kapowarr effective container CPU policy
  ansible.builtin.include_role:
    name: container_cpu
  vars:
    container_cpu_service_name: kapowarr
    container_cpu_project_name: "{{ kapowarr_compose_project_name }}"

# /api/public is unauthenticated and reports the auth mode: 0 none, 1 password, 2 pair.
- name: Wait for Kapowarr application readiness
  ansible.builtin.uri:
    url: "{{ kapowarr_api }}/api/public"
    method: GET
    status_code: [200]
    return_content: true
  register: kapowarr_public
  until:
    - kapowarr_public.json | default(none) is mapping
    - (kapowarr_public.json.result | default({})).authentication_method | default(none) is number
  retries: "{{ platform_readiness_retries }}"
  delay: "{{ platform_readiness_delay }}"
  changed_when: false
  check_mode: false

# The identity can only be learned by presenting it; a login returns the API key, so both
# probes are redacted.
- name: Probe the vault-authored Kapowarr administrator
  ansible.builtin.uri:
    url: "{{ kapowarr_api }}/api/auth"
    method: POST
    body_format: json
    body:
      username: "{{ vault_kapowarr_admin_username }}"
      password: "{{ vault_kapowarr_admin_password }}"
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: kapowarr_identity_probe
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

# Redacted: an open Kapowarr returns its API key. Gated off at mode 2, where a refusal is
# certain, so the security log is not spammed; tests/contracts/kapowarr.sh proves the 401.
- name: Probe Kapowarr for an unprotected application interface
  ansible.builtin.uri:
    url: "{{ kapowarr_api }}/api/auth"
    method: POST
    body_format: json
    body: {}
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: kapowarr_anonymous_probe
  when:
    - (kapowarr_public.json.result | default({})).authentication_method | default(0) | int != 2
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

# Mode 1 accepts any username, so only mode 2 is converged. A skipped probe defaults to 0.
# Redacted: the resolved API key.
- name: Resolve the Kapowarr administrator reconciliation
  ansible.builtin.set_fact:
    kapowarr_identity_current: >-
      {{ kapowarr_identity_probe.status | default(0) | int == 200 and
         (kapowarr_public.json.result | default({})).authentication_method | default(0) | int == 2 }}
    kapowarr_settings_api_key: >-
      {{ kapowarr_identity_probe.json.result.api_key
         if kapowarr_identity_probe.status | default(0) | int == 200
         else (kapowarr_anonymous_probe.json.result.api_key
               if kapowarr_anonymous_probe.status | default(0) | int == 200
               else '') }}
  no_log: true

- name: Refuse an unrecoverable Kapowarr administrator identity
  ansible.builtin.assert:
    that:
      - kapowarr_identity_current | bool or kapowarr_settings_api_key | length > 0
    fail_msg: >-
      Kapowarr holds an administrator identity this platform did not author and
      refuses both that identity and an unauthenticated caller, so no converge
      can replace it. Recover the deployed password or remove the Kapowarr
      database before running again.

- name: Report the planned Kapowarr administrator provisioning
  ansible.builtin.debug:
    msg: >-
      Kapowarr does not hold the vault-authored administrator pair; a live run
      would declare it through the application settings interface.
  when:
    - ansible_check_mode
    - not kapowarr_identity_current | bool

# Salted hashes cannot be precomputed, so the clear pair is sent, only when missing.
# Redacted: the administrator identity enters the target here.
- name: Declare the vault-authored Kapowarr administrator
  ansible.builtin.uri:
    url: "{{ kapowarr_api }}/api/settings?api_key={{ kapowarr_settings_api_key }}"
    method: PUT
    body_format: json
    body:
      auth_username: "{{ vault_kapowarr_admin_username }}"
      auth_password: "{{ vault_kapowarr_admin_password }}"
    status_code: [200]
  when:
    - not ansible_check_mode
    - not kapowarr_identity_current | bool
  changed_when: true
  no_log: true

# Redacted: the API key is in the query string.
- name: Read the declared Kapowarr library roots
  ansible.builtin.uri:
    url: "{{ kapowarr_api }}/api/rootfolder?api_key={{ kapowarr_settings_api_key }}"
    method: GET
    status_code: [200]
    return_content: true
  register: kapowarr_root_folders
  changed_when: false
  check_mode: false
  no_log: true

# Compared without the trailing separator Kapowarr stores.
- name: Resolve whether Kapowarr owns the declared comics library root
  ansible.builtin.set_fact:
    kapowarr_library_root_present: >-
      {{ kapowarr_root_folders.json.result | default([]) | map(attribute='folder') |
         map('regex_replace', '/+$', '') | select('equalto', kapowarr_library_root) |
         list | length == 1 }}

# Any undeclared root (on an old deployment, `/comics`). Separate from the presence
# check: no roots is a fresh install; a different root is an unmigrated library.
- name: Resolve the Kapowarr library roots the declared one supersedes
  ansible.builtin.set_fact:
    kapowarr_library_root_migrations: >-
      {{ kapowarr_root_folders.json.result | default([]) | map(attribute='folder') |
         map('regex_replace', '/+$', '') | reject('equalto', kapowarr_library_root) |
         list }}

# Refused before any library mutation, with no override: Kapowarr cannot relabel a stored
# prefix safely. Kapowarr fabricates a missing root on read, so the message says the empty
# library is harmless and nothing on the host moved.
- name: Refuse a Kapowarr deployment still holding a superseded library root
  ansible.builtin.assert:
    that:
      - >-
        kapowarr_library_root_present | bool or
        kapowarr_library_root_migrations | length == 0
    fail_msg: >-
      Kapowarr holds {{ kapowarr_library_root_migrations | join(', ') }} rather than the
      declared {{ kapowarr_library_root }}. This deployment mounts the whole
      {{ kapowarr_books_host_path }} share at the parent of both the library and its
      staging directory, so that an import is a rename instead of a cross-device copy,
      and the container paths moved with it. Kapowarr stores the old prefix in its root
      folder record and in every volume's folder, so the library has to be relabelled
      before this platform can converge it, and no Kapowarr route can do that while the
      old paths no longer resolve. Nothing on the host has moved and no comic has been
      deleted: the empty library the web interface now shows is the empty directory
      Kapowarr itself created when it read a root folder whose path no longer exists in
      the container. Relabel the three stored columns with the container stopped, then
      rerun -- docs/dossier-kapowarr.md, "Migrating the stored library prefix", is the
      procedure. No root folder was created and no volume was moved.

- name: Report the planned Kapowarr comics library root
  ansible.builtin.debug:
    msg: >-
      Kapowarr does not own the declared comics library root; a live run would
      create it.
  when:
    - ansible_check_mode
    - not kapowarr_library_root_present | bool

# Redacted: the API key is in the query string.
- name: Declare the Kapowarr comics library root
  ansible.builtin.uri:
    url: "{{ kapowarr_api }}/api/rootfolder?api_key={{ kapowarr_settings_api_key }}"
    method: POST
    body_format: json
    body:
      folder: "{{ kapowarr_library_root }}"
    status_code: [201]
  when:
    - not ansible_check_mode
    - not kapowarr_library_root_present | bool
  changed_when: true
  no_log: true

# Settings are a partial merge; a credential key could never converge (read back masked).
- name: Refuse a Kapowarr settings declaration that names a credential
  ansible.builtin.assert:
    that:
      - >-
        kapowarr_settings.keys() | list
        | select('in', kapowarr_settings_credential_keys) | list | length == 0
      - "'service_preference' not in kapowarr_settings"
    fail_msg: >-
      The declared Kapowarr settings must name no credential and must not carry
      service_preference. Credentials read back masked and can never match, and
      since v1.3.2 the service order is not a setting at all: it lives on the
      GetComics indexer and is declared as a partial ordering in
      kapowarr_service_preference instead (#671).

# Redacted: the API key is in the query string.
- name: Read the deployed Kapowarr application settings
  ansible.builtin.uri:
    url: "{{ kapowarr_api }}/api/settings?api_key={{ kapowarr_settings_api_key }}"
    method: GET
    status_code: [200]
    return_content: true
  register: kapowarr_settings_deployed
  changed_when: false
  check_mode: false
  no_log: true

# The service order moved to the GetComics indexer in v1.3.2 (PUT here answers 400).
- name: Resolve the declared Kapowarr application settings
  ansible.builtin.set_fact:
    kapowarr_settings_declared: "{{ kapowarr_settings }}"

# The API reports nothing about what changed, so drift is computed here; only key names
# are reported.
- name: Resolve which declared Kapowarr settings the application does not hold
  ansible.builtin.set_fact:
    kapowarr_settings_drift_keys: >-
      {{ kapowarr_settings_declared | dict2items
         | reject('in', kapowarr_settings_deployed.json.result | dict2items)
         | map(attribute='key') | list }}

- name: Report the planned Kapowarr application settings
  ansible.builtin.debug:
    msg: >-
      Kapowarr does not hold the declared application settings; a live run would
      declare {{ kapowarr_settings_drift_keys | join(', ') }}.
  when:
    - ansible_check_mode
    - kapowarr_settings_drift_keys | length > 0

# The whole subset is submitted so an invalid key fails the request whole.
# Redacted: the API key is in the query string.
- name: Declare the Kapowarr application settings
  ansible.builtin.uri:
    url: "{{ kapowarr_api }}/api/settings?api_key={{ kapowarr_settings_api_key }}"
    method: PUT
    body_format: json
    body: "{{ kapowarr_settings_declared }}"
    status_code: [200]
  when:
    - not ansible_check_mode
    - kapowarr_settings_drift_keys | length > 0
  changed_when: true
  no_log: true

# v1.3.2 keeps the service order on the GetComics indexer (#671). A 404 is accepted only
# under --check, where the older image still answers. Redacted: API key in the query.
- name: Read the deployed Kapowarr indexers
  ansible.builtin.uri:
    url: "{{ kapowarr_api }}/api/indexers?api_key={{ kapowarr_settings_api_key }}"
    method: GET
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: kapowarr_indexers
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

# Readable verdict for a redacted read: status, error code, one explanation, never the
# URL or msg (they carry the key). A non-list result must not read as zero indexers.
- name: Require a Kapowarr indexer read the role can act on
  ansible.builtin.assert:
    that:
      - >-
        kapowarr_indexers.status | default(0) | int == 200
        or (ansible_check_mode and kapowarr_indexers.status | default(0) | int == 404)
      - >-
        kapowarr_indexers.status | default(0) | int != 200
        or ((kapowarr_indexers.json | default(none)) is mapping
            and (kapowarr_indexers.json.result | default(none)) is sequence
            and (kapowarr_indexers.json.result | default(none)) is not mapping
            and (kapowarr_indexers.json.result | default(none)) is not string
            and kapowarr_indexers.json.result | reject('mapping') | list | length == 0)
    fail_msg: >-
      Kapowarr answered GET /api/indexers with status
      {{ kapowarr_indexers.status | default('none') }} ({{ kapowarr_indexers_error }}).
      {{ kapowarr_indexers_explanation }} No indexer was changed.
  # Expressions here, not in the message: a folded scalar keeps breaks around indented lines.
  vars:
    kapowarr_indexers_error: >-
      {{ ((kapowarr_indexers.json | default({})) if (kapowarr_indexers.json | default({})) is mapping
          else {}).error | default('no error code', true) }}
    kapowarr_indexers_explanation: >-
      {{ kapowarr_indexers_unusable if kapowarr_indexers.status | default(0) | int == 200
         else kapowarr_indexers_missing if kapowarr_indexers.status | default(0) | int == 404
         else kapowarr_indexers_unanswered if kapowarr_indexers.status | default(0) | int == -1
         else kapowarr_indexers_unauthorized if kapowarr_indexers.status | default(0) | int == 401
         else kapowarr_indexers_failed }}
    kapowarr_indexers_unusable: >-
      The body is not the JSON list of indexer records that route returns, so
      this run cannot count the GetComics indexers it holds. Check which image
      the container on port {{ kapowarr_port }} runs and whether something else
      answers there.
    kapowarr_indexers_missing: >-
      This live run has just deployed the pinned image, which serves that route,
      so the Kapowarr answering on port {{ kapowarr_port }} is not the pinned
      one. Check which image the container runs and whether something else holds
      the port.
    kapowarr_indexers_unanswered: >-
      No answer arrived: the connection to port {{ kapowarr_port }} was refused,
      dropped or timed out after {{ kapowarr_indexers.elapsed | default('an unknown number of') }}
      seconds. Check that the Kapowarr container is running.
    kapowarr_indexers_unauthorized: >-
      The API key this run holds came from the login above, so Kapowarr rotated
      it between that login and this read.
    kapowarr_indexers_failed: >-
      Kapowarr failed while serving the read rather than refusing it; its own log
      names the cause.

- name: Report the Kapowarr download service order check mode defers
  ansible.builtin.debug:
    msg: >-
      The running Kapowarr predates the indexer interface, so this review cannot
      read the download service order where the pinned image keeps it. Starting
      the pinned image migrates the global service_preference onto the GetComics
      indexer, and a live run then reconciles kapowarr_service_preference there.
  when: kapowarr_indexers.status | default(0) | int == 404

# client_type is immutable; the title is editable.
- name: Resolve the Kapowarr GetComics indexer
  ansible.builtin.set_fact:
    kapowarr_getcomics_indexers: >-
      {{ kapowarr_indexers.json.result | default([])
         | selectattr('client_type', 'defined')
         | selectattr('client_type', 'equalto', 'GetComics') | list }}
  when: kapowarr_indexers.status | default(0) | int == 200

# Exactly one GetComics indexer exists unless someone deleted or duplicated it; both are
# refused rather than repaired (repairing would mean owning undeclared fields).
- name: Refuse a Kapowarr without exactly one GetComics indexer
  ansible.builtin.assert:
    that:
      - kapowarr_getcomics_indexers | length == 1
    fail_msg: >-
      Kapowarr holds {{ kapowarr_getcomics_indexers | length }} GetComics indexers, and this
      platform declares the download service order on exactly one.
      {{ kapowarr_getcomics_indexer_missing if kapowarr_getcomics_indexers | length == 0
         else kapowarr_getcomics_indexer_duplicated }} No indexer was changed.
  vars:
    # Separate folded scalars: an indented continuation would keep its line break.
    kapowarr_getcomics_indexer_missing: >-
      Add the GetComics indexer back under Settings, Indexers in the web
      interface, then rerun.
    kapowarr_getcomics_indexer_duplicated: >-
      Kapowarr refuses to add a second one, so its database was edited outside
      the application; delete all but one under Settings, Indexers, then rerun.
  when: kapowarr_indexers.status | default(0) | int == 200

# Kapowarr accepts only a full permutation, so the declared order is applied over the
# deployed one; unknown declared services drop out.
- name: Resolve the declared Kapowarr download service order
  vars:
    kapowarr_service_order_base: >-
      {{ kapowarr_getcomics_indexers[0].gc_service_preference
         if kapowarr_getcomics_indexers[0].gc_service_preference | default([], true) | length > 0
         else kapowarr_service_preference }}
  ansible.builtin.set_fact:
    kapowarr_service_preference_deployed: >-
      {{ kapowarr_getcomics_indexers[0].gc_service_preference | default([], true) }}
    kapowarr_service_preference_declared: >-
      {{ (kapowarr_service_preference | select('in', kapowarr_service_order_base) | list)
         + (kapowarr_service_order_base | reject('in', kapowarr_service_preference) | list) }}
  when: kapowarr_indexers.status | default(0) | int == 200

- name: Report the planned Kapowarr download service order
  ansible.builtin.debug:
    msg: >-
      The Kapowarr GetComics indexer orders its download services
      {{ kapowarr_service_preference_deployed | join(', ') }}; a live run would declare
      {{ kapowarr_service_preference_declared | join(', ') }}.
  when:
    - ansible_check_mode
    - kapowarr_indexers.status | default(0) | int == 200
    - kapowarr_service_preference_declared != kapowarr_service_preference_deployed

# Not a partial merge: restate the read record with only the order replaced. Kapowarr
# tests getcomics.org before storing, so this is gated on drift and never runs on a
# converged host. Redacted: API key in the query.
- name: Declare the Kapowarr download service order on the GetComics indexer
  ansible.builtin.uri:
    url: >-
      {{ kapowarr_api }}/api/indexers/{{ kapowarr_getcomics_indexers[0].id }}?api_key={{ kapowarr_settings_api_key }}
    method: PUT
    body_format: json
    body: >-
      {{ kapowarr_getcomics_indexers[0]
         | combine({'gc_service_preference': kapowarr_service_preference_declared}) }}
    status_code: "{{ range(100, 600) | list }}"
    # Above one Kapowarr test attempt (30s+30s), below its full retry cycle (~2m42s).
    timeout: 75
  register: kapowarr_service_order_write
  when:
    - not ansible_check_mode
    - kapowarr_service_preference_declared != kapowarr_service_preference_deployed
  failed_when: false
  changed_when: kapowarr_service_order_write.status | default(0) | int == 200
  no_log: true

# Readable verdict for a redacted write; never the request, msg or echoed value. A -1 at
# the 75s timeout means getcomics.org was unreachable; sooner means Kapowarr itself was.
- name: Require the Kapowarr download service order write to have been stored
  ansible.builtin.assert:
    that:
      - kapowarr_service_order_write.status | default(0) | int == 200
    fail_msg: >-
      Kapowarr answered the download service order write on GetComics indexer
      {{ kapowarr_getcomics_indexers[0].id }} with status
      {{ kapowarr_service_order_write.status | default('none') }} ({{ kapowarr_service_order_write_code }})
      after {{ kapowarr_service_order_write.elapsed | default('an unknown number of') }} seconds.
      {{ kapowarr_service_order_explanation }}
  # Expressions here, not in the message: a folded scalar keeps breaks around indented lines.
  vars:
    kapowarr_service_order_write_error: >-
      {{ ((kapowarr_service_order_write.json | default({}))
          if (kapowarr_service_order_write.json | default({})) is mapping else {}).error | default('') }}
    kapowarr_service_order_write_code: >-
      {{ kapowarr_service_order_write_error | default('no error code', true) }}{{
         (', ' ~ kapowarr_service_order_write.json.result.reason)
         if ((kapowarr_service_order_write.json | default({})).result | default({})).reason is defined
         else '' }}
    kapowarr_service_order_explanation: >-
      {{ kapowarr_service_order_unreachable if kapowarr_service_order_write_error == 'ClientNotWorking'
         else kapowarr_service_order_timed_out
         if kapowarr_service_order_write.status | default(0) | int == -1
            and kapowarr_service_order_write.elapsed | default(0) | int >= 75
         else kapowarr_service_order_unanswered if kapowarr_service_order_write.status | default(0) | int == -1
         else kapowarr_service_order_unauthorized if kapowarr_service_order_write.status | default(0) | int == 401
         else kapowarr_service_order_refused if kapowarr_service_order_write.status | default(0) | int == 400
         else kapowarr_service_order_failed }}
    kapowarr_service_order_retry: >-
      The write only runs because the order was changed in the web interface, so
      putting the order back under Settings, Indexers also makes it unnecessary.
      Until one of those happens every converge stops here, and nothing after
      Kapowarr in site.yml runs.
    kapowarr_service_order_unreachable: >-
      Kapowarr tests the GetComics indexer against its URL before it stores
      anything, and answers ClientNotWorking when getcomics.org cannot be reached
      from the NAS, so the order was not stored. Restore the NAS's reach to
      getcomics.org and rerun. {{ kapowarr_service_order_retry }}
    kapowarr_service_order_timed_out: >-
      No answer arrived within this request's 75-second bound. Against an
      unreachable getcomics.org Kapowarr keeps retrying its own test for longer
      than that, and may still store the order if the test later passes, so rerun:
      a converge that finds the order stored issues no write. If it times out
      again, restore the NAS's reach to getcomics.org.
      {{ kapowarr_service_order_retry }}
    kapowarr_service_order_unanswered: >-
      The request ended without an answer before its 75-second bound, so the
      connection to Kapowarr on port {{ kapowarr_port }} was refused or dropped
      rather than left waiting on getcomics.org. A refusal at 0 seconds never
      reached Kapowarr; a later drop cannot say whether Kapowarr received the
      write, so rerun: a converge that finds the order stored issues no write.
      Check that the Kapowarr container is running.
    kapowarr_service_order_unauthorized: >-
      Kapowarr refused the API key this run took from the login above, so it
      rotated that key between the login and this write. The order was not stored;
      rerun.
    kapowarr_service_order_refused: >-
      Kapowarr validated the order it was sent and refused it, so the order was
      not stored. The order sent is kapowarr_service_preference merged over the
      order the indexer held.
    kapowarr_service_order_failed: >-
      Kapowarr failed while handling the write rather than refusing what it was
      sent, so whether the order was stored is not known. Its own log names the
      cause; rerun once that is resolved.
  when:
    - not ansible_check_mode
    - kapowarr_service_preference_declared != kapowarr_service_preference_deployed

# Changing volume_folder_naming does not move existing volumes (stored at add time), so
# every volume is converged onto the declared template. Redacted: API key in the query.
- name: Read the Kapowarr library volumes
  ansible.builtin.uri:
    url: "{{ kapowarr_api }}/api/volumes?api_key={{ kapowarr_settings_api_key }}"
    method: GET
    status_code: [200]
    return_content: true
  register: kapowarr_volumes
  changed_when: false
  check_mode: false
  no_log: true

# Kapowarr's own rename preview is the only source of the derived folder; reimplementing
# it in Jinja would drift by a character and never converge. Previews only; redacted.
- name: Read the Kapowarr rename plan for every volume
  ansible.builtin.uri:
    url: >-
      {{ kapowarr_api }}/api/volumes/{{ item.id }}/rename?api_key={{ kapowarr_settings_api_key }}
    method: GET
    status_code: [200]
    return_content: true
  register: kapowarr_volume_rename_plans
  loop: "{{ kapowarr_volumes.json.result | default([]) }}"
  loop_control:
    label: "{{ item.id }}"
  changed_when: false
  check_mode: false
  no_log: true

- name: Reset the Kapowarr volume folder plan
  ansible.builtin.set_fact:
    kapowarr_volume_folder_plan: []

# `target`: the folder Kapowarr would move the volume to (empty if converged or no files).
# `nested`: deeper than one level, so not template-derived. Folderless volumes excluded.
- name: Resolve the Kapowarr volume folder plan
  ansible.builtin.set_fact:
    kapowarr_volume_folder_plan: >-
      {{ kapowarr_volume_folder_plan + [{
           'id': item.item.id,
           'title': item.item.title,
           'folder': item.item.folder | default('', true),
           'target': (item.json.result | default({}) | dict2items | map(attribute='value')
                      | reject('match', '\A' ~ (item.item.folder | default('', true) | regex_escape) ~ '/')
                      | map('dirname') | sort | first | default('', true)),
           'nested': ((item.item.folder | default('', true) | dirname) != kapowarr_library_root),
         }] }}
  loop: "{{ kapowarr_volume_rename_plans.results | default([]) }}"
  loop_control:
    label: "{{ item.item.id | default('') }}"
  no_log: true

- name: Reset the pending Kapowarr volume folder migrations
  ansible.builtin.set_fact:
    kapowarr_volume_folder_migrations: []
    kapowarr_volume_folders_unconfined: []

# Confinement: both the current and target folders must be inside the comics library, the
# only tree a restore covers; violations are refused and reported, never migrated.
- name: Resolve the pending Kapowarr volume folder migrations
  ansible.builtin.set_fact:
    kapowarr_volume_folder_migrations: "{{ kapowarr_volume_folder_migrations + [item] }}"
  when:
    - item.folder is match('\A' ~ (kapowarr_library_root | regex_escape) ~ '/')
    - item.target | length == 0 or
      item.target is match('\A' ~ (kapowarr_library_root | regex_escape) ~ '/')
    - item.target | length > 0 or item.nested | bool
  loop: "{{ kapowarr_volume_folder_plan }}"
  loop_control:
    label: "{{ item.id }}"

- name: Resolve the Kapowarr volume folders outside the declared library root
  ansible.builtin.set_fact:
    kapowarr_volume_folders_unconfined: "{{ kapowarr_volume_folders_unconfined + [item] }}"
  when:
    - item.target | length > 0 or item.nested | bool
    - not (item.folder is match('\A' ~ (kapowarr_library_root | regex_escape) ~ '/')) or
      (item.target | length > 0 and
       not (item.target is match('\A' ~ (kapowarr_library_root | regex_escape) ~ '/')))
  loop: "{{ kapowarr_volume_folder_plan }}"
  loop_control:
    label: "{{ item.id }}"

# One line per volume so --check --diff reviews each move; reported even with the gate shut.
- name: Report each pending Kapowarr volume folder migration
  ansible.builtin.debug:
    msg: >-
      Kapowarr volume {{ item.id }} ({{ item.title }}) holds {{ item.folder }}
      {{ ('and the declared naming template derives ' ~ item.target)
      if item.target | length > 0 else
      ('and holds no files, so Kapowarr previews no target for it: a live run would move it to
      the name the declared template derives, directly under ' ~ kapowarr_library_root) }}.
      {{ 'This run moves it.' if kapowarr_volume_folder_migration_allowed | bool else
      'A run carrying kapowarr_volume_folder_migration_allowed=true would move it.' }}
  loop: "{{ kapowarr_volume_folder_migrations }}"
  loop_control:
    label: "{{ item.id }}"
  changed_when: false

- name: Report each Kapowarr volume folder outside the declared library root
  ansible.builtin.debug:
    msg: >-
      Kapowarr volume {{ item.id }} ({{ item.title }}) holds {{ item.folder }}
      {{ ('and Kapowarr would derive ' ~ item.target) if item.target | length > 0
      else 'and Kapowarr previews no target for it' }}, and one of those is outside the
      declared library root {{ kapowarr_library_root }}. The migration refuses it: moving it
      would touch a directory outside the comics library. Repair it in Kapowarr, by pointing
      the volume at the declared root folder, before this platform can converge it.
  loop: "{{ kapowarr_volume_folders_unconfined }}"
  loop_control:
    label: "{{ item.id }}"
  changed_when: false

# Reported whenever set, so a flag left on is visible.
- name: Report the one-convergence Kapowarr volume folder migration input
  ansible.builtin.debug:
    msg: >-
      KAPOWARR_VOLUME_FOLDER_MIGRATION_ALLOWED: pending volume folder moves
      {{ kapowarr_volume_folder_migrations | map(attribute='folder') | list }}.
      kapowarr_volume_folder_migration_allowed is a one-convergence input, not a platform
      setting: drop it from the next run and never store it in a host variable file. An empty
      list here means it is already stale. Komga indexes the directories these moves rename,
      so rescan its Comics library once this run finishes.
  when: kapowarr_volume_folder_migration_allowed | bool
  changed_when: false

# `volume_folder: null` makes Kapowarr derive, move (rename) and record the folder;
# `custom_folder: false` undoes its own bookkeeping bug. The derivation uses the volume's
# root folder, so exactly one root is asserted right before this mutation.
- name: Refuse a Kapowarr volume folder migration beyond the declared library root
  ansible.builtin.assert:
    that:
      - >-
        kapowarr_root_folders.json.result | default([]) | map(attribute='folder') |
        map('regex_replace', '/+$', '') | list == [kapowarr_library_root]
    fail_msg: >-
      Kapowarr owns library roots other than the declared
      {{ kapowarr_library_root }}, and it derives a volume's new folder from the root that
      volume is attached to, so a migration could move a directory outside the comics
      library. Remove the undeclared root folder in Kapowarr first. No volume was moved.
  when: kapowarr_volume_folder_migrations | length > 0

# The only mutation that moves a comics directory, hence gated. Kapowarr removes emptied
# parents up to the library root. Redacted: API key in the query.
- name: Migrate Kapowarr volume folders onto the declared naming template
  ansible.builtin.uri:
    url: "{{ kapowarr_api }}/api/volumes/{{ item.id }}?api_key={{ kapowarr_settings_api_key }}"
    method: PUT
    body_format: json
    body:
      volume_folder: null
      custom_folder: false
    status_code: [200]
  loop: "{{ kapowarr_volume_folder_migrations }}"
  loop_control:
    label: "{{ item.id }}"
  when:
    - not ansible_check_mode
    - kapowarr_volume_folder_migration_allowed | bool
  changed_when: true
  no_log: true

- name: Verify the Kapowarr service endpoint
  tags: [platform_verify_kapowarr]
  ansible.builtin.uri:
    url: "{{ kapowarr_api }}/api/public"
    method: GET
    status_code: [200]
    return_content: true
  register: kapowarr_verify_public
  changed_when: false
  check_mode: false

# Proves the vault identity is accepted, anonymous callers refused and the root owned.
# Any status accepted so the assertion names the outcome. Redacted: the credential.
- name: Verify Kapowarr accepts the vault administrator
  tags: [platform_verify_kapowarr]
  ansible.builtin.uri:
    url: "{{ kapowarr_api }}/api/auth"
    method: POST
    body_format: json
    body:
      username: "{{ vault_kapowarr_admin_username }}"
      password: "{{ vault_kapowarr_admin_password }}"
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: kapowarr_verify_identity
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

# Gated like the converge probe: an anonymous POST logs a failed login, and this runs on
# every converge and from verify.yml.
- name: Verify Kapowarr refuses an unauthenticated caller
  tags: [platform_verify_kapowarr]
  ansible.builtin.uri:
    url: "{{ kapowarr_api }}/api/auth"
    method: POST
    body_format: json
    body: {}
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: kapowarr_verify_anonymous
  when:
    - (kapowarr_verify_public.json.result | default({})).authentication_method | default(0) | int != 2
  failed_when: false
  changed_when: false
  check_mode: false

# Redacted: the API key the login returned.
- name: Verify the Kapowarr comics library root ownership
  tags: [platform_verify_kapowarr]
  ansible.builtin.uri:
    url: >-
      {{ kapowarr_api }}/api/rootfolder?api_key={{
         kapowarr_verify_identity.json.result.api_key | default('') }}
    method: GET
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: kapowarr_verify_roots
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

# Compared against defaults: verify.yml has none of the converge's facts. The order is
# compared as a partial ordering. Redacted: API key.
- name: Verify the Kapowarr declared application settings
  tags: [platform_verify_kapowarr]
  ansible.builtin.uri:
    url: >-
      {{ kapowarr_api }}/api/settings?api_key={{
         kapowarr_verify_identity.json.result.api_key | default('') }}
    method: GET
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: kapowarr_verify_settings
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

# The order lives on the GetComics indexer since v1.3.2 (#671). Redacted: API key.
- name: Verify the Kapowarr GetComics indexer
  tags: [platform_verify_kapowarr]
  ansible.builtin.uri:
    url: >-
      {{ kapowarr_api }}/api/indexers?api_key={{
         kapowarr_verify_identity.json.result.api_key | default('') }}
    method: GET
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: kapowarr_verify_indexers
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

# Normalized: an unauthorized Kapowarr answers a mapping where the list was.
- name: Resolve the Kapowarr GetComics indexers reported for verification
  tags: [platform_verify_kapowarr]
  ansible.builtin.set_fact:
    kapowarr_verify_getcomics_indexers: >-
      {{ (kapowarr_verify_indexers.json.result
          if (kapowarr_verify_indexers.json.result | default(none)) is sequence
             and (kapowarr_verify_indexers.json.result | default(none)) is not mapping
             and (kapowarr_verify_indexers.json.result | default(none)) is not string
          else [])
         | select('mapping') | selectattr('client_type', 'defined')
         | selectattr('client_type', 'equalto', 'GetComics') | list }}

# The mode-2 condition carries the refusal (proved live by tests/contracts/kapowarr.sh).
# The 401 comparison stays: the contract requires the anonymous outcome to be named.
- name: Require the exact Kapowarr verification results
  tags: [platform_verify_kapowarr]
  ansible.builtin.assert:
    that:
      - (kapowarr_verify_public.json.result | default({})).authentication_method | default(0) | int == 2
      - kapowarr_verify_identity.status | default(0) | int == 200
      - >-
        kapowarr_verify_anonymous.skipped | default(false) | bool
        or kapowarr_verify_anonymous.status | default(0) | int == 401
      - kapowarr_verify_roots.status | default(0) | int == 200
      - >-
        kapowarr_verify_roots.json.result | default([]) | map(attribute='folder') |
        map('regex_replace', '/+$', '') | list == [kapowarr_library_root]
      - kapowarr_verify_settings.status | default(0) | int == 200
      - >-
        (kapowarr_verify_settings.json.result | default({}) | dict2items |
         selectattr('key', 'in', kapowarr_settings.keys() | list) | items2dict)
        == kapowarr_settings
      # The order conditions follow those proving one record exists. A 404 passes only under
      # --check.
      - >-
        kapowarr_verify_indexers.status | default(0) | int == 200
        or (ansible_check_mode and kapowarr_verify_indexers.status | default(0) | int == 404)
      - >-
        kapowarr_verify_indexers.status | default(0) | int == 404
        or kapowarr_verify_getcomics_indexers | length == 1
      - >-
        kapowarr_verify_indexers.status | default(0) | int == 404
        or kapowarr_verify_getcomics_indexers[0].gc_service_preference | default([], true) | length > 0
      - >-
        kapowarr_verify_indexers.status | default(0) | int == 404
        or (kapowarr_verify_getcomics_indexers[0].gc_service_preference
            | select('in', kapowarr_service_preference) | list)
           == (kapowarr_service_preference
               | select('in', kapowarr_verify_getcomics_indexers[0].gc_service_preference) | list)
    fail_msg: >-
      Kapowarr is unreachable, or it no longer accepts exactly the vault-authored
      administrator, refuses everyone else, owns exactly the declared comics
      library root, holds the declared application settings, and holds exactly
      one GetComics indexer in the declared download service order.

# Verified, not only migrated: a hand-edited template or rename can reintroduce drift.
# Redacted: API key.
- name: Read the Kapowarr library volumes for verification
  tags: [platform_verify_kapowarr]
  ansible.builtin.uri:
    url: >-
      {{ kapowarr_api }}/api/volumes?api_key={{
         kapowarr_verify_identity.json.result.api_key | default('') }}
    method: GET
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: kapowarr_verify_volumes
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

# An unauthorized Kapowarr answers a mapping, which would break the loop below instead of
# reaching the diagnosis; normalized here.
- name: Resolve the Kapowarr volumes reported for verification
  tags: [platform_verify_kapowarr]
  ansible.builtin.set_fact:
    kapowarr_verify_volume_list: >-
      {{ kapowarr_verify_volumes.json.result
         if (kapowarr_verify_volumes.json.result | default(none)) is sequence
            and (kapowarr_verify_volumes.json.result | default(none)) is not mapping
            and (kapowarr_verify_volumes.json.result | default(none)) is not string
         else [] }}

# Redacted: the API key the login returned.
- name: Read the Kapowarr rename plan for every volume for verification
  tags: [platform_verify_kapowarr]
  ansible.builtin.uri:
    url: >-
      {{ kapowarr_api }}/api/volumes/{{ item.id }}/rename?api_key={{
         kapowarr_verify_identity.json.result.api_key | default('') }}
    method: GET
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: kapowarr_verify_rename_plans
  loop: "{{ kapowarr_verify_volume_list }}"
  loop_control:
    label: "{{ item.id }}"
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

- name: Reset drifted Kapowarr volume folders
  tags: [platform_verify_kapowarr]
  ansible.builtin.set_fact:
    kapowarr_verify_volume_folder_drift: []

# Same two readings as the converge; a folderless volume is drift here.
- name: Resolve drifted Kapowarr volume folders
  tags: [platform_verify_kapowarr]
  ansible.builtin.set_fact:
    kapowarr_verify_volume_folder_drift: >-
      {{ kapowarr_verify_volume_folder_drift + [{
           'id': item.item.id,
           'folder': item.item.folder | default('', true),
         }] }}
  when: >-
    (item.item.folder | default('', true) | length == 0) or
    ((item.item.folder | default('', true) | dirname) != kapowarr_library_root) or
    ((item.json.result | default({}) | dict2items | map(attribute='value')
      | reject('match', '\A' ~ (item.item.folder | default('', true) | regex_escape) ~ '/')
      | list | length) > 0)
  loop: "{{ kapowarr_verify_rename_plans.results | default([]) }}"
  loop_control:
    label: "{{ item.item.id | default('') }}"
  no_log: true

# An empty library passes; both reads must still have answered.
- name: Require converged Kapowarr volume folders
  tags: [platform_verify_kapowarr]
  ansible.builtin.assert:
    that:
      - kapowarr_verify_volumes.status | default(0) | int == 200
      - >-
        kapowarr_verify_rename_plans.results | default([]) | length ==
        kapowarr_verify_volume_list | length
      - kapowarr_verify_volume_folder_drift | length == 0
    fail_msg: >-
      Kapowarr is unreachable, or it holds volume folders the declared
      volume_folder_naming does not derive: {{ kapowarr_verify_volume_folder_drift
      | map(attribute='folder') | list }}. Komga builds a series from the directory that
      directly contains the books, so each of those is a series it titles after the wrong
      directory. Review the migration with --check --diff, then rerun that one convergence
      with kapowarr_volume_folder_migration_allowed=true. A folder in that list which is
      not under {{ kapowarr_library_root }} is the one case the migration refuses rather
      than repairs, because moving it would leave the comics library; repair that volume's
      root folder in Kapowarr instead.
