---
- name: Revalidate deployment paths before Kapowarr runtime use
  ansible.builtin.include_role:
    name: deployment_bundle
    tasks_from: target
  vars:
    deployment_target_service: kapowarr
    deployment_target_require_current_release: true
    deployment_target_extra_paths:
      - "{{ kapowarr_config_host_path }}"
      # The comics library is named because the volume folder migration below
      # moves directories inside it. Naming it here is what runs this role's
      # containment check against it before anything moves: a symlink anywhere
      # between the media root and the library, or a library that canonically
      # resolves outside the media root, refuses the run rather than letting a
      # rename follow the link out of the tree the platform owns.
      - "{{ kapowarr_comics_host_path }}"

# The ComicVine key is the one Kapowarr credential this platform authors but
# does not push. Kapowarr validates `comicvine_api_key` by calling
# comicvine.gamespot.com before it will store the value, so a converge that set
# it would depend on a third party being reachable and un-rate-limited, and
# could not be proved in any disposable lane. The vault is still its authority:
# it is where the operator's key is recorded and recovered from. Guarding its
# shape here refuses a truncated or multi-line value at the top of the run
# instead of at the point the operator pastes it into the application.
- name: Require a well-formed Kapowarr ComicVine credential
  ansible.builtin.assert:
    that:
      - vault_kapowarr_comicvine_api_key is match('^[^\r\n]+$')
    fail_msg: The Kapowarr ComicVine credential must be a nonempty single-line value.

# Redacted: the conditions name the two halves of the Kapowarr administrator
# identity, which the platform submits to the application as JSON.
- name: Require env-safe Kapowarr administrator credentials
  ansible.builtin.assert:
    that:
      - vault_kapowarr_admin_username is match('^[^\r\n]+$')
      - vault_kapowarr_admin_password is match('^[^\r\n]+$')
    fail_msg: Kapowarr administrator credentials must be nonempty single-line values.
  no_log: true

- name: Render the Kapowarr environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ platform_runtime_dir }}/services/kapowarr/.env"
    mode: "0600"

- name: Deploy Kapowarr
  community.docker.docker_compose_v2:
    project_src: "{{ platform_current_dir }}/services/kapowarr"
    project_name: "{{ kapowarr_compose_project_name }}"
    files: "{{ platform_service_compose_files['kapowarr'] }}"
    env_files: ["{{ platform_runtime_dir }}/services/kapowarr/.env"]
    state: present
    wait: true
    wait_timeout: "{{ platform_compose_wait_timeout }}"
  register: kapowarr_deploy

- name: Report the Kapowarr deployment
  ansible.builtin.include_role:
    name: ntfy
    tasks_from: deployment_report
  vars:
    ntfy_deployment_report_service: Kapowarr
    ntfy_deployment_report_changed: "{{ kapowarr_deploy is changed }}"

- name: Verify Kapowarr effective container CPU policy
  ansible.builtin.include_role:
    name: container_cpu
  vars:
    container_cpu_service_name: kapowarr
    container_cpu_project_name: "{{ kapowarr_compose_project_name }}"

# /api/public is the only route Kapowarr leaves outside its API-key decorator,
# and it reports which authentication mode the deployed database holds: 0 for
# none, 1 for a bare password, 2 for the username and password pair this
# platform authors.
- name: Wait for Kapowarr application readiness
  ansible.builtin.uri:
    url: "{{ kapowarr_api }}/api/public"
    method: GET
    status_code: [200]
    return_content: true
  register: kapowarr_public
  until:
    - kapowarr_public.json | default(none) is mapping
    - (kapowarr_public.json.result | default({})).authentication_method | default(none) is number
  retries: "{{ platform_readiness_retries }}"
  delay: "{{ platform_readiness_delay }}"
  changed_when: false
  check_mode: false

# Kapowarr stores no credential outside its own database, so the deployed
# identity can only be learned by presenting the authored one. A successful
# login answers with the application's API key, which is what every other route
# demands; that is why both probes stay redacted even though only the first
# carries a credential in its request.
# Redacted: the request is the vault-authored administrator identity.
- name: Probe the vault-authored Kapowarr administrator
  ansible.builtin.uri:
    url: "{{ kapowarr_api }}/api/auth"
    method: POST
    body_format: json
    body:
      username: "{{ vault_kapowarr_admin_username }}"
      password: "{{ vault_kapowarr_admin_password }}"
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: kapowarr_identity_probe
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

# Redacted: an unprotected Kapowarr answers this credential-free request with
# the API key that authorizes every other route.
#
# The probe is conditional because Kapowarr records a credential-free auth POST
# as a failed login, and at mode 2 its outcome is already known: the authored
# pair is in force, so an empty body can only be refused. Asking anyway spent a
# WARNING in the application's own security log on every converge, which is what
# made that log useless for finding a real one. The gate leaves the probe for the
# only case where it can answer anything, an instance that is genuinely open. Do
# not drop it as redundant: the 401 at mode 2 is Confirmed against a running
# container in docs/dossier-kapowarr.md and is proved live in every disposable
# lane by tests/contracts/kapowarr.sh.
- name: Probe Kapowarr for an unprotected application interface
  ansible.builtin.uri:
    url: "{{ kapowarr_api }}/api/auth"
    method: POST
    body_format: json
    body: {}
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: kapowarr_anonymous_probe
  when:
    - (kapowarr_public.json.result | default({})).authentication_method | default(0) | int != 2
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

# A bare password (mode 1) accepts any username, so the authored pair is only
# actually in force at mode 2; reconciliation is required below that.
# A skipped anonymous probe carries no status, so it defaults to 0 and the key
# falls through to the empty string: at mode 2 the authored login is the only way
# to hold one, and failing to hold it is the unrecoverable case asserted below.
# Redacted: the resolved API key is the application's own authorization secret.
- name: Resolve the Kapowarr administrator reconciliation
  ansible.builtin.set_fact:
    kapowarr_identity_current: >-
      {{ kapowarr_identity_probe.status | default(0) | int == 200 and
         (kapowarr_public.json.result | default({})).authentication_method | default(0) | int == 2 }}
    kapowarr_settings_api_key: >-
      {{ kapowarr_identity_probe.json.result.api_key
         if kapowarr_identity_probe.status | default(0) | int == 200
         else (kapowarr_anonymous_probe.json.result.api_key
               if kapowarr_anonymous_probe.status | default(0) | int == 200
               else '') }}
  no_log: true

- name: Refuse an unrecoverable Kapowarr administrator identity
  ansible.builtin.assert:
    that:
      - kapowarr_identity_current | bool or kapowarr_settings_api_key | length > 0
    fail_msg: >-
      Kapowarr holds an administrator identity this platform did not author and
      refuses both that identity and an unauthenticated caller, so no converge
      can replace it. Recover the deployed password or remove the Kapowarr
      database before running again.

- name: Report the planned Kapowarr administrator provisioning
  ansible.builtin.debug:
    msg: >-
      Kapowarr does not hold the vault-authored administrator pair; a live run
      would declare it through the application settings interface.
  when:
    - ansible_check_mode
    - not kapowarr_identity_current | bool

# Kapowarr hashes both halves with a salt it generated at first start and keeps
# private, so the platform cannot precompute the stored value and has to submit
# the clear pair. Submitting it again is harmless but is not a converged state,
# so the write only runs when the probes above proved it is missing.
# Redacted: this request is where the administrator identity enters the target.
- name: Declare the vault-authored Kapowarr administrator
  ansible.builtin.uri:
    url: "{{ kapowarr_api }}/api/settings?api_key={{ kapowarr_settings_api_key }}"
    method: PUT
    body_format: json
    body:
      auth_username: "{{ vault_kapowarr_admin_username }}"
      auth_password: "{{ vault_kapowarr_admin_password }}"
    status_code: [200]
  when:
    - not ansible_check_mode
    - not kapowarr_identity_current | bool
  changed_when: true
  no_log: true

# Redacted: the request carries the application API key in its query string.
- name: Read the declared Kapowarr library roots
  ansible.builtin.uri:
    url: "{{ kapowarr_api }}/api/rootfolder?api_key={{ kapowarr_settings_api_key }}"
    method: GET
    status_code: [200]
    return_content: true
  register: kapowarr_root_folders
  changed_when: false
  check_mode: false
  no_log: true

# Kapowarr stores a root folder with a trailing separator, and refuses a second
# root that is a parent or child of an existing one, so the comparison is on the
# separator-free form and the create below is the only reachable mutation.
- name: Resolve whether Kapowarr owns the declared comics library root
  ansible.builtin.set_fact:
    kapowarr_library_root_present: >-
      {{ kapowarr_root_folders.json.result | default([]) | map(attribute='folder') |
         map('regex_replace', '/+$', '') | select('equalto', kapowarr_library_root) |
         list | length == 1 }}

# Every root the deployment holds that is not the declared one, which on a
# deployment that predates the parent mount is the single superseded `/comics`.
# It is derived from what the deployment holds rather than compared against a
# stored constant, so a Kapowarr carrying any other undeclared root falls to the
# same refusal. It is separate from the presence check above because the two
# states those two separate are not the same failure: a Kapowarr with no root
# folders at all is a fresh one and gets the declared root created below, while a
# Kapowarr holding a different one already owns a library under a prefix that no
# longer exists inside the container.
- name: Resolve the Kapowarr library roots the declared one supersedes
  ansible.builtin.set_fact:
    kapowarr_library_root_migrations: >-
      {{ kapowarr_root_folders.json.result | default([]) | map(attribute='folder') |
         map('regex_replace', '/+$', '') | reject('equalto', kapowarr_library_root) |
         list }}

# The refusal, and it precedes every mutation this role performs against the
# library. Without it the create below would add the declared root *beside* the
# superseded one, leaving a Kapowarr with two roots, every volume still attached
# to the dead one and a platform that reported success.
#
# It is unconditional, with no one-convergence input to open it, and that is a
# decision rather than an omission. The obvious flag would authorize the platform
# to relabel the stored prefix itself, and Kapowarr v1.3.1 exposes no route that
# can: RootFolders.rename() moves every file with shutil.move, which fails on
# rows whose paths no longer resolve in the container, and the only repair for
# the file rows a caller would have to delete first is refresh_and_scan, which
# needs ComicVine -- the one dependency roles/kapowarr already refuses to take on
# for the ComicVine key itself, because it cannot be proved in any disposable
# lane. A flag that ends in a second root folder and a failed verification would
# instruct the operator into a worse state than refusing does.
#
# The failure is worded for the symptom, which is alarming and self-inflicted:
# Kapowarr fabricates a missing root folder on read --
# RootFolders.__gather_extra_data() calls create_folder() when the stored path is
# not a directory -- so the read above has already created an empty /comics in
# the container's writable layer, and the web interface now shows a library with
# nothing in it. Nothing on the host moved. The message says so, because an
# operator seeing an empty library after a deployment will otherwise reach for a
# restore.
- name: Refuse a Kapowarr deployment still holding a superseded library root
  ansible.builtin.assert:
    that:
      - >-
        kapowarr_library_root_present | bool or
        kapowarr_library_root_migrations | length == 0
    fail_msg: >-
      Kapowarr holds {{ kapowarr_library_root_migrations | join(', ') }} rather than the
      declared {{ kapowarr_library_root }}. This deployment mounts the whole
      {{ kapowarr_books_host_path }} share at the parent of both the library and its
      staging directory, so that an import is a rename instead of a cross-device copy,
      and the container paths moved with it. Kapowarr stores the old prefix in its root
      folder record and in every volume's folder, so the library has to be relabelled
      before this platform can converge it, and no Kapowarr route can do that while the
      old paths no longer resolve. Nothing on the host has moved and no comic has been
      deleted: the empty library the web interface now shows is the empty directory
      Kapowarr itself created when it read a root folder whose path no longer exists in
      the container. Relabel the three stored columns with the container stopped, then
      rerun -- docs/dossier-kapowarr.md, "Migrating the stored library prefix", is the
      procedure. No root folder was created and no volume was moved.

- name: Report the planned Kapowarr comics library root
  ansible.builtin.debug:
    msg: >-
      Kapowarr does not own the declared comics library root; a live run would
      create it.
  when:
    - ansible_check_mode
    - not kapowarr_library_root_present | bool

# Redacted: the request carries the application API key in its query string.
- name: Declare the Kapowarr comics library root
  ansible.builtin.uri:
    url: "{{ kapowarr_api }}/api/rootfolder?api_key={{ kapowarr_settings_api_key }}"
    method: POST
    body_format: json
    body:
      folder: "{{ kapowarr_library_root }}"
    status_code: [201]
  when:
    - not ansible_check_mode
    - not kapowarr_library_root_present | bool
  changed_when: true
  no_log: true

# Kapowarr's settings interface is a partial merge: a request carrying two keys
# changes those two and drops nothing, which is what lets this platform declare
# the subset it owns without restating the application's whole configuration.
# Nothing in that subset may name a credential. The application masks its stored
# credentials on read -- both halves of the administrator identity come back as
# literal asterisks -- so a declaration carrying one could never match what is
# read back, and the write below would run on every converge and never report a
# converged state.
- name: Refuse a Kapowarr settings declaration that names a credential
  ansible.builtin.assert:
    that:
      - >-
        kapowarr_settings.keys() | list
        | select('in', kapowarr_settings_credential_keys) | list | length == 0
      - "'service_preference' not in kapowarr_settings"
    fail_msg: >-
      The declared Kapowarr settings must name no credential and must not carry
      service_preference. Credentials read back masked and can never match, and
      the service order is validated as a permutation of the deployed version's
      own service list, so it is declared as a partial ordering in
      kapowarr_service_preference instead.

# Redacted: the request carries the application API key in its query string.
- name: Read the deployed Kapowarr application settings
  ansible.builtin.uri:
    url: "{{ kapowarr_api }}/api/settings?api_key={{ kapowarr_settings_api_key }}"
    method: GET
    status_code: [200]
    return_content: true
  register: kapowarr_settings_deployed
  changed_when: false
  check_mode: false
  no_log: true

# The declared service order is applied over the deployed one rather than
# replacing it. Kapowarr refuses anything but a permutation of every service it
# knows, so a service this version has and the declaration does not must keep
# its place at the end instead of being dropped -- otherwise the next upstream
# release that adds one fails the converge on a rejected permutation.
- name: Resolve the declared Kapowarr application settings
  ansible.builtin.set_fact:
    kapowarr_settings_declared: >-
      {{ kapowarr_settings | combine({
           'service_preference':
             (kapowarr_service_preference
              | select('in', kapowarr_settings_deployed.json.result.service_preference)
              | list)
             + (kapowarr_settings_deployed.json.result.service_preference
                | reject('in', kapowarr_service_preference) | list),
         }) }}

# Every declared pair the application already holds verbatim is converged, so
# the difference is the declared pairs that are not among the deployed ones. The
# interface reports nothing about what it changed -- a no-op write and a real
# write are answered identically -- so this comparison is what a changed result
# is computed from, and the key names it yields are what check mode reports.
# Only the names: the values were read back through a redacted request.
- name: Resolve which declared Kapowarr settings the application does not hold
  ansible.builtin.set_fact:
    kapowarr_settings_drift_keys: >-
      {{ kapowarr_settings_declared | dict2items
         | reject('in', kapowarr_settings_deployed.json.result | dict2items)
         | map(attribute='key') | list }}

- name: Report the planned Kapowarr application settings
  ansible.builtin.debug:
    msg: >-
      Kapowarr does not hold the declared application settings; a live run would
      declare {{ kapowarr_settings_drift_keys | join(', ') }}.
  when:
    - ansible_check_mode
    - kapowarr_settings_drift_keys | length > 0

# The whole declared subset is submitted rather than only the keys that differ.
# A request is refused whole if any single key in it is invalid, with nothing
# applied, so submitting the set together is what makes a bad declaration fail
# loudly instead of leaving the application half-configured.
# Redacted: the request carries the application API key in its query string.
- name: Declare the Kapowarr application settings
  ansible.builtin.uri:
    url: "{{ kapowarr_api }}/api/settings?api_key={{ kapowarr_settings_api_key }}"
    method: PUT
    body_format: json
    body: "{{ kapowarr_settings_declared }}"
    status_code: [200]
  when:
    - not ansible_check_mode
    - kapowarr_settings_drift_keys | length > 0
  changed_when: true
  no_log: true

# Declaring volume_folder_naming does not migrate the library. Kapowarr stores
# each volume's absolute folder in its own database at add time and re-derives
# it for nothing: update_settings() writes the config table and enqueues no
# work, so every volume added before a template change keeps the folder the old
# template gave it, and a later download lands in that stored folder. On this
# platform's library every one of them was `<Series>/Volume NN (YYYY)`, which is
# the nested shape Komga reads as a series called "Volume 01 (YYYY)".
#
# The migration below is a converge rather than an operator step because the
# requirement is universally quantified -- *every* volume's folder must be the
# one the declared template derives -- so it needs no identifier the platform
# has to know in advance, and it is a fixed point.
#
# Redacted: the request carries the application API key in its query string.
- name: Read the Kapowarr library volumes
  ansible.builtin.uri:
    url: "{{ kapowarr_api }}/api/volumes?api_key={{ kapowarr_settings_api_key }}"
    method: GET
    status_code: [200]
    return_content: true
  register: kapowarr_volumes
  changed_when: false
  check_mode: false
  no_log: true

# Kapowarr's own answer to "where would this volume's files go", and the only
# read that gives it. `GET /api/volumes/<id>/rename` runs preview_mass_rename(),
# which re-derives the volume folder from the current template unless the volume
# carries a custom folder, and builds every suggested file path underneath it --
# so a suggested path that lies outside the volume's stored folder is Kapowarr
# saying the folder itself has to move, and names where to. Deriving the folder
# in Jinja instead would mean reimplementing an arbitrary format string and the
# application's illegal-character rules, and a reimplementation that disagreed
# by one character would report drift forever and never converge.
#
# It renames nothing: the route only previews. Redacted for the API key.
- name: Read the Kapowarr rename plan for every volume
  ansible.builtin.uri:
    url: >-
      {{ kapowarr_api }}/api/volumes/{{ item.id }}/rename?api_key={{ kapowarr_settings_api_key }}
    method: GET
    status_code: [200]
    return_content: true
  register: kapowarr_volume_rename_plans
  loop: "{{ kapowarr_volumes.json.result | default([]) }}"
  loop_control:
    label: "{{ item.id }}"
  changed_when: false
  check_mode: false
  no_log: true

- name: Reset the Kapowarr volume folder plan
  ansible.builtin.set_fact:
    kapowarr_volume_folder_plan: []

# `target` is the shallowest folder among the suggested paths that fall outside
# the volume's stored folder, which is the folder Kapowarr would move the volume
# to; it is empty when every suggested path is already inside the stored folder,
# and also when the volume holds no files at all, because the route previews
# nothing for a volume with nothing in it. `nested` is the independent, template
# agnostic reading of the same defect: the declared template names one directory
# level, so a folder Kapowarr derived is always a direct child of the library
# root, and a deeper one cannot be template-derived whatever the template says.
# Neither can lie about a converged volume, which is what makes the pair a fixed
# point; a volume Kapowarr reports without a stored folder is not migratable
# through this route at all and is excluded below.
- name: Resolve the Kapowarr volume folder plan
  ansible.builtin.set_fact:
    kapowarr_volume_folder_plan: >-
      {{ kapowarr_volume_folder_plan + [{
           'id': item.item.id,
           'title': item.item.title,
           'folder': item.item.folder | default('', true),
           'target': (item.json.result | default({}) | dict2items | map(attribute='value')
                      | reject('match', '\A' ~ (item.item.folder | default('', true) | regex_escape) ~ '/')
                      | map('dirname') | sort | first | default('', true)),
           'nested': ((item.item.folder | default('', true) | dirname) != kapowarr_library_root),
         }] }}
  loop: "{{ kapowarr_volume_rename_plans.results | default([]) }}"
  loop_control:
    label: "{{ item.item.id | default('') }}"
  no_log: true

- name: Reset the pending Kapowarr volume folder migrations
  ansible.builtin.set_fact:
    kapowarr_volume_folder_migrations: []
    kapowarr_volume_folders_unconfined: []

# Confinement, and it is the property this migration is reviewed on rather than a
# tidiness rule: the comics library is the only tree a restore covers, so nothing
# outside kapowarr_library_root may be moved, emptied or removed. Both ends are
# required to be inside it -- the folder the volume holds now, because that is
# the directory the move empties and Kapowarr then removes, and the folder
# Kapowarr previews for it, because that is where the files land. A volume
# failing either is refused rather than migrated, and named by the report below
# instead of dropping out silently.
#
# Neither test is a substitute for the root-folder refusal further down. Kapowarr
# derives a volume's new folder from *that volume's own* root folder, not from
# the root this platform declares, so a second root folder is what could put a
# derived target outside the comics library in the first place.
- name: Resolve the pending Kapowarr volume folder migrations
  ansible.builtin.set_fact:
    kapowarr_volume_folder_migrations: "{{ kapowarr_volume_folder_migrations + [item] }}"
  when:
    - item.folder is match('\A' ~ (kapowarr_library_root | regex_escape) ~ '/')
    - item.target | length == 0 or
      item.target is match('\A' ~ (kapowarr_library_root | regex_escape) ~ '/')
    - item.target | length > 0 or item.nested | bool
  loop: "{{ kapowarr_volume_folder_plan }}"
  loop_control:
    label: "{{ item.id }}"

- name: Resolve the Kapowarr volume folders outside the declared library root
  ansible.builtin.set_fact:
    kapowarr_volume_folders_unconfined: "{{ kapowarr_volume_folders_unconfined + [item] }}"
  when:
    - item.target | length > 0 or item.nested | bool
    - not (item.folder is match('\A' ~ (kapowarr_library_root | regex_escape) ~ '/')) or
      (item.target | length > 0 and
       not (item.target is match('\A' ~ (kapowarr_library_root | regex_escape) ~ '/')))
  loop: "{{ kapowarr_volume_folder_plan }}"
  loop_control:
    label: "{{ item.id }}"

# One line per volume, and the reason this is a loop rather than one message:
# `--check --diff` is the review the comics share gets before anything moves, so
# it has to name the current folder and the folder the migration would move it
# to, per volume, rather than a count. It reports on every run, gated or not,
# because a closed gate is the state the report is for.
- name: Report each pending Kapowarr volume folder migration
  ansible.builtin.debug:
    msg: >-
      Kapowarr volume {{ item.id }} ({{ item.title }}) holds {{ item.folder }}
      {{ ('and the declared naming template derives ' ~ item.target)
      if item.target | length > 0 else
      ('and holds no files, so Kapowarr previews no target for it: a live run would move it to
      the name the declared template derives, directly under ' ~ kapowarr_library_root) }}.
      {{ 'This run moves it.' if kapowarr_volume_folder_migration_allowed | bool else
      'A run carrying kapowarr_volume_folder_migration_allowed=true would move it.' }}
  loop: "{{ kapowarr_volume_folder_migrations }}"
  loop_control:
    label: "{{ item.id }}"
  changed_when: false

# Reported, never migrated. This platform cannot repair a volume stored outside
# the library root without moving a directory the confinement promise excludes,
# so it says which volume and stops. It cannot arise from anything this role
# does: every folder the migration writes is one Kapowarr derived from the root
# asserted below.
- name: Report each Kapowarr volume folder outside the declared library root
  ansible.builtin.debug:
    msg: >-
      Kapowarr volume {{ item.id }} ({{ item.title }}) holds {{ item.folder }}
      {{ ('and Kapowarr would derive ' ~ item.target) if item.target | length > 0
      else 'and Kapowarr previews no target for it' }}, and one of those is outside the
      declared library root {{ kapowarr_library_root }}. The migration refuses it: moving it
      would touch a directory outside the comics library. Repair it in Kapowarr, by pointing
      the volume at the declared root folder, before this platform can converge it.
  loop: "{{ kapowarr_volume_folders_unconfined }}"
  loop_control:
    label: "{{ item.id }}"
  changed_when: false

# How the role says that this input is not a setting. It is reported on every run
# that carries it, including the run where it turns out to have nothing left to
# do, so a flag left on is visible in the output rather than silent.
- name: Report the one-convergence Kapowarr volume folder migration input
  ansible.builtin.debug:
    msg: >-
      KAPOWARR_VOLUME_FOLDER_MIGRATION_ALLOWED: pending volume folder moves
      {{ kapowarr_volume_folder_migrations | map(attribute='folder') | list }}.
      kapowarr_volume_folder_migration_allowed is a one-convergence input, not a platform
      setting: drop it from the next run and never store it in a host variable file. An empty
      list here means it is already stale. Komga indexes the directories these moves rename,
      so rescan its Comics library once this run finishes.
  when: kapowarr_volume_folder_migration_allowed | bool
  changed_when: false

# `volume_folder: null` is Kapowarr's own "use the folder the template derives":
# change_volume_folder() regenerates the path from the current template, moves
# the files onto it with a rename rather than a copy, updates their paths in its
# database and returns early when the derived path is the one already stored --
# so a second converge is a no-op inside the application as well as here.
#
# `custom_folder: false` repairs the same call's own bookkeeping. It sets
# custom_folder from a variable it has already overwritten with the generated
# path, so it marks every volume it derives a folder for as carrying an operator
# chosen one, and a volume marked that way is one preview_mass_rename() stops
# re-deriving -- the next template change would then converge silently wrong.
# The application accepts the key on the same request and applies it after the
# move. Confirmed against the pinned image: custom_folder reads back 0.
#
# The request names no path, so the folder it installs is whatever Kapowarr
# derives -- and Kapowarr derives it from the root folder the *volume* is
# attached to, not from the root this platform declares. Those are the same root
# only while Kapowarr owns exactly the declared one, so that is asserted here,
# immediately before the only mutation that depends on it, rather than left to
# the verification at the end of this role. A second root folder is refused
# instead of migrated: it is the one state in which a derived target could land
# outside the comics library.
- name: Refuse a Kapowarr volume folder migration beyond the declared library root
  ansible.builtin.assert:
    that:
      - >-
        kapowarr_root_folders.json.result | default([]) | map(attribute='folder') |
        map('regex_replace', '/+$', '') | list == [kapowarr_library_root]
    fail_msg: >-
      Kapowarr owns library roots other than the declared
      {{ kapowarr_library_root }}, and it derives a volume's new folder from the root that
      volume is attached to, so a migration could move a directory outside the comics
      library. Remove the undeclared root folder in Kapowarr first. No volume was moved.
  when: kapowarr_volume_folder_migrations | length > 0

# This is the only mutation in this repository that moves a directory in the
# comics library, which is why it is gated. Kapowarr removes the emptied source
# directory and any parent that becomes empty, up to but never including the
# library root, and stops at any directory that still holds something -- it
# never touches a file and never touches a directory that is not a volume's.
# Redacted: the request carries the application API key in its query string.
- name: Migrate Kapowarr volume folders onto the declared naming template
  ansible.builtin.uri:
    url: "{{ kapowarr_api }}/api/volumes/{{ item.id }}?api_key={{ kapowarr_settings_api_key }}"
    method: PUT
    body_format: json
    body:
      volume_folder: null
      custom_folder: false
    status_code: [200]
  loop: "{{ kapowarr_volume_folder_migrations }}"
  loop_control:
    label: "{{ item.id }}"
  when:
    - not ansible_check_mode
    - kapowarr_volume_folder_migration_allowed | bool
  changed_when: true
  no_log: true

- name: Verify the Kapowarr service endpoint
  tags: [platform_verify_kapowarr]
  ansible.builtin.uri:
    url: "{{ kapowarr_api }}/api/public"
    method: GET
    status_code: [200]
    return_content: true
  register: kapowarr_verify_public
  changed_when: false
  check_mode: false

# The web interface is the writer: it renames and deletes the comics library and
# queues downloads into it, and every route behind /api answers to the key a
# successful login returns. These three reads prove the vault-authored identity
# is the one Kapowarr accepts, that a caller without it is refused, and that the
# library root the platform declared is still the only one it owns. All of them
# accept any status so the assertion below is what fails, naming which outcome
# differed: a probe that died on the HTTP code would report the failure from a
# redacted task and say nothing.
# Redacted: the request is the vault-authored administrator identity.
- name: Verify Kapowarr accepts the vault administrator
  tags: [platform_verify_kapowarr]
  ansible.builtin.uri:
    url: "{{ kapowarr_api }}/api/auth"
    method: POST
    body_format: json
    body:
      username: "{{ vault_kapowarr_admin_username }}"
      password: "{{ vault_kapowarr_admin_password }}"
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: kapowarr_verify_identity
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

# Conditional for the same reason as the converge probe above: a credential-free
# auth POST is a failed login in Kapowarr's own log, and the mode this playbook
# has already read answers it. At mode 2 the refusal is what mode 2 means, and
# the assertion below reads it from there; below mode 2 the probe runs and says
# what an anonymous caller actually gets, which is the diagnosis that matters.
# Keep the gate: the tagged path runs on every converge as well as from
# verify.yml, so an ungated probe writes the warning twice per run.
- name: Verify Kapowarr refuses an unauthenticated caller
  tags: [platform_verify_kapowarr]
  ansible.builtin.uri:
    url: "{{ kapowarr_api }}/api/auth"
    method: POST
    body_format: json
    body: {}
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: kapowarr_verify_anonymous
  when:
    - (kapowarr_verify_public.json.result | default({})).authentication_method | default(0) | int != 2
  failed_when: false
  changed_when: false
  check_mode: false

# Redacted: the request carries the application API key the login returned.
- name: Verify the Kapowarr comics library root ownership
  tags: [platform_verify_kapowarr]
  ansible.builtin.uri:
    url: >-
      {{ kapowarr_api }}/api/rootfolder?api_key={{
         kapowarr_verify_identity.json.result.api_key | default('') }}
    method: GET
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: kapowarr_verify_roots
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

# The declaration is compared against the defaults rather than against the facts
# the converge resolved, because verify.yml reaches only the tagged tasks and
# none of those facts exist there. The service order is compared as the partial
# ordering it is declared as: the declared services, in declared order, ignoring
# whatever the deployed version knows and the declaration does not name.
# Redacted: the request carries the application API key the login returned.
- name: Verify the Kapowarr declared application settings
  tags: [platform_verify_kapowarr]
  ansible.builtin.uri:
    url: >-
      {{ kapowarr_api }}/api/settings?api_key={{
         kapowarr_verify_identity.json.result.api_key | default('') }}
    method: GET
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: kapowarr_verify_settings
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

# The mode condition is what now carries the refusal, and that is a change in
# kind rather than a tightening: this playbook used to establish empirically,
# against the running instance, that an anonymous caller is refused, and now
# infers it from mode 2 -- with the entailment proved live in the disposable
# lanes by the runtime half of tests/contracts/kapowarr.sh, which asks the same
# question of a real converged Kapowarr without costing the NAS a log entry.
#
# The 401 comparison below cannot change this assertion's verdict while both
# conditions stand, because the probe skips exactly when mode is 2 and mode 2 is
# required unconditionally: below mode 2 the first condition has already failed.
# It is kept deliberately rather than overlooked. It states the property being
# claimed instead of the mode it is inferred from, it is load-bearing again the
# moment the mode condition is relaxed or the probe's gate widens, and
# tests/contracts/kapowarr.sh requires this assertion to name the anonymous
# outcome, so dropping it fails the contract.
- name: Require the exact Kapowarr verification results
  tags: [platform_verify_kapowarr]
  ansible.builtin.assert:
    that:
      - (kapowarr_verify_public.json.result | default({})).authentication_method | default(0) | int == 2
      - kapowarr_verify_identity.status | default(0) | int == 200
      - >-
        kapowarr_verify_anonymous.skipped | default(false) | bool
        or kapowarr_verify_anonymous.status | default(0) | int == 401
      - kapowarr_verify_roots.status | default(0) | int == 200
      - >-
        kapowarr_verify_roots.json.result | default([]) | map(attribute='folder') |
        map('regex_replace', '/+$', '') | list == [kapowarr_library_root]
      - kapowarr_verify_settings.status | default(0) | int == 200
      - >-
        (kapowarr_verify_settings.json.result | default({}) | dict2items |
         selectattr('key', 'in', kapowarr_settings.keys() | list) | items2dict)
        == kapowarr_settings
      - >-
        ((kapowarr_verify_settings.json.result | default({})).service_preference
         | default([]) | select('in', kapowarr_service_preference) | list)
        == (kapowarr_service_preference |
            select('in', (kapowarr_verify_settings.json.result | default({})).service_preference
                         | default([])) | list)
    fail_msg: >-
      Kapowarr is unreachable, or it no longer accepts exactly the vault-authored
      administrator, refuses everyone else, owns exactly the declared comics
      library root, and holds the declared application settings in the declared
      service order.

# The library's folder shape is verified rather than only migrated, because the
# defect this repairs is not a one-off: a volume added while a hand-edited
# template was in force, or a folder renamed in the web interface, puts a series
# back under a name Komga cannot read, and nothing in Kapowarr reports it. These
# reads repeat the converge's own two -- the tagged path reaches none of its
# facts -- and take the API key the login above returned.
# Redacted: the request carries the application API key the login returned.
- name: Read the Kapowarr library volumes for verification
  tags: [platform_verify_kapowarr]
  ansible.builtin.uri:
    url: >-
      {{ kapowarr_api }}/api/volumes?api_key={{
         kapowarr_verify_identity.json.result.api_key | default('') }}
    method: GET
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: kapowarr_verify_volumes
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

# The read above accepts any status so that the assertion below is what fails,
# and an unauthorized Kapowarr answers `{"error": "ApiKeyInvalid", "result": {}}`
# -- a mapping where the library was. Looping over that dies with `The loop value
# must resolve to a 'list', not 'dict'` from the task below instead of with the
# diagnosis this block exists to give, so the list is normalized here and the
# assertion reads the status. Confirmed against the pinned image.
- name: Resolve the Kapowarr volumes reported for verification
  tags: [platform_verify_kapowarr]
  ansible.builtin.set_fact:
    kapowarr_verify_volume_list: >-
      {{ kapowarr_verify_volumes.json.result
         if (kapowarr_verify_volumes.json.result | default(none)) is sequence
            and (kapowarr_verify_volumes.json.result | default(none)) is not mapping
            and (kapowarr_verify_volumes.json.result | default(none)) is not string
         else [] }}

# Redacted: the request carries the application API key the login returned.
- name: Read the Kapowarr rename plan for every volume for verification
  tags: [platform_verify_kapowarr]
  ansible.builtin.uri:
    url: >-
      {{ kapowarr_api }}/api/volumes/{{ item.id }}/rename?api_key={{
         kapowarr_verify_identity.json.result.api_key | default('') }}
    method: GET
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: kapowarr_verify_rename_plans
  loop: "{{ kapowarr_verify_volume_list }}"
  loop_control:
    label: "{{ item.id }}"
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

- name: Reset drifted Kapowarr volume folders
  tags: [platform_verify_kapowarr]
  ansible.builtin.set_fact:
    kapowarr_verify_volume_folder_drift: []

# The same two readings as the converge, for the same reason: a suggested path
# outside the volume's stored folder is Kapowarr saying the folder must move, and
# a folder deeper than one level under the library root cannot be one the
# declared template derived. A volume Kapowarr reports without a folder is drift
# too here -- the converge cannot repair it, so the verification must say so
# rather than pass over it.
- name: Resolve drifted Kapowarr volume folders
  tags: [platform_verify_kapowarr]
  ansible.builtin.set_fact:
    kapowarr_verify_volume_folder_drift: >-
      {{ kapowarr_verify_volume_folder_drift + [{
           'id': item.item.id,
           'folder': item.item.folder | default('', true),
         }] }}
  when: >-
    (item.item.folder | default('', true) | length == 0) or
    ((item.item.folder | default('', true) | dirname) != kapowarr_library_root) or
    ((item.json.result | default({}) | dict2items | map(attribute='value')
      | reject('match', '\A' ~ (item.item.folder | default('', true) | regex_escape) ~ '/')
      | list | length) > 0)
  loop: "{{ kapowarr_verify_rename_plans.results | default([]) }}"
  loop_control:
    label: "{{ item.item.id | default('') }}"
  no_log: true

# An empty library asserts nothing here, and that is the honest verdict: a
# platform that owns no volume owns no misnamed folder. The floor the assertion
# does hold is that both reads answered, so a 401 or an unreachable application
# fails with a diagnosis instead of resolving an empty drift list from nothing.
- name: Require converged Kapowarr volume folders
  tags: [platform_verify_kapowarr]
  ansible.builtin.assert:
    that:
      - kapowarr_verify_volumes.status | default(0) | int == 200
      - >-
        kapowarr_verify_rename_plans.results | default([]) | length ==
        kapowarr_verify_volume_list | length
      - kapowarr_verify_volume_folder_drift | length == 0
    fail_msg: >-
      Kapowarr is unreachable, or it holds volume folders the declared
      volume_folder_naming does not derive: {{ kapowarr_verify_volume_folder_drift
      | map(attribute='folder') | list }}. Komga builds a series from the directory that
      directly contains the books, so each of those is a series it titles after the wrong
      directory. Review the migration with --check --diff, then rerun that one convergence
      with kapowarr_volume_folder_migration_allowed=true. A folder in that list which is
      not under {{ kapowarr_library_root }} is the one case the migration refuses rather
      than repairs, because moving it would leave the comics library; repair that volume's
      root folder in Kapowarr instead.
