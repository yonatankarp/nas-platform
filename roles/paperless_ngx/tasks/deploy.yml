---
# Deployment. Revalidates the release paths this role touches, installs the
# pinned Hebrew OCR model, renders the environment, brings the data services up
# and refuses a rotated database credential before the application follows,
# reports the deployment and checks the applied CPU policy.

- name: Revalidate deployment paths before Paperless runtime use
  ansible.builtin.include_role:
    name: deployment_bundle
    tasks_from: target
  vars:
    deployment_target_service: paperless-ngx
    deployment_target_require_current_release: true
    deployment_target_extra_paths:
      - "{{ platform_runtime_dir }}/services/paperless-ngx/.gmail-credential-fingerprint"
      - "{{ paperless_effective_state_host_path }}/postgres"
      - "{{ paperless_effective_state_host_path }}/redis"
      - "{{ paperless_effective_state_host_path }}/data"
      - "{{ paperless_effective_cache_host_path }}"
      - "{{ paperless_effective_state_host_path }}/tessdata"
      - "{{ paperless_effective_state_host_path }}/tessdata/heb.traineddata"
      - "{{ paperless_effective_archive_host_path }}"
      - "{{ paperless_effective_consume_host_path }}"
      - "{{ paperless_effective_export_host_path }}"

- name: Select the Paperless mounted tessdata root
  ansible.builtin.set_fact:
    paperless_tessdata_root: "{{ paperless_effective_state_host_path }}/tessdata"

- name: Require the internally derived Paperless tessdata root
  ansible.builtin.assert:
    that:
      - paperless_tessdata_root == ((paperless_state_host_path
        if platform_compose_kind == 'nas' else
        (nas_docker_root ~ '/paperless-ngx')) ~ '/tessdata')

# raw.githubusercontent.com is a third party, and a converge must not fail
# because it was briefly unreachable: that is exactly what happened on
# 2026-09-04 (#330), where the read timed out at get_url's own ten-second
# default and took the whole run with it. The checksum is what makes retrying
# safe -- an unchanged file is a no-op that reports so, and a truncated
# download fails here rather than becoming the OCR model.
- name: Install the pinned Hebrew OCR model
  ansible.builtin.get_url:
    url: "{{ paperless_hebrew_model_url }}"
    dest: "{{ paperless_tessdata_root }}/heb.traineddata"
    checksum: "{{ paperless_hebrew_model_checksum }}"
    mode: "0644"
    timeout: "{{ platform_download_timeout }}"
  register: paperless_hebrew_model_download
  until: paperless_hebrew_model_download is not failed
  retries: "{{ platform_download_retries }}"
  delay: "{{ platform_download_delay }}"

- name: Render the Paperless environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ platform_runtime_dir }}/services/paperless-ngx/.env"
    mode: "0600"
  no_log: true

# Before any Compose operation, because recreating the webserver from an older
# image is the act being refused. The webserver runs Django's migrations against
# the database on start and they are one-way, so a pin older than one that has
# already run here would crash-loop inside the container rather than fail in a
# play (#511, #826). The webserver and not db: the PostgreSQL major is a
# different hazard, withheld by its own Renovate rule. The five paths this reads
# are the ones the containment re-include at the top of this file already
# declared through deployment_target_service, so it needs no extra_paths.
- name: Refuse a Paperless image older than the database this host has migrated
  ansible.builtin.include_role:
    name: image_downgrade_guard
  vars:
    image_downgrade_guard_service_name: paperless-ngx
    image_downgrade_guard_compose_service: webserver
    image_downgrade_guard_project_name: "{{ paperless_compose_project_name }}"
    image_downgrade_guard_store_description: "{{ paperless_effective_state_host_path }}/postgres"

- name: Deploy the Paperless data services
  community.docker.docker_compose_v2:
    project_src: "{{ platform_current_dir }}/services/paperless-ngx"
    project_name: "{{ paperless_compose_project_name }}"
    files: "{{ platform_service_compose_files['paperless-ngx'] }}"
    env_files: ["{{ platform_runtime_dir }}/services/paperless-ngx/.env"]
    services: [broker, db]
    state: present
    wait: true
    wait_timeout: "{{ paperless_data_compose_wait_timeout }}"
  register: paperless_data_deploy

- name: Refuse a rotated Paperless database credential
  community.docker.docker_compose_v2_exec:
    project_src: "{{ platform_current_dir }}/services/paperless-ngx"
    project_name: "{{ paperless_compose_project_name }}"
    files: "{{ platform_service_compose_files['paperless-ngx'] }}"
    env_files: ["{{ platform_runtime_dir }}/services/paperless-ngx/.env"]
    service: db
    argv:
      - sh
      - -ec
      - >-
        exec env PGPASSWORD="$POSTGRES_PASSWORD" PGCONNECT_TIMEOUT=15
        psql --host=db --username="$1" --dbname="$2"
        --no-align --tuples-only
        --command="select current_user || '/' || current_database()"
      - paperless-database-probe
      - "{{ vault_paperless_db_username }}"
      - "{{ vault_paperless_db_name }}"
    tty: false
  register: paperless_database_identity
  when: not ansible_check_mode
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

- name: Classify the Paperless database credential probe
  ansible.builtin.set_fact:
    paperless_database_probe_status: >-
      {{ 'execution-failed' if paperless_database_identity.rc is not defined
         else 'connection-rejected' if paperless_database_identity.rc | int != 0
         else 'identity-mismatch' if paperless_database_identity.stdout | default('') | trim !=
              vault_paperless_db_username ~ '/' ~ vault_paperless_db_name
         else 'verified' }}
  when: not ansible_check_mode
  no_log: true

- name: Require the managed Paperless database credential
  ansible.builtin.assert:
    that:
      - paperless_database_probe_status == 'verified'
    fail_msg: >-
      Paperless database credential verification failed
      ({{ paperless_database_probe_status }}) in Compose service db.
      Restore the previous vault values or migrate the database credential explicitly, then rerun.
  when: not ansible_check_mode

# After the data services and the credential refusal and before the webserver,
# so the database is up, healthy and reachable with the vault's credential, and
# Django's migrations have not run: roles/pre_upgrade_backup's pg_dump entry stops the webserver -- the consumer, the Celery worker and the scheduler
# run inside it, so it is every writer -- and dumps the database from inside the
# db container. The guard runs first, so a downgrade is refused before
# anything stops; the role reads the pin itself (#858).
#
# The dump alone is enough to go back, and document_exporter is not taken:
# Paperless's migrations are Django schema migrations of that database, and the
# originals and archive files under the media root are not rewritten by them.
# That holds only while a release's migrations stay in the database -- a
# release notes entry that moves or renames files would need the media root
# too.
#
# The dump holds every account's password hash, mail account passwords and the
# full OCR text of every document, so it is secret-bearing and not small; it is
# written 0600 in a 0700 directory, as postgres/pre-upgrade-backup under the
# state root on the host.
- name: Dump the Paperless database before a pinned upgrade
  ansible.builtin.include_role:
    name: pre_upgrade_backup
    tasks_from: pg_dump
  vars:
    pre_upgrade_backup_service_name: paperless-ngx
    pre_upgrade_backup_compose_service: webserver
    pre_upgrade_backup_stop_services: [webserver]
    pre_upgrade_backup_database_service: db
    pre_upgrade_backup_project_name: "{{ paperless_compose_project_name }}"

- name: Deploy Paperless
  community.docker.docker_compose_v2:
    project_src: "{{ platform_current_dir }}/services/paperless-ngx"
    project_name: "{{ paperless_compose_project_name }}"
    files: "{{ platform_service_compose_files['paperless-ngx'] }}"
    env_files: ["{{ platform_runtime_dir }}/services/paperless-ngx/.env"]
    state: present
    wait: true
    wait_timeout: "{{ paperless_compose_wait_timeout }}"
  register: paperless_deploy

- name: Report the Paperless deployment
  ansible.builtin.include_role:
    name: deployment_bundle
    tasks_from: report
  vars:
    deployment_report_service: Paperless
    deployment_report_changed: >-
      {{ (paperless_data_deploy is changed) or (paperless_deploy is changed) or
         ((pre_upgrade_backup_restart | default({})) is changed) }}

- name: Verify Paperless effective container CPU policy
  ansible.builtin.include_role:
    name: container_cpu
  vars:
    container_cpu_service_name: paperless-ngx
    container_cpu_project_name: "{{ paperless_compose_project_name }}"
