---
argument_specs:
  main:
    short_description: Deploy Paperless-ngx and reconcile its administrator and Gmail rule
    options:
      platform_compose_kind: {type: str, required: true}
      platform_project_name: {type: str, required: false}
      paperless_port: {type: int, required: false}
      paperless_compose_wait_timeout: {type: int, required: false}
      paperless_data_compose_wait_timeout: {type: int, required: false}
      paperless_task_workers: {type: int, required: false}
      paperless_threads_per_worker: {type: int, required: false}
      # The AI settings live only in inventory group_vars, so the role has no
      # default to fall back on and templates/env.j2 reads all three
      # unconditionally. Requiring them here fails naming the missing key instead
      # of midway with an undefined-variable trace.
      paperless_ai_enabled: {type: bool, required: true}
      paperless_ai_llm_endpoint: {type: str, required: true}
      paperless_ai_llm_model: {type: str, required: true}
      paperless_archive_host_path:
        type: str
        required: false
        choices: [/volume2/Documents/archive]
      paperless_consume_host_path:
        type: str
        required: false
        choices: [/volume2/Documents/inbox]
      paperless_export_host_path:
        type: str
        required: false
        choices: [/volume2/Documents/export]
      paperless_state_host_path:
        type: str
        required: false
        choices: [/volume1/Docker/paperless-ngx]
      paperless_hebrew_model_url: {type: str, required: false}
      paperless_hebrew_model_checksum: {type: str, required: false}
      paperless_mail_account: {type: dict, required: false}
      paperless_mail_rule: {type: dict, required: false}
      # The two mail object names are operator policy and live only in inventory
      # group_vars, so the role has no default to fall back on and the mail
      # tasks read both unconditionally. Requiring them here fails naming the
      # missing key instead of midway through reconciliation.
      paperless_mail_account_name: {type: str, required: true}
      paperless_mail_rule_name: {type: str, required: true}
      vault_paperless_admin_username: {type: str, required: true}
      vault_paperless_admin_password: {type: str, required: true}
      vault_paperless_admin_email: {type: str, required: true}
      vault_paperless_db_name: {type: str, required: true}
      vault_paperless_db_username: {type: str, required: true}
      vault_paperless_db_password: {type: str, required: true}
      vault_paperless_django_secret_key: {type: str, required: true}
      vault_paperless_gmail_account: {type: str, required: true}
      vault_paperless_gmail_app_password: {type: str, required: true}
