---
- name: Revalidate deployment paths before Bindery runtime use
  ansible.builtin.include_role:
    name: deployment_bundle
    tasks_from: target
  vars:
    deployment_target_service: bindery
    deployment_target_require_current_release: true
    deployment_target_extra_paths:
      - "{{ bindery_config_host_path }}"

# The application refuses a password under eight characters; refusing here fails
# before deployment rather than inside a redacted request.
- name: Require well-formed Bindery credentials
  ansible.builtin.assert:
    that:
      - vault_bindery_api_key is match('^[0-9a-f]{32}\Z')
      - vault_bindery_admin_username is match('^[^\r\n]+$')
      - vault_bindery_admin_password is match('^[^\r\n]+$')
      - vault_bindery_admin_password | length >= 8
    fail_msg: >-
      The Bindery API key must be 32 lowercase hexadecimal characters and the
      administrator pair must be nonempty single-line values with a password of
      at least eight characters.
  no_log: true

- name: Render the private Bindery environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ platform_runtime_dir }}/services/bindery/.env"
    mode: "0600"
  no_log: true

# Before the backup and before Compose: Bindery's SQLite migration is one-way
# (#511).
- name: Refuse a Bindery image older than the store on disk
  ansible.builtin.include_role:
    name: image_downgrade_guard
  vars:
    image_downgrade_guard_service_name: bindery
    image_downgrade_guard_compose_service: bindery
    image_downgrade_guard_project_name: "{{ bindery_compose_project_name }}"
    image_downgrade_guard_store_description: "{{ bindery_config_host_path }}"

- name: Guard Bindery critical state before a pinned upgrade
  ansible.builtin.include_tasks: pre_upgrade_backup.yml

# The rescue hands Compose's uninformative failure to roles/container_health,
# which explains it from Docker's container state or re-raises it (#509).
- name: Deploy Bindery, catching a container that runs but never serves
  block:
    - name: Deploy Bindery
      community.docker.docker_compose_v2:
        project_src: "{{ platform_current_dir }}/services/bindery"
        project_name: "{{ bindery_compose_project_name }}"
        files: "{{ platform_service_compose_files['bindery'] }}"
        env_files: ["{{ platform_runtime_dir }}/services/bindery/.env"]
        state: present
        wait: true
        wait_timeout: "{{ platform_compose_wait_timeout }}"
      register: bindery_deploy
  rescue:
    # First: ansible_failed_result belongs to whichever rescue is running.
    - name: Record the failed Bindery deployment
      ansible.builtin.set_fact:
        bindery_deploy_failure_message: >-
          {{ ansible_failed_result.msg
             | default('the Bindery deployment failed and reported no message') }}

# Detects without refusing, so the recreate below happens before the verdict; a
# deployment failure no stuck container explains is still re-raised.
- name: Detect a Bindery container that runs but never serves
  ansible.builtin.include_role:
    name: container_health
  vars:
    container_health_service_name: bindery
    container_health_project_name: "{{ bindery_compose_project_name }}"
    container_health_deploy_failure_message: >-
      {{ bindery_deploy_failure_message | default('') }}
    container_health_refuse: false

# Force-recreates only the services Docker reports stuck, at most once per run,
# so a broken host heals by merge instead of by hand. `up -d` would not recreate
# an unchanged container; the empty list on a converged host keeps this
# idempotent.
- name: Recreate a Bindery container that runs but never serves
  block:
    - name: Force-recreate the stuck Bindery services
      community.docker.docker_compose_v2:
        project_src: "{{ platform_current_dir }}/services/bindery"
        project_name: "{{ bindery_compose_project_name }}"
        files: "{{ platform_service_compose_files['bindery'] }}"
        env_files: ["{{ platform_runtime_dir }}/services/bindery/.env"]
        services: "{{ container_health_stuck_services }}"
        dependencies: false
        recreate: always
        state: present
        wait: true
        wait_timeout: "{{ platform_compose_wait_timeout }}"
      when: container_health_stuck_services | default([]) | length > 0
      register: bindery_wedged_recreate
  rescue:
    # Carried, not re-raised: the re-check below diagnoses an unhealthy
    # container, and re-raises this message when no stuck container explains it.
    - name: Record the Bindery recreate that did not recover the service
      ansible.builtin.set_fact:
        bindery_recreate_failure_message: >-
          The force-recreate reported: {{ ansible_failed_result.msg
          | default('no message') }}

# Recorded before the second pass overwrites the list it was decided from.
- name: Record whether a Bindery recreate was spent
  ansible.builtin.set_fact:
    bindery_recreate_spent: >-
      {{ container_health_stuck_services | default([]) | length > 0 }}

- name: Report the Bindery wedged-container recovery check mode defers
  ansible.builtin.debug:
    msg: >-
      A live run would read every container of Compose project
      {{ bindery_compose_project_name }} that Docker reports as restarting or
      unhealthy, print its state, force-recreate exactly those services once
      with no dependencies, and fail naming that retry if any of them came back
      stuck. Compose's dry run starts nothing and does not wait on container
      health, so check mode cannot reach that path and recreates nothing.
  when: ansible_check_mode

- name: Refuse a Bindery container that stayed wedged after its recreate
  ansible.builtin.include_role:
    name: container_health
  vars:
    container_health_service_name: bindery
    container_health_project_name: "{{ bindery_compose_project_name }}"
    container_health_deploy_failure_message: >-
      {{ bindery_recreate_failure_message | default('') }}
    container_health_retried: "{{ bindery_recreate_spent }}"

- name: Report the Bindery deployment
  ansible.builtin.include_role:
    name: deployment_bundle
    tasks_from: report
  vars:
    deployment_report_service: Bindery
    # Both Compose results: a repairing force-recreate is a change worth
    # reporting.
    deployment_report_changed: >-
      {{ (bindery_deploy is changed)
         or ((bindery_wedged_recreate | default({})) is changed) }}

- name: Verify Bindery effective container CPU policy
  ansible.builtin.include_role:
    name: container_cpu
  vars:
    container_cpu_service_name: bindery
    container_cpu_project_name: "{{ bindery_compose_project_name }}"

- name: Wait for Bindery application readiness
  ansible.builtin.uri:
    url: "{{ bindery_api }}/health"
    method: GET
    status_code: [200]
    return_content: true
  register: bindery_health
  until:
    - bindery_health.json | default(none) is mapping
    - bindery_health.json.status | default('') == 'ok'
  retries: "{{ platform_readiness_retries }}"
  delay: "{{ platform_readiness_delay }}"
  changed_when: false
  check_mode: false

# `local-only` grants administrator to every private-network peer, and an
# administrator may read the API key in clear.
- name: Read the Bindery authentication posture
  ansible.builtin.uri:
    url: "{{ bindery_api }}/auth/status"
    method: GET
    status_code: [200]
    return_content: true
  register: bindery_auth_status
  changed_when: false
  check_mode: false

- name: Require the enforced Bindery authentication mode
  ansible.builtin.assert:
    that:
      - bindery_auth_status.json.mode | default('') == 'enabled'
    fail_msg: >-
      Bindery is not in its enforcing authentication mode. In local-only mode it
      grants administrator to every private-network peer with no credential, and
      an administrator may read the API key in clear.

- name: Resolve the Bindery API key
  ansible.builtin.include_tasks: resolve_api_key.yml

# The anonymous first-run setup route stays open until a user exists, so the
# seeded key above closes that window within this same convergence.
- name: Read the declared Bindery users
  ansible.builtin.uri:
    url: "{{ bindery_api }}/auth/users"
    method: GET
    headers:
      X-Api-Key: "{{ bindery_api_key }}"
    status_code: [200]
    return_content: true
  register: bindery_users
  changed_when: false
  check_mode: false
  no_log: true

# Nothing in Bindery is create-if-absent: a duplicate user is a 500.
- name: Resolve whether Bindery holds the vault administrator
  ansible.builtin.set_fact:
    bindery_administrator_present: >-
      {{ bindery_users.json | default([])
         | selectattr('username', 'equalto', vault_bindery_admin_username)
         | selectattr('role', 'equalto', 'admin')
         | list | length == 1 }}
  no_log: true

- name: Report the planned Bindery administrator provisioning
  ansible.builtin.debug:
    msg: >-
      Bindery does not hold the vault-authored administrator; a live run would
      declare it through the user management interface.
  when:
    - ansible_check_mode
    - not bindery_administrator_present | bool

- name: Declare the vault-authored Bindery administrator
  ansible.builtin.uri:
    url: "{{ bindery_api }}/auth/users"
    method: POST
    headers:
      X-Api-Key: "{{ bindery_api_key }}"
    body_format: json
    body:
      username: "{{ vault_bindery_admin_username }}"
      password: "{{ vault_bindery_admin_password }}"
      role: admin
    status_code: [201]
  when:
    - not ansible_check_mode
    - not bindery_administrator_present | bool
  changed_when: true
  no_log: true

- name: Read the declared Bindery destination roots
  ansible.builtin.uri:
    url: "{{ bindery_api }}/rootfolder"
    method: GET
    headers:
      X-Api-Key: "{{ bindery_api_key }}"
    status_code: [200]
    return_content: true
  register: bindery_root_folders
  changed_when: false
  check_mode: false
  no_log: true

# A duplicate root folder is a 500, and creation stats the path inside the
# container, so host_prep's directories and the bind mounts must already exist.
- name: Resolve the missing Bindery destination roots
  ansible.builtin.set_fact:
    bindery_missing_roots: >-
      {{ bindery_library_roots
         | difference(bindery_root_folders.json | default([]) | map(attribute='path') | list) }}

- name: Report the planned Bindery destination roots
  ansible.builtin.debug:
    msg: >-
      Bindery does not own these declared destination roots and a live run would
      create them: {{ bindery_missing_roots | join(', ') }}.
  when:
    - ansible_check_mode
    - bindery_missing_roots | length > 0

- name: Declare the Bindery destination roots
  ansible.builtin.uri:
    url: "{{ bindery_api }}/rootfolder"
    method: POST
    headers:
      X-Api-Key: "{{ bindery_api_key }}"
    body_format: json
    body:
      path: "{{ item }}"
    status_code: [201]
  loop: "{{ bindery_missing_roots }}"
  loop_control:
    label: bindery-destination-root
  when: not ansible_check_mode
  changed_when: true
  no_log: true

- name: Reconcile the Bindery author destinations
  ansible.builtin.include_tasks: reconcile_authors.yml

- name: Read the declared Bindery settings
  ansible.builtin.uri:
    url: "{{ bindery_api }}/setting"
    method: GET
    headers:
      X-Api-Key: "{{ bindery_api_key }}"
    status_code: [200]
    return_content: true
  register: bindery_settings
  changed_when: false
  check_mode: false
  no_log: true

- name: Resolve the Bindery settings needing reconciliation
  ansible.builtin.set_fact:
    bindery_settings_to_write: >-
      {{ (bindery_pinned_settings | dict2items)
         | difference(bindery_settings.json | default([])
                      | items2dict(key_name='key', value_name='value')
                      | dict2items) }}

- name: Report the planned Bindery settings reconciliation
  ansible.builtin.debug:
    msg: >-
      Bindery does not hold these declared settings and a live run would write
      them: {{ bindery_settings_to_write | map(attribute='key') | join(', ') }}.
  when:
    - ansible_check_mode
    - bindery_settings_to_write | length > 0

- name: Reconcile the declared Bindery settings
  ansible.builtin.uri:
    url: "{{ bindery_api }}/setting/{{ item.key }}"
    method: PUT
    headers:
      X-Api-Key: "{{ bindery_api_key }}"
    body_format: json
    body:
      value: "{{ item.value }}"
    status_code: [200]
  loop: "{{ bindery_settings_to_write }}"
  loop_control:
    label: bindery-setting
  when: not ansible_check_mode
  changed_when: true
  no_log: true

- name: Reconcile the Bindery Usenet integrations
  ansible.builtin.include_tasks: reconcile_usenet.yml
  when: media_usenet_enabled | bool

- name: Report the inert Bindery Usenet integrations
  ansible.builtin.debug:
    msg: >-
      Usenet is disabled for this host, so Bindery declares no Prowlarr instance
      and no download client. Both writes resolve their host at write time and
      reject an address they cannot look up, so neither can be declared while
      Prowlarr and SABnzbd are stopped.
  when: not media_usenet_enabled | bool

# Unconditional: site.yml converges Audiobookshelf first and the handoff needs
# no transport.
- name: Reconcile the Bindery Audiobookshelf integration
  ansible.builtin.include_tasks: reconcile_audiobookshelf.yml

- name: Verify the Bindery service endpoint
  tags: [platform_verify_bindery]
  ansible.builtin.uri:
    url: "{{ bindery_api }}/health"
    method: GET
    status_code: [200]
    return_content: true
  register: bindery_verify_health
  changed_when: false
  check_mode: false

- name: Verify the Bindery authentication posture
  tags: [platform_verify_bindery]
  ansible.builtin.uri:
    url: "{{ bindery_api }}/auth/status"
    method: GET
    status_code: [200]
    return_content: true
  register: bindery_verify_auth_status
  changed_when: false
  check_mode: false

# Never probe with a wrong password: the limiter answers 429 to the correct one
# after five failures per fifteen minutes.
- name: Verify Bindery refuses an unauthenticated caller
  tags: [platform_verify_bindery]
  ansible.builtin.uri:
    url: "{{ bindery_api }}/rootfolder"
    method: GET
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: bindery_verify_anonymous
  failed_when: false
  changed_when: false
  check_mode: false

# One login with the authored password, which resets the limiter rather than
# consuming it.
- name: Verify Bindery accepts the vault administrator
  tags: [platform_verify_bindery]
  ansible.builtin.uri:
    url: "{{ bindery_api }}/auth/login"
    method: POST
    body_format: json
    body:
      username: "{{ vault_bindery_admin_username }}"
      password: "{{ vault_bindery_admin_password }}"
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: bindery_verify_identity
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

# Redacted: the response returns the deployed API key in clear.
- name: Verify the Bindery administrator session authorizes the API
  tags: [platform_verify_bindery]
  ansible.builtin.uri:
    url: "{{ bindery_api }}/auth/config"
    method: GET
    headers:
      Cookie: "{{ bindery_verify_identity.cookies_string | default('') }}"
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: bindery_verify_config
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

- name: Verify the Bindery destination root ownership
  tags: [platform_verify_bindery]
  ansible.builtin.uri:
    url: "{{ bindery_api }}/rootfolder"
    method: GET
    headers:
      X-Api-Key: "{{ bindery_verify_config.json.apiKey | default('') }}"
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: bindery_verify_roots
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

# The distroless image cannot repair a wrongly owned directory, so this read
# names the failure instead of a permission-denied import later.
- name: Verify the Bindery configured storage
  tags: [platform_verify_bindery]
  ansible.builtin.uri:
    url: "{{ bindery_api }}/system/storage"
    method: GET
    headers:
      X-Api-Key: "{{ bindery_verify_config.json.apiKey | default('') }}"
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: bindery_verify_storage
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

# The acquisition half: the checks above passed green while nothing could be
# grabbed (#425).
- name: Verify the Bindery synced indexers
  tags: [platform_verify_bindery]
  ansible.builtin.uri:
    url: "{{ bindery_api }}/indexer"
    method: GET
    headers:
      X-Api-Key: "{{ bindery_verify_config.json.apiKey | default('') }}"
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: bindery_verify_indexers
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

- name: Verify the Bindery author destinations
  tags: [platform_verify_bindery]
  ansible.builtin.uri:
    url: "{{ bindery_api }}/author"
    method: GET
    headers:
      X-Api-Key: "{{ bindery_verify_config.json.apiKey | default('') }}"
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: bindery_verify_authors
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

# Gated on declared indexers, not the transport flag: sandboxes run with none on
# purpose, and where declared an empty sync is otherwise invisible.
- name: Require the Bindery acquisition transport
  tags: [platform_verify_bindery]
  ansible.builtin.assert:
    that:
      - bindery_verify_indexers.status | default(0) | int == 200
      - bindery_verify_indexers.json | default([], true) | length > 0
      - >-
        bindery_verify_indexers.json | default([], true)
        | selectattr('enabled') | list | length > 0
    # Never interpolate media_arr_indexers here: it carries API keys and would
    # force no_log.
    fail_msg: >-
      Bindery holds no enabled indexer while indexers are declared for
      Prowlarr. They are synced from the declared Prowlarr instance rather than
      written by this platform, so a sync that returned nothing leaves every
      search empty and every book ungrabbable while every other reading stays
      correct.
  when:
    - media_usenet_enabled | bool
    - media_arr_indexers | length > 0

# A null root is unactionable yet the book still reads wanted and monitored.
- name: Require the Bindery author destinations
  tags: [platform_verify_bindery]
  ansible.builtin.assert:
    that:
      - bindery_verify_authors.status | default(0) | int == 200
      - >-
        (bindery_verify_authors.json['items'] | default([], true)
         | selectattr('rootFolderId', 'none') | list | length) == 0
      - >-
        (bindery_verify_authors.json['items'] | default([], true)
         | selectattr('audiobookRootFolderId', 'none') | list | length) == 0
      - >-
        (bindery_verify_authors.json['items'] | default([], true)
         | selectattr('qualityProfileId', 'none') | list | length) == 0
    fail_msg: >-
      Bindery holds authors with no destination root or no quality profile.
      Their books stay wanted and monitored and can never be grabbed, because
      there is nowhere to put a release and no rule for which one qualifies.

# The Audiobookshelf handoff swallows its failures at WARN. The probe sends no
# key, so a 200 proves the credential Bindery stores still authenticates.
- name: Verify the Bindery Audiobookshelf integration
  tags: [platform_verify_bindery]
  ansible.builtin.uri:
    url: "{{ bindery_api }}/abs/config"
    method: GET
    headers:
      X-Api-Key: "{{ bindery_verify_config.json.apiKey | default('') }}"
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: bindery_verify_abs_config
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

- name: Verify the Bindery Audiobookshelf credential
  tags: [platform_verify_bindery]
  ansible.builtin.uri:
    url: "{{ bindery_api }}/abs/test"
    method: POST
    headers:
      X-Api-Key: "{{ bindery_verify_config.json.apiKey | default('') }}"
    body_format: json
    body: {}
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: bindery_verify_abs_probe
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

# Probes above accept any status so drift is named here, not in a redacted
# request.
- name: Require the exact Bindery verification results
  tags: [platform_verify_bindery]
  ansible.builtin.assert:
    that:
      - bindery_verify_health.json.status | default('') == 'ok'
      - bindery_verify_auth_status.json.mode | default('') == 'enabled'
      - not bindery_verify_auth_status.json.setupRequired | default(true) | bool
      - bindery_verify_anonymous.status | default(0) | int == 401
      - bindery_verify_identity.status | default(0) | int == 200
      - bindery_verify_config.status | default(0) | int == 200
      - bindery_verify_roots.status | default(0) | int == 200
      - >-
        bindery_verify_roots.json | default([]) | map(attribute='path') | sort | list
        == bindery_library_roots | sort | list
      - bindery_verify_storage.status | default(0) | int == 200
      - >-
        (bindery_verify_storage.json.dirs | default([])
         | selectattr('exists') | selectattr('writable') | list | length) == 4
      # The only reading that tells one bind mount per share from one per
      # directory; false means imports copy every byte (#264).
      - bindery_verify_storage.json.hardlinkable | default(false) | bool
      - bindery_verify_abs_config.status | default(0) | int == 200
      - bindery_verify_abs_config.json.featureEnabled | default(false) | bool
      - bindery_verify_abs_config.json.enabled | default(false) | bool
      - bindery_verify_abs_config.json.baseUrl | default('') == bindery_audiobookshelf_url
      - bindery_verify_abs_config.json.label | default('') == bindery_audiobookshelf_label
      - bindery_verify_abs_config.json.pathRemap | default('') == bindery_audiobookshelf_path_remap
      - bindery_verify_abs_config.json.libraryIds | default([]) | length == 1
      - bindery_verify_abs_config.json.apiKeyConfigured | default(false) | bool
      - bindery_verify_abs_probe.status | default(0) | int == 200
    fail_msg: >-
      Bindery is unreachable, or it no longer enforces authentication, accepts
      exactly the vault-authored administrator, refuses an unauthenticated
      caller, owns exactly the declared ebook and audiobook destination roots,
      reports all four configured directories present and writable, and can
      hardlink from each staging root into the library it feeds, and holds the
      declared Audiobookshelf integration with a credential that still
      authenticates against it.
