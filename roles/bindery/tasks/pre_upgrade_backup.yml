---
# Backs up before Compose starts a changed image, since Bindery migrates its
# schema at startup. The pin is read from `current` live but from the controller
# checkout under --check, where `current` still names the old release (#851,
# #858).
- name: Read the deployed Bindery Compose definition
  ansible.builtin.slurp:
    path: "{{ platform_current_dir }}/services/bindery/compose.yml"
  register: bindery_compose_source
  when: not ansible_check_mode

- name: Resolve the pinned Bindery image reference
  ansible.builtin.set_fact:
    bindery_pinned_image: >-
      {{ ((lookup('ansible.builtin.file', playbook_dir ~ '/services/bindery/compose.yml')
           if ansible_check_mode
           else bindery_compose_source.content | b64decode) | from_yaml).services.bindery.image }}

# Only a running container: `VACUUM INTO` is the backup route because a file
# copy of the stopped WAL-mode database silently omits bindery.db-wal.
- name: List the running Bindery container
  ansible.builtin.command:
    argv:
      - docker
      - container
      - ls
      - --quiet
      - --filter
      - "label=com.docker.compose.project={{ bindery_compose_project_name }}"
      - --filter
      - "label=com.docker.compose.service=bindery"
  register: bindery_running_ids
  changed_when: false
  check_mode: false

# Redacted: inspect returns the Env array, which carries the API-key seed.
- name: Inspect the running Bindery container
  ansible.builtin.command:
    argv: "{{ ['docker', 'container', 'inspect'] + bindery_running_ids.stdout_lines }}"
  register: bindery_running_inspection
  changed_when: false
  check_mode: false
  no_log: true
  when: bindery_running_ids.stdout_lines | length > 0

- name: Resolve the running Bindery image reference
  ansible.builtin.set_fact:
    bindery_deployed_image: >-
      {{ (bindery_running_inspection.stdout | default('[]', true) | from_json
          | map(attribute='Config.Image') | list | first | default('', true)) }}

- name: Resolve whether a Bindery upgrade is pending
  ansible.builtin.set_fact:
    bindery_upgrade_pending: >-
      {{ bindery_deployed_image | length > 0
         and bindery_deployed_image != bindery_pinned_image }}

- name: Report the planned Bindery pre-upgrade backup
  ansible.builtin.debug:
    msg: >-
      Bindery is running {{ bindery_deployed_image }} and the release pins
      {{ bindery_pinned_image }}; a live run would take a database backup and
      refuse the upgrade unless it succeeded.
  when:
    - ansible_check_mode
    - bindery_upgrade_pending | bool

- name: Resolve the Bindery API key before the upgrade
  ansible.builtin.include_tasks: resolve_api_key.yml
  when:
    - not ansible_check_mode
    - bindery_upgrade_pending | bool

# Stages to a temporary name then renames, landing under the config bind mount;
# anything but 201 fails the play with the new image still unstarted.
- name: Back up Bindery state before the pinned upgrade
  ansible.builtin.uri:
    url: "{{ bindery_api }}/backup"
    method: POST
    headers:
      X-Api-Key: "{{ bindery_api_key }}"
    body_format: json
    body:
      label: pre-upgrade
    status_code: [201]
  when:
    - not ansible_check_mode
    - bindery_upgrade_pending | bool
  changed_when: true
  no_log: true

- name: Report the completed Bindery pre-upgrade backup
  ansible.builtin.debug:
    msg: >-
      Bindery state was backed up into {{ bindery_config_host_path }}/backups
      before upgrading to {{ bindery_pinned_image }}.
  when:
    - not ansible_check_mode
    - bindery_upgrade_pending | bool
