---
# Bindery assigns no root folder or quality profile to a new author, leaving its
# books wanted but ungrabbable (#425). Repairs a null and only a null:
# deliberate per-author choices stay the operator's. `monitored` is written only
# for an author holding a monitored wanted book, and never by the repair below.

# Re-read after the roots are declared, so a root created this run carries its
# id.
- name: Read the Bindery destination roots for author reconciliation
  ansible.builtin.uri:
    url: "{{ bindery_api }}/rootfolder"
    method: GET
    headers:
      X-Api-Key: "{{ bindery_api_key }}"
    status_code: [200]
    return_content: true
  register: bindery_author_roots
  changed_when: false
  check_mode: false
  no_log: true

- name: Read the Bindery quality profiles
  ansible.builtin.uri:
    url: "{{ bindery_api }}/qualityprofile"
    method: GET
    headers:
      X-Api-Key: "{{ bindery_api_key }}"
    status_code: [200]
    return_content: true
  register: bindery_quality_profiles
  changed_when: false
  check_mode: false
  no_log: true

# `/author` is paged, 100 by default and 500 at most, so one read skipped every
# author past the first page. `recent` is the only order with a unique key, so
# a tie never skips or repeats a row between pages.
- name: Read the declared Bindery authors
  ansible.builtin.uri:
    url: "{{ bindery_api }}/author?sort=recent&limit=500"
    method: GET
    headers:
      X-Api-Key: "{{ bindery_api_key }}"
    status_code: [200]
    return_content: true
  register: bindery_authors
  changed_when: false
  check_mode: false
  no_log: true

# Strided by the limit Bindery applied, not the one asked for, so a lower
# server maximum still skips nothing.
- name: Read the remaining Bindery author pages
  ansible.builtin.uri:
    url: "{{ bindery_api }}/author?sort=recent&limit={{ bindery_authors.json.limit }}&offset={{ item }}"
    method: GET
    headers:
      X-Api-Key: "{{ bindery_api_key }}"
    status_code: [200]
    return_content: true
  loop: >-
    {{ range(bindery_authors.json.limit | int, bindery_authors.json.total | int,
             bindery_authors.json.limit | int) | list }}
  loop_control:
    label: bindery-author-page
  register: bindery_author_pages
  changed_when: false
  check_mode: false
  no_log: true

# An author created between reads repeats one row across a page boundary.
- name: Combine the Bindery author pages
  ansible.builtin.set_fact:
    bindery_author_items: >-
      {{ ([bindery_authors] + bindery_author_pages.results | default([]))
         | subelements('json.items', skip_missing=true)
         | map(attribute='1') | unique(attribute='id') }}

# Resolved by name or path: all three are database-assigned integers.
- name: Resolve the Bindery author destination defaults
  ansible.builtin.set_fact:
    bindery_author_defaults:
      rootFolderId: >-
        {{ bindery_author_roots.json | default([])
           | selectattr('path', 'equalto', bindery_ebooks_root)
           | map(attribute='id') | first | default(0) | int }}
      audiobookRootFolderId: >-
        {{ bindery_author_roots.json | default([])
           | selectattr('path', 'equalto', bindery_audiobooks_root)
           | map(attribute='id') | first | default(0) | int }}
      qualityProfileId: >-
        {{ bindery_quality_profiles.json | default([])
           | selectattr('name', 'equalto', bindery_default_quality_profile_name)
           | map(attribute='id') | first | default(0) | int }}

# A zero means a profile name drifted or a root was renamed; writing it would
# reference a row that does not exist.
- name: Refuse unresolvable Bindery author destinations
  ansible.builtin.assert:
    that:
      - bindery_author_defaults.rootFolderId | int > 0
      - bindery_author_defaults.audiobookRootFolderId | int > 0
      - bindery_author_defaults.qualityProfileId | int > 0
    fail_msg: >-
      Bindery does not own a destination root at {{ bindery_ebooks_root }} and
      {{ bindery_audiobooks_root }}, or a quality profile named
      {{ bindery_default_quality_profile_name }}. An author cannot be repaired
      against a row that does not exist.

# The selections are mutually exclusive, so the concatenation needs no dedupe.
- name: Resolve the Bindery authors missing a destination or profile
  ansible.builtin.set_fact:
    bindery_authors_to_repair: >-
      {{ (bindery_author_items
          | selectattr('rootFolderId', 'none') | list)
         + (bindery_author_items
            | rejectattr('rootFolderId', 'none')
            | selectattr('audiobookRootFolderId', 'none') | list)
         + (bindery_author_items
            | rejectattr('rootFolderId', 'none')
            | rejectattr('audiobookRootFolderId', 'none')
            | selectattr('qualityProfileId', 'none') | list) }}

- name: Report the planned Bindery author reconciliation
  ansible.builtin.debug:
    msg: >-
      {{ bindery_authors_to_repair | length }} Bindery authors hold no
      destination root or no quality profile and a live run would repair them:
      {{ bindery_authors_to_repair | map(attribute='authorName') | join(', ') }}.
  when:
    - ansible_check_mode
    - bindery_authors_to_repair | length > 0

# `statistics` is a computed projection the record does not own. Existing values
# are kept, so a second run writes nothing.
- name: Repair the Bindery authors missing a destination or profile
  ansible.builtin.uri:
    url: "{{ bindery_api }}/author/{{ item.id }}"
    method: PUT
    headers:
      X-Api-Key: "{{ bindery_api_key }}"
    body_format: json
    body: >-
      {{ (item | dict2items | rejectattr('key', 'equalto', 'statistics') | items2dict)
         | combine({
             'rootFolderId':
               bindery_author_defaults.rootFolderId | int
               if item.rootFolderId is none else item.rootFolderId,
             'audiobookRootFolderId':
               bindery_author_defaults.audiobookRootFolderId | int
               if item.audiobookRootFolderId is none else item.audiobookRootFolderId,
             'qualityProfileId':
               bindery_author_defaults.qualityProfileId | int
               if item.qualityProfileId is none else item.qualityProfileId,
           }) }}
    status_code: [200]
  loop: "{{ bindery_authors_to_repair }}"
  loop_control:
    label: bindery-author
  when: not ansible_check_mode
  changed_when: true
  no_log: true

# Adding a single book creates its author unmonitored while marking the book
# monitored, and Bindery never searches automatically for a book whose author is
# unmonitored (upstream #2742), so every book added on its own sat wanted
# forever. Monitor exactly those authors under mode `none`: existing books keep
# their own flags (no cascade is requested), and a catalogue refresh monitors
# nothing new. To stop a wanted book being searched, unmonitor the book.
# Unpaginated, unlike `/author`, and carries `authorUnmonitored` per book.
- name: Read the wanted Bindery books
  ansible.builtin.uri:
    url: "{{ bindery_api }}/wanted/missing"
    method: GET
    headers:
      X-Api-Key: "{{ bindery_api_key }}"
    status_code: [200]
    return_content: true
  register: bindery_wanted_books
  changed_when: false
  check_mode: false
  no_log: true

# `authorUnmonitored` is omitted, not false, for a monitored author.
- name: Resolve the unmonitored Bindery authors holding a monitored wanted book
  ansible.builtin.set_fact:
    bindery_authors_to_monitor: >-
      {{ bindery_wanted_books.json | default([], true)
         | selectattr('monitored')
         | selectattr('authorUnmonitored', 'defined')
         | selectattr('authorUnmonitored')
         | map(attribute='authorId') | unique | list }}

- name: Report the planned Bindery author monitoring
  ansible.builtin.debug:
    msg: >-
      {{ bindery_authors_to_monitor | length }} unmonitored Bindery authors hold
      a monitored wanted book that is never searched automatically, and a live
      run would monitor them under mode none.
  when:
    - ansible_check_mode
    - bindery_authors_to_monitor | length > 0

# A partial body: the update handler changes only the fields it is sent.
- name: Monitor the Bindery authors holding a monitored wanted book
  ansible.builtin.uri:
    url: "{{ bindery_api }}/author/{{ item }}"
    method: PUT
    headers:
      X-Api-Key: "{{ bindery_api_key }}"
    body_format: json
    body:
      monitored: true
      monitorMode: none
    status_code: [200]
  loop: "{{ bindery_authors_to_monitor }}"
  loop_control:
    label: bindery-author
  when: not ansible_check_mode
  changed_when: true
  no_log: true
