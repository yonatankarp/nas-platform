---
# Bindery assigns no root folder or quality profile to a new author, leaving its
# books wanted but ungrabbable (#425). Repairs a null and only a null:
# deliberate per-author choices, and `monitored`, stay the operator's.

# Re-read after the roots are declared, so a root created this run carries its
# id.
- name: Read the Bindery destination roots for author reconciliation
  ansible.builtin.uri:
    url: "{{ bindery_api }}/rootfolder"
    method: GET
    headers:
      X-Api-Key: "{{ bindery_api_key }}"
    status_code: [200]
    return_content: true
  register: bindery_author_roots
  changed_when: false
  check_mode: false
  no_log: true

- name: Read the Bindery quality profiles
  ansible.builtin.uri:
    url: "{{ bindery_api }}/qualityprofile"
    method: GET
    headers:
      X-Api-Key: "{{ bindery_api_key }}"
    status_code: [200]
    return_content: true
  register: bindery_quality_profiles
  changed_when: false
  check_mode: false
  no_log: true

- name: Read the declared Bindery authors
  ansible.builtin.uri:
    url: "{{ bindery_api }}/author"
    method: GET
    headers:
      X-Api-Key: "{{ bindery_api_key }}"
    status_code: [200]
    return_content: true
  register: bindery_authors
  changed_when: false
  check_mode: false
  no_log: true

# Resolved by name or path: all three are database-assigned integers.
- name: Resolve the Bindery author destination defaults
  ansible.builtin.set_fact:
    bindery_author_defaults:
      rootFolderId: >-
        {{ bindery_author_roots.json | default([])
           | selectattr('path', 'equalto', bindery_ebooks_root)
           | map(attribute='id') | first | default(0) | int }}
      audiobookRootFolderId: >-
        {{ bindery_author_roots.json | default([])
           | selectattr('path', 'equalto', bindery_audiobooks_root)
           | map(attribute='id') | first | default(0) | int }}
      qualityProfileId: >-
        {{ bindery_quality_profiles.json | default([])
           | selectattr('name', 'equalto', bindery_default_quality_profile_name)
           | map(attribute='id') | first | default(0) | int }}

# A zero means a profile name drifted or a root was renamed; writing it would
# reference a row that does not exist.
- name: Refuse unresolvable Bindery author destinations
  ansible.builtin.assert:
    that:
      - bindery_author_defaults.rootFolderId | int > 0
      - bindery_author_defaults.audiobookRootFolderId | int > 0
      - bindery_author_defaults.qualityProfileId | int > 0
    fail_msg: >-
      Bindery does not own a destination root at {{ bindery_ebooks_root }} and
      {{ bindery_audiobooks_root }}, or a quality profile named
      {{ bindery_default_quality_profile_name }}. An author cannot be repaired
      against a row that does not exist.

# The selections are mutually exclusive, so the concatenation needs no dedupe.
- name: Resolve the Bindery authors missing a destination or profile
  ansible.builtin.set_fact:
    bindery_authors_to_repair: >-
      {{ (bindery_authors.json['items'] | default([], true)
          | selectattr('rootFolderId', 'none') | list)
         + (bindery_authors.json['items'] | default([], true)
            | rejectattr('rootFolderId', 'none')
            | selectattr('audiobookRootFolderId', 'none') | list)
         + (bindery_authors.json['items'] | default([], true)
            | rejectattr('rootFolderId', 'none')
            | rejectattr('audiobookRootFolderId', 'none')
            | selectattr('qualityProfileId', 'none') | list) }}

- name: Report the planned Bindery author reconciliation
  ansible.builtin.debug:
    msg: >-
      {{ bindery_authors_to_repair | length }} Bindery authors hold no
      destination root or no quality profile and a live run would repair them:
      {{ bindery_authors_to_repair | map(attribute='authorName') | join(', ') }}.
  when:
    - ansible_check_mode
    - bindery_authors_to_repair | length > 0

# `statistics` is a computed projection the record does not own. Existing values
# are kept, so a second run writes nothing.
- name: Repair the Bindery authors missing a destination or profile
  ansible.builtin.uri:
    url: "{{ bindery_api }}/author/{{ item.id }}"
    method: PUT
    headers:
      X-Api-Key: "{{ bindery_api_key }}"
    body_format: json
    body: >-
      {{ (item | dict2items | rejectattr('key', 'equalto', 'statistics') | items2dict)
         | combine({
             'rootFolderId':
               bindery_author_defaults.rootFolderId | int
               if item.rootFolderId is none else item.rootFolderId,
             'audiobookRootFolderId':
               bindery_author_defaults.audiobookRootFolderId | int
               if item.audiobookRootFolderId is none else item.audiobookRootFolderId,
             'qualityProfileId':
               bindery_author_defaults.qualityProfileId | int
               if item.qualityProfileId is none else item.qualityProfileId,
           }) }}
    status_code: [200]
  loop: "{{ bindery_authors_to_repair }}"
  loop_control:
    label: bindery-author
  when: not ansible_check_mode
  changed_when: true
  no_log: true
