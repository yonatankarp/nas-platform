---
# Never submit a password expected to be wrong: once five failures in fifteen
# minutes trip the per-IP limiter, it answers 429 to the correct password too.
- name: Probe the vault-authored Bindery API key
  ansible.builtin.uri:
    url: "{{ bindery_api }}/auth/config"
    method: GET
    headers:
      X-Api-Key: "{{ vault_bindery_api_key }}"
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: bindery_key_probe
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

# BINDERY_API_KEY seeds only an absent key and later changes mint a random
# value, so the administrator reading it out is the only recovery. Runs only
# when the seeded key already fails, so it can afford the one login.
- name: Recover the deployed Bindery API key with the vault administrator
  ansible.builtin.uri:
    url: "{{ bindery_api }}/auth/login"
    method: POST
    body_format: json
    body:
      username: "{{ vault_bindery_admin_username }}"
      password: "{{ vault_bindery_admin_password }}"
    status_code: "{{ range(100, 600) | list }}"
  register: bindery_identity_login
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true
  when: bindery_key_probe.status | default(0) | int != 200

- name: Read the deployed Bindery API key from the recovered session
  ansible.builtin.uri:
    url: "{{ bindery_api }}/auth/config"
    method: GET
    headers:
      Cookie: "{{ bindery_identity_login.cookies_string | default('') }}"
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: bindery_session_config
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true
  when: bindery_identity_login.status | default(0) | int == 200

- name: Resolve the effective Bindery API key
  ansible.builtin.set_fact:
    bindery_api_key: >-
      {{ (bindery_key_probe.json | default({})).apiKey | default('')
         if bindery_key_probe.status | default(0) | int == 200
         else (bindery_session_config.json | default({})).apiKey | default('') }}
  no_log: true

# Reduced to a boolean so downstream refusals need no no_log and can say which
# state failed.
- name: Resolve whether the Bindery API key was recovered
  ansible.builtin.set_fact:
    bindery_key_recovered: "{{ bindery_api_key | length > 0 }}"
  no_log: true

# Status codes only. Order matters: a negative status (connection never
# completed) is service evidence, not credential evidence (#509); 429 says
# nothing about the identity; only 401/403 on both probes establishes it. 0
# means never requested.
- name: Classify the Bindery API key resolution
  ansible.builtin.set_fact:
    bindery_key_resolution: >-
      {{ 'resolved'
         if bindery_key_recovered | bool
         else 'unreachable'
         if (bindery_key_probe.status | default(-1) | int) < 0
            or (bindery_identity_login.status | default(0) | int) < 0
            or (bindery_session_config.status | default(0) | int) < 0
         else 'rate-limited'
         if (bindery_key_probe.status | default(-1) | int) == 429
            or (bindery_identity_login.status | default(0) | int) == 429
         else 'rejected-identity'
         if (bindery_key_probe.status | default(-1) | int) in [401, 403]
            and (bindery_identity_login.status | default(0) | int) in [401, 403]
         else 'unexpected' }}

# The remedy follows the cause: only a rejected identity may propose deleting
# the database (#510). Not redacted: it renders only status codes.
- name: Refuse an unresolved Bindery API key
  vars:
    bindery_key_probe_status: "{{ bindery_key_probe.status | default(-1) | int }}"
    bindery_login_status: "{{ bindery_identity_login.status | default(0) | int }}"
    bindery_session_status: "{{ bindery_session_config.status | default(0) | int }}"
    bindery_observed_statuses: >-
      The API-key read reported HTTP {{ bindery_key_probe_status }}, the
      administrator login {{ bindery_login_status }} and the session read
      {{ bindery_session_status }} (0 means the request was never made, and a
      negative status means the connection never completed).
    bindery_key_refusals:
      unreachable: >-
        Bindery stopped answering while this run was resolving its API key.
        {{ bindery_observed_statuses }} That is a service which is not serving,
        and it is no evidence at all about the deployed credentials: the
        readiness gate above demanded a 200 from /health, so the container was
        answering moments earlier and stopped between two requests, which is
        what a container in `Restarting` does. Read `docker ps --filter
        name=bindery` and `docker logs bindery` before reading anything about
        the vault, and do not touch the Bindery database -- nothing here says it
        is at fault.
      rate-limited: >-
        Bindery's login limiter is tripped and answered 429.
        {{ bindery_observed_statuses }} The limiter is per IP at five failures
        in fifteen minutes and refuses the correct password once tripped, so
        this says nothing about whether the vault-authored identity is right.
        Wait fifteen minutes without logging in from this host; every further
        attempt, this platform's own five-minute converge included, extends the
        window rather than shortening it.
      rejected-identity: >-
        Bindery refused both the vault-authored API key and the vault-authored
        administrator. {{ bindery_observed_statuses }} It is therefore holding
        an identity this platform did not author, and no converge can replace
        it: BINDERY_API_KEY seeds the stored key only while that key is absent,
        and the only route that changes one afterwards mints a random value.
        Recover the deployed credentials into the vault, or -- and only because
        this is the one state in which the cause is established -- remove the
        Bindery database under {{ bindery_config_host_path }}, which destroys
        every author, book, quality profile and setting it holds, before running
        again.
      unexpected: >-
        Bindery did not hand over an API key and did not report a cause this
        play recognises. {{ bindery_observed_statuses }} Read those statuses
        rather than inferring a credential fault from them; none of them
        establishes one, and nothing here justifies touching the Bindery
        database.
  # `.get`, not a subscript: fail_msg is rendered on the success path too, where
  # 'resolved' has no entry, and unknown future states name themselves.
  ansible.builtin.assert:
    that:
      - bindery_key_resolution == 'resolved'
    fail_msg: >-
      {{ bindery_key_refusals.get(
           bindery_key_resolution,
           'Bindery API-key resolution ended in the state ' ~ bindery_key_resolution ~
           ', which this role has no refusal text for. ' ~ bindery_observed_statuses ~
           ' Treat the statuses as the whole of what is known and do not infer a
           credential fault from them.') }}
