---
bindery_port: 8787
bindery_api: "http://127.0.0.1:{{ bindery_port }}/api/v1"
bindery_config_host_path: "{{ nas_docker_root }}/bindery/config"
# Each share is mounted as one parent so a library and its staging directory sit
# inside one mount: rename(2) refuses to cross a mount boundary, so a mount per
# leaf turned every import into a full copy and ruled out hardlinks.
bindery_books_host_path: "{{ nas_media_root }}/Books"
bindery_media_host_path: "{{ nas_media_root }}/Media"
# Ebooks and audiobooks must stay separate root folders.
bindery_ebooks_root: /data/books/Ebooks
bindery_audiobooks_root: /data/media/Audiobooks
bindery_library_roots:
  - "{{ bindery_ebooks_root }}"
  - "{{ bindery_audiobooks_root }}"

# Compose service aliases: Bindery resolves each URL's host at write time.
bindery_prowlarr_name: Prowlarr
bindery_prowlarr_internal_url: http://prowlarr:9696
bindery_sabnzbd_client_name: SABnzbd
bindery_sabnzbd_host: sabnzbd
bindery_sabnzbd_port: 8080
bindery_sabnzbd_ebook_category: ebooks
bindery_sabnzbd_audiobook_category: audiobooks

# Ansible reaches Audiobookshelf on the published port; Bindery reaches it
# inside media-control, where the container listens on 80.
bindery_audiobookshelf_port: 13378
bindery_audiobookshelf_api: "http://127.0.0.1:{{ bindery_audiobookshelf_port }}"
bindery_audiobookshelf_url: http://audiobookshelf
# Bindery substitutes "Audiobookshelf" for an empty label. The remap is declared
# empty because the write keeps any field the request leaves out.
bindery_audiobookshelf_label: Audiobookshelf
bindery_audiobookshelf_path_remap: ""
# Must name the library roles/audiobookshelf declares; the reconciliation
# refuses unless it resolves to exactly one book library.
bindery_audiobookshelf_library_name: Audiobooks
# Identifies the platform-minted key for retirement; never reuse an operator's
# key name.
bindery_audiobookshelf_api_key_name: bindery

# autoGrabEnabled fails open (a missing row reads as enabled), so this row
# reverts a manual disable rather than guaranteeing enablement. Telemetry is
# pinned off here as well as in the environment.
bindery_pinned_settings:
  autoGrab.enabled: "true"
  telemetry.enabled: "false"

# Matched by name: Bindery creates Any/E-Book/Audiobook itself on first start.
# `Any` because authors routinely have both an ebook and an audiobook edition.
bindery_default_quality_profile_name: Any

# Read only, by verification; declared here because a role's defaults are its
# argument list.
media_arr_indexers: []

# Gates the Prowlarr and SABnzbd rows, which need those containers running.
media_usenet_enabled: false

bindery_compose_project_name: >-
  {{ (platform_project_name ~ '-bindery')
     if platform_project_name | default('') | length > 0 else 'bindery' }}
