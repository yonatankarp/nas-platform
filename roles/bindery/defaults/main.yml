---
bindery_port: 8787
bindery_api: "http://127.0.0.1:{{ bindery_port }}/api/v1"
bindery_config_host_path: "{{ nas_docker_root }}/bindery/config"
# The two host shares each library shares with its own staging directory, and
# the reason they are mounted as parents rather than four leaves: Ebooks sits
# beside .acquisition/usenet/ebooks under Books, and Audiobooks beside
# .acquisition/usenet/audiobooks under Media, so one bind mount per share puts
# each pair inside one mount. rename(2) refuses to cross a mount boundary even
# when both sides are the same filesystem, so a mount per leaf turned every
# import into a full byte copy plus unlink and made hardlinking impossible.
# Staging still lands under the same container path SABnzbd reports a finished
# download at, so an import needs no path remap. The four leaves are reached
# through the container paths below rather than mounted by name.
#
# nas_storage declares the two staging directories, both libraries and the Books
# share; the Media share itself is deliberately not declared, exactly as the
# identical Media mount Radarr and Sonarr take is not, because a media parent
# mount is legitimate and the declared leaves below it are where a mode and a
# recovery class belong. The cost is that Bindery now sees the whole Media share
# rather than Audiobooks alone, which is the same reach the arr stack has had
# since Phase 1 and the price of putting each pair inside one mount.
bindery_books_host_path: "{{ nas_media_root }}/Books"
bindery_media_host_path: "{{ nas_media_root }}/Media"
# The container paths the two libraries are mounted at, which are what Bindery
# stores as its destination root folders. Ebooks and audiobooks must stay
# separate roots; a single root is the collapse the design forbids.
bindery_ebooks_root: /data/books/Ebooks
bindery_audiobooks_root: /data/media/Audiobooks
bindery_library_roots:
  - "{{ bindery_ebooks_root }}"
  - "{{ bindery_audiobooks_root }}"

# Both integrations are addressed by their Compose service alias on the shared
# media-control network, because Bindery resolves the host in each URL at write
# time and rejects one it cannot look up.
bindery_prowlarr_name: Prowlarr
bindery_prowlarr_internal_url: http://prowlarr:9696
bindery_sabnzbd_client_name: SABnzbd
bindery_sabnzbd_host: sabnzbd
bindery_sabnzbd_port: 8080
# The two categories SABnzbd already declares for this platform, which is what
# keeps an ebook and an audiobook landing in different staging directories.
bindery_sabnzbd_ebook_category: ebooks
bindery_sabnzbd_audiobook_category: audiobooks

# The auto-grab kill switch fails open: a missing row reads as enabled, so
# unattended grabbing is only actually disabled once the row exists and says
# false. Telemetry is on by default with a daily ping and is pinned off here as
# well as in the environment, so a future environment edit cannot re-enable it
# silently.
bindery_pinned_settings:
  autoGrab.enabled: "false"
  telemetry.enabled: "false"

# Bindery deploys unconditionally — its web interface is the writer for both
# libraries and is useful with no transport at all — but the Prowlarr and
# SABnzbd rows can only be written while those two containers are running,
# which is exactly what this flag gates.
media_usenet_enabled: false

bindery_compose_project_name: >-
  {{ (platform_project_name ~ '-bindery')
     if platform_project_name | default('') | length > 0 else 'bindery' }}
