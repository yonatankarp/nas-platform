---
- name: Validate managed-user service keys
  ansible.builtin.assert:
    that:
      - vault_managed_users is mapping
      - >-
        vault_managed_users.keys() | list | sort ==
        ['audiobookshelf', 'beszel', 'dozzle', 'immich', 'jellyfin',
         'komga', 'ntfy', 'paperless_ngx'] | sort
      - vault_managed_users.audiobookshelf | type_debug == 'list'
      - vault_managed_users.beszel | type_debug == 'list'
      - vault_managed_users.dozzle | type_debug == 'list'
      - vault_managed_users.immich | type_debug == 'list'
      - vault_managed_users.immich | length > 0
      - vault_managed_users.jellyfin | type_debug == 'list'
      - vault_managed_users.komga | type_debug == 'list'
      - vault_managed_users.ntfy | type_debug == 'list'
      - vault_managed_users.paperless_ngx | type_debug == 'list'
    fail_msg: Managed-user service keys are invalid; values are redacted.
  no_log: true

- name: Validate audiobookshelf managed-user entries
  ansible.builtin.assert:
    that:
      - item.keys() | list | sort == ['username', 'password', 'type', 'is_active', 'permissions'] | sort
      - item.username is string
      - item.username | trim | length > 0
      - item.password is string
      - item.password | length > 0
      - item.type is string
      - item.type in ['admin', 'user', 'guest']
      - item.is_active is boolean
      - item.is_active
      - item.permissions is mapping
      - >-
        item.permissions.keys() | list | sort ==
        ['flags', 'librariesAccessible', 'itemTagsSelected'] | sort
      - item.permissions.flags is mapping
      - item.permissions.flags.keys() | reject('string') | list | length == 0
      - >-
        item.permissions.flags.keys() |
        difference(['download', 'update', 'delete', 'upload', 'createEreader',
                    'accessAllLibraries', 'accessAllTags', 'accessExplicitContent',
                    'selectedTagsNotAccessible']) | length == 0
      - item.permissions.flags.values() | reject('boolean') | list | length == 0
      - item.permissions.librariesAccessible | type_debug == 'list'
      - item.permissions.librariesAccessible | reject('string') | list | length == 0
      - item.permissions.librariesAccessible | select('equalto', '') | list | length == 0
      - >-
        item.permissions.librariesAccessible | unique | length ==
        item.permissions.librariesAccessible | length
      - item.permissions.itemTagsSelected | type_debug == 'list'
      - item.permissions.itemTagsSelected | reject('string') | list | length == 0
      - item.permissions.itemTagsSelected | select('equalto', '') | list | length == 0
      - >-
        item.permissions.itemTagsSelected | unique | length ==
        item.permissions.itemTagsSelected | length
    fail_msg: audiobookshelf managed user has invalid field; values are redacted.
  loop: "{{ vault_managed_users.audiobookshelf }}"
  loop_control:
    label: audiobookshelf
  no_log: true

- name: Validate Immich managed-user preference collections
  ansible.builtin.assert:
    that:
      - immich_managed_user_preference_profile_default is string
      - >-
        immich_managed_user_preference_profile_default in
        immich_managed_user_preference_profiles.keys() | list
      - immich_managed_user_preference_profile_by_email is mapping
      - immich_managed_user_preference_overrides is mapping
      - immich_managed_user_preference_profiles is mapping
      - >-
        immich_managed_user_preference_profile_by_email.keys() |
        reject('string') | list | length == 0
      - >-
        immich_managed_user_preference_profile_by_email.values() |
        reject('string') | list | length == 0
      - >-
        immich_managed_user_preference_profiles.keys() |
        reject('string') | list | length == 0
      - >-
        immich_managed_user_preference_profiles.values() |
        reject('mapping') | list | length == 0
      - >-
        immich_managed_user_preference_overrides.keys() |
        reject('string') | list | length == 0
      - >-
        immich_managed_user_preference_overrides.values() |
        reject('mapping') | list | length == 0
      - >-
        immich_managed_user_preference_profile_by_email.values() | list |
        difference(immich_managed_user_preference_profiles.keys() | list) | length == 0
      - >-
        immich_managed_user_preference_profile_by_email.keys() | map('trim') | map('lower') |
        list | unique | length == immich_managed_user_preference_profile_by_email | length
      - >-
        immich_managed_user_preference_overrides.keys() | map('trim') | map('lower') |
        list | unique | length == immich_managed_user_preference_overrides | length
      - >-
        immich_managed_user_preference_profile_by_email.keys() | map('trim') | map('lower') |
        difference(vault_managed_users.immich | map(attribute='email') |
                   map('trim') | map('lower') | list) | length == 0
      - >-
        immich_managed_user_preference_overrides.keys() | map('trim') | map('lower') |
        difference(vault_managed_users.immich | map(attribute='email') |
                   map('trim') | map('lower') | list) | length == 0
    fail_msg: Immich managed-user preference selection is invalid; values are redacted.
  when:
    - immich_managed_user_preference_profile_default is defined
    - immich_managed_user_preference_profile_by_email is defined
    - immich_managed_user_preference_overrides is defined
    - immich_managed_user_preference_profiles is defined
  no_log: true

- name: Validate Immich managed-user preference schema
  ansible.builtin.assert:
    that:
      - item.value is mapping
      - >-
        item.value.keys() | list |
        difference(['albums', 'avatar', 'cast', 'download', 'emailNotifications',
                    'folders', 'memories', 'people', 'purchase', 'ratings',
                    'recentlyAdded', 'sharedLinks', 'tags']) | length == 0
      - item.value.albums | default({}) is mapping
      - (item.value.albums | default({})).keys() | difference(['defaultAssetOrder']) | length == 0
      - (item.value.albums | default({})).defaultAssetOrder | default('desc') in ['asc', 'desc']
      - item.value.avatar | default({}) is mapping
      - (item.value.avatar | default({})).keys() | difference(['color']) | length == 0
      - (item.value.avatar | default({})).color | default('primary') is string
      - >-
        (item.value.avatar | default({})).color | default('primary') in
        ['primary', 'pink', 'red', 'yellow', 'blue', 'green', 'purple', 'orange',
         'gray', 'amber']
      - item.value.cast | default({}) is mapping
      - (item.value.cast | default({})).keys() | difference(['gCastEnabled']) | length == 0
      - (item.value.cast | default({})).gCastEnabled | default(false) is boolean
      - item.value.download | default({}) is mapping
      - >-
        (item.value.download | default({})).keys() |
        difference(['archiveSize', 'includeEmbeddedVideos']) | length == 0
      - (item.value.download | default({})).archiveSize | default(4294967296) is integer
      - (item.value.download | default({})).archiveSize | default(4294967296) | int > 0
      - (item.value.download | default({})).includeEmbeddedVideos | default(false) is boolean
      - item.value.emailNotifications | default({}) is mapping
      - >-
        (item.value.emailNotifications | default({})).keys() |
        difference(['enabled', 'albumInvite', 'albumUpdate']) | length == 0
      - (item.value.emailNotifications | default({})).enabled | default(false) is boolean
      - (item.value.emailNotifications | default({})).albumInvite | default(false) is boolean
      - (item.value.emailNotifications | default({})).albumUpdate | default(false) is boolean
      - item.value.folders | default({}) is mapping
      - (item.value.folders | default({})).keys() | difference(['enabled', 'sidebarWeb']) | length == 0
      - (item.value.folders | default({})).enabled | default(false) is boolean
      - (item.value.folders | default({})).sidebarWeb | default(false) is boolean
      - item.value.memories | default({}) is mapping
      - (item.value.memories | default({})).keys() | difference(['enabled', 'duration']) | length == 0
      - (item.value.memories | default({})).enabled | default(false) is boolean
      - (item.value.memories | default({})).duration | default(5) is integer
      - (item.value.memories | default({})).duration | default(5) | int > 0
      - item.value.people | default({}) is mapping
      - >-
        (item.value.people | default({})).keys() |
        difference(['enabled', 'sidebarWeb', 'minimumFaces']) | length == 0
      - (item.value.people | default({})).enabled | default(false) is boolean
      - (item.value.people | default({})).sidebarWeb | default(false) is boolean
      - (item.value.people | default({})).minimumFaces | default(3) is integer
      - (item.value.people | default({})).minimumFaces | default(3) | int > 0
      - item.value.purchase | default({}) is mapping
      - >-
        (item.value.purchase | default({})).keys() |
        difference(['showSupportBadge', 'hideBuyButtonUntil']) | length == 0
      - (item.value.purchase | default({})).showSupportBadge | default(false) is boolean
      - (item.value.purchase | default({})).hideBuyButtonUntil | default('') is string
      - item.value.ratings | default({}) is mapping
      - (item.value.ratings | default({})).keys() | difference(['enabled']) | length == 0
      - (item.value.ratings | default({})).enabled | default(false) is boolean
      - item.value.recentlyAdded | default({}) is mapping
      - (item.value.recentlyAdded | default({})).keys() | difference(['sidebarWeb']) | length == 0
      - (item.value.recentlyAdded | default({})).sidebarWeb | default(false) is boolean
      - item.value.sharedLinks | default({}) is mapping
      - (item.value.sharedLinks | default({})).keys() | difference(['enabled', 'sidebarWeb']) | length == 0
      - (item.value.sharedLinks | default({})).enabled | default(false) is boolean
      - (item.value.sharedLinks | default({})).sidebarWeb | default(false) is boolean
      - item.value.tags | default({}) is mapping
      - (item.value.tags | default({})).keys() | difference(['enabled', 'sidebarWeb']) | length == 0
      - (item.value.tags | default({})).enabled | default(false) is boolean
      - (item.value.tags | default({})).sidebarWeb | default(false) is boolean
    fail_msg: Immich managed-user preference fields are invalid; values are redacted.
  loop: >-
    {{ (immich_managed_user_preference_profiles | dict2items) +
       (immich_managed_user_preference_overrides | dict2items) }}
  loop_control:
    label: immich-managed-user-preference
  when:
    - immich_managed_user_preference_profiles is defined
    - immich_managed_user_preference_overrides is defined
  no_log: true

- name: Validate beszel managed-user entries
  ansible.builtin.assert:
    that:
      - item.keys() | list | sort == ['email', 'password', 'role', 'verified'] | sort
      - item.email is string
      - item.email is match('^[^@ ]+@[^@ ]+$')
      - item.password is string
      - item.password | length > 0
      - item.role is string
      - item.role in ['user', 'admin']
      - item.verified is boolean
      - item.verified == true
    fail_msg: beszel managed user has invalid field; values are redacted.
  loop: "{{ vault_managed_users.beszel }}"
  loop_control:
    label: beszel
  no_log: true

- name: Validate dozzle managed-user entries
  ansible.builtin.assert:
    that:
      - item.keys() | list | sort == ['username', 'password', 'password_hash', 'email', 'name', 'filter', 'roles'] | sort
      - item.username is string
      - item.username | trim | length > 0
      - item.password is string
      - item.password | length > 0
      - item.password_hash is string
      - item.password_hash is match('^\\$2[aby]\\$[0-9]{2}\\$[./A-Za-z0-9]{53}$')
      - item.email is string
      - item.email | length == 0 or item.email is match('^[^@ ]+@[^@ ]+$')
      - item.name is string
      - item.name | length > 0
      - item.filter is string
      - item.roles is string
      - item.roles in ['none', 'user', 'admin']
    fail_msg: dozzle managed user has invalid field; values are redacted.
  loop: "{{ vault_managed_users.dozzle }}"
  loop_control:
    label: dozzle
  no_log: true

- name: Validate immich managed-user entries
  ansible.builtin.assert:
    that:
      - item.keys() | list | sort == ['email', 'password', 'name', 'quota_size'] | sort
      - item.email is string
      - item.email is match('^[^@ ]+@[^@ ]+$')
      - item.password is string
      - item.password | length > 0
      - item.name is string
      - item.name | length > 0
      - item.quota_size is integer
      - item.quota_size | int >= 0
    fail_msg: immich managed user has invalid field; values are redacted.
  loop: "{{ vault_managed_users.immich }}"
  loop_control:
    label: immich
  no_log: true

- name: Validate jellyfin managed-user entries
  ansible.builtin.assert:
    that:
      - item.keys() | list | sort == ['username', 'password', 'policy'] | sort
      - item.username is string
      - item.username | trim | length > 0
      - item.password is string
      - item.password | length > 0
      - item.policy is mapping
      - item.policy.keys() | reject('string') | list | length == 0
      - item.policy | length > 0
      - item.policy.keys() | difference(supported_jellyfin_policy_fields) | length == 0
      - item.policy.values() | reject('boolean') | list | length == 0
      - item.policy.IsDisabled | default(false) | bool == false
      - >-
        item.policy.keys() | map('lower') |
        intersect(forbidden_jellyfin_policy_fields) | length == 0
    fail_msg: jellyfin managed user has invalid field; values are redacted.
  loop: "{{ vault_managed_users.jellyfin }}"
  loop_control:
    label: jellyfin
  vars:
    supported_jellyfin_policy_fields:
      - IsAdministrator
      - IsHidden
      - EnableCollectionManagement
      - EnableSubtitleManagement
      - EnableLyricManagement
      - IsDisabled
      - EnableUserPreferenceAccess
      - EnableRemoteControlOfOtherUsers
      - EnableSharedDeviceControl
      - EnableRemoteAccess
      - EnableLiveTvManagement
      - EnableLiveTvAccess
      - EnableMediaPlayback
      - EnableAudioPlaybackTranscoding
      - EnableVideoPlaybackTranscoding
      - EnablePlaybackRemuxing
      - ForceRemoteSourceTranscoding
      - EnableContentDeletion
      - EnableContentDownloading
      - EnableSyncTranscoding
      - EnableMediaConversion
      - EnableAllDevices
      - EnableAllChannels
      - EnableAllFolders
      - EnablePublicSharing
    forbidden_jellyfin_policy_fields:
      - password
      - passwordhash
      - password_hash
      - passwordconfirm
      - password_confirmation
      - token
      - access_token
      - secret
      - credential
      - api_key
      - apikey
  no_log: true

- name: Validate komga managed-user entries
  ansible.builtin.assert:
    that:
      - item.keys() | list | sort == ['email', 'password', 'roles'] | sort
      - item.email is string
      - item.email is match('^[^@ ]+@[^@ ]+$')
      - item.password is string
      - item.password | length > 0
      - item.roles | type_debug == 'list'
      - item.roles | reject('string') | list | length == 0
      - item.roles | length > 0
      - item.roles | difference(['ADMIN', 'FILE_DOWNLOAD', 'PAGE_STREAMING', 'KOBO_SYNC', 'KOREADER_SYNC']) | length == 0
      - item.roles | unique | length == item.roles | length
    fail_msg: komga managed user has invalid field; values are redacted.
  loop: "{{ vault_managed_users.komga }}"
  loop_control:
    label: komga
  no_log: true

- name: Validate ntfy managed-user entries
  ansible.builtin.assert:
    that:
      - item.keys() | list | sort == ['username', 'password', 'password_hash', 'role', 'access', 'tokens'] | sort
      - item.username is string
      - item.username is match('^[-_.+@A-Za-z0-9]+$')
      - item.password is string
      - item.password | length > 0
      - item.password_hash is string
      - item.password_hash is match('^\\$2[aby]\\$[0-9]{2}\\$[./A-Za-z0-9]{53}$')
      - item.role is string
      - item.role == 'user'
      - item.access | type_debug == 'list'
      - item.tokens | type_debug == 'list'
      - item.tokens | reject('string') | list | length == 0
      - item.tokens | select('match', '^tk_[a-z0-9]{29}$') | list | length == item.tokens | length
      - item.tokens | unique | length == item.tokens | length
    fail_msg: ntfy managed user has invalid field; values are redacted.
  loop: "{{ vault_managed_users.ntfy }}"
  loop_control:
    label: ntfy
  no_log: true

- name: Validate ntfy managed-user access entries
  ansible.builtin.assert:
    that:
      - item.1.keys() | list | sort == ['topic', 'permission'] | sort
      - item.1.topic is string
      - item.1.topic is match('^[-_A-Za-z0-9]{1,64}$')
      - item.1.permission is string
      - item.1.permission in ['read-only', 'write-only', 'read-write', 'deny']
    fail_msg: ntfy managed user has invalid access field; values are redacted.
  loop: "{{ vault_managed_users.ntfy | subelements('access') }}"
  loop_control:
    label: ntfy
  no_log: true

- name: Validate global ntfy managed-user token ownership
  ansible.builtin.assert:
    that:
      - >-
        vault_contract_managed_ntfy_tokens | unique | length ==
        vault_contract_managed_ntfy_tokens | length
      - >-
        vault_contract_managed_ntfy_tokens |
        intersect([vault_ntfy_dozzle_token, vault_ntfy_beszel_token]) | length == 0
    fail_msg: ntfy managed user has invalid token ownership; values are redacted.
  vars:
    vault_contract_managed_ntfy_tokens: >-
      {{ vault_managed_users.ntfy | map(attribute='tokens') | list | flatten }}
  no_log: true

- name: Validate paperless_ngx managed-user entries
  ansible.builtin.assert:
    that:
      - item.keys() | list | sort == ['username', 'password', 'email', 'is_active', 'is_staff', 'is_superuser', 'groups'] | sort
      - item.username is string
      - item.username | trim | length > 0
      - item.password is string
      - item.password | length > 0
      - item.email is string
      - item.email is match('^[^@ ]+@[^@ ]+$')
      - item.is_active is boolean
      - item.is_active | bool
      - item.is_staff is boolean
      - item.is_superuser is boolean
      - item.groups | type_debug == 'list'
      - item.groups | reject('string') | list | length == 0
      - item.groups | reject('match', '.+') | list | length == 0
      - item.groups | unique | length == item.groups | length
    fail_msg: paperless_ngx managed user has invalid field; values are redacted.
  loop: "{{ vault_managed_users.paperless_ngx }}"
  loop_control:
    label: paperless_ngx
  no_log: true

- name: Validate managed-user identity uniqueness and separation
  ansible.builtin.assert:
    that:
      - >-
        vault_managed_users.audiobookshelf | map(attribute='username') |
        map('trim') | map('lower') | list | unique | length ==
        vault_managed_users.audiobookshelf | length
      - vault_managed_users.beszel | map(attribute='email') | map('trim') | map('lower') | list | unique | length == vault_managed_users.beszel | length
      - vault_managed_users.dozzle | map(attribute='username') | map('trim') | map('lower') | list | unique | length == vault_managed_users.dozzle | length
      - vault_managed_users.immich | map(attribute='email') | map('trim') | map('lower') | list | unique | length == vault_managed_users.immich | length
      - vault_managed_users.jellyfin | map(attribute='username') | map('trim') | map('lower') | list | unique | length == vault_managed_users.jellyfin | length
      - vault_managed_users.komga | map(attribute='email') | map('trim') | map('lower') | list | unique | length == vault_managed_users.komga | length
      - vault_managed_users.ntfy | map(attribute='username') | map('trim') | map('lower') | list | unique | length == vault_managed_users.ntfy | length
      - >-
        vault_managed_users.paperless_ngx | map(attribute='username') |
        map('trim') | map('lower') | list | unique | length ==
        vault_managed_users.paperless_ngx | length
      - >-
        vault_audiobookshelf_admin_username | trim | lower not in
        vault_managed_users.audiobookshelf | map(attribute='username') |
        map('trim') | map('lower') | list
      - vault_beszel_superuser_email | trim | lower not in vault_managed_users.beszel | map(attribute='email') | map('trim') | map('lower') | list
      - vault_beszel_app_user_email | trim | lower not in vault_managed_users.beszel | map(attribute='email') | map('trim') | map('lower') | list
      - vault_dozzle_admin_username | trim | lower not in vault_managed_users.dozzle | map(attribute='username') | map('trim') | map('lower') | list
      - vault_immich_admin_email | trim | lower not in vault_managed_users.immich | map(attribute='email') | map('trim') | map('lower') | list
      - vault_jellyfin_admin_username | trim | lower not in vault_managed_users.jellyfin | map(attribute='username') | map('trim') | map('lower') | list
      - vault_komga_admin_email | trim | lower not in vault_managed_users.komga | map(attribute='email') | map('trim') | map('lower') | list
      - vault_ntfy_admin_user | trim | lower not in vault_managed_users.ntfy | map(attribute='username') | map('trim') | map('lower') | list
      - "'dozzle' not in vault_managed_users.ntfy | map(attribute='username') | map('trim') | map('lower') | list"
      - "'beszel' not in vault_managed_users.ntfy | map(attribute='username') | map('trim') | map('lower') | list"
      - vault_paperless_admin_username | trim | lower not in vault_managed_users.paperless_ngx | map(attribute='username') | map('trim') | map('lower') | list
    fail_msg: Managed-user identity separation is invalid; values are redacted.
  no_log: true

- name: Resolve validated managed-user service lists
  ansible.builtin.set_fact:
    vault_managed_audiobookshelf_users: "{{ vault_managed_users.audiobookshelf }}"
    vault_managed_beszel_users: "{{ vault_managed_users.beszel }}"
    vault_managed_dozzle_users: "{{ vault_managed_users.dozzle }}"
    vault_managed_immich_users: "{{ vault_managed_users.immich }}"
    vault_managed_jellyfin_users: "{{ vault_managed_users.jellyfin }}"
    vault_managed_komga_users: "{{ vault_managed_users.komga }}"
    vault_managed_ntfy_users: "{{ vault_managed_users.ntfy }}"
    vault_managed_paperless_ngx_users: "{{ vault_managed_users.paperless_ngx }}"
  no_log: true

- name: Validate credential shapes without disclosing credential material
  ansible.builtin.assert:
    that:
      - vault_audiobookshelf_admin_username | length > 0
      - vault_audiobookshelf_admin_password | length > 0
      - vault_dozzle_admin_username | length > 0
      - vault_dozzle_admin_password | length > 0
      - vault_dozzle_admin_password_hash is match('^\\$2[aby]\\$[0-9]{2}\\$[./A-Za-z0-9]{53}$')
      - vault_immich_admin_email is match('^[^@ ]+@[^@ ]+$')
      - vault_immich_admin_password | length > 0
      - vault_immich_db_name is match('^[A-Za-z_][A-Za-z0-9_-]*$')
      - vault_immich_db_username is match('^[A-Za-z_][A-Za-z0-9_-]*$')
      - vault_immich_db_password | length > 0
      - vault_jellyfin_admin_username == 'Yonatan'
      - vault_jellyfin_admin_password | length > 0
      - vault_jellyfin_opensubtitles_username | length > 0
      - vault_jellyfin_opensubtitles_username != 'example-opensubtitles-username'
      - vault_jellyfin_opensubtitles_username != 'replace-with-opensubtitles-username'
      - vault_jellyfin_opensubtitles_password | length > 0
      - vault_jellyfin_opensubtitles_password != 'example-opensubtitles-password'
      - vault_jellyfin_opensubtitles_password != 'replace-with-opensubtitles-password'
      - vault_komga_admin_email is match('^[^@ ]+@[^@ ]+$')
      - vault_komga_admin_password | length > 0
      - vault_ntfy_admin_user | length > 0
      - vault_ntfy_admin_password | length > 0
      - vault_ntfy_admin_password_hash is match('^\\$2[aby]\\$[0-9]{2}\\$[./A-Za-z0-9]{53}$')
      - vault_ntfy_dozzle_password_hash is match('^\\$2[aby]\\$[0-9]{2}\\$[./A-Za-z0-9]{53}$')
      - vault_ntfy_beszel_password_hash is match('^\\$2[aby]\\$[0-9]{2}\\$[./A-Za-z0-9]{53}$')
      - vault_ntfy_dozzle_token is match('^tk_[a-z0-9]{29}$')
      - vault_ntfy_beszel_token is match('^tk_[a-z0-9]{29}$')
      - vault_ntfy_dozzle_token != vault_ntfy_beszel_token
      - vault_beszel_superuser_email is match('^[^@ ]+@[^@ ]+$')
      - vault_beszel_superuser_password | length > 0
      - vault_beszel_app_user_email is match('^[^@ ]+@[^@ ]+$')
      - vault_beszel_app_user_password | length > 0
      - vault_beszel_agent_key is match('^ssh-ed25519 [A-Za-z0-9+/]+={0,3}$')
      - vault_beszel_universal_token is match('^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$')
      - vault_beszel_hub_private_key is search('BEGIN OPENSSH PRIVATE KEY')
      - vault_paperless_admin_username | length > 0
      - vault_paperless_admin_password | length > 0
      - vault_paperless_admin_email is match('^[^@ ]+@[^@ ]+$')
      - vault_paperless_db_name is match('^[A-Za-z_][A-Za-z0-9_-]*$')
      - vault_paperless_db_username is match('^[A-Za-z_][A-Za-z0-9_-]*$')
      - vault_paperless_db_password | length > 0
      - vault_paperless_django_secret_key | length > 0
      - vault_paperless_gmail_account is match('^[^@ ]+@[^@ ]+$')
      - vault_paperless_gmail_app_password | length > 0
      - vault_paperless_mail_account_name | length > 0
      - vault_paperless_mail_rule_name | length > 0
      - vault_tinymediamanager_password | length > 0
    fail_msg: Portable vault credentials are missing or malformed; values are redacted.
    success_msg: Portable vault credential shapes are valid; values are redacted.
  no_log: true

- name: Inspect the candidate vault artifact without hashing
  ansible.builtin.stat:
    path: "{{ platform_vault_file }}"
    get_checksum: false
  delegate_to: localhost
  become: false
  register: vault_contract_candidate_file
  when: platform_vault_file is defined
  no_log: true

- name: Read only the encrypted vault format header
  ansible.builtin.command:
    argv:
      - head
      - -c
      - "15"
      - "{{ platform_vault_file }}"
  delegate_to: localhost
  become: false
  register: vault_contract_encrypted_header
  changed_when: false
  check_mode: false
  when: platform_vault_file is defined
  no_log: true

- name: Require the reported vault artifact to be encrypted
  ansible.builtin.assert:
    that:
      - vault_contract_candidate_file.stat.isreg | default(false)
      - vault_contract_encrypted_header.stdout | default('') is match('^\\$ANSIBLE_VAULT;')
    fail_msg: The encrypted vault file is unavailable; no credential values were read.
    success_msg: The vault artifact is encrypted and may be identified by SHA-256.
  when: platform_vault_file is defined
  no_log: true

- name: Compute the encrypted vault artifact SHA-256
  ansible.builtin.stat:
    path: "{{ platform_vault_file }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: vault_contract_encrypted_file
  when: platform_vault_file is defined
  no_log: true

- name: Require an encrypted vault artifact SHA-256
  ansible.builtin.assert:
    that:
      - vault_contract_encrypted_file.stat.checksum | default('') | length == 64
    fail_msg: The encrypted vault artifact could not be identified by SHA-256.
    success_msg: The encrypted vault artifact has a SHA-256 identifier.
  when: platform_vault_file is defined
  no_log: true

- name: Record only the encrypted vault artifact SHA-256
  ansible.builtin.set_fact:
    platform_encrypted_vault_sha256: "{{ vault_contract_encrypted_file.stat.checksum }}"  # noqa var-naming[no-role-prefix]
  when: platform_vault_file is defined
  no_log: true
