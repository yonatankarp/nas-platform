---
- name: Resolve managed-user vault schema violations
  ansible.builtin.set_fact:
    vault_contract_schema_errors: >-
      {{ vault_managed_users |
         vault_managed_user_errors([vault_ntfy_dozzle_token, vault_ntfy_beszel_token,
                                    vault_ntfy_deploy_token, vault_ntfy_seerr_token],
                                   vault_contract_reserved_identities) }}
  vars:
    # The administrator of each service, plus the usernames the platform
    # publishes under. A managed user claiming one of these would take over an
    # account the platform reconciles from a different source.
    vault_contract_reserved_identities:
      audiobookshelf: ["{{ vault_audiobookshelf_admin_username }}"]
      beszel: ["{{ vault_beszel_superuser_email }}", "{{ vault_beszel_app_user_email }}"]
      dozzle: ["{{ vault_dozzle_admin_username }}"]
      immich: ["{{ vault_immich_admin_email }}"]
      jellyfin: ["{{ vault_jellyfin_admin_username }}"]
      komga: ["{{ vault_komga_admin_email }}"]
      ntfy: ["{{ vault_ntfy_admin_user }}", dozzle, beszel, deploy, seerr]
      paperless_ngx: ["{{ vault_paperless_admin_username }}"]
  no_log: true

# no_log does not suppress fail_msg, and the filter emits field paths with no
# values, so this names the offending field instead of reporting that something
# in a 26-condition assert was wrong.
- name: Require a valid managed-user vault schema
  ansible.builtin.assert:
    that:
      - vault_contract_schema_errors | length == 0
    fail_msg: >-
      Managed-user vault schema is invalid. Offending fields, values not shown:
      {{ vault_contract_schema_errors | join('; ') }}
  no_log: true

- name: Resolve Immich managed-user preference violations
  ansible.builtin.set_fact:
    vault_contract_immich_preference_errors: >-
      {{ immich_managed_user_preference_profiles |
         immich_preference_errors(immich_managed_user_preference_overrides,
                                  immich_managed_user_preference_profile_by_email,
                                  immich_managed_user_preference_profile_default,
                                  vault_managed_users.immich |
                                  map(attribute='email') | list) }}
  when:
    - immich_managed_user_preference_profile_default is defined
    - immich_managed_user_preference_profile_by_email is defined
    - immich_managed_user_preference_overrides is defined
    - immich_managed_user_preference_profiles is defined
  no_log: true

# The preference collections are keyed by managed-user email and their profile
# names come from the vault, so the filter reports a key's position rather than
# its text. That keeps this message printable while naming the failing field.
- name: Require a valid Immich managed-user preference schema
  ansible.builtin.assert:
    that:
      - vault_contract_immich_preference_errors | length == 0
    fail_msg: >-
      Immich managed-user preferences are invalid. Offending fields, values and
      keys not shown: {{ vault_contract_immich_preference_errors | join('; ') }}
  when:
    - immich_managed_user_preference_profile_default is defined
    - immich_managed_user_preference_profile_by_email is defined
    - immich_managed_user_preference_overrides is defined
    - immich_managed_user_preference_profiles is defined
  no_log: true

- name: Resolve validated managed-user service lists
  ansible.builtin.set_fact:
    vault_managed_audiobookshelf_users: "{{ vault_managed_users.audiobookshelf }}"
    vault_managed_beszel_users: "{{ vault_managed_users.beszel }}"
    vault_managed_dozzle_users: "{{ vault_managed_users.dozzle }}"
    vault_managed_immich_users: "{{ vault_managed_users.immich }}"
    vault_managed_jellyfin_users: "{{ vault_managed_users.jellyfin }}"
    vault_managed_komga_users: "{{ vault_managed_users.komga }}"
    vault_managed_ntfy_users: "{{ vault_managed_users.ntfy }}"
    vault_managed_paperless_ngx_users: "{{ vault_managed_users.paperless_ngx }}"
  no_log: true

# The mapping states the key set being validated: the filter rejects a candidate
# whose keys differ from its rule table, so dropping a credential here is an
# error rather than a silently skipped rule. It is also what
# tests/policy_vault_test.rb reads to prove every portable credential is
# inspected.
- name: Resolve portable vault credential shape violations
  ansible.builtin.set_fact:
    vault_contract_credential_errors: >-
      {{ {'vault_audiobookshelf_admin_username': vault_audiobookshelf_admin_username,
          'vault_audiobookshelf_admin_password': vault_audiobookshelf_admin_password,
          'vault_dozzle_admin_username': vault_dozzle_admin_username,
          'vault_dozzle_admin_password': vault_dozzle_admin_password,
          'vault_dozzle_admin_password_hash': vault_dozzle_admin_password_hash,
          'vault_immich_admin_email': vault_immich_admin_email,
          'vault_immich_admin_password': vault_immich_admin_password,
          'vault_immich_db_name': vault_immich_db_name,
          'vault_immich_db_username': vault_immich_db_username,
          'vault_immich_db_password': vault_immich_db_password,
          'vault_jellyfin_admin_username': vault_jellyfin_admin_username,
          'vault_jellyfin_admin_password': vault_jellyfin_admin_password,
          'vault_jellyfin_opensubtitles_username': vault_jellyfin_opensubtitles_username,
          'vault_jellyfin_opensubtitles_password': vault_jellyfin_opensubtitles_password,
          'vault_komga_admin_email': vault_komga_admin_email,
          'vault_komga_admin_password': vault_komga_admin_password,
          'vault_arr_radarr_api_key': vault_arr_radarr_api_key,
          'vault_arr_radarr_admin_username': vault_arr_radarr_admin_username,
          'vault_arr_radarr_admin_password': vault_arr_radarr_admin_password,
          'vault_arr_sonarr_api_key': vault_arr_sonarr_api_key,
          'vault_arr_sonarr_admin_username': vault_arr_sonarr_admin_username,
          'vault_arr_sonarr_admin_password': vault_arr_sonarr_admin_password,
          'vault_arr_prowlarr_api_key': vault_arr_prowlarr_api_key,
          'vault_arr_prowlarr_admin_username': vault_arr_prowlarr_admin_username,
          'vault_arr_prowlarr_admin_password': vault_arr_prowlarr_admin_password,
          'vault_arr_bazarr_api_key': vault_arr_bazarr_api_key,
          'vault_arr_bazarr_admin_username': vault_arr_bazarr_admin_username,
          'vault_arr_bazarr_admin_password': vault_arr_bazarr_admin_password,
          'vault_downloaders_sabnzbd_api_key': vault_downloaders_sabnzbd_api_key,
          'vault_downloaders_sabnzbd_admin_username': vault_downloaders_sabnzbd_admin_username,
          'vault_downloaders_sabnzbd_admin_password': vault_downloaders_sabnzbd_admin_password,
          'vault_downloaders_sabnzbd_server_username': vault_downloaders_sabnzbd_server_username,
          'vault_downloaders_sabnzbd_server_password': vault_downloaders_sabnzbd_server_password,
          'vault_bindery_api_key': vault_bindery_api_key,
          'vault_bindery_admin_username': vault_bindery_admin_username,
          'vault_bindery_admin_password': vault_bindery_admin_password,
          'vault_kapowarr_admin_username': vault_kapowarr_admin_username,
          'vault_kapowarr_admin_password': vault_kapowarr_admin_password,
          'vault_kapowarr_comicvine_api_key': vault_kapowarr_comicvine_api_key,
          'vault_pinchflat_admin_username': vault_pinchflat_admin_username,
          'vault_pinchflat_admin_password': vault_pinchflat_admin_password,
          'vault_trailarr_api_key': vault_trailarr_api_key,
          'vault_trailarr_admin_username': vault_trailarr_admin_username,
          'vault_trailarr_admin_password': vault_trailarr_admin_password,
          'vault_trailarr_admin_password_hash': vault_trailarr_admin_password_hash,
          'vault_seerr_api_key': vault_seerr_api_key,
          'vault_ntfy_admin_user': vault_ntfy_admin_user,
          'vault_ntfy_admin_password': vault_ntfy_admin_password,
          'vault_ntfy_admin_password_hash': vault_ntfy_admin_password_hash,
          'vault_ntfy_dozzle_password_hash': vault_ntfy_dozzle_password_hash,
          'vault_ntfy_beszel_password_hash': vault_ntfy_beszel_password_hash,
          'vault_ntfy_deploy_password_hash': vault_ntfy_deploy_password_hash,
          'vault_ntfy_dozzle_token': vault_ntfy_dozzle_token,
          'vault_ntfy_beszel_token': vault_ntfy_beszel_token,
          'vault_ntfy_deploy_token': vault_ntfy_deploy_token,
          'vault_ntfy_seerr_password_hash': vault_ntfy_seerr_password_hash,
          'vault_ntfy_seerr_token': vault_ntfy_seerr_token,
          'vault_beszel_superuser_email': vault_beszel_superuser_email,
          'vault_beszel_superuser_password': vault_beszel_superuser_password,
          'vault_beszel_app_user_email': vault_beszel_app_user_email,
          'vault_beszel_app_user_password': vault_beszel_app_user_password,
          'vault_beszel_agent_key': vault_beszel_agent_key,
          'vault_beszel_universal_token': vault_beszel_universal_token,
          'vault_beszel_hub_private_key': vault_beszel_hub_private_key,
          'vault_paperless_admin_username': vault_paperless_admin_username,
          'vault_paperless_admin_password': vault_paperless_admin_password,
          'vault_paperless_admin_email': vault_paperless_admin_email,
          'vault_paperless_db_name': vault_paperless_db_name,
          'vault_paperless_db_username': vault_paperless_db_username,
          'vault_paperless_db_password': vault_paperless_db_password,
          'vault_paperless_django_secret_key': vault_paperless_django_secret_key,
          'vault_paperless_gmail_account': vault_paperless_gmail_account,
          'vault_paperless_gmail_app_password': vault_paperless_gmail_app_password}
         | vault_credential_errors }}
  no_log: true

# The filter emits variable names with no values, so this names the credential
# that is wrong instead of reporting that one of 49 conditions failed on a task
# whose result dict no_log censors.
- name: Validate credential shapes without disclosing credential material
  ansible.builtin.assert:
    that:
      - vault_contract_credential_errors | length == 0
    fail_msg: >-
      Portable vault credentials are missing or malformed. Offending keys, values
      not shown: {{ vault_contract_credential_errors | join('; ') }}
    success_msg: Portable vault credential shapes are valid; values are redacted.
  no_log: true

- name: Inspect the candidate vault artifact without hashing
  ansible.builtin.stat:
    path: "{{ platform_vault_file }}"
    get_checksum: false
  delegate_to: localhost
  become: false
  register: vault_contract_candidate_file
  when: platform_vault_file is defined
  no_log: true

- name: Read only the encrypted vault format header
  ansible.builtin.command:
    argv:
      - head
      - -c
      - "15"
      - "{{ platform_vault_file }}"
  delegate_to: localhost
  become: false
  register: vault_contract_encrypted_header
  changed_when: false
  check_mode: false
  when: platform_vault_file is defined
  no_log: true

- name: Require the reported vault artifact to be encrypted
  ansible.builtin.assert:
    that:
      - vault_contract_candidate_file.stat.isreg | default(false)
      - vault_contract_encrypted_header.stdout | default('') is match('^\\$ANSIBLE_VAULT;')
    fail_msg: The encrypted vault file is unavailable; no credential values were read.
    success_msg: The vault artifact is encrypted and may be identified by SHA-256.
  when: platform_vault_file is defined
  no_log: true

- name: Compute the encrypted vault artifact SHA-256
  ansible.builtin.stat:
    path: "{{ platform_vault_file }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: vault_contract_encrypted_file
  when: platform_vault_file is defined
  no_log: true

- name: Require an encrypted vault artifact SHA-256
  ansible.builtin.assert:
    that:
      - vault_contract_encrypted_file.stat.checksum | default('') | length == 64
    fail_msg: The encrypted vault artifact could not be identified by SHA-256.
    success_msg: The encrypted vault artifact has a SHA-256 identifier.
  when: platform_vault_file is defined
  no_log: true

- name: Record only the encrypted vault artifact SHA-256
  ansible.builtin.set_fact:
    platform_encrypted_vault_sha256: "{{ vault_contract_encrypted_file.stat.checksum }}"  # noqa var-naming[no-role-prefix]
  when: platform_vault_file is defined
  no_log: true
