---
argument_specs:
  main:
    short_description: Validate the portable credential contract without disclosure
    options:
      vault_audiobookshelf_admin_username: {type: str, required: true}
      vault_audiobookshelf_admin_password: {type: str, required: true}
      vault_beszel_superuser_email: {type: str, required: true}
      vault_beszel_superuser_password: {type: str, required: true}
      vault_beszel_app_user_email: {type: str, required: true}
      vault_beszel_app_user_password: {type: str, required: true}
      vault_beszel_agent_key: {type: str, required: true}
      vault_beszel_universal_token: {type: str, required: true}
      vault_beszel_hub_private_key: {type: str, required: true}
      vault_dozzle_admin_username: {type: str, required: true}
      vault_dozzle_admin_password: {type: str, required: true}
      vault_dozzle_admin_password_hash: {type: str, required: true}
      vault_immich_admin_email: {type: str, required: true}
      vault_immich_admin_password: {type: str, required: true}
      vault_immich_db_name: {type: str, required: true}
      vault_immich_db_username: {type: str, required: true}
      vault_immich_db_password: {type: str, required: true}
      vault_jellyfin_admin_username: {type: str, required: true}
      vault_jellyfin_admin_password: {type: str, required: true}
      vault_jellyfin_opensubtitles_username: {type: str, required: true}
      vault_jellyfin_opensubtitles_password: {type: str, required: true}
      vault_komga_admin_email: {type: str, required: true}
      vault_komga_admin_password: {type: str, required: true}
      vault_arr_radarr_api_key: {type: str, required: true}
      vault_arr_radarr_admin_username: {type: str, required: true}
      vault_arr_radarr_admin_password: {type: str, required: true}
      vault_arr_sonarr_api_key: {type: str, required: true}
      vault_arr_sonarr_admin_username: {type: str, required: true}
      vault_arr_sonarr_admin_password: {type: str, required: true}
      vault_arr_prowlarr_api_key: {type: str, required: true}
      vault_arr_prowlarr_admin_username: {type: str, required: true}
      vault_arr_prowlarr_admin_password: {type: str, required: true}
      vault_arr_bazarr_api_key: {type: str, required: true}
      vault_arr_bazarr_admin_username: {type: str, required: true}
      vault_arr_bazarr_admin_password: {type: str, required: true}
      vault_downloaders_sabnzbd_api_key: {type: str, required: true}
      vault_downloaders_sabnzbd_admin_username: {type: str, required: true}
      vault_downloaders_sabnzbd_admin_password: {type: str, required: true}
      vault_downloaders_sabnzbd_server_host: {type: str, required: true}
      vault_downloaders_sabnzbd_server_port: {type: str, required: true}
      vault_downloaders_sabnzbd_server_username: {type: str, required: true}
      vault_downloaders_sabnzbd_server_password: {type: str, required: true}
      vault_downloaders_sabnzbd_server_connections: {type: str, required: true}
      vault_downloaders_sabnzbd_server_ssl: {type: str, required: true}
      vault_bindery_api_key: {type: str, required: true}
      vault_bindery_admin_username: {type: str, required: true}
      vault_bindery_admin_password: {type: str, required: true}
      vault_kapowarr_admin_username: {type: str, required: true}
      vault_kapowarr_admin_password: {type: str, required: true}
      vault_kapowarr_comicvine_api_key: {type: str, required: true}
      vault_pinchflat_admin_username: {type: str, required: true}
      vault_pinchflat_admin_password: {type: str, required: true}
      vault_trailarr_api_key: {type: str, required: true}
      vault_trailarr_admin_username: {type: str, required: true}
      vault_trailarr_admin_password: {type: str, required: true}
      vault_trailarr_admin_password_hash: {type: str, required: true}
      vault_seerr_api_key: {type: str, required: true}
      vault_ntfy_admin_user: {type: str, required: true}
      vault_ntfy_admin_password: {type: str, required: true}
      vault_ntfy_admin_password_hash: {type: str, required: true}
      vault_ntfy_dozzle_password_hash: {type: str, required: true}
      vault_ntfy_dozzle_token: {type: str, required: true}
      vault_ntfy_beszel_password_hash: {type: str, required: true}
      vault_ntfy_beszel_token: {type: str, required: true}
      vault_ntfy_deploy_password_hash: {type: str, required: true}
      vault_ntfy_deploy_token: {type: str, required: true}
      vault_ntfy_seerr_password_hash: {type: str, required: true}
      vault_ntfy_seerr_token: {type: str, required: true}
      vault_paperless_admin_username: {type: str, required: true}
      vault_paperless_admin_password: {type: str, required: true}
      vault_paperless_admin_email: {type: str, required: true}
      vault_paperless_db_name: {type: str, required: true}
      vault_paperless_db_username: {type: str, required: true}
      vault_paperless_db_password: {type: str, required: true}
      vault_paperless_django_secret_key: {type: str, required: true}
      vault_paperless_gmail_account: {type: str, required: true}
      vault_paperless_gmail_app_password: {type: str, required: true}
      vault_paperless_mail_account_name: {type: str, required: true}
      vault_paperless_mail_rule_name: {type: str, required: true}
      vault_managed_users:
        type: dict
        required: true
        description: Service-specific managed application-user allowlists.
        options:
          audiobookshelf:
            type: list
            elements: dict
            required: true
            options:
              username: {type: str, required: true}
              password: {type: str, required: true}
              type: {type: str, required: true}
              is_active: {type: bool, choices: [true], required: true}
              permissions:
                type: dict
                required: true
                options:
                  flags: {type: dict, required: true}
                  librariesAccessible: {type: list, elements: str, required: true}
                  itemTagsSelected: {type: list, elements: str, required: true}
          beszel:
            type: list
            elements: dict
            required: true
            options:
              email: {type: str, required: true}
              password: {type: str, required: true}
              role: {type: str, required: true}
              verified: {type: bool, choices: [true], required: true}
          dozzle:
            type: list
            elements: dict
            required: true
            options:
              username: {type: str, required: true}
              password: {type: str, required: true}
              password_hash: {type: str, required: true}
              email: {type: str, required: true}
              name: {type: str, required: true}
              filter: {type: str, required: true}
              roles: {type: str, required: true}
          immich:
            type: list
            elements: dict
            required: true
            options:
              email: {type: str, required: true}
              password: {type: str, required: true}
              name: {type: str, required: true}
              quota_size: {type: int, required: true}
          jellyfin:
            type: list
            elements: dict
            required: true
            options:
              username: {type: str, required: true}
              password: {type: str, required: true}
              policy: {type: dict, required: true}
          komga:
            type: list
            elements: dict
            required: true
            options:
              email: {type: str, required: true}
              password: {type: str, required: true}
              roles: {type: list, elements: str, required: true}
          ntfy:
            type: list
            elements: dict
            required: true
            options:
              username: {type: str, required: true}
              password: {type: str, required: true}
              password_hash: {type: str, required: true}
              role: {type: str, required: true, choices: [user]}
              access:
                type: list
                elements: dict
                required: true
                options:
                  topic: {type: str, required: true}
                  permission: {type: str, required: true}
              tokens: {type: list, elements: str, required: true}
          paperless_ngx:
            type: list
            elements: dict
            required: true
            options:
              username: {type: str, required: true}
              password: {type: str, required: true}
              email: {type: str, required: true}
              is_active: {type: bool, required: true}
              is_staff: {type: bool, required: true}
              is_superuser: {type: bool, required: true}
              groups: {type: list, elements: str, required: true}
      platform_vault_file:
        type: path
        required: false
        description: Optional encrypted vault file whose SHA-256 identifies a run.
