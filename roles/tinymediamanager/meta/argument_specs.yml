    short_description: Retire tinyMediaManager while preserving bind-mounted state
    options:
      platform_compose_kind:
        type: str
        required: true
      platform_project_name:
        type: str
        required: false
      tinymediamanager_container_name:
        type: str
        required: false
      tinymediamanager_web_port:
        type: int
        required: false
      tinymediamanager_api_port:
        type: int
        required: false
      vault_tinymediamanager_password:
        type: str
        required: true
