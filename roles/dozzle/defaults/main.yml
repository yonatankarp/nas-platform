---
dozzle_port: 8080
dozzle_api: "http://127.0.0.1:{{ dozzle_port }}/api"
# dozzle_alert_relay_port lives in inventory/group_vars/all/service_dozzle.yml,
# not here: Beszel converges before Dozzle and has to reach the same relay.
dozzle_compose_project_name: >-
  {{ (platform_project_name ~ '-dozzle')
     if platform_project_name | default('') | length > 0 else 'dozzle' }}

# Tailscale client for the relay's tailnet TCP forward; same list and reasoning as
# vaultwarden_tailscale_binary_candidates. Lanes empty it (tests/mac/lib.sh).
dozzle_tailscale_binary_candidates:
  - /usr/local/bin/tailscale
  - /usr/local/AppCentral/tailscale-native/bin/tailscale
  - /usr/bin/tailscale
dozzle_tailscale_binary: ""

# Redirectable so lanes never push to real devices: the deployed relay POSTs
# on every container event. Every lane overrides it.
dozzle_pushover_api_url: https://api.pushover.net/1/messages.json

# Tap-through link base; tests/dozzle_alert_relay_test.py holds it to the
# relay's validator.
dozzle_alert_relay_link_base: "http://{{ platform_public_host }}:{{ dozzle_port }}"

# Daily ceilings, per container and global: every health rule has cooldown: 0,
# and Pushover allows 10,000 messages a month. OOM gets a higher allowance
# rather than an exemption. Counted per UTC day; a trip sends one notice.
dozzle_alert_daily_container_ceiling: 10
dozzle_alert_daily_oom_container_ceiling: 25
dozzle_alert_daily_global_ceiling: 200

dozzle_dispatcher:
  # The name is a selector, not a label: reconciliation matches on it, so a
  # rename orphans the old dispatcher (with its token) and creates a second.
  # Renaming is a migration of its own (#558).
  name: ntfy nas-critical
  type: webhook
  url: "http://alert-relay:{{ dozzle_alert_relay_port }}/alerts"
  # `.UTC` is load-bearing: the relay accepts only the `Z` spelling, and Dozzle
  # v11.1.0 renders local time under TZ, so every alert was dropped (#699).
  template: >-
    {{ {'version': 1,
        'rule': '{{ .Subscription.Name }}',
        'containerId': '{{ .Container.ID }}',
        'container': '{{ .Container.Name }}',
        'host': '{{ .Container.HostName }}',
        'event': '{{ .Event.Name }}',
        'healthStatus': '{{ index .Event.Attributes `healthStatus` }}',
        'exitCode': '{{ index .Event.Attributes `exitCode` }}',
        'timestamp': '{{ .Event.Timestamp.UTC.Format `2006-01-02T15:04:05.999999999Z07:00` }}'}
       | to_json(separators=(',', ':')) }}
  # Not the Pushover token: Dozzle stores this header and returns it in
  # cleartext, so it authorizes only a POST to the relay (#172).
  headers:
    Authorization: "Bearer {{ vault_dozzle_alert_relay_token }}"

dozzle_alerts:
  - name: OOM
    enabled: true
    containerExpression: "true"
    logExpression: ""
    eventExpression: 'name == "oom"'
    cooldown: 300
  - name: Unexpected exit
    enabled: true
    containerExpression: "true"
    logExpression: ""
    eventExpression: 'name == "die" && !(attributes["exitCode"] in ["0", "130", "143"])'
    cooldown: 300
  - name: Unhealthy
    enabled: true
    containerExpression: "true"
    logExpression: ""
    eventExpression: 'name == "health_status" && attributes["healthStatus"] == "unhealthy"'
    cooldown: 0
  - name: Recovery
    enabled: true
    containerExpression: "true"
    logExpression: ""
    eventExpression: 'name == "health_status" && attributes["healthStatus"] == "healthy"'
    cooldown: 0
