---
argument_specs:
  main:
    short_description: Deploy Dozzle and converge its Pushover event alerts through the pinned REST API
    options:
      platform_compose_kind:
        type: str
        required: true
      platform_project_name:
        type: str
        required: false
      platform_callback_host:
        type: str
        required: true
      dozzle_port:
        type: int
        required: false
      dozzle_alert_relay_port:
        type: int
        required: false
      dozzle_pushover_api_url:
        type: str
        required: false
      dozzle_alert_daily_container_ceiling:
        type: int
        required: false
      dozzle_alert_daily_oom_container_ceiling:
        type: int
        required: false
      dozzle_alert_daily_global_ceiling:
        type: int
        required: false
      dozzle_alerts:
        type: list
        elements: dict
        required: false
      dozzle_dispatcher:
        type: dict
        required: false
      vault_dozzle_admin_username:
        type: str
        required: true
      vault_dozzle_admin_password:
        type: str
        required: true
      vault_dozzle_admin_password_hash:
        type: str
        required: true
      vault_dozzle_alert_relay_token:
        type: str
        required: true
      # Still required although no template here renders it any more: the
      # relay's inbound token is derived from it by sha256 in
      # inventory/group_vars/all/service_dozzle.yml, so this role reads it through that
      # derivation on every converge.
      vault_ntfy_dozzle_token:
        type: str
        required: true
      vault_pushover_alerts_token:
        type: str
        required: true
      vault_pushover_user_key:
        type: str
        required: true
