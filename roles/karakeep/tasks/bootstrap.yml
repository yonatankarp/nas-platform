---
# The first account is the administrator, and this file makes sure it is ours.
# Karakeep (0.33.2) grants admin to the first signup and refuses signups with
# DISABLE_SIGNUPS=true, read at process start. So the stack runs closed; only
# when the vault admin cannot sign in AND no account exists is the app recreated
# with signups open on 127.0.0.1 only, the admin registered, and the door closed
# again in `always`. Over existing accounts the run refuses instead (#551).

- name: Read a Karakeep sign-in token for the bootstrap probe
  ansible.builtin.uri:
    url: "{{ karakeep_url }}/api/auth/csrf"
    method: GET
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: karakeep_bootstrap_csrf
  failed_when: false
  changed_when: false
  check_mode: false
  when:
    - karakeep_deployment_enabled | bool
    - karakeep_runtime_env.stat.exists

# Redacted: carries the password. A credentials sign-in rather than
# apiKeys.exchange, which writes an API key row per call; JWT sessions write nothing.
- name: Probe whether the vault Karakeep administrator can sign in
  ansible.builtin.uri:
    url: "{{ karakeep_url }}/api/auth/callback/credentials"
    method: POST
    body_format: form-urlencoded
    body:
      csrfToken: "{{ (karakeep_bootstrap_csrf.json | default({})).csrfToken | default('') }}"
      email: "{{ vault_karakeep_admin_email }}"
      password: "{{ vault_karakeep_admin_password }}"
      json: "true"
    headers:
      Cookie: "{{ karakeep_bootstrap_csrf.cookies_string | default('') }}"
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: karakeep_bootstrap_probe
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true
  when:
    - karakeep_deployment_enabled | bool
    - karakeep_runtime_env.stat.exists

- name: Resolve the Karakeep bootstrap state
  ansible.builtin.set_fact:
    karakeep_needs_bootstrap: "{{ (karakeep_bootstrap_probe.status | default(0) | int) == 401 }}"
  when:
    - karakeep_deployment_enabled | bool
    - karakeep_runtime_env.stat.exists

- name: Refuse an unexpected Karakeep sign-in probe result
  ansible.builtin.assert:
    that:
      - (karakeep_bootstrap_probe.status | default(0) | int) in [200, 401]
    fail_msg: >-
      The Karakeep sign-in probe answered
      {{ karakeep_bootstrap_probe.status | default('no status') }}, which is
      neither 200 (the vault administrator signs in) nor 401 (it does not, or no
      account exists yet). tasks/deploy.yml waited for /api/health, so the
      application was serving a moment ago.
  when:
    - karakeep_deployment_enabled | bool
    - karakeep_runtime_env.stat.exists
    - not ansible_check_mode

# Counts rows of Karakeep's `user` table with the app's own better-sqlite3,
# opened read-only (no sqlite3 binary in the image; WAL rows are seen). This
# couples to the table name: a rename exits non-zero, tolerated here only so the
# next assertion can say which failure it was. A failed count is never read as 0;
# the karakeep lane proves the coupling on the pin.
- name: Count the accounts Karakeep holds, read-only
  community.docker.docker_compose_v2_exec:
    project_src: "{{ platform_current_dir }}/services/karakeep"
    project_name: "{{ karakeep_compose_project_name }}"
    files: "{{ platform_service_compose_files['karakeep'] }}"
    env_files: ["{{ platform_runtime_dir }}/services/karakeep/.env"]
    service: karakeep
    argv:
      - node
      - -e
      - >-
        const Database = require('/app/node_modules/better-sqlite3');
        const db = new Database('/data/db.db', { readonly: true, fileMustExist: true });
        process.stdout.write(String(db.prepare('SELECT COUNT(*) AS n FROM "user"').get().n));
        db.close();
  register: karakeep_account_count
  failed_when: false
  changed_when: false
  check_mode: false
  when:
    - karakeep_deployment_enabled | bool
    - karakeep_runtime_env.stat.exists
    - (karakeep_bootstrap_probe.status | default(0) | int) in [200, 401]

# rc defaults to 1 so a module refusal fails too. fail_msg renders on the passing
# path (#536), so it is built only from defaulted fields; it never names the email.
- name: Require the Karakeep account count to have run to completion
  ansible.builtin.assert:
    that:
      - (karakeep_account_count.rc | default(1) | int) == 0
    fail_msg: >-
      The read-only count of Karakeep's accounts did not complete (rc
      {{ karakeep_account_count.rc | default('none, the command never ran') }}).
      {{ ('The exec never reached the container: the project directory, a Compose
      file or the .env it names is missing, so the release or runtime directory is
      not what deployment_bundle installed.'
      if karakeep_account_count.rc is not defined
      or (karakeep_account_count.stderr | default('', true) | string) is search('env file', ignorecase=true) else
      ('The application container stopped, was killed or was paused between the
      sign-in probe and this count.'
      if (karakeep_account_count.stderr | default('', true) | string) is search('not running|is paused', ignorecase=true) else
      'The query itself failed inside the container -- most likely a Karakeep
      release renamed the `user` table or moved the database; check it against
      the pinned image.')) }}
      Signups were NOT opened, nothing was registered, and a count that did not
      complete is never treated as 0. It reported:
      {{ (karakeep_account_count_output | select('search', 'Error') | first)
      | default(karakeep_account_count_output | first | default(''), true) | truncate(200) }}
  # Node prints the source location before `SqliteError: ...`, so prefer the
  # first line naming an Error.
  vars:
    karakeep_account_count_output: >-
      {{ ((karakeep_account_count.stderr | default('', true) | string | trim)
      or (karakeep_account_count.msg | default('', true) | string | trim)
      or 'nothing').splitlines() }}
  when:
    - karakeep_deployment_enabled | bool
    - karakeep_runtime_env.stat.exists
    - (karakeep_bootstrap_probe.status | default(0) | int) in [200, 401]

- name: Require the Karakeep account count to be a trustworthy reading
  ansible.builtin.assert:
    that:
      - (karakeep_account_count.stdout | default('') | trim) is match('^[0-9]+\\Z')
      - >-
        (karakeep_bootstrap_probe.status | default(0) | int) != 200
        or (karakeep_account_count.stdout | default('') | trim | int) >= 1
    fail_msg: >-
      The read-only count of Karakeep's `user` table printed
      {{ karakeep_account_count.stdout | default('nothing') | trim | truncate(40) }}
      while the sign-in probe answered
      {{ karakeep_bootstrap_probe.status | default('none') }}. A count must be a
      non-negative integer, and at least 1 when the vault administrator signs
      in. Anything else means the query no longer reads Karakeep's accounts --
      most likely a Karakeep release renamed the table or moved the database --
      so signups are not opened on a reading this role cannot trust. Nothing
      was registered; check the table name against the pinned image before
      re-running.
  when:
    - karakeep_deployment_enabled | bool
    - karakeep_runtime_env.stat.exists
    - (karakeep_bootstrap_probe.status | default(0) | int) in [200, 401]

# The door opens only over an empty store: registering beside an existing account
# would add a non-admin account holding the vault password. Refused under --check too.
- name: Refuse to open Karakeep signups over existing accounts
  ansible.builtin.assert:
    that:
      - (karakeep_account_count.stdout | default('') | trim | int) == 0
    fail_msg: >-
      The vault Karakeep administrator does not sign in (401), and Karakeep
      already holds {{ karakeep_account_count.stdout | default('') | trim }}
      account(s), so signups were NOT opened: registering now would only create a
      second, non-administrator account holding the vault password. The likely
      causes are that the administrator email in the vault was changed after
      deployment, or that the administrator password was rotated in the vault or
      changed in Karakeep's interface. Sign in as the existing administrator,
      compare the account list in the administrator settings with the email the
      vault holds, and make the two agree again -- put the vault value back, or
      change the account in the interface to match it. Nothing here resets or
      renames an account.
  when:
    - karakeep_deployment_enabled | bool
    - karakeep_runtime_env.stat.exists
    - (karakeep_bootstrap_probe.status | default(0) | int) == 401

- name: Report the planned Karakeep administrator bootstrap
  ansible.builtin.debug:
    msg: >-
      The vault Karakeep administrator does not sign
      in at {{ karakeep_url }} (probe status
      {{ karakeep_bootstrap_probe.status | default('none') }}), and
      {{ ('Karakeep holds no account yet' if karakeep_account_count.stdout is defined
          else 'no Karakeep is serving on this host yet') }}. A live run would
      recreate the application with signups open and published on 127.0.0.1
      only, register that account, and recreate it closed on
      {{ karakeep_publish_address }} again. That cannot be simulated: until an
      account exists, whoever registers first administers the service.
  when:
    - karakeep_deployment_enabled | bool
    - karakeep_runtime_env.stat.exists
    - ansible_check_mode
    - (karakeep_bootstrap_probe.status | default(0) | int) != 200

- name: Register the Karakeep administrator while the listener is on loopback
  when:
    - karakeep_deployment_enabled | bool
    - karakeep_runtime_env.stat.exists
    - not ansible_check_mode
    - karakeep_needs_bootstrap | bool
  block:
    - name: Open Karakeep signups for the bootstrap
      ansible.builtin.set_fact:
        karakeep_bootstrap_open: true

    - name: Render the Karakeep bootstrap environment
      ansible.builtin.template:
        src: env.j2
        dest: "{{ platform_runtime_dir }}/services/karakeep/.env"
        mode: "0600"
      no_log: true

    # The application alone; chrome and Meilisearch keep running.
    - name: Recreate Karakeep with signups open on 127.0.0.1 only
      community.docker.docker_compose_v2:
        project_src: "{{ platform_current_dir }}/services/karakeep"
        project_name: "{{ karakeep_compose_project_name }}"
        files: "{{ platform_service_compose_files['karakeep'] }}"
        env_files: ["{{ platform_runtime_dir }}/services/karakeep/.env"]
        services: [karakeep]
        dependencies: false
        recreate: auto
        state: present
        wait: true
        wait_timeout: "{{ platform_compose_wait_timeout }}"
      register: karakeep_bootstrap_open_deploy

    - name: Wait for Karakeep to report its signups open
      ansible.builtin.uri:
        url: "{{ karakeep_url }}/api/trpc/config.clientConfig"
        method: GET
        status_code: "{{ range(100, 600) | list }}"
        return_content: true
      register: karakeep_bootstrap_door_open
      until: >-
        (karakeep_bootstrap_door_open.json | default({})).result.data.json.auth.disableSignups
        | default(true) == false
      retries: "{{ platform_readiness_retries }}"
      delay: "{{ platform_readiness_delay }}"
      changed_when: false

    # Redacted: carries the password. Accepts every status so the assertion after
    # the close fails with the reason.
    - name: Register the vault Karakeep administrator
      ansible.builtin.uri:
        url: "{{ karakeep_url }}/api/trpc/users.create"
        method: POST
        body_format: json
        body:
          json:
            name: "{{ karakeep_admin_name }}"
            email: "{{ vault_karakeep_admin_email }}"
            password: "{{ vault_karakeep_admin_password }}"
            confirmPassword: "{{ vault_karakeep_admin_password }}"
        status_code: "{{ range(100, 600) | list }}"
        return_content: true
      register: karakeep_bootstrap_signup
      # A refused connection is status -1; tolerated so the post-close assertion
      # names it.
      failed_when: false
      changed_when: karakeep_bootstrap_signup.status | default(0) | int == 200
      no_log: true
  always:
    - name: Close Karakeep signups after the bootstrap
      ansible.builtin.set_fact:
        karakeep_bootstrap_open: false

    - name: Render the closed Karakeep environment again
      ansible.builtin.template:
        src: env.j2
        dest: "{{ platform_runtime_dir }}/services/karakeep/.env"
        mode: "0600"
      no_log: true

    - name: Recreate Karakeep with signups closed on its published address
      community.docker.docker_compose_v2:
        project_src: "{{ platform_current_dir }}/services/karakeep"
        project_name: "{{ karakeep_compose_project_name }}"
        files: "{{ platform_service_compose_files['karakeep'] }}"
        env_files: ["{{ platform_runtime_dir }}/services/karakeep/.env"]
        services: [karakeep]
        dependencies: false
        recreate: auto
        state: present
        wait: true
        wait_timeout: "{{ platform_compose_wait_timeout }}"
      register: karakeep_bootstrap_close

    - name: Wait for Karakeep to report its signups closed
      ansible.builtin.uri:
        url: "{{ karakeep_url }}/api/trpc/config.clientConfig"
        method: GET
        status_code: "{{ range(100, 600) | list }}"
        return_content: true
      register: karakeep_bootstrap_door_closed
      until: >-
        (karakeep_bootstrap_door_closed.json | default({})).result.data.json.auth.disableSignups
        | default(false) == true
      retries: "{{ platform_readiness_retries }}"
      delay: "{{ platform_readiness_delay }}"
      changed_when: false

# After the close, so a refusal never leaves the door open.
- name: Require the bootstrap to have registered the vault Karakeep administrator
  ansible.builtin.assert:
    that:
      - karakeep_bootstrap_signup.status | default(0) | int == 200
      - >-
        (karakeep_bootstrap_signup.json | default({})).result.data.json.role
        | default('') == 'admin'
    fail_msg: >-
      Karakeep answered the administrator registration with
      {{ karakeep_bootstrap_signup.status | default('no status') }}
      {{ (karakeep_bootstrap_signup.json | default({})).error.json.message | default('') }}
      and role
      {{ (karakeep_bootstrap_signup.json | default({})).result.data.json.role | default('none') }}.
      Signups are closed again. They were opened only because the read-only
      count found no account, so a refusal here means somebody registered inside
      that window: "Email is already taken" means an account with the
      administrator email the vault holds was registered first, and a 200 with
      role "user" means another account was registered first and administers
      this Karakeep. Either could only have come from this host while the
      listener was on 127.0.0.1. Do not re-run hoping for a different answer --
      the next converge refuses to reopen signups over the existing accounts;
      inspect them first.
  when:
    - karakeep_deployment_enabled | bool
    - karakeep_runtime_env.stat.exists
    - not ansible_check_mode
    - karakeep_needs_bootstrap | bool

- name: Read a Karakeep sign-in token for the account census
  ansible.builtin.uri:
    url: "{{ karakeep_url }}/api/auth/csrf"
    method: GET
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: karakeep_census_csrf
  changed_when: false
  when:
    - karakeep_deployment_enabled | bool
    - karakeep_runtime_env.stat.exists
    - not ansible_check_mode
    - karakeep_needs_bootstrap | bool

# Redacted: the request carries the administrator password.
- name: Sign in as the new Karakeep administrator
  ansible.builtin.uri:
    url: "{{ karakeep_url }}/api/auth/callback/credentials"
    method: POST
    body_format: form-urlencoded
    body:
      csrfToken: "{{ (karakeep_census_csrf.json | default({})).csrfToken | default('') }}"
      email: "{{ vault_karakeep_admin_email }}"
      password: "{{ vault_karakeep_admin_password }}"
      json: "true"
    headers:
      Cookie: "{{ karakeep_census_csrf.cookies_string | default('') }}"
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: karakeep_census_login
  changed_when: false
  no_log: true
  when:
    - karakeep_deployment_enabled | bool
    - karakeep_runtime_env.stat.exists
    - not ansible_check_mode
    - karakeep_needs_bootstrap | bool

# Redacted: the request carries the session cookie.
- name: Read the Karakeep account list after the bootstrap
  ansible.builtin.uri:
    url: "{{ karakeep_url }}/api/trpc/users.list"
    method: GET
    headers:
      Cookie: "{{ karakeep_census_login.cookies_string | default('') }}"
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: karakeep_census
  changed_when: false
  no_log: true
  when:
    - karakeep_deployment_enabled | bool
    - karakeep_runtime_env.stat.exists
    - not ansible_check_mode
    - karakeep_needs_bootstrap | bool

# Proves nobody else registered in the seconds the door was open.
- name: Require the vault administrator to be the only Karakeep account
  ansible.builtin.assert:
    that:
      - karakeep_census_login.status | default(0) | int == 200
      - karakeep_census.status | default(0) | int == 200
      - >-
        (karakeep_census.json | default({})).result.data.json.users | default([])
        | map(attribute='email') | list == [vault_karakeep_admin_email]
      - >-
        (karakeep_census.json | default({})).result.data.json.users | default([])
        | map(attribute='role') | list == ['admin']
    fail_msg: >-
      After the bootstrap the vault administrator signed in with status
      {{ karakeep_census_login.status | default('none') }} and the account list
      answered {{ karakeep_census.status | default('none') }} with
      {{ (karakeep_census.json | default({})).result.data.json.users | default([]) | length }}
      account(s) holding roles
      {{ (karakeep_census.json | default({})).result.data.json.users | default([]) | map(attribute='role') | list }};
      emails are not shown. Signups are
      closed. Anything other than exactly the vault administrator email as the one
      admin means an account was
      registered while the door was open; remove it in the administrator
      interface before trusting this instance.
  when:
    - karakeep_deployment_enabled | bool
    - karakeep_runtime_env.stat.exists
    - not ansible_check_mode
    - karakeep_needs_bootstrap | bool
