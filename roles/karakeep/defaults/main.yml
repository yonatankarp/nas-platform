---
# Floor under inventory's decision: off without inventory, converging to
# `state: absent`. The gate lives in the role so the bundle re-include and the
# deployment report still run when it is off.
karakeep_deployment_enabled: false

# The Compose file publishes the literal; this is the number the role addresses.
karakeep_port: 8087

karakeep_url: "http://127.0.0.1:{{ karakeep_port }}"

# NEXTAUTH_URL, the address clients use; roles/preflight requires
# platform_public_host nonempty, so it is never `http://:8087`.
karakeep_nextauth_url: "http://{{ platform_public_host }}:{{ karakeep_port }}"

# tasks/bootstrap.yml overrides this with 127.0.0.1 for the one registration
# request; nothing else should.
karakeep_publish_address: 0.0.0.0

karakeep_data_host_path: "{{ nas_docker_root }}/karakeep/data"
karakeep_meilisearch_host_path: "{{ nas_docker_root }}/karakeep/meilisearch"
# Inside the data root (already recovery: critical and contained), so the copy
# needs no declaration of its own. One generation, never rotated.
karakeep_pre_upgrade_backup_path: "{{ karakeep_data_host_path }}/pre-upgrade-backup"

karakeep_compose_project_name: >-
  {{ (platform_project_name ~ '-karakeep')
     if platform_project_name | default('') | length > 0 else 'karakeep' }}
