---
trailarr_port: 7889
trailarr_api: "http://127.0.0.1:{{ trailarr_port }}/api/v1"
# The only unauthenticated route besides auth, OpenAPI and the SPA; outside /api/v1.
trailarr_status_url: "http://127.0.0.1:{{ trailarr_port }}/status"
trailarr_config_host_path: "{{ nas_docker_root }}/trailarr/config"
trailarr_movies_host_path: "{{ nas_media_root }}/Media/Movies"
trailarr_series_host_path: "{{ nas_media_root }}/Media/Series"

# Compose service aliases work under any container_name. Keys are the arrs' own vault
# keys, not a second copy to rotate.
trailarr_connections:
  - name: Radarr
    arr_type: radarr
    url: http://radarr:7878
    api_key: "{{ vault_arr_radarr_api_key }}"
  - name: Sonarr
    arr_type: sonarr
    url: http://sonarr:8989
    api_key: "{{ vault_arr_sonarr_api_key }}"

# MONITOR_ENABLED is a hard gate that also swallows manual downloads, so nothing can be
# proved by hand before opening it. The monitored set is the throttle. monitor_new_media
# applies only at item creation; reconcile_monitoring.yml covers an adopted library.
trailarr_monitoring_enabled: false

# Intent, separate from permission: monitor everything with the gate shut to read the
# preview first. Items already satisfied are excluded, so a complete library writes nothing.
trailarr_monitor_all_media: true

# Seeded profiles, compare-then-PUT by id (POST has no dedupe). mp4/h264/aac because the
# N5105 cannot hardware-encode VP9; the three format fields move in one PUT because
# validators reject the mixed states. Trailers/ folder is the design boundary.
trailarr_trailer_profiles:
  - id: 1
    label: Movie Trailers
  - id: 2
    label: Series Trailers
trailarr_trailer_profile_settings:
  folder_enabled: true
  folder_name: Trailers
  custom_folder: "{media_folder}"
  file_format: mp4
  video_format: h264
  audio_format: aac

# The app's own /config/.env overrides the Compose environment on every start
# (start.sh, allexport). These four are persisted every boot; rewritten only on change.
trailarr_config_env_log_level: INFO
trailarr_config_env_wait_for_media: "False"
trailarr_config_env_yt_cookies_path: ""
# Persisted only by a human change in the UI/API, so presence is the drift.
trailarr_config_env_absent_keys:
  - WEBUI_USERNAME
  - WEBUI_PASSWORD
  - WEBUI_DISABLE_AUTH
  - MONITOR_ENABLED
  - DOWNLOADS_ENABLED
  - CREATE_MISSING_FOLDERS
  - DELETE_TRAILER_CONNECTION
  - DELETE_TRAILER_MEDIA
  - URL_BASE
# YTDLP_VERSION and GPU_* are regenerated every start, which is why this file is
# parsed and compared rather than templated.
trailarr_config_env_absent_pattern: >-
  ^({{ trailarr_config_env_absent_keys | join('|') }})=

# A connection write does a live status GET, so rows need running arrs.
media_usenet_enabled: false

trailarr_compose_project_name: >-
  {{ (platform_project_name ~ '-trailarr')
     if platform_project_name | default('') | length > 0 else 'trailarr' }}
