---
# Off here, on in inventory/group_vars/all/service_vaultwarden.yml: a role default is
# the floor for a caller with no inventory, which must not get an open password manager.
# tests/deployment_gate_coverage_test.rb requires every gate default to be false.
vaultwarden_deployment_enabled: false

# The image's port 80 cannot be bound by the platform identity; see
# services/vaultwarden/compose.yml, which carries the production copy of this number.
vaultwarden_port: 8086

# Local probe address; clients use vaultwarden_domain.
vaultwarden_url: "http://127.0.0.1:{{ vaultwarden_port }}"

# The client origin, derived from platform_public_host behind Tailscale Serve's TLS.
# WebAuthn binds to this exact string: tasks/deploy.yml refuses an IPv4 host, and it is
# lowercased because browsers lowercase the origin they compare against.
vaultwarden_domain: "https://{{ platform_public_host | lower }}"

# Shut by default, like the gate. Inventory opens it: with no admin panel and no SMTP a
# fresh database has no other route to a first account. Only safe because the service is
# published on 127.0.0.1 behind Tailscale Serve; tasks/verify.yml asserts the door.
vaultwarden_signups_allowed: false

# Independent of the door; with no SMTP an invitation is completed by hand (docs/secrets.md).
vaultwarden_invitations_allowed: true

# The whole DATA_FOLDER (recovery: critical).
vaultwarden_data_host_path: "{{ nas_docker_root }}/vaultwarden/data"

vaultwarden_config_json_path: "{{ vaultwarden_data_host_path }}/config.json"

# Inside DATA_FOLDER: already declared, created 0700 and named in the containment paths.
# One generation, never rotated: what a #511 rollback restores.
vaultwarden_pre_upgrade_backup_path: >-
  {{ vaultwarden_data_host_path }}/pre-upgrade-backup

vaultwarden_compose_project_name: >-
  {{ (platform_project_name ~ '-vaultwarden')
     if platform_project_name | default('') | length > 0 else 'vaultwarden' }}

# HTTPS via Tailscale Serve (clients need a secure context). The host needs tailnet HTTPS
# certificates and `tailscale set --operator=<deploy account>`; tasks/serve.yml names both.
# Discovered by stat (no shell, works under --check). None found skips with a report,
# since CI and Mac lanes have no Tailscale.
vaultwarden_tailscale_binary_candidates:
  - /usr/local/bin/tailscale
  - /usr/local/AppCentral/tailscale-native/bin/tailscale
  - /usr/bin/tailscale

# Set an absolute path to skip discovery.
vaultwarden_tailscale_binary: ""

vaultwarden_tailscale_serve_port: 443
