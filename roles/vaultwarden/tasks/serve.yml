---
# TLS via Tailscale Serve: clients need a secure context. Only the NAS has Tailscale, so
# absence is a reporting skip, never a failure. The reads carry platform_verify_vaultwarden
# (#610) so a broken certificate shows in verification; nothing that writes does.

# Discovered, not assumed; see defaults/main.yml for the candidates and the override.
- name: Locate the Tailscale client on this host
  tags: [platform_verify_vaultwarden]
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ vaultwarden_tailscale_binary_candidates }}"
  register: vaultwarden_tailscale_candidates
  changed_when: false
  check_mode: false
  when: vaultwarden_tailscale_binary | length == 0

# Appending '' makes `first` total when nothing matched.
- name: Resolve the Tailscale client this host holds
  tags: [platform_verify_vaultwarden]
  ansible.builtin.set_fact:
    vaultwarden_tailscale_path: >-
      {{ vaultwarden_tailscale_binary
         if vaultwarden_tailscale_binary | length > 0
         else (((vaultwarden_tailscale_candidates.results | default([], true))
                | selectattr('stat.exists')
                | selectattr('stat.executable')
                | map(attribute='stat.path') | list) + ['']) | first }}

- name: Report the tailnet HTTPS front this host cannot hold
  tags: [platform_verify_vaultwarden]
  ansible.builtin.debug:
    msg: >-
      No Tailscale client was found at
      {{ vaultwarden_tailscale_binary_candidates | join(', ')
         | default('any path, because this run was given no candidates at all',
                   true) }}, so this host
      places no HTTPS front in front of Vaultwarden, has none to verify, and
      nothing here fails for it. An empty candidate list is a lane asking for this path on purpose:
      tests/mac/lib.sh passes one, because the first default candidate is where
      Homebrew installs the Tailscale CLI and a disposable sandbox must not
      reach an operator's real tailnet. Only the NAS runs Tailscale; the integration container, the Mac
      sandbox and a workstation converging over SSH all take this path. On such
      a host Vaultwarden is reachable over plain HTTP on port
      {{ vaultwarden_port }} only, which is enough for the checks that run there
      and is not enough for a Bitwarden client, whose crypto requires a secure
      context.
  when: vaultwarden_tailscale_path | length == 0

- name: Report the tailnet HTTPS front the deployment gate withholds
  ansible.builtin.debug:
    msg: >-
      vaultwarden_deployment_enabled is false, so there is no Vaultwarden to
      front and this run reads the Tailscale Serve configuration without
      changing it. An existing Serve entry is deliberately left in place rather
      than removed: unlike the Compose project, Serve state belongs to the
      tailnet node rather than to this stack, and this role may not have been
      what created it.
  when:
    - vaultwarden_tailscale_path | length > 0
    - not vaultwarden_deployment_enabled | bool

- name: Front Vaultwarden with Tailscale Serve
  when:
    - vaultwarden_tailscale_path | length > 0
    - vaultwarden_deployment_enabled | bool
  block:
    # Read first: tailscaled holds this state, so a blind write would always claim a change.
    # --json, since the plain form is prose. Reading needs no operator grant; writing does.
    - name: Read the Tailscale Serve configuration this host holds
      ansible.builtin.command:
        argv:
          - "{{ vaultwarden_tailscale_path }}"
          - serve
          - status
          - --json
      register: vaultwarden_serve_status
      changed_when: false
      check_mode: false
      failed_when: false

    # "no serve config" on stderr is a state, not an error; a CLI refusing its arguments is.
    - name: Resolve what Tailscale Serve reports for this host
      ansible.builtin.set_fact:
        vaultwarden_serve_unconfigured: >-
          {{ 'no serve config' in
             (((vaultwarden_serve_status.stdout | default('')) ~ ' ' ~
               (vaultwarden_serve_status.stderr | default(''))) | lower) }}
        vaultwarden_serve_document: >-
          {{ (vaultwarden_serve_status.stdout | from_json)
             if (vaultwarden_serve_status.stdout | default('') | trim) is match('^\{')
             else {} }}

    # Every message term is defined on the passing path too: Ansible templates it first.
    - name: Require a legible Tailscale Serve reading
      ansible.builtin.assert:
        that:
          - vaultwarden_serve_status.rc == 0 or vaultwarden_serve_unconfigured
        fail_msg: >-
          `{{ vaultwarden_tailscale_path }} serve status --json` exited
          {{ vaultwarden_serve_status.rc }} and did not report an absent serve
          configuration, so this run cannot tell a host that is simply not
          serving from a client whose command shape no longer matches these
          arguments. It printed
          {{ vaultwarden_serve_status.stdout | default('') | trim | default('nothing', true) }}
          on stdout and
          {{ vaultwarden_serve_status.stderr | default('') | trim | default('nothing', true) }}
          on stderr. Read the client's own `serve --help` before changing the
          argv above: guessing at it is how a front that silently stopped being
          placed would still report success.
        success_msg: >-
          Tailscale Serve reported its configuration for
          {{ platform_public_host }}.

    # Compared by pattern (the CLI records the target it resolved). Both sides lowercased:
    # tailscaled stores DNSName lowercased, and a mismatch would re-place the front and page
    # every five minutes forever.
    - name: Resolve whether Tailscale Serve already fronts Vaultwarden
      ansible.builtin.set_fact:
        vaultwarden_serve_web: >-
          {{ dict((vaultwarden_serve_document.Web | default({}, true)) | dict2items
                  | map(attribute='key') | map('lower') | list
                  | zip((vaultwarden_serve_document.Web | default({}, true)) | dict2items
                        | map(attribute='value') | list)) }}

    - name: Resolve the Tailscale Serve proxy target for this host
      ansible.builtin.set_fact:
        vaultwarden_serve_proxy: >-
          {{ (((vaultwarden_serve_web
                 [(platform_public_host ~ ':' ~ vaultwarden_tailscale_serve_port) | lower]
                 | default({}, true)).Handlers | default({}, true))['/']
              | default({}, true)).Proxy | default('', true) }}

    - name: Resolve whether the Vaultwarden front is the declared one
      ansible.builtin.set_fact:
        vaultwarden_serve_fronted: >-
          {{ vaultwarden_serve_proxy
             is match('^http://(127\.0\.0\.1|localhost):' ~ vaultwarden_port ~ '/?$') }}

    # --bg and --yes so it neither blocks nor prompts. default(1): a module refusing early sets
    # no rc. Only `Access denied: serve config denied` is tolerated, for the operator-grant
    # assertion below; any other failure fails here with the client's output.
    - name: Place the Tailscale Serve front for Vaultwarden
      ansible.builtin.command:
        argv:
          - "{{ vaultwarden_tailscale_path }}"
          - serve
          - --bg
          - --yes
          - "{{ vaultwarden_port }}"
      register: vaultwarden_serve_placed
      changed_when: vaultwarden_serve_placed.rc | default(1) == 0
      failed_when:
        - vaultwarden_serve_placed.rc | default(1) != 0
        - >-
          'serve config denied'
          not in (vaultwarden_serve_placed.stderr | default('', true) | lower)
          and 'access denied'
          not in (vaultwarden_serve_placed.stderr | default('', true) | lower)
      when:
        - not vaultwarden_serve_fronted
        - not ansible_check_mode

    # The only way here is the denial. The account is resolved from the run's facts, since
    # it differs per inventory.
    - name: Require the Tailscale operator grant this host was deployed without
      ansible.builtin.assert:
        that:
          - vaultwarden_serve_placed is skipped
            or vaultwarden_serve_placed.rc | default(1) == 0
        fail_msg: >-
          tailscaled refused `{{ vaultwarden_tailscale_path }} serve --bg --yes
          {{ vaultwarden_port }}`: THE ACCOUNT THIS PLAY RUNS AS MAY NOT WRITE
          `tailscale serve` CONFIGURATION on this host. Reading it is not
          privileged and writing it is, which is why this run got as far as
          placing the front. The remedy is one command, run once on the NAS by a
          human who can sudo:
          `sudo tailscale set --operator={{ ansible_facts['user_id'] | default('$USER', true) }}`.
          It is a one-time host act -- tailscaled keeps it in its own
          preferences, so it survives reboots, image bumps and every release
          this repository will ever deploy -- and it is a prerequisite of
          exactly the kind the tailnet's HTTPS certificate setting is: something
          the platform depends on, names, and does not own. THIS REPOSITORY
          DELIBERATELY DOES NOT PERFORM IT. No role here escalates; every
          `become` key under roles/ is `become: false` and ansible.cfg records
          why, so a play that granted itself operator would be the first
          privileged act this platform makes on the host. Until the grant
          exists, this run fails at site.yml's LAST role, no service is left
          behind it, and the poller repeats the same failure every five minutes.
          The client said:
          {{ vaultwarden_serve_placed.stderr | default('', true) | trim | default('nothing', true) }}
        success_msg: >-
          The account this play runs as may write `tailscale serve`
          configuration on this host.

    # `command` is skipped under --check; say what a live run would do.
    - name: Report the Tailscale Serve front check mode defers
      ansible.builtin.debug:
        msg: >-
          A live run would
          {{ 'leave the existing front in place, because'
             if vaultwarden_serve_fronted
             else 'run `' ~ vaultwarden_tailscale_path ~ ' serve --bg --yes '
                  ~ vaultwarden_port ~ '`, because' }}
          Tailscale Serve currently records
          {{ vaultwarden_serve_proxy | default('', true) | default('no proxy', true) }}
          for {{ platform_public_host }}:{{ vaultwarden_tailscale_serve_port }}
          and this release declares http://127.0.0.1:{{ vaultwarden_port }}.
      when: ansible_check_mode

    # Tailnet HTTPS certificates are an admin-console setting no check can see, so the front
    # is proved by using it (with retries while the certificate provisions). Named "Read" so
    # it cannot satisfy role_has_verification? on hosts where it is always skipped.
    - name: Read Vaultwarden over the tailnet HTTPS front
      tags: [platform_verify_vaultwarden]
      ansible.builtin.uri:
        url: "{{ vaultwarden_domain }}/alive"
        method: GET
        status_code: "{{ range(100, 600) | list }}"
      register: vaultwarden_serve_reachability
      until: vaultwarden_serve_reachability.status | default(0) | int == 200
      retries: "{{ platform_readiness_retries }}"
      delay: "{{ platform_readiness_delay }}"
      failed_when: false
      changed_when: false
      check_mode: false
      when: not ansible_check_mode

    # Terms defined on every path, verify.yml included.
    - name: Require Vaultwarden reachable over the tailnet HTTPS front
      tags: [platform_verify_vaultwarden]
      ansible.builtin.assert:
        that:
          - vaultwarden_serve_reachability.status | default(0) | int == 200
        fail_msg: >-
          Tailscale Serve should front http://127.0.0.1:{{ vaultwarden_port }}
          on {{ vaultwarden_domain }}, but {{ vaultwarden_domain }}/alive
          answered {{ vaultwarden_serve_reachability.status | default(0) | int }}
          rather than 200 ({{ vaultwarden_serve_reachability.msg
          | default('no reading', true)
          | regex_replace(' and not .[0-9, ]*]', '') }}). From site.yml the front has just been read or
          placed; from verify.yml nothing was placed, so a front that was
          removed by hand also fails here and the next converge restores it.
          The usual cause is the one setting nothing in this
          repository can read: HTTPS certificates must be ENABLED FOR THE
          TAILNET in the Tailscale admin console, under DNS. Serve accepts the
          configuration whether or not they are, so the front is placed and
          nothing terminates TLS on it. A certificate that has EXPIRED because
          renewal stopped fails the same way, and this is the only check that
          sees it. Until either is fixed, no Bitwarden client
          will talk to this server -- the browser crypto requires a secure
          context, which is the whole reason this task exists.
        success_msg: >-
          {{ vaultwarden_domain }}/alive answered 200 through Tailscale Serve.
      when: not ansible_check_mode
