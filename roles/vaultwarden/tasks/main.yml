---
# Stages are imported statically so --tags platform_verify_vaultwarden reaches
# tasks/verify.yml under verify.yml's [never]; a dynamic include would be skipped.
# The vaultwarden_deployment_enabled gate lives inside the stages, not on site.yml.
- name: Deploy the Vaultwarden stack
  ansible.builtin.import_tasks: deploy.yml

- name: Front Vaultwarden with the tailnet HTTPS termination it requires
  ansible.builtin.import_tasks: serve.yml

- name: Report whether the Vaultwarden deployment moved
  ansible.builtin.import_tasks: report.yml

- name: Verify the Vaultwarden door policy
  ansible.builtin.import_tasks: verify.yml
