---
- name: Revalidate deployment paths before Vaultwarden runtime use
  ansible.builtin.include_role:
    name: deployment_bundle
    tasks_from: target
  vars:
    deployment_target_service: vaultwarden
    deployment_target_require_current_release: true
    # The one extra directory; the container owns everything inside.
    deployment_target_extra_paths:
      - "{{ vaultwarden_data_host_path }}"

# DOMAIN is what WebAuthn and 2FA bind to: https, no port, and a name, since a bare IPv4
# enrols a key that never authenticates. platform_public_host is not guaranteed a name.
- name: Require a Vaultwarden origin clients can bind credentials to
  ansible.builtin.assert:
    that:
      - vaultwarden_domain is match('^https://')
      - not (vaultwarden_domain | regex_replace('^https://', '')
             is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}(:|/|$)'))
      - not (vaultwarden_domain | regex_replace('^https://[^/]*', '') | length > 0)
      - not (vaultwarden_domain | regex_replace('^https://', '') is search(':'))
    fail_msg: >-
      Vaultwarden's DOMAIN is {{ vaultwarden_domain }}, which is not an origin a
      Bitwarden client can bind credentials to. It is derived from
      PLATFORM_PUBLIC_HOST, which this run resolved to
      {{ platform_public_host }}, and it must be the tailnet MagicDNS name of
      this host -- a DNS name, the https scheme, no port and no path. A bare
      IPv4 literal is the case that looks like it works: WebAuthn's
      relying-party identifier has to be a domain, so a security key enrols
      against an address and then never authenticates, and every two-factor
      flow behind it fails the same way. Tailscale Serve terminates TLS on
      {{ vaultwarden_tailscale_serve_port }}, which is why the port is absent
      rather than appended.
    success_msg: >-
      Vaultwarden publishes {{ vaultwarden_domain }}, a named https origin with
      no port.
  # The gate alone: vaultwarden_runtime_env is registered below, so referencing it here is
  # an undefined forward reference once the gate is on.
  when: vaultwarden_deployment_enabled | bool

- name: Render the Vaultwarden environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ platform_runtime_dir }}/services/vaultwarden/.env"
    mode: "0600"

# Every Compose call below, teardown included, needs the .env (its `${VAR:?}` refuse
# unset), and --check did not write it. Absent means never deployed here. Must stay after
# the template, or a first live converge would read "absent" and skip deploying.
- name: Read whether a Vaultwarden runtime environment exists on this host
  ansible.builtin.stat:
    path: "{{ platform_runtime_dir }}/services/vaultwarden/.env"
  register: vaultwarden_runtime_env
  changed_when: false
  check_mode: false

# Nothing may open /admin: saving there writes config.json, which silently outranks the
# rendered .env. ADMIN_TOKEN (even empty) and DISABLE_ADMIN_TOKEN (an unauthenticated
# panel) and a container env_file are refused by parsing, not text matching, which missed
# the list form twice. Under --check `current` may lack this service, so the sweep defers;
# live, a missing Compose file fails. tests/release_path_read_test.rb covers the repo side.
- name: Read whether the installed release carries the Vaultwarden Compose definitions
  ansible.builtin.stat:
    path: >-
      {{ platform_current_dir }}/services/vaultwarden/{{ item }}
  loop: "{{ platform_service_compose_files['vaultwarden'] }}"
  register: vaultwarden_compose_present
  changed_when: false
  check_mode: false

- name: Resolve whether the installed release carries this service
  ansible.builtin.set_fact:
    vaultwarden_release_carries_service: >-
      {{ vaultwarden_compose_present.results | map(attribute='stat.exists')
         | select | list | length
         == platform_service_compose_files['vaultwarden'] | length }}

- name: Require a live Vaultwarden converge to have installed its own Compose files
  ansible.builtin.assert:
    that:
      - vaultwarden_release_carries_service
    fail_msg: >-
      {{ platform_current_dir }}/services/vaultwarden is missing at least one of
      {{ platform_service_compose_files['vaultwarden'] | join(', ') }} on a run
      that is not a review. deployment_bundle installs the release before this
      role runs, so a live converge that reaches here without those files has an
      incomplete release rather than a missing service, and the admin-panel
      guard below cannot judge what it cannot read. Do not skip past this: the
      guard is what keeps ADMIN_TOKEN and DISABLE_ADMIN_TOKEN out of a deployed
      Vaultwarden, and anything saved in the panel they open writes a
      config.json that outranks every value this role renders.
    success_msg: >-
      The installed release carries every Vaultwarden Compose file this run
      deploys.
  when: not ansible_check_mode

- name: Report the Vaultwarden configuration sweep this review cannot make
  ansible.builtin.debug:
    msg: >-
      {{ platform_current_dir }}/services/vaultwarden does not exist, so this
      review cannot sweep the deployed Compose files for ADMIN_TOKEN,
      DISABLE_ADMIN_TOKEN or a service-level env_file. That is expected rather
      than wrong: check mode installs no release, so `current` still names the
      one before this change, and a service this platform has never converged is
      not in it. Nothing is being deployed by this run either. A live converge
      installs the release first and then runs the sweep before any container is
      created, and tests/release_path_read_test.rb refuses those keys in the
      repository, so this is the only reading that is deferred rather than the
      only guard there is.
  when:
    - ansible_check_mode
    - not vaultwarden_release_carries_service

- name: Read the deployed Vaultwarden Compose definitions
  ansible.builtin.slurp:
    path: >-
      {{ platform_current_dir }}/services/vaultwarden/{{ item }}
  loop: "{{ platform_service_compose_files['vaultwarden'] }}"
  register: vaultwarden_compose_sources
  when: vaultwarden_release_carries_service

# Only the two Compose tags this platform uses are stripped; from_yaml refuses any other.
- name: Parse the deployed Vaultwarden Compose documents
  ansible.builtin.set_fact:
    vaultwarden_compose_documents: >-
      {{ vaultwarden_compose_sources.results
         | map(attribute='content') | map('b64decode')
         | map('regex_replace', ' !override', '')
         | map('regex_replace', ' !reset', '')
         | map('from_yaml') | list }}
  when: vaultwarden_release_carries_service

# Every service in every file, not only `vaultwarden`.
- name: Resolve the environment every deployed Vaultwarden container would receive
  ansible.builtin.set_fact:
    vaultwarden_declared_services: >-
      {{ vaultwarden_compose_documents
         | selectattr('services', 'defined') | map(attribute='services')
         | select('mapping') | map('dict2items') | flatten
         | map(attribute='value') | select('mapping') | list }}
  when: vaultwarden_release_carries_service

# Both `environment:` forms reduce to names. selectattr('environment', 'defined') because
# map(default=) raises on a mapping lacking the key (compose.mac.yml has none).
- name: Resolve the configuration keys the deployed Compose files declare
  ansible.builtin.set_fact:
    vaultwarden_declared_env_names: >-
      {{ (vaultwarden_declared_services
          | selectattr('environment', 'defined') | map(attribute='environment')
          | select('mapping') | map('list') | flatten | list)
         + (vaultwarden_declared_services
            | selectattr('environment', 'defined') | map(attribute='environment')
            | select('sequence') | reject('mapping') | flatten
            | map('regex_replace', '=.*$', '') | list) }}
    vaultwarden_declared_env_files: >-
      {{ vaultwarden_declared_services | select('contains', 'env_file') | list }}
  when: vaultwarden_release_carries_service

# Tripwire: the parse must find the keys compose.yml is known to declare, or a shape
# mismatch would silently pass the assertion below.
- name: Require the Vaultwarden configuration sweep to have read the environment
  ansible.builtin.assert:
    that:
      - vaultwarden_declared_services | length >= 1
      - "'DOMAIN' in vaultwarden_declared_env_names"
      - "'ROCKET_PORT' in vaultwarden_declared_env_names"
    fail_msg: >-
      The Vaultwarden configuration sweep read
      {{ vaultwarden_declared_services | length }} service(s) and the
      environment names {{ vaultwarden_declared_env_names }}, which do not
      include the DOMAIN and ROCKET_PORT that
      {{ platform_current_dir }}/services/vaultwarden/compose.yml declares. The
      sweep is therefore reading something other than the deployed container's
      environment, and the admin-panel assertion after it would pass without
      having judged anything. Fix the derivation rather than this expectation.
    success_msg: >-
      The Vaultwarden configuration sweep read
      {{ vaultwarden_declared_env_names | length }} environment name(s) across
      {{ vaultwarden_declared_services | length }} service(s).
  when: vaultwarden_release_carries_service

- name: Refuse a Vaultwarden that could be overruled by its own admin panel
  ansible.builtin.assert:
    that:
      - >-
        vaultwarden_declared_env_names
        | select('search', '(?i)^(admin_token|disable_admin_token)$')
        | list | length == 0
      - vaultwarden_declared_env_files | length == 0
    fail_msg: >-
      A deployed Vaultwarden Compose file declares
      {{ (vaultwarden_declared_env_names
          | select('search', '(?i)^(admin_token|disable_admin_token)$') | list)
         + (vaultwarden_declared_env_files | length > 0)
           | ternary(['a service-level env_file'], []) }}.
      ADMIN_TOKEN puts a login on /admin and DISABLE_ADMIN_TOKEN opens the panel
      with no login at all, and anything saved there writes config.json into
      {{ vaultwarden_data_host_path }}, which from then on outranks every
      variable this role renders -- the converge would keep reporting success
      while the container ignored it. Take the key out entirely rather than
      blanking it: on this pin an empty ADMIN_TOKEN happens to disable the panel
      too, but it is still a declared value whose meaning is the release's to
      change, and it still logs a plaintext-token notice. A service-level
      `env_file:` is refused for the same reason, since it would carry either
      key where this guard would never see it.
    success_msg: >-
      No deployed Vaultwarden Compose file declares ADMIN_TOKEN,
      DISABLE_ADMIN_TOKEN or a service-level env_file, so the /admin panel is
      disabled and the rendered environment is the only configuration.
  when: vaultwarden_release_carries_service
# `state: absent` makes the gate a decision in both directions; remove_orphans reaches
# containers an earlier revision declared.
- name: Stop the disabled Vaultwarden project
  community.docker.docker_compose_v2:
    project_src: "{{ platform_current_dir }}/services/vaultwarden"
    project_name: "{{ vaultwarden_compose_project_name }}"
    files: "{{ platform_service_compose_files['vaultwarden'] }}"
    env_files: ["{{ platform_runtime_dir }}/services/vaultwarden/.env"]
    state: absent
    remove_orphans: true
  register: vaultwarden_teardown
  when:
    - not vaultwarden_deployment_enabled | bool
    - vaultwarden_runtime_env.stat.exists

# Named: never-deployed review versus a runtime directory lost under a running stack.
- name: Report the Vaultwarden Compose work a missing runtime environment defers
  ansible.builtin.debug:
    msg: >-
      {{ platform_runtime_dir }}/services/vaultwarden/.env does not exist, so
      every Compose invocation in this role is deferred: the deployed Compose
      file interpolates ${NAS_UID:?} and its siblings, and Compose refuses the
      project outright without them -- `state: absent` included, since a
      tear-down still has to resolve the document. Under --check that is
      expected and is the reason this task exists: the render above wrote
      nothing, because check mode writes nothing. On a live run it means the
      runtime directory has been removed; if containers of Compose project
      {{ vaultwarden_compose_project_name }} are still running, converge again
      so the environment is rendered and this role can act on them.
  when: not vaultwarden_runtime_env.stat.exists

- name: Report the disabled Vaultwarden deployment
  ansible.builtin.debug:
    msg: >-
      vaultwarden_deployment_enabled is false, so the Vaultwarden Compose
      project {{ vaultwarden_compose_project_name }} is torn down rather than
      converged, nothing is written under {{ vaultwarden_data_host_path }}, and
      no listener is placed on this host's port {{ vaultwarden_port }}. Set
      vaultwarden_deployment_enabled to true in
      inventory/group_vars/all/service_vaultwarden.yml and merge; the auto-deploy
      poller brings the stack up on its next five-minute tick.
  when: not vaultwarden_deployment_enabled | bool

# config.json must not exist: /admin being its only writer is an upstream claim. Ungated,
# and after the teardown so turning the gate off still works when config.json appeared.
- name: Read the Vaultwarden configuration override that must not exist
  ansible.builtin.stat:
    path: "{{ vaultwarden_config_json_path }}"
  register: vaultwarden_config_json
  changed_when: false
  check_mode: false

- name: Refuse a Vaultwarden configuration that outranks the rendered environment
  ansible.builtin.assert:
    that:
      - not vaultwarden_config_json.stat.exists
    fail_msg: >-
      {{ vaultwarden_config_json_path }} exists. Vaultwarden reads that file in
      preference to every environment variable, so this release's DOMAIN,
      SIGNUPS_ALLOWED and INVITATIONS_ALLOWED are no longer what the server is
      running on, and no converge would have said so. Only the /admin panel
      writes it and this deployment sets no ADMIN_TOKEN, so its presence means
      either that a token was configured outside this repository or that
      something else wrote into {{ vaultwarden_data_host_path }}. Move the file
      aside, confirm the settings you want are the ones in
      roles/vaultwarden/defaults/main.yml, and converge again -- the repository
      is the only way in. If vaultwarden_deployment_enabled is false, this run
      has ALREADY taken the Compose project to `state: absent` before reaching
      here, so the server is down and stays down; the file is still refused,
      because it would outrank the environment again the moment the stack came
      back.
    success_msg: >-
      {{ vaultwarden_config_json_path }} does not exist, so the rendered
      environment is the configuration in force.

# Before deploying: the store migrates one-way (#511). A rollback below 1.35.0 would also
# restore CVE-2026-27801; the floor is written beside the pin in compose.yml.
- name: Refuse a Vaultwarden image older than the store this host has migrated
  ansible.builtin.include_role:
    name: image_downgrade_guard
  vars:
    image_downgrade_guard_service_name: vaultwarden
    image_downgrade_guard_compose_service: vaultwarden
    image_downgrade_guard_project_name: "{{ vaultwarden_compose_project_name }}"
    image_downgrade_guard_store_description: "{{ vaultwarden_data_host_path }}"
  when:
    - vaultwarden_deployment_enabled | bool
    - vaultwarden_runtime_env.stat.exists

# Copies the store aside after the guard, before the deployment (roles/pre_upgrade_backup,
# included not imported). No on-demand backup without /admin and no sqlite3, so the
# container is stopped first. rsa_key* signs every session: without it a restore logs
# every client out; the copy is 0600 in 0700 and secret-bearing.
- name: Guard the Vaultwarden store before a pinned upgrade
  ansible.builtin.include_role:
    name: pre_upgrade_backup
  vars:
    pre_upgrade_backup_service_name: vaultwarden
    pre_upgrade_backup_compose_service: vaultwarden
    pre_upgrade_backup_project_name: "{{ vaultwarden_compose_project_name }}"
    pre_upgrade_backup_store_dir: "{{ vaultwarden_data_host_path }}"
    pre_upgrade_backup_store_file: db.sqlite3
    pre_upgrade_backup_extra_patterns: [rsa_key*]
    pre_upgrade_backup_path: "{{ vaultwarden_pre_upgrade_backup_path }}"
    pre_upgrade_backup_manage_ownership: true
  when:
    - vaultwarden_deployment_enabled | bool
    - vaultwarden_runtime_env.stat.exists

# The rescue hands the failure to roles/container_health, which explains it from
# Docker's state or re-raises it unchanged (#509, #537).
- name: Deploy Vaultwarden, catching a container that runs but never serves
  when:
    - vaultwarden_deployment_enabled | bool
    - vaultwarden_runtime_env.stat.exists
  block:
    - name: Deploy Vaultwarden
      community.docker.docker_compose_v2:
        project_src: "{{ platform_current_dir }}/services/vaultwarden"
        project_name: "{{ vaultwarden_compose_project_name }}"
        files: "{{ platform_service_compose_files['vaultwarden'] }}"
        env_files: ["{{ platform_runtime_dir }}/services/vaultwarden/.env"]
        state: present
        wait: true
        wait_timeout: "{{ platform_compose_wait_timeout }}"
      register: vaultwarden_deploy
  rescue:
    # First, before anything else rebinds ansible_failed_result.
    - name: Record the failed Vaultwarden deployment
      ansible.builtin.set_fact:
        vaultwarden_deploy_failure_message: >-
          {{ ansible_failed_result.msg
             | default('the Vaultwarden deployment failed and reported no message') }}

# Right after deploy: a `Restarting` container would pass later checks (#510). Detects
# without refusing; the recreate comes first.
- name: Detect a Vaultwarden container that runs but never serves
  ansible.builtin.include_role:
    name: container_health
  vars:
    container_health_service_name: vaultwarden
    container_health_project_name: "{{ vaultwarden_compose_project_name }}"
    container_health_deploy_failure_message: >-
      {{ vaultwarden_deploy_failure_message | default('') }}
    container_health_refuse: false
  when:
    - vaultwarden_deployment_enabled | bool
    - vaultwarden_runtime_env.stat.exists

# Exactly one forced, --no-deps recreate of only the stuck services. Skipped on a
# converged host and under --check; the verdict below re-checks.
- name: Recreate a Vaultwarden container that runs but never serves
  when:
    - vaultwarden_deployment_enabled | bool
    - vaultwarden_runtime_env.stat.exists
  block:
    - name: Force-recreate the stuck Vaultwarden services
      community.docker.docker_compose_v2:
        project_src: "{{ platform_current_dir }}/services/vaultwarden"
        project_name: "{{ vaultwarden_compose_project_name }}"
        files: "{{ platform_service_compose_files['vaultwarden'] }}"
        env_files: ["{{ platform_runtime_dir }}/services/vaultwarden/.env"]
        services: "{{ container_health_stuck_services }}"
        dependencies: false
        recreate: always
        state: present
        wait: true
        wait_timeout: "{{ platform_compose_wait_timeout }}"
      when: container_health_stuck_services | default([]) | length > 0
      register: vaultwarden_wedged_recreate
  rescue:
    # Carried, not re-raised: the re-check diagnoses an unhealthy result better.
    - name: Record the Vaultwarden recreate that did not recover the service
      ansible.builtin.set_fact:
        vaultwarden_recreate_failure_message: >-
          The force-recreate reported: {{ ansible_failed_result.msg
          | default('no message') }}

- name: Record whether a Vaultwarden recreate was spent
  ansible.builtin.set_fact:
    vaultwarden_recreate_spent: >-
      {{ container_health_stuck_services | default([]) | length > 0 }}
  when:
    - vaultwarden_deployment_enabled | bool
    - vaultwarden_runtime_env.stat.exists

- name: Report the Vaultwarden wedged-container recovery check mode defers
  ansible.builtin.debug:
    msg: >-
      A live run would read every container of Compose project
      {{ vaultwarden_compose_project_name }} that Docker reports as restarting
      or unhealthy, print its state, force-recreate exactly those services once
      with no dependencies, and fail naming that retry if any of them came back
      stuck. Compose's dry run starts nothing and does not wait on container
      health, so check mode cannot reach that path and recreates nothing.
  when:
    - vaultwarden_deployment_enabled | bool
    - vaultwarden_runtime_env.stat.exists
    - ansible_check_mode

- name: Refuse a Vaultwarden container that stayed wedged after its recreate
  ansible.builtin.include_role:
    name: container_health
  vars:
    container_health_service_name: vaultwarden
    container_health_project_name: "{{ vaultwarden_compose_project_name }}"
    container_health_deploy_failure_message: >-
      {{ vaultwarden_recreate_failure_message | default('') }}
    container_health_retried: "{{ vaultwarden_recreate_spent }}"
  when:
    - vaultwarden_deployment_enabled | bool
    - vaultwarden_runtime_env.stat.exists

- name: Verify Vaultwarden effective container CPU policy
  ansible.builtin.include_role:
    name: container_cpu
  vars:
    container_cpu_service_name: vaultwarden
    container_cpu_project_name: "{{ vaultwarden_compose_project_name }}"
  when:
    - vaultwarden_deployment_enabled | bool
    - vaultwarden_runtime_env.stat.exists

# /alive is unauthenticated; tasks/verify.yml asserts what is enforced.
- name: Wait for Vaultwarden application readiness
  ansible.builtin.uri:
    url: "{{ vaultwarden_url }}/alive"
    method: GET
    status_code: [200]
  register: vaultwarden_ready
  until: vaultwarden_ready.status | default(0) | int == 200
  retries: "{{ platform_readiness_retries }}"
  delay: "{{ platform_readiness_delay }}"
  changed_when: false
  check_mode: false
  # Skipped under --check: the dry run starts nothing, so there may be no listener.
  when:
    - vaultwarden_deployment_enabled | bool
    - vaultwarden_runtime_env.stat.exists
    - not ansible_check_mode

- name: Report the Vaultwarden readiness wait check mode defers
  ansible.builtin.debug:
    msg: >-
      A live run would poll {{ vaultwarden_url }}/alive until it answers 200,
      which is how this role knows the container it just started is serving
      rather than merely running. Compose's dry run starts nothing, so check
      mode has no listener to poll and reports the intent instead. What the
      service actually enforces is asserted in this role's verification tasks,
      which are selectable with --tags platform_verify_vaultwarden against a
      host that is really running it.
  when:
    - vaultwarden_deployment_enabled | bool
    - vaultwarden_runtime_env.stat.exists
    - ansible_check_mode
