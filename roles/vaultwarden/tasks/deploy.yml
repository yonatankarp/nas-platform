---
- name: Revalidate deployment paths before Vaultwarden runtime use
  ansible.builtin.include_role:
    name: deployment_bundle
    tasks_from: target
  vars:
    deployment_target_service: vaultwarden
    deployment_target_require_current_release: true
    # The one directory this role touches beyond the five paths
    # deployment_target_service already derives. Ansible creates nothing under
    # it; the container owns everything inside.
    deployment_target_extra_paths:
      - "{{ vaultwarden_data_host_path }}"

# THE ORIGIN, AND WHY A BARE ADDRESS IS REFUSED RATHER THAN ACCEPTED.
#
# DOMAIN is the origin Bitwarden clients and the web vault bind their WebAuthn
# credentials and their two-factor flows to. It must be the full https:// form
# with no port, because Tailscale Serve terminates TLS on 443 in front of this
# stack, and it must be a name: WebAuthn's relying-party identifier is a domain,
# and a bare IPv4 literal is not one. The breakage is not a refusal at
# registration time -- it is a security key that enrols and then never
# authenticates, which reads as a client fault and is configuration.
#
# platform_public_host is a LAN address in some environments and 127.0.0.1 in
# inventory/mac.yml, so this is a value that arrives from the environment and
# nothing in the tree guarantees. Hence a refusal rather than trust.
#
# Every term in the message is defined whether the assertion holds or not.
- name: Require a Vaultwarden origin clients can bind credentials to
  ansible.builtin.assert:
    that:
      - vaultwarden_domain is match('^https://')
      - not (vaultwarden_domain | regex_replace('^https://', '')
             is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}(:|/|$)'))
      - not (vaultwarden_domain | regex_replace('^https://[^/]*', '') | length > 0)
      - not (vaultwarden_domain | regex_replace('^https://', '') is search(':'))
    fail_msg: >-
      Vaultwarden's DOMAIN is {{ vaultwarden_domain }}, which is not an origin a
      Bitwarden client can bind credentials to. It is derived from
      PLATFORM_PUBLIC_HOST, which this run resolved to
      {{ platform_public_host }}, and it must be the tailnet MagicDNS name of
      this host -- a DNS name, the https scheme, no port and no path. A bare
      IPv4 literal is the case that looks like it works: WebAuthn's
      relying-party identifier has to be a domain, so a security key enrols
      against an address and then never authenticates, and every two-factor
      flow behind it fails the same way. Tailscale Serve terminates TLS on
      {{ vaultwarden_tailscale_serve_port }}, which is why the port is absent
      rather than appended.
    success_msg: >-
      Vaultwarden publishes {{ vaultwarden_domain }}, a named https origin with
      no port.
  when: vaultwarden_deployment_enabled | bool

- name: Render the Vaultwarden environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ platform_runtime_dir }}/services/vaultwarden/.env"
    mode: "0600"

# ADMIN_TOKEN MUST BE ABSENT, AND THIS IS THE TASK THAT SAYS SO OUT LOUD.
#
# Opening /admin and saving anything writes config.json into DATA_FOLDER, and
# that file then outranks every environment variable this role renders: the
# converge would render .env correctly, the container would ignore it, and
# nothing would report a difference. Omitting the token disables the panel.
#
# An omission is invisible, which is the point of checking it. Nothing fails
# today if a future edit adds the variable back, and the `${VAR:?}` convention
# every other value here uses makes rendering it EMPTY the obvious way to make
# it optional -- which does not disable the panel at all. Measured against this
# pin: `ADMIN_TOKEN=` still logs `[NOTICE] You are using a plain text
# ADMIN_TOKEN which is insecure`.
#
# THE COMPOSE FILES ARE THE COMPLETE SUBJECT, and that is an argument rather
# than a shortcut. `env_files:` on the Compose module supplies values for the
# `${...}` interpolations these documents name; it is not `env_file:` inside a
# service, which would hand a whole file to the container. So a variable that
# reaches the container is a variable one of these files declares, and the
# assertion below refuses both the key and the service-level `env_file:` that
# would let one arrive unread.
#
# A LINE SWEEP RATHER THAN A PARSE, for one reason worth recording: every
# service here carries a `compose.<kind>.yml` override, and those use Compose's
# own `!override` YAML tag, which ansible.builtin.from_yaml refuses as an
# unknown tag rather than reading. The sweep is anchored at the start of a line
# so the long comment beside the key in services/vaultwarden/compose.yml --
# which names ADMIN_TOKEN a dozen times on purpose -- cannot make this pass or
# fail: a comment line begins with `#`.
#
# regex_findall over the whole document rather than a split into lines, and the
# character class is `[ -]` rather than `[ \t-]`, because a whitespace backslash
# escape inside a `{{ }}` expression is not one under Ansible -- AnsibleLexer
# pre-escapes it, so `\t` stays two characters. tests/policy_test.rb refuses the
# class outright. Nothing is lost: YAML forbids a tab as indentation, so space
# and the list marker are the whole of what can precede a key.
- name: Read the deployed Vaultwarden Compose definitions
  ansible.builtin.slurp:
    path: >-
      {{ platform_current_dir }}/services/vaultwarden/{{ item }}
  loop: "{{ platform_service_compose_files['vaultwarden'] }}"
  register: vaultwarden_compose_sources

- name: Resolve the configuration keys the deployed Compose files declare
  ansible.builtin.set_fact:
    vaultwarden_forbidden_compose_keys: >-
      {{ vaultwarden_compose_sources.results
         | map(attribute='content') | map('b64decode')
         | map('regex_findall', '(?im)^[ -]*(?:ADMIN_TOKEN|env_file)[ ]*:')
         | flatten | map('trim') | list }}

- name: Refuse a Vaultwarden that could be overruled by its own admin panel
  ansible.builtin.assert:
    that:
      - vaultwarden_forbidden_compose_keys | length == 0
    fail_msg: >-
      A deployed Vaultwarden Compose file declares
      {{ vaultwarden_forbidden_compose_keys | join('; ') }}. ADMIN_TOKEN makes
      the /admin panel reachable, and anything saved there writes config.json
      into {{ vaultwarden_data_host_path }}, which from then on outranks every
      variable this role renders -- the converge would keep reporting success
      while the container ignored it. Setting the token to an empty value is
      NOT the same as omitting it: it still leaves the panel enabled and logs a
      plaintext-token notice. Take the key out entirely rather than blanking
      it. A service-level `env_file:` is refused for the same reason, since it
      would carry a token this check never sees.
    success_msg: >-
      No deployed Vaultwarden Compose file declares ADMIN_TOKEN or a
      service-level env_file, so the /admin panel is disabled and the rendered
      environment is the only configuration.

# THE SECOND HALF OF THE SAME GUARD, AND IT WATCHES THE CONSEQUENCE RATHER THAN
# THE CAUSE. "The admin panel is the only writer of config.json" is an upstream
# claim, not a property this platform can see, so the file's absence is asserted
# on every converge rather than inferred from the token's absence. A fresh start
# creates no config.json -- measured against this pin -- so the file existing at
# all means something wrote a configuration that now outranks the rendered .env.
#
# Ungated: it runs whether or not the stack is deployed, because the state it
# refuses is exactly a file left behind by an earlier run that WAS enabled.
- name: Read the Vaultwarden configuration override that must not exist
  ansible.builtin.stat:
    path: "{{ vaultwarden_config_json_path }}"
  register: vaultwarden_config_json
  changed_when: false
  check_mode: false

- name: Refuse a Vaultwarden configuration that outranks the rendered environment
  ansible.builtin.assert:
    that:
      - not vaultwarden_config_json.stat.exists
    fail_msg: >-
      {{ vaultwarden_config_json_path }} exists. Vaultwarden reads that file in
      preference to every environment variable, so this release's DOMAIN,
      SIGNUPS_ALLOWED and INVITATIONS_ALLOWED are no longer what the server is
      running on, and no converge would have said so. Only the /admin panel
      writes it and this deployment sets no ADMIN_TOKEN, so its presence means
      either that a token was configured outside this repository or that
      something else wrote into {{ vaultwarden_data_host_path }}. Move the file
      aside, confirm the settings you want are the ones in
      roles/vaultwarden/defaults/main.yml, and converge again -- the repository
      is the only way in.
    success_msg: >-
      {{ vaultwarden_config_json_path }} does not exist, so the rendered
      environment is the configuration in force.

# `state: absent` rather than a skipped deployment, so switching the gate off is
# a deployment decision in both directions rather than a converge that leaves
# containers running that nothing in the repository claims. remove_orphans
# reaches the ones a previous revision of the Compose file declared and this one
# no longer does.
- name: Stop the disabled Vaultwarden project
  community.docker.docker_compose_v2:
    project_src: "{{ platform_current_dir }}/services/vaultwarden"
    project_name: "{{ vaultwarden_compose_project_name }}"
    files: "{{ platform_service_compose_files['vaultwarden'] }}"
    env_files: ["{{ platform_runtime_dir }}/services/vaultwarden/.env"]
    state: absent
    remove_orphans: true
  register: vaultwarden_teardown
  when: not vaultwarden_deployment_enabled | bool

- name: Report the disabled Vaultwarden deployment
  ansible.builtin.debug:
    msg: >-
      vaultwarden_deployment_enabled is false, so the Vaultwarden Compose
      project {{ vaultwarden_compose_project_name }} is torn down rather than
      converged, nothing is written under {{ vaultwarden_data_host_path }}, and
      no listener is placed on this host's port {{ vaultwarden_port }}. Set
      vaultwarden_deployment_enabled to true in
      inventory/group_vars/all/main.yml and merge; the auto-deploy poller brings
      the stack up on its next five-minute tick.
  when: not vaultwarden_deployment_enabled | bool

# BEFORE THE DEPLOYMENT, because the point is to refuse while there is still a
# healthy stack to protect. Vaultwarden migrates its own SQLite store when it
# starts, so a pin older than one that has already run here writes nothing and
# refuses to open the store -- inside the container, which is a crash loop every
# converge repeats rather than a failure a play reports (#511).
#
# Here the hazard is doubled and services/vaultwarden/compose.yml records why:
# CVE-2026-27801 is a two-factor bypass affecting everything up to and including
# 1.34.3, so a rollback below 1.35.0 is not only a store it cannot open, it is
# that CVE back in force. This guard compares image versions and would refuse
# such a rollback for the store reason; nothing here reads the CVE floor, which
# is why the floor is written beside the pin.
- name: Refuse a Vaultwarden image older than the store this host has migrated
  ansible.builtin.include_role:
    name: image_downgrade_guard
  vars:
    image_downgrade_guard_service_name: vaultwarden
    image_downgrade_guard_compose_service: vaultwarden
    image_downgrade_guard_project_name: "{{ vaultwarden_compose_project_name }}"
    image_downgrade_guard_store_description: "{{ vaultwarden_data_host_path }}"
  when: vaultwarden_deployment_enabled | bool

# The block exists for one thing the rescue does with the failure: it hands the
# deployment's own message to roles/container_health, which either explains it in
# terms of the container state Docker reports or re-raises it unchanged.
# Compose's `--wait` fails a crash-looping container with "container ... is
# unhealthy", which says nothing about why. roles/bindery/tasks/main.yml carries
# the long form of this argument; #509 built the mechanism and #537 wired the
# remaining single-`up` roles into it.
- name: Deploy Vaultwarden, catching a container that runs but never serves
  when: vaultwarden_deployment_enabled | bool
  block:
    - name: Deploy Vaultwarden
      community.docker.docker_compose_v2:
        project_src: "{{ platform_current_dir }}/services/vaultwarden"
        project_name: "{{ vaultwarden_compose_project_name }}"
        files: "{{ platform_service_compose_files['vaultwarden'] }}"
        env_files: ["{{ platform_runtime_dir }}/services/vaultwarden/.env"]
        state: present
        wait: true
        wait_timeout: "{{ platform_compose_wait_timeout }}"
      register: vaultwarden_deploy
  rescue:
    # First, and before anything else can rebind it: ansible_failed_result
    # belongs to whichever rescue is running.
    - name: Record the failed Vaultwarden deployment
      ansible.builtin.set_fact:
        vaultwarden_deploy_failure_message: >-
          {{ ansible_failed_result.msg
             | default('the Vaultwarden deployment failed and reported no message') }}

# Immediately after the deployment and before everything that trusts it. A
# container in `Restarting` still appears in `docker container ls --quiet`, so
# the CPU verification below would sail straight past one and the readiness probe
# after it would fail on a timeout that names nothing (#510).
#
# This pass detects, prints the evidence and publishes
# container_health_stuck_services WITHOUT refusing, because the recreate below
# has to happen before the verdict. It still re-raises a deployment failure that
# no stuck container explains.
- name: Detect a Vaultwarden container that runs but never serves
  ansible.builtin.include_role:
    name: container_health
  vars:
    container_health_service_name: vaultwarden
    container_health_project_name: "{{ vaultwarden_compose_project_name }}"
    container_health_deploy_failure_message: >-
      {{ vaultwarden_deploy_failure_message | default('') }}
    container_health_refuse: false
  when: vaultwarden_deployment_enabled | bool

# EXACTLY ONE force-recreate, of only the services Docker says are stuck.
# FORCED, because `up -d` against an unchanged specification keeps the same
# container and recreates nothing; `dependencies: false` renders as --no-deps.
# CONDITIONAL, and that condition is the whole idempotence argument: the list is
# empty on a converged host and empty under --check, so this task is skipped on
# every run that has nothing to repair. BOUNDED AT ONE PER RUN by being a single
# task rather than a loop, with the verdict below re-checking, so a container
# looping for a reason a recreate cannot fix never goes green and never becomes
# an invisible retry loop.
- name: Recreate a Vaultwarden container that runs but never serves
  when: vaultwarden_deployment_enabled | bool
  block:
    - name: Force-recreate the stuck Vaultwarden services
      community.docker.docker_compose_v2:
        project_src: "{{ platform_current_dir }}/services/vaultwarden"
        project_name: "{{ vaultwarden_compose_project_name }}"
        files: "{{ platform_service_compose_files['vaultwarden'] }}"
        env_files: ["{{ platform_runtime_dir }}/services/vaultwarden/.env"]
        services: "{{ container_health_stuck_services }}"
        dependencies: false
        recreate: always
        state: present
        wait: true
        wait_timeout: "{{ platform_compose_wait_timeout }}"
      when: container_health_stuck_services | default([]) | length > 0
      register: vaultwarden_wedged_recreate
  rescue:
    # Carried rather than re-raised here. `--wait` fails a container that came
    # back unhealthy, which the re-check below diagnoses far better than Compose
    # can; a recreate that failed for any OTHER reason left no stuck container
    # behind, and the second pass re-raises this message unchanged for that case.
    - name: Record the Vaultwarden recreate that did not recover the service
      ansible.builtin.set_fact:
        vaultwarden_recreate_failure_message: >-
          The force-recreate reported: {{ ansible_failed_result.msg
          | default('no message') }}

# Whether a recreate was actually spent, recorded before the second pass
# overwrites the list it was decided from.
- name: Record whether a Vaultwarden recreate was spent
  ansible.builtin.set_fact:
    vaultwarden_recreate_spent: >-
      {{ container_health_stuck_services | default([]) | length > 0 }}
  when: vaultwarden_deployment_enabled | bool

- name: Report the Vaultwarden wedged-container recovery check mode defers
  ansible.builtin.debug:
    msg: >-
      A live run would read every container of Compose project
      {{ vaultwarden_compose_project_name }} that Docker reports as restarting
      or unhealthy, print its state, force-recreate exactly those services once
      with no dependencies, and fail naming that retry if any of them came back
      stuck. Compose's dry run starts nothing and does not wait on container
      health, so check mode cannot reach that path and recreates nothing.
  when:
    - vaultwarden_deployment_enabled | bool
    - ansible_check_mode

# The verdict. Nothing stuck here means the recreate worked, or that there was
# never anything to repair; either way the run continues. Anything still stuck
# fails, and says the retry has already been spent.
- name: Refuse a Vaultwarden container that stayed wedged after its recreate
  ansible.builtin.include_role:
    name: container_health
  vars:
    container_health_service_name: vaultwarden
    container_health_project_name: "{{ vaultwarden_compose_project_name }}"
    container_health_deploy_failure_message: >-
      {{ vaultwarden_recreate_failure_message | default('') }}
    container_health_retried: "{{ vaultwarden_recreate_spent }}"
  when: vaultwarden_deployment_enabled | bool

- name: Verify Vaultwarden effective container CPU policy
  ansible.builtin.include_role:
    name: container_cpu
  vars:
    container_cpu_service_name: vaultwarden
    container_cpu_project_name: "{{ vaultwarden_compose_project_name }}"
  when: vaultwarden_deployment_enabled | bool

# /alive is unauthenticated and answers a JSON timestamp string, so readiness
# can be polled without presenting anything. It is a readiness probe rather than
# a verification: what the deployment actually enforces is asserted in
# tasks/verify.yml.
- name: Wait for Vaultwarden application readiness
  ansible.builtin.uri:
    url: "{{ vaultwarden_url }}/alive"
    method: GET
    status_code: [200]
  register: vaultwarden_ready
  until: vaultwarden_ready.status | default(0) | int == 200
  retries: "{{ platform_readiness_retries }}"
  delay: "{{ platform_readiness_delay }}"
  changed_when: false
  check_mode: false
  when: vaultwarden_deployment_enabled | bool
