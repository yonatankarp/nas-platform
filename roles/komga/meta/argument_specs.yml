---
argument_specs:
  main:
    short_description: Deploy Komga and converge its administrator and managed libraries
    options:
      platform_project_name:
        type: str
        required: false
      komga_port:
        type: int
        required: false
      komga_health_retries:
        type: int
        required: false
      komga_health_delay:
        type: int
        required: false
      komga_claim_retries:
        type: int
        required: false
      komga_libraries:
        description: >-
          The exact managed library set. Each entry declares its name, its API
          root inside the container, and its own owned settings, which are
          combined over komga_library_settings.
        type: list
        elements: dict
        required: false
        options:
          name:
            type: str
            required: true
          root:
            type: str
            required: true
          settings:
            type: dict
            required: false
      komga_library_settings:
        description: Owned library settings shared by every entry of komga_libraries.
        type: dict
        required: false
      komga_library_root_migration_allowed:
        description: >-
          One-convergence input. When true, a library matched by its desired
          name may have its root repaired. Pinned false in inventory and
          flipped to true for the single reviewed convergence that performs a
          migration, then restored.
        type: bool
        required: false
      vault_komga_admin_email:
        type: str
        required: true
      vault_komga_admin_password:
        type: str
        required: true
      # The managed-user parameters this role hands roles/managed_users. Only
      # the ones that resolve at role entry are declared: Ansible templates
      # every declared option before the role's first task, so declaring
      # komga_managed_users_create_body, _repair_body, _repair_condition,
      # _reconcile_path, _authenticate_identity or _list_json -- each a template
      # over the shared role's per-identity `item`, its bound match, or the
      # listing it registers -- would fail this role at "Validating arguments
      # against arg spec 'main'" with "'item' is undefined". roles/managed_users
      # asserts their presence instead, and defaults/main.yml states why each is
      # shaped the way it is.
      komga_managed_users_identity_attribute:
        type: str
        required: false
      komga_managed_users_id_attribute:
        type: str
        required: false
      komga_managed_users_list_path:
        type: str
        required: false
      komga_managed_users_authenticate_path:
        type: str
        required: false
      komga_managed_users_create_path:
        type: str
        required: false
      komga_managed_users_reconcile_interface:
        description: >-
          The interfaces.reconcile value config/managed-user-capabilities.yml
          declares for Komga, asserted against the deployed register.
        type: str
        required: false
      komga_managed_users_create_status:
        type: list
        elements: int
        required: false
      komga_managed_users_repair_status:
        type: list
        elements: int
        required: false
      komga_managed_users_verify_conditions:
        description: >-
          Brace-free expressions the shared role's final verification asserts in
          order. Unbraced, so they are safe to declare here.
        type: list
        elements: str
        required: false
      komga_managed_users_verify_fail_msg:
        type: str
        required: false
      komga_managed_users_plan_create_message:
        type: str
        required: false
      komga_managed_users_plan_repair_message:
        type: str
        required: false
      vault_managed_komga_users:
        description: The exact declared Komga managed-user set.
        type: list
        elements: dict
        required: true
