---
# roles/managed_users, parameterised from defaults/main.yml. Kept as a file so its
# phase assert gates komga_managed_users_phase for tests/policy_test.rb.
- name: Validate the Komga managed-user phase
  ansible.builtin.assert:
    that:
      - komga_managed_users_phase in ['reconcile', 'verify']
    fail_msg: >-
      Komga managed-user reconciliation was included with a phase it does not
      implement. The tasks this file reaches are gated on
      komga_managed_users_phase, so an unrecognised phase silently skips them.

- name: Reconcile the declared Komga managed users
  ansible.builtin.include_role:
    name: managed_users
  vars:
    managed_users_phase: "{{ komga_managed_users_phase }}"
    managed_users_service: komga
    managed_users_title: Komga
    managed_users_declared: "{{ vault_managed_komga_users }}"
    managed_users_identity_attribute: "{{ komga_managed_users_identity_attribute }}"
    managed_users_id_attribute: "{{ komga_managed_users_id_attribute }}"
    managed_users_api: "{{ komga_api }}"
    managed_users_admin_username: "{{ vault_komga_admin_email }}"
    managed_users_admin_password: "{{ vault_komga_admin_password }}"
    managed_users_list_path: "{{ komga_managed_users_list_path }}"
    managed_users_list_json: "{{ komga_managed_users_list_json }}"
    managed_users_authenticate_path: "{{ komga_managed_users_authenticate_path }}"
    managed_users_authenticate_identity: "{{ komga_managed_users_authenticate_identity }}"
    managed_users_create_path: "{{ komga_managed_users_create_path }}"
    managed_users_create_body: "{{ komga_managed_users_create_body }}"
    managed_users_create_status: "{{ komga_managed_users_create_status }}"
    managed_users_reconcile_interface: "{{ komga_managed_users_reconcile_interface }}"
    managed_users_reconcile_path: "{{ komga_managed_users_reconcile_path }}"
    managed_users_repair_body: "{{ komga_managed_users_repair_body }}"
    managed_users_repair_status: "{{ komga_managed_users_repair_status }}"
    managed_users_repair_condition: "{{ komga_managed_users_repair_condition }}"
    managed_users_verify_conditions: "{{ komga_managed_users_verify_conditions }}"
    managed_users_verify_fail_msg: "{{ komga_managed_users_verify_fail_msg }}"
    managed_users_plan_create_message: "{{ komga_managed_users_plan_create_message }}"
    managed_users_plan_repair_message: "{{ komga_managed_users_plan_repair_message }}"
