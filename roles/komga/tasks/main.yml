---
- name: Revalidate deployment paths before Komga runtime use
  ansible.builtin.include_role:
    name: deployment_bundle
    tasks_from: target
  vars:
    deployment_target_require_current_release: true
    deployment_target_extra_paths:
      - "{{ platform_current_dir }}/services/komga"
      - "{{ platform_current_dir }}/services/komga/compose.yml"
      - "{{ platform_current_dir }}/services/komga/compose.{{ platform_compose_kind }}.yml"
      - "{{ platform_runtime_dir }}/services/komga"
      - "{{ platform_runtime_dir }}/services/komga/.env"

- name: Render the Komga environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ platform_runtime_dir }}/services/komga/.env"
    mode: "0600"

- name: Deploy Komga
  community.docker.docker_compose_v2:
    project_src: "{{ platform_current_dir }}/services/komga"
    project_name: "{{ komga_compose_project_name }}"
    files: "{{ platform_service_compose_files['komga'] }}"
    env_files: ["{{ platform_runtime_dir }}/services/komga/.env"]
    state: present
    wait: true
    wait_timeout: 180
  register: komga_deploy

- name: Report the Komga deployment
  ansible.builtin.include_role:
    name: ntfy
    tasks_from: deployment_report
  vars:
    ntfy_deployment_report_service: Komga
    ntfy_deployment_report_changed: "{{ komga_deploy is changed }}"

- name: Verify Komga effective container CPU policy
  ansible.builtin.include_role:
    name: container_cpu
  vars:
    container_cpu_service_name: komga
    container_cpu_project_name: "{{ komga_compose_project_name }}"
  when: not ansible_check_mode

- name: Wait for Komga application health
  ansible.builtin.uri:
    url: "{{ komga_api }}/actuator/health"
    method: GET
    status_code: [200]
    return_content: true
  register: komga_health
  until:
    - komga_health.json | default(none) is mapping
    - komga_health.json.status | default(none) == 'UP'
  retries: "{{ komga_health_retries }}"
  delay: "{{ komga_health_delay }}"
  changed_when: false
  check_mode: false

- name: Read Komga claim status
  ansible.builtin.uri:
    url: "{{ komga_api }}/api/v1/claim"
    return_content: true
  register: komga_claim_status
  until: komga_claim_status.status | default(0) == 200
  retries: 40
  delay: 3
  changed_when: false
  check_mode: false
  no_log: true

- name: Report planned Komga claim
  ansible.builtin.debug:
    msg: KOMGA_PLAN_CLAIM
  when:
    - ansible_check_mode
    - not komga_claim_status.json.isClaimed | bool
  changed_when: true

- name: Claim Komga with the vault administrator
  ansible.builtin.uri:
    url: "{{ komga_api }}/api/v1/claim"
    method: POST
    headers:
      X-Komga-Email: "{{ vault_komga_admin_email }}"
      X-Komga-Password: "{{ vault_komga_admin_password }}"
    status_code: [200]
  when:
    - not ansible_check_mode
    - not komga_claim_status.json.isClaimed | bool
  changed_when: true
  no_log: true

- name: Authenticate the vault Komga administrator
  ansible.builtin.uri:
    url: "{{ komga_api }}/api/v2/users/me"
    url_username: "{{ vault_komga_admin_email }}"
    url_password: "{{ vault_komga_admin_password }}"
    force_basic_auth: true
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: komga_reconcile_admin
  when: not ansible_check_mode or komga_claim_status.json.isClaimed | bool
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

- name: Resolve sanitized Komga administrator authentication status
  ansible.builtin.set_fact:
    komga_reconcile_admin_status: "{{ komga_reconcile_admin.status | default(0) | int }}"
  when: not ansible_check_mode or komga_claim_status.json.isClaimed | bool
  no_log: true

- name: Require the vault Komga administrator
  ansible.builtin.assert:
    that:
      - komga_reconcile_admin_status | int == 200
      - komga_reconcile_admin.json.email == vault_komga_admin_email
      - "'ADMIN' in komga_reconcile_admin.json.roles"
    fail_msg: >-
      The claimed Komga server does not accept the vault administrator or that account is not an
      administrator. Verify the preserved vault credentials in the Komga UI and rerun.
  when: not ansible_check_mode or komga_claim_status.json.isClaimed | bool
  no_log: true

- name: List Komga libraries for reconciliation
  ansible.builtin.uri:
    url: "{{ komga_api }}/api/v1/libraries"
    url_username: "{{ vault_komga_admin_email }}"
    url_password: "{{ vault_komga_admin_password }}"
    force_basic_auth: true
    status_code: [200]
    return_content: true
  register: komga_libraries_before
  when: not ansible_check_mode or komga_claim_status.json.isClaimed | bool
  changed_when: false
  check_mode: false
  no_log: true

- name: Require a complete Komga library listing
  ansible.builtin.assert:
    that:
      - komga_libraries_before.json | type_debug == 'list'
    fail_msg: >-
      Komga returned an unsupported libraries response; reconciliation requires the complete
      unpaginated array before any mutation.
  when: not ansible_check_mode or komga_claim_status.json.isClaimed | bool
  no_log: true

# The desired model is derived from komga_libraries alone, so it is equally
# available on the platform_verify_komga path, where every untagged task above is
# skipped. Both halves are tagged for that reason, and the model is rebuilt from
# empty rather than appended to so a second include cannot accumulate duplicates.
- name: Reset normalized Komga library targets
  tags: [platform_verify_komga]
  ansible.builtin.set_fact:
    komga_desired_libraries: []

- name: Resolve normalized Komga library targets
  tags: [platform_verify_komga]
  ansible.builtin.set_fact:
    komga_desired_libraries: >-
      {{ komga_desired_libraries + [{
           'name': item.name | default(none),
           'root': item.root | default(none),
           'normalized_root': item.root | default('', true) | string | regex_replace('/+$', ''),
           'settings': komga_library_settings | combine(item.settings | default({}, true))
         }] }}
  loop: "{{ komga_libraries }}"
  loop_control:
    label: "{{ item.name | default('komga-library') }}"

# `is string` precedes every filter that would raise on a non-string, because
# assert stops at its first false condition.
- name: Require a valid Komga library target
  tags: [platform_verify_komga]
  ansible.builtin.assert:
    that:
      - item.name is string
      - item.name | length > 0
      - item.root is string
      - item.root | length > 0
      - item.normalized_root == item.root
      - item.settings is mapping
    fail_msg: The managed Komga library name and exact normalized API root are invalid.
  loop: "{{ komga_desired_libraries }}"
  loop_control:
    label: "{{ item.name | default('komga-library') }}"

- name: Require a distinct Komga library model
  tags: [platform_verify_komga]
  ansible.builtin.assert:
    that:
      - komga_libraries is sequence
      - komga_libraries is not string
      - komga_desired_libraries | length > 0
      - >-
        komga_desired_libraries | map(attribute='name') | unique | list | length ==
        komga_desired_libraries | length
      - >-
        komga_desired_libraries | map(attribute='normalized_root') | unique | list | length ==
        komga_desired_libraries | length
    fail_msg: >-
      komga_libraries must be a nonempty list of libraries with distinct names and distinct
      normalized roots.

- name: Resolve the Komga library inventory
  ansible.builtin.set_fact:
    komga_library_inventory: >-
      {{ komga_libraries_before.json
         if (not ansible_check_mode or komga_claim_status.json.isClaimed | bool) else [] }}
  no_log: true

# Every Komga root match below selects the same way, and the regex is not the
# obvious one, so the reasoning lives here once.
#
# The predicate being reproduced is `root | regex_replace('/+$', '') == needle`,
# evaluated per candidate by a loop that appended one match at a time. Three
# parts of the pattern carry that predicate exactly, and each was chosen because
# a differential against the old accumulator disagreed without it:
#
#   regex_escape  a root containing `.` must not behave as a wildcard.
#   (?<!/)        a needle that itself ends in a slash matched nothing under the
#                 accumulator, because the left side never ends in one. The
#                 lookbehind keeps that closed.
#   \A and \Z     Python's `$` also matches before a trailing newline, so `^..$`
#                 accepted a root of "/data\n" that the accumulator rejected.
#
# The dropped `item is mapping` condition needs no replacement: a non-mapping
# candidate has no `root` attribute, so `selectattr('root', 'defined')` discards
# it exactly as the loop did.
- name: Reset Komga library candidates
  ansible.builtin.set_fact:
    komga_library_candidates: []
  no_log: true

- name: Resolve Komga library candidates
  ansible.builtin.set_fact:
    komga_library_candidates: >-
      {{ komga_library_candidates + [item | combine({
           'settings_items': item.settings | dict2items,
           'root_matches': komga_library_inventory
             | selectattr('root', 'defined') | selectattr('root', 'string')
             | selectattr('root', 'regex',
                          '\A' ~ (item.normalized_root | regex_escape) ~ '(?<!/)/*\Z')
             | list,
           'name_matches': komga_library_inventory
             | selectattr('name', 'defined') | selectattr('name', 'string')
             | selectattr('name', 'equalto', item.name)
             | list
         })] }}
  loop: "{{ komga_desired_libraries }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Require valid Komga library candidate schemas
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.name is string
      - item.name | length > 0
      - item.root is defined
      - item.root is string
      - item.root | length > 0
      - item.id is defined
      - item.id is string
      - item.id is match('^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$')
    fail_msg: A managed-root or desired-name Komga library candidate has an unsafe schema.
  loop: >-
    {{ (komga_library_candidates | map(attribute='root_matches') | list | flatten) +
       (komga_library_candidates | map(attribute='name_matches') | list | flatten) }}
  loop_control:
    label: komga-library-candidate
  no_log: true

# Deliberately not redacted, and the loop item is library metadata Komga already
# returned: names, roots, identifiers and owned settings, none of it credential
# material. Redaction would hide which of the three refusals applied.
#
# The third condition is the library root migration. A library carrying the
# desired name at a different root is exactly the state a single /data library
# is in before it narrows to /data/Comics, and repointing it is not something an
# unreviewed run may do. komga_library_root_migration_allowed opens that one
# repair for one convergence and nothing else.
- name: Refuse ambiguous Komga library candidates
  ansible.builtin.assert:
    that:
      - item.root_matches | length <= 1
      - item.name_matches | length <= 1
      - >-
        item.name_matches | length == 0 or
        (item.name_matches[0].root | regex_replace('/+$', '')) == item.normalized_root or
        komga_library_root_migration_allowed | bool
    fail_msg: >-
      Komga library reconciliation is ambiguous for {{ item.name }} at {{ item.root }}:
      managed-root IDs {{ item.root_matches | map(attribute='id') | list }} and desired-name IDs
      {{ item.name_matches | map(attribute='id') | list }}. A desired-name match at a different
      root is a library root migration; rerun that one convergence with
      komga_library_root_migration_allowed=true, or resolve the conflict manually. No library was
      mutated.
  loop: "{{ komga_library_candidates }}"
  loop_control:
    label: "{{ item.name }}"

# Matched by root first, so a converged platform never depends on the migration
# input. The name match is consulted only while that input is set, which is what
# makes the root repair below reachable at all.
- name: Reset the Komga library reconciliation plan
  ansible.builtin.set_fact:
    komga_library_plan: []
  no_log: true

- name: Resolve the Komga library reconciliation plan
  ansible.builtin.set_fact:
    komga_library_plan: >-
      {{ komga_library_plan + [item | combine({'existing': (
           item.root_matches | first | default(
             (item.name_matches | first | default({}))
             if komga_library_root_migration_allowed | bool else {})
         )})] }}
  loop: "{{ komga_library_candidates }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Refuse overlapping Komga library targets
  ansible.builtin.assert:
    that:
      - >-
        (komga_library_plan | selectattr('existing') | map(attribute='existing.id')
         | unique | list | length) ==
        (komga_library_plan | selectattr('existing') | list | length)
    fail_msg: >-
      Two managed Komga libraries resolved to the same existing library. Resolve the conflict
      manually; no library was mutated.

- name: Resolve the Komga library creation plan
  ansible.builtin.set_fact:
    komga_library_creations: "{{ komga_library_plan | rejectattr('existing') | list }}"
  no_log: true

- name: Reset drifted owned Komga library settings
  ansible.builtin.set_fact:
    komga_library_setting_drift: {}
  no_log: true

- name: Resolve drifted owned Komga library settings
  ansible.builtin.set_fact:
    komga_library_setting_drift: >-
      {{ komga_library_setting_drift | combine({
           item.0.name: (komga_library_setting_drift[item.0.name] | default({}))
                        | combine({item.1.key: item.1.value})}) }}
  when:
    - item.1.key not in item.0.existing or item.0.existing[item.1.key] != item.1.value
  loop: "{{ komga_library_plan | selectattr('existing') | list | subelements('settings_items') }}"
  loop_control:
    label: komga-owned-library-setting
  no_log: true

- name: Reset the Komga library repair plan
  ansible.builtin.set_fact:
    komga_library_repairs: []
  no_log: true

- name: Resolve Komga library identity repair payloads
  ansible.builtin.set_fact:
    komga_library_repairs: >-
      {{ komga_library_repairs + [{
           'name': item.name,
           'id': item.existing.id,
           'body': ({}
             | combine({'name': item.name} if item.existing.name != item.name else {})
             | combine({'root': item.root} if item.existing.root != item.root else {})
             | combine(komga_library_setting_drift[item.name] | default({})))
         }] }}
  loop: "{{ komga_library_plan | selectattr('existing') | list }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Resolve the Komga library repair requirement
  ansible.builtin.set_fact:
    komga_library_repairs: "{{ komga_library_repairs | selectattr('body') | list }}"
  no_log: true

- name: Resolve Komga library reconciliation requirements
  ansible.builtin.set_fact:
    komga_library_create_required: "{{ komga_library_creations | length > 0 }}"
    komga_library_repair_required: "{{ komga_library_repairs | length > 0 }}"
    komga_library_root_moves: >-
      {{ komga_library_repairs | selectattr('body.root', 'defined') | map(attribute='name') | list }}
  no_log: true

# How the role says that this input is not a setting. It is reported on every run
# that carries it, including the run where it turns out to have nothing left to
# do, so a flag left on is visible in the output rather than silent.
- name: Report the one-convergence Komga library root migration input
  ansible.builtin.debug:
    msg: >-
      KOMGA_ROOT_MIGRATION_ALLOWED: pending library root moves
      {{ komga_library_root_moves }}. komga_library_root_migration_allowed is a one-convergence
      input, not a platform setting: drop it from the next run and never store it in a host
      variable file. An empty list here means it is already stale.
  when: komga_library_root_migration_allowed | bool
  changed_when: false

- name: Reconcile managed Komga users
  ansible.builtin.include_tasks: managed_users.yml
  vars:
    komga_managed_users_phase: reconcile
  when: not ansible_check_mode or komga_claim_status.json.isClaimed | bool

- name: Report planned Komga library creation
  ansible.builtin.debug:
    msg: "KOMGA_PLAN_LIBRARY_CREATE {{ komga_library_creations | map(attribute='name') | list }}"
  when:
    - ansible_check_mode
    - komga_library_create_required | bool
  changed_when: true

- name: Create the managed Komga library
  ansible.builtin.uri:
    url: "{{ komga_api }}/api/v1/libraries"
    method: POST
    url_username: "{{ vault_komga_admin_email }}"
    url_password: "{{ vault_komga_admin_password }}"
    force_basic_auth: true
    body_format: json
    body: "{{ {'name': item.name, 'root': item.root} | combine(item.settings) }}"
    status_code: [200]
  loop: "{{ komga_library_creations }}"
  loop_control:
    label: komga-library-creation
  when: not ansible_check_mode
  changed_when: true
  no_log: true

- name: Report planned Komga library repair
  ansible.builtin.debug:
    msg: "KOMGA_PLAN_LIBRARY_REPAIR {{ komga_library_repairs | map(attribute='name') | list }}"
  when:
    - ansible_check_mode
    - komga_library_repair_required | bool
  changed_when: true

- name: Repair the managed Komga library
  ansible.builtin.uri:
    url: >-
      {{ komga_api }}/api/v1/libraries/{{ item.id | urlencode }}
    method: PATCH
    url_username: "{{ vault_komga_admin_email }}"
    url_password: "{{ vault_komga_admin_password }}"
    force_basic_auth: true
    body_format: json
    body: "{{ item.body }}"
    status_code: [204]
  loop: "{{ komga_library_repairs }}"
  loop_control:
    label: komga-library-repair
  when: not ansible_check_mode
  changed_when: true
  no_log: true

- name: Read back Komga libraries after reconciliation
  ansible.builtin.uri:
    url: "{{ komga_api }}/api/v1/libraries"
    url_username: "{{ vault_komga_admin_email }}"
    url_password: "{{ vault_komga_admin_password }}"
    force_basic_auth: true
    status_code: [200]
    return_content: true
  register: komga_libraries_after
  when: not ansible_check_mode
  changed_when: false
  check_mode: false
  no_log: true

- name: Reset the authoritative Komga library read-back
  ansible.builtin.set_fact:
    komga_reconciled_libraries: []
  when: not ansible_check_mode
  no_log: true

- name: Resolve the authoritative Komga library read-back
  ansible.builtin.set_fact:
    komga_reconciled_libraries: >-
      {{ komga_reconciled_libraries + [item | combine({
           'root_matches': komga_libraries_after.json | default([])
             | selectattr('root', 'defined') | selectattr('root', 'string')
             | selectattr('root', 'regex',
                          '\A' ~ (item.normalized_root | regex_escape) ~ '(?<!/)/*\Z')
             | list,
           'name_matches': komga_libraries_after.json | default([])
             | selectattr('name', 'defined') | selectattr('name', 'string')
             | selectattr('name', 'equalto', item.name)
             | list
         })] }}
  loop: "{{ komga_library_plan }}"
  loop_control:
    label: "{{ item.name }}"
  when: not ansible_check_mode
  no_log: true

# Without this, an empty read-back would make the looped assert below vacuous:
# a task that iterates nothing reports success.
- name: Require a complete Komga library read-back
  ansible.builtin.assert:
    that:
      - komga_libraries_after.json | type_debug == 'list'
      - komga_reconciled_libraries | length == komga_desired_libraries | length
      - komga_desired_libraries | length > 0
    fail_msg: >-
      Komga returned an unsupported libraries response after reconciliation, or the read-back did
      not cover every managed library.
  when: not ansible_check_mode

# Deliberately not redacted. The conditions and the loop item read the library
# listing Komga returned plus the owned name, root and settings, none of which is
# credential material, and the fail_msg names the library that did not converge.
- name: Require exact reconciled Komga library
  ansible.builtin.assert:
    that:
      - item.root_matches | length == 1
      - item.name_matches | length == 1
      - item.root_matches[0].id == item.name_matches[0].id
      - item.root_matches[0].name == item.name
      - item.root_matches[0].root == item.root
      - >-
        (item.root_matches[0] | dict2items
         | selectattr('key', 'in', item.settings.keys())
         | items2dict) == item.settings
      - >-
        item.existing | length == 0 or
        item.root_matches[0].id == item.existing.id
    fail_msg: >-
      Komga did not authoritatively return one exact {{ item.name }} library at {{ item.root }}
      with the preserved identifier and owned settings.
  loop: "{{ komga_reconciled_libraries }}"
  loop_control:
    label: "{{ item.name }}"
  when: not ansible_check_mode

- name: Verify exact Komga administrator and libraries
  tags: [platform_verify_komga]
  ansible.builtin.uri:
    url: "{{ komga_api }}/{{ item }}"
    url_username: "{{ vault_komga_admin_email }}"
    url_password: "{{ vault_komga_admin_password }}"
    force_basic_auth: true
    status_code: [200]
    return_content: true
  loop: [api/v2/users/me, api/v1/libraries]
  register: komga_verify_state
  changed_when: false
  check_mode: false
  no_log: true

- name: Resolve exact Komga verification state
  tags: [platform_verify_komga]
  ansible.builtin.set_fact:
    komga_verified_admin: "{{ komga_verify_state.results[0].json }}"
    komga_verified_libraries: "{{ komga_verify_state.results[1].json }}"
  no_log: true

# This path reaches the same normalized model as reconciliation because the two
# tasks that build it are tagged. The (?<!/) lookbehind documented above is not
# decoration even so: it is what makes a root carrying a trailing slash match
# itself rather than nothing.
- name: Reset exact Komga verification matches
  tags: [platform_verify_komga]
  ansible.builtin.set_fact:
    komga_verified_library_matches: []
  no_log: true

- name: Resolve exact Komga verification matches
  tags: [platform_verify_komga]
  ansible.builtin.set_fact:
    komga_verified_library_matches: >-
      {{ komga_verified_library_matches + [item | combine({
           'root_matches': komga_verified_libraries
             | selectattr('root', 'defined') | selectattr('root', 'string')
             | selectattr('root', 'regex',
                          '\A' ~ (item.normalized_root | regex_escape) ~ '(?<!/)/*\Z')
             | list,
           'name_matches': komga_verified_libraries
             | selectattr('name', 'defined') | selectattr('name', 'string')
             | selectattr('name', 'equalto', item.name)
             | list
         })] }}
  loop: "{{ komga_desired_libraries }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Require the vault Komga administrator during exact verification
  tags: [platform_verify_komga]
  ansible.builtin.assert:
    that:
      - komga_verified_admin.email == vault_komga_admin_email
      - "'ADMIN' in komga_verified_admin.roles"
    fail_msg: The vault Komga administrator is absent or drifted.
  no_log: true

- name: Verify managed Komga users
  tags: [platform_verify_komga]
  ansible.builtin.include_tasks:
    file: managed_users.yml
    apply:
      tags: [platform_verify_komga]
  vars:
    komga_managed_users_phase: verify

- name: Require a complete Komga library verification
  tags: [platform_verify_komga]
  ansible.builtin.assert:
    that:
      - komga_verified_libraries | type_debug == 'list'
      - komga_desired_libraries | length > 0
      - komga_verified_library_matches | length == komga_desired_libraries | length
    fail_msg: The managed Komga library set could not be verified in full.

- name: Require exactly the managed Komga library
  tags: [platform_verify_komga]
  ansible.builtin.assert:
    that:
      - item.root_matches | length == 1
      - item.name_matches | length == 1
      - item.root_matches[0].id == item.name_matches[0].id
      - item.root_matches[0].name == item.name
      - item.root_matches[0].root == item.root
      - >-
        (item.root_matches[0] | dict2items
         | selectattr('key', 'in', item.settings.keys())
         | items2dict) == item.settings
    fail_msg: The managed Komga library is absent, duplicated at its root, conflicted, or drifted.
  loop: "{{ komga_verified_library_matches }}"
  loop_control:
    label: "{{ item.name }}"
