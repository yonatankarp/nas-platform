---
- name: Revalidate deployment paths before Komga runtime use
  ansible.builtin.include_role:
    name: deployment_bundle
    tasks_from: target
  vars:
    deployment_target_require_current_release: true
    deployment_target_extra_paths:
      - "{{ platform_current_dir }}/services/komga"
      - "{{ platform_current_dir }}/services/komga/compose.yml"
      - "{{ platform_current_dir }}/services/komga/compose.{{ platform_compose_kind }}.yml"
      - "{{ platform_current_dir }}/services/komga/compose.adoption.yml"
      - "{{ platform_runtime_dir }}/services/komga"
      - "{{ platform_runtime_dir }}/services/komga/.env"

- name: Check for a Komga platform override
  ansible.builtin.stat:
    path: "{{ platform_current_dir }}/services/komga/compose.{{ platform_compose_kind }}.yml"
  register: komga_platform_compose

- name: Select the Komga Compose definitions
  ansible.builtin.set_fact:
    komga_compose_files: >-
      {{ ['compose.yml'] +
         (komga_platform_compose.stat.exists
          | ternary(['compose.' ~ platform_compose_kind ~ '.yml'], [])) +
         ((platform_adoption_enabled | default(false) | bool)
          | ternary(['compose.adoption.yml'], [])) }}

- name: Render the Komga environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ platform_runtime_dir }}/services/komga/.env"
    mode: "0600"

- name: Deploy Komga
  community.docker.docker_compose_v2:
    project_src: "{{ platform_current_dir }}/services/komga"
    project_name: "{{ komga_compose_project_name }}"
    files: "{{ komga_compose_files }}"
    env_files: ["{{ platform_runtime_dir }}/services/komga/.env"]
    state: present
    wait: true
    wait_timeout: 180

- name: Wait for Komga application health
  ansible.builtin.uri:
    url: "{{ komga_api }}/actuator/health"
    method: GET
    status_code: [200]
    return_content: true
  register: komga_health
  until:
    - komga_health.json | default(none) is mapping
    - komga_health.json.status | default(none) == 'UP'
  retries: "{{ komga_health_retries }}"
  delay: "{{ komga_health_delay }}"
  changed_when: false
  check_mode: false

- name: Read Komga claim status
  ansible.builtin.uri:
    url: "{{ komga_api }}/api/v1/claim"
    return_content: true
  register: komga_claim_status
  until: komga_claim_status.status | default(0) == 200
  retries: 40
  delay: 3
  changed_when: false
  check_mode: false
  no_log: true

- name: Report planned Komga claim
  ansible.builtin.debug:
    msg: KOMGA_PLAN_CLAIM
  when:
    - ansible_check_mode
    - not komga_claim_status.json.isClaimed | bool
  changed_when: true

- name: Claim Komga with the vault administrator
  ansible.builtin.uri:
    url: "{{ komga_api }}/api/v1/claim"
    method: POST
    headers:
      X-Komga-Email: "{{ vault_komga_admin_email }}"
      X-Komga-Password: "{{ vault_komga_admin_password }}"
    status_code: [200]
  when:
    - not ansible_check_mode
    - not komga_claim_status.json.isClaimed | bool
  changed_when: true
  no_log: true

- name: Authenticate the vault Komga administrator
  ansible.builtin.uri:
    url: "{{ komga_api }}/api/v2/users/me"
    url_username: "{{ vault_komga_admin_email }}"
    url_password: "{{ vault_komga_admin_password }}"
    force_basic_auth: true
    status_code: "{{ range(100, 600) | list }}"
    return_content: true
  register: komga_reconcile_admin
  when: not ansible_check_mode or komga_claim_status.json.isClaimed | bool
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

- name: Resolve sanitized Komga administrator authentication status
  ansible.builtin.set_fact:
    komga_reconcile_admin_status: "{{ komga_reconcile_admin.status | default(0) | int }}"
  when: not ansible_check_mode or komga_claim_status.json.isClaimed | bool
  no_log: true

- name: Require the vault Komga administrator
  ansible.builtin.assert:
    that:
      - komga_reconcile_admin_status | int == 200
      - komga_reconcile_admin.json.email == vault_komga_admin_email
      - "'ADMIN' in komga_reconcile_admin.json.roles"
    fail_msg: >-
      The claimed Komga server does not accept the vault administrator or that account is not an
      administrator. Verify the preserved vault credentials in the Komga UI and rerun.
  when: not ansible_check_mode or komga_claim_status.json.isClaimed | bool
  no_log: true

- name: List Komga libraries for reconciliation
  ansible.builtin.uri:
    url: "{{ komga_api }}/api/v1/libraries"
    url_username: "{{ vault_komga_admin_email }}"
    url_password: "{{ vault_komga_admin_password }}"
    force_basic_auth: true
    status_code: [200]
    return_content: true
  register: komga_libraries_before
  when: not ansible_check_mode or komga_claim_status.json.isClaimed | bool
  changed_when: false
  check_mode: false
  no_log: true

- name: Require a complete Komga library listing
  ansible.builtin.assert:
    that:
      - komga_libraries_before.json | type_debug == 'list'
    fail_msg: >-
      Komga returned an unsupported libraries response; reconciliation requires the complete
      unpaginated array before any mutation.
  when: not ansible_check_mode or komga_claim_status.json.isClaimed | bool
  no_log: true

- name: Resolve normalized Komga library target
  ansible.builtin.set_fact:
    komga_library_normalized_root: "{{ komga_library_root | regex_replace('/+$', '') }}"
    komga_library_inventory: >-
      {{ komga_libraries_before.json
         if (not ansible_check_mode or komga_claim_status.json.isClaimed | bool) else [] }}
    komga_managed_root_matches: []
    komga_desired_name_matches: []
  no_log: true

- name: Require a valid Komga library target
  ansible.builtin.assert:
    that:
      - komga_library_name is string
      - komga_library_name | length > 0
      - komga_library_root is string
      - komga_library_root | length > 0
      - komga_library_normalized_root == komga_library_root
    fail_msg: The managed Komga library name and exact normalized API root are invalid.

- name: Resolve normalized Komga managed-root matches
  ansible.builtin.set_fact:
    komga_managed_root_matches: "{{ komga_managed_root_matches + [item] }}"
  when:
    - item is mapping
    - item.root is defined
    - item.root is string
    - item.root | regex_replace('/+$', '') == komga_library_normalized_root
  loop: "{{ komga_library_inventory }}"
  loop_control:
    label: komga-library-candidate
  no_log: true

- name: Resolve exact Komga desired-name matches
  ansible.builtin.set_fact:
    komga_desired_name_matches: "{{ komga_desired_name_matches + [item] }}"
  when:
    - item is mapping
    - item.name is defined
    - item.name is string
    - item.name == komga_library_name
  loop: "{{ komga_library_inventory }}"
  loop_control:
    label: komga-library-candidate
  no_log: true

- name: Require valid Komga library candidate schemas
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.name is string
      - item.name | length > 0
      - item.root is defined
      - item.root is string
      - item.root | length > 0
      - item.id is defined
      - item.id is string
      - item.id is match('^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$')
    fail_msg: A managed-root or desired-name Komga library candidate has an unsafe schema.
  loop: "{{ komga_managed_root_matches + komga_desired_name_matches }}"
  loop_control:
    label: komga-library-candidate
  no_log: true

- name: Refuse ambiguous Komga library candidates
  ansible.builtin.assert:
    that:
      - komga_managed_root_matches | length <= 1
      - komga_desired_name_matches | length <= 1
      - >-
        komga_desired_name_matches | length == 0 or
        (komga_desired_name_matches[0].root | regex_replace('/+$', '')) ==
          komga_library_normalized_root
    fail_msg: >-
      Komga library reconciliation is ambiguous: managed-root IDs
      {{ komga_managed_root_matches | map(attribute='id') | list }} and desired-name IDs
      {{ komga_desired_name_matches | map(attribute='id') | list }}. Resolve the conflict manually;
      no library was mutated.

- name: Resolve the existing managed Komga library
  ansible.builtin.set_fact:
    komga_existing_library: "{{ komga_managed_root_matches | first | default({}) }}"
    komga_library_create_required: >-
      {{ (ansible_check_mode and not komga_claim_status.json.isClaimed | bool) or
         komga_managed_root_matches | length == 0 }}
  no_log: true

- name: Resolve Komga library identity repair payload
  ansible.builtin.set_fact:
    komga_library_patch_body: >-
      {{ ({} |
          combine({'name': komga_library_name}
                  if komga_existing_library | length > 0 and
                     komga_existing_library.name != komga_library_name else {}) |
          combine({'root': komga_library_root}
                  if komga_existing_library | length > 0 and
                     komga_existing_library.root != komga_library_root else {})) }}
  no_log: true

- name: Resolve drifted owned Komga library settings
  ansible.builtin.set_fact:
    komga_library_patch_body: >-
      {{ komga_library_patch_body | combine({item.key: item.value}) }}
  when:
    - komga_existing_library | length > 0
    - item.key not in komga_existing_library or komga_existing_library[item.key] != item.value
  loop: "{{ komga_library_settings | dict2items }}"
  loop_control:
    label: komga-owned-library-setting
  no_log: true

- name: Resolve Komga library repair requirement
  ansible.builtin.set_fact:
    komga_library_repair_required: >-
      {{ komga_existing_library | length > 0 and komga_library_patch_body | length > 0 }}
  no_log: true

- name: Reconcile managed Komga users
  ansible.builtin.include_tasks: managed_users.yml
  vars:
    komga_managed_users_phase: reconcile
  when: not ansible_check_mode or komga_claim_status.json.isClaimed | bool

- name: Report planned Komga library creation
  ansible.builtin.debug:
    msg: KOMGA_PLAN_LIBRARY_CREATE
  when:
    - ansible_check_mode
    - komga_library_create_required | bool
  changed_when: true

- name: Create the managed Komga library
  ansible.builtin.uri:
    url: "{{ komga_api }}/api/v1/libraries"
    method: POST
    url_username: "{{ vault_komga_admin_email }}"
    url_password: "{{ vault_komga_admin_password }}"
    force_basic_auth: true
    body_format: json
    body: "{{ {'name': komga_library_name, 'root': komga_library_root} | combine(komga_library_settings) }}"
    status_code: [200]
  when:
    - not ansible_check_mode
    - komga_library_create_required | bool
  changed_when: true
  no_log: true

- name: Report planned Komga library repair
  ansible.builtin.debug:
    msg: KOMGA_PLAN_LIBRARY_REPAIR
  when:
    - ansible_check_mode
    - komga_library_repair_required | bool
  changed_when: true

- name: Repair the managed Komga library
  ansible.builtin.uri:
    url: >-
      {{ komga_api }}/api/v1/libraries/{{ komga_existing_library.id | urlencode }}
    method: PATCH
    url_username: "{{ vault_komga_admin_email }}"
    url_password: "{{ vault_komga_admin_password }}"
    force_basic_auth: true
    body_format: json
    body: "{{ komga_library_patch_body }}"
    status_code: [204]
  when:
    - not ansible_check_mode
    - komga_library_repair_required | bool
  changed_when: true
  no_log: true

- name: Read back Komga libraries after reconciliation
  ansible.builtin.uri:
    url: "{{ komga_api }}/api/v1/libraries"
    url_username: "{{ vault_komga_admin_email }}"
    url_password: "{{ vault_komga_admin_password }}"
    force_basic_auth: true
    status_code: [200]
    return_content: true
  register: komga_libraries_after
  when: not ansible_check_mode
  changed_when: false
  check_mode: false
  no_log: true

- name: Initialize authoritative Komga library read-back
  ansible.builtin.set_fact:
    komga_reconciled_root_matches: []
    komga_reconciled_name_matches: []
  when: not ansible_check_mode
  no_log: true

- name: Resolve authoritative Komga managed-root read-back
  ansible.builtin.set_fact:
    komga_reconciled_root_matches: "{{ komga_reconciled_root_matches + [item] }}"
  when:
    - not ansible_check_mode
    - item is mapping
    - item.root is defined
    - item.root is string
    - item.root | regex_replace('/+$', '') == komga_library_normalized_root
  loop: "{{ komga_libraries_after.json | default([]) }}"
  loop_control:
    label: komga-library-read-back
  no_log: true

- name: Resolve authoritative Komga desired-name read-back
  ansible.builtin.set_fact:
    komga_reconciled_name_matches: "{{ komga_reconciled_name_matches + [item] }}"
  when:
    - not ansible_check_mode
    - item is mapping
    - item.name is defined
    - item.name is string
    - item.name == komga_library_name
  loop: "{{ komga_libraries_after.json | default([]) }}"
  loop_control:
    label: komga-library-read-back
  no_log: true

- name: Require exact reconciled Komga library
  ansible.builtin.assert:
    that:
      - komga_libraries_after.json | type_debug == 'list'
      - komga_reconciled_root_matches | length == 1
      - komga_reconciled_name_matches | length == 1
      - komga_reconciled_root_matches[0].id == komga_reconciled_name_matches[0].id
      - komga_reconciled_root_matches[0].name == komga_library_name
      - komga_reconciled_root_matches[0].root == komga_library_root
      - >-
        (komga_reconciled_root_matches[0] | dict2items
         | selectattr('key', 'in', komga_library_settings.keys())
         | items2dict) == komga_library_settings
      - >-
        komga_existing_library | length == 0 or
        komga_reconciled_root_matches[0].id == komga_existing_library.id
    fail_msg: >-
      Komga did not authoritatively return one exact Comics library at the managed root with the
      preserved identifier and owned settings.
  when: not ansible_check_mode
  no_log: true

- name: Verify exact Komga administrator and libraries
  tags: [platform_verify_komga]
  ansible.builtin.uri:
    url: "{{ komga_api }}/{{ item }}"
    url_username: "{{ vault_komga_admin_email }}"
    url_password: "{{ vault_komga_admin_password }}"
    force_basic_auth: true
    status_code: [200]
    return_content: true
  loop: [api/v2/users/me, api/v1/libraries]
  register: komga_verify_state
  changed_when: false
  check_mode: false
  no_log: true

- name: Resolve exact Komga verification state
  tags: [platform_verify_komga]
  ansible.builtin.set_fact:
    komga_verified_admin: "{{ komga_verify_state.results[0].json }}"
    komga_verified_libraries: "{{ komga_verify_state.results[1].json }}"
    komga_verified_root_library: []
    komga_verified_named_library: []
  no_log: true

- name: Resolve normalized Komga verification root matches
  tags: [platform_verify_komga]
  ansible.builtin.set_fact:
    komga_verified_root_library: "{{ komga_verified_root_library + [item] }}"
  when:
    - item is mapping
    - item.root is defined
    - item.root is string
    - item.root | regex_replace('/+$', '') == komga_library_root
  loop: "{{ komga_verified_libraries }}"
  loop_control:
    label: komga-library-verification
  no_log: true

- name: Resolve exact Komga verification name matches
  tags: [platform_verify_komga]
  ansible.builtin.set_fact:
    komga_verified_named_library: "{{ komga_verified_named_library + [item] }}"
  when:
    - item is mapping
    - item.name is defined
    - item.name is string
    - item.name == komga_library_name
  loop: "{{ komga_verified_libraries }}"
  loop_control:
    label: komga-library-verification
  no_log: true

- name: Require the vault Komga administrator during exact verification
  tags: [platform_verify_komga]
  ansible.builtin.assert:
    that:
      - komga_verified_admin.email == vault_komga_admin_email
      - "'ADMIN' in komga_verified_admin.roles"
    fail_msg: The vault Komga administrator is absent or drifted.
  no_log: true

- name: Verify managed Komga users
  tags: [platform_verify_komga]
  ansible.builtin.include_tasks:
    file: managed_users.yml
    apply:
      tags: [platform_verify_komga]
  vars:
    komga_managed_users_phase: verify

- name: Require exactly the managed Komga library
  tags: [platform_verify_komga]
  ansible.builtin.assert:
    that:
      - komga_verified_root_library | length == 1
      - komga_verified_named_library | length == 1
      - komga_verified_root_library[0].id == komga_verified_named_library[0].id
      - komga_verified_root_library[0].name == komga_library_name
      - komga_verified_root_library[0].root == komga_library_root
      - >-
        (komga_verified_root_library[0] | dict2items
         | selectattr('key', 'in', komga_library_settings.keys())
         | items2dict) == komga_library_settings
    fail_msg: The managed Komga library is absent, duplicated at its root, conflicted, or drifted.
