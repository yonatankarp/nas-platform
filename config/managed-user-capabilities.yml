---
schema: 1
services:
  # AdGuard Home keeps its whole user list inside AdGuardHome.yaml, and
  # roles/adguard renders that file entire on every converge from the vault. So
  # this is the platform's first `preserves_unmanaged_users: false`, and it is a
  # property of the service rather than an unfinished reconciliation: an account
  # added in the web interface is not merged with the declared one, it is
  # removed by the next converge. That is the same act that reverts every other
  # kind of drift here, and for a service that can rewrite any DNS answer on the
  # network it is the behaviour that was wanted.
  #
  # `password_rotation: refuse` and `existing_identity_password_update:
  # forbidden` read the same as everywhere else and mean the same thing: this
  # platform never asks the service to change a password. What it does is
  # declare one. Rotating the AdGuard administrator means authoring a new
  # bcrypt hash in the vault, and the next converge renders it -- there is no
  # API call and no in-place update.
  #
  # The hash is stored, never computed: bcrypt salts randomly, so hashing at
  # converge time would rewrite the file on every run.
  adguard:
    preserves_unmanaged_users: false
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: declarative_file
    interfaces:
      list: AdGuardHome.yaml users
      create: AdGuardHome.yaml users
      authenticate: HTTP Basic authentication
      reconcile: AdGuardHome.yaml users
  arr:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: api
    interfaces:
      list: Servarr config/host and Bazarr system/settings
      create: deterministic first-start configuration
      authenticate: X-Api-Key
      reconcile: Servarr config/host and Bazarr system/settings
  audiobookshelf:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: api
    interfaces:
      list: api/users
      create: api/users
      authenticate: login
      reconcile: api/users/{id}
  beszel:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: api
    interfaces:
      list: PocketBase users collection
      create: PocketBase users collection
      authenticate: PocketBase users collection
      reconcile: PocketBase users collection
  dozzle:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: declarative_file
    interfaces:
      list: data/users.yml
      create: data/users.yml
      authenticate: api/token
      reconcile: data/users.yml
  downloaders:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: api
    interfaces:
      list: SABnzbd get_config
      create: deterministic first-start configuration
      authenticate: SABnzbd API key
      reconcile: SABnzbd set_config
  immich:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: api
    interfaces:
      list: admin/users
      create: admin/users
      authenticate: auth/login
      reconcile: admin/users
  jellyfin:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: api
    interfaces:
      list: Users
      create: Users/New
      authenticate: Users/AuthenticateByName
      reconcile: Users/{id}/Policy
  komga:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: api
    interfaces:
      list: api/v2/users
      create: api/v2/users
      authenticate: api/v2/users/me
      reconcile: api/v2/users/{id}
  ntfy:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: declarative_environment
    interfaces:
      list: NTFY_AUTH_USERS and ntfy user list
      create: NTFY_AUTH_USERS/NTFY_AUTH_ACCESS/NTFY_AUTH_TOKENS
      authenticate: Basic authentication
      reconcile: NTFY_AUTH_USERS/NTFY_AUTH_ACCESS/NTFY_AUTH_TOKENS
  paperless-ngx:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: django_cli
    interfaces:
      list: get_user_model
      create: get_user_model
      authenticate: api/token
      reconcile: get_user_model
  bindery:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: api
    interfaces:
      list: api/v1/auth/users
      create: api/v1/auth/users
      authenticate: api/v1/auth/login
      reconcile: api/v1/auth/users
  kapowarr:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: single_identity_settings
    interfaces:
      list: api/public
      create: api/settings
      authenticate: api/auth
      reconcile: api/settings
  pinchflat:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: declarative_environment
    interfaces:
      list: BASIC_AUTH_USERNAME
      create: BASIC_AUTH_USERNAME/BASIC_AUTH_PASSWORD
      authenticate: Basic authentication
      reconcile: BASIC_AUTH_USERNAME/BASIC_AUTH_PASSWORD
  # Trailarr has one identity and no user API. Both halves are os.getenv
  # properties, so the environment is the whole mechanism — with the caveat
  # that its own /config/.env is sourced over that environment at every start,
  # which is why the role owns that file too. WEBUI_PASSWORD is a bcrypt hash
  # compared with checkpw, never a plaintext.
  trailarr:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: declarative_environment
    interfaces:
      list: WEBUI_USERNAME
      create: WEBUI_USERNAME/WEBUI_PASSWORD
      authenticate: api/v1/auth/login
      reconcile: WEBUI_USERNAME/WEBUI_PASSWORD
  # Seerr has a user API and no passwords at all. Both identities are Jellyfin
  # identities: the owner is created by signing in to Jellyfin as the vault
  # administrator, and the household member is imported by Jellyfin GUID. Seerr
  # stores no local password for either, so there is nothing to rotate here —
  # rotating the Jellyfin password rotates both.
  seerr:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: api
    interfaces:
      list: api/v1/user
      create: api/v1/user/import-from-jellyfin
      authenticate: X-Api-Key
      reconcile: api/v1/user/{id}/settings/permissions
  # Nextcloud has one identity and no managed non-administrator users. The
  # administrator is declared entirely in the environment and consumed narrowly:
  # the entrypoint's install block runs only while the volume holds no
  # version.php. Unlike a service whose environment is the only path -- Seafile,
  # removed in #501, was this platform's example -- occ can reset the password of
  # an account that already exists, so this service has a real reconcile
  # interface rather than none.
  #
  # It is named as conditional because that is what roles/nextcloud does.
  # Resetting a password re-hashes it and invalidates the sessions derived from
  # it, and the poller converges every five minutes, so the role presents the
  # vault credential over OCS first and repairs only on a 401.
  nextcloud:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: declarative_environment
    interfaces:
      list: NEXTCLOUD_ADMIN_USER
      create: NEXTCLOUD_ADMIN_USER/NEXTCLOUD_ADMIN_PASSWORD
      authenticate: ocs/v2.php/cloud/user
      reconcile: occ user:resetpassword, on an authentication failure only
  # THE ONE SERVICE WHERE THIS PLATFORM MANAGES NO IDENTITY AT ALL, and the
  # register has to be able to say so. Every other row here describes how Ansible
  # declares an identity and what it will and will not do to reconcile one.
  # Vaultwarden inverts that: a master password is user-owned by construction,
  # the server never learns it, and that zero-knowledge property is the entire
  # reason to run the service. There is no account for Ansible to declare, no
  # credential in the vault, and nothing for a reconciliation to compare against.
  #
  # `mode: user_owned` is a new value rather than a stretch of an existing one,
  # and the stretch was the temptation. `declarative_environment` -- Pinchflat's,
  # Trailarr's, Nextcloud's -- would claim the identity is declared in the
  # environment, and here the environment declares only the DOOR:
  # SIGNUPS_ALLOWED, INVITATIONS_ALLOWED and DOMAIN. Reusing it would be a false
  # statement about what roles/vaultwarden does, which is precisely what this
  # register exists to prevent.
  #
  # The three shared verdicts are true for the ordinary reason and not by
  # accident. preserves_unmanaged_users is true because this platform removes no
  # account it did not create, and it created none. password_rotation is refuse
  # and existing_identity_password_update is forbidden because Ansible cannot
  # rotate what it cannot read -- here that is not a policy this platform chose
  # to adopt, it is a property of the service, and adopting the opposite would
  # mean the server learning a master password.
  #
  # There is no ADMIN_TOKEN either, which is what would otherwise give this row
  # an administrative interface. Omitting it disables the /admin panel, whose
  # config.json would outrank every value the role renders;
  # services/vaultwarden/compose.yml carries that measurement.
  vaultwarden:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: user_owned
    interfaces:
      list: none; the account list needs an admin token this deployment omits
      create: invitation issued in the web vault, completed by the invitee
      authenticate: master password, which the server never learns
      reconcile: none; a master password is not readable or writable from here
