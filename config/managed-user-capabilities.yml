---
schema: 1
services:
  arr:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: api
    interfaces:
      list: Servarr config/host and Bazarr system/settings
      create: deterministic first-start configuration
      authenticate: X-Api-Key
      reconcile: Servarr config/host and Bazarr system/settings
  audiobookshelf:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: api
    interfaces:
      list: api/users
      create: api/users
      authenticate: login
      reconcile: api/users/{id}
  beszel:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: api
    interfaces:
      list: api/collections/users/records?perPage=500
      create: api/collections/users/records
      authenticate: api/collections/users/auth-with-password
      reconcile: api/collections/users/records/{id}
  dozzle:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: declarative_file
    interfaces:
      list: data/users.yml
      create: data/users.yml
      authenticate: api/token
      reconcile: data/users.yml
  downloaders:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: api
    interfaces:
      list: SABnzbd get_config
      create: deterministic first-start configuration
      authenticate: SABnzbd API key
      reconcile: SABnzbd set_config
  immich:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: api
    interfaces:
      list: admin/users?withDeleted=true
      create: admin/users
      authenticate: auth/login
      reconcile: admin/users/{id}
  jellyfin:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: api
    interfaces:
      list: Users
      create: Users/New
      authenticate: Users/AuthenticateByName
      reconcile: Users/{id}/Policy
  komga:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: api
    interfaces:
      list: api/v2/users
      create: api/v2/users
      authenticate: api/v2/users/me
      reconcile: api/v2/users/{id}
  paperless-ngx:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: django_cli
    interfaces:
      list: get_user_model
      create: get_user_model
      authenticate: api/token
      reconcile: get_user_model
  bindery:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: api
    interfaces:
      list: api/v1/auth/users
      create: api/v1/auth/users
      authenticate: api/v1/auth/login
      reconcile: api/v1/auth/users
  kapowarr:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: single_identity_settings
    interfaces:
      list: api/public
      create: api/settings
      authenticate: api/auth
      reconcile: api/settings
  pinchflat:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: declarative_environment
    interfaces:
      list: BASIC_AUTH_USERNAME
      create: BASIC_AUTH_USERNAME/BASIC_AUTH_PASSWORD
      authenticate: Basic authentication
      reconcile: BASIC_AUTH_USERNAME/BASIC_AUTH_PASSWORD
  # Trailarr: environment only, but its own /config/.env is sourced over it at
  # every start, so the role owns that file too. WEBUI_PASSWORD is a bcrypt hash.
  trailarr:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: declarative_environment
    interfaces:
      list: WEBUI_USERNAME
      create: WEBUI_USERNAME/WEBUI_PASSWORD
      authenticate: api/v1/auth/login
      reconcile: WEBUI_USERNAME/WEBUI_PASSWORD
  # Seerr stores no passwords: both identities are Jellyfin identities, so
  # rotating the Jellyfin password rotates both.
  seerr:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: api
    interfaces:
      list: api/v1/user
      create: api/v1/user/import-from-jellyfin
      authenticate: X-Api-Key
      reconcile: api/v1/user/{id}/settings/permissions
  # Nextcloud: the install block runs only while the volume has no version.php;
  # occ resets an existing password afterwards. Conditional because a reset
  # invalidates sessions, so the role tries the vault credential first (OCS).
  nextcloud:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: declarative_environment
    interfaces:
      list: NEXTCLOUD_ADMIN_USER
      create: NEXTCLOUD_ADMIN_USER/NEXTCLOUD_ADMIN_PASSWORD
      authenticate: ocs/v2.php/cloud/user
      reconcile: occ user:resetpassword, on an authentication failure only
  # Karakeep cannot seed its administrator from the environment: the role
  # registers it through the API on first start, and never resets it afterwards.
  karakeep:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: api
    interfaces:
      list: api/trpc/users.list
      create: api/trpc/users.create, first account only, signups open on loopback
      authenticate: api/auth/callback/credentials
      reconcile: none; a password that no longer signs in fails the converge
  # Vaultwarden: no managed identity at all. Master passwords are user-owned and
  # never reach the server, so `user_owned` rather than `declarative_environment`,
  # whose environment here declares only the door (SIGNUPS_ALLOWED and friends).
  vaultwarden:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: user_owned
    interfaces:
      list: none; the account list needs an admin token this deployment omits
      create: invitation issued in the web vault, completed by the invitee
      authenticate: master password, which the server never learns
      reconcile: none; a master password is not readable or writable from here
