---
schema: 1
services:
  arr:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: api
    interfaces:
      list: Servarr config/host and Bazarr system/settings
      create: deterministic first-start configuration
      authenticate: X-Api-Key
      reconcile: Servarr config/host and Bazarr system/settings
  audiobookshelf:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: api
    interfaces:
      list: api/users
      create: api/users
      authenticate: login
      reconcile: api/users/{id}
  beszel:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: api
    interfaces:
      list: PocketBase users collection
      create: PocketBase users collection
      authenticate: PocketBase users collection
      reconcile: PocketBase users collection
  dozzle:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: declarative_file
    interfaces:
      list: data/users.yml
      create: data/users.yml
      authenticate: api/token
      reconcile: data/users.yml
  downloaders:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: api
    interfaces:
      list: SABnzbd get_config
      create: deterministic first-start configuration
      authenticate: SABnzbd API key
      reconcile: SABnzbd set_config
  immich:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: api
    interfaces:
      list: admin/users
      create: admin/users
      authenticate: auth/login
      reconcile: admin/users
  jellyfin:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: api
    interfaces:
      list: Users
      create: Users/New
      authenticate: Users/AuthenticateByName
      reconcile: Users/{id}/Policy
  komga:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: api
    interfaces:
      list: api/v2/users
      create: api/v2/users
      authenticate: api/v2/users/me
      reconcile: api/v2/users/{id}
  ntfy:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: declarative_environment
    interfaces:
      list: NTFY_AUTH_USERS and ntfy user list
      create: NTFY_AUTH_USERS/NTFY_AUTH_ACCESS/NTFY_AUTH_TOKENS
      authenticate: Basic authentication
      reconcile: NTFY_AUTH_USERS/NTFY_AUTH_ACCESS/NTFY_AUTH_TOKENS
  paperless-ngx:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: django_cli
    interfaces:
      list: get_user_model
      create: get_user_model
      authenticate: api/token
      reconcile: get_user_model
  bindery:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: api
    interfaces:
      list: api/v1/auth/users
      create: api/v1/auth/users
      authenticate: api/v1/auth/login
      reconcile: api/v1/auth/users
  kapowarr:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: single_identity_settings
    interfaces:
      list: api/public
      create: api/settings
      authenticate: api/auth
      reconcile: api/settings
  pinchflat:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: declarative_environment
    interfaces:
      list: BASIC_AUTH_USERNAME
      create: BASIC_AUTH_USERNAME/BASIC_AUTH_PASSWORD
      authenticate: Basic authentication
      reconcile: BASIC_AUTH_USERNAME/BASIC_AUTH_PASSWORD
  # Trailarr has one identity and no user API. Both halves are os.getenv
  # properties, so the environment is the whole mechanism — with the caveat
  # that its own /config/.env is sourced over that environment at every start,
  # which is why the role owns that file too. WEBUI_PASSWORD is a bcrypt hash
  # compared with checkpw, never a plaintext.
  trailarr:
    preserves_unmanaged_users: true
    password_rotation: refuse
    existing_identity_password_update: forbidden
    mode: declarative_environment
    interfaces:
      list: WEBUI_USERNAME
      create: WEBUI_USERNAME/WEBUI_PASSWORD
      authenticate: api/v1/auth/login
      reconcile: WEBUI_USERNAME/WEBUI_PASSWORD
