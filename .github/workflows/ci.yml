  toolchain:
    # The controller toolchain, built once and published to ghcr.io instead of
    # installed inside every suite leg. The tag is a digest of the harness's pins,
    # tests/integration.Dockerfile and requirements.yml, so a bumped pin is a new
    # tag rather than a stale layer, and this job is a registry probe on every run
    # that changes none of them. There is deliberately no actions/cache and no
    # type=gha layer cache: a content-addressed tag only misses when its inputs
    # changed, and then the layer cache would be cold too. The registry is the
    # cache.
    #
    # Nothing depends on this succeeding. tests/integration.sh builds the image
    # locally when it cannot pull one, and installs the toolchain inside the run
    # when it cannot build one. That is why the suites matrix below drops the
    # implicit success gate `needs` carries, and why tests/ci/validate_results.rb
    # names this job non-blocking: a registry hiccup must cost time rather than a
    # verdict, so the aggregate check reports the failure instead of failing on it.
    timeout-minutes: 20
    # No `needs`, so this starts with `changes` rather than behind it -- every
    # lane's start is this job's finish, and it was ordering a registry probe
    # behind a classification it barely reads. CLAUDE.md's "`toolchain` no longer
    # waits for `changes`" carries the measurement and what dropping the
    # `suites != '[]'` term costs.
    #
    # A fork's GITHUB_TOKEN is read-only, so no packages: write scope exists for it
    # to publish with. Skipping is the honest outcome: the fork's suites then take
    # the same local-build path a developer's machine takes.
    if: ${{ github.event.pull_request.head.repo.fork != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The harness owns the tag, the build arguments and the skip: naming them
      # here as well is how the published image and the image the suites look for
      # would drift apart.
      - name: Publish the controller toolchain image
        env:
          INTEGRATION_TOOLCHAIN_PUBLISH: '1'
        run: tests/integration.sh

  suites:
    # 90 rather than 60 because idempotence-check's own work grew when its guard
    # started doing its job, and a lane killed at its ceiling would read as the fix
    # regressing rather than as the guard working. docs/ci-performance-history.md, "A guard
    # that was green while proving 6% of what it claimed", carries the numbers.
    timeout-minutes: 90
    name: ${{ matrix.suite }}
    needs:
      - changes
      - toolchain
    # The toolchain is an optimization, never a precondition, so a lane still runs
    # when publishing failed or was skipped -- it builds the image itself instead.
    # Dropping the implicit success gate that `needs` carries is what forces the
    # explicit changes result term: without it a failed classification would reach
    # the matrix as an empty selection rather than as a skip.
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.suites != '[]' }}
    runs-on: ubuntu-latest
    # A job-level block REPLACES the workflow-level one instead of merging with
    # it, which is why contents: read is restated: without it actions/checkout
    # loses the scope it needs. packages: read is intent rather than a functional
    # requirement -- every ghcr.io image the plays pull is a third-party public
    # package, which needs no token scope at all -- and is what keeps a future
    # move to a package this repository owns from failing with a permissions
    # error instead of working.
    permissions:
      contents: read
      packages: read
    # Read at job level rather than inside the step because a step's `if` is
    # evaluated before that step's own env block exists. This carries no secret
    # value into the log: it is present-or-absent that the guard below reads.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.changes.outputs.suites) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Anonymous ghcr.io pulls draw on an allowance scoped to the runner's IP and
      # shared with every other GitHub Actions job on that address, which is why a
      # converge that pulls nothing unusual can still fail with "toomanyrequests"
      # (PR #84, 2026-08-21). The job's own GITHUB_TOKEN moves the pulls onto a
      # per-account allowance this repository is the only consumer of.
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # lscr.io is linuxserver.io's front door onto that same registry -- its
      # challenge names realm="https://ghcr.io/token" service="ghcr.io", so a
      # GitHub credential redeems it. The Docker CLI keys credentials by the host
      # it was asked for, so the login above does not reach an lscr.io pull, and
      # seven of the images the plays pull are lscr.io ones: every arr and every
      # downloader. Without this they stay on the anonymous per-IP allowance.
      - name: Authenticate to the linuxserver.io registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: lscr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Eleven of the images the plays pull are docker.io ones. Anonymous Hub pulls
      # are 100 per six hours scoped to the runner's IPv4 address or IPv6 /64 --
      # the same shared bucket as above -- against 200 for a free account that only
      # this repository spends, so the isolation matters more than the doubling.
      # This is the one login needing a stored credential: GITHUB_TOKEN is not a
      # Docker Hub account.
      #
      # Guarded on the secret being set. Authentication is an optimization over the
      # anonymous allowance, never a precondition for it, so a checkout without the
      # secret -- a fork PR, a clone -- pulls exactly as it did before this step
      # existed instead of failing at login.
      - name: Authenticate to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Run integration suite
        env:
          SUITE: ${{ matrix.suite }}
          SELECTED_TAGS: ${{ needs.changes.outputs.selected_tags }}
          # The upgrade lane's two inputs. The classifier resolves them from the
          # same diff it routes on, in the one job that checks out at
          # fetch-depth 0 -- this job takes actions/checkout's default depth of
          # 1, so the base revision is not readable from here. They are empty
          # for every other lane, and the harness refuses the upgrade lane
          # without both.
          INTEGRATION_UPGRADE_SERVICE: ${{ needs.changes.outputs.upgrade_service }}
          INTEGRATION_UPGRADE_BASE_IMAGE: ${{ needs.changes.outputs.upgrade_base_image }}
          # The upgrade lane's tags are its SUBJECT's and not the run's:
          # SELECTED_TAGS is the union of every tagged lane, and a fall-open
          # empties it, which would converge the whole site twice for a
          # one-service proof.
          UPGRADE_TAGS: ${{ needs.changes.outputs.upgrade_tags }}
        run: |
          case "$SUITE" in
            upgrade)
              # Refused rather than degraded. An empty value here is the
              # untagged branch by another route, and the failure it would
              # produce -- a 30-minute lane converging the whole site -- reads
              # as the lane being slow rather than as a classifier that emitted
              # no subject tags.
              if [ -z "$UPGRADE_TAGS" ]; then
                echo 'the upgrade lane was dispatched with no subject tags' >&2
                exit 1
              fi
              tests/integration.sh --suite "$SUITE" --tags "$UPGRADE_TAGS" site.yml
              ;;
            smoke|idempotence-check)
              if [ -n "$SELECTED_TAGS" ]; then
                tests/integration.sh --suite "$SUITE" --tags "$SELECTED_TAGS" site.yml
              else
                tests/integration.sh --suite "$SUITE" site.yml
              fi
              ;;
            *)
              tests/integration.sh --suite "$SUITE" site.yml
              ;;
          esac

  validate:
    timeout-minutes: 10
    name: validate
    if: ${{ always() }}
    needs:
      - changes
      - static
      - lint
      - docs
      - vault
      - mutation
      - reconciliation
      - toolchain
      - suites
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate job results
        run: |
          ruby tests/ci/validate_results.rb \
            changes="${{ needs.changes.result }}" \
            static="${{ needs.static.result }}" \
            lint="${{ needs.lint.result }}" \
            docs="${{ needs.docs.result }}" \
            vault="${{ needs.vault.result }}" \
            mutation="${{ needs.mutation.result }}" \
            reconciliation="${{ needs.reconciliation.result }}" \
            toolchain="${{ needs.toolchain.result }}" \
            suites="${{ needs.suites.result }}"

      # DELIBERATE DUPLICATION -- do not remove this step because the same check
      # already runs in the gate. That removal is the defect #480 filed. The
      # other route is one line of shard 1 of the policy gate's manifest, whose
      # preamble carries the other half of this comment.
      #
      # tests/ci/workflow_test.rb pins this workflow's shape, `static` included.
      # Run only from the gate it is a check inside the job it guards: gate
      # `static` on `if: false`, delete it, or empty its matrix, and the objection
      # stops running along with the thing it objects to, leaving `static` as a
      # legitimately-allowed `skipped` and the run green. It runs here because this
      # job cannot be skipped, so no edit to another job's condition, matrix or
      # existence can suppress it, and it costs a second. Each copy catches the
      # loss of the other, and the check asserts both directions itself.
      - name: Pin the workflow's own shape
        run: ruby tests/ci/workflow_test.rb
