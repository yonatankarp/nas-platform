          # blank entry with a 24-hour expiry first, its `results` filled in when
          # the response arrives. _call_galaxy writes that entry *before* issuing
          # the request and retries six deep around it, so one transient HTTP
          # error re-enters, finds its own blank entry unexpired and refuses --
          # a single flaky request reds a leg no diff caused, from a clean cache,
          # in one sequential process. An ephemeral runner HOME is no protection.
          # This step is the only reader of what it writes, so declining the
          # cache costs it nothing. ansible-lint used to install collections a
          # second time from inside itself, which this flag cannot reach; the
          # `lint` job passes --offline so that call no longer happens and this
          # is the only galaxy call in every job (#719).
          #
          # Retried because --no-cache closes a corrupt cache and does nothing for
          # a TCP reset: `Connection reset by peer` from galaxy.ansible.com red a
          # leg three times in eighteen hours, each green on an unchanged re-run,
          # and on `main` a red run holds the poller back with nothing reporting
          # it (#747). Three attempts, ten then twenty seconds apart, cover a
          # blip; a failure that outlasts them is no longer transient and still
          # reds the step, with every attempt's error left in the log above it.
          # The attempt sits in an `if` because the step runs under `bash -e`,
          # which would otherwise end it at the first failure. `tests/ci/workflow_test.rb`
          # runs this loop against a stubbed ansible-galaxy.
          for attempt in 1 2 3; do
            if "$RUNNER_TEMP/ansible/bin/ansible-galaxy" collection install --no-cache -r requirements.yml; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::ansible-galaxy collection install failed $attempt times; not transient (#747)" >&2
              exit 1
            fi
            echo "ansible-galaxy collection install failed (attempt $attempt of 3); retrying" >&2
            sleep $((attempt * 10))
          done

      - name: Check silent ephemeral vault generation
        run: |
          self_test_log=$(mktemp)
          trap 'rm -f "$self_test_log"' EXIT
          if ! tests/generate-ephemeral-vault.sh --self-test >"$self_test_log" 2>&1; then
            cat "$self_test_log" >&2
            exit 1
          fi
          test ! -s "$self_test_log"

      # --offline stops ansible-compat's own galaxy install, which no --no-cache reaches
      # (#719), and the schema refresh. On the CLI rather than in .ansible-lint so a
      # developer's bare ansible-lint still installs collections itself.
      - name: Lint Ansible
        run: ansible-lint --strict --offline

      - name: Check playbook syntax
        run: |
          ansible-playbook -i inventory/local.yml site.yml --syntax-check
          ansible-playbook generate-secrets.yml --syntax-check
          ansible-playbook -i inventory/local.yml install-production-auto-deploy.yml --syntax-check

      # Only Renovate's own validator knows its schema (#775). --strict because a
      # deprecation only warns; the #775 plant below stays non-strict to prove the
      # refusal is still an error. A custom manager in renovate.json tracks the pin.
      - name: Validate the Renovate configuration
        run: |
          renovate_pin=renovate@44.117.1
          npx --yes --package "$renovate_pin" renovate-config-validator --strict

          # A check that has only ever passed proves nothing, and this one is
          # bumped by a bot: a Renovate release demoting that refusal to a
          # warning would leave this step green over a config Renovate rejects.
          # So show it #775's exact spelling and require it to still fail.
          # packageRules[-1] is that rule: tests/renovate_policy_test.rb asserts
          # the batching group is last, so this plants on the rule #771 broke.
          planted="$(mktemp -d)"
          python3 - "$planted/renovate.json" <<'PY'
          import json
          import sys

          config = json.load(open("renovate.json"))
          rule = config["packageRules"][-1]
          rule["matchPackageNames"] = ["*"] + rule["matchPackageNames"]
          json.dump(config, open(sys.argv[1], "w"))
          PY
          if (cd "$planted" && npx --yes --package "$renovate_pin" renovate-config-validator); then
            echo "renovate-config-validator accepted #775's config; it no longer guards against it" >&2
            exit 1
          fi

  docs:
    # Markdown-only checks on the runner's Ruby. The gate runs them too, because a
    # code rename can break a link.
    timeout-minutes: 10
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-26.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check documentation links
        run: |
          ruby tests/docs_links_test.rb
          ruby tests/docs_links_test.rb --self-test

      - name: Check the secrets guide against the vault contract
        run: ruby tests/secrets_docs_test.rb

  vault:
    # Runs the poller's own validate-vault.yml argv (_vault_arguments in
    # scripts/production_auto_deploy.py; tests/ci/workflow_test.rb compares them).
    # A real run, not --check: the claim is that the host's own command succeeds.
    timeout-minutes: 15
    needs: changes
    if: ${{ needs.changes.outputs.vault == 'true' }}
    runs-on: ubuntu-26.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Python comes from .python-version (ansible-core needs 3.12+, #655); this pair
      # is held byte-identical across five jobs, so no version literal here.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install Ansible tooling
        run: |
          # All three ship in the runner image, so this normally installs
          # nothing. Guarded because an unconditional apt-get update stalled
          # mid-download for 161 minutes on 2026-08-19; the guard still recovers
          # automatically if the image ever drops them.
          if ! command -v htpasswd >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install --yes apache2-utils openssh-client openssl
          fi
