          # and on `main` a red run holds the poller back with nothing reporting
          # it (#747). Three attempts, ten then twenty seconds apart, cover a
          # blip; a failure that outlasts them is no longer transient and still
          # reds the step, with every attempt's error left in the log above it.
          # The attempt sits in an `if` because the step runs under `bash -e`,
          # which would otherwise end it at the first failure. `tests/ci/workflow_test.rb`
          # runs this loop against a stubbed ansible-galaxy.
          for attempt in 1 2 3; do
            if "$RUNNER_TEMP/ansible/bin/ansible-galaxy" collection install --no-cache -r requirements.yml; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::ansible-galaxy collection install failed $attempt times; not transient (#747)" >&2
              exit 1
            fi
            echo "ansible-galaxy collection install failed (attempt $attempt of 3); retrying" >&2
            sleep $((attempt * 10))
          done

      # Needs the gate's toolchain. The bare form is written first because a mutation
      # row plants its removal at the first mention of it here; an unnamed event fails.
      - name: Check policy mutation coverage
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          case "$EVENT_NAME" in
            pull_request|push)
              ruby tests/policy_manifest_test.rb
              ;;
            schedule|workflow_dispatch)
              ruby tests/policy_manifest_test.rb --audit
              ;;
            *)
              echo "::error::no mutation harness form declared for event '$EVENT_NAME'" >&2
              exit 1
              ;;
          esac

  reconciliation:
    # One runner per file: the contract is 373 Ansible runs and costs its slowest file.
    timeout-minutes: 45
    name: reconciliation (${{ matrix.part }})
    needs: changes
    # Routed rather than gated on `static`, which is true whenever any lane runs.
    if: ${{ needs.changes.outputs.reconciliation == 'true' }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        part: [core, bazarr, configarr]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Python comes from .python-version (ansible-core needs 3.12+, #655); this pair
      # is held byte-identical across five jobs, so no version literal here.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install Ansible tooling
        run: |
          # All three ship in the runner image, so this normally installs
          # nothing. Guarded because an unconditional apt-get update stalled
          # mid-download for 161 minutes on 2026-08-19; the guard still recovers
          # automatically if the image ever drops them.
          if ! command -v htpasswd >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install --yes apache2-utils openssh-client openssl
          fi
          #
          # Never name a version here: five jobs carry this block byte-identically,
          # and the pins are authored in controller-requirements.in alone (CLAUDE.md).
          # controller-requirements.txt is the lock compiled from it, a hash on every
          # entry, and --require-hashes refuses one that lost it (#827).
          python3 -m venv "$RUNNER_TEMP/ansible"
          "$RUNNER_TEMP/ansible/bin/pip" install --require-hashes -r controller-requirements.txt
          echo "$RUNNER_TEMP/ansible/bin" >> "$GITHUB_PATH"
          # --no-cache because the Galaxy API cache is written in two steps: a
          # blank entry with a 24-hour expiry first, its `results` filled in when
          # the response arrives. _call_galaxy writes that entry *before* issuing
          # the request and retries six deep around it, so one transient HTTP
          # error re-enters, finds its own blank entry unexpired and refuses --
          # a single flaky request reds a leg no diff caused, from a clean cache,
          # in one sequential process. An ephemeral runner HOME is no protection.
          # This step is the only reader of what it writes, so declining the
          # cache costs it nothing. ansible-lint used to install collections a
          # second time from inside itself, which this flag cannot reach; the
          # `lint` job passes --offline so that call no longer happens and this
          # is the only galaxy call in every job (#719).
          #
          # Retried because --no-cache closes a corrupt cache and does nothing for
          # a TCP reset: `Connection reset by peer` from galaxy.ansible.com red a
          # leg three times in eighteen hours, each green on an unchanged re-run,
          # and on `main` a red run holds the poller back with nothing reporting
          # it (#747). Three attempts, ten then twenty seconds apart, cover a
          # blip; a failure that outlasts them is no longer transient and still
          # reds the step, with every attempt's error left in the log above it.
          # The attempt sits in an `if` because the step runs under `bash -e`,
          # which would otherwise end it at the first failure. `tests/ci/workflow_test.rb`
          # runs this loop against a stubbed ansible-galaxy.
          for attempt in 1 2 3; do
            if "$RUNNER_TEMP/ansible/bin/ansible-galaxy" collection install --no-cache -r requirements.yml; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::ansible-galaxy collection install failed $attempt times; not transient (#747)" >&2
              exit 1
            fi
            echo "ansible-galaxy collection install failed (attempt $attempt of 3); retrying" >&2
            sleep $((attempt * 10))
          done

      - name: Check media acquisition reconciliation
        env:
          PART: ${{ matrix.part }}
        run: ruby "tests/media_acquisition_reconciliation_${PART}_test.rb"

  toolchain:
    # Publishes the controller toolchain to ghcr.io under a tag digesting its inputs;
    # the registry is the cache. Non-blocking: tests/integration.sh builds locally
    # when it cannot pull, and tests/ci/validate_results.rb reports the failure.
    timeout-minutes: 20
    # No `needs`, so it starts alongside `changes`. Skipped on forks, whose token
    # cannot write packages; their suites build locally.
    if: ${{ github.event.pull_request.head.repo.fork != true }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The harness owns the tag and build arguments; naming them here would drift.
      - name: Publish the controller toolchain image
        env:
          INTEGRATION_TOOLCHAIN_PUBLISH: '1'
        run: tests/integration.sh

  suites:
    # idempotence-check's work grew; docs/ci-performance-history.md has the numbers.
    timeout-minutes: 90
    name: ${{ matrix.suite }}
    needs:
      - changes
      - toolchain
    # The toolchain is optional, so `needs`' implicit success gate is dropped; the
    # changes-result term keeps a failed classification from reaching the matrix.
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.suites != '[]' }}
    runs-on: ubuntu-26.04
    # A job-level block replaces the workflow one, so contents: read is restated.
    # packages: read is intent: every ghcr.io image pulled today is public.
    permissions:
      contents: read
      packages: read
    # Job level because a step's `if` cannot see its own env; only presence is read.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.changes.outputs.suites) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Moves ghcr.io pulls off the anonymous per-IP allowance shared with other jobs.
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # lscr.io redeems GitHub credentials, but Docker keys logins by host, so the
      # arr and downloader images need their own login.
      - name: Authenticate to the linuxserver.io registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: lscr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A free Docker Hub account's allowance is ours alone, unlike the anonymous
      # per-IP one. Skipped without the secret (forks, clones): they pull anonymously.
      - name: Authenticate to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Run integration suite
        env:
          SUITE: ${{ matrix.suite }}
          SELECTED_TAGS: ${{ needs.changes.outputs.selected_tags }}
          # The upgrade lane's inputs, resolved by `changes`: this job's shallow checkout
          # cannot read the base. Empty for every other lane.
          INTEGRATION_UPGRADE_SERVICE: ${{ needs.changes.outputs.upgrade_service }}
          INTEGRATION_UPGRADE_BASE_IMAGE: ${{ needs.changes.outputs.upgrade_base_image }}
          # The subject's tags, not the run's: a fall-open empties SELECTED_TAGS.
          UPGRADE_TAGS: ${{ needs.changes.outputs.upgrade_tags }}
        run: |
          case "$SUITE" in
            upgrade)
              # Refused rather than degraded. An empty value here is the
              # untagged branch by another route, and the failure it would
              # produce -- a 30-minute lane converging the whole site -- reads
              # as the lane being slow rather than as a classifier that emitted
              # no subject tags.
              if [ -z "$UPGRADE_TAGS" ]; then
                echo 'the upgrade lane was dispatched with no subject tags' >&2
                exit 1
              fi
              tests/integration.sh --suite "$SUITE" --tags "$UPGRADE_TAGS" site.yml
              ;;
            idempotence-check)
              if [ -n "$SELECTED_TAGS" ]; then
                tests/integration.sh --suite "$SUITE" --tags "$SELECTED_TAGS" site.yml
              else
                tests/integration.sh --suite "$SUITE" site.yml
              fi
              ;;
            *)
              tests/integration.sh --suite "$SUITE" site.yml
              ;;
          esac

  validate:
    timeout-minutes: 10
    name: validate
    if: ${{ always() }}
    needs:
      - changes
      - static
      - lint
      - docs
      - vault
      - mutation
      - reconciliation
      - toolchain
      - suites
    runs-on: ubuntu-26.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate job results
        run: |
          ruby tests/ci/validate_results.rb \
            changes="${{ needs.changes.result }}" \
            static="${{ needs.static.result }}" \
            lint="${{ needs.lint.result }}" \
            docs="${{ needs.docs.result }}" \
            vault="${{ needs.vault.result }}" \
            mutation="${{ needs.mutation.result }}" \
            reconciliation="${{ needs.reconciliation.result }}" \
            toolchain="${{ needs.toolchain.result }}" \
            suites="${{ needs.suites.result }}"

      # DELIBERATE DUPLICATION (#480): the gate runs this too, but only here can no
      # edit to `static` (if: false, deletion, empty matrix) suppress it. Keep both.
      - name: Pin the workflow's own shape
        run: ruby tests/ci/workflow_test.rb
