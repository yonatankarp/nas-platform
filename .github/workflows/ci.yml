name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # The minute is off the hour and off the half hour because GitHub delays
    # scheduled runs hardest at those boundaries. The hour is chosen so that the
    # whole plausible fire window misses this repository's merge window; the hour
    # itself is not the property. docs/ci-performance-history.md, "A `cron` is a lower bound on when
    # the sweep lands", carries the measured delays and how to re-check them.
    - cron: '47 17 * * *'
  workflow_dispatch:

concurrency:
  # A run is superseded only by a newer run of the same thing. A pull request's
  # previous run tested a tree that no longer exists; a `main` push run is the
  # only run that will ever see the tree it merged. Hence the predicate.
  #
  # The event name is load-bearing rather than decorative: without it `push` and
  # `schedule` both resolve to `refs/heads/main`, and the nightly sweep -- not a
  # push, so still cancelling -- would kill an in-flight post-merge run once a
  # night and reintroduce what the predicate removes.
  #
  # The push fallback is `github.sha`, not `github.ref`, because the predicate was
  # necessary but not sufficient. A shared `refs/heads/main` group serialises every
  # merge, and GitHub's default `queue: single` permits one *pending* run per
  # group: a third merge arriving while one runs and one waits evicts the waiter
  # before it runs a job. That cost 5 of 57 push runs (8.8%) after the predicate
  # landed. Per-commit groups make eviction structurally impossible rather than
  # merely reconfigured. `queue: max` would have kept the serialisation, but the
  # only way to learn whether GitHub rejects it alongside an *expression* for
  # `cancel-in-progress` is to push to `main` and see, and serialising merges
  # bought nothing worth that: the runs contend for one account-wide job budget
  # either way, and that queue is at the job level, where waiting does not evict.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      static: ${{ steps.classify.outputs.static }}
      docs: ${{ steps.classify.outputs.docs }}
      vault: ${{ steps.classify.outputs.vault }}
      reconciliation: ${{ steps.classify.outputs.reconciliation }}
      suites: ${{ steps.classify.outputs.suites }}
      selected_tags: ${{ steps.classify.outputs.selected_tags }}
      upgrade_service: ${{ steps.classify.outputs.upgrade_service }}
      upgrade_base_image: ${{ steps.classify.outputs.upgrade_base_image }}
      upgrade_tags: ${{ steps.classify.outputs.upgrade_tags }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # A pull request is classified against its own base. A push to main is
          # classified against the ref it replaced -- the merge it just landed --
          # rather than being swept in full, because re-running everything cost 202
          # runner-minutes across 23 jobs to say a second time what the pull
          # request's own run already said. `--full` is what schedule and
          # workflow_dispatch are for.
          #
          # THIS RUN IS A SAFETY NET AND NOT A DUPLICATE, and the reason used to be
          # written here backwards. It claimed the pull request had already run the
          # routed matrix "against an identical tree, because
          # strict_required_status_checks_policy forces it up to date before it may
          # merge". It does not: the ruleset on main requires the `validate` check
          # and sets `strict_required_status_checks_policy: false`, so a branch may
          # merge while behind, and its green matrix reflects whatever base it
          # branched from. The repository-admin bypass on that ruleset is `always`,
          # so raising the flag binds only merges that do not take it.
          #
          # What that costs is two pull requests, each green alone, that are red
          # together. On 2026-09-11 #563 added tests/release_path_read_test.rb and
          # #567 added an unguarded slurp of a platform_current_dir path in the
          # Immich role; #567 merged twenty-five minutes later without #563 in its
          # head, so no pull-request run ever saw the check and the read at once.
          # The push run for b9595a00 saw both and went red, which is this run doing
          # the only job nothing else can do. Do not "optimise" it away on the
          # grounds that the pull request already tested this tree -- that is the
          # sentence this block replaced.
          #
          # github.event.before is the ref's previous tip, so it covers a push of
          # several commits; HEAD^ covers only the last one and is the fallback for
          # the pushes with no usable `before` -- a brand new ref reports all zeros,
          # a force push names a commit this clone never fetched. Both are compared
          # with three dots by the classifier, which is a no-op here because each
          # candidate is an ancestor of HEAD, and is what makes a merge commit report
          # the whole branch it merged instead of one parent's side of it.
          #
          # Every failure falls open to `--full`, never to nothing: routing that
          # recognises nothing has to cost time rather than coverage. Retrying is
          # safe because the classifier resolves the whole diff before it opens the
          # output file, so a run that failed left no partial selection behind.
          if [ "$EVENT_NAME" = pull_request ]; then
            BASE=$PR_BASE
            HEAD=$PR_HEAD
            ruby tests/ci/classify_changes.rb --diff "$BASE" "$HEAD" --github-output "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = push ]; then
            PUSH_BASE=
            for candidate in "$PUSH_BEFORE" "HEAD^"; do
              [ -n "$candidate" ] || continue
              if resolved=$(git rev-parse --verify --quiet "${candidate}^{commit}"); then
                PUSH_BASE=$resolved
                break
              fi
            done
            if [ -z "$PUSH_BASE" ] ||
               ! ruby tests/ci/classify_changes.rb --diff "$PUSH_BASE" HEAD --github-output "$GITHUB_OUTPUT"; then
              ruby tests/ci/classify_changes.rb --full --github-output "$GITHUB_OUTPUT"
            fi
          else
            ruby tests/ci/classify_changes.rb --full --github-output "$GITHUB_OUTPUT"
          fi

  static:
    # Three shards, each a runner with its own worker pool running one shard of
    # the manifest. Why more cores rather than extraction, and why three is where
    # it stops paying, is docs/ci-performance-history.md's "The `static` budget" and
    # "The fifth occurrence" sections, whose rules CLAUDE.md keeps; read the gate's own slowest-check report rather than a
    # number quoted anywhere. This timeout stays well above the observed runtime
    # so a slow runner cannot cancel a passing gate the way the previous one did.
    #
    # Every step below runs on all three legs, the toolchain install included, and
    # that is deliberate rather than merely simpler: a step conditioned on the
    # shard number is a step that runs on one leg, so tests/ci/workflow_test.rb
    # refuses an `if` on any static step -- otherwise a check quietly becomes a
    # check that runs a third as often.
    #
    # What remains here is what a shard genuinely needs. The toolchain install
    # stays triplicated because the gate's own manifest runs "$ansible_python"
    # and ansible-playbook checks on every shard; the six steps that did not vary
    # by shard are gone, three of them into the gate's manifest and three into
    # the `lint` job below (#653).
    timeout-minutes: 45
    name: static (${{ matrix.shard }})
    needs: changes
    if: ${{ needs.changes.outputs.static == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports. Failing fast would cancel the other two, so a run
      # that broke checks in more than one shard would name only the first. The
      # gate's path is deliberately not named in this comment: the mutation
      # harness plants a defect by rewriting the first mention of it in this file,
      # and a mention above the step it must reach would absorb that.
      fail-fast: false
      matrix:
        shard: ['1', '2', '3']

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate shell syntax
        run: |
          # One invocation per file, with the parser chosen by the script's own
          # shebang. `-exec sh -n {} +` batched all ninety-eight scripts into a
          # single invocation, and `sh -n` parses only its first argument, so the
          # sweep checked exactly one of them and reported green (#634). Switching
          # to `-exec ... \;` would not fix it: find's exit status ignores the
          # command's, so a failing parse would still leave the step at 0.
          # tests/contracts/audiobookshelf-audio-test.sh is bash and is not valid
          # POSIX sh, which is why the shebang and not the extension decides.
          status=0
          while IFS= read -r script; do
            case "$(head -n 1 "$script")" in
              *bash*) bash -n "$script" || status=1 ;;
              *) sh -n "$script" || status=1 ;;
            esac
          done < <(find tests -type f -name '*.sh' | sort)
          exit "$status"

      - name: Install ShellCheck
        run: |
          # ubuntu-latest ships ShellCheck, so this normally installs nothing.
          # The policy gate lints the integration controller library with it as
          # one bare manifest line, which cannot guard itself, so recover here
          # if the runner image ever drops the binary.
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install --yes shellcheck
          fi

      # The venv below is built with whatever `python3` the runner image happens
      # to ship, and controller-requirements.txt pins ansible-core 2.21.4, which
      # requires Python 3.12 or newer. Nothing declared that floor, so a runner
      # image moving its default interpreter -- in either direction -- silently
      # changed the toolchain CI resolved, and a contributor on 3.11 met the
      # documented `pip install -r controller-requirements.txt` with a resolver
      # wall of text naming no cause (#655). The version is read from
      # .python-version rather than written here, for the same reason the pins
      # are read from controller-requirements.txt: five jobs carry this pair
      # byte-identically, and a literal repeated five times is five places a bump
      # has to find. pyenv reads that file too, so a contributor gets the same
      # interpreter without being told to.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install Ansible tooling
        run: |
          # All three ship in the ubuntu-latest image, so this normally installs
          # nothing. Guarded because an unconditional apt-get update stalled
          # mid-download for 161 minutes on 2026-08-19; the guard still recovers
          # automatically if the image ever drops them.
          if ! command -v htpasswd >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install --yes apache2-utils openssh-client openssl
          fi
          #
          # Never name a version here: five jobs carry this block byte-identically,
          # and the pins live in controller-requirements.txt alone (CLAUDE.md).
          python3 -m venv "$RUNNER_TEMP/ansible"
          "$RUNNER_TEMP/ansible/bin/pip" install -r controller-requirements.txt
          echo "$RUNNER_TEMP/ansible/bin" >> "$GITHUB_PATH"
          # --no-cache because the Galaxy API cache is written in two steps: a
          # blank entry with a 24-hour expiry first, its `results` filled in when
          # the response arrives. _call_galaxy writes that entry *before* issuing
          # the request and retries six deep around it, so one transient HTTP
          # error re-enters, finds its own blank entry unexpired and refuses --
          # a single flaky request reds a leg no diff caused, from a clean cache,
          # in one sequential process. An ephemeral runner HOME is no protection.
          # This step is the only reader of what it writes, so declining the
          # cache costs it nothing. ansible-lint used to install collections a
          # second time from inside itself, which this flag cannot reach; the
          # `lint` job passes --offline so that call no longer happens and this
          # is the only galaxy call in every job (#719).
          #
          # Retried because --no-cache closes a corrupt cache and does nothing for
          # a TCP reset: `Connection reset by peer` from galaxy.ansible.com red a
          # leg three times in eighteen hours, each green on an unchanged re-run,
          # and on `main` a red run holds the poller back with nothing reporting
          # it (#747). Three attempts, ten then twenty seconds apart, cover a
          # blip; a failure that outlasts them is no longer transient and still
          # reds the step, with every attempt's error left in the log above it.
          # The attempt sits in an `if` because the step runs under `bash -e`,
          # which would otherwise end it at the first failure. `tests/ci/workflow_test.rb`
          # runs this loop against a stubbed ansible-galaxy.
          for attempt in 1 2 3; do
            if "$RUNNER_TEMP/ansible/bin/ansible-galaxy" collection install --no-cache -r requirements.yml; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::ansible-galaxy collection install failed $attempt times; not transient (#747)" >&2
              exit 1
            fi
            echo "ansible-galaxy collection install failed (attempt $attempt of 3); retrying" >&2
            sleep $((attempt * 10))
          done

      # The shard reaches the gate through the environment rather than by
      # interpolating a matrix value into shell source, as every other matrix here
      # does. The gate refuses an identifier its manifest does not declare, so a
      # matrix naming a shard the partition dropped is a red leg rather than a leg
      # that runs nothing.
      - name: Check policy properties
        env:
          POLICY_SHARD: ${{ matrix.shard }}
        run: tests/validate-policy.sh "$POLICY_SHARD"

  lint:
    # The shard-independent half of what `static` used to be. Every step below
    # produces the same verdict on every shard, so running them inside the matrix
    # ran each of them three times per pull request and charged all three to the
    # job with the stated 10-15 minute budget (#653).
    #
    # An `if:` on the step was the obvious trim and is refused by
    # tests/ci/workflow_test.rb, deliberately: a step conditioned on the shard is
    # a check that runs on one leg of three, which is the silent-coverage-loss
    # shape #469 wrote the union guard against. So the checks move to a runner of
    # their own instead, the way `mutation` and `reconciliation` did -- with the
    # difference that those left the gate because they were its floor, and these
    # leave the matrix because they were never per-shard work at all.
    #
    # The three single-command checks that stood beside them went the other way,
    # into tests/validate-policy.sh, where they run once as one line of one shard
    # and gain the manifest declaration guard they had no equivalent of here.
    # What stayed is what cannot be a manifest line: ansible-lint and
    # ansible-playbook are not this repository's own programs, and the ephemeral
    # vault self-test is asserted by tests/policy_vault_test.rb against the
    # workflow's own dependency install rather than against the gate.
    #
    # Gated on the same classifier output as `static`, not on a narrower lane:
    # lint and a syntax check read every play and every role, so there is no
    # subset of files that cannot change what they say.
    timeout-minutes: 15
    needs: changes
    if: ${{ needs.changes.outputs.static == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The venv below is built with whatever `python3` the runner image happens
      # to ship, and controller-requirements.txt pins ansible-core 2.21.4, which
      # requires Python 3.12 or newer. Nothing declared that floor, so a runner
      # image moving its default interpreter -- in either direction -- silently
      # changed the toolchain CI resolved, and a contributor on 3.11 met the
      # documented `pip install -r controller-requirements.txt` with a resolver
      # wall of text naming no cause (#655). The version is read from
      # .python-version rather than written here, for the same reason the pins
      # are read from controller-requirements.txt: five jobs carry this pair
      # byte-identically, and a literal repeated five times is five places a bump
      # has to find. pyenv reads that file too, so a contributor gets the same
      # interpreter without being told to.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install Ansible tooling
        run: |
          # All three ship in the ubuntu-latest image, so this normally installs
          # nothing. Guarded because an unconditional apt-get update stalled
          # mid-download for 161 minutes on 2026-08-19; the guard still recovers
          # automatically if the image ever drops them.
          if ! command -v htpasswd >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install --yes apache2-utils openssh-client openssl
          fi
          #
          # Never name a version here: five jobs carry this block byte-identically,
          # and the pins live in controller-requirements.txt alone (CLAUDE.md).
          python3 -m venv "$RUNNER_TEMP/ansible"
          "$RUNNER_TEMP/ansible/bin/pip" install -r controller-requirements.txt
          echo "$RUNNER_TEMP/ansible/bin" >> "$GITHUB_PATH"
          # --no-cache because the Galaxy API cache is written in two steps: a
          # blank entry with a 24-hour expiry first, its `results` filled in when
          # the response arrives. _call_galaxy writes that entry *before* issuing
          # the request and retries six deep around it, so one transient HTTP
          # error re-enters, finds its own blank entry unexpired and refuses --
          # a single flaky request reds a leg no diff caused, from a clean cache,
          # in one sequential process. An ephemeral runner HOME is no protection.
          # This step is the only reader of what it writes, so declining the
          # cache costs it nothing. ansible-lint used to install collections a
          # second time from inside itself, which this flag cannot reach; the
          # `lint` job passes --offline so that call no longer happens and this
          # is the only galaxy call in every job (#719).
          #
          # Retried because --no-cache closes a corrupt cache and does nothing for
          # a TCP reset: `Connection reset by peer` from galaxy.ansible.com red a
          # leg three times in eighteen hours, each green on an unchanged re-run,
          # and on `main` a red run holds the poller back with nothing reporting
          # it (#747). Three attempts, ten then twenty seconds apart, cover a
          # blip; a failure that outlasts them is no longer transient and still
          # reds the step, with every attempt's error left in the log above it.
          # The attempt sits in an `if` because the step runs under `bash -e`,
          # which would otherwise end it at the first failure. `tests/ci/workflow_test.rb`
          # runs this loop against a stubbed ansible-galaxy.
          for attempt in 1 2 3; do
            if "$RUNNER_TEMP/ansible/bin/ansible-galaxy" collection install --no-cache -r requirements.yml; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::ansible-galaxy collection install failed $attempt times; not transient (#747)" >&2
              exit 1
            fi
            echo "ansible-galaxy collection install failed (attempt $attempt of 3); retrying" >&2
            sleep $((attempt * 10))
          done

      - name: Check silent ephemeral vault generation
        run: |
          self_test_log=$(mktemp)
          trap 'rm -f "$self_test_log"' EXIT
          if ! tests/generate-ephemeral-vault.sh --self-test >"$self_test_log" 2>&1; then
            cat "$self_test_log" >&2
            exit 1
          fi
          test ! -s "$self_test_log"

      # --offline because ansible-lint does not lint alone: ansible-compat's
      # prepare_environment walks REQUIREMENT_LOCATIONS and runs its own
      # `ansible-galaxy collection install` on requirements.yml, from inside a
      # library, with no --no-cache and nowhere to pass one. That is the second
      # galaxy call in this job and the only one #704's flag cannot reach, so it
      # carries the whole failure the toolchain step describes (#719). The flag is on
      # the command rather than `offline: true` in .ansible-lint because the
      # config file is read by a developer's bare `ansible-lint` too, where the
      # self-healing install is the thing that makes a first run work; scoped
      # here it costs them nothing. It is a CLI option with no environment
      # fallback -- ANSIBLE_LINT_OFFLINE does not exist, and ANSIBLE_LINT_NODEPS,
      # which would imply it, also suppresses the checks that need the
      # collections ("far less violations will be reported").
      #
      # It turns off two things. The install: lint then resolves modules from the
      # $HOME/.ansible/collections the toolchain step populated, rather than
      # installing its own copy under <tree>/.ansible, and it refuses loudly --
      # 18 syntax-check[unknown-module] and exit 2 -- if that step did not run,
      # so the new dependency cannot fail quietly. And the schema refresh, which
      # leaves the schemas bundled with the pinned ansible-lint in force, so this
      # job's verdict stops depending on a network fetch. Measured on a fresh
      # HOME with nothing cached, that costs nothing here: 387 files processed
      # either way, 0 failures either way.
      - name: Lint Ansible
        run: ansible-lint --strict --offline

      - name: Check playbook syntax
        run: |
          ansible-playbook -i inventory/local.yml site.yml --syntax-check
          ansible-playbook generate-secrets.yml --syntax-check
          ansible-playbook -i inventory/local.yml install-production-auto-deploy.yml --syntax-check

      # Nothing in this repository has ever validated renovate.json against
      # Renovate's own schema, and #775 is what that cost. #771 shipped a
      # matchPackageNames holding "*" alongside other patterns; Renovate refuses
      # that, and it refuses the WHOLE config, so the bot stopped opening pull
      # requests repository-wide -- its own dependency updates included -- the
      # day after it landed. Both checks that read the file passed on it: JSON
      # parsing only proves it parses, and tests/renovate_policy_test.rb asserts
      # hand-written properties, one of which actively REQUIRED the spelling
      # Renovate rejects. Only Renovate knows Renovate's schema.
      #
      # A lint step rather than a tests/validate-policy.sh manifest line, for the
      # reason ansible-lint is not one either: the gate's manifest is for
      # programs this repository owns, and it runs offline, while this one is
      # npm's and resolves `extends` presets. It lands in this job rather than in
      # `static` because its verdict cannot vary by shard, which is the whole
      # reason this job exists.
      #
      # The pin is the only version literal in this file that is not an action
      # SHA; a custom manager in renovate.json tracks it, and
      # tests/renovate_policy_test.rb asserts that coupling so it cannot float.
      # No --strict: it fails on the pending "after 10pm and before 5am"
      # schedule migration, which is a warning Renovate applies itself, and
      # #775's defect is an ERROR that exits non-zero without it.
      - name: Validate the Renovate configuration
        run: |
          renovate_pin=renovate@44.115.2
          npx --yes --package "$renovate_pin" renovate-config-validator

          # A check that has only ever passed proves nothing, and this one is
          # bumped by a bot: a Renovate release demoting that refusal to a
          # warning would leave this step green over a config Renovate rejects.
          # So show it #775's exact spelling and require it to still fail.
          # packageRules[-1] is that rule: tests/renovate_policy_test.rb asserts
          # the batching group is last, so this plants on the rule #771 broke.
          planted="$(mktemp -d)"
          python3 - "$planted/renovate.json" <<'PY'
          import json
          import sys

          config = json.load(open("renovate.json"))
          rule = config["packageRules"][-1]
          rule["matchPackageNames"] = ["*"] + rule["matchPackageNames"]
          json.dump(config, open(sys.argv[1], "w"))
          PY
          if (cd "$planted" && npx --yes --package "$renovate_pin" renovate-config-validator); then
            echo "renovate-config-validator accepted #775's config; it no longer guards against it" >&2
            exit 1
          fi

  docs:
    # These checks read Markdown and the working tree and nothing else, so they
    # run on a checkout and the Ruby the runner image ships rather than the
    # fifteen minutes of Ansible toolchain `static` installs. They stay registered
    # in tests/validate-policy.sh as well, and deliberately so: a link resolves
    # against files the documents do not own, so a code rename has to keep running
    # them too, and only `static` runs on a code rename.
    timeout-minutes: 10
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check documentation links
        run: |
          ruby tests/docs_links_test.rb
          ruby tests/docs_links_test.rb --self-test

      - name: Check the secrets guide against the vault contract
        run: ruby tests/secrets_docs_test.rb

  vault:
    # Nothing in CI held the vault password, so nothing ever parsed the encrypted
    # file and the gate could only prove it was still encrypted. Both variants of
    # that blind spot shipped: an unparseable file (#555, #559) and a missing key
    # (#172, #274). So this job runs the play the poller runs, with the poller's
    # own arguments. A re-implemented parse-and-key-set check would be a second
    # contract agreeing with itself while disagreeing with the host, so the step
    # below mirrors scripts/production_auto_deploy.py's _vault_arguments, and
    # tests/ci/workflow_test.rb imports that function and compares its output to
    # this step's argv token for token.
    #
    # A real run, deliberately, and the reason is narrower than it reads. Measured
    # on ansible-core 2.21.4, 2026-09-13: decryption happens at vars-load time, so
    # --check does report #559's quote as rc=4 and a missing key as rc=2 -- it is
    # not blind. --syntax-check is, exiting 0 on both, as do --list-tasks,
    # --list-tags and --list-hosts. What rules --check out is that this job's whole
    # claim is that the host's own command succeeded against this artifact, and a
    # simulation cannot make that claim. Hence an argv pinned *exactly* rather than
    # a denylist, which is what the next flag walks past.
    timeout-minutes: 15
    needs: changes
    if: ${{ needs.changes.outputs.vault == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The venv below is built with whatever `python3` the runner image happens
      # to ship, and controller-requirements.txt pins ansible-core 2.21.4, which
      # requires Python 3.12 or newer. Nothing declared that floor, so a runner
      # image moving its default interpreter -- in either direction -- silently
      # changed the toolchain CI resolved, and a contributor on 3.11 met the
      # documented `pip install -r controller-requirements.txt` with a resolver
      # wall of text naming no cause (#655). The version is read from
      # .python-version rather than written here, for the same reason the pins
      # are read from controller-requirements.txt: five jobs carry this pair
      # byte-identically, and a literal repeated five times is five places a bump
      # has to find. pyenv reads that file too, so a contributor gets the same
      # interpreter without being told to.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install Ansible tooling
        run: |
          # All three ship in the ubuntu-latest image, so this normally installs
          # nothing. Guarded because an unconditional apt-get update stalled
          # mid-download for 161 minutes on 2026-08-19; the guard still recovers
          # automatically if the image ever drops them.
          if ! command -v htpasswd >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install --yes apache2-utils openssh-client openssl
          fi
          #
          # Never name a version here: five jobs carry this block byte-identically,
          # and the pins live in controller-requirements.txt alone (CLAUDE.md).
          python3 -m venv "$RUNNER_TEMP/ansible"
          "$RUNNER_TEMP/ansible/bin/pip" install -r controller-requirements.txt
          echo "$RUNNER_TEMP/ansible/bin" >> "$GITHUB_PATH"
          # --no-cache because the Galaxy API cache is written in two steps: a
          # blank entry with a 24-hour expiry first, its `results` filled in when
          # the response arrives. _call_galaxy writes that entry *before* issuing
          # the request and retries six deep around it, so one transient HTTP
          # error re-enters, finds its own blank entry unexpired and refuses --
          # a single flaky request reds a leg no diff caused, from a clean cache,
          # in one sequential process. An ephemeral runner HOME is no protection.
          # This step is the only reader of what it writes, so declining the
          # cache costs it nothing. ansible-lint used to install collections a
          # second time from inside itself, which this flag cannot reach; the
          # `lint` job passes --offline so that call no longer happens and this
          # is the only galaxy call in every job (#719).
          #
          # Retried because --no-cache closes a corrupt cache and does nothing for
          # a TCP reset: `Connection reset by peer` from galaxy.ansible.com red a
          # leg three times in eighteen hours, each green on an unchanged re-run,
          # and on `main` a red run holds the poller back with nothing reporting
          # it (#747). Three attempts, ten then twenty seconds apart, cover a
          # blip; a failure that outlasts them is no longer transient and still
          # reds the step, with every attempt's error left in the log above it.
          # The attempt sits in an `if` because the step runs under `bash -e`,
          # which would otherwise end it at the first failure. `tests/ci/workflow_test.rb`
          # runs this loop against a stubbed ansible-galaxy.
          for attempt in 1 2 3; do
            if "$RUNNER_TEMP/ansible/bin/ansible-galaxy" collection install --no-cache -r requirements.yml; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::ansible-galaxy collection install failed $attempt times; not transient (#747)" >&2
              exit 1
            fi
            echo "ansible-galaxy collection install failed (attempt $attempt of 3); retrying" >&2
            sleep $((attempt * 10))
          done

      - name: Validate the encrypted vault
        env:
          VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          # `secrets` is not in scope for a job-level `if:` -- that context carries
          # only github, needs, vars and inputs -- so the emptiness check is a step,
          # and it fails rather than skipping. A skip would be a green run that
          # proved nothing, which is the state this job exists to end. The cost is
          # stated rather than worked around: a pull request from a fork holds no
          # secret and reds here.
          if [ -z "$VAULT_PASSWORD" ]; then
            echo "ANSIBLE_VAULT_PASSWORD is unset or empty." >&2
            echo "This job decrypts the vault in inventory/group_vars/all/ and cannot run" >&2
            echo "without it: gh secret set ANSIBLE_VAULT_PASSWORD." >&2
            exit 1
          fi
          # Under $RUNNER_TEMP and never in the checkout, and the mode is set by
          # umask before the file exists rather than by a chmod after it does.
          # ansible-vault strips the trailing newline, so the value reaching the
          # decrypt is the secret and nothing else.
          umask 077
          printf '%s\n' "$VAULT_PASSWORD" > "$RUNNER_TEMP/vault-password"
          # Measured against a planted copy of #559's defect: the YAML parse
          # failure reports "While parsing a block mapping did not find expected
          # key" and no source line, at -vvv as well. Two mechanisms hold that --
          # DataLoader redacts annotated source for vault-sourced data, and
          # SourceContext.from_origin re-reads the file and answers "content
          # encrypted" when it finds a $ANSIBLE_VAULT header -- so the output is
          # not captured and filtered here.
          ansible-playbook -i inventory/local.yml \
            --vault-password-file "$RUNNER_TEMP/vault-password" \
            validate-vault.yml

  mutation:
    # Extracted from the policy gate, which it was the floor of;
    # docs/ci-performance-history.md's "The `static` budget" section carries the measurement. Nothing about the
    # mutations is routed more narrowly than the gate, because a mutation is
    # planted in a copy of the whole repository and any file can change what the
    # policy set says.
    #
    # The nightly and workflow_dispatch -- the two `--full` triggers -- run
    # `--audit` instead of the narrow form: it re-derives every row's
    # `detected_by` against all eight policy scripts, and until #727 it ran in
    # no job at all, so drift accumulated behind a green gate (#715). It
    # replaces the narrow run rather than sitting beside it, because its output
    # includes the narrow run's. #727 measured it on two 4-core runners at 30.5
    # and 34.5 minutes (CPU/elapsed 1.13-1.70); 60 is that maximum plus setup
    # with room for the ~30% runner-to-runner spread. Drift reds the nightly,
    # which blocks no deploy: the poller reads push runs only.
    timeout-minutes: 60
