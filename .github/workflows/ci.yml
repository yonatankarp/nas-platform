name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Off the hour and half hour, where GitHub delays scheduled runs most;
    # docs/ci-performance-history.md has the measured delays.
    - cron: '47 17 * * *'
  workflow_dispatch:

concurrency:
  # Only pull requests cancel superseded runs. The event name keeps the nightly
  # out of main's push group; push groups are per commit because GitHub keeps one
  # pending run per group, so a third merge would evict the waiting one.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    outputs:
      static: ${{ steps.classify.outputs.static }}
      docs: ${{ steps.classify.outputs.docs }}
      vault: ${{ steps.classify.outputs.vault }}
      reconciliation: ${{ steps.classify.outputs.reconciliation }}
      suites: ${{ steps.classify.outputs.suites }}
      selected_tags: ${{ steps.classify.outputs.selected_tags }}
      upgrade_service: ${{ steps.classify.outputs.upgrade_service }}
      upgrade_base_image: ${{ steps.classify.outputs.upgrade_base_image }}
      upgrade_tags: ${{ steps.classify.outputs.upgrade_tags }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # A pull request is classified against its own base. A push to main is
          # classified against the ref it replaced -- the merge it just landed --
          # rather than being swept in full, because re-running everything cost 202
          # runner-minutes across 23 jobs to say a second time what the pull
          # request's own run already said. `--full` is what schedule and
          # workflow_dispatch are for.
          #
          # THIS RUN IS A SAFETY NET AND NOT A DUPLICATE, and the reason used to be
          # written here backwards. It claimed the pull request had already run the
          # routed matrix "against an identical tree, because
          # strict_required_status_checks_policy forces it up to date before it may
          # merge". It does not: the ruleset on main requires the `validate` check
          # and sets `strict_required_status_checks_policy: false`, so a branch may
          # merge while behind, and its green matrix reflects whatever base it
          # branched from. The repository-admin bypass on that ruleset is `always`,
          # so raising the flag binds only merges that do not take it.
          #
          # What that costs is two pull requests, each green alone, that are red
          # together. On 2026-09-11 #563 added tests/release_path_read_test.rb and
          # #567 added an unguarded slurp of a platform_current_dir path in the
          # Immich role; #567 merged twenty-five minutes later without #563 in its
          # head, so no pull-request run ever saw the check and the read at once.
          # The push run for b9595a00 saw both and went red, which is this run doing
          # the only job nothing else can do. Do not "optimise" it away on the
          # grounds that the pull request already tested this tree -- that is the
          # sentence this block replaced.
          #
          # github.event.before is the ref's previous tip, so it covers a push of
          # several commits; HEAD^ covers only the last one and is the fallback for
          # the pushes with no usable `before` -- a brand new ref reports all zeros,
          # a force push names a commit this clone never fetched. Both are compared
          # with three dots by the classifier, which is a no-op here because each
          # candidate is an ancestor of HEAD, and is what makes a merge commit report
          # the whole branch it merged instead of one parent's side of it.
          #
          # Every failure falls open to `--full`, never to nothing: routing that
          # recognises nothing has to cost time rather than coverage. Retrying is
          # safe because the classifier resolves the whole diff before it opens the
          # output file, so a run that failed left no partial selection behind.
          if [ "$EVENT_NAME" = pull_request ]; then
            BASE=$PR_BASE
            HEAD=$PR_HEAD
            ruby tests/ci/classify_changes.rb --diff "$BASE" "$HEAD" --github-output "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = push ]; then
            PUSH_BASE=
            for candidate in "$PUSH_BEFORE" "HEAD^"; do
              [ -n "$candidate" ] || continue
              if resolved=$(git rev-parse --verify --quiet "${candidate}^{commit}"); then
                PUSH_BASE=$resolved
                break
              fi
            done
            if [ -z "$PUSH_BASE" ] ||
               ! ruby tests/ci/classify_changes.rb --diff "$PUSH_BASE" HEAD --github-output "$GITHUB_OUTPUT"; then
              ruby tests/ci/classify_changes.rb --full --github-output "$GITHUB_OUTPUT"
            fi
          else
            ruby tests/ci/classify_changes.rb --full --github-output "$GITHUB_OUTPUT"
          fi

  static:
    # Three shards of the policy gate's manifest (docs/ci-performance-history.md).
    # No step may carry an `if:` (tests/ci/workflow_test.rb): a shard-conditioned
    # step silently runs a third as often.
    timeout-minutes: 45
    name: static (${{ matrix.shard }})
    needs: changes
    if: ${{ needs.changes.outputs.static == 'true' }}
    runs-on: ubuntu-26.04
    strategy:
      # Every shard reports. Do not name the gate's path in this comment: a mutation
      # plants its defect at the first mention of that path in this file.
      fail-fast: false
      matrix:
        shard: ['1', '2', '3']

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate shell syntax
        run: |
          # One invocation per file, with the parser chosen by the script's own
          # shebang. `-exec sh -n {} +` batched all ninety-eight scripts into a
          # single invocation, and `sh -n` parses only its first argument, so the
          # sweep checked exactly one of them and reported green (#634). Switching
          # to `-exec ... \;` would not fix it: find's exit status ignores the
          # command's, so a failing parse would still leave the step at 0.
          # tests/contracts/audiobookshelf-audio-test.sh is bash and is not valid
          # POSIX sh, which is why the shebang and not the extension decides.
          status=0
          while IFS= read -r script; do
            case "$(head -n 1 "$script")" in
              *bash*) bash -n "$script" || status=1 ;;
              *) sh -n "$script" || status=1 ;;
            esac
          done < <(find tests -type f -name '*.sh' | sort)
          exit "$status"

      - name: Install ShellCheck
        run: |
          # The runner image ships ShellCheck, so this normally installs nothing.
          # The policy gate lints the integration controller library with it as
          # one bare manifest line, which cannot guard itself, so recover here
          # if the runner image ever drops the binary.
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install --yes shellcheck
          fi

      # Python comes from .python-version (ansible-core needs 3.12+, #655); this pair
      # is held byte-identical across five jobs, so no version literal here.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install Ansible tooling
        run: |
          # All three ship in the runner image, so this normally installs
          # nothing. Guarded because an unconditional apt-get update stalled
          # mid-download for 161 minutes on 2026-08-19; the guard still recovers
          # automatically if the image ever drops them.
          if ! command -v htpasswd >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install --yes apache2-utils openssh-client openssl
          fi
          #
          # Never name a version here: five jobs carry this block byte-identically,
          # and the pins are authored in controller-requirements.in alone (CLAUDE.md).
          # controller-requirements.txt is the lock compiled from it, a hash on every
          # entry, and --require-hashes refuses one that lost it (#827).
          python3 -m venv "$RUNNER_TEMP/ansible"
          "$RUNNER_TEMP/ansible/bin/pip" install --require-hashes -r controller-requirements.txt
          echo "$RUNNER_TEMP/ansible/bin" >> "$GITHUB_PATH"
          # --no-cache because the Galaxy API cache is written in two steps: a
          # blank entry with a 24-hour expiry first, its `results` filled in when
          # the response arrives. _call_galaxy writes that entry *before* issuing
          # the request and retries six deep around it, so one transient HTTP
          # error re-enters, finds its own blank entry unexpired and refuses --
          # a single flaky request reds a leg no diff caused, from a clean cache,
          # in one sequential process. An ephemeral runner HOME is no protection.
          # This step is the only reader of what it writes, so declining the
          # cache costs it nothing. ansible-lint used to install collections a
          # second time from inside itself, which this flag cannot reach; the
          # `lint` job passes --offline so that call no longer happens and this
          # is the only galaxy call in every job (#719).
          #
          # Retried because --no-cache closes a corrupt cache and does nothing for
          # a TCP reset: `Connection reset by peer` from galaxy.ansible.com red a
          # leg three times in eighteen hours, each green on an unchanged re-run,
          # and on `main` a red run holds the poller back with nothing reporting
          # it (#747). Three attempts, ten then twenty seconds apart, cover a
          # blip; a failure that outlasts them is no longer transient and still
          # reds the step, with every attempt's error left in the log above it.
          # The attempt sits in an `if` because the step runs under `bash -e`,
          # which would otherwise end it at the first failure. `tests/ci/workflow_test.rb`
          # runs this loop against a stubbed ansible-galaxy.
          for attempt in 1 2 3; do
            if "$RUNNER_TEMP/ansible/bin/ansible-galaxy" collection install --no-cache -r requirements.yml; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::ansible-galaxy collection install failed $attempt times; not transient (#747)" >&2
              exit 1
            fi
            echo "ansible-galaxy collection install failed (attempt $attempt of 3); retrying" >&2
            sleep $((attempt * 10))
          done

      # The shard comes through env; the gate refuses one its manifest does not declare.
      - name: Check policy properties
        env:
          POLICY_SHARD: ${{ matrix.shard }}
        run: tests/validate-policy.sh "$POLICY_SHARD"

  lint:
    # Shard-independent checks, moved out of `static` so they run once (#653).
    # Gated like `static`: lint and syntax checks read every play and role.
    timeout-minutes: 15
    needs: changes
    if: ${{ needs.changes.outputs.static == 'true' }}
    runs-on: ubuntu-26.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Python comes from .python-version (ansible-core needs 3.12+, #655); this pair
      # is held byte-identical across five jobs, so no version literal here.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install Ansible tooling
        run: |
          # All three ship in the runner image, so this normally installs
          # nothing. Guarded because an unconditional apt-get update stalled
          # mid-download for 161 minutes on 2026-08-19; the guard still recovers
          # automatically if the image ever drops them.
          if ! command -v htpasswd >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install --yes apache2-utils openssh-client openssl
          fi
