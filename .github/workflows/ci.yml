name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.classify.outputs.run_ci }}
      static: ${{ steps.classify.outputs.static }}
      foundation: ${{ steps.classify.outputs.foundation }}
      smoke: ${{ steps.classify.outputs.smoke }}
      beszel: ${{ steps.classify.outputs.beszel }}
      dozzle: ${{ steps.classify.outputs.dozzle }}
      audiobookshelf: ${{ steps.classify.outputs.audiobookshelf }}
      media: ${{ steps.classify.outputs.media }}
      paperless: ${{ steps.classify.outputs.paperless }}
      idempotence_check: ${{ steps.classify.outputs.idempotence_check }}
      selected_tags: ${{ steps.classify.outputs.selected_tags }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            BASE=$PR_BASE
            HEAD=$PR_HEAD
            ruby tests/ci/classify_changes.rb --diff "$BASE" "$HEAD" --github-output "$GITHUB_OUTPUT"
          else
            ruby tests/ci/classify_changes.rb --full --github-output "$GITHUB_OUTPUT"
          fi

  static:
    needs: changes
    if: ${{ needs.changes.outputs.static == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request) base_sha=$PR_BASE_SHA ;;
            push) base_sha=$PUSH_BEFORE_SHA ;;
            *) base_sha= ;;
          esac
          if ! printf '%s' "$base_sha" | grep -Eq '^[0-9a-f]{40}$' ||
             printf '%s' "$base_sha" | grep -Eq '^0{40}$'; then
            printf 'docs_only=false\nchanged_count=0\n' >> "$GITHUB_OUTPUT"
          else
            git diff --name-only -z "$base_sha" "$GITHUB_SHA" |
              ruby tests/ci_change_scope.rb >> "$GITHUB_OUTPUT"
          fi

      - name: Validate documentation
        if: steps.scope.outputs.docs_only == 'true'
        run: tests/validate-docs.sh

      - name: Validate shell syntax
        if: steps.scope.outputs.docs_only != 'true'
        run: find tests -type f -name '*.sh' -exec sh -n {} +

      - name: Install Ansible tooling
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes apache2-utils openssh-client openssl
          pipx install 'ansible-core==2.21.2'
          pipx install 'ansible-lint==26.6.0'
          ansible-galaxy collection install -r requirements.yml

      - name: Check policy properties
        if: steps.scope.outputs.docs_only != 'true'
        run: tests/validate-policy.sh

      - name: Check integration sandbox cleanup
        if: steps.scope.outputs.docs_only != 'true'
        run: tests/integration_cleanup_test.sh

      - name: Check legacy seed security
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          tests/mac/legacy-seed-test.sh
          tests/mac/legacy-fixture-path-test.sh
          ruby tests/mac/legacy-secure-copy-test.rb

      - name: Check legacy adoption baseline capture
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          ruby tests/mac/adoption-baseline-test.rb
          ruby tests/mac/adoption-probes-test.rb
          tests/mac/adoption-snapshot-test.sh
          ruby tests/mac/adoption-compare-test.rb
          ruby tests/mac/adoption-recreate-test.rb
          tests/mac/adoption-failure-stop-test.sh
          tests/mac/adoption-runner-test.sh
          tests/mac/adoption-rollback-test.sh

      - name: Check out pinned legacy infrastructure
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          legacy_root="$GITHUB_WORKSPACE/../nas-infrastructure"
          legacy_revision=400f03f276ae1bb69f5460c175b9fb923d620f1a
          test ! -e "$legacy_root"
          mkdir -m 0700 "$legacy_root"
          git -C "$legacy_root" init -q
          git -C "$legacy_root" remote add origin https://github.com/yonatankarp/nas-infrastructure.git
          git -C "$legacy_root" fetch --depth=1 origin "$legacy_revision"
          git -C "$legacy_root" checkout --detach -q FETCH_HEAD
          test "$(git -C "$legacy_root" rev-parse --verify "$legacy_revision^{commit}")" = "$legacy_revision"
          test -z "$(git -C "$legacy_root" status --porcelain=v1 --untracked-files=all)"

      - name: Check legacy role Compose compatibility
        if: steps.scope.outputs.docs_only != 'true'
        env:
          NAS_INFRASTRUCTURE_DIR: ${{ github.workspace }}/../nas-infrastructure
        run: tests/mac/legacy-role-compose-test.sh

      - name: Check legacy seed playbook syntax
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          ansible-playbook -i inventory/mac.yml tests/mac/legacy-role-seed.yml --syntax-check
          ansible-playbook -i localhost, -c local tests/mac/legacy-beszel-key.yml --syntax-check

      - name: Check legacy parity rendering
        if: steps.scope.outputs.docs_only != 'true'
        run: tests/mac/adoption-render-test.sh

      - name: Check Immich probe status rendering
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          ansible_python="$(dirname "$(readlink -f "$(command -v ansible-playbook)")")/python"
          test -x "$ansible_python"
          PYTHONDONTWRITEBYTECODE=1 "$ansible_python" tests/immich_probe_status_test.py

      - name: Check generated credential redaction
        if: steps.scope.outputs.docs_only != 'true'
        run: tests/generate-secrets-redaction-test.sh

      - name: Check silent ephemeral vault generation
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          self_test_log=$(mktemp)
          trap 'rm -f "$self_test_log"' EXIT
          if ! tests/generate-ephemeral-vault.sh --self-test >"$self_test_log" 2>&1; then
            cat "$self_test_log" >&2
            exit 1
          fi
          test ! -s "$self_test_log"

      - name: Lint Ansible
        if: steps.scope.outputs.docs_only != 'true'
        run: ansible-lint --strict

      - name: Check playbook syntax
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          ansible-playbook -i inventory/local.yml site.yml --syntax-check
          ansible-playbook generate-secrets.yml --syntax-check

      - name: Converge synthetic legacy adoption
        if: steps.scope.outputs.docs_only != 'true'
        env:
          NAS_INFRASTRUCTURE_DIR: ${{ github.workspace }}/../nas-infrastructure
          ADOPTION_DIAGNOSTICS_DIR: ${{ runner.temp }}/nas-platform-adoption-diagnostics
        run: tests/adoption-integration.sh

      - name: Upload sanitized adoption diagnostics
        if: failure() && steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-adoption-diagnostics
          path: ${{ runner.temp }}/nas-platform-adoption-diagnostics/sanitized.txt
          if-no-files-found: ignore
          retention-days: 1

  foundation:
    needs: changes
    if: ${{ needs.changes.outputs.foundation == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run foundation integration suite
        run: tests/integration.sh --suite foundation site.yml

  smoke:
    needs: changes
    if: ${{ needs.changes.outputs.smoke == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run smoke integration suite
        env:
          SELECTED_TAGS: ${{ needs.changes.outputs.selected_tags }}
        run: |
          if [ -n "$SELECTED_TAGS" ]; then
            tests/integration.sh --suite smoke --tags "$SELECTED_TAGS" site.yml
          else
            tests/integration.sh --suite smoke site.yml
          fi

  beszel:
    needs: changes
    if: ${{ needs.changes.outputs.beszel == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Beszel integration suite
        run: tests/integration.sh --suite beszel site.yml

  dozzle:
    needs: changes
    if: ${{ needs.changes.outputs.dozzle == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Dozzle integration suite
        run: tests/integration.sh --suite dozzle site.yml

  audiobookshelf:
    needs: changes
    if: ${{ needs.changes.outputs.audiobookshelf == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Audiobookshelf integration suite
        run: tests/integration.sh --suite audiobookshelf site.yml

  media:
    needs: changes
    if: ${{ needs.changes.outputs.media == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run media integration suite
        run: tests/integration.sh --suite media site.yml

  paperless:
    needs: changes
    if: ${{ needs.changes.outputs.paperless == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Paperless integration suite
        run: tests/integration.sh --suite paperless site.yml

  idempotence_check:
    needs: changes
    if: ${{ needs.changes.outputs.idempotence_check == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run idempotence integration suite
        env:
          SELECTED_TAGS: ${{ needs.changes.outputs.selected_tags }}
        run: |
          if [ -n "$SELECTED_TAGS" ]; then
            tests/integration.sh --suite idempotence-check --tags "$SELECTED_TAGS" site.yml
          else
            tests/integration.sh --suite idempotence-check site.yml
          fi

  validate:
    name: validate
    if: ${{ always() }}
    needs:
      - changes
      - static
      - foundation
      - smoke
      - beszel
      - dozzle
      - audiobookshelf
      - media
      - paperless
      - idempotence_check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate job results
        run: |
          ruby tests/ci/validate_results.rb \
            changes="${{ needs.changes.result }}" \
            static="${{ needs.static.result }}" \
            foundation="${{ needs.foundation.result }}" \
            smoke="${{ needs.smoke.result }}" \
            beszel="${{ needs.beszel.result }}" \
            dozzle="${{ needs.dozzle.result }}" \
            audiobookshelf="${{ needs.audiobookshelf.result }}" \
            media="${{ needs.media.result }}" \
            paperless="${{ needs.paperless.result }}" \
            idempotence_check="${{ needs.idempotence_check.result }}"
