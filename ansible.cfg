[defaults]
# There is deliberately no `inventory` key. Every documented invocation passes
# -i, so a default only ever decided what a forgotten one does, and the value it
# used to hold was inventory/remote.yml: a bare `ansible-playbook site.yml`
# converged the live NAS over SSH. With no default, `hosts: platform_hosts`
# matches nothing, the play is skipped and the run ends on an empty PLAY RECAP
# without touching a host. Plays on `hosts: localhost` -- generate-secrets.yml
# and validate-vault.yml, both documented without -i -- still run, because the
# implicit localhost always matches.
#
# `[inventory] host_pattern_mismatch = error` would make that skip an outright
# refusal, and was measured to work, but ansible-lint loads every playbook with
# no inventory on purpose: under that setting `ansible-lint --strict` itself
# dies on `platform_hosts`, and this ansible-lint has no per-run env override.
roles_path = roles
library = library
module_utils = module_utils
filter_plugins = filter_plugins
stdout_callback = default
result_format = yaml
display_skipped_hosts = False
interpreter_python = auto_silent
forks = 1

# Top-level fact injection is removed in ansible-core 2.24. Disabled from the
# start so the plays are written against ansible_facts[...] rather than migrated
# later under a deadline.
inject_facts_as_vars = False

# Under `[ssh_connection]`, where this lived until now, it reached the ssh
# connection plugin and nothing else -- and this repository runs `connection:
# local` everywhere, in the integration container, on the NAS via
# inventory/local.yml and in every sandbox. The local plugin declares
# `has_pipelining = True` and takes the value from the `connection_pipelining`
# doc fragment, whose only ini sources are `[defaults]` and `[connection]`. So
# the setting was inert for every run but a workstation converge over SSH. Read
# from `[defaults]` the ssh plugin still honours it -- `[ssh_connection]` is the
# third and most specific of its three ini sources, not its only one -- so
# nothing about the remote path changes. Do not move it back.
#
# This is a correctness fix and not a performance one, which is worth saying
# because the shape invites the opposite reading. Pipelining removes the temp
# directory, module payload write and cleanup around each forked module; it does
# not remove the fork or the module's own imports. Measured on Linux against 120
# forked module tasks under the pinned ansible-core, 24.55s to 23.10s -- about 6%
# of forked-task time, which on the `idempotence-check` lane is inside the
# run-to-run range. The same benchmark on macOS reads 28%, because process spawn
# is expensive there; do not quote that number for CI.
#
# Safe here because nothing in this repository escalates -- the only `become`
# keys under roles/ are `become: false` -- and a prompting `become` is
# pipelining's one documented conflict.
pipelining = True
