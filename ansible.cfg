[defaults]
# There is deliberately no `inventory` key. Every documented invocation passes
# -i, so a default only ever decided what a forgotten one does, and the value it
# used to hold was inventory/remote.yml: a bare `ansible-playbook site.yml`
# converged the live NAS over SSH. With no default, `hosts: platform_hosts`
# matches nothing, the play is skipped and the run ends on an empty PLAY RECAP
# without touching a host. Plays on `hosts: localhost` -- generate-secrets.yml
# and validate-vault.yml, both documented without -i -- still run, because the
# implicit localhost always matches.
#
# `[inventory] host_pattern_mismatch = error` would make that skip an outright
# refusal, and was measured to work, but ansible-lint loads every playbook with
# no inventory on purpose: under that setting `ansible-lint --strict` itself
# dies on `platform_hosts`, and this ansible-lint has no per-run env override.
roles_path = roles
library = library
module_utils = module_utils
filter_plugins = filter_plugins
stdout_callback = default
result_format = yaml
display_skipped_hosts = False
interpreter_python = auto_silent
forks = 1

# Top-level fact injection is removed in ansible-core 2.24. Disabled from the
# start so the plays are written against ansible_facts[...] rather than migrated
# later under a deadline.
inject_facts_as_vars = False

[ssh_connection]
pipelining = True
